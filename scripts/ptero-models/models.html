<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ptero Flap character renderer</title></head><body style="margin:0;background:#223">
<script>
/* Ptero Flap characters: procedural signed-distance "clay" models (smooth-blended rounded
 * volumes), ray-marched in WebGL with soft shadows, ambient occlusion, wrap/sheen shading, a
 * moonlit key light and cool rim lights, then supersampled down into transparent sprite frames. */
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uPPU; uniform vec2 uCen; uniform float uYaw, uPitch;
uniform float uWing, uBend, uLid, uBonk;
out vec4 frag;
#define PI 3.14159265
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
float sdE(vec3 p, vec3 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }
float sdS(vec3 p, float r){ return length(p) - r; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdRC(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 ba = b - a; float l2 = dot(ba, ba), rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba), z = y - l2; vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv), y2 = y * y * l2, z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
float sdRCyl(vec3 p, float ra, float rb, float h){ vec2 d = vec2(length(p.xz) - 2.0 * ra + rb, abs(p.y) - h); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rb; }
vec3 rotX(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(v.x, c * v.y - s * v.z, s * v.y + c * v.z); }
vec3 rotZ(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(c * v.x - s * v.y, s * v.x + c * v.y, v.z); }
float tri(float x){ return abs(fract(x) - 0.5) * 2.0; }
float sdSeg2(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }

// material ids
const float M_BODY = 1., M_CREST = 2., M_BEAK = 3., M_FOOT = 4., M_EYE = 5., M_LID = 6., M_MEMB = 8., M_BONE = 9.;
float gM; vec3 gEye; float gSide;
void U(inout float d, float d2, float m, float k){ if (d2 < d) gM = m; d = k > 0.0 ? smin(d, d2, k) : min(d, d2); }

/* ---------------- the flyer ----------------
 * A chibi night flyer: a big round head on a small pear body, a short butter-yellow beak, a plum
 * half-moon crest, wide-open round eyes, broad scalloped plum wings and a stubby tail. Faces +x. */
const vec3 HC = vec3(0.62, 0.5, 0.0);
float wingD(vec3 p, float side, out float wm){
  vec3 q = p - vec3(0.0, 0.28, side * 0.42); q.z *= side;
  if (length(q) > 3.8) { wm = M_MEMB; return length(q) - 3.5; }
  q = rotX(q, uWing);
  if (q.z > 1.3) { q -= vec3(0.0, 0.0, 1.3); q = rotX(q, uBend); q += vec3(0.0, 0.0, 1.3); }
  q.z /= 1.15;
  q.y -= 0.12 * sin(clamp(q.z / 2.6, 0.0, 1.0) * PI);
  vec2 w = vec2(q.x, q.z);
  vec2 P[8]; P[0] = vec2(0.3, 0.0); P[1] = vec2(0.36, 0.75); P[2] = vec2(0.24, 1.35); P[3] = vec2(-0.32, 2.6);
  P[4] = vec2(-0.72, 2.06); P[5] = vec2(-0.92, 1.36); P[6] = vec2(-0.86, 0.66); P[7] = vec2(-0.55, 0.0);
  float dd = 1e3, s = 1.0;
  for (int i = 0, j = 7; i < 8; j = i, i++) {
    vec2 e = P[j] - P[i], v = w - P[i], b = v - e * clamp(dot(v, e) / dot(e, e), 0.0, 1.0);
    dd = min(dd, dot(b, b));
    bvec3 c = bvec3(w.y >= P[i].y, w.y < P[j].y, e.x * v.y > e.y * v.x);
    if (all(c) || all(not(c))) s *= -1.0;
  }
  float d2 = s * sqrt(dd);
  // round scallops between the finger tips
  d2 = max(d2, -(length(w - vec2(-0.78, 2.48)) - 0.3));
  d2 = max(d2, -(length(w - vec2(-1.08, 1.74)) - 0.3));
  d2 = max(d2, -(length(w - vec2(-1.1, 1.0)) - 0.27));
  d2 = max(d2, -(length(w - vec2(-0.92, 0.3)) - 0.22));
  float y = q.y + 0.08 * smoothstep(0.0, 0.5, -d2);
  vec2 t = vec2(d2, abs(y) - 0.02);
  float dm = (min(max(t.x, t.y), 0.0) + length(max(t, 0.0)) - 0.014) * 0.85;
  wm = M_MEMB;
  vec3 S0 = vec3(0.3, 0.0, 0.0), E = vec3(0.36, 0.0, 0.75), Wr = vec3(0.24, 0.0, 1.35), T = vec3(-0.32, 0.0, 2.6);
  float arm = min(sdRC(q, S0, E, 0.14, 0.1), sdRC(q, E, Wr, 0.1, 0.08));
  arm = min(arm, sdRC(q, Wr, T, 0.075, 0.03));
  float rid = min(sdRC(q, Wr, vec3(-0.72, 0.0, 2.06), 0.045, 0.02), sdRC(q, Wr, vec3(-0.92, 0.0, 1.36), 0.04, 0.02));
  rid = min(rid, sdRC(q, E, vec3(-0.86, 0.0, 0.66), 0.035, 0.018));
  float claw = sdRC(q, Wr + vec3(0.04, 0.02, 0.0), Wr + vec3(0.26, 0.06, -0.06), 0.055, 0.015);
  float d = dm;
  if (rid < d) wm = M_BONE; d = smin(d, rid, 0.05);
  if (arm < d) wm = M_BODY; d = smin(d, arm, 0.06);
  if (claw < d) wm = M_BEAK; d = min(d, claw);
  return d;
}
float flyer(vec3 p){
  gM = M_BODY;
  vec3 bq = abs(p - vec3(0.35, 0.55, 0.0)) - vec3(2.1, 1.5, 1.0);
  float d = length(max(bq, 0.0)) + 0.05;
  if (d < 0.3) {
    d = sdE(p - vec3(-0.18, -0.05, 0.0), vec3(0.72, 0.58, 0.56));
    U(d, sdE(p - vec3(0.02, -0.18, 0.0), vec3(0.58, 0.48, 0.5)), M_BODY, 0.25);
    U(d, sdE(p - HC, vec3(0.6, 0.55, 0.56)), M_BODY, 0.3);
    // short butter-yellow beak, a touch upturned; it drops open when bonked
    float bo = uBonk * 0.14;
    U(d, sdRC(p, HC + vec3(0.42, -0.04, 0.0), HC + vec3(1.42, -0.16, 0.0), 0.2, 0.035), M_BEAK, 0.1);
    U(d, sdRC(p, HC + vec3(0.38, -0.2, 0.0), HC + vec3(1.12, -0.3 - bo, 0.0), 0.14, 0.03), M_BEAK, 0.06);
    // a plum half-moon crest sweeping up and back
    vec3 qc = p; qc.z *= 2.6;
    U(d, sdRC(qc, HC + vec3(-0.05, 0.4, 0.0), HC + vec3(-1.0, 0.8, 0.0), 0.22, 0.07) / 2.6, M_CREST, 0.12);
    // stubby tail ending in a little plum leaf
    U(d, sdRC(p, vec3(-0.75, 0.0, 0.0), vec3(-1.25, -0.02, 0.0), 0.17, 0.05), M_BODY, 0.16);
    vec3 qt = rotZ(p - vec3(-1.36, -0.02, 0.0), 0.0); qt.z *= 3.0;
    U(d, sdE(qt, vec3(0.16, 0.12, 0.12)) / 3.0, M_CREST, 0.04);
    // tiny tucked feet
    U(d, sdE(p - vec3(-0.12, -0.6, 0.2), vec3(0.16, 0.08, 0.1)), M_FOOT, 0.07);
    U(d, sdE(p - vec3(0.06, -0.6, -0.2), vec3(0.16, 0.08, 0.1)), M_FOOT, 0.07);
    // big round wide-open eyes; the lid only drops for a blink
    for (int i = 0; i < 2; i++) {
      float sd = i == 0 ? 1.0 : -1.0;
      vec3 ec = HC + vec3(0.3, 0.14, sd * 0.36);
      float eb = sdS(p - ec, 0.24);
      if (eb < d) { gM = M_EYE; gEye = ec; gSide = sd; } d = min(d, eb);
      vec3 nl = normalize(vec3(-0.1, 1.0, sd * 0.1));
      float lid = max(sdS(p - ec, 0.258), -(dot(p - ec, nl) - uLid));
      if (lid < d) { gM = M_LID; gEye = ec; gSide = sd; } d = smin(d, lid, 0.012);
    }
  }
  float wm, w1 = wingD(p, 1.0, wm);
  if (w1 < d) gM = wm; d = min(d, w1);
  float w2 = wingD(p, -1.0, wm);
  if (w2 < d) gM = wm; d = min(d, w2);
  return d;
}
float map(vec3 p){ return flyer(p); }
vec3 nrm(vec3 p){
  const vec2 k = vec2(1, -1); float h = 0.004;
  float m = gM; vec3 e = gEye; float s = gSide;
  vec3 n = normalize(k.xyy * map(p + k.xyy * h) + k.yyx * map(p + k.yyx * h) + k.yxy * map(p + k.yxy * h) + k.xxx * map(p + k.xxx * h));
  gM = m; gEye = e; gSide = s; return n;
}
float shadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.03;
  for (int i = 0; i < 40; i++) { float h = map(ro + rd * t); res = min(res, 10.0 * h / t); t += clamp(h, 0.02, 0.25); if (res < 0.01 || t > 6.0) break; }
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n){
  float o = 0.0, s = 1.0;
  for (int i = 1; i <= 5; i++) { float h = 0.04 + 0.11 * float(i); o += (h - map(p + n * h)) * s; s *= 0.7; }
  return clamp(1.0 - 1.6 * o, 0.0, 1.0);
}
vec3 srgb2lin(vec3 c){ return pow(c, vec3(2.2)); }
vec3 hex(float r, float g, float b){ return srgb2lin(vec3(r, g, b) / 255.0); }
void main(){
  vec2 px = (gl_FragCoord.xy - 0.5 * uRes) / uPPU + uCen;
  float cy = cos(uYaw), sy = sin(uYaw), cp = cos(uPitch), sp = sin(uPitch);
  vec3 fw = -vec3(sy * cp, sp, cy * cp);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0))), up = cross(rt, fw);
  vec3 ro = rt * px.x + up * px.y - fw * 12.0, rd = fw;
  float t = 0.0, d = 1.0; bool hit = false;
  for (int i = 0; i < 160; i++) { d = map(ro + rd * t); if (d < 0.0012) { hit = true; break; } t += d * 0.9; if (t > 24.0) break; }
  if (!hit) { frag = vec4(0); return; }
  vec3 p = ro + rd * t; map(p); float m = gM; vec3 ec = gEye; float side = gSide;
  vec3 n = nrm(p), v = -rd;
  if (dot(n, v) < 0.0 && (m == M_MEMB || m == M_BONE)) n = -n;
  vec3 base; float spec = 0.2, gloss = 22.0, sheen = 0.3;
  vec3 coral = hex(255., 146., 104.), cream = hex(255., 224., 190.), plum = hex(150., 74., 158.);
  if (m == M_BODY) {
    base = coral;
    // cream belly, chin and cheeks
    vec3 hq = p - HC;
    if (p.y < -0.12 + 0.12 * p.x && p.x > -0.75) base = cream;
    if (hq.y < -0.12 && hq.x > 0.05 && length(hq) < 0.62) base = cream;
    // pink blush under each eye
    if (length(hq - vec3(0.36, -0.12, sign(hq.z) * 0.44)) < 0.12) base = hex(255., 120., 150.);
    // three darker spots along the back
    for (int i = 0; i < 3; i++) { vec3 c = vec3(-0.15 - float(i) * 0.3, 0.5 - float(i) * 0.06, 0.0); if (length((p - c) * vec3(1.0, 1.0, 0.7)) < 0.15 - float(i) * 0.02) base = hex(214., 94., 76.); }
  } else if (m == M_CREST) { base = plum; spec = 0.3; }
  else if (m == M_BEAK) { base = hex(255., 204., 92.); float tip = smoothstep(HC.x + 1.0, HC.x + 1.4, p.x); base = mix(base, hex(236., 140., 60.), tip); spec = 0.4; gloss = 40.0; }
  else if (m == M_FOOT) base = hex(255., 196., 92.);
  else if (m == M_MEMB) {
    base = plum; sheen = 0.12;
    vec3 q = p - vec3(0.0, 0.28, 0.0); float zz = abs(q.z) - 0.42;
    float rr = length(vec2(q.x - 0.24, zz - 1.35));
    if (abs(fract(rr * 3.2) - 0.5) < 0.05 && rr > 0.4) base = hex(124., 58., 136.);
  }
  else if (m == M_BONE) base = hex(196., 108., 186.);
  else if (m == M_LID) base = coral;
  else base = hex(252., 252., 255.);
  if (m == M_EYE) {
    vec3 e = normalize(p - ec);
    vec3 look = normalize(vec3(0.72, -0.05 + uBonk * (side > 0.0 ? 0.6 : -0.4), side * 0.69));
    float c = dot(e, look);
    if (c > 0.68) base = hex(36., 22., 52.);
    if (c > 0.68 && c < 0.76) base = hex(96., 56., 140.);
    // two catch-lights
    vec3 h1 = normalize(look + vec3(-0.25, 0.32, 0.0)), h2 = normalize(look + vec3(0.18, -0.18, 0.0));
    if (c > 0.68 && dot(e, h1) > 0.985) base = vec3(1.0);
    if (c > 0.68 && dot(e, h2) > 0.996) base = vec3(0.9);
    if (uBonk > 0.5) {
      vec3 tx = normalize(cross(look, vec3(0, 1, 0))), ty = cross(tx, look);
      vec2 q = vec2(dot(e, tx), dot(e, ty)); float r = length(q), an = atan(q.y, q.x);
      base = hex(252., 252., 255.);
      if (r < 0.7 && fract(r * 7.0 - an / (2.0 * PI) * side) < 0.42) base = hex(36., 22., 52.);
    }
    spec = 0.9; gloss = 120.0; sheen = 0.0;
  }
  if (m == M_LID) {
    vec3 nl = normalize(vec3(-0.1, 1.0, side * 0.1));
    if (dot(p - ec, nl) - uLid < 0.02) base = hex(60., 30., 50.);
  }
  vec3 Lk = normalize(vec3(-0.55, 0.8, 0.55));
  vec3 Lr = normalize(vec3(-0.6, 0.35, -0.75)), Lr2 = normalize(vec3(0.75, 0.25, -0.6));
  float sh = shadow(p + n * 0.01, Lk), occ = ao(p, n);
  float wrapk = (dot(n, Lk) + 0.35) / 1.35;
  float dif = clamp(wrapk, 0.0, 1.0) * mix(0.55, 1.0, sh);
  vec3 col = vec3(0);
  vec3 moon = vec3(1.0, 0.97, 1.04) * 1.6;
  col += base * moon * dif;
  col += base * base * vec3(1.0, 0.7, 0.75) * 0.4 * clamp(1.0 - abs(dot(n, Lk)), 0.0, 1.0) * sh;
  vec3 sky = vec3(0.42, 0.5, 0.95), grd = vec3(0.16, 0.12, 0.3);
  col += base * mix(grd, sky, 0.5 + 0.5 * n.y) * 0.8 * occ;
  float fr = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 3.0);
  col += vec3(0.55, 0.7, 1.0) * fr * clamp(dot(n, Lr) + 0.5, 0.0, 1.0) * 1.3 * occ;
  col += vec3(0.4, 0.5, 0.9) * fr * clamp(dot(n, Lr2) + 0.3, 0.0, 1.0) * 0.6 * occ;
  col += base * sheen * fr * 0.9;
  vec3 hh = normalize(Lk + v);
  col += moon * spec * pow(clamp(dot(n, hh), 0.0, 1.0), gloss) * sh * (gloss / 60.0 + 0.4) * 0.5;
  if (m == M_MEMB || m == M_BONE) {
    float tr = clamp(dot(-n, Lk), 0.0, 1.0) * 0.8 + clamp(dot(-n, Lr), 0.0, 1.0) * 0.5;
    col += base * vec3(1.0, 0.75, 0.9) * tr * 1.1;
  }
  col *= mix(0.55, 1.0, occ);
  col = col / (1.0 + col * 0.18);
  col = pow(col, vec3(1.0 / 2.2));
  float a = m == M_MEMB ? 0.9 : 1.0;
  frag = vec4(col * a, a);
}`;
const VS = `#version 300 es
in vec2 pos; void main(){ gl_Position = vec4(pos, 0, 1); }`;
let gl, prog, glc;
function init(){
  glc = document.createElement('canvas');
  gl = glc.getContext('webgl2', { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false, alpha: true });
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const l = gl.getAttribLocation(prog, 'pos'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
}
// render one view: w,h in output px, ppu px per unit, cen model-space view centre (in camera plane units)
function render(o){
  const SS = o.ss || 3, W = o.w * SS, H = o.h * SS;
  glc.width = W; glc.height = H; gl.viewport(0, 0, W, H);
  const U = (n) => gl.getUniformLocation(prog, n);
  gl.uniform2f(U('uRes'), W, H); gl.uniform1f(U('uPPU'), o.ppu * SS); gl.uniform2f(U('uCen'), o.cx, o.cy);
  gl.uniform1f(U('uYaw'), o.yaw); gl.uniform1f(U('uPitch'), o.pitch);
  gl.uniform1f(U('uWing'), o.wing || 0); gl.uniform1f(U('uBend'), o.bend || 0);
  gl.uniform1f(U('uLid'), o.lid == null ? 0.3 : o.lid); gl.uniform1f(U('uBonk'), o.bonk || 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST);
  for (let y = 0; y < H; y += 48) { gl.scissor(0, y, W, 48); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish(); }
  gl.disable(gl.SCISSOR_TEST);
  // supersample down in two halvings for clean edges
  const out = document.createElement('canvas'); out.width = o.w; out.height = o.h;
  const g = out.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(glc, 0, 0, o.w, o.h);
  return out;
}
// project a model point to output pixel coords for a view (same camera maths as the shader)
function project(o, P){
  const cy = Math.cos(o.yaw), sy = Math.sin(o.yaw), cp = Math.cos(o.pitch), sp = Math.sin(o.pitch);
  const fw = [-sy * cp, -sp, -cy * cp];
  let rt = [fw[1] * 0 - fw[2] * 1, fw[2] * 0 - fw[0] * 0, fw[0] * 1 - fw[1] * 0]; const L = Math.hypot(...rt); rt = rt.map(v => v / L);
  const up = [rt[1] * fw[2] - rt[2] * fw[1], rt[2] * fw[0] - rt[0] * fw[2], rt[0] * fw[1] - rt[1] * fw[0]];
  const X = P[0] * rt[0] + P[1] * rt[1] + P[2] * rt[2], Y = P[0] * up[0] + P[1] * up[1] + P[2] * up[2];
  return [(X - o.cx) * o.ppu + o.w / 2, o.h / 2 - (Y - o.cy) * o.ppu];
}
window.R = { init, render, project };
</script></body></html>
