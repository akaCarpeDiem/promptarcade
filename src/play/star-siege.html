<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
"use strict";
// A colour-swarm shooter in low orbit, in real 3D. The rules are the original flat game laid on the deck
// plane (x across, z toward the cannon): a honeycomb swarm glides and sinks, your laser carries a colour,
// a hit on a different colour paints the alien yours, and a hit on a match chain-pops every touching alien
// of that colour. Added: divers that peel off and swoop, an overload beam you sweep across the swarm to
// paint whole columns, power capsules from big clusters, and a hive queen every fourth wave who can only
// be hurt by a matching hit or a cluster popped right beside her.
const PA = window.PA;
const TAU = Math.PI * 2;
const { clamp, lerp, rand } = PA;

/* ---------------- arena ---------------- */
const LEFT = -10, RIGHT = 10, CANNON_Z = 9.2, TOP_Z = -18.5;
// the swarm is a honeycomb: odd rows sit half a cell over, so each alien touches up to six others
const ROWS = 6, COLS = 9, DX = 1.86, DZ = 1.62, AHW = 0.72, AHD = 0.55, AY = 1.15;
const ALIEN_SCORE = [35, 25, 25, 20, 15];
const SHIELD_COUNT = 3, SHIELD_Z = 5.4, CELL = 0.23, SR = 6;
const BULLET_V = 24, PLAYER_V = 15, PHW = 1.0;
const OVER_MAX = 30, BEAM_T = 1.1, BEAM_HW = 1.25;
// The twist: your laser carries a colour. A hit on a different colour paints that alien yours;
// a hit on a matching one detonates every touching alien of that colour in a chain.
const PAINT = [0xff4fa3, 0x3fe3ff, 0xffcf4a, 0x5dff9a];
const PAINT_CSS = ["#ff4fa3", "#3fe3ff", "#ffcf4a", "#5dff9a"];
const PAINT_NAME = ["Pink", "Cyan", "Gold", "Green"];
const CAPS = {
  spread: { l: "S", c: 0x8ee9ff, name: "Spread", dur: 10 },
  rapid: { l: "R", c: 0xffd27a, name: "Rapid", dur: 8 },
  bubble: { l: "B", c: 0xc4a6ff, name: "Bubble", dur: 0 }
};
/* ---------------- renderer + post ---------------- */
const mount = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1);
renderer.setPixelRatio(dprCap());
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
mount.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040d);
scene.fog = new THREE.FogExp2(0x070516, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 500);
const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

function makePost() {
  const ext = renderer.extensions;
  const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
  const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const main = new THREE.WebGLRenderTarget(1, 1, { type, samples: hdrOk && !fullFloat ? 0 : PA.isTouch ? 2 : 4 });
  const LV = 5, lv = [], tmp = [];
  for (let i = 0; i < LV; i++) {
    lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
    tmp.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
  }
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  const pscene = new THREE.Scene();
  pscene.add(quad);
  const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
  const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
  const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
  const bright = mk([
    "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
    "void main(){", box4,
    "  float l = max(c.r, max(c.g, c.b));",
    "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
    "  soft = soft * soft / (4.0 * knee + 1e-4);",
    "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(30.0)), 1.0);",
    "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 0.95 : 0.7 } });
  const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
    { tex: { value: null }, px: { value: new THREE.Vector2() } });
  const blur = mk([
    "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
    "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
    "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
  const comp = mk([
    "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time, hurt, chroma; varying vec2 vUv;",
    "void main(){",
    "  vec2 q = vUv - 0.5;",
    "  vec3 c;",
    "  c.r = texture2D(tScene, vUv + q * chroma * 0.012).r;",
    "  c.g = texture2D(tScene, vUv).g;",
    "  c.b = texture2D(tScene, vUv - q * chroma * 0.012).b;",
    "  vec3 b = texture2D(b0, vUv).rgb * 0.5 + texture2D(b1, vUv).rgb * 0.6 + texture2D(b2, vUv).rgb * 0.75 + texture2D(b3, vUv).rgb * 0.85 + texture2D(b4, vUv).rgb * 0.95;",
    "  c += b * strength;",
    "  float vig = dot(q, q);",
    "  c *= 1.0 - vig * 0.85;",
    "  c += vec3(1.0, 0.2, 0.45) * hurt * smoothstep(0.08, 0.4, vig);",
    "  gl_FragColor = vec4(c, 1.0);",
    "  #include <tonemapping_fragment>",
    "  #include <colorspace_fragment>",
    "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
    "  gl_FragColor.rgb += (n - 0.5) * grain;",
    "}"].join("\n"), {
    tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
    b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.5 }, grain: { value: 0.02 }, time: { value: 0 }, hurt: { value: 0 }, chroma: { value: 0.1 }
  });
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };
  return {
    comp,
    setSize(w, h) {
      main.setSize(w, h);
      for (let i = 0; i < LV; i++) {
        const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
        lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
      }
    },
    render(sc, cm, t) {
      renderer.setRenderTarget(main);
      renderer.render(sc, cm);
      bright.uniforms.tex.value = main.texture;
      bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
      pass(bright, lv[0]);
      for (let i = 0; i < LV; i++) {
        if (i) {
          down.uniforms.tex.value = lv[i - 1].texture;
          down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
          pass(down, lv[i]);
        }
        blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
        pass(blur, tmp[i]);
        blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
        pass(blur, lv[i]);
      }
      comp.uniforms.time.value = t;
      pass(comp, null);
    }
  };
}
const post = makePost();
scene.background = new THREE.Color(0x02030a);
scene.fog = null;
camera.far = 2400;
renderer.toneMappingExposure = 1.05;
post.comp.uniforms.strength.value = 0.6;

let W = innerWidth, H = innerHeight;
const overlay = PA.canvas(document.getElementById("fx"), { onResize: (o) => { W = o.w; H = o.h; } });
const ctx = overlay.ctx;
const texts = new PA.Texts();
const bufSize = new THREE.Vector2();
const tmpV = new THREE.Vector3();
let camDist = 30, camElev = 0.95;
const camLook = new THREE.Vector3(0, 0, -3.2);
function placeCamera(d, ox) {
  camera.position.set(ox || 0, Math.sin(camElev) * d, camLook.z + Math.cos(camElev) * d);
  camera.lookAt(camLook.x + (ox || 0) * 0.5, 0, camLook.z);
}
function fitCamera() {
  // Steeper and further back on tall screens, so the whole field always fits.
  const a = camera.aspect;
  camElev = a < 0.75 ? 1.22 : a < 1.1 ? 1.08 : 0.94;
  camLook.z = a < 0.75 ? -3.6 : -3.2;
  const pts = [[LEFT - 0.7, TOP_Z + 1.5], [RIGHT + 0.7, TOP_Z + 1.5], [LEFT - 0.7, CANNON_Z + 1.6], [RIGHT + 0.7, CANNON_Z + 1.6]];
  let d = 12;
  for (; d < 160; d += 0.5) {
    placeCamera(d); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let ok = true;
    for (const [x, z] of pts) {
      tmpV.set(x, 1, z).project(camera);
      if (Math.abs(tmpV.x) > 0.98 || tmpV.y > (a < 0.75 ? 0.72 : 0.8) || tmpV.y < -0.92) { ok = false; break; }
    }
    if (ok) break;
  }
  camDist = d;
}
function resize() {
  renderer.setPixelRatio(dprCap());
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(bufSize);
  post.setSize(bufSize.x, bufSize.y);
  fitCamera();
  pointsMat.uniforms.scale.value = moteMat.uniforms.scale.value = bufSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
function toScreen(x, y, z) {
  tmpV.set(x, y, z).project(camera);
  return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
}
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), deckPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function pointerToDeck(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.intersectPlane(deckPlane, tmpV) ? tmpV.x : null;
}

function canvasTex(w, h, paint, o) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  paint(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = o && o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (o && o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.2, "rgba(255,255,255,.5)"); gr.addColorStop(.55, "rgba(255,255,255,.1)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
function glowSprite(color, scale) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(scale);
  return s;
}

/* ---------------- the world below: a planet turning under the fight ---------------- */
{
  const env = canvasTex(512, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, "#0b0c26"); gr.addColorStop(0.45, "#2a2a6a"); gr.addColorStop(0.55, "#10183a"); gr.addColorStop(1, "#04060e");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = "#ffe6c0"; g.fillRect(40, 30, 70, 14);
    g.fillStyle = "#8ee9ff"; g.fillRect(300, 50, 90, 8);
    g.fillStyle = "#ff8ac8"; g.fillRect(180, 60, 50, 6);
  });
  env.mapping = THREE.EquirectangularReflectionMapping;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(env).texture;
  env.dispose(); pm.dispose();
}
const NOISE = `
  float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fb(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * n3(p); p = p * 2.03 + 1.7; a *= 0.5; } return s; }`;
const planetMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, sun: { value: new THREE.Vector3(-1, 0.06, -0.35).normalize() } },
  vertexShader: `varying vec3 vObj; varying vec3 vN; varying vec3 vW;
    void main(){ vObj = normalize(position); vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float time; uniform vec3 sun; varying vec3 vObj; varying vec3 vN; varying vec3 vW;
    ${NOISE}
    void main(){
      vec3 p = vObj * 7.0;
      float land = fb(p + fb(p * 1.7) * 0.6);
      float cont = smoothstep(0.5, 0.56, land);
      float d = dot(normalize(vN), sun);
      float day = smoothstep(-0.14, 0.2, d);
      vec3 ocean = mix(vec3(0.004, 0.02, 0.06), vec3(0.02, 0.09, 0.2), smoothstep(0.3, 0.5, land));
      vec3 ground = mix(vec3(0.05, 0.07, 0.035), vec3(0.11, 0.09, 0.06), n3(p * 6.0));
      vec3 col = mix(ocean, ground, cont) * (0.12 + day * 1.1);
      // city lights on the night side
      float city = smoothstep(0.78, 0.95, n3(vObj * 1100.0)) * smoothstep(0.45, 0.75, n3(vObj * 140.0)) * cont;
      col += vec3(1.0, 0.62, 0.3) * city * (1.0 - day) * 1.6;
      // two drifting cloud decks
      float cl = smoothstep(0.52, 0.78, fb(vObj * 16.0 + vec3(time * 0.004, 0.0, time * 0.002)));
      col = mix(col, vec3(0.75, 0.8, 0.9) * (0.04 + day * 0.85), cl * 0.75);
      // the terminator glows warm, the limb glows blue
      col += vec3(1.0, 0.45, 0.2) * exp(-pow(d * 9.0, 2.0)) * 0.12;
      vec3 V = normalize(cameraPosition - vW);
      float rim = pow(1.0 - max(dot(normalize(vN), V), 0.0), 3.0);
      col += vec3(0.25, 0.5, 1.0) * rim * (0.2 + day);
      gl_FragColor = vec4(col * 0.42, 1.0);
    }`
});
const planet = new THREE.Mesh(new THREE.SphereGeometry(420, 96, 64), planetMat);
planet.position.set(0, -505, -60);
scene.add(planet);
// dust drifting between the deck and the planet gives the drop its depth
const moteMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 }, scale: { value: 600 } },
  vertexShader: `uniform float time, scale; attribute float seed; varying float vA;
    void main(){ vec3 p = position; p.z = mod(p.z + time * (0.6 + seed * 1.4) + 40.0, 80.0) - 50.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); vA = 0.3 + 0.7 * (0.5 + 0.5 * sin(time * 1.3 + seed * 40.0));
      gl_PointSize = max(1.0, (0.05 + seed * 0.1) * scale / -mv.z); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: "varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); gl_FragColor = vec4(vec3(0.55, 0.7, 1.0) * vA * smoothstep(0.5, 0.0, d), 1.0); }"
});
{
  const N = 700, pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos.set([rand(-40, 40), rand(-45, -2), rand(-50, 30)], i * 3); seed[i] = Math.random(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("seed", new THREE.BufferAttribute(seed, 1));
  const m = new THREE.Points(g, moteMat); m.frustumCulled = false;
  scene.add(m);
}

/* ---------------- the deck: a hex grid of light with rails down each side ---------------- */
const deckMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 }, px: { value: 0 }, beam: { value: 0 }, beamX: { value: 0 }, beamC: { value: new THREE.Color() }, hurt: { value: 0 } },
  vertexShader: "varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
  fragmentShader: `uniform float time, px, beam, beamX, hurt; uniform vec3 beamC; varying vec3 vW;
    float hexD(vec2 p){ const vec2 s = vec2(1.0, 1.7320508); vec4 hc = floor(vec4(p, p - vec2(0.5, 1.0)) / s.xyxy) + 0.5;
      vec4 h = vec4(p - hc.xy * s, p - (hc.zw + 0.5) * s); vec2 q = dot(h.xy, h.xy) < dot(h.zw, h.zw) ? h.xy : h.zw; q = abs(q);
      return max(dot(q, s * 0.5), q.x); }
    void main(){
      vec2 p = vW.xz / 1.1;
      float e = hexD(p);
      float line = smoothstep(0.45, 0.5, e);
      float fadeX = smoothstep(11.5, 9.0, abs(vW.x));

  gunGlow.color.copy(gc).multiplyScalar(3 + (swapT > 0 ? swapT * 12 : 0));
  gem.rotation.set(t * 1.3, t * 2, 0);
  gem.scale.setScalar(1 + (swapT > 0 ? swapT * 2 : 0));
  for (let i = 0; i < 4; i++) {
    const g = gemSlots[i], a = i / 4 * TAU + t * 0.6;
    g.visible = i < colours;
    g.position.set(Math.cos(a) * 0.55, 0.95, Math.sin(a) * 0.45);
    g.material.color.copy(PAINT_C[i]).multiplyScalar(i === gun ? 4 : 0.6);
    g.scale.setScalar(i === gun ? 1.6 : 1);
  }
  bubble.visible = bubbleOn;
  bubbleMat.uniforms.k.value = 0.8 + Math.sin(t * 5) * 0.2;
  cannonL.intensity = cannon.visible ? 14 : 0;
  cannonL.color.copy(gc);
  cannonL.position.set(player.vis, 1.6, CANNON_Z - 0.6);
  muzzle.visible = muzzleT > 0 && cannon.visible;
  if (muzzle.visible) { muzzle.position.set(player.vis, 0.8, CANNON_Z - 1.3); muzzle.material.color.copy(gc).multiplyScalar(2.5); }

  // trails: player bolts, the beam, the comet tail, a faint aim line
  tv = 0;
  let li = 0;
  for (const b of pBullets) {
    const c = PAINT_C[b.paint];
    ribbon([b.x - b.vx * 0.05, AY, b.z - b.vz * 0.05, b.x, AY, b.z], [c.r * 5, c.g * 5, c.b * 5], 0.14, false);
    ribbon([b.x - b.vx * 0.04, AY, b.z - b.vz * 0.04, b.x, AY, b.z], [4, 4, 4], 0.05, false);
    if (li < 2) { boltL[li].position.set(b.x, AY + 0.4, b.z); boltL[li].color.copy(c); boltL[li].intensity = 8; li++; }
  }
  for (; li < 2; li++) boltL[li].intensity = 0;
  if (beamT > 0 && playing) {
    const c = PAINT_C[beamPaint], k = Math.min(1, beamT / 0.25) * (0.85 + Math.sin(t * 40) * 0.15);
    const pts = [beamX, AY, CANNON_Z - 1.2, beamX, AY, (CANNON_Z + TOP_Z) / 2, beamX, AY, TOP_Z];
    ribbon(pts, [c.r * 1.5 * k, c.g * 1.5 * k, c.b * 1.5 * k], BEAM_HW, false);
    ribbon(pts, [c.r * 2 + 1.5 * k, c.g * 2 + 1.5 * k, c.b * 2 + 1.5 * k], 0.2, false);
    beamL.position.set(beamX, AY + 1, 0); beamL.color.copy(c); beamL.intensity = 20 * k;
    if (Math.random() < 0.8) burst(beamX + rand(-BEAM_HW, BEAM_HW), rand(TOP_Z, CANNON_Z - 1), { n: 2, colors: [PAINT[beamPaint], 0xffffff], speed: 2, life: 0.4, size: 0.12, y: AY, up: 2, g: 0 });
  } else beamL.intensity = 0;
  if (aimTarget && playing) {
    const z1 = slotZ(aimTarget) + AHD;
    ribbon([player.vis, AY, CANNON_Z - 1.3, player.vis, AY, z1], [gc.r * 0.35, gc.g * 0.35, gc.b * 0.35], 0.03, false);
  }
  cometG.visible = !!comet;
  cometL.intensity = comet ? 18 : 0;
  if (comet) {
    cometG.position.set(comet.x, comet.y, comet.z);
    cometG.userData.rock.rotation.set(t * 2, t * 1.3, 0);
    cometL.position.set(comet.x, comet.y + 0.5, comet.z);
    comet.trail.push(comet.x, comet.y, comet.z);
    if (comet.trail.length > 3 * 28) comet.trail.splice(0, 3);
    ribbon(comet.trail, [1.6, 1.4, 0.9], 0.55);
    ribbon(comet.trail, [0.5, 1.2, 2.2], 0.9);
  }
  tGeo.setDrawRange(0, tv);
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true;

  // enemy shots
  let ei = 0;
  for (const b of eBullets) {
    m4b.compose(vb.set(b.x, AY, b.z), qb.identity(), sb.setScalar(1 + Math.sin(t * 30 + ei) * 0.15));
    eShotMesh.setMatrixAt(ei, m4b);
    m4b.compose(vb.set(b.x, AY - 0.3, b.z), qb.identity(), sb.setScalar(1));
    eGlowMesh.setMatrixAt(ei, m4b);
    ei++;
  }
  eShotMesh.count = eGlowMesh.count = ei;
  eShotMesh.instanceMatrix.needsUpdate = true; eGlowMesh.instanceMatrix.needsUpdate = true;
  // capsules
  for (let i = 0; i < capPool.length; i++) {
    const p = capPool[i], c = caps[i];
    p.g.visible = !!c && playing;
    if (!c) continue;
    const col = CAPS[c.type].c;
    p.g.position.set(c.x, AY + Math.sin(t * 4 + i) * 0.12, c.z);
    p.shell.rotation.x = t * 3;
    p.shell.material.color.setHex(col); p.shell.material.emissive.setHex(col);
    p.lab.material.map = letterTex[c.type];
    p.gl.material.color.setHex(col);
  }
  // lights from pops fade out
  for (let i = 0; i < 2; i++) { popLs[i] = Math.max(0, popLs[i] - dtR * 2.5); popL[i].intensity = popLs[i] * 30; }
  for (const r of ripples) { const k = r.t / 0.7; r.m.scale.setScalar(0.3 + PA.ease.outCubic(k) * r.size); r.m.material.opacity = 1 - k; }

  deckMat.uniforms.time.value = t;
  deckMat.uniforms.px.value = player.vis;
  deckMat.uniforms.beam.value = beamT > 0 && playing ? Math.min(1, beamT / 0.25) : 0;
  deckMat.uniforms.beamX.value = beamX;
  deckMat.uniforms.beamC.value.copy(PAINT_C[beamPaint]);
  deckMat.uniforms.hurt.value = hurt;
  post.comp.uniforms.hurt.value = hurt * 0.5;
  post.comp.uniforms.chroma.value = 0.1 + hurt * 2 + (beamT > 0 ? 0.25 : 0);
  post.render(scene, camera, t);
  drawOverlay(t);
  if (playing) {
    shownScore += (score - shownScore) * 0.25;
    if (Math.abs(score - shownScore) < 1) shownScore = score;
    const key = Math.round(shownScore) + "|" + lives + "|" + wave + "|" + invadersLeft + "|" + overload;
    if (key !== lastHud) { lastHud = key; paintHud(); }
    paintPowers();
  }
}
function drawOverlay(t) {
  ctx.setTransform(overlay.dpr, 0, 0, overlay.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  texts.draw(ctx);
  if (PA.state !== "play") return;
  const small = W < 560;
  if (aimTarget && aimGroup.length > 1 && aimTarget.paint === gun) {
    const p = toScreen(slotX(aimTarget), AY + 1.1, slotZ(aimTarget));
    ctx.font = `800 ${small ? 12 : 14}px 'JetBrains Mono', monospace`;
    ctx.textAlign = "center";
    ctx.fillStyle = PAINT_CSS[gun];
    ctx.shadowColor = PAINT_CSS[gun]; ctx.shadowBlur = 10;
    ctx.fillText("×" + aimGroup.length, p.x, p.y);
    ctx.shadowBlur = 0;
  }
  if (overload >= OVER_MAX && beamT <= 0 && respawnT <= 0) {
    const p = toScreen(player.vis, 0, CANNON_Z + 1.6);
    ctx.font = `700 ${small ? 11 : 13}px 'JetBrains Mono', monospace`;
    ctx.textAlign = "center";
    ctx.globalAlpha = 0.65 + Math.sin(t * 8) * 0.35;
    ctx.fillStyle = "#fff";
    ctx.fillText(PA.isTouch ? "⚡ OVERLOAD READY" : "OVERLOAD READY · X", p.x, Math.min(H - 14, p.y + 10));
    ctx.globalAlpha = 1;
  }
  if (queen) {
    const bw = Math.min(320, W * 0.55), bx = (W - bw) / 2, by = small ? 116 : 70;
    ctx.fillStyle = "rgba(12,6,20,.7)"; ctx.fillRect(bx - 2, by - 2, bw + 4, 11);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, "#ffb347"); g.addColorStop(1, PAINT_CSS[queen.paint]);
    ctx.fillStyle = g; ctx.fillRect(bx, by, bw * Math.max(0, queen.hp / queen.max), 7);
    ctx.font = "700 10px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#ffe2b0";
    ctx.fillText("HIVE QUEEN · HIT HER IN " + PAINT_NAME[queen.paint].toUpperCase() + " OR POP A CLUSTER BESIDE HER", W / 2, by + 22);
  }
  if (banner) {
    const b = banner, k = b.t / b.max;
    const a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
    const sc = 1 + (1 - PA.ease.outCubic(Math.min(1, k / 0.2))) * 0.2;
    const fs = Math.round(clamp(Math.min(W, H) * 0.075, 26, 54) * sc);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 " + fs + "px Manrope, system-ui, sans-serif";
    ctx.shadowColor = "#ff4fa3"; ctx.shadowBlur = 22;
    const grd = ctx.createLinearGradient(W / 2 - fs * 3, 0, W / 2 + fs * 3, 0);
    grd.addColorStop(0, "#ffcf4a"); grd.addColorStop(0.5, "#ff4fa3"); grd.addColorStop(1, "#3fe3ff");
    ctx.fillStyle = grd;
    ctx.fillText(b.text, W / 2, H * 0.42);
    ctx.shadowBlur = 0;
    ctx.font = "500 " + Math.round(Math.max(11, fs * 0.3)) + "px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#c4e8ff";
    ctx.fillText(b.sub.toUpperCase(), W / 2, H * 0.42 + fs * 0.75);
    ctx.restore();
  }
}

/* ---------------- boot ---------------- */
addEventListener("resize", resize);
resize();
spawnWave();
PA.loop(update, render);
window.__ssiege = () => ({
  score, wave, lives, invadersLeft, gun, colours, bestCluster, clusters, paints, kills, overload, beamT,
  queen: queen ? queen.hp : 0, queensDown, diversDown, divers: aliens.filter((a) => a.alive && a.dive).length,
  caps: caps.length, bubbleOn, timers: Object.assign({}, timers), overSent, simT, shields: shields.reduce((n, s) => n + s.blocks.length, 0)
});
window.__ss = {
  sim: (sec, bot) => {
    for (let i = 0; i < sec * 60; i++) {
      if (bot && PA.state === "play") {
        // stand under the nearest drone and match its colour
        let best = null, bz = -Infinity;
        for (const a of aliens) if (inForm(a) && slotZ(a) > bz) { bz = slotZ(a); best = a; }
        if (best) { player.x = clamp(slotX(best), LEFT + PHW, RIGHT - PHW); gun = best.paint; }
        if (overload >= OVER_MAX) fireOverload();
      }
      update(1 / 60);
    }
  },
  wave: (n) => { wave = n; spawnWave(); },
  charge: () => { overload = OVER_MAX; },
  power: (k) => takeCapsule({ type: k, x: player.x, z: CANNON_Z }),
  dive: () => startDive(),
  get player() { return player; }
};
})();
</script>
