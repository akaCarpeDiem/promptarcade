<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Star Siege — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#05070f;color:#f4f1ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#ss-hud{opacity:0;transition:opacity .45s ease}
#ss-hud.on{opacity:1}
#s-wave b{color:#c4a6ff}
#s-ships b{color:#ffd27a}
</style></head><body>
<canvas id="c" aria-label="Star Siege playfield"></canvas>
<div class="pa-hud" id="ss-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat" id="s-wave"><small>Wave</small><b>1</b></div>
  <div class="pa-stat" id="s-ships"><small>Swarm</small><b>0</b></div>
  <div class="pa-stat" id="s-lives"><small>Lives</small><b>♦♦♦</b></div>
  <div class="pa-stat" id="s-cluster"><small>Best cluster</small><b>—</b></div>
</div>
<script>
window.paConfig = {
  slug: "star-siege", title: "Star Siege", native: true, music: "space", unit: "points",
  controls: [["← → / A D", "Move cannon"], ["Space / ↑", "Switch laser colour"], ["Touch drag", "Move · auto fire"]]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script>
(() => {
  const TAU = Math.PI * 2;
  const { rand, randInt, clamp } = PA;
  const COL = {
    sky: "#0a0e22",
    player: "#7ee7a8",
    playerCore: "#8ee9ff",
    alien: ["#ff7eb6", "#c4a6ff", "#8ee9ff", "#7ee7a8", "#ffd27a"],
    shield: "#c4a6ff",
    mothership: "#ffd27a",
    bulletP: "#7ee7a8",
    bulletE: "#ff7eb6"
  };
  // the swarm is a honeycomb: odd rows sit half a cell over, so each alien touches up to six others
  const ALIEN_ROWS = 6;
  const ALIEN_COLS = 9;
  const ALIEN_SCORE = [35, 25, 25, 20, 15];
  const SHIELD_COUNT = 3;
  // The twist: your laser carries a colour. A hit on a different colour paints that alien yours;
  // a hit on a matching one detonates every touching alien of that colour in a chain.
  const PAINT = ["#ff7eb6", "#8ee9ff", "#ffd27a", "#7ee7a8"];
  const PAINT_NAME = ["Pink", "Cyan", "Gold", "Green"];

  let W = 0, H = 0, S = 1, DPR = 1;
  let playL = 0, playR = 0, playW = 0, floorY = 0;
  let score = 0, wave = 1, lives = 3, invadersLeft = 0;
  let player = null, aliens = [], pBullets = [], eBullets = [];
  let shields = [], mothership = null, mothershipCd = 0;
  let formX = 0, formY = 0, marchDir = 1, marchTimer = 0, marchDelay = 0.72;
  let enemyFireCd = 0, fireCd = 0, overSent = false, banner = null, simT = 0;
  let respawnT = 0, invulnT = 0, waveClearT = 0, kills = 0, mothershipHits = 0;
  let ptrX = null, stars = [], bgGrad = null;
  let gun = 0, colours = 3, bestCluster = 0, clusters = 0, paints = 0, swapT = 0;

  const view = PA.canvas(document.getElementById("c"), { onResize: layout });
  const ctx = view.ctx;
  const canvas = view.canvas;
  const fx = new PA.Particles(1000), texts = new PA.Texts();
  const hud = document.getElementById("ss-hud");

  function layout(v) {
    W = v.w; H = v.h; DPR = v.dpr;
    S = clamp(Math.sqrt(W * H) / 820, 0.72, 1.35);
    playL = W * 0.05;
    playR = W * 0.95;
    playW = playR - playL;
    floorY = H - Math.max(52, H * 0.09);
    buildSky();
    if (player) {
      player.y = floorY - player.h;
      player.w = playW * 0.11;
      clampPlayer();
    }
  }

  function buildSky() {
    const cv = document.createElement("canvas");
    cv.width = Math.ceil(W * DPR); cv.height = Math.ceil(H * DPR);
    const g = cv.getContext("2d");
    g.scale(DPR, DPR);
    const lg = g.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, "#070b16");
    lg.addColorStop(0.45, "#0a1230");
    lg.addColorStop(1, "#140818");
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
    const neb = [
      [0.2, 0.15, 0.42, "rgba(196,166,255,.12)"],
      [0.78, 0.28, 0.38, "rgba(142,233,255,.1)"],
      [0.5, 0.62, 0.48, "rgba(255,126,182,.07)"]
    ];
    neb.forEach(([x, y, r, col]) => {
      const R = Math.max(W, H) * r;
      const rg = g.createRadialGradient(x * W, y * H, 0, x * W, y * H, R);
      rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
    });
    bgGrad = cv;
    const n = Math.min(320, Math.round(W * H / 4200));
    stars = [];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H * 0.78,
        z: Math.random() < 0.5 ? 0 : Math.random() < 0.65 ? 1 : 2,
        ph: rand(TAU), sp: rand(0.3, 1.6)
      });
    }
  }

  // crystal barriers: hexagons of breakable cells that drift slowly from side to side
  function makeShields() {
    shields = [];
    const cell = clamp(playW * 0.0105, 3.5 * S, 8.5 * S), R = 6;   // small enough that drifting barriers never touch
    const y = floorY - R * 2 * cell - 30 * S;
    for (let i = 0; i < SHIELD_COUNT; i++) {
      const cx = playL + playW * (i + 1) / (SHIELD_COUNT + 1), blocks = [];
      for (let r = -R; r <= R; r++) for (let c = -R - 2; c <= R + 2; c++) {
        // a flat-topped hexagon: full width in the middle row, narrowing toward the top and bottom
        const rx = (c + (r & 1 ? .5 : 0)) * cell;
        if (Math.abs(r) * .5 * cell + Math.abs(rx) > (R + .5) * cell * .9 + 1) continue;
        blocks.push({ rx: rx - cell / 2, x: cx + rx - cell / 2, y: y + (r + R) * cell * .87, w: cell - 1.2, h: cell * .87 - 1, hp: 1 });
      }
      shields.push({ blocks, cx, baseX: cx, ph: i * 2.1, y, cell });
    }
  }
  function driftShields(dt) {
    const amp = playW / (SHIELD_COUNT + 1) * .22;
    for (const sh of shields) {
      sh.cx = sh.baseX + Math.sin(simT * .45 + sh.ph) * amp;
      for (const bl of sh.blocks) bl.x = sh.cx + bl.rx;
    }
  }

  function alienKind(row) {
    return Math.min(4, Math.floor(row * 5 / ALIEN_ROWS));
  }
  function hexNeighbours(r, c) {
    const o = r & 1 ? 0 : -1;   // odd rows sit half a cell to the right
    return [[r, c - 1], [r, c + 1], [r - 1, c + o], [r - 1, c + o + 1], [r + 1, c + o], [r + 1, c + o + 1]];
  }

  function spawnWave() {
    aliens = [];
    const aw = Math.min(playW * 0.052, H * 0.07);
    const ah = aw * 0.74;
    const gapX = aw * 0.3;
    const gapY = ah * 0.22;
    const gridW = ALIEN_COLS * aw + (ALIEN_COLS - 1) * gapX + (aw + gapX) / 2;
    formX = playL + (playW - gridW) / 2;
    formY = W < 600 ? Math.max(H * 0.1, 112) : H * 0.1;   // clear of the two-row HUD on narrow screens
    marchDir = 1;
    marchTimer = 0.4;
    marchDelay = clamp(0.78 - wave * 0.04, 0.28, 0.78);
    colours = wave >= 3 ? 4 : 3;
    const grid = [];
    for (let r = 0; r < ALIEN_ROWS; r++) {
      grid.push([]);
      for (let c = 0; c < ALIEN_COLS; c++) {
        // Colours clump a little so there are clusters to find, and stay patchy enough to paint.
        const roll = Math.random();
        let k = randInt(0, colours - 1);
        if (c > 0 && roll < 0.2) k = grid[r][c - 1];
        else if (r > 0 && roll < 0.3) k = grid[r - 1][Math.min(c, ALIEN_COLS - 1)];
        grid[r].push(k);
        aliens.push({
          paint: k, flashT: 0, popT: -1,
          col: c, row: r,
          lx: c * (aw + gapX) + (r & 1 ? (aw + gapX) / 2 : 0),
          ly: r * (ah + gapY),
          w: aw, h: ah,
          kind: alienKind(r),
          alive: true,
          anim: randInt(0, 1),
          animT: rand(0, 0.5)
        });
      }
    }
    invadersLeft = aliens.length;
    makeShields();
    if (gun >= colours) gun = 0;
    mothership = null;
    mothershipCd = rand(8, 16);
    enemyFireCd = rand(0.8, 1.6);
    paintHud();
  }

  function resetPlayer() {
    player = {
      x: W / 2,
      y: floorY - 22 * S,
      w: playW * 0.11,
      h: 16 * S,
      vx: 0
    };
    clampPlayer();
  }

  function reset() {
    fx.clear(); texts.clear();
    score = 0; wave = 1; lives = 3; kills = 0; mothershipHits = 0;
    gun = 0; bestCluster = 0; clusters = 0; paints = 0; swapT = 0;
    overSent = false; banner = null; simT = 0;
    pBullets = []; eBullets = [];
    respawnT = 0; invulnT = 0; waveClearT = 0;
    fireCd = 0; ptrX = null;
    resetPlayer();
    spawnWave();
    showBanner("STAR SIEGE", "Match colours to chain-pop clusters", 2.4);
    PA.music.intensity(0);
    hud.classList.add("on");
    paintHud();
  }

  PA.onStart(reset);

  function showBanner(text, sub, dur) { banner = { text, sub, t: 0, max: dur || 1.6 }; }

  function paintHud() {
    PA.stat("s-score", score.toLocaleString());
    PA.stat("s-wave", wave);
    PA.stat("s-ships", invadersLeft);
    PA.stat("s-lives", lives <= 0 ? "—" : lives <= 5 ? "♦".repeat(lives) : "♦×" + lives);
    PA.stat("s-cluster", bestCluster > 1 ? bestCluster : "—");
  }

  function clampPlayer() {
    if (!player) return;
    player.x = clamp(player.x, playL + player.w / 2, playR - player.w / 2);
    player.y = floorY - player.h;
  }

  function aimPlayer(x) {
    if (!player || respawnT > 0) return;
    player.x = x;
    clampPlayer();
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".pa-tb,.pa-layer,#pa-gate,.pa-touch")) return;
    if (PA.state !== "play") return;
    const p = view.toLocal(e.clientX, e.clientY);
    ptrX = p.x;
    aimPlayer(p.x);
    try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (PA.state !== "play" || ptrX == null) return;
    const p = view.toLocal(e.clientX, e.clientY);
    aimPlayer(p.x);
  });
  function endPtr() { ptrX = null; }
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);

  function swapColour(dir) {
    if (PA.state !== "play") return;
    gun = (gun + (dir || 1) + colours) % colours;
    swapT = 0.25;
    PA.tone({ freq: 500 + gun * 120, to: 700 + gun * 140, type: "triangle", dur: 0.08, vol: 0.06 });
    if (player) fx.burst(player.x, player.y - player.h * 0.4, { n: 10, color: PAINT[gun], speed: 90, life: 0.3, size: 2 });
  }
  PA.onKey((e) => {
    if (e.repeat) return;
    const k = e.key, c = e.code;
    if (k === " " || c === "Space" || k === "ArrowUp" || c === "KeyW" || k === "w" || c === "KeyC" || k === "c") { e.preventDefault && e.preventDefault(); swapColour(1); }
    else if (k === "ArrowDown" || c === "KeyS" || k === "s" || c === "KeyZ" || k === "z") swapColour(-1);
    else if (k >= "1" && k <= "4" && +k <= colours) { gun = +k - 2; swapColour(1); }
  });
  PA.touchControls({ right: [{ key: " ", code: "Space", label: "◐", aria: "Switch laser colour" }] });

  function firePlayer() {
    if (fireCd > 0 || respawnT > 0 || invulnT > 0 || waveClearT > 0) return;
    if (pBullets.length >= 3) return;
    fireCd = 0.34;
    const bx = player.x;
    const by = player.y - player.h * 0.5;
    pBullets.push({ x: bx, y: by, vy: -620 * S, w: 3 * S, h: 12 * S, paint: gun });
    PA.tone({ freq: 520, to: 720, type: "square", dur: 0.05, vol: 0.035 });
    fx.burst(bx, by, { n: 4, color: COL.bulletP, speed: 40, life: 0.2, size: 1.6 });
  }

  function alienWorld(a) {
    return { x: formX + a.lx + a.w / 2, y: formY + a.ly + a.h / 2, w: a.w, h: a.h };
  }

  function livingAliens() {
    return aliens.filter((a) => a.alive && a.popT < 0);
  }

  // the swarm glides side to side and sinks steadily, faster as it thins out
  function glide(dt) {
    const live = livingAliens();
    if (!live.length) return;
    let minX = Infinity, maxX = -Infinity, maxY = 0;
    for (const a of live) {
      const wx = formX + a.lx;
      minX = Math.min(minX, wx);
      maxX = Math.max(maxX, wx + a.w);
      maxY = Math.max(maxY, formY + a.ly + a.h);
    }
    const rush = 1 + (1 - live.length / aliens.length) * 1.4;
    const vx = (42 + wave * 6) * S * rush, margin = 12 * S;
    formX += marchDir * vx * dt;
    if (minX < playL + margin) { marchDir = 1; formX += playL + margin - minX; }
    else if (maxX > playR - margin) { marchDir = -1; formX -= maxX - (playR - margin); }
    formY += (3 + wave * 0.7) * S * rush * dt;
    if (maxY >= player.y - 8 * S) {
      // the swarm reached the cannon: lose a life and it backs off a little
      formY -= 70 * S;
      playerHit(true);
    }
  }

  function pickShooter() {
    const live = livingAliens();
    if (!live.length) return null;
    const cols = {};
    for (const a of live) {
      if (!cols[a.col] || a.row > cols[a.col].row) cols[a.col] = a;
    }
    const bottom = Object.values(cols);
    return bottom[randInt(0, bottom.length - 1)];
  }

  function enemyShoot() {
    const a = pickShooter();
    if (!a) return;
    const w = alienWorld(a);
    eBullets.push({
      x: w.x, y: w.y + a.h * 0.3,
      vy: (220 + wave * 18) * S,
      w: 3 * S, h: 10 * S
    });
    PA.tone({ freq: 180, to: 120, type: "square", dur: 0.07, vol: 0.03 });
  }

  function spawnMothership() {
    if (mothership) return;
    // a comet arcs across the top of the sky: hit it for a bonus
    const fromLeft = Math.random() < 0.5;
    mothership = {
      x: fromLeft ? playL - 40 * S : playR + 40 * S,
      y: H * 0.05, y0: H * 0.05, k: 0,
      w: 30 * S,
      h: 30 * S,
      vx: (fromLeft ? 1 : -1) * (170 + wave * 8) * S,
      bonus: 150 + wave * 50
    };
    PA.tone({ freq: 1400, to: 500, type: "sine", dur: 0.6, vol: 0.06 });
    texts.add(W / 2, H * 0.14, "COMET", { color: COL.mothership, size: 16, life: 1.1, vy: -18 });
  }

  function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function hitShield(b) {
    for (const sh of shields) {
      for (let i = sh.blocks.length - 1; i >= 0; i--) {
        const bl = sh.blocks[i];
        if (rectHit(b.x - b.w / 2, b.y - b.h, b.w, b.h, bl.x, bl.y, bl.w, bl.h)) {
          fx.burst(bl.x + bl.w / 2, bl.y + bl.h / 2, { n: 5, color: COL.shield, speed: 70, life: 0.35, size: 1.8 });
          sh.blocks.splice(i, 1);
          return true;
        }
      }
    }
    return false;
  }

  function killAlien(a, wx, wy, mult) {
    a.alive = false;
    invadersLeft--;
    const pts = Math.round((ALIEN_SCORE[a.kind] + Math.floor(wave * 2)) * (mult || 1));
    score += pts;
    kills++;
    PA.sfx("hit", { pitch: 1 + (ALIEN_ROWS - a.row) * 0.04 });
    PA.shake(5 * S, 0.12);
    fx.burst(wx, wy, { n: 18, colors: [PAINT[a.paint], "#fff", PAINT[a.paint]], speed: 160, life: 0.55, size: 2.4, shape: "spark" });
    texts.add(wx, wy - 8 * S, "+" + pts, { color: PAINT[a.paint], size: 14, life: 0.65, vy: -32 });
    paintHud();
    PA.music.intensity(clamp(1 - invadersLeft / aliens.length + wave * 0.08, 0, 1));
    if (invadersLeft <= 0) beginWaveClear();
  }

  function hitAlien(a, b, w) {
    if (a.paint !== b.paint) {
      // Wrong colour: the shot paints it instead of killing it.
      a.paint = b.paint; a.flashT = 0.3; paints++;
      score += 5; paintHud();
      PA.tone({ freq: 760 + b.paint * 90, to: 520, type: "triangle", dur: 0.07, vol: 0.06 });
      fx.burst(w.x, w.y, { n: 8, color: PAINT[b.paint], speed: 90, life: 0.3, size: 2 });
      return;
    }
    // Matching colour: flood out through touching aliens of the same colour.
    const byPos = {};
    for (const o of aliens) if (o.alive && o.popT < 0) byPos[o.row + "," + o.col] = o;
    const seen = new Set([a]), queue = [[a, 0]], group = [];
    while (queue.length) {
      const [cur, d] = queue.shift();
      group.push([cur, d]);
      for (const [nr, nc] of hexNeighbours(cur.row, cur.col)) {
        const n = byPos[nr + "," + nc];
        if (n && !seen.has(n) && n.paint === a.paint) { seen.add(n); queue.push([n, d + 1]); }
      }
    }
    const size = group.length;
    // Each alien in a cluster of n scores (n + 1) / 2 times its value.
    for (const [o, d] of group) { o.popT = d * 0.055; o.mult = (size + 1) / 2; }
    if (size > 1) {
      clusters++;
      if (size > bestCluster) bestCluster = size;
      texts.add(w.x, w.y - 26 * S, "CLUSTER ×" + size, { color: "#fff", size: 16 + Math.min(size, 12) * 1.5, life: 1.1, vy: -30 });
      PA.sfx("combo", { pitch: 0.9 + Math.min(size, 12) * 0.04 });
      if (size >= 6) { PA.flash("rgba(255,255,255,.12)", 180); PA.shake(9 * S, 0.3); }
      paintHud();
    }
  }

  function beginWaveClear() {
    waveClearT = 1.4;
    score += 200 + wave * 50;
    paintHud();
    PA.sfx("levelup");
    PA.flash("rgba(142,233,255,.2)", 280);
    showBanner("WAVE " + wave + " CLEARED", "Crystals reform · a new swarm gathers", 1.6);
    pBullets = []; eBullets = [];
  }

  function nextWave() {
    wave++;
    waveClearT = 0;
    spawnWave();
    showBanner("WAVE " + wave, "The swarm grows restless", 1.5);
    resetPlayer();
    invulnT = 1.2;
  }

  function killMothership() {
    if (!mothership) return;
    const m = mothership;
    score += m.bonus;
    mothershipHits++;
    mothership = null;
    PA.sfx("coin", { pitch: 1.2 });
    PA.flash("rgba(255,210,122,.22)", 260);
    fx.burst(m.x, m.y, { n: 32, colors: [COL.mothership, "#fff", COL.player], speed: 200, life: 0.7, size: 3, shape: "spark" });
    texts.add(m.x, m.y, "+" + m.bonus, { color: COL.mothership, size: 22, life: 0.9, vy: -40 });
    paintHud();
  }

  function playerHit(force) {
    if (invulnT > 0 && !force) return;
    lives--;
    PA.sfx("explode", { vol: 0.7 });
    PA.shake(14 * S, 0.45);
    PA.flash("rgba(255,126,182,.35)", 320);
    fx.burst(player.x, player.y, { n: 40, colors: [COL.player, COL.playerCore, "#fff"], speed: 240, life: 0.75, size: 3, shape: "spark" });
    pBullets = []; eBullets = [];
    paintHud();
    if (lives <= 0) endGame();
    else {
      respawnT = 1.1;
      invulnT = 2;
    }
  }

  function endGame() {
    if (overSent) return;
    overSent = true;
    hud.classList.remove("on");
    PA.sfx("gameover");
    PA.gameOver(score, {
      title: "Siege broken",
      stats: [
        ["Wave", wave],
        ["Invaders", kills],
        ["Best cluster", bestCluster > 1 ? bestCluster : "—"],
        ["Painted", paints],
        ["Comets", mothershipHits],
        ["Lives left", Math.max(0, lives)]
      ]
    });
  }

  function update(dt, t) {
    simT += dt;
    fx.update(dt); texts.update(dt);
    if (banner) { banner.t += dt; if (banner.t > banner.max) banner = null; }
    if (PA.state !== "play") return;

    if (waveClearT > 0) {
      waveClearT -= dt;
      if (waveClearT <= 0) nextWave();
      return;
    }

    if (respawnT > 0) {
      respawnT -= dt;
      if (respawnT <= 0) resetPlayer();
      return;
    }

    if (invulnT > 0) invulnT -= dt;
    if (fireCd > 0) fireCd -= dt;
    if (swapT > 0) swapT -= dt;

    const move = (PA.down("ArrowRight", "KeyD", "d") ? 1 : 0) - (PA.down("ArrowLeft", "KeyA", "a") ? 1 : 0);
    if (move && player) {
      player.x += move * 420 * S * dt;
      clampPlayer();
    }

    firePlayer();

    glide(dt);
    driftShields(dt);

    for (const a of aliens) {
      if (!a.alive) continue;
      if (a.flashT > 0) a.flashT -= dt;
      if (a.popT >= 0) {
        a.popT -= dt;
        if (a.popT < 0) { a.popT = -1; const w = alienWorld(a); killAlien(a, w.x, w.y, a.mult); }
        continue;
      }
      a.animT += dt;
      if (a.animT > 0.45) { a.anim = 1 - a.anim; a.animT = 0; }
    }

    enemyFireCd -= dt;
    if (enemyFireCd <= 0 && livingAliens().length) {
      enemyShoot();
      const live = livingAliens().length;
      enemyFireCd = clamp(1.35 - live * 0.012 - wave * 0.04, 0.35, 1.35);
    }

    mothershipCd -= dt;
    if (mothershipCd <= 0 && !mothership && livingAliens().length) {
      spawnMothership();
      mothershipCd = rand(14, 26);
    }
    if (mothership) {
      const m = mothership;
      m.x += m.vx * dt;
      m.k = clamp((m.vx > 0 ? m.x - playL : playR - m.x) / playW, 0, 1);
      m.y = m.y0 + Math.sin(m.k * Math.PI) * H * 0.07;
      if (mothership.x < playL - 80 * S || mothership.x > playR + 80 * S) mothership = null;
    }

    for (let i = pBullets.length - 1; i >= 0; i--) {
      const b = pBullets[i];
      b.y += b.vy * dt;
      if (b.y < H * 0.04) { pBullets.splice(i, 1); continue; }
      if (hitShield(b)) { pBullets.splice(i, 1); continue; }
      if (mothership && rectHit(b.x - b.w / 2, b.y - b.h, b.w, b.h, mothership.x - mothership.w / 2, mothership.y - mothership.h / 2, mothership.w, mothership.h)) {
        killMothership();
        pBullets.splice(i, 1);
        continue;
      }
      let hit = false;
      for (const a of aliens) {
        if (!a.alive || a.popT >= 0) continue;
        const w = alienWorld(a);
        if (rectHit(b.x - b.w / 2, b.y - b.h, b.w, b.h, w.x - a.w / 2, w.y - a.h / 2, a.w, a.h)) {
          hitAlien(a, b, w);
          hit = true;
          break;
        }
      }
      if (hit) pBullets.splice(i, 1);
    }

    for (let i = eBullets.length - 1; i >= 0; i--) {
      const b = eBullets[i];
      b.y += b.vy * dt;
      if (b.y > H + 20) { eBullets.splice(i, 1); continue; }
      if (hitShield(b)) { eBullets.splice(i, 1); continue; }
      if (player && invulnT <= 0 && rectHit(
        b.x - b.w / 2, b.y, b.w, b.h,
        player.x - player.w / 2, player.y - player.h, player.w, player.h
      )) {
        eBullets.splice(i, 1);
        playerHit(false);
      }
    }
  }

  function drawStars(t) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const s of stars) {
      const sp = [16, 34, 62][s.z] * S;
      const a = 0.22 + 0.5 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = s.z === 2 ? "#fff" : "#8ee9ff";
      ctx.fillRect(s.x, s.y, s.z === 0 ? 1 : 2, s.z === 0 ? 1 : 2);
    }
    ctx.restore();
  }

  function drawGrid() {
    ctx.strokeStyle = "rgba(142,233,255,.06)";
    ctx.lineWidth = 1;
    ctx.strokeRect(playL - 2, H * 0.05, playW + 4, floorY - H * 0.05 + 4);
    ctx.strokeStyle = "rgba(196,166,255,.35)";
    ctx.setLineDash([10 * S, 14 * S]);
    ctx.beginPath();
    ctx.moveTo(playL, floorY + 2);
    ctx.lineTo(playR, floorY + 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawAlien(a, t) {
    const w = alienWorld(a);
    const col = a.flashT > 0 && Math.sin(a.flashT * 60) > 0 ? "#ffffff" : PAINT[a.paint];
    const popping = a.popT >= 0;
    const bob = Math.sin(t * 6 + a.col * 0.4 + a.row) * 1.5 * S;
    const sc = (1 + a.anim * 0.06) * (popping ? 1.15 + Math.sin(simT * 50) * 0.08 : 1);
    ctx.save();
    ctx.translate(w.x, w.y + bob);
    ctx.scale(sc, sc);
    ctx.shadowColor = col;
    ctx.shadowBlur = 14 * S;
    ctx.fillStyle = col;
    ctx.strokeStyle = "rgba(255,255,255,.45)";
    ctx.lineWidth = 1.2;
    if (a.kind === 0) {
      ctx.beginPath();
      ctx.ellipse(0, 0, a.w * 0.42, a.h * 0.38, 0, 0, TAU);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#0a1220";
      ctx.fillRect(-a.w * 0.18, -a.h * 0.08, a.w * 0.12, a.h * 0.12);
      ctx.fillRect(a.w * 0.06, -a.h * 0.08, a.w * 0.12, a.h * 0.12);
      ctx.strokeStyle = col;
      ctx.beginPath();
      ctx.moveTo(-a.w * 0.35, a.h * 0.15);
      ctx.lineTo(-a.w * 0.55, a.h * 0.35 + a.anim * 4 * S);
      ctx.moveTo(a.w * 0.35, a.h * 0.15);
      ctx.lineTo(a.w * 0.55, a.h * 0.35 - a.anim * 4 * S);
      ctx.stroke();
    } else if (a.kind === 1 || a.kind === 2) {
      roundRect(-a.w * 0.45, -a.h * 0.35, a.w * 0.9, a.h * 0.7, 4 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-a.w * 0.22, -a.h * 0.12, a.w * 0.14, a.h * 0.14);
      ctx.fillRect(a.w * 0.08, -a.h * 0.12, a.w * 0.14, a.h * 0.14);
      ctx.fillStyle = col;
      const leg = a.anim ? 5 * S : -3 * S;
      ctx.fillRect(-a.w * 0.4, a.h * 0.2, a.w * 0.18, a.h * 0.18);
      ctx.fillRect(a.w * 0.22, a.h * 0.2, a.w * 0.18, a.h * 0.18);
      ctx.fillRect(-a.w * 0.08, a.h * 0.25 + leg, a.w * 0.16, a.h * 0.12);
    } else {
      roundRect(-a.w * 0.48, -a.h * 0.32, a.w * 0.96, a.h * 0.64, 5 * S);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.7)";
      for (let i = -1; i <= 1; i++) ctx.fillRect(i * a.w * 0.18 - 3, -a.h * 0.1, 6, 6);
      ctx.fillStyle = col;
      ctx.fillRect(-a.w * 0.5, a.h * 0.05 + a.anim * 3 * S, a.w * 0.22, a.h * 0.2);
      ctx.fillRect(a.w * 0.28, a.h * 0.05 - a.anim * 3 * S, a.w * 0.22, a.h * 0.2);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawShields() {
    for (const sh of shields) {
      for (const bl of sh.blocks) {
        ctx.fillStyle = COL.shield;
        ctx.shadowColor = COL.shield;
        ctx.shadowBlur = 6;
        ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
      }
    }
    ctx.shadowBlur = 0;
  }

  function drawPlayer(t) {
    if (!player || respawnT > 0) return;
    if (invulnT > 0 && Math.sin(t * 28) > 0) return;
    const { x, y, w, h } = player;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = COL.playerCore;
    ctx.shadowBlur = 20 * S;
    const grd = ctx.createLinearGradient(0, -h, 0, 0);
    grd.addColorStop(0, "#fff");
    grd.addColorStop(0.35, COL.playerCore);
    grd.addColorStop(1, COL.player);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.95);
    ctx.lineTo(w * 0.55, h * 0.15);
    ctx.lineTo(w * 0.22, h * 0.05);
    ctx.lineTo(0, h * 0.35);
    ctx.lineTo(-w * 0.22, h * 0.05);
    ctx.lineTo(-w * 0.55, h * 0.15);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // The barrel glows in the laser's colour, with the colour wheel underneath.
    const pc = PAINT[gun], pop = 1 + Math.max(0, swapT) * 2;
    ctx.fillStyle = pc; ctx.shadowColor = pc; ctx.shadowBlur = 18 * S;
    ctx.beginPath(); ctx.arc(0, -h * 0.2, h * 0.32 * pop, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    for (let i = 0; i < colours; i++) {
      const dx = (i - (colours - 1) / 2) * 12 * S;
      ctx.globalAlpha = i === gun ? 1 : 0.35;
      ctx.fillStyle = PAINT[i];
      ctx.beginPath(); ctx.arc(dx, h * 0.95, (i === gun ? 4 : 3) * S, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawMothership(t) {
    if (!mothership) return;
    const m = mothership, dir = Math.sign(m.vx);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    // the tail streams out behind the head
    for (let i = 10; i >= 1; i--) {
      const k = i / 10, tx = m.x - dir * i * 9 * S, ty = m.y - Math.cos(m.k * Math.PI) * i * 2.2 * S;
      ctx.globalAlpha = (1 - k) * .5; ctx.fillStyle = i % 2 ? COL.mothership : "#8ee9ff";
      ctx.beginPath(); ctx.arc(tx, ty, (1 - k * .7) * 9 * S, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 16 * S);
    g.addColorStop(0, "#fff"); g.addColorStop(.4, COL.mothership); g.addColorStop(1, "rgba(255,210,122,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, 16 * S * (0.9 + 0.1 * Math.sin(t * 9)), 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    for (const b of pBullets) {
      ctx.fillStyle = PAINT[b.paint];
      ctx.shadowColor = PAINT[b.paint];
      ctx.shadowBlur = 10;
      ctx.fillRect(b.x - b.w / 2, b.y - b.h, b.w, b.h);
    }
    for (const b of eBullets) {
      ctx.fillStyle = COL.bulletE;
      ctx.shadowColor = COL.bulletE;
      ctx.shadowBlur = 10;
      ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
    }
    ctx.shadowBlur = 0;
  }

  function drawBanner() {
    if (!banner) return;
    const b = banner, k = b.t / b.max;
    const a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
    const fs = Math.round(clamp(Math.min(W, H) * 0.08, 26, 52));
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "600 " + fs + "px Manrope, system-ui, sans-serif";
    ctx.shadowColor = "#c4a6ff";
    ctx.shadowBlur = 20;
    const grd = ctx.createLinearGradient(W / 2 - fs * 2, 0, W / 2 + fs * 2, 0);
    grd.addColorStop(0, "#fff");
    grd.addColorStop(0.5, "#8ee9ff");
    grd.addColorStop(1, "#c4a6ff");
    ctx.fillStyle = grd;
    ctx.fillText(b.text, W / 2, H * 0.36);
    ctx.shadowBlur = 0;
    ctx.font = "500 " + Math.round(fs * 0.26) + "px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#8ee9ff";
    ctx.fillText(b.sub.toUpperCase().split("").join(" "), W / 2, H * 0.36 + fs * 0.62);
    ctx.restore();
  }

  function drawHint(t) {
    if (PA.state !== "play" || overSent || banner || simT > 8) return;
    const a = 0.5 + 0.35 * Math.sin(t * 3);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "500 " + Math.round(14 * S) + "px Manrope, system-ui, sans-serif";
    ctx.fillStyle = "#8ee9ff";
    ctx.fillText(PA.isTouch ? "Drag to move · ◐ switches colour · hit a match to chain-pop" : "Space switches colour · hit a match to chain-pop the cluster", W / 2, H * 0.56);
    ctx.restore();
  }

  function render(t) {
    const sh = PA.shakeOffset();
    ctx.setTransform(DPR, 0, 0, DPR, DPR * sh.x, DPR * sh.y);
    if (bgGrad) ctx.drawImage(bgGrad, 0, 0, W, H);
    drawStars(t);
    drawGrid();
    drawShields();
    for (const a of aliens) if (a.alive) drawAlien(a, t);
    drawMothership(t);
    drawBullets();
    drawPlayer(t);
    fx.draw(ctx);
    texts.draw(ctx);
    drawBanner();
    drawHint(t);
  }

  window.__ssiege = () => ({
    score, wave, lives, invadersLeft, kills, mothershipHits, gun, bestCluster, paints,
    formX, formY, marchDir, marchDelay,
    player: player ? { x: player.x, y: player.y } : null,
    pBullets: pBullets.length, eBullets: eBullets.length,
    mothership: mothership ? { x: mothership.x, bonus: mothership.bonus } : null,
    shieldBlocks: shields.reduce((n, sh) => n + sh.blocks.length, 0),
    alive: lives > 0 && !overSent,
    overSent, respawnT, invulnT, waveClearT, simT
  });

  PA.loop(update, render);
})();
</script>
