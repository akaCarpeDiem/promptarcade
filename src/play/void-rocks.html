}
function rockGeo(seed, detail, lumpy) {

  const p = g.attributes.position, n = p.count;
  const craters = [];
  for (let i = 0; i < 7; i++) { const v = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize(); craters.push([v, rand(0.25, 0.55), rand(0.08, 0.16)]); }
  const st = [rand(0.8, 1.15), rand(0.75, 1), rand(0.85, 1.2)];
  const vein = new Float32Array(n), shade = new Float32Array(n), v = new THREE.Vector3();

    for (const [c, size, depth] of craters) {

}

const colCache = {};

function makeFx() {
  const list = [];
  return {
    list,
    burst(x, y, o) {
      o = o || {};
      const n = o.n || 10, cols = o.colors || [o.color || "#ffffff"];
      for (let i = 0; i < n && list.length < PMAX; i++) {
        const a = o.angle != null ? o.angle + rand(-0.5, 0.5) * (o.spread == null ? 1 : o.spread) * 2 : Math.random() * TAU;
        const sp = (o.speed == null ? 100 : o.speed) * rand(0.25, 1), life = (o.life || 0.5) * rand(0.6, 1.1);
        list.push({ x, y, h: rand(0.2, 1.2), vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0), life, max: life,
          size: (o.size || 2) * rand(0.7, 1.3), c: colOf(cols[(Math.random() * cols.length) | 0]), drag: o.drag || 0 });
      }
    },
    update(dt) {
      let j = 0;
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        p.life -= dt;
        if (p.life <= 0) continue;
        if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        list[j++] = p;
      }
      list.length = j;
    },
    clear() { list.length = 0; }
  };
}

    shieldMat.uniforms.time.value = t; shieldMat.uniforms.k.value = Math.min(1, ship.inv) * (0.6 + 0.4 * Math.sin(t * 12));
    shipL.intensity = ship.thrust ? 22 : 6;
    shipL.position.set(X(ship.x - Math.cos(ship.a) * 18 * S), 1.2, Z(ship.y - Math.sin(ship.a) * 18 * S));
    lastA = ship.a;
  }
  blinkRing.visible = !!(alive && ship.hyper > 0);
  if (blinkRing.visible) {
    const k = 1 - ship.hyper / BLINK;
    blinkRing.position.set(X(ship.tx), 0.3, Z(ship.ty));
    blinkRing.scale.setScalar(((1 - k) * 26 * S + 4) / K);
    blinkRing.material.opacity = 0.9 * k;
  }

  droneG.visible = !!drone;

  if (drone) {
    const col = drone.small ? 0x7ee7a8 : 0xffd27a;

    droneG.position.set(X(drone.x), 0.6, Z(drone.y));
    droneG.scale.setScalar(drone.R / K);
    droneArms.rotation.y = t * (drone.mode === "cut" ? 9 : 2.5);
    droneG.rotation.z = clamp(drone.vx / 600, -0.3, 0.3); droneG.rotation.x = clamp(-drone.vy / 600, -0.3, 0.3);
    droneL.position.set(X(drone.x), 2, Z(drone.y)); droneL.color.set(col);
  }

  // salvage
  let gi = 0;
  for (const g of gems) {
    const blinkOut = g.life < 2 && Math.floor(g.life * 8) % 2 === 0;
    ghosts(g.x, g.y, 12, (x, y) => {
      if (gi >= GEM_MAX || blinkOut) return;
      e4.set(0.5, g.spin, 0.3); q4.setFromEuler(e4);
      m4.compose(v4.set(X(x), 0.7 + Math.sin(t * 3 + g.spin) * 0.1, Z(y)), q4, s4.set(0.2, 0.32, 0.2));
      gemMesh.setMatrixAt(gi, m4);
      m4.compose(v4.set(X(x), 0.2, Z(y)), q4.identity(), s4.setScalar(1.3));

  }
  gemMesh.count = gemGlow.count = gi;
  gemMesh.instanceMatrix.needsUpdate = true; gemGlow.instanceMatrix.needsUpdate = true;

  // rift
  riftG.visible = !!rift;
  riftL.intensity = rift ? 30 * rift.k : 0;
  post.comp.uniforms.lens.value.set(0, 0, 0, W / H);
  if (rift) {
    riftG.position.set(X(rift.x), 0.05, Z(rift.y));
    riftDisk.scale.setScalar(rift.reach / K * 0.85);
    riftCore.scale.setScalar(rift.core / K * rift.k);
    riftMat.uniforms.time.value = t; riftMat.uniforms.k.value = rift.k;
    riftL.position.set(X(rift.x), 3, Z(rift.y));
    post.comp.uniforms.lens.value.set(rift.x / W, 1 - rift.y / H, rift.core / H * 2.2 * rift.k, W / H);
  }

  // enemy shots
  let ei = 0;
  for (const b of eshots) {
    if (ei >= ES_MAX) break;
    const k = 0.75 + 0.25 * Math.sin(t * 30 + ei);
    m4.compose(v4.set(X(b.x), 0.6, Z(b.y)), q4.identity(), s4.setScalar(4 * S / K * k));
    eshotMesh.setMatrixAt(ei, m4);
    m4.compose(v4.set(X(b.x), 0.3, Z(b.y)), q4, s4.setScalar(22 * S / K));
    eshotGlow.setMatrixAt(ei, m4);
    ei++;
  }
  eshotMesh.count = eshotGlow.count = ei;
  eshotMesh.instanceMatrix.needsUpdate = true; eshotGlow.instanceMatrix.needsUpdate = true;

  // trails: shots, the tether, flung rocks, the drone's cutter
  tv = 0;
  for (const b of shots) {
    const tx = b.x - b.vx * 0.03, ty = b.y - b.vy * 0.03;
    if (Math.abs(tx - b.x) > W / 2 || Math.abs(ty - b.y) > H / 2) continue;
    ribbon([X(tx), 0.6, Z(ty), X(b.x), 0.6, Z(b.y)], [0.6, 2.2, 3.2], 3 * S / K, false);
    ribbon([X(b.x - b.vx * 0.012), 0.62, Z(b.y - b.vy * 0.012), X(b.x), 0.62, Z(b.y)], [3.5, 3.5, 3.5], 1.2 * S / K, false);
  }
  tetherL.intensity = 0;
  if (tether && alive) {
    const r = tether.rock, wind = clamp((tether.spin - 3) / 6, 0, 1);
    const dx = wd(r.x - ship.x, W), dy = wd(r.y - ship.y, H), L = Math.hypot(dx, dy) || 1, n = 12, pts = [];
    for (let i = 0; i <= n; i++) {
      const k = i / n, wob = Math.sin(k * Math.PI) * Math.sin(t * 40 + k * 9) * 4 * S;
      pts.push(X(ship.x + dx * k - dy / L * wob), 0.7, Z(ship.y + dy * k + dx / L * wob));
    }
    ribbon(pts, [1.6 + wind * 1.5, 1.1 + wind, 0.3], (5 + wind * 4) * S / K, false);
    ribbon(pts, [3, 3, 2.4], 1.4 * S / K, false);
    tetherL.position.set(X(ship.x + dx), 1.5, Z(ship.y + dy)); tetherL.intensity = 10 + wind * 14;
    if (tether.pull <= 0) {
      // aim line for the throw
      const c = Math.cos(ship.a), s = Math.sin(ship.a), len = (200 + wind * 260) * S, seg = 16 * S, gap = 10 * S, off = (t * 60) % (seg + gap);
      for (let d = 26 * S + off; d < len; d += seg + gap) {
        const d2 = Math.min(len, d + seg);
        ribbon([X(ship.x + c * d), 0.5, Z(ship.y + s * d), X(ship.x + c * d2), 0.5, Z(ship.y + s * d2)], [0.6 + wind, 0.45 + wind * 0.7, 0.12], 1.4 * S / K, false);
      }
    }
  }
  for (const r of rocks) {
    if (!r.flung) continue;
    r.trail = r.trail || [];
    r.trail.push(X(r.x), 0.4, Z(r.y));
    if (r.trail.length > 3 * 14) r.trail.splice(0, 3);
    // drop the trail across a wrap
    const tr = r.trail;
    for (let i = tr.length - 6; i >= 0; i -= 3) if (Math.abs(tr[i] - tr[i + 3]) > 4 || Math.abs(tr[i + 2] - tr[i + 5]) > 4) { tr.splice(0, i + 3); break; }
    ribbon(tr, [2.2, 1.4, 0.4], ROCK_R[r.size] * S / K * 0.9);
  }
  if (drone && drone.mode === "cut" && drone.target) {
    const r = drone.target, ox = drone.x - Math.cos(drone.orbit) * drone.R * 0.6, oy = drone.y - Math.sin(drone.orbit) * drone.R * 0.6;
    const flick = 0.6 + Math.random() * 0.6;
    ribbon([X(drone.x), 0.6, Z(drone.y), X(ox), 0.5, Z(oy)], [3 * flick, 1.2 * flick, 0.4 * flick], 2 * S / K, false);
  }
  tGeo.setDrawRange(0, tv);
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true;

  // particles
  const list = fx.list;
  const n = Math.min(list.length, PMAX);
  for (let i = 0; i < n; i++) {
    const p = list[i], k = p.life / p.max;
    pPos[i * 3] = X(p.x); pPos[i * 3 + 1] = p.h; pPos[i * 3 + 2] = Z(p.y);
    pCol[i * 3] = p.c[0] * 2.4 * k; pCol[i * 3 + 1] = p.c[1] * 2.4 * k; pCol[i * 3 + 2] = p.c[2] * 2.4 * k;
    pSize[i] = p.size * 2.6 / K;
  }
  pGeo.setDrawRange(0, n);
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; pGeo.attributes.size.needsUpdate = true;
  for (let i = 0; i < 2; i++) { expS[i].k = Math.max(0, expS[i].k - dtR * 2.2); expL[i].intensity = expS[i].k * 45; }

  post.comp.uniforms.hurt.value = overT > 0 ? 0.3 : 0;
  post.comp.uniforms.chroma.value = 0.12 + (alive && ship.hyper > 0 ? 1.2 : 0) + (rift ? rift.k * 0.3 : 0);
  post.render(scene, camera, t);
  drawOverlay(t);
  if (playing) { const key = score + "|" + lives + "|" + wave + "|" + refit + "|" + salvage; if (key !== lastHud) { lastHud = key; paintHud(); } }
}
function drawOverlay(t) {
  ctx.setTransform(DPR, 0, 0, DPR, DPR * shx, DPR * shy);
  ctx.clearRect(-50, -50, W + 100, H + 100);
  texts.draw(ctx);
  if (hintT > 0 && !banner && ship && ship.alive && !tether && PA.state === "play") {
    ctx.globalAlpha = Math.min(1, hintT) * 0.8;
    ctx.font = "600 12px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.fillStyle = TETHER_COL;
    ctx.fillText(PA.isTouch ? "⊚ TETHER A NEARBY ROCK" : "E  TETHER A NEARBY ROCK", ship.x, ship.y + 40 * S);
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (banner && PA.state === "play") drawBanner();
}
function drawBanner() {
  const b = banner, k = b.t / b.max;
  const a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
  const sc = 1 + (1 - PA.ease.outCubic(Math.min(1, k / 0.2))) * 0.25;

  ctx.shadowColor = "#c4a6ff"; ctx.shadowBlur = 24;

  grd.addColorStop(0, "#ffffff"); grd.addColorStop(0.5, "#8ee9ff"); grd.addColorStop(1, "#c4a6ff");
  ctx.fillStyle = grd;
  ctx.fillText(b.text, W / 2, H * 0.36);
  ctx.shadowBlur = 0;
  ctx.font = "500 " + Math.round(fs * 0.26) + "px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#8ee9ff";
  ctx.fillText(b.sub.toUpperCase().split("").join(" "), W / 2, H * 0.36 + fs * 0.7);
  ctx.restore();
}

/* ---------------- boot ---------------- */
addEventListener("resize", () => layout({ w: innerWidth, h: innerHeight, dpr: view.dpr || devicePixelRatio || 1 }));
layout({ w: innerWidth, h: innerHeight, dpr: devicePixelRatio || 1 });
window.__vrDrone = () => { droneT = 0; };
window.__vrInv = () => { if (ship) ship.inv = 1e9; };
window.__vr = () => ({ drone: drone && { mode: drone.mode, cuts: drone.cuts }, score, lives, wave, simT, rocks: rocks.length, tether: !!tether, flings, smashes, bestChain, alive: !!(ship && ship.alive), x: ship ? ship.x : 0, y: ship ? ship.y : 0, a: ship ? ship.a : 0, shots: shotsFired, refit, salvage, gems: gems.length, rift: rift ? { x: rift.x, y: rift.y, k: rift.k } : null, riftsSealed, swallowed });
window.__vrx = {
  sim: (sec) => { for (let i = 0; i < sec * 60; i++) update(1 / 60); },
  wave: (n) => { rocks = []; wave = n; spawnWave(); if ((wave % 2 === 1 && wave >= 3) || wave >= 8) spawnRift(); },
  openRift: () => spawnRift(),
  salvage: (n) => { for (let i = 0; i < n; i++) takeGem({ x: ship ? ship.x : 0, y: ship ? ship.y : 0 }); },
  gems: (n) => dropGems(ship.x + 60, ship.y, n),
  grab: () => tetherKey(),
  fling: () => { if (tether) { tether.pull = 0; tether.spin = 8; fling(); } },
  aimAt: (x, y) => { if (ship) ship.a = Math.atan2(y - ship.y, x - ship.x); },
  get rift() { return rift; },
  get ship() { return ship; },
  get rocks() { return rocks; }

PA.loop(update, render);
})();
