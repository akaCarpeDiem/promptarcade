<script type="module">

    "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time, hurt, chroma; varying vec2 vUv;",

    comp,
    setSize(w, h) {
      main.setSize(w, h);

        const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));

      bright.uniforms.px.value.set(1 / main.width, 1 / main.height);

          down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
          pass(down, lv[i]);
        }

        pass(blur, tmp[i]);
        blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);

const post = makePost();
function canvasTex(w, h, paint, o) {

}
const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.2, "rgba(255,255,255,.5)"); gr.addColorStop(.55, "rgba(255,255,255,.1)"); gr.addColorStop(1, "rgba(255,255,255,0)");

function glowSprite(color, scale) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(scale);
  return s;
}
/* ---------------- particles + shards ---------------- */
const PMAX = 3000;
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), pSize = new Float32Array(PMAX);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("size", new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const pointsMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { scale: { value: 600 } },
  vertexShader: "uniform float scale; attribute float size; attribute vec3 color; varying vec3 vC; void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = max(1.0, size * scale / -mv.z); gl_Position = projectionMatrix * mv; }",
  fragmentShader: "varying vec3 vC; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d); gl_FragColor = vec4(vC * a * a, 1.0); }"
});
const ptsMesh = new THREE.Points(pGeo, pointsMat);
ptsMesh.frustumCulled = false;
scene.add(ptsMesh);
const parts = [];
const C3 = (hex, k) => { const c = new THREE.Color(hex); return [c.r * k, c.g * k, c.b * k]; };
function burst(x, y, z, o) {
  o = o || {};

    const a = o.angle != null ? o.angle + rand(-1, 1) * (o.spread || 0.6) : Math.random() * TAU;

function updateParts(dt) {

// Debris: little panels of bodywork that tumble and fade.
const SMAX = 420;

const shards = [];
function shatter(x, y, z, color, n, vx) {
  const c = new THREE.Color(color);

    if (shards.length >= SMAX) shards.shift();

const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), e4 = new THREE.Euler(), v4 = new THREE.Vector3(), s4 = new THREE.Vector3();

    const s = shards[i];
    s.life -= dt;
    if (s.life <= 0) continue;
    s.vy -= 20 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;

// ribbon trails (thruster wakes)
const TV = 9000;
const tPos = new Float32Array(TV * 3), tCol = new Float32Array(TV * 3);
const tGeo = new THREE.BufferGeometry();
tGeo.setAttribute("position", new THREE.BufferAttribute(tPos, 3).setUsage(THREE.DynamicDrawUsage));
tGeo.setAttribute("color", new THREE.BufferAttribute(tCol, 3).setUsage(THREE.DynamicDrawUsage));

let tv = 0;

/* ---------------- tuning ---------------- */

function speckle(g, w, h, amt) {

    const n = (Math.random() - 0.5) * amt;

// Facades: a colour map and an emissive map (lit windows and LED trim only). Street buildings tile
// 6 x 8 windows over 14 m x 28 m; the megatowers tile 12 x 16 windows over 30 m x 60 m.
// Kinds: 0 habitat block, 1 glass tower, 2 neon district, 3 and 4 megatower skins.
const FAC_U = 14, FAC_V = 28, MEGA_U = 30, MEGA_V = 60;
function facade(kind) {
  const mega = kind >= 3, C = mega ? 12 : kind === 1 ? 8 : 10, R = mega ? 16 : 8, S = mega ? 512 : 256, SH = 512;
  const litP = [0.26, 0.3, 0.32, 0.3, 0.26][kind];
  const tints = [
    ["#ffd9a0", "#ffe7c4", "#9fd8ff", "#ffb0d8"],
    ["#cfe9ff", "#a9d6ff", "#e4f1ff", "#c3b4ff"],
    ["#ff8fd0", "#8ff6ff", "#ffd9a0", "#c9a2ff"],
    ["#bfe6ff", "#ffe2b0", "#8ff6ff", "#ffffff"],
    ["#ffd29a", "#ff9fce", "#ffe7c4", "#b8a6ff"]
  ][kind];
  const wall = ["#2a2930", "#111622", "#221a24", "#141826", "#1c141f"][kind];

    lit.push(Math.random() < litP); colors.push(PA.choice(tints)); alpha.push(rand(0.18, 0.7)); blinds.push(Math.random() < 0.35 ? rand(0.2, 0.6) : 0);
  }
  const cell = (x, y, cw, ch) => kind === 1 ? [x + 1.5, y + 3, cw - 3, ch - 6] : [x + cw * 0.14, y + ch * 0.18, cw * 0.72, ch * 0.6];
  const leds = (g, w, h, cw, ch) => {
    const t = Math.max(2, S / 128);
    g.fillStyle = led;
    if (kind === 2) for (let r = 1; r < R; r += 3) { g.fillStyle = ["#ff3fb0", "#2fe0ff", "#ffb21e"][r % 3]; g.fillRect(0, r * ch + ch - t * 1.5, w, t); }

    if (kind === 3) for (let c = 0; c < C; c += 4) g.fillRect(c * cw, 0, t, h);
    if (kind === 1) { g.globalAlpha = 0.45; for (let c = 0; c < C; c += 3) g.fillRect(c * cw, 0, t * 0.75, h); g.globalAlpha = 1; }
  };

      if (lit[i]) { g.globalAlpha = 0.4; g.fillStyle = colors[i]; g.fillRect(x, y, ww, hh); g.globalAlpha = 1; }

    }

      const wg = g.createLinearGradient(0, y, 0, y + hh);

}

// Neon blade signs. Half spell a word; half are written in an invented script: a few strokes on
// a 3 x 3 grid read as a foreign megacity without being any real language.
function glyph(g, cx, cy, s) {
  const p = (i) => -s / 2 + i * s / 3;
  g.save(); g.translate(cx, cy);
  g.lineWidth = Math.max(2, s * 0.11); g.lineCap = "square";
  g.beginPath();
  const n = randInt(3, 5);
  for (let k = 0; k < n; k++) {
    const t = Math.random();
    if (t < 0.36) { const y = p(randInt(0, 3)); g.moveTo(p(randInt(0, 1)), y); g.lineTo(p(randInt(2, 3)), y); }
    else if (t < 0.72) { const x = p(randInt(0, 3)); g.moveTo(x, p(randInt(0, 1))); g.lineTo(x, p(randInt(2, 3))); }
    else if (t < 0.86) g.rect(p(randInt(0, 2)), p(randInt(0, 2)), s / 3, s / 3);
    else { const x = p(randInt(0, 2)), y = p(randInt(0, 2)); g.moveTo(x, y + s / 3); g.lineTo(x + s / 3, y); }
  }
  g.stroke(); g.restore();
}

function towerOnSkyline(g, x, bw, bh, h, body, far) {
  const tiers = Math.random() < 0.45 ? randInt(2, 3) : 1;
  let tx = x, tw = bw, ty = h - bh;
  for (let t = 0; t < tiers; t++) {
    const th = t === tiers - 1 ? h - ty : (h - ty) * rand(0.15, 0.3);
    g.fillStyle = body; g.fillRect(tx, ty, tw, th);
    const win = PA.choice(["rgba(255,214,160,.8)", "rgba(170,225,255,.8)", "rgba(255,150,210,.7)", "rgba(255,255,255,.7)"]);
    g.fillStyle = win;

    if (t < tiers - 1) { const inset = tw * rand(0.1, 0.25); tx += inset; tw -= inset * 2; ty += th; }
  }
  // the very top of the tallest tier gets the trim
  const neon = PA.choice(NEON);
  g.fillStyle = neon;
  if (Math.random() < 0.4) { g.fillRect(x, h - bh, 2, bh); g.fillRect(x + bw - 2, h - bh, 2, bh); }
  if (Math.random() < 0.35) for (let y = h - bh + rand(10, 30); y < h; y += rand(30, 70)) g.fillRect(x, y, bw, 2);
  if (Math.random() < 0.25 && bw > 26) {
    const sw = bw * rand(0.5, 0.8), sh = rand(16, 50), sy = h - bh + rand(10, Math.max(12, bh * 0.5));
    const gr = g.createLinearGradient(0, sy, 0, sy + sh); gr.addColorStop(0, neon); gr.addColorStop(1, PA.choice(NEON));
    g.fillStyle = gr; g.fillRect(x + (bw - sw) / 2, sy, sw, sh);
  }
  if (bh > h * 0.45 && Math.random() < 0.6) {
    const sx = x + bw / 2;
    g.fillStyle = body; g.fillRect(sx - 1.5, h - bh - rand(20, 70), 3, 70);
    g.fillStyle = "#ff3b4e"; g.fillRect(sx - 2.5, h - bh - 72, 5, 4);
  }
}

// Hover car bodies are side profiles extruded across the car's width, with closed skirts, a glass
// canopy, LED light bars and glowing hover pads underneath. Every part is merged into one geometry
// with a group per material. Slots: 0 paint, 1 glass, 2 trim, 3 tail lights, 4 LED trim
function merge(parts) {
  const pos = [], nor = [], uv = [], groups = [];
  const v = new THREE.Vector3(), nm = new THREE.Matrix3();
  for (let mi = 0; mi < 8; mi++) {
    const start = pos.length / 3;
    for (const p of parts) {
      if (p.mat !== mi) continue;
      const g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
      const Pa = g.attributes.position, Na = g.attributes.normal, Ua = g.attributes.uv;
      nm.getNormalMatrix(p.m);
      for (let i = 0; i < Pa.count; i++) {
        v.fromBufferAttribute(Pa, i).applyMatrix4(p.m); pos.push(v.x, v.y, v.z);
        v.fromBufferAttribute(Na, i).applyMatrix3(nm).normalize(); nor.push(v.x, v.y, v.z);
        uv.push(Ua ? Ua.getX(i) : 0, Ua ? Ua.getY(i) : 0);

    if (count) groups.push([start, count, mi]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  for (const [s, c, m] of groups) geo.addGroup(s, c, m);

const CAR_SPECS = {

  coupe: { L: 4.5, W: 1.96, clear: 0.14, tail: 0.88, belt: 0.86, beltF: 0.8, hood: 0.68, nose: 0.46, gA: 0.95, gB: 1.9, gC: 2.7, gD: 3.35, roof: 1.18, wr: 0.34, axR: 0.95, axF: 3.62, wing: true, jets: true },
  sedan: { L: 4.9, W: 1.9, clear: 0.18, tail: 1.0, belt: 0.98, beltF: 0.92, hood: 0.84, nose: 0.62, gA: 0.7, gB: 1.45, gC: 3.0, gD: 3.55, roof: 1.42, wr: 0.34, axR: 1.0, axF: 3.9 },

function carParts(sp, withWheels) {

  body.lineTo(sp.gA, sp.belt);
  body.lineTo(sp.gD, sp.beltF);

    body.lineTo(sp.axR - ar, y0);

  parts.push(box(W * 0.7, 0.018, 0.03, 0, ty - 0.1, rz - 0.003, 4));             // and an LED line under it
  parts.push(box(W * 0.92, 0.14, 0.12, 0, y0 + 0.08, rz - 0.04, 2));             // diffuser
  parts.push(box(W * 0.78, 0.03, 0.03, 0, sp.nose - 0.12, -L / 2 - 0.065, 4));   // front light bar
  parts.push(box(0.1, 0.06, 0.16, -W / 2 - 0.02, sp.beltF + 0.05, zOf(sp.gD) + 0.1, 2), box(0.1, 0.06, 0.16, W / 2 + 0.02, sp.beltF + 0.05, zOf(sp.gD) + 0.1, 2)); // camera pods
  // LED sill strips along both flanks

    }

// Patrol drones: they match your height as they close in, then lock on with a beep. Make them commit, then move.
function mkPatrol(x) {

    const g = new THREE.Group();

    const dome = mesh(new THREE.SphereGeometry(0.55, 18, 10, 0, TAU, 0, Math.PI / 2), VM.glass); dome.position.y = 0.16;
    const ring = mesh(torusY, NEON_M[1]); ring.scale.setScalar(1.08); ring.position.y = -0.12;
    const r = sprite(OM.red, 1.5), b = sprite(OM.blue, 1.5);
    r.position.set(-0.7, 0.28, 0.5); b.position.set(0.7, 0.28, 0.5);
    const eye = sprite(OM.white, 1.6); eye.position.set(-1.0, -0.05, 0.3);
    const lamp = mesh(beamGeo, beamMat); lamp.scale.set(-12, 0.7, 0.7); lamp.position.set(-0.9, -0.05, 0);

  }
  const o = newOb("patrol", x - 1.2, x + 20, grp);

  o.trig = x - 30;
  o.upd = (dt, T, px, V, py) => {
    if (!o.act) {

      o.act = true;
      list.forEach((q, i) => { q.g.visible = true; q.y = n === 2 ? (i ? clamp(py - 4, 1.5, 9) : clamp(py + 4, 9, 16.5)) : clamp(py + rand(-3, 3), 1.5, 16.5); });
    }
    let x0 = Infinity, x1 = -Infinity;
    for (const q of list) {
      q.x += V * 0.3 * dt;
      const dx = q.x - px;
      if (!q.lock && dx < 11) { q.lock = true; PA.sfx("blip", { pitch: 1.6 }); }
      if (!q.lock) {
        const want = n === 2 ? q.y : clamp(py, 1.5, 16.5);
        q.y += clamp(want - q.y, -4.5 * dt, 4.5 * dt);

      q.r.material = s ? OM.red : OM.blue; q.b.material = s ? OM.blue : OM.red;

  };

}

const MAKERS = { tower: mkTower, billboard: mkBillboard, lift: mkLift, laser: mkLaser, crane: mkCrane, vent: mkVent, traffic: mkTraffic, patrol: mkPatrol };
const KIND_TIPS = {
  billboard: "Hardlight billboards: fly through the dim half",
  lift: "Freight lifts: slip past while the pod is away",
  laser: "Security lasers: thread the gap as the beam turns",
  crane: "Crane drones: mind the swinging container",
  vent: "Exhaust stacks blow you upward: cut the engine",
  traffic: "Traffic in the skyway: find the open lane",
  patrol: "Patrol drones lock on to your height: bait, then dodge"
};
const seenKinds = new Set();
let forceKind = null;
function pickKind() {
  if (forceKind) return forceKind;
  const k = zoneDef(zoneS).kinds;
  let sum = 0;
  for (const n in k) if (n !== lastKind || n === "tower") sum += k[n];
  let r = Math.random() * sum;
  for (const n in k) { if (n === lastKind && n !== "tower") continue; r -= k[n]; if (r <= 0) return n; }
  return "tower";
}
function spawnUntil(limit) {
  while (nextX < limit) {
    zoneS = Math.floor(nextX / ZONE_LEN);
    diff = clamp(nextX / 4200, 0, 1);
    const kind = spawned++ < 3 && !forceKind ? "tower" : pickKind();
    lastKind = kind;
    const end = MAKERS[kind](nextX);
    const o = obs[obs.length - 1];
    if (KIND_TIPS[kind] && !seenKinds.has(kind)) { seenKinds.add(kind); o.tip = KIND_TIPS[kind]; }
    o.blink = [];
    o.grp.traverse((c) => { if (c.isSprite && c.userData.blink != null) o.blink.push(c); });

}
function clearObs() {
  spawned = 0;

}

/* ---------------- state ---------------- */
let px = 0, py = 9, vy = 0, V = BASE_V, thr = 0, pitch = 0, roll = 0, simT = 0;
let score = 0, cleared = 0, cellsN = 0, closeCalls = 0, combo = 0, comboT = 0, shield = false, shieldK = 0, invT = 0;
let alive = true, started = false, overT = 0, overSent = false, demo = true, god = false, autoTest = false;
let boosting = false, cutting = false, wasBoost = false, wasCut = false, engine = 1, boostK = 0, hurt = 0, liftK = 0;
let zone = 0, tipT = 0, bannerT = 0, spin = 0;
let camX = 0, camY = 9, camD = 32;
const auto = { boost: false, cut: false };
const trails = [[], []];
const texts = new PA.Texts();
const hud = $("sk-hud"), banner = $("sk-banner"), hint = $("sk-hint");

}

function reset(demoMode) {

  demo = !!demoMode;

  } else { banner.classList.remove("on"); hint.classList.remove("on"); }
}
function updateCellsHud() {

}
function addText(x, y, text, color, size) {

const tmpV = new THREE.Vector3();
const jetW = [new THREE.Vector3(), new THREE.Vector3()];

function crash(why) {

  alive = false;
  overT = 1.5;
  vy = 5;
  spin = rand(-1, 1) < 0 ? -1 : 1;
  burst(px, py, 0, { n: 90, colors: [0xffb21e, 0xff4b3d, 0xffffff, 0xff2fa8], speed: 14, life: 1.1, size: 0.5, g: 6, drag: 1.2, vx: V * 0.4, bright: 3 });
  burst(px, py, 0, { n: 40, colors: [0x29f0ff, 0xffffff], speed: 22, life: 0.5, size: 0.25, g: 0, drag: 2 });
  shatter(px, py, 0, 0xffb400, 26, V * 0.5);
  shatter(px, py, 0, 0x22242c, 18, V * 0.5);

function hitShield(o) {

    burst(px + 2, py, 0, { n: 40, colors: [0xffb21e, 0xff4b3d, 0xffffff], speed: 12, life: 0.9, size: 0.4, g: 5, drag: 1.2 });

}
function closeCall(o, d) {

  closeCalls++;
  const b = 5 * combo;
  score += b;
  addText(px + 1, py + 1.4, (combo > 1 ? "CLOSE ×" + combo : "CLOSE") + "  +" + b, "#ffd27a", 17 + combo);

}
function collect(c) {

  score += 15;
  burst(c.x, c.y, 0, { n: 26, colors: [0x5affc8, 0xe8fff6, 0x29f0ff], speed: 8, life: 0.6, size: 0.3, g: 0, drag: 3 });

// Autopilot for the attract mode behind the title card: aim for the safe height of the next thing ahead.
function autopilot() {
  let next = null;
  for (const o of obs) if (o.x1 > px - HALF_L && (!next || o.x0 < next.x0)) next = o;
  let target = 9;
  if (next && next.safe) target = next.safe(simT + Math.max(0, (next.x0 - px) / V), py);
  const want = (target - py) * 2.4 - vy * 0.55;
  auto.boost = want > 1.0;
  auto.cut = want < -4.5;
}

function update(dt, T) {
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) banner.classList.remove("on"); }
  if (tipT > 0) { tipT -= dt; if (tipT <= 0) hint.classList.remove("on"); }
  if (PA.state === "gate" && !demo) reset(true);
  simT += dt;
  hurt = Math.max(0, hurt - dt * 1.6);
  texts.update(dt);
  easePalette(dt);

  if (!alive) {
    // the wreck tumbles into the lane below, trailing fire
    V *= Math.exp(-dt * 1.4);
    px += V * dt;
    vy -= 22 * dt; py += vy * dt;
    car.rotation.z += spin * dt * 5; car.rotation.x += dt * 3;
    if (py > -30 && Math.random() < 0.8) burst(px, py, 0, { n: 2, colors: [0xff7a2a, 0xffb21e, 0x553344], speed: 2, life: 0.6, size: 0.6, g: -3, drag: 1 });
    if (py < -6) car.visible = false;
    if (overT > 0) {
      overT -= dt;
      if (overT <= 0 && !overSent) {
        overSent = true;
        hud.classList.remove("on");
        PA.sfx("gameover");
        PA.gameOver(score, {
          title: cleared >= 70 ? "Skyway legend!" : cleared >= 30 ? "Hot pilot!" : "Wrecked!",
          stats: [["Cleared", cleared], ["Cells", cellsN], ["Close calls", closeCalls], ["Zone", zone + 1]]
        });
      }
    }
    for (const o of obs) if (o.upd) o.upd(dt, simT, px, V, py);
    return;
  }

  const ap = demo || autoTest;
  if (ap) autopilot();
  boosting = ap ? auto.boost : wantBoost();
  cutting = !boosting && (ap ? auto.cut : wantCut());
  if (!started && (boosting || cutting || autoTest)) started = true;
  if (boosting && !wasBoost) {
    vy = Math.max(vy, vy * 0.3 + 3);
    if (!demo) PA.sfx("whoosh", { pitch: 1.5, vol: 0.7 });
  }
  if (cutting && !wasCut && !demo) PA.tone({ freq: 340, to: 70, type: "sawtooth", dur: 0.22, vol: 0.05, filter: 1400 });
  if (!cutting && wasCut && !demo) PA.sfx("blip", { pitch: 0.7 });
  wasBoost = boosting; wasCut = cutting;

  if (!started) {
    // waiting for the first input: the lifters hold you level
    vy = lerp(vy, (9 + Math.sin(T * 2) * 0.4 - py) * 2, 1 - Math.exp(-dt * 4));
  } else if (boosting) vy = Math.min(BOOST_MAX, vy + BOOST_A * dt);
  else if (cutting) vy = Math.max(CUT_MAX, vy - CUT_A * dt);
  else { vy -= IDLE_G * dt; if (vy < IDLE_MAX) vy = lerp(vy, IDLE_MAX, 1 - Math.exp(-dt * 6)); }
  liftK = 0;
  for (const o of obs) if (o.lift) { const l = o.lift(px, py); if (l) { vy = Math.min(16, vy + l * dt); liftK = 1; } }
  py += vy * dt;

  zone = Math.floor(px / ZONE_LEN);
  const zd = zoneDef(zone);
  if (zd.name !== banner.dataset.zone) {
    banner.dataset.zone = zd.name;
    if (px > 10) {
      setPalette(zd);
      if (!demo) {
        score += 50;
        showBanner("ZONE " + (zone + 1), zd.name, zd.tip);
        PA.sfx("levelup");
        PA.stat("sk-zone", zone + 1);
      }
    }
  }
  const cruise = Math.min(TOP_V, BASE_V + px * 0.0016 + (zone >= ZONES.length ? 2 : 0));
  thr = demo ? 0 : wantThrottle();
  V = lerp(V, started ? cruise * (1 + 0.3 * thr) : 0, 1 - Math.exp(-dt * 2.2));
  px += V * dt;

  const tp = clamp(vy * 0.032, -0.3, 0.34);
  pitch = lerp(pitch, tp, 1 - Math.exp(-dt * 7));
  roll = lerp(roll, Math.sin(T * 1.3) * 0.04 + thr * 0.06 + (cutting ? 0.1 : 0), 1 - Math.exp(-dt * 4));
  if (invT > 0) invT -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

  for (const o of obs) if (o.upd) o.upd(dt, simT, px, V, py);

    let oc = Infinity;
    for (const s of o.shapes) {
      if (!s.on) continue;
      for (let i = 0; i < 7; i++) {
        const k = -HALF_L + HALF_L * i / 3, d = dist(s, px + ca * k, py + sa * k) - CAR_R;
        if (d < oc) oc = d;
      }
    }
    if (oc < o.clear) o.clear = oc;
    if (oc < 0 && invT <= 0 && !god && !demo) { if (shield) hitShield(o); else { crash(o.kind); return; } }
  }
  if (py - CAR_R < 0 || py + CAR_R > CEIL) {
    if (god || demo || invT > 0) { py = clamp(py, CAR_R, CEIL - CAR_R); vy *= -0.3; }
    else if (shield) { hitShield(null); py = clamp(py, CAR_R + 0.1, CEIL - CAR_R - 0.1); vy = py < 9 ? 7 : -5; }
    else { crash("lane"); return; }
  }
  for (const o of obs) {
    if (o.passed || !o.act || px - HALF_L <= o.x1) continue;
    o.passed = true;
    if (demo) continue;
    cleared++;
    score += 10;
    if (o.clear < 0.75 && o.clear > -0.01) closeCall(o, o.clear);
  }
  for (const c of cells) {
    if (c.got) continue;
    if (Math.hypot(c.x - px, c.y - py) < 1.35 && !demo) collect(c);
  }
  if (!demo) {
    for (const o of obs) if (o.tip && o.x0 - px < 30) { showHint(o.tip, 3.6); o.tip = null; }
    PA.stat("sk-score", score.toLocaleString());
  }

  // the world ahead, and clean-up behind
  const hw = viewHalfW(), cx = px + hw * 0.42;
  spawnUntil(cx + 95);
  for (let i = obs.length - 1; i >= 0; i--) if (obs[i].x1 < cx - hw - 30 && obs[i].passed) { disposeGroup(obs[i].grp); obs.splice(i, 1); }
  for (let i = cells.length - 1; i >= 0; i--) if (cells[i].got || cells[i].x < cx - hw - 20) { disposeGroup(cells[i].m); cells.splice(i, 1); }
  engineAudio(PA.state === "play" && !demo);
}

/* ---------------- engine audio ---------------- */
// A turbine whine over a low roar; the thrusters add a deep rumble, cutting the engine kills both.
const eng = { a: null };

    const nb = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), nd = nb.getChannelData(0);

  eng.bus.gain.setTargetAtTime(live ? 0.3 * PA.sfxVol * (0.25 + 0.75 * engine) : 0, now, 0.08);
  if (!live) return;
  const k = clamp(V / TOP_V, 0, 1), b = boosting ? 1 : 0;
  eng.roarF.frequency.setTargetAtTime(300 + k * 300 + b * 700, now, 0.12);
  eng.roar.gain.setTargetAtTime(0.18 + b * 0.6, now, 0.1);
  eng.o.frequency.setTargetAtTime(480 + k * 400 + b * 380 + vy * 8, now, 0.15);
  eng.oF.frequency.setTargetAtTime(1100 + k * 900 + b * 600, now, 0.15);
  eng.oG.gain.setTargetAtTime(0.02 * engine, now, 0.08);
}
PA.onPause && PA.onPause(() => engineAudio(false));

/* ---------------- rendering ---------------- */
post.comp.uniforms.strength.value = 0.62;
post.comp.uniforms.grain.value = 0.024;
const bufSize = new THREE.Vector2();
function resize3d() {
  renderer.setPixelRatio(dprCap());
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(bufSize);
  post.setSize(bufSize.x, bufSize.y);
  pointsMat.uniforms.scale.value = bufSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  // landscape: the whole skyway with room above and below; portrait: at least 24 units of it across
  const tv = Math.tan(THREE.MathUtils.degToRad(42) / 2);
  camD = Math.max(11.8 / tv, 12 / (tv * camera.aspect));
}
const view = PA.canvas($("fx"), { onResize: () => resize3d() });
const fx = view.ctx;
const tmpQ = new THREE.Vector3();

function render(T) {
  const dt = Math.min(0.05, Math.max(0, T - (render.last || T)));
  render.last = T;
  const hw = viewHalfW();
  // camera: the car sits a little left of centre with the skyway ahead of it
  const portrait = camera.aspect < 1;
  camX = lerp(camX, px + hw * (portrait ? 0.38 : 0.42) - thr * 1.2, 1 - Math.exp(-dt * 6));
  if (Math.abs(camX - px) > hw * 2) camX = px + hw * 0.42;
  const cy = portrait ? 9 : 9 + (clamp(py, 0, CEIL) - 9) * 0.22;
  camY = lerp(camY, cy, 1 - Math.exp(-dt * 3));
  const sh = PA.shakeOffset();
  boostK = lerp(boostK, alive && boosting ? 1 : 0, 1 - Math.exp(-dt * (boosting ? 10 : 4)));
  camera.fov = 42 + boostK * 2.2 + (V - BASE_V) * 0.1;
  camera.updateProjectionMatrix();
  camera.position.set(camX - 3.4 + sh.x * 0.06, camY + 1.7 + sh.y * 0.06, camD);
  camera.lookAt(camX - 0.9, camY, 0);

  // palette into the scene
  const F = pal.fog;
  scene.fog.color.setRGB(F.x, F.y, F.z);
  scene.background.setRGB(F.x, F.y, F.z);
  skyMat.uniforms.sun.value = pal.sun; skyMat.uniforms.time.value = T;
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  stars.material.opacity = 0.4 * (1 - pal.sun);
  rimA.color.copy(pal.rimA); rimB.color.copy(pal.rimB);
  hemi.color.setRGB(0.35 + pal.hor.x * 0.4, 0.3 + pal.hor.y * 0.4, 0.6 + pal.hor.z * 0.3);
  for (const m of skylines) {
    m.position.x = camX;
    m.material.map.offset.x = camX * 3 / SKY_W;
    m.material.color.setRGB(0.55 + pal.hor.x * 0.7, 0.55 + pal.hor.y * 0.7, 0.55 + pal.hor.z * 0.7).multiplyScalar(m.userData.k);
  }
  deck.position.x = camX; deckMat.uniforms.time.value = T;
  beaconMat.uniforms.time.value = T;
  M.holo.color.setScalar(1.6 * (0.92 + 0.08 * Math.sin(T * 31) * Math.sin(T * 7)));
  for (const r of rails) { r.position.x = camX; r.material.map.offset.x = camX / 16; }
  veil.position.x = camX; veil.material.color.setRGB(F.x, F.y, F.z);
  const nearRail = alive ? Math.max(1 - py / 3.5, 1 - (CEIL - py) / 3.5, 0) : 0;
  rails[0].material.color.set(0x29f0ff).multiplyScalar(0.9 + (py < 9 ? nearRail : 0) * 3 * (0.6 + 0.4 * Math.sin(T * 20)));
  rails[1].material.color.set(0xff2fa8).multiplyScalar(0.9 + (py > 9 ? nearRail : 0) * 3 * (0.6 + 0.4 * Math.sin(T * 20)));

  if (PA.state !== "play" || demo || alive) updateChunks(camX);
  updateAir(dt, camX);
  updateRain(dt, camX, camY, V);
  // lane traffic just below and above the skyway
  let maxU = -Infinity, maxL = -Infinity;
  for (const c of laneCars) if (c.upper) maxU = Math.max(maxU, c.x); else maxL = Math.max(maxL, c.x);
  for (const c of laneCars) {
    c.x += (c.upper ? -c.v : V * c.v) * dt;
    if (c.x < camX - hw - 12) { if (c.upper) { c.x = Math.max(maxU, camX + hw + 4) + rand(10, 20); maxU = c.x; } else { c.x = Math.max(maxL, camX + hw + 4) + rand(11, 22); maxL = c.x; } }
    c.m.position.set(c.x, (c.upper ? CEIL + 2.4 : -2.4) + Math.sin(T * 1.6 + c.bob) * 0.12, c.z);
  }
  for (const f of flyers) {
    f.x += f.dir * f.v * dt;
    if (f.x < camX - 100 || f.x > camX + 130) launchFlyer(f, camX, false);
    f.m.position.set(f.x, f.y + Math.sin(T + f.bob) * 0.3, f.z);
  }

  // obstacle dressing
  for (const o of obs) if (o.blink) for (const s of o.blink) s.visible = ((T * 1.1 + s.userData.blink) % 1) < 0.55;
  for (const c of cells) {
    c.m.rotation.y = T * 2 + c.ph; c.m.position.y = c.y + Math.sin(T * 3 + c.ph) * 0.18;
    c.m.userData.ring.rotation.x = Math.sin(T * 1.7 + c.ph) * 0.6;
  }

  // the car
  engine = lerp(engine, alive && cutting ? 0.1 : alive ? 1 : 0, 1 - Math.exp(-dt * (cutting ? 14 : 5)));
  car.position.set(px, py, 0);
  if (alive) { tilt.rotation.set(roll, 0, pitch); }
  const flick = alive && cutting ? (Math.random() < 0.15 ? 0.6 : 0) : 0;
  const en = Math.max(engine, flick);
  pAccent.color.set(0x29f0ff).multiplyScalar(0.4 + 3.6 * en);
  pTail.color.set(0xff1030).multiplyScalar(0.5 + 1.7 * en);
  for (const s of pods) { s.material.color.set(0x50e8ff).multiplyScalar(2.2 * en * (0.85 + 0.15 * Math.sin(T * 30))); s.scale.setScalar(1.1 * (0.6 + 0.4 * en)); }
  pHead.visible = en > 0.3;
  pTailGlow.material.color.set(0xff2040).multiplyScalar(1.8 * (0.3 + 0.7 * en));
  underLight.intensity = (22 + boostK * 30) * en;
  for (const f of flames) {
    const k = alive ? 0.25 * en + boostK * 1.2 : 0;
    f.core.scale.setScalar(0.4 + k * 0.9);
    f.core.material.color.set(0x9af2ff).multiplyScalar(1 + 2.5 * k);
    f.plume.scale.set(0.6 + k, 0.6 + k, 0.3 + k * 2.6 * (0.85 + 0.15 * Math.sin(T * 50)));
    f.plume.visible = k > 0.05;
  }
  plumeMat.uniforms.time.value = T;
  shieldK = lerp(shieldK, shield ? 1 : 0, 1 - Math.exp(-dt * 6));
  shieldMat.uniforms.a.value = shieldK * (0.55 + 0.15 * Math.sin(T * 5)) + (invT > 0 ? Math.max(0, invT - 0.6) * 1.5 : 0);
  shieldMat.uniforms.time.value = T;
  shieldMesh.visible = shieldMat.uniforms.a.value > 0.01;
  if (invT > 0 && alive) pBody.visible = (T * 16) % 1 < 0.6; else pBody.visible = true;

  // thruster wake, sparks and lifter shimmer
  tv = 0;
  car.updateMatrixWorld(true);
  for (let i = 0; i < 2; i++) {
    jetW[i].copy(jetLocal[i]).applyMatrix4(tilt.matrixWorld);
    const tr = trails[i];
    if (alive) tr.unshift(jetW[i].x, jetW[i].y, jetW[i].z); else if (tr.length) tr.splice(0, 3);
    if (tr.length > 66) tr.length = 66;
    const rev = [];
    for (let j = tr.length - 3; j >= 0; j -= 3) rev.push(tr[j], tr[j + 1], tr[j + 2]);
    const k = 0.25 + boostK * 1.6;
    ribbon(rev, [0.25 * k, 1.6 * k, 2.4 * k], 0.12 + boostK * 0.16, true);
  }
  tGeo.setDrawRange(0, tv);
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true;
  if (alive && PA.state !== "over") {
    if (boosting && Math.random() < 0.9) for (const j of jetW) burst(j.x, j.y, j.z, { n: 1, colors: [0x9af2ff, 0xffffff, 0x29f0ff], speed: 4, angle: Math.PI + pitch, spread: 0.3, life: 0.35, size: 0.22, g: 0, drag: 2, vx: -V * 0.2 });
    if (cutting && Math.random() < 0.3) burst(px + rand(-1, 1), py - 0.4, rand(-0.8, 0.8), { n: 1, colors: [0xffd27a, 0xff7a2a], speed: 3, life: 0.4, size: 0.12, g: 14 });
    if (liftK && Math.random() < 0.5) burst(px + rand(-1.2, 1.2), py - 0.5, rand(-1, 1), { n: 1, colors: [0xffb070, 0xffffff], speed: 2, angle: Math.PI / 2, spread: 0.4, life: 0.3, size: 0.25, g: -4 });
  }
  updateParts(dt);
  updateShards(dt);

  const pc = post.comp.uniforms;
  pc.hurt.value = hurt * 0.8;
  pc.chroma.value = 0.12 + boostK * 0.55 + hurt * 2;
  post.render(scene, camera, T);

  // HUD layer: floating text, warnings for traffic coming at you off-screen, drone lock-ons
  fx.clearRect(0, 0, view.w, view.h);
  if (!demo && alive && PA.state === "play") {
    for (const o of obs) {
      if (o.kind === "traffic" && o.head && o.act && !o.dead) for (const q of o.warn) {
        tmpQ.set(q.x - q.hl, q.y, q.z).project(camera);
        const sx = (tmpQ.x + 1) / 2 * view.w, sy = (1 - tmpQ.y) / 2 * view.h;
        if (sx < view.w + 8 || q.z < -1) continue;
        const a = 0.55 + 0.45 * Math.sin(T * 18);
        fx.save();
        fx.translate(view.w - 26, clamp(sy, 60, view.h - 60));
        fx.globalAlpha = a; fx.fillStyle = "#ffcf6a"; fx.shadowColor = "#ff8a2a"; fx.shadowBlur = 14;
        fx.beginPath(); fx.moveTo(-12, 0); fx.lineTo(8, -12); fx.lineTo(8, 12); fx.closePath(); fx.fill();
        fx.restore();
      }
      if (o.kind === "patrol" && o.act && !o.dead) for (const s of o.shapes) {
        tmpQ.set(s.x, s.y, 0).project(camera);
        const sx = (tmpQ.x + 1) / 2 * view.w, sy = (1 - tmpQ.y) / 2 * view.h, r = 22;
        if (sx > view.w || sx < 0) continue;
        fx.save(); fx.translate(sx, sy);
        fx.strokeStyle = s.x - px < 11 ? "#ff3a5a" : "rgba(140,200,255,.55)"; fx.lineWidth = 2; fx.shadowColor = fx.strokeStyle; fx.shadowBlur = 10;
        fx.rotate(s.x - px < 11 ? 0 : T * 2);
        for (let k = 0; k < 4; k++) { fx.rotate(Math.PI / 2); fx.beginPath(); fx.moveTo(r, -7); fx.lineTo(r, -r); fx.lineTo(7, -r); fx.stroke(); }
        fx.restore();
      }
    }
  }
  texts.draw(fx);
}

/* ---------------- boot ---------------- */
PA.onStart(() => reset(false));
reset(true);
PA.loop(update, render);

// test hooks
window.__sky = {
  state: () => ({ px, py, vy, V, score, cleared, cellsN, shield, alive, zone, demo, started, obs: obs.map((o) => o.kind + "@" + Math.round(o.x0)) }),
  god: (on) => { god = on !== false; },
  warp: (z) => {
    clearObs();
    px = z * ZONE_LEN + 4; nextX = px + 30; gapY = py;
    zone = z; setPalette(zoneDef(z), true); banner.dataset.zone = zoneDef(z).name;
    camX = px + viewHalfW() * 0.42;
    resetChunks(); updateChunks(camX, true); seedLaneCars(camX);
    for (const f of flyers) launchFlyer(f, camX, true);
    spawnUntil(camX + 95);
  },
  force: (kind) => { forceKind = kind || null; },
  spawn: (kind, ahead) => {
    clearObs(); nextX = px + (ahead || 22); forceKind = kind; spawnUntil(nextX + 1); forceKind = null;
  },
  setY: (y) => { py = y; vy = 0; },
  cells: (n) => { cellsN = n; updateCellsHud(); },
  shield: () => { shield = true; updateCellsHud(); },
  boost: (on) => { touch.boost = !!on; },
  cut: (on) => { touch.cut = !!on; },
  auto: (on) => { autoTest = on !== false; },
  step: (n, dt) => { for (let i = 0; i < n; i++) { update(dt || 1 / 60, simT); if (PA.state !== "play") break; } }
};
})();
</script>
</body></html>
