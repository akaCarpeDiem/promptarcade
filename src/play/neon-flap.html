<!DOCTYPE html>

<canvas id="c" aria-label="Ptero Flap playfield"></canvas>
<div class="pa-hud" id="nf-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat" id="s-gates"><small>Gaps</small><b>0</b></div>
  <div class="pa-stat coins" id="s-coins"><small>Amber</small><b>0</b></div>
</div>
<script>
window.paConfig = {
  slug: "neon-flap", title: "Ptero Flap", native: true, music: "bounce", unit: "points",
  controls: [["Space / tap", "Flap"], ["↑ / W", "Flap the top pterodactyl"], ["↓ / S / Space", "Flap the bottom pterodactyl"], ["Tap top / bottom half", "Flap that pterodactyl"]]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script>
(() => {
  const TAU = Math.PI * 2;
  const { rand, choice, clamp } = PA;
  const COL = { amber: "#ffb347", near: "#b6ff7a", ink: "#2a1840" };

  /* ---------- colour helpers ---------- */
  const rgb = (h) => { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
  function mix(a, b, t) { const A = rgb(a), B = rgb(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; }
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // Two pterodactyls: the sky-blue lead and a sunset-orange partner who joins when the flock splits.
  const PTERO = [
    { body: "#47b5f2", hi: "#a6e6ff", lo: "#1d6fc0", belly: "#c9f0ff", mem1: "#e2f65c", mem2: "#5cc6f4", crest: "#ff6f91", stripe: "#e04f7c", foot: "#ffd35c" },
    null,
    { body: "#ff9358", hi: "#ffd6a6", lo: "#cf552a", belly: "#ffe6c8", mem1: "#86f0d4", mem2: "#ff9b62", crest: "#7a5cff", stripe: "#b8452a", foot: "#ffe08a" }
  ];
  PTERO[1] = PTERO[0];
  const TWIN_COL = ["#6fd0ff", "#6fd0ff", "#ffa46a"];

  let W = 0, H = 0, S = 1, DPR = 1, TW = 1200;
  let scroll = 0, speed = 0, simT = 0;
  let gates = [];
  let score = 0, gatesPassed = 0, coinsGot = 0, nearMisses = 0, comboNear = 0;
  let spawnX = 0, overT = 0, overSent = false, started = false;
  let sky = null, far = null, mid = null, near = null, ground = null, fringe = null, mist = null, volc = null;
  let clouds = [], flock = [], flies = [], glints = [], debris = [], cloudArt = [], vignette = null;

  const playerX = () => W * 0.28;
  const birdR = () => 14 * S;
  const gateW = () => 68 * S;
  const floorY = () => H - 28 * S;
  const ceilY = () => 24 * S;
  const baseGap = () => clamp(H * 0.28, 150 * S, 240 * S);
  const minGap = () => clamp(H * 0.16, 96 * S, 140 * S);

  const view = PA.canvas(document.getElementById("c"), { onResize: layout });
  const ctx = view.ctx;
  const fx = new PA.Particles(700), texts = new PA.Texts();
  const hud = document.getElementById("nf-hud");

  function gapForRun() {
    return clamp(baseGap() - gatesPassed * 2.8, minGap(), baseGap());
  }
  function scrollSpeed() {
    // The split sky runs a little slower so two flyers stay fair.
    return (220 + gatesPassed * 5 + score * 0.015) * S * (mode === "twin" ? 0.86 : 1);
  }

  function layout(v) {
    W = v.w; H = v.h; DPR = v.dpr;
    S = clamp(Math.sqrt(W * H) / 820, 0.72, 1.35);
    TW = Math.ceil(Math.max(W, 700) * 1.3);
    buildWorld();
  }

  /* ================= the painted world =================
   * Every backdrop layer is painted once into an offscreen strip that tiles seamlessly, then
   * scrolled at its own parallax rate. Ridges use sums of sines with whole periods across the
   * tile, so the seam never shows. */
  function strip(y0, y1, res) {
    const r = Math.min(DPR, res), h = Math.max(1, y1 - y0);
    const c = document.createElement("canvas");
    c.width = Math.ceil(TW * r); c.height = Math.ceil(h * r);
    const g = c.getContext("2d");
    g.scale(r, r); g.translate(0, -y0);
    return { c, g, y0, y1 };
  }
  // draw a feature and its wrapped copy so features that straddle the tile edge stay seamless
  function wrap(x, w, fn) { fn(x); if (x - w < 0) fn(x + TW); if (x + w > TW) fn(x - TW); }
  function ridge(seed, k0, k1, amp, peaky) {
    const R = rng(seed), terms = [];
    for (let k = k0; k <= k1; k++) terms.push([k, R() * TAU, amp * (0.4 + R() * 0.6) / Math.sqrt(k)]);
    return (x) => {
      let y = 0;
      for (const [k, ph, a] of terms) y += peaky ? Math.abs(Math.sin(Math.PI * k * x / TW + ph)) * a : Math.sin(TAU * k * x / TW + ph) * a;
      return y;
    };
  }
  function fillRidge(g, f, base, y1, fill) {
    g.beginPath(); g.moveTo(0, y1);
    for (let x = 0; x <= TW; x += 6) g.lineTo(x, base - f(x));
    g.lineTo(TW, y1); g.closePath(); g.fillStyle = fill; g.fill();
  }

  function buildWorld() {
    const R = rng(7);
    /* sky: sunset gradient, early stars, a big low sun */
    {
      const c = document.createElement("canvas"), r = Math.min(DPR, 1);
      c.width = Math.ceil(W * r); c.height = Math.ceil(H * r);
      const g = c.getContext("2d"); g.scale(r, r);
      const lg = g.createLinearGradient(0, 0, 0, H);
      lg.addColorStop(0, "#232765"); lg.addColorStop(0.3, "#4f3f93"); lg.addColorStop(0.5, "#a85f9e");
      lg.addColorStop(0.66, "#f08f8e"); lg.addColorStop(0.8, "#ffbd88"); lg.addColorStop(1, "#ffe0a6");
      g.fillStyle = lg; g.fillRect(0, 0, W, H);
      for (let i = 0; i < Math.min(160, W * H / 6000); i++) {
        const y = Math.pow(R(), 1.6) * H * 0.42;
        g.globalAlpha = (1 - y / (H * 0.42)) * (0.35 + R() * 0.6);
        g.fillStyle = "#fff8e8"; g.beginPath(); g.arc(R() * W, y, (0.5 + R() * 1.1) * S, 0, TAU); g.fill();
      }
      g.globalAlpha = 1;
      const sx = W * 0.72, sy = H * 0.5;
      let rg = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.55);
      rg.addColorStop(0, "rgba(255,236,190,.75)"); rg.addColorStop(0.25, "rgba(255,190,140,.3)"); rg.addColorStop(1, "rgba(255,160,140,0)");
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
      rg = g.createRadialGradient(sx, sy, 0, sx, sy, 60 * S);
      rg.addColorStop(0, "#fffbe8"); rg.addColorStop(0.7, "#fff0c4"); rg.addColorStop(0.86, "rgba(255,226,170,.6)"); rg.addColorStop(1, "rgba(255,210,160,0)");
      g.fillStyle = rg; g.beginPath(); g.arc(sx, sy, 60 * S, 0, TAU); g.fill();
      sky = c;
    }
    const fy = floorY();
    /* far: two hazy mountain ranges and a smoking volcano */
    far = strip(H * 0.28, fy, 1);
    {
      const g = far.g, back = ridge(11, 2, 7, 70 * S, true), front = ridge(23, 3, 9, 52 * S, true);
      const vx = TW * 0.34, vy = H * 0.36, vb = H * 0.66, bw = 190 * S, tw = 30 * S;
      let lg = g.createLinearGradient(0, H * 0.42, 0, fy);
      lg.addColorStop(0, "#a993d6"); lg.addColorStop(1, "#f4c0c0");
      fillRidge(g, back, H * 0.6, fy, lg);
      // volcano cone
      lg = g.createLinearGradient(vx - bw, 0, vx + bw, 0);
      lg.addColorStop(0, "#8670b8"); lg.addColorStop(0.55, "#a88bc8"); lg.addColorStop(1, "#c8a0c4");
      g.fillStyle = lg;
      g.beginPath(); g.moveTo(vx - bw, vb + 40 * S);
      g.bezierCurveTo(vx - bw * 0.45, vb - 20 * S, vx - tw * 1.6, vy + 30 * S, vx - tw, vy);
      g.quadraticCurveTo(vx, vy + 8 * S, vx + tw, vy);
      g.bezierCurveTo(vx + tw * 1.6, vy + 30 * S, vx + bw * 0.45, vb - 20 * S, vx + bw, vb + 40 * S);
      g.closePath(); g.fill();
      lg = g.createLinearGradient(0, vy, 0, vb);
      lg.addColorStop(0, "rgba(255,240,230,.0)"); lg.addColorStop(1, "rgba(255,210,200,.45)");
      g.fillStyle = lg; g.fill();
      // lava runs, glowing
      g.save(); g.shadowColor = "#ff7a3c"; g.shadowBlur = 10 * S; g.lineCap = "round";
      for (const [dx, len, wob] of [[-0.4, 0.55, 1], [0.15, 0.75, -1], [0.55, 0.42, 1]]) {
        const lg2 = g.createLinearGradient(0, vy, 0, vy + (vb - vy) * len);
        lg2.addColorStop(0, "rgba(255,170,90,1)"); lg2.addColorStop(1, "rgba(255,90,60,0)");
        g.strokeStyle = lg2; g.lineWidth = 3.2 * S;
        g.beginPath(); g.moveTo(vx + dx * tw, vy + 2 * S);
        g.bezierCurveTo(vx + dx * tw + wob * 10 * S, vy + (vb - vy) * len * 0.35, vx + dx * tw * 3 - wob * 8 * S, vy + (vb - vy) * len * 0.7, vx + dx * tw * 4.5, vy + (vb - vy) * len);
        g.stroke();
      }
      g.restore();
      const cr = g.createRadialGradient(vx, vy, 0, vx, vy, 34 * S);
      cr.addColorStop(0, "rgba(255,200,120,.95)"); cr.addColorStop(0.4, "rgba(255,120,70,.6)"); cr.addColorStop(1, "rgba(255,90,60,0)");
      g.fillStyle = cr; g.beginPath(); g.arc(vx, vy, 34 * S, 0, TAU); g.fill();
      volc = { x: vx, y: vy };
      lg = g.createLinearGradient(0, H * 0.5, 0, fy);
      lg.addColorStop(0, "#8b76c0"); lg.addColorStop(1, "#e2a8ba");
      fillRidge(g, front, H * 0.7, fy, lg);
    }
    /* mid: rolling hills with cycads, warm rim light along the crests */
    mid = strip(H * 0.46, fy, 1);
    {
      const g = mid.g, f = ridge(41, 2, 8, 46 * S, false), base = H * 0.72, R2 = rng(43);
      const lg = g.createLinearGradient(0, H * 0.6, 0, fy);
      lg.addColorStop(0, "#6c62ae"); lg.addColorStop(1, "#b07fae");
      fillRidge(g, f, base, fy, lg);
      g.strokeStyle = "rgba(255,196,160,.6)"; g.lineWidth = 2.2 * S;
      g.beginPath(); for (let x = 0; x <= TW; x += 6) x ? g.lineTo(x, base - f(x) + 1) : g.moveTo(x, base - f(x) + 1); g.stroke();
      for (let i = 0; i < TW / (70 * S); i++) {
        const x = R2() * TW, h = (30 + R2() * 46) * S, sc = 0.7 + R2() * 0.6;
        wrap(x, 40 * S, (xx) => cycad(g, xx, base - f(x) + 4 * S, h, sc, "#58509a", "rgba(255,190,160,.45)"));
      }
      const hz = g.createLinearGradient(0, base, 0, fy);
      hz.addColorStop(0, "rgba(255,190,170,0)"); hz.addColorStop(1, "rgba(255,190,170,.35)");
      g.fillStyle = hz; g.fillRect(0, base - 60 * S, TW, fy - base + 60 * S);
    }
    /* near: jungle canopy, palms and a sunset lake */
    near = strip(H * 0.52, fy, 1.25);
    {
      const g = near.g, f = ridge(61, 3, 11, 34 * S, false), lakeY = fy - 30 * S, R3 = rng(67);
      const top = (x) => H * 0.74 - f(x);
      // palms behind the canopy
      for (let i = 0; i < TW / (190 * S); i++) {
        const x = R3() * TW;
        wrap(x, 90 * S, (xx) => palm(g, xx, lakeY, top(x) - (50 + R3() * 70) * S, R3() < 0.5 ? -1 : 1));
      }
      const rows = [
        [0, 0.9, ["#2a5a5e", "#3f7c6e", "#1e4148"], 0.3],
        [22 * S, 1, ["#2f6a5e", "#4d9673", "#20494a"], 0.5],
        [62 * S, 1.05, ["#2e7258", "#58a676", "#1f4d42"], 0.45],
        [100 * S, 1.1, ["#337c50", "#6ab878", "#22533c"], 0.4]
      ];
      rows.forEach(([dy, k, cols, rim], ri) => {
        if (ri === 2) { g.fillStyle = "#1f4a44"; g.fillRect(0, H * 0.74 + 30 * S, TW, lakeY - H * 0.74 - 30 * S + 1); }
        for (let x = -30 * S; x < TW + 30 * S; x += (22 + R3() * 18) * S * k) {
          const r = (24 + R3() * 24) * S * k, cy = top(((x % TW) + TW) % TW) + dy + r * 0.55;
          wrap(x, r, (xx) => bush(g, xx, cy, r, cols, rim));
        }
      });
      const wl = g.createLinearGradient(0, lakeY, 0, fy);
      wl.addColorStop(0, "#f6b890"); wl.addColorStop(0.5, "#d595a6"); wl.addColorStop(1, "#7d6cb2");
      g.fillStyle = wl; g.fillRect(0, lakeY, TW, fy - lakeY + 2);
      g.fillStyle = "rgba(31,68,70,.55)"; g.fillRect(0, lakeY, TW, 5 * S);
      near.lakeY = lakeY;
    }
    /* ground: grassy bank, ferns, glowing mushrooms, pebbles */
    ground = strip(fy - 40 * S, H, 2);
    {
      const g = ground.g, R4 = rng(81), f = ridge(83, 6, 18, 2.4 * S, false);
      const dg = g.createLinearGradient(0, fy, 0, H);
      dg.addColorStop(0, "#5f3b2b"); dg.addColorStop(1, "#33201b");
      g.fillStyle = dg; g.fillRect(0, fy, TW, H - fy);
      for (let i = 0; i < TW / (16 * S); i++) {
        g.fillStyle = R4() < 0.5 ? "rgba(140,96,74,.6)" : "rgba(40,24,20,.5)";
        g.beginPath(); g.ellipse(R4() * TW, fy + 10 * S + R4() * (H - fy), (2 + R4() * 3) * S, (1.5 + R4() * 2) * S, 0, 0, TAU); g.fill();
      }
      for (let i = 0; i < TW / (120 * S); i++) {
        const x = R4() * TW;
        wrap(x, 30 * S, (xx) => fern(g, xx, fy + 2 * S, (18 + R4() * 16) * S, R4() < 0.5 ? "#2f8a45" : "#3c9e4a"));
      }
      // grass lip
      const gg = g.createLinearGradient(0, fy - 6 * S, 0, fy + 12 * S);
      gg.addColorStop(0, "#9be05a"); gg.addColorStop(0.5, "#5fb544"); gg.addColorStop(1, "#3c8236");
      g.fillStyle = gg;
      g.beginPath(); g.moveTo(0, fy + 12 * S);
      for (let x = 0; x <= TW; x += 4 * S) g.lineTo(x, fy - 3 * S - f(x));
      for (let x = TW; x >= 0; x -= 7 * S) g.lineTo(x, fy + 11 * S + Math.abs(Math.sin(x * 0.21)) * 4 * S);
      g.closePath(); g.fill();
      g.strokeStyle = "#b8f27a"; g.lineWidth = 1.6 * S; g.lineCap = "round";
      for (let x = 2; x < TW; x += (5 + R4() * 7) * S) {
        const h = (4 + R4() * 7) * S, y = fy - 2 * S - f(x);
        g.beginPath(); g.moveTo(x, y + 2 * S); g.quadraticCurveTo(x + 1 * S, y - h * 0.6, x + (R4() - 0.4) * 5 * S, y - h); g.stroke();
      }
      for (let i = 0; i < TW / (160 * S); i++) {
        const x = R4() * TW, c = R4() < 0.5 ? "#ff8fd0" : "#8ff1ff", n = 1 + (R4() * 3 | 0);
        for (let j = 0; j < n; j++) wrap(x + j * 7 * S, 12 * S, (xx) => shroom(g, xx, fy + 1 * S, (4 + R4() * 4) * S, c));
      }
      for (let i = 0; i < TW / (230 * S); i++) {
        const x = R4() * TW, r = (7 + R4() * 7) * S;
        wrap(x, r, (xx) => { const sg = g.createLinearGradient(xx - r, fy - r, xx + r, fy); sg.addColorStop(0, "#7a6d96"); sg.addColorStop(1, "#c3b4d8"); g.fillStyle = sg; g.beginPath(); g.ellipse(xx, fy + 2 * S, r, r * 0.7, 0, Math.PI, 0); g.fill(); });
      }
    }
    /* top fringe: overhanging jungle leaves that mark the ceiling */
    fringe = strip(0, 46 * S, 2);
    {
      const g = fringe.g, R5 = rng(91);
      g.fillStyle = "#1c4636"; g.fillRect(0, 0, TW, 10 * S);
      for (let x = -10 * S; x < TW + 10 * S; x += (10 + R5() * 10) * S) {
        const len = (16 + R5() * 16) * S, w = (7 + R5() * 5) * S, a = (R5() - 0.5) * 0.5;
        wrap(x, w * 2, (xx) => leaf(g, xx, 4 * S, len, w, Math.PI / 2 + a, R5() < 0.5 ? "#24583f" : "#2d6a48", "#4f9a63"));
      }
      for (let i = 0; i < TW / (90 * S); i++) {
        const x = R5() * TW, len = (22 + R5() * 18) * S;
        wrap(x, 8 * S, (xx) => { g.strokeStyle = "#2f6b3c"; g.lineWidth = 1.6 * S; g.beginPath(); g.moveTo(xx, 0); g.quadraticCurveTo(xx + 4 * S, len * 0.6, xx - 2 * S, len); g.stroke(); leaf(g, xx - 2 * S, len - 2 * S, 7 * S, 4 * S, Math.PI / 2, "#3f8a4e", "#7fcf74"); });
      }
    }
    /* mist band for the split: drawn where the two skies meet */
    mist = strip(-30 * S, 30 * S, 1.5);
    {
      const g = mist.g, R6 = rng(97);
      for (let x = -20 * S; x < TW + 20 * S; x += (9 + R6() * 9) * S) {
        const r = (11 + R6() * 13) * S, y = (R6() - 0.5) * 10 * S;
        wrap(x, r, (xx) => {
          const cg = g.createLinearGradient(0, y - r, 0, y + r);
          cg.addColorStop(0, "rgba(255,250,246,.95)"); cg.addColorStop(1, "rgba(238,176,196,.9)");
          g.fillStyle = cg; g.beginPath(); g.arc(xx, y, r, 0, TAU); g.fill();
        });
      }
    }
    /* puffy cartoon clouds, lit pink from below by the sunset */
    cloudArt = [];
    for (let i = 0; i < 3; i++) {
      const R8 = rng(200 + i), w = 280 * S, h = 120 * S, r = Math.min(DPR, 1.5), base = h * 0.8;
      const c = document.createElement("canvas"); c.width = Math.ceil(w * r); c.height = Math.ceil(h * r);
      const g = c.getContext("2d"); g.scale(r, r);
      const puffs = [];
      for (let x = 34 * S; x < w - 34 * S;) { const pr = (20 + R8() * 30) * S * (1 - Math.abs(x / w - 0.5) * 0.9); puffs.push([x, base - pr * 0.55 - R8() * 10 * S, pr]); x += pr * 0.85; }
      g.save(); g.beginPath(); g.rect(0, 0, w, base); g.clip();
      const cg = g.createLinearGradient(0, base - 70 * S, 0, base);
      cg.addColorStop(0, "#fff8f2"); cg.addColorStop(0.55, "#ffdcd8"); cg.addColorStop(1, "#f0a8c0");
      g.fillStyle = cg;
      for (const [x, y, pr] of puffs) { g.beginPath(); g.arc(x, y, pr, 0, TAU); g.fill(); }
      g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 2.5 * S;
      for (const [x, y, pr] of puffs) { g.beginPath(); g.arc(x, y, pr - 2 * S, -2.4, -1.1); g.stroke(); }
      g.restore();
      cloudArt.push({ c, w, h });
    }
    /* soft film vignette */
    {
      const c = document.createElement("canvas"), r = Math.min(DPR, 1);
      c.width = Math.ceil(W * r); c.height = Math.ceil(H * r);
      const g = c.getContext("2d"); g.scale(r, r);
      const vg = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
      vg.addColorStop(0, "rgba(40,20,70,0)"); vg.addColorStop(1, "rgba(40,20,70,.38)");
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
      vignette = c;
    }
    /* animated extras */
    const R7 = rng(101);
    clouds = [];
    for (let i = 0; i < 6; i++) clouds.push({ x: R7() * (W + 400 * S), y: H * (0.08 + R7() * 0.3), s: (0.6 + R7() * 0.9) * S, par: 0.02 + R7() * 0.03, seed: R7() * 99 });
    flock = [];
    for (let i = 0; i < 4; i++) flock.push({ x: R7() * W, y: H * (0.18 + R7() * 0.16), s: (0.5 + R7() * 0.5) * S, ph: R7() * TAU, v: (10 + R7() * 14) * S });
    flies = [];
    for (let i = 0; i < 14; i++) flies.push({ x: R7() * TW, y: H * 0.62 + R7() * (fy - H * 0.62), ph: R7() * TAU, sp: 0.6 + R7() * 1.4 });
    glints = [];
    for (let i = 0; i < 30; i++) glints.push({ x: R7() * TW, y: near.lakeY + 6 * S + R7() * 20 * S, w: (6 + R7() * 18) * S, ph: R7() * TAU });
  }

  /* ---------- painting kit for the backdrop ---------- */
  function leaf(g, x, y, len, w, ang, c1, c2) {
    g.save(); g.translate(x, y); g.rotate(ang);
    const lg = g.createLinearGradient(0, -w, 0, w);
    lg.addColorStop(0, c2); lg.addColorStop(1, c1);
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.45, -w, len, 0); g.quadraticCurveTo(len * 0.45, w, 0, 0); g.fill();
    g.strokeStyle = "rgba(0,0,0,.15)"; g.lineWidth = 0.8; g.beginPath(); g.moveTo(len * 0.1, 0); g.lineTo(len * 0.85, 0); g.stroke();
    g.restore();
  }
  function cycad(g, x, y, h, sc, col, rim) {
    g.strokeStyle = col; g.lineWidth = 4 * S * sc; g.lineCap = "round";
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 4 * S, y - h * 0.5, x, y - h); g.stroke();
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i - 2.5) * 0.48, L = (22 + (i % 2) * 6) * S * sc;
      g.lineWidth = 3 * S * sc; g.strokeStyle = col;
      g.beginPath(); g.moveTo(x, y - h);
      g.quadraticCurveTo(x + Math.cos(a) * L * 0.6, y - h + Math.sin(a) * L * 0.6 - 6 * S, x + Math.cos(a) * L, y - h + Math.sin(a) * L + 8 * S); g.stroke();
      if (i > 2) { g.strokeStyle = rim; g.lineWidth = 1.2 * S; g.stroke(); }
    }
  }
  function palm(g, x, base, topY, dir) {
    g.lineCap = "round";
    const lg = g.createLinearGradient(x - 6 * S, 0, x + 6 * S, 0);
    lg.addColorStop(0, "#1f3f44"); lg.addColorStop(1, "#3c5e5a");
    g.strokeStyle = lg; g.lineWidth = 7 * S;
    const tx = x + dir * 22 * S;
    g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x - dir * 6 * S, (base + topY) / 2, tx, topY); g.stroke();
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + (i - 3) * 0.55, L = 44 * S;
      g.strokeStyle = i % 2 ? "#2c6156" : "#367263"; g.lineWidth = 5 * S;
      g.beginPath(); g.moveTo(tx, topY);
      g.quadraticCurveTo(tx + Math.cos(a) * L * 0.7, topY + Math.sin(a) * L * 0.7 - 10 * S, tx + Math.cos(a) * L, topY + Math.sin(a) * L + 16 * S); g.stroke();
      if (i >= 4) { g.strokeStyle = "rgba(255,200,150,.4)"; g.lineWidth = 1.4 * S; g.stroke(); }
    }
  }
  function bush(g, x, y, r, cols, rim) {
    const rg = g.createRadialGradient(x + r * 0.35, y - r * 0.45, r * 0.1, x, y, r);
    rg.addColorStop(0, cols[1]); rg.addColorStop(0.7, cols[0]); rg.addColorStop(1, cols[2]);
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.strokeStyle = "rgba(255,196,140," + rim + ")"; g.lineWidth = 2 * S;
    g.beginPath(); g.arc(x, y, r - 1.5 * S, -1.25, -0.2); g.stroke();
  }
  function fern(g, x, y, h, col) {
    g.lineCap = "round";
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.42, L = h * (1 - Math.abs(i - 2) * 0.15);
      const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
      g.strokeStyle = col; g.lineWidth = 1.8 * S;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * L * 0.5 + (i - 2) * 3 * S, y + Math.sin(a) * L * 0.6, ex, ey); g.stroke();
      for (let k = 0.25; k < 1; k += 0.16) {
        const px = x + (ex - x) * k, py = y + (ey - y) * k, s = (1 - k) * 6 * S + 2 * S;
        leaf(g, px, py, s, s * 0.35, a - 0.9, col, "#7fd06a");
        leaf(g, px, py, s, s * 0.35, a + 0.9, col, "#7fd06a");
      }
    }
  }
  function shroom(g, x, y, r, c) {
    g.fillStyle = "#f4e6d0"; g.fillRect(x - r * 0.22, y - r * 1.3, r * 0.44, r * 1.3);
    g.save(); g.shadowColor = c; g.shadowBlur = 8 * S;
    const cg = g.createRadialGradient(x - r * 0.3, y - r * 1.6, 0, x, y - r * 1.3, r * 1.1);
    cg.addColorStop(0, "#fff"); cg.addColorStop(0.35, c); cg.addColorStop(1, mix(c.length === 7 ? c : "#ff8fd0", "#2a1840", 0.35));
    g.fillStyle = cg; g.beginPath(); g.ellipse(x, y - r * 1.3, r, r * 0.65, 0, Math.PI, 0); g.fill();
    g.restore();
    g.fillStyle = "rgba(255,255,255,.75)";
    g.beginPath(); g.arc(x - r * 0.35, y - r * 1.55, r * 0.14, 0, TAU); g.arc(x + r * 0.3, y - r * 1.65, r * 0.1, 0, TAU); g.fill();
  }

  /* ================= gates and the flock ================= */
  // The twist: twin flyers. After the opening gaps the pterodactyl's partner joins and the sky splits
  // in two at a band of mist: one flyer in each half, each with its own gaps and its own flap
  // button. Every ten gap pairs they regroup for a short breather, then split again.
  const SOLO_FIRST = 6, TWIN_RUN = 10, SOLO_RUN = 4, SPACING = 280, TRANS_GAP = 620, TRANS_TIME = 0.7;
  let birds = [], markers = [], spawnIdx = 0, mode = "solo", trans = null, splits = 0, twinGates = 0, keyHintT = 0, crashed = null;

  const midY = () => (ceilY() + floorY()) / 2;
  function laneBounds(lane) {
    const pad = 5 * S;
    if (lane === 1) return [ceilY(), midY() - pad];
    if (lane === 2) return [midY() + pad, floorY()];
    return [ceilY(), floorY()];
  }
  function modeAt(i) {
    if (i < SOLO_FIRST) return "solo";
    return (i - SOLO_FIRST) % (TWIN_RUN + SOLO_RUN) < TWIN_RUN ? "twin" : "solo";
  }
  function gapFor(lane) {
    if (!lane) return gapForRun();
    const [a, b] = laneBounds(lane), lh = b - a;
    return clamp(lh * 0.56 - twinGates * 0.9, Math.max(lh * 0.38, birdR() * 5.4), lh * 0.56);
  }

  function newBird(y, lane) {
    return { y, vy: 0, rot: 0, alive: true, lane, fromY: y, ty: y, hover: 0, flapT: 1, blink: rand(2, 5) };
  }

  function reset() {
    scroll = 0; simT = 0; speed = scrollSpeed();
    score = 0; gatesPassed = 0; coinsGot = 0; nearMisses = 0; comboNear = 0;
    gates = []; markers = []; debris = []; overT = 0; overSent = false; started = false;
    spawnIdx = 0; mode = "solo"; trans = null; splits = 0; twinGates = 0; keyHintT = 0; crashed = null;
    fx.clear(); texts.clear();
    birds = [newBird(H * 0.46, 0)];
    spawnX = W + 80 * S;
    spawnNext(spawnX);
    for (let i = 0; i < 3; i++) spawnNext(spawnX + (SPACING + rand(-20, 40)) * S);
    PA.music.intensity(0);
    hud.classList.add("on");
    paintHud();
  }

  function paintHud() {
    PA.stat("s-score", score.toLocaleString());
    PA.stat("s-gates", gatesPassed);
    PA.stat("s-coins", coinsGot);
  }

  const LEAVES = [["#3f9a45", "#8fdc5a", "#21602f"], ["#3a8f5a", "#86d68a", "#1f5a3a"], ["#4f9a3a", "#b4e264", "#2a6a2a"]];
  const DINOS = [{ body: "#7cc46a", hi: "#b8ec8a", lo: "#4a8a46", belly: "#e2f4a8", spot: "#5aa04e" }, { body: "#a58be2", hi: "#d4c4ff", lo: "#6f58b0", belly: "#f4e2ff", spot: "#8a6cc8" }, { body: "#6cc2c0", hi: "#aaf0e6", lo: "#3d8a90", belly: "#e0fff2", spot: "#4aa0a0" }];
  function piece(kind) {
    const p = { kind, seed: rand(0, 1000), ph: rand(TAU) };
    if (kind === "tree" || kind === "branch") {
      p.pal = choice(LEAVES);
      p.blobs = [[0, 0.05, 0.62], [-0.48, 0.18, 0.46], [0.48, 0.2, 0.46], [-0.24, -0.38, 0.5], [0.26, -0.36, 0.48], [0, -0.48, 0.5], [0, 0.42, 0.5]]
        .map(([x, y, r]) => [x + rand(-0.05, 0.05), y + rand(-0.04, 0.04), r * rand(0.92, 1.04)]);
    }
    if (kind === "bronto") { p.pal = choice(DINOS); p.blink = rand(1, 4); }
    if (kind === "vines") p.flower = choice(["#ff7fb8", "#ffd35c", "#ff9b62"]);
    return p;
  }

  function spawnGate(x, lane) {
    const [lt, lb] = laneBounds(lane);
    const gh = gapFor(lane);
    const m = gh / 2 + (lane ? 16 : 60) * S;
    const gmin = lt + m;
    let gmax = Math.max(lt + m, lb - m);
    const move = gatesPassed > 2 && Math.random() < (lane ? 0.3 + Math.min(0.3, twinGates * 0.01) : 0.55 + Math.min(0.35, gatesPassed * 0.02));
    const vy = lane ? 28 : 48;
    // Pick obstacles that make sense for the gap: a bronto stands on the ground and needs room to
    // raise its head, and only stretchy things (a bronto's neck, a dangling web or vines) ride a
    // moving gap.
    const brontoMax = floorY() - 110 * S - gh / 2;
    const bronto = lane !== 1 && brontoMax > gmin + 10 * S && Math.random() < (move ? 0.7 : 0.38);
    if (bronto) gmax = Math.min(gmax, brontoMax);
    const gapY = rand(gmin, gmax);
    const topKind = move ? choice(["web", "vines"]) : choice(["branch", "branch", "web", "vines"]);
    const botKind = bronto ? "bronto" : move ? "tree" : choice(["tree", "tree", "rock"]);
    gates.push({
      x, lane, gapY, gapH: gh,
      gapVy: move && gmax > gmin ? rand(-vy, vy) * S : 0,
      gapMin: gmin, gapMax: gmax,
      scored: false, nearAward: false,
      top: piece(topKind), bot: piece(botKind),
      coins: makeCoins(x, gapY, gh)
    });
  }
  function spawnNext(x) {
    const m = modeAt(spawnIdx), prev = spawnIdx ? modeAt(spawnIdx - 1) : m;
    if (m !== prev) {
      // Leave a clear stretch for the split or regroup to happen in.
      markers.push({ x: x - 40 * S, to: m });
      x += TRANS_GAP * S;
    }
    if (m === "twin") { spawnGate(x, 1); spawnGate(x + SPACING * S * 0.5, 2); }
    else spawnGate(x, 0);
    spawnX = x;
    spawnIdx++;
  }

  function makeCoins(gx, gy, gh) {
    const out = [];
    if (Math.random() < 0.72) {
      const n = Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        out.push({
          x: gx + gateW() * 0.55 + (i - (n - 1) / 2) * 22 * S,
          y: gy + rand(-gh * 0.22, gh * 0.22),
          r: 8 * S,
          got: false,
          ph: rand(TAU)
        });
      }
    }
    return out;
  }

  function beginTransition(to) {
    if (to === mode) return;
    mode = to;
    if (to === "twin") {
      splits++;
      const y = birds[0].y, [a1, b1] = laneBounds(1), [a2, b2] = laneBounds(2);
      birds = [newBird(y, 1), newBird(y, 2)];
      birds[0].ty = (a1 + b1) / 2; birds[1].ty = (a2 + b2) / 2;
      texts.add(W / 2, H * 0.5, "SPLIT!", { color: "#fff6e0", size: 34, life: 1.1, vy: -20 });
      keyHintT = splits === 1 ? 4.5 : 2;
      PA.sfx("power");
      squawk(1.25);
      PA.flash("rgba(255,240,220,.2)", 240);
    } else {
      const ys = birds.map(b => b.y);
      birds = [newBird(ys[0], 0)];
      birds[0].ty = midY(); birds[0].ghost = ys[1];
      texts.add(W / 2, H * 0.5, "REGROUP", { color: COL.near, size: 30, life: 1, vy: -20 });
      score += 50;
      texts.add(playerX(), midY() - 40 * S, "+50", { color: COL.near, size: 18, life: 0.9, vy: -30 });
      PA.sfx("levelup", { pitch: 1.1 });
      paintHud();
    }
    for (const b of birds) { b.fromY = b.y; b.vy = 0; }
    trans = { t: 0 };
    fx.burst(playerX(), birds[0].y, { n: 22, colors: ["#fff6e0", "#ffd6a6", "#a6e6ff"], speed: 180, life: 0.5, size: 2.4, shape: "spark" });
  }

  function birdFor(lane) { return birds.find(b => b.lane === lane) || null; }

  function squawk(p) {
    PA.tone({ freq: 900 * p, to: 520 * p, type: "sawtooth", dur: 0.16, vol: 0.05 });
    PA.tone({ freq: 1250 * p, to: 760 * p, type: "square", dur: 0.12, vol: 0.025, delay: 0.02 });
  }

  function flap(lane) {
    if (PA.state !== "play" || overT > 0 || trans) return;
    const b = mode === "solo" ? birds[0] : birdFor(lane === 1 ? 1 : 2);
    if (!b || !b.alive) return;
    if (b.cd > 0) return;
    b.cd = 0.07;
    if (!started) squawk(1);
    started = true;
    b.vy = -(mode === "solo" ? 420 : 360) * S;
    b.hover = 0;
    b.flapT = 0;
    PA.sfx("flap", { pitch: (b.lane === 2 ? 0.9 : 1.05) + Math.min(0.2, gatesPassed * 0.008), vary: 0.08 });
    for (let i = 0; i < 4; i++) fx.burst(playerX() - 8 * S, b.y + 10 * S, { n: 1, color: "rgba(255,248,236,.5)", speed: 70, life: 0.35, size: 3, vy: 40, spread: Math.PI * 0.7, angle: Math.PI * 0.6 });
  }

  PA.onKey((e) => {
    if (e.repeat) return;
    const k = e.key, c = e.code;
    const top = k === "ArrowUp" || c === "KeyW" || k === "w" || k === "W" || c === "KeyF" || k === "f" || k === "F";
    const bot = k === " " || c === "Space" || k === "ArrowDown" || c === "KeyS" || k === "s" || k === "S" || c === "KeyJ" || k === "j" || k === "J";
    if (top || bot) { e.preventDefault(); flap(top ? 1 : 2); }
  });

  view.canvas.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".pa-tb,.pa-layer,#pa-gate,.pa-touch")) return;
    e.preventDefault();
    const p = view.toLocal(e.clientX, e.clientY);
    flap(p.y < midY() ? 1 : 2);
  });

  PA.onStart(reset);

  function kill(b, what) {
    if (!b || !b.alive || overT > 0) return;
    b.alive = false;
    crashed = b;
    b.vy = Math.min(b.vy, -160 * S);
    overT = 0.95;
    PA.shake(14, 0.45);
    PA.hitstop(110);
    PA.flash("rgba(255,214,170,.45)", 300);
    PA.sfx("thud", { pitch: 0.8 });
    PA.sfx("hit");
    squawk(0.8);
    const px = playerX();
    // a puff of leaves (or web strands) and cartoon stars
    const leafy = what === "web" ? ["#ffffff", "#e8e4ff"] : what === "bronto" ? ["#b8ec8a", "#7cc46a"] : what === "rock" ? ["#a99bc2", "#6d5f86"] : ["#5bb84a", "#8fdc5a", "#3f9a45"];
    for (let i = 0; i < 14; i++) debris.push({ x: px, y: b.y, vx: rand(-220, 160) * S, vy: rand(-260, 40) * S, a: rand(TAU), va: rand(-9, 9), s: rand(4, 8) * S, c: choice(leafy), life: rand(0.8, 1.4) });
    fx.burst(px, b.y, { n: 14, colors: ["#fff3a8", "#ffd35c", "#ffffff"], speed: 240, life: 0.6, size: 3, shape: "spark" });
    texts.add(px, b.y - 24 * S, "BONK!", { color: "#fff3a8", size: 30, life: 0.9, vy: -30 });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    if (rw <= 0 || rh <= 0) return false;
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function pillarSpan(g) {
    const top = g.lane === 2 ? midY() : 0, bot = g.lane === 1 ? midY() : H;
    return [top, g.gapY - g.gapH / 2, g.gapY + g.gapH / 2, bot];
  }

  // Hit shapes follow what's drawn: trunks and necks are narrow, crowns and heads are round.
  function shapes(g) {
    const gw = gateW(), x = g.x, [top, gt, gb, bot] = pillarSpan(g), out = [];
    const tk = g.top.kind, bk = g.bot.kind;
    if (tk === "branch") { const R = gw * 0.5; out.push(["r", x - 0.2 * gw, top, 0.4 * gw, gt - R - top], ["c", x, gt - R, R * 0.96]); }
    else if (tk === "web") out.push(["r", x - 0.58 * gw, top, 1.16 * gw, gt - top]);
    else out.push(["r", x - 0.48 * gw, top, 0.96 * gw, gt - top]);
    if (bk === "tree") { const R = gw * 0.6; out.push(["c", x, gb + R, R * 0.95], ["r", x - 0.21 * gw, gb + R, 0.42 * gw, bot - gb - R]); }
    else if (bk === "rock") out.push(["c", x, gb + 0.32 * gw, 0.32 * gw], ["r", x - 0.4 * gw, gb + 0.22 * gw, 0.8 * gw, bot - gb]);
    else {
      const hr = gw * 0.4;
      out.push(["c", x - 0.06 * gw, gb + hr, hr], ["r", x - 0.21 * gw, gb + hr, 0.42 * gw, bot - gb - hr], ["r", x - 0.35 * gw, floorY() - 0.8 * gw, 2.65 * gw, H]);
    }
    return out;
  }
  function collideGate(g, b) {
    const r = birdR() * 0.92, px = playerX(), gw = gateW();
    if (px + r < g.x - 0.7 * gw || px - r > g.x + 2.4 * gw) return null;
    const [top, gt] = pillarSpan(g);
    for (const s of shapes(g)) {
      const hit = s[0] === "c" ? PA.dist(px, b.y, s[1], s[2]) < r + s[3] : circleRect(px, b.y, r, s[1], s[2], s[3], s[4]);
      if (hit) return s[2] < gt || (s[0] === "r" && s[2] === top) ? g.top.kind : g.bot.kind;
    }
    return null;
  }

  function updateGates(dt) {
    const dx = speed * dt;
    scroll += dx;
    spawnX -= dx;
    for (let i = markers.length - 1; i >= 0; i--) {
      markers[i].x -= dx;
      if (markers[i].x <= playerX() && overT <= 0) { beginTransition(markers[i].to); markers.splice(i, 1); }
    }
    for (let i = gates.length - 1; i >= 0; i--) {
      const g = gates[i];
      g.x -= dx;
      if (g.gapVy) {
        g.gapY += g.gapVy * dt;
        if (g.gapY < g.gapMin || g.gapY > g.gapMax) {
          g.gapVy *= -1;
          g.gapY = clamp(g.gapY, g.gapMin, g.gapMax);
        }
      }
      const b = trans ? null : (g.lane ? birdFor(g.lane) : (mode === "solo" ? birds[0] : null));
      for (const c of g.coins) {
        if (c.got) continue;
        c.x -= dx;
        c.ph += dt * 5;
        if (!b || !b.alive) continue;
        const d = PA.dist(playerX(), b.y, c.x, c.y);
        if (d < birdR() + c.r) {
          c.got = true;
          coinsGot++;
          score += 25;
          PA.sfx("coin", { pitch: 1 + (coinsGot % 7) * 0.04 });
          texts.add(c.x, c.y, "+25", { color: "#ffd27a", size: 16, life: 0.75, vy: -45 });
          fx.burst(c.x, c.y, { n: 12, colors: ["#ffd27a", "#fff3c4", "#ff9b4a"], speed: 110, life: 0.45, size: 2.5 });
          paintHud();
        }
      }
      if (b && b.alive && overT <= 0) { const what = collideGate(g, b); if (what) kill(b, what); }

      const px = playerX();
      if (!g.scored && px > g.x && overT <= 0) {
        g.scored = true;
        gatesPassed++;
        if (g.lane) twinGates++;
        const pts = g.lane ? 15 : 10;
        score += pts;
        PA.sfx("blip", { pitch: 1 + gatesPassed * 0.03 });
        texts.add(g.x, g.gapY - g.gapH * 0.35, "+" + pts, { color: "#fff6e0", size: 18, life: 0.7, vy: -35 });
        PA.music.intensity(Math.min(1, gatesPassed / 28));
        paintHud();
      }
      if (!g.nearAward && g.scored && b && b.alive && overT <= 0) {
        g.nearAward = true;
        const top = g.gapY - g.gapH / 2;
        const bot = g.gapY + g.gapH / 2;
        const edge = Math.min(Math.abs(b.y - top), Math.abs(b.y - bot));
        const nearLim = 22 * S;
        if (edge < nearLim && edge > birdR() * 0.35) {
          nearMisses++;
          comboNear++;
          const bonus = 12 + comboNear * 3;
          score += bonus;
          PA.sfx("combo", { pitch: 1 + comboNear * 0.06 });
          texts.add(px, b.y - 28 * S, "CLOSE! +" + bonus, { color: COL.near, size: 17, life: 0.85, vy: -40 });
          fx.burst(px, b.y, { n: 8, color: COL.near, speed: 70, life: 0.4, size: 2 });
          paintHud();
        } else comboNear = 0;
      }
      if (g.x < -gateW() * 3) gates.splice(i, 1);
    }
    if (spawnX < W - 300 * S) spawnNext(spawnX + (SPACING + rand(-15, 35)) * S);
  }

  function update(dt, t) {
    simT += dt;
    fx.update(dt); texts.update(dt);
    for (const d of debris) { d.vy += 700 * S * dt; d.vx *= 1 - dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt; d.life -= dt; }
    debris = debris.filter(d => d.life > 0);
    if (keyHintT > 0) keyHintT -= dt;

  // a clump of canopy at the top of the screen for hanging things to come from
  function topMass(x, p) {

  }
  function drawGate(g, t) {

    if (bk === "bronto") drawBronto(x, gb, g.bot, t);
    else if (bk === "rock") drawRock(x, gb, bot, g.bot, t);
    else drawTree(x, gb, bot, g.bot, t);
    if (tk === "branch") drawBranch(x, top, gt, g.top, t);
    else drawVines(x, top, gt, g.top, t, tk === "web");

  }
  function drawAmber(c, t) {
    const bob = Math.sin(c.ph) * 3 * S, x = c.x, y = c.y + bob, r = c.r;
    ctx.save();
    ctx.shadowColor = "#ffb347"; ctx.shadowBlur = 16 * S;
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, 0, x, y, r * 1.2);

  /* ---------- the pterodactyl ---------- */
  function wingK(b) {
    if (!started && PA.state === "play" && b.hover <= 0) return 0.5 + 0.5 * Math.sin(simT * 7);
    if (PA.state !== "play") return 0.5 + 0.5 * Math.sin(simT * 6);
    if (b.hover > 0 || trans) return 0.5 + 0.5 * Math.sin(simT * 9 + b.lane);

  function wing(r, k, far, pal) {

  function drawPtero(b, y, alpha) {
    if (!b) return;

    ctx.save();
    ctx.translate(playerX(), y);
    ctx.rotate(b.rot);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    wing(r, k, true, pal);

    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.moveTo(-0.75 * r, -0.12 * r); ctx.quadraticCurveTo(-1.4 * r, 0, -1.85 * r, 0.16 * r); ctx.quadraticCurveTo(-1.3 * r, 0.24 * r, -0.75 * r, 0.22 * r); ctx.fill();

    alive: birds.length > 0 && birds.every(b => b.alive) && overT <= 0,
    mode, splits, twinGates, trans: !!trans,
    birds: birds.map(b => ({ lane: b.lane, y: b.y, vy: b.vy })),
    gateList: gates.map(g => ({ x: g.x, lane: g.lane, gapY: g.gapY, gapH: g.gapH, top: g.top.kind, bot: g.bot.kind })),

})();
