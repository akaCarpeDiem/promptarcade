<!DOCTYPE html>

</div>
<script>
window.paConfig = {
  slug: "neon-flap", title: "Ptero Flap", native: true, music: "bounce", unit: "points",
  controls: [["Space / ↑ / W", "Flap"], ["Tap or click", "Flap"]]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script>
(() => {
  const TAU = Math.PI * 2;
  const { rand, choice, clamp } = PA;
  const COL = { near: "#b6ff7a", ink: "#17143a" };

  /* ---------- helpers ---------- */
  const rgb = (h) => { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
  function mix(a, b, t) { const A = rgb(a), B = rgb(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; }
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // Moonlit clay palette. Light comes from the moon at the upper left, so every rounded form gets
  // its highlight up and to the left and a cool rim light along its upper-left edge.
  const PT = { body: "#eceafb", hi: "#ffffff", lo: "#a59ed9", deep: "#7c74bb", belly: "#f9f8ff", lid: "#d9d5f3",
    teal: "#36c8bf", tealHi: "#9af3e6", tealD: "#178893", mem: "#e7e4fb", memD: "#b6afe4", vein: "rgba(120,108,196,.35)", foot: "#8f87cf" };
  const BR = { body: "#2aa2a0", hi: "#86e6da", lo: "#156670", deep: "#0d4552", belly: "#eef7f4", bellyLo: "#b9d6d6", foot: "#ec5a30", footHi: "#ff9d6c", lid: "#239090" };
  const LEAF_PAL = [
    { hi: "#b9f7de", mid: "#2fa68f", lo: "#0f4b58", rim: "#e4fdff" },
    { hi: "#d8f7a0", mid: "#4fa64e", lo: "#174c3a", rim: "#f2ffd8" },
    { hi: "#aef2c4", mid: "#2c9b6c", lo: "#0f4446", rim: "#e2fff0" }
  ];

  // sprite frame counts, canopy blob layout, vine flower colours
  const PF = 16, BRF = 8, WN = 9;
  const BLOBS = [[0, 0.05, 0.62], [-0.48, 0.18, 0.46], [0.48, 0.2, 0.46], [-0.24, -0.38, 0.5], [0.26, -0.36, 0.48], [0, -0.48, 0.5], [0, 0.42, 0.5]];
  const FLOWERS = ["#ff7fb8", "#ffd35c", "#ff9b62"];
  let W = 0, H = 0, S = 1, DPR = 1, TW = 1200, HZ = 0;
  let scroll = 0, speed = 0, simT = 0;
  let gates = [];
  let score = 0, gatesPassed = 0, coinsGot = 0, nearMisses = 0, comboNear = 0;
  let spawnX = 0, overT = 0, overSent = false, started = false;
  let sky = null, far = null, mid = null, near = null, ground = null, fringe = null, vignette = null;
  let clouds = [], flies = [], glints = [], debris = [], cloudArt = [], hut = null;
  let SPR = null;

  const playerX = () => W * 0.28;
  const birdR = () => 14 * S;
  const gateW = () => 68 * S;
  const floorY = () => H - 28 * S;
  const ceilY = () => 24 * S;
  const baseGap = () => clamp(H * 0.28, 150 * S, 240 * S);
  const minGap = () => clamp(H * 0.16, 96 * S, 140 * S);

  const view = PA.canvas(document.getElementById("c"), { onResize: layout });
  const ctx = view.ctx;
  const fx = new PA.Particles(700), texts = new PA.Texts();
  const hud = document.getElementById("nf-hud");

  function gapForRun() {
    return clamp(baseGap() - gatesPassed * 2.8, minGap(), baseGap());
  }
  function scrollSpeed() {
    return (220 + gatesPassed * 5 + score * 0.015) * S;
  }

  function layout(v) {
    W = v.w; H = v.h; DPR = v.dpr;
    S = clamp(Math.sqrt(W * H) / 820, 0.72, 1.35);
    TW = Math.ceil(Math.max(W, 700) * 1.3);
    buildWorld();
    buildSprites();
  }

  /* ================= the painted world =================
   * Every backdrop layer is painted once into an offscreen strip that tiles seamlessly, then
   * scrolled at its own parallax rate. Ridges use sums of sines with whole periods across the
   * tile, so the seam never shows. Nothing in here runs per frame. */
  function strip(y0, y1, res) {
    const r = Math.min(DPR, res), h = Math.max(1, y1 - y0);
    const c = document.createElement("canvas");
    c.width = Math.ceil(TW * r); c.height = Math.ceil(h * r);
    const g = c.getContext("2d");
    g.scale(r, r); g.translate(0, -y0);
    return { c, g, y0, y1 };
  }
  // draw a feature and its wrapped copy so features that straddle the tile edge stay seamless
  function wrap(x, w, fn) { fn(x); if (x - w < 0) fn(x + TW); if (x + w > TW) fn(x - TW); }
  function ridge(seed, k0, k1, amp) {
    const R = rng(seed), terms = [];
    for (let k = k0; k <= k1; k++) terms.push([k, R() * TAU, amp * (0.4 + R() * 0.6) / Math.sqrt(k)]);
    return (x) => { let y = 0; for (const [k, ph, a] of terms) y += Math.sin(TAU * k * x / TW + ph) * a; return y; };
  }
  function ridgePath(g, f, base, y1) {
    g.beginPath(); g.moveTo(0, y1);
    for (let x = 0; x <= TW; x += 5) g.lineTo(x, base - f(x));
    g.lineTo(TW, y1); g.closePath();
  }
  function rimLine(g, f, base, col, lw) {
    g.strokeStyle = col; g.lineWidth = lw; g.lineCap = "round";
    g.beginPath();
    for (let x = 0; x <= TW; x += 5) { const y = base - f(x) + lw * 0.6; x ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  // a soft, clay-like rounded form: radial light from the upper left, a deep core shadow and a cool rim
  function clay(g, x, y, rx, ry, hi, midC, lo, rim, rot) {
    g.save(); g.translate(x, y); if (rot) g.rotate(rot);
    const m = Math.max(rx, ry);
    const gr = g.createRadialGradient(-rx * 0.38, -ry * 0.46, m * 0.04, -rx * 0.05, -ry * 0.05, m * 1.08);
    gr.addColorStop(0, hi); gr.addColorStop(0.42, midC); gr.addColorStop(1, lo);
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, TAU); g.fill();
    if (rim) {
      g.strokeStyle = rim; g.globalAlpha = 0.55; g.lineWidth = Math.max(0.8, Math.min(rx, ry) * 0.12);
      g.beginPath(); g.ellipse(0, 0, rx - g.lineWidth * 0.6, ry - g.lineWidth * 0.6, 0, -2.75, -1.45); g.stroke();
      g.globalAlpha = 1;
    }
    g.restore();
  }
  function glowDot(g, x, y, r, col, a) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col.replace("A", a)); gr.addColorStop(1, col.replace("A", 0));
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  function leafShape(g, x, y, len, w, ang, c1, c2) {
    g.save(); g.translate(x, y); g.rotate(ang);
    const lg = g.createLinearGradient(0, -w, 0, w);
    lg.addColorStop(0, c2); lg.addColorStop(1, c1);
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.42, -w * 1.1, len, 0); g.quadraticCurveTo(len * 0.42, w * 1.1, 0, 0); g.fill();
    g.restore();
  }

  function buildWorld() {
    const R = rng(7), fy = floorY();
    const hz = HZ = Math.round(H * 0.6);
    /* sky: deep blue night, stars, a big glowing moon and a lagoon that catches its light */
    {
      const c = document.createElement("canvas"), r = Math.min(DPR, 1.5);
      c.width = Math.ceil(W * r); c.height = Math.ceil(H * r);
      const g = c.getContext("2d"); g.scale(r, r);
      let lg = g.createLinearGradient(0, 0, 0, hz);
      lg.addColorStop(0, "#070a30"); lg.addColorStop(0.4, "#121a5e"); lg.addColorStop(0.82, "#25359a"); lg.addColorStop(1, "#3550c2");
      g.fillStyle = lg; g.fillRect(0, 0, W, hz + 1);
      const n = Math.min(240, W * H / 4200);
      for (let i = 0; i < n; i++) {
        const x = R() * W, y = Math.pow(R(), 1.25) * hz * 0.95, s = (0.35 + R() * 1.1) * S;
        g.globalAlpha = (0.25 + R() * 0.75) * (1 - 0.55 * y / hz);
        g.fillStyle = R() < 0.25 ? "#cddcff" : "#ffffff";
        g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
        if (R() < 0.05) { g.globalAlpha *= 0.6; g.fillRect(x - s * 4, y - 0.3 * S, s * 8, 0.6 * S); g.fillRect(x - 0.3 * S, y - s * 4, 0.6 * S, s * 8); }
      }
      g.globalAlpha = 1;
      const mr = clamp(Math.min(W, H) * 0.075, 24 * S, 58 * S), mx = W * 0.34, my = Math.max(mr * 2.2, H * 0.17);
      g.save(); g.globalCompositeOperation = "lighter";
      let rg = g.createRadialGradient(mx, my, mr * 0.7, mx, my, mr * 7.5);
      rg.addColorStop(0, "rgba(130,165,255,.42)"); rg.addColorStop(0.3, "rgba(90,120,235,.16)"); rg.addColorStop(1, "rgba(60,80,200,0)");
      g.fillStyle = rg; g.fillRect(0, 0, W, hz);
      // a soft shaft of moonlight slanting off to the right
      g.translate(mx, my); g.rotate(0.32);
      rg = g.createLinearGradient(0, -mr * 1.3, 0, mr * 1.3);
      rg.addColorStop(0, "rgba(150,175,255,0)"); rg.addColorStop(0.5, "rgba(150,175,255,.09)"); rg.addColorStop(1, "rgba(150,175,255,0)");
      g.fillStyle = rg; g.fillRect(mr, -mr * 1.3, W, mr * 2.6);
      g.restore();
      rg = g.createRadialGradient(mx - mr * 0.3, my - mr * 0.35, mr * 0.1, mx, my, mr);
      rg.addColorStop(0, "#ffffff"); rg.addColorStop(0.6, "#edf3ff"); rg.addColorStop(1, "#bfd2ff");
      g.save(); g.shadowColor = "rgba(205,225,255,.95)"; g.shadowBlur = mr * 0.9; g.fillStyle = rg;
      g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill(); g.restore();
      g.fillStyle = "rgba(150,172,232,.16)";
      for (const [dx, dy, cr] of [[0.25, -0.2, 0.22], [-0.3, 0.25, 0.16], [0.1, 0.4, 0.12], [-0.15, -0.35, 0.1]]) { g.beginPath(); g.arc(mx + dx * mr, my + dy * mr, cr * mr, 0, TAU); g.fill(); }
      // lagoon
      lg = g.createLinearGradient(0, hz, 0, H);
      lg.addColorStop(0, "#6c96ff"); lg.addColorStop(0.03, "#3e66dc"); lg.addColorStop(0.3, "#22389c"); lg.addColorStop(1, "#111a56");
      g.fillStyle = lg; g.fillRect(0, hz, W, H - hz);
      g.save(); g.globalCompositeOperation = "lighter";
      g.translate(mx, hz); g.scale(1.8, 0.45);
      rg = g.createRadialGradient(0, 0, 0, 0, 0, mr * 3.2);
      rg.addColorStop(0, "rgba(170,200,255,.45)"); rg.addColorStop(1, "rgba(120,150,255,0)");
      g.fillStyle = rg; g.beginPath(); g.arc(0, 0, mr * 3.2, 0, TAU); g.fill();
      g.restore();
      g.fillStyle = "#d4e2ff";
      for (let i = 0; i < 30; i++) {
        const yy = hz + 2 * S + i * (2.2 + i * 0.35) * S;
        if (yy > H) break;
        const w = mr * (1.5 - i / 24) * (0.45 + R() * 0.7);
        if (w <= 0) break;
        g.globalAlpha = 0.6 * (1 - i / 30);
        g.fillRect(mx - w / 2 + (R() - 0.5) * mr * 0.7, yy, w, 1.3 * S);
      }
      g.globalAlpha = 1;
      sky = c;
    }
    /* far: rounded moonlit mountains and chunky sea stacks standing in the lagoon */
    far = strip(H * 0.26, hz + 6 * S, 1);
    {
      const g = far.g, back = ridge(11, 2, 6, H * 0.075), front = ridge(23, 3, 8, H * 0.05), R2 = rng(13);
      let lg = g.createLinearGradient(0, H * 0.3, 0, hz);
      lg.addColorStop(0, "#3d4fb6"); lg.addColorStop(1, "#2a3a9c");
      ridgePath(g, back, hz - H * 0.13, hz + 6 * S); g.fillStyle = lg; g.fill();
      rimLine(g, back, hz - H * 0.13, "rgba(165,195,255,.45)", 2 * S);
      // rounded sea stacks
      for (let i = 0; i < 4; i++) {
        const x = (i + 0.2 + R2() * 0.6) * TW / 4, w = (34 + R2() * 40) * S, h = (60 + R2() * 70) * S, lean = (R2() - 0.5) * 16 * S;
        wrap(x, w * 1.4, (xx) => {
          const sg = g.createLinearGradient(xx - w, 0, xx + w, 0);
          sg.addColorStop(0, "#6c80e6"); sg.addColorStop(0.45, "#3d4cb4"); sg.addColorStop(1, "#24307e");
          g.fillStyle = sg;
          g.beginPath(); g.moveTo(xx - w, hz + 6 * S);
          g.bezierCurveTo(xx - w * 1.05, hz - h * 0.5, xx - w * 0.8 + lean, hz - h, xx + lean * 0.5, hz - h);
          g.bezierCurveTo(xx + w * 0.8 + lean, hz - h, xx + w * 1.05, hz - h * 0.5, xx + w, hz + 6 * S);
          g.closePath(); g.fill();
          g.strokeStyle = "rgba(190,215,255,.55)"; g.lineWidth = 2.2 * S; g.lineCap = "round";
          g.beginPath(); g.moveTo(xx - w * 0.92, hz - h * 0.3); g.bezierCurveTo(xx - w * 0.95, hz - h * 0.7, xx - w * 0.6 + lean, hz - h + 2 * S, xx + lean * 0.4, hz - h + 2 * S); g.stroke();
        });
      }
      lg = g.createLinearGradient(0, H * 0.4, 0, hz);
      lg.addColorStop(0, "#2c3a9e"); lg.addColorStop(1, "#1d2a80");
      ridgePath(g, front, hz - H * 0.05, hz + 6 * S); g.fillStyle = lg; g.fill();
      rimLine(g, front, hz - H * 0.05, "rgba(150,185,255,.4)", 1.8 * S);
      g.fillStyle = "rgba(150,185,255,.5)"; g.fillRect(0, hz + 1 * S, TW, 1.4 * S);
    }
    /* mid: little islands with beaches, palm trees, a dome hut with a warm window, a small boat */
    mid = strip(H * 0.36, fy + 4 * S, 1.5);
    {
      const g = mid.g, R3 = rng(41), wy = hz + (fy - hz) * 0.36;
      const isl = [];
      for (let i = 0; i < 5; i++) isl.push({ x: (i + 0.15 + R3() * 0.5) * TW / 5, w: (70 + R3() * 70) * S, h: (18 + R3() * 18) * S, y: wy + (R3() - 0.5) * (fy - hz) * 0.12 });
      const big = isl[2]; big.w = 150 * S; big.h = 30 * S;
      for (const s of isl) wrap(s.x, s.w * 1.4, (xx) => island(g, xx, s.y, s.w, s.h));
      for (const s of isl) {
        const nP = s === big ? 2 : 1 + (R3() * 2 | 0);
        for (let j = 0; j < nP; j++) {
          const px = s === big ? s.x + (j ? 1 : -1) * s.w * 0.78 : s.x + (R3() - 0.5) * s.w * 0.8, ph = (70 + R3() * 60) * S;
          const dir = R3() < 0.5 ? -1 : 1;
          wrap(px, 70 * S, (xx) => palm(g, xx, s.y - s.h * 0.5, ph, dir, rng(px | 0)));
        }
      }
      wrap(big.x, 80 * S, (xx) => domeHut(g, xx, big.y - big.h * 0.62));
      hut = { x: big.x, y: big.y - big.h * 0.62 };
      wrap(big.x - big.w * 1.15, 40 * S, (xx) => boat(g, xx, big.y + 6 * S));
    }
    /* near: dark rounded bushes and rocks in the foreground, a few glowing pink flowers */
    near = strip(hz + (fy - hz) * 0.42, fy + 4 * S, 1.5);
    {
      const g = near.g, y0 = near.y0, f = ridge(61, 3, 10, (fy - y0) * 0.22), base = y0 + (fy - y0) * 0.5, R4 = rng(67);
      const lg = g.createLinearGradient(0, y0, 0, fy);
      lg.addColorStop(0, "#1a3f6e"); lg.addColorStop(1, "#0c1a42");
      ridgePath(g, f, base, fy + 4 * S); g.fillStyle = lg; g.fill();
      rimLine(g, f, base, "rgba(120,210,235,.32)", 2 * S);
      for (let x = 0; x < TW; x += (26 + R4() * 30) * S) {
        const r = (12 + R4() * 16) * S, cy = base - f(x) + r * 0.5, kind = R4();
        wrap(x, r * 2, (xx) => {
          if (kind < 0.62) { clay(g, xx, cy, r, r * 0.85, "#3f8fb0", "#1d4c72", "#0d2248", "#9fe6ff"); clay(g, xx + r * 0.7, cy + r * 0.25, r * 0.7, r * 0.6, "#3a88a8", "#1b4870", "#0d2248", "#9fe6ff"); }
          else clay(g, xx, cy + r * 0.2, r * 0.9, r * 0.62, "#6a78d0", "#323e98", "#161c5a", "#c8d4ff");
        });
      }
      g.save(); g.shadowColor = "#ff7ab8"; g.shadowBlur = 8 * S;
      for (let i = 0; i < TW / (150 * S); i++) {
        const x = R4() * TW, y = base - f(x) + 4 * S, h = (10 + R4() * 12) * S;
        wrap(x, 12 * S, (xx) => {
          g.strokeStyle = "#1e5a6a"; g.lineWidth = 1.6 * S; g.lineCap = "round";
          for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(xx, y); g.quadraticCurveTo(xx + k * 4 * S, y - h * 0.6, xx + k * 6 * S, y - h + Math.abs(k) * 3 * S); g.stroke(); }
          g.fillStyle = "#ff7ab8";
          for (let k = -1; k <= 1; k++) { g.beginPath(); g.ellipse(xx + k * 6 * S, y - h + Math.abs(k) * 3 * S, 3 * S, 4 * S, k * 0.4, 0, TAU); g.fill(); }
        });
      }
      g.restore();
    }
    /* ground: a clay-smooth grassy bank, pebbles and glowing mushrooms */
    ground = strip(fy - 16 * S, H, 2);
    {
      const g = ground.g, R5 = rng(81), top = (x) => fy - 4 * S - Math.abs(Math.sin(Math.PI * x / (TW / Math.round(TW / (26 * S))))) * 6 * S;
      const gg = g.createLinearGradient(0, fy - 12 * S, 0, H);
      gg.addColorStop(0, "#5fd0b4"); gg.addColorStop(0.12, "#2f9a8a"); gg.addColorStop(0.28, "#1a5868"); gg.addColorStop(0.42, "#16204e"); gg.addColorStop(1, "#090d2c");
      g.fillStyle = gg;
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= TW; x += 2 * S) g.lineTo(x, top(x));
      g.lineTo(TW, H); g.closePath(); g.fill();
      g.strokeStyle = "rgba(200,255,240,.55)"; g.lineWidth = 1.6 * S; g.lineCap = "round";
      g.beginPath(); for (let x = 0; x <= TW; x += 2 * S) { const y = top(x) + 1.2 * S; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
      for (let i = 0; i < TW / (22 * S); i++) {
        const x = R5() * TW, y = fy + 8 * S + R5() * (H - fy - 8 * S), r = (2 + R5() * 4) * S;
        wrap(x, r, (xx) => clay(g, xx, y, r, r * 0.65, "#4a58a8", "#222c6c", "#0e1440"));
      }
      g.save(); g.shadowColor = "#7ff3ff"; g.shadowBlur = 7 * S;
      for (let i = 0; i < TW / (170 * S); i++) {
        const x = R5() * TW, n = 1 + (R5() * 3 | 0);
        for (let j = 0; j < n; j++) {
          const r = (3.5 + R5() * 3) * S, xx0 = x + j * 7 * S;
          wrap(xx0, 10 * S, (xx) => {
            g.fillStyle = "#dfe6ff"; g.fillRect(xx - r * 0.2, top(xx) - r * 0.9, r * 0.4, r * 1.1);
            g.fillStyle = j % 2 ? "#8ff3ff" : "#c8a8ff"; g.beginPath(); g.ellipse(xx, top(xx) - r * 0.9, r, r * 0.62, 0, Math.PI, 0); g.fill();
          });
        }
      }
      g.restore();
      // big dark foreground leaves along the very bottom
      for (let i = 0; i < TW / (260 * S); i++) {
        const x = R5() * TW, n = 3 + (R5() * 3 | 0);
        const sd = R5() * 1e6 | 0;
        wrap(x, 60 * S, (xx) => { const Rl = rng(sd); for (let k = 0; k < n; k++) leafShape(g, xx + k * 9 * S, H + 4 * S, (26 + Rl() * 24) * S, (7 + Rl() * 4) * S, -Math.PI / 2 + (k - n / 2) * 0.35, "#050824", "#101a4a"); });
      }

  /* ================= cached sprites =================
   * The pterodactyl's flap cycle, the brontosaurus's walk cycle and every obstacle part are
   * painted once per layout into small offscreen canvases at device resolution. Per frame they
   * are only blitted, so drawing allocates nothing. */
  function sprite(w, h, ox, oy, fn) {
    const k = Math.min(DPR, 2), c = document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(w * k)); c.height = Math.max(1, Math.ceil(h * k));
    const g = c.getContext("2d"); g.scale(k, k); g.translate(ox, oy); g.lineCap = "round"; g.lineJoin = "round";
    fn(g);
    return { c, w, h, ox, oy, k };
  }
  function blit(s, x, y) { ctx.drawImage(s.c, x - s.ox, y - s.oy, s.w, s.h); }

  /* the pterodactyl: pale lavender clay, teal stripes and spikes, big wings, sleepy eyes */
  // Wings are modelled as a membrane that swings about the body's long axis and is projected in a
  // gentle three-quarter view, so they stay broad through the whole stroke instead of turning edge-on.
  function pWing(g, r, k, farW) {
    const th0 = 1.3 - 2.3 * k, L = r * (farW ? 2.8 : 3.3), side = farW ? -1 : 1;
    const sx = 0.2 * r, sy = -0.3 * r;
    const LE = [], TE = [];
    for (let i = 0; i <= WN; i++) {
      const u = i / WN, sp = u * L, th = th0 + 0.38 * u * u;
      const ct = Math.cos(th), st = Math.sin(th);
      const xl = sx + 0.1 * r - 1.45 * r * Math.pow(u, 1.2), chord = r * (1.4 * (1 - Math.pow(u, 2)) + 0.12);
      const X = (xx) => xx + side * sp * ct * 0.3, Y = sy - sp * st + side * sp * ct * 0.3;
      LE.push([X(xl), Y]); TE.push([X(xl - chord), Y + chord * 0.12]);
    }
    const sh = farW ? 0.4 : 0, dim = (c) => sh ? mix(c, "#4a4492", sh) : c;
    const tip = LE[WN];
    const gr = g.createLinearGradient(sx, sy, tip[0], tip[1]);
    gr.addColorStop(0, dim(PT.mem)); gr.addColorStop(1, dim(PT.memD));
    g.fillStyle = gr;

    for (let i = 1; i <= WN; i++) g.lineTo(LE[i][0], LE[i][1]);

    for (let i = WN; i > 0; i--) {

      const cx = (LE[i][0] + LE[i - 1][0]) / 2, cy = (LE[i][1] + LE[i - 1][1]) / 2;
      g.quadraticCurveTo(mx + (cx - mx) * 0.18, my + (cy - my) * 0.18, b[0], b[1]);
    }
    g.closePath(); g.fill();

    for (const i of [2, 5]) { g.beginPath(); g.moveTo(LE[i][0], LE[i][1]); g.lineTo((LE[i][0] + TE[i][0]) / 2, (LE[i][1] + TE[i][1]) / 2 + 0.05 * r); g.stroke(); }

    g.beginPath(); g.moveTo(LE[0][0] - 0.2 * r, LE[0][1] + 0.05 * r); for (let i = 1; i <= WN; i++) g.lineTo(LE[i][0] - 0.2 * r * (1 - i / WN), LE[i][1] + 0.05 * r); g.stroke();
    g.restore();
    // the arm along the leading edge, with a teal cuff at the wrist
    g.strokeStyle = dim(PT.body); g.lineWidth = r * 0.2;
    g.beginPath(); g.moveTo(LE[0][0], LE[0][1]); for (let i = 1; i <= WN; i++) g.lineTo(LE[i][0], LE[i][1]); g.stroke();
    if (!farW) { g.strokeStyle = "#ffffff"; g.lineWidth = r * 0.07; g.beginPath(); g.moveTo(LE[0][0], LE[0][1] - r * 0.05); for (let i = 1; i <= 5; i++) g.lineTo(LE[i][0], LE[i][1] - r * 0.05); g.stroke(); }

  }

  /* the brontosaurus: teal clay, white belly and neck patch, red-orange feet, sleepy eyes */

  /* obstacles */
  function paintCanopy(g, R, pal, seed, flip) {
    const Rr = rng(seed), f = flip ? -1 : 1;
    const bl = BLOBS.map(([x, y, r]) => [x + (Rr() - 0.5) * 0.1, f * (y + (Rr() - 0.5) * 0.08), r * (0.92 + Rr() * 0.12)]);

    for (const [x, y, r] of bl) { g.beginPath(); g.arc(x * R + 3 * S, y * R + 5 * S, r * R, 0, TAU); g.fill(); }
    g.fillStyle = pal.lo;
    for (const [x, y, r] of bl) { g.beginPath(); g.arc(x * R, y * R + 2.5 * S, r * R, 0, TAU); g.fill(); }

    for (const [x, y, r] of bl) { if (y > 0.1 && !flip) continue; g.beginPath(); g.ellipse((x - r * 0.36) * R, (y - r * 0.45) * R, r * R * 0.2, r * R * 0.1, -0.6, 0, TAU); g.fill(); }
  }
  function paintStones(g, gw, th, seed) {

      gr.addColorStop(0, "#fff3c0"); gr.addColorStop(0.4, "#ffbe55"); gr.addColorStop(1, "#c9641c");
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(0, -ar * 1.25); g.bezierCurveTo(ar * 1.1, -ar * 0.4, ar * 0.9, ar, 0, ar); g.bezierCurveTo(-ar * 0.9, ar, -ar * 1.1, -ar * 0.4, 0, -ar * 1.25); g.fill();
      g.restore();
      g.fillStyle = "rgba(90,40,10,.6)"; g.beginPath(); g.ellipse(ar * 0.05, ar * 0.15, ar * 0.22, ar * 0.12, 0.4, 0, TAU); g.fill();
      g.fillStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.ellipse(-ar * 0.35, -ar * 0.45, ar * 0.18, ar * 0.32, 0.5, 0, TAU); g.fill();
    });
    SPR.fly = sprite(24 * S, 24 * S, 12 * S, 12 * S, (g) => { glowDot(g, 0, 0, 12 * S, "rgba(255,222,120,A)", 0.85); g.fillStyle = "#fff6c8"; g.beginPath(); g.arc(0, 0, 1.6 * S, 0, TAU); g.fill(); });
    SPR.warm = sprite(90 * S, 90 * S, 45 * S, 45 * S, (g) => glowDot(g, 0, 0, 45 * S, "rgba(255,170,95,A)", 0.55));
  }

  /* ================= gates and the flyer ================= */
  const SPACING = 280;
  let bird = null;

  function reset() {
    scroll = 0; simT = 0; speed = scrollSpeed();
    score = 0; gatesPassed = 0; coinsGot = 0; nearMisses = 0; comboNear = 0;
    gates = []; debris.length = 0; overT = 0; overSent = false; started = false;
    fx.clear(); texts.clear();
    bird = { y: H * 0.46, vy: 0, rot: 0, alive: true, flapT: 1, blink: rand(2, 5), cd: 0 };
    spawnX = W + 80 * S;
    spawnGate(spawnX);
    for (let i = 0; i < 3; i++) spawnGate(spawnX + (SPACING + rand(-20, 40)) * S);
    PA.music.intensity(0);
    hud.classList.add("on");
    paintHud();
  }

  function paintHud() {
    PA.stat("s-score", score.toLocaleString());
    PA.stat("s-gates", gatesPassed);
    PA.stat("s-coins", coinsGot);
  }

  function piece(kind) {
    const p = { kind, seed: rand(0, 1000), ph: rand(TAU), v: (Math.random() * 2) | 0 };
    if (kind === "tree" || kind === "branch") p.pal = (Math.random() * LEAF_PAL.length) | 0;
    if (kind === "bronto") p.blink = rand(1, 4);
    if (kind === "vines") p.flower = (Math.random() * FLOWERS.length) | 0;
    if (kind === "rock") p.v = (Math.random() * 2) | 0;
    p.mass = (Math.random() * 4) | 0;
    return p;
  }

  function spawnGate(x) {
    const lt = ceilY(), lb = floorY();
    const gh = gapForRun();
    const m = gh / 2 + 60 * S;
    const gmin = lt + m;
    let gmax = Math.max(lt + m, lb - m);
    const move = gatesPassed > 2 && Math.random() < 0.55 + Math.min(0.35, gatesPassed * 0.02);
    const vy = 48;
    // Pick obstacles that make sense for the gap: a bronto stands on the ground and needs room to
    // raise its head, and only stretchy things (a bronto's neck, a dangling web or vines) ride a
    // moving gap.
    const brontoMax = floorY() - 110 * S - gh / 2;
    const bronto = brontoMax > gmin + 10 * S && Math.random() < (move ? 0.7 : 0.38);
    if (bronto) gmax = Math.min(gmax, brontoMax);
    const gapY = rand(gmin, gmax);
    const topKind = move ? choice(["web", "vines"]) : choice(["branch", "branch", "web", "vines"]);
    const botKind = bronto ? "bronto" : move ? "tree" : choice(["tree", "tree", "rock"]);
    gates.push({
      x, gapY, gapH: gh,
      gapVy: move && gmax > gmin ? rand(-vy, vy) * S : 0,
      gapMin: gmin, gapMax: gmax,
      scored: false, nearAward: false,
      top: piece(topKind), bot: piece(botKind),
      coins: makeCoins(x, gapY, gh)
    });
    spawnX = x;
  }

  function makeCoins(gx, gy, gh) {
    const out = [];
    if (Math.random() < 0.72) {
      const n = Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        out.push({
          x: gx + gateW() * 0.55 + (i - (n - 1) / 2) * 22 * S,
          y: gy + rand(-gh * 0.22, gh * 0.22),
          r: 8 * S,
          got: false,
          ph: rand(TAU)
        });
      }
    }
    return out;
  }

  function squawk(p) {
    PA.tone({ freq: 900 * p, to: 520 * p, type: "sawtooth", dur: 0.16, vol: 0.05 });
    PA.tone({ freq: 1250 * p, to: 760 * p, type: "square", dur: 0.12, vol: 0.025, delay: 0.02 });
  }

  function flap() {
    if (PA.state !== "play" || overT > 0) return;
    const b = bird;
    if (!b || !b.alive || b.cd > 0) return;
    b.cd = 0.07;
    if (!started) squawk(1);
    started = true;
    b.vy = -420 * S;
    b.flapT = 0;
    PA.sfx("flap", { pitch: 1.05 + Math.min(0.2, gatesPassed * 0.008), vary: 0.08 });
    for (let i = 0; i < 4; i++) fx.burst(playerX() - 8 * S, b.y + 10 * S, { n: 1, color: "rgba(230,236,255,.5)", speed: 70, life: 0.35, size: 3, vy: 40, spread: Math.PI * 0.7, angle: Math.PI * 0.6 });
  }

  PA.onKey((e) => {
    if (e.repeat) return;
    const k = e.key, c = e.code;
    if (k === " " || c === "Space" || k === "ArrowUp" || c === "KeyW" || k === "w" || k === "W") { e.preventDefault(); flap(); }
  });

  view.canvas.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".pa-tb,.pa-layer,#pa-gate,.pa-touch")) return;
    e.preventDefault();
    flap();
  });

  PA.onStart(reset);

  function kill(b, what) {
    if (!b || !b.alive || overT > 0) return;
    b.alive = false;
    b.vy = Math.min(b.vy, -160 * S);
    overT = 0.95;
    PA.shake(14, 0.45);
    PA.hitstop(110);
    PA.flash("rgba(200,215,255,.4)", 300);
    PA.sfx("thud", { pitch: 0.8 });
    PA.sfx("hit");
    squawk(0.8);
    const px = playerX();
    // a puff of leaves (or web strands) and cartoon stars
    const leafy = what === "web" ? ["#ffffff", "#dfe6ff"] : what === "bronto" ? ["#86e6da", "#2aa2a0"] : what === "rock" ? ["#b8c2f6", "#6a72ba"] : ["#2fa68f", "#8ff0bc", "#4fa64e"];
    for (let i = 0; i < 14; i++) debris.push({ x: px, y: b.y, vx: rand(-220, 160) * S, vy: rand(-260, 40) * S, a: rand(TAU), va: rand(-9, 9), s: rand(4, 8) * S, c: choice(leafy), life: rand(0.8, 1.4) });
    fx.burst(px, b.y, { n: 14, colors: ["#fff3a8", "#ffd35c", "#ffffff"], speed: 240, life: 0.6, size: 3, shape: "spark" });
    texts.add(px, b.y - 24 * S, "BONK!", { color: "#fff3a8", size: 30, life: 0.9, vy: -30 });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    if (rw <= 0 || rh <= 0) return false;
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }
  function circleCircle(ax, ay, ar, bx, by, br) { const dx = ax - bx, dy = ay - by, rr = ar + br; return dx * dx + dy * dy < rr * rr; }

  // Hit shapes follow what's drawn: trunks and necks are narrow, crowns and heads are round.
  // (Same shapes and sizes as before the night repaint.)
  function collideGate(g, py) {
    const r = birdR() * 0.92, px = playerX(), gw = gateW(), x = g.x;
    if (px + r < x - 0.7 * gw || px - r > x + 2.4 * gw) return null;
    const gt = g.gapY - g.gapH / 2, gb = g.gapY + g.gapH / 2, tk = g.top.kind, bk = g.bot.kind;
    if (tk === "branch") { const R = gw * 0.5; if (circleRect(px, py, r, x - 0.2 * gw, 0, 0.4 * gw, gt - R) || circleCircle(px, py, r, x, gt - R, R * 0.96)) return tk; }
    else if (tk === "web") { if (circleRect(px, py, r, x - 0.58 * gw, 0, 1.16 * gw, gt)) return tk; }
    else if (circleRect(px, py, r, x - 0.48 * gw, 0, 0.96 * gw, gt)) return tk;
    if (bk === "tree") { const R = gw * 0.6; if (circleCircle(px, py, r, x, gb + R, R * 0.95) || circleRect(px, py, r, x - 0.21 * gw, gb + R, 0.42 * gw, H - gb - R)) return bk; }
    else if (bk === "rock") { if (circleCircle(px, py, r, x, gb + 0.32 * gw, 0.32 * gw) || circleRect(px, py, r, x - 0.4 * gw, gb + 0.22 * gw, 0.8 * gw, H - gb)) return bk; }
    else {
      const hr = gw * 0.4;
      if (circleCircle(px, py, r, x - 0.06 * gw, gb + hr, hr) || circleRect(px, py, r, x - 0.21 * gw, gb + hr, 0.42 * gw, H - gb - hr) || circleRect(px, py, r, x - 0.35 * gw, floorY() - 0.8 * gw, 2.65 * gw, H)) return bk;
    }
    return null;
  }

  function updateGates(dt) {
    const dx = speed * dt, b = bird, px = playerX();
    scroll += dx;
    spawnX -= dx;
    for (let i = gates.length - 1; i >= 0; i--) {
      const g = gates[i];
      g.x -= dx;
      if (g.gapVy) {
        g.gapY += g.gapVy * dt;
        if (g.gapY < g.gapMin || g.gapY > g.gapMax) {
          g.gapVy *= -1;
          g.gapY = clamp(g.gapY, g.gapMin, g.gapMax);
        }
      }
      for (let j = 0; j < g.coins.length; j++) {
        const c = g.coins[j];
        if (c.got) continue;
        c.x -= dx;
        c.ph += dt * 5;
        if (!b.alive) continue;
        if (circleCircle(px, b.y, birdR(), c.x, c.y, c.r)) {
          c.got = true;
          coinsGot++;
          score += 25;
          PA.sfx("coin", { pitch: 1 + (coinsGot % 7) * 0.04 });
          texts.add(c.x, c.y, "+25", { color: "#ffd27a", size: 16, life: 0.75, vy: -45 });
          fx.burst(c.x, c.y, { n: 12, colors: ["#ffd27a", "#fff3c4", "#ff9b4a"], speed: 110, life: 0.45, size: 2.5 });
          paintHud();
        }
      }
      if (b.alive && overT <= 0) { const what = collideGate(g, b.y); if (what) kill(b, what); }

      if (!g.scored && px > g.x && overT <= 0) {
        g.scored = true;
        gatesPassed++;
        score += 10;
        PA.sfx("blip", { pitch: 1 + gatesPassed * 0.03 });
        texts.add(g.x, g.gapY - g.gapH * 0.35, "+10", { color: "#eef2ff", size: 18, life: 0.7, vy: -35 });
        PA.music.intensity(Math.min(1, gatesPassed / 28));
        paintHud();
      }
      if (!g.nearAward && g.scored && b.alive && overT <= 0) {
        g.nearAward = true;
        const top = g.gapY - g.gapH / 2;
        const bot = g.gapY + g.gapH / 2;
        const edge = Math.min(Math.abs(b.y - top), Math.abs(b.y - bot));
        const nearLim = 22 * S;
        if (edge < nearLim && edge > birdR() * 0.35) {
          nearMisses++;
          comboNear++;
          const bonus = 12 + comboNear * 3;
          score += bonus;
          PA.sfx("combo", { pitch: 1 + comboNear * 0.06 });
          texts.add(px, b.y - 28 * S, "CLOSE! +" + bonus, { color: COL.near, size: 17, life: 0.85, vy: -40 });
          fx.burst(px, b.y, { n: 8, color: COL.near, speed: 70, life: 0.4, size: 2 });
          paintHud();
        } else comboNear = 0;
      }
      if (g.x < -gateW() * 3) gates.splice(i, 1);
    }
    if (spawnX < W - 300 * S) spawnGate(spawnX + (SPACING + rand(-15, 35)) * S);
  }

  function update(dt, t) {
    simT += dt;
    fx.update(dt); texts.update(dt);
    let n = 0;
    for (let i = 0; i < debris.length; i++) {
      const d = debris[i];
      d.vy += 700 * S * dt; d.vx *= 1 - dt * 1.5; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt; d.life -= dt;
      if (d.life > 0) debris[n++] = d;
    }
    debris.length = n;
    speed = scrollSpeed();
    const b = bird;
    if (b) { b.flapT += dt; b.blink -= dt; if (b.blink < -0.14) b.blink = rand(2, 5); }

    if (PA.state !== "play" || !b) {
      scroll += 40 * S * dt;
      return;
    }

    if (overT > 0) {
      overT -= dt;
      b.vy += 980 * S * dt;
      b.y += b.vy * dt;
      b.rot += dt * 7;
      if (overT <= 0 && !overSent) {
        overSent = true;
        hud.classList.remove("on");
        PA.sfx("gameover");
        PA.gameOver(score, {
          title: gatesPassed >= 40 ? "Sky legend!" : gatesPassed >= 15 ? "High flyer!" : "Grounded!",
          stats: [["Gaps", gatesPassed], ["Amber", coinsGot], ["Close calls", nearMisses]]
        });
      }
      return;
    }

    if (b.cd > 0) b.cd -= dt;
    if (started) {
      b.vy += 920 * S * dt;
      b.y += b.vy * dt;
      b.rot = clamp(b.vy / 560, -0.45, 0.9);
    } else {
      b.y += Math.sin(t * 2.4) * 0.35;
      b.rot = Math.sin(t * 2.4) * 0.06;
    }
    if (b.y - birdR() < ceilY()) kill(b, "branch");
    else if (b.y + birdR() > floorY()) kill(b, "tree");

    // Nothing scrolls in until the first flap, so the run starts when you do.
    if (started) updateGates(dt);
    else scroll += 40 * S * dt;
  }

  /* ================= drawing ================= */
  function stripOff(par) { return ((scroll * par) % TW + TW) % TW; }
  function drawStrip(L, par) {
    if (!L) return;
    const off = stripOff(par), h = L.y1 - L.y0;
    ctx.drawImage(L.c, -off, L.y0, TW, h);
    if (TW - off < W) ctx.drawImage(L.c, TW - off, L.y0, TW, h);
  }
  function drawClouds(t) {
    ctx.globalAlpha = 0.9;
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i], art = cloudArt[i % cloudArt.length], q = c.s / S, span = W + art.w * q + 100 * S;
      const x = ((c.x - scroll * c.par - t * 5 * S) % span + span) % span - art.w * q;
      ctx.drawImage(art.c, x, c.y - art.h * q * 0.6, art.w * q, art.h * q);
    }
    ctx.globalAlpha = 1;
  }
  function drawGlints(t) {
    const off = stripOff(0.08);
    ctx.strokeStyle = "#dce8ff"; ctx.lineCap = "round"; ctx.lineWidth = 1.3 * S;
    for (let i = 0; i < glints.length; i++) {
      const gl = glints[i], a = 0.5 + 0.5 * Math.sin(t * 2 + gl.ph);
      if (a < 0.35) continue;
      let x0 = gl.x - off; if (x0 < -40) x0 += TW;
      if (x0 > W + 40) continue;
      ctx.globalAlpha = a * 0.7; ctx.beginPath(); ctx.moveTo(x0, gl.y); ctx.lineTo(x0 + gl.w * a, gl.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawHutGlow(t) {
    if (!hut) return;
    const off = stripOff(0.16), a = 0.55 + 0.18 * Math.sin(t * 2.1) + 0.08 * Math.sin(t * 7.3);
    let x = hut.x - off; if (x < -200 * S) x += TW;
    if (x > W + 200 * S) return;
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a;
    blit(SPR.warm, x + 23 * S, hut.y - 6 * S);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  function drawFlies(t) {
    const off = stripOff(0.5), s = SPR.fly;
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < flies.length; i++) {
      const f = flies[i];
      const a = 0.25 + 0.75 * Math.max(0, Math.sin(t * f.sp * 2 + f.ph));
      const y = f.y + Math.sin(t * f.sp + f.ph) * 14 * S;
      let x = f.x - off + Math.cos(t * f.sp * 0.7 + f.ph) * 18 * S;
      if (x < -20) x += TW;
      if (x > W + 20) continue;
      ctx.globalAlpha = a;
      const q = f.s;
      ctx.drawImage(s.c, x - s.ox * q, y - s.oy * q, s.w * q, s.h * q);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  /* ---------- obstacles ---------- */
  function drawCrop(s, x, y0, y1, w) {
    let h = y1 - y0;
    if (h < 1) return;
    if (h > s.h) h = s.h;
    ctx.drawImage(s.c, 0, 0, s.c.width, Math.min(s.c.height, h * s.k), x - w / 2, y0, w, h);
  }
  function drawTree(x, gb, p, t) {
    const gw = gateW(), R = gw * 0.6, cy = gb + R;
    drawCrop(SPR.trunk, x, cy, H, gw * 0.42);
    blit(SPR.crown[p.pal * 2 + p.v], x + Math.sin(t * 1.4 + p.ph) * 1.5 * S, cy);
  }
  function drawBranch(x, gt, p, t) {
    const gw = gateW(), R = gw * 0.5, cy = gt - R;
    if (cy > 1) {
      drawCrop(SPR.trunk, x, 0, cy, gw * 0.4);
      ctx.strokeStyle = "#2a7a62"; ctx.lineWidth = 2 * S; ctx.lineCap = "round";
      for (let i = 0; i < 2; i++) {
        const vx = x + (i ? 0.17 : -0.15) * gw, vy0 = cy * (0.25 + i * 0.3), vl = Math.min(56 * S, (cy - vy0) * 0.9);
        if (vl < 8 * S) continue;
        const sw = Math.sin(t * 1.8 + p.ph + i) * 3 * S;
        ctx.beginPath(); ctx.moveTo(vx, vy0); ctx.quadraticCurveTo(vx + sw, vy0 + vl * 0.5, vx + sw * 0.5, vy0 + vl); ctx.stroke();
        for (let y = vy0 + 10 * S, j = 0; y < vy0 + vl; y += 13 * S, j++) blit(j % 2 ? SPR.leafA : SPR.leafB, vx + sw * 0.4, y);
      }
    }
    blit(SPR.hang[p.pal * 2 + p.v], x + Math.sin(t * 1.4 + p.ph) * 1.5 * S, cy);
  }
  const SPOKES = 9, SPC = new Float32Array(SPOKES), SPS = new Float32Array(SPOKES);
  for (let i = 0; i < SPOKES; i++) { const a = i / SPOKES * TAU + 0.2; SPC[i] = Math.cos(a); SPS[i] = Math.sin(a); }
  function drawVines(x, tip, p, t, web) {
    const gw = gateW(), n = web ? 4 : 6, half = (web ? 0.58 : 0.48) * gw, anchor = 0;
    if (tip - anchor < 2) return;
    ctx.lineCap = "round";
    for (let i = 0; i < n; i++) {
      const vx = x - half + (2 * half) * (i / (n - 1)), end = tip - (web ? 0 : (i % 3) * 3 * S) - 2 * S;
      const sw = Math.sin(t * 1.6 + p.ph + i * 0.9) * 2.5 * S;
      ctx.strokeStyle = i % 2 ? "#1f6a56" : "#2a8068"; ctx.lineWidth = 4 * S;
      ctx.beginPath(); ctx.moveTo(vx, anchor - 6 * S); ctx.bezierCurveTo(vx + sw, anchor + (end - anchor) * 0.35, vx - sw, anchor + (end - anchor) * 0.7, vx + sw * 0.4, end); ctx.stroke();
      for (let y = anchor + 12 * S + (i % 2) * 7 * S; y < end - 6 * S; y += 13 * S) {
        const k = (y - anchor) / (end - anchor), lx = vx + sw * Math.sin(k * Math.PI) * 0.6;
        blit((i + Math.round(y / 13)) % 2 ? SPR.leafA : SPR.leafB, lx, y);
      }
      if (!web) blit(SPR.flower[p.flower], vx + sw * 0.4, end - 3 * S);
    }
    if (!web) return;
    // the web, strung across the bottom of the curtain, silvered by the moon
    const r = Math.min(half * 1.05, (tip - anchor) * 0.5), cy = tip - r;
    ctx.strokeStyle = "rgba(220,232,255,.85)"; ctx.lineWidth = 1.1 * S;
    ctx.beginPath();
    for (let i = 0; i < SPOKES; i++) { ctx.moveTo(x, cy); ctx.lineTo(x + SPC[i] * r, cy + SPS[i] * r); }
    ctx.stroke();
    for (let ring = 1; ring <= 4; ring++) {
      const rr = r * ring / 4.2;
      ctx.beginPath();
      for (let i = 0; i <= SPOKES; i++) {
        const a = i % SPOKES, b = (i + SPOKES - 1) % SPOKES;
        const ax = x + SPC[a] * rr, ay = cy + SPS[a] * rr;
        if (!i) ctx.moveTo(ax, ay);
        else ctx.quadraticCurveTo(x + (SPC[a] + SPC[b]) * rr * 0.42, cy + (SPS[a] + SPS[b]) * rr * 0.42, ax, ay);
      }
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(235,242,255,.95)";
    for (let i = 0; i < 4; i++) { const a = t * 0.8 + i * 1.7, rr = r * (0.3 + (i % 3) * 0.22); ctx.beginPath(); ctx.arc(x + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.2 * S, 0, TAU); ctx.fill(); }
    // a sleepy little spider bobbing on its thread
    const sy = cy + r * 0.45 + Math.sin(t * 2.2 + p.ph) * 4 * S, sr = 6.5 * S;
    ctx.strokeStyle = "rgba(220,232,255,.85)"; ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x, sy); ctx.stroke();
    ctx.strokeStyle = "#2a1a5a"; ctx.lineWidth = 1.6 * S;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) for (let sg = -1; sg <= 1; sg += 2) {
      const wig = Math.sin(t * 9 + i) * 1.5 * S;
      ctx.moveTo(x + sg * sr * 0.5, sy + (i - 1.5) * 2 * S);
      ctx.quadraticCurveTo(x + sg * sr * 1.4, sy + (i - 2.5) * 3 * S + wig, x + sg * sr * 1.6, sy + (i - 1) * 3.5 * S);
    }
    ctx.stroke();
    blit(SPR.spider, x, sy);
  }
  function drawRock(x, gb, p) {
    const gw = gateW();
    drawCrop(SPR.stones[p.v], x, gb + 0.3 * gw, H, SPR.stones[p.v].w);
    blit(SPR.rockCap, x, gb);
  }
  const NK = 18, NX = new Float32Array(NK + 1), NY = new Float32Array(NK + 1), NR = new Float32Array(NK + 1);
  function drawBronto(x, gb, p, t) {
    const gw = gateW(), hr = gw * 0.4, fy = floorY();
    const bx = x + 0.75 * gw, by = fy - 0.5 * gw;
    const fi = ((((t * 0.55 + p.ph / TAU) % 1) * BRF) | 0) % BRF;
    const bob = brontoBob(fi / BRF * TAU) * gw;
    const sway = Math.sin(t * 1.3 + p.ph) * 3 * S;
    // neck first, so the shoulder in the body sprite covers its base
    const hy = gb + hr, sx = 0.12 * gw, sy = by - 0.06 * gw + bob;
    if (sy > hy) {
      const x1 = sx + 6 * S, y1 = sy - (sy - hy) * 0.4, x2 = -6 * S + sway, y2 = hy + (sy - hy) * 0.35, x3 = sway * 0.5;
      for (let i = 0; i <= NK; i++) {
        const k = i / NK, u = 1 - k;
        NX[i] = u * u * u * sx + 3 * u * u * k * x1 + 3 * u * k * k * x2 + k * k * k * x3;
        NY[i] = u * u * u * sy + 3 * u * u * k * y1 + 3 * u * k * k * y2 + k * k * k * hy;
        NR[i] = gw * (0.31 - 0.1 * k);
      }
      ctx.save(); ctx.translate(x, 0);
      if (!SPR.neckGrad) {
        SPR.neckGrad = ctx.createLinearGradient(-0.32 * gw, 0, 0.36 * gw, 0);
        SPR.neckGrad.addColorStop(0, BR.hi); SPR.neckGrad.addColorStop(0.32, BR.body); SPR.neckGrad.addColorStop(1, BR.deep);
      }
      ctx.fillStyle = SPR.neckGrad;
      ctx.beginPath(); ctx.moveTo(NX[0] - NR[0], NY[0]);
      for (let i = 1; i <= NK; i++) ctx.lineTo(NX[i] - NR[i], NY[i]);
      for (let i = NK; i >= 0; i--) ctx.lineTo(NX[i] + NR[i], NY[i]);
      ctx.closePath(); ctx.fill();
      // white front patch with a ragged inner edge
      ctx.fillStyle = BR.belly;
      ctx.beginPath(); ctx.moveTo(NX[0] - NR[0] * 0.9, NY[0]);
      for (let i = 1; i <= NK; i++) ctx.lineTo(NX[i] - NR[i] * 0.9, NY[i]);
      for (let i = NK; i >= 0; i--) ctx.lineTo(NX[i] - NR[i] * (i % 2 ? 0.28 : 0.5), NY[i]);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(205,245,255,.5)"; ctx.lineWidth = 1.6 * S; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(NX[0] - NR[0] + 1 * S, NY[0]);
      for (let i = 1; i <= NK; i++) ctx.lineTo(NX[i] - NR[i] + 1 * S, NY[i]);
      ctx.stroke();
      ctx.restore();
    }
    blit(SPR.bronto[fi], bx, by);
    const hx = x - 0.06 * gw + sway * 0.5;
    const chew = Math.max(0, Math.sin(t * 5 + p.ph)) * 2 * S;
    blit(SPR.munch, hx - hr * 0.95, hy + hr * 0.45 + chew * 0.5);
    blit(((t + p.blink) % 4) < 0.16 ? SPR.bHeadB : SPR.bHead, hx, hy);
  }
  function drawGate(g, t) {
    const gt = g.gapY - g.gapH / 2, gb = g.gapY + g.gapH / 2, x = g.x;
    const tk = g.top.kind, bk = g.bot.kind;
    if (bk === "bronto") drawBronto(x, gb, g.bot, t);
    else if (bk === "rock") drawRock(x, gb, g.bot);
    else drawTree(x, gb, g.bot, t);
    if (tk === "branch") drawBranch(x, gt, g.top, t);
    else drawVines(x, gt, g.top, t, tk === "web");
    blit(SPR.mass[g.top.mass], x, 0);
  }

  /* ---------- the pterodactyl ---------- */
  function wingK(b) {
    if (PA.state !== "play") return 0.5 + 0.5 * Math.sin(simT * 6);
    if (!started) return 0.5 + 0.5 * Math.sin(simT * 7);
    const t = b.flapT;
    if (t < 0.09) return PA.ease.outCubic(t / 0.09);
    if (t < 0.42) return 1 - PA.ease.inOut((t - 0.09) / 0.33);
    return 0.08 + 0.06 * Math.sin(simT * 3);
  }
  function drawPtero(b) {
    if (!b) return;
    const s = !b.alive ? SPR.pDead : (b.blink > 0 ? SPR.pOpen : SPR.pBlink)[Math.round(clamp(wingK(b), 0, 1) * (PF - 1))];
    ctx.save();
    ctx.translate(playerX(), b.y);
    ctx.rotate(b.rot);
    ctx.drawImage(s.c, -s.ox, -s.oy, s.w, s.h);
    ctx.restore();
  }

  function drawHint(t) {
    if (started || PA.state !== "play" || overT > 0) return;
    ctx.save();
    ctx.globalAlpha = 0.65 + 0.3 * Math.sin(t * 3);
    ctx.textAlign = "center";
    ctx.font = "800 " + Math.round(16 * S) + "px Manrope, system-ui, sans-serif";
    ctx.lineWidth = 5 * S; ctx.strokeStyle = "rgba(8,10,48,.75)"; ctx.lineJoin = "round";
    ctx.strokeText("Tap or press Space to flap", W / 2, H * 0.72);
    ctx.fillStyle = "#eef2ff";
    ctx.fillText("Tap or press Space to flap", W / 2, H * 0.72);
    ctx.restore();
  }

  function render(t) {
    const sh = PA.shakeOffset();
    ctx.setTransform(DPR, 0, 0, DPR, DPR * sh.x, DPR * sh.y);
    if (sky) ctx.drawImage(sky, 0, 0, W, H);
    drawClouds(t);
    drawGlints(t);
    drawStrip(far, 0.05);
    drawStrip(mid, 0.16);
    drawHutGlow(t);
    drawStrip(near, 0.36);
    drawFlies(t);
    const gw = gateW();
    for (let i = 0; i < gates.length; i++) { const g = gates[i]; if (g.x > -gw * 2.6 && g.x < W + gw * 1.6) drawGate(g, t); }
    for (let i = 0; i < gates.length; i++) {
      const cs = gates[i].coins;
      for (let j = 0; j < cs.length; j++) { const c = cs[j]; if (!c.got && c.x > -20 && c.x < W + 20) blit(SPR.amber, c.x, c.y + Math.sin(c.ph) * 3 * S); }
    }
    drawStrip(ground, 1);
    drawStrip(fringe, 1);
    drawPtero(bird);
    for (let i = 0; i < debris.length; i++) {
      const d = debris[i];
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a); ctx.globalAlpha = Math.min(1, d.life * 2);
      ctx.fillStyle = d.c; ctx.beginPath(); ctx.ellipse(0, 0, d.s, d.s * 0.45, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (vignette) ctx.drawImage(vignette, 0, 0, W, H);
    fx.draw(ctx);
    texts.draw(ctx);
    drawHint(t);
  }

  window.__nflap = () => ({
    score, gates: gatesPassed, coins: coinsGot, nearMisses,
    alive: !!bird && bird.alive && overT <= 0, started,
    gateList: gates.map(g => ({ x: g.x, gapY: g.gapY, gapH: g.gapH, top: g.top.kind, bot: g.bot.kind })),
    y: bird ? bird.y : 0, vy: bird ? bird.vy : 0,
    gateCount: gates.length, scroll, speed
  });

  PA.loop(update, render);
})();

</script>
