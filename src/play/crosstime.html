<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Crosstime — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#070912;color:#f6f0ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;position:fixed;inset:0}
</style></head><body>
<canvas id="c" aria-label="Crosstime street"></canvas>
<script>
window.paConfig = {
  slug: "crosstime", title: "Crosstime", native: true, music: "synthwave", unit: "points",
  controls: [["↑ ← → ↓ / WASD", "Hop"], ["Touch", "Tap to hop forward, swipe to hop any way"], ["Hit?", "Time rewinds to your last safe spot"], ["Clocks", "Refill rewinds"]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script>
(() => {
"use strict";
// A road-and-river crosser where getting hit rewinds time. Every lane is a pure function of the world
// clock (vehicle x = offset + speed * t, wrapped), so running the clock backwards replays the street in
// reverse for free. The player's own state is snapshotted every frame; a rewind scrubs both back to the
// last moment you stood somewhere safe, about two and a half seconds ago. Rewinds are limited.
const COLS = 9, M = 12, P = COLS + 2 * M, TAU = Math.PI * 2;
const HOP = .12, REWIND_BACK = 2.4, REWIND_DUR = .8, MAX_CHARGES = 3, HIST_SEC = 7;
const fx = new PA.Particles(1400), texts = new PA.Texts();

const CAR_COLS = [["#ff5ca8", "#a3205f"], ["#5ef2ff", "#1d7f9a"], ["#ffd36b", "#b4801b"], ["#b48cff", "#5a35b0"], ["#7dffb0", "#1f9a5f"], ["#ff8a5c", "#b0441d"], ["#f2f4ff", "#8a90b0"]];
const KINDS = {
  car: { len: 1.35 }, taxi: { len: 1.4 }, van: { len: 1.85 }, bus: { len: 2.7 }, truck: { len: 3.2 }
};

let lanes, genTop, player, maxRow, score, best = 0, gems, charges, rewindsUsed, wt, fog, fogOn, cam, hist, rw, dead, deadT, deadKind, grace, queued, started, lastHopAt, nearMiss, shownScore;
try { best = +localStorage.getItem("ct_best") || 0; } catch (e) {}

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[(Math.random() * a.length) | 0];
const mod = (a, n) => ((a % n) + n) % n;
const diff = (r) => Math.min(1, Math.max(0, r) / 260);

/* ---------- world generation ---------- */
function lane(r) { while (genTop <= r + 2) genGroup(); return lanes.get(r) || lanes.get(genTop - 1); }
function put(type, extra) { const l = Object.assign({ type, row: genTop, items: [] }, extra); lanes.set(genTop, l); genTop++; return l; }
function grassRow(trees) {
  const t = new Set(), d = diff(genTop);
  if (trees && genTop > 3) {
    const n = (Math.random() * (2 + d * 2.5)) | 0;
    for (let i = 0; i < n; i++) t.add((Math.random() * COLS) | 0);
    if (t.size >= COLS - 1) t.clear();
  }
  // decorative trees outside the play columns
  const deco = [];
  for (let c = -M; c < COLS + M; c++) if ((c < 0 || c >= COLS) && Math.random() < .45) deco.push(c);
  const l = put("grass", { trees: t, deco, lamp: Math.random() < .5 });
  if (genTop > 6 && Math.random() < .22) {
    let c = (Math.random() * COLS) | 0; if (!t.has(c)) l.items.push({ c, kind: "gem" });
  }
  return l;
}
function roadRow(dir, d, slow) {
  const kinds = slow ? ["bus", "truck", "van", "truck"] : d < .2 ? ["car", "car", "taxi", "van"] : ["car", "taxi", "van", "car", "bus", "truck"];
  let speed = (1.2 + Math.random() * 1.3 + d * 2.4) * (slow ? .72 : 1);
  const objs = [], gmin = 2.7 - d * .7, gmax = 7.2 - d * 3.4;
  const x0 = Math.random() * P;
  let x = x0;
  for (let guard = 0; guard < 20; guard++) {
    const kind = pick(kinds), len = KINDS[kind].len;
    if (objs.length && x + len - x0 > P - gmin) break;
    objs.push({ off: x, len, kind, col: (Math.random() * CAR_COLS.length) | 0 });
    x += len + rnd(gmin, gmax);
  }
  const l = put("road", { v: speed * dir, objs });
  if (genTop > 6 && Math.random() < .12) l.items.push({ c: (Math.random() * COLS) | 0, kind: "gem" });
  return l;
}
function riverRow(dir, d) {
  const turtles = Math.random() < .25 + d * .3;
  const speed = (.75 + Math.random() * .8 + d * 1.2) * dir;
  const objs = [], x0 = Math.random() * P;
  let x = x0;
  for (let guard = 0; guard < 20; guard++) {
    const len = turtles ? (Math.random() < .5 ? 2 : 3) : Math.max(1.8, rnd(2.4, 4.3) - d * 1.1);
    if (objs.length && x + len - x0 > P - 1.2) break;
    const o = { off: x, len, kind: turtles ? "turtle" : "log" };
    if (turtles) { o.dive = Math.random() < .3 + d * .45; o.phase = Math.random() * 7; }
    objs.push(o);
    x += len + rnd(1.1, 2.2 + d * 1.1);
  }
  return put("river", { v: speed * dir, objs });
}
function railRow(d) {
  return put("rail", { dir: Math.random() < .5 ? 1 : -1, T: rnd(6.5, 10) - d * 2, phase: Math.random() * 10, len: rnd(12, 20) });
}
function clockMaybe() {
  // a clock on a grass row roughly every 20 rows refills one rewind
  if (genTop - lastClock < 18 || genTop < 10) return;
  const l = lanes.get(genTop - 1);
  if (!l || l.type !== "grass") return;
  const free = []; for (let c = 0; c < COLS; c++) if (!l.trees.has(c)) free.push(c);
  if (!free.length) return;
  l.items = [{ c: pick(free), kind: "clock" }];
  lastClock = genTop;
}
let lastClock = 0;
function genGroup() {
  const d = diff(genTop);
  if (genTop < 4) { const l = grassRow(false); l.start = true; return; }
  // a strip of grass between hazards (sometimes none once it gets hard)
  const g = Math.random() < d * .35 ? 0 : 1 + (Math.random() < .35 - d * .25 ? 1 : 0);
  for (let i = 0; i < g; i++) grassRow(i === 0 || g === 1);
  clockMaybe();
  const r = Math.random();
  if (genTop > 14 && r < .14) { railRow(d); if (Math.random() < .3 + d * .3) railRow(d); return; }
  if (r < .58) {
    const n = 1 + ((Math.random() * (2 + d * 3)) | 0);
    let dir = Math.random() < .5 ? 1 : -1;
    for (let i = 0; i < n; i++) { roadRow(dir, d, n > 2 && i === 0 && Math.random() < .5); dir = Math.random() < .7 ? -dir : dir; }
  } else {
    const n = 1 + ((Math.random() * (2 + d * 2.5)) | 0);
    let dir = Math.random() < .5 ? 1 : -1;
    for (let i = 0; i < n; i++) { riverRow(dir, d); dir = -dir; }
  }
}

/* ---------- lane maths (all functions of the world clock t) ---------- */
function objX(l, o, t) { return mod(o.off + l.v * t, P) - M; }
function turtleState(o, t) {
  if (!o.dive) return 0;
  const k = mod(t + o.phase, 7);
  // 0 surfaced · 0..1 sinking/rising · 1 under
  if (k < 4.2) return 0;
  if (k < 4.9) return (k - 4.2) / .7;
  if (k < 6.2) return 1;
  return 1 - (k - 6.2) / .8;
}
function train(l, t) {
  const k = mod(t + l.phase, l.T), pass = (P + l.len) / 26, start = l.T - pass;
  const warn = k > start - 1.6;
  if (k < start) return { warn, x: null };
  const run = (k - start) * 26;
  const head = l.dir > 0 ? -M + run : COLS + M - run;
  return { warn: true, x: l.dir > 0 ? head - l.len : head, head };
}

/* ---------- player ---------- */
function newPlayer() { return { x: 4, row: 0, hop: null, face: 0, bump: 0, land: 0 }; }
function reset() {
  lanes = new Map(); genTop = 0; lastClock = 0;
  for (let i = 0; i < 40; i++) genGroup();
  player = newPlayer();
  maxRow = 0; score = 0; shownScore = 0; gems = 0; charges = 2; rewindsUsed = 0; wt = 0; fog = -6; fogOn = false;
  cam = 0; hist = []; rw = null; dead = false; deadT = 0; deadKind = ""; grace = 0; queued = null; started = false; lastHopAt = 0; nearMiss = 0;
  fx.clear(); texts.clear();
  PA.music.intensity(0);
}
function curRow() { const h = player.hop; return h ? (h.t < .5 ? h.fr : h.tr) : player.row; }
function playerX() { const h = player.hop; if (!h) return player.x; const k = h.t; return h.fx + (h.tx - h.fx) * k; }

function tryHop(dx, dr) {
  if (dead || rw || PA.state !== "play") return;
  if (player.hop) { queued = [dx, dr]; return; }
  const from = lane(player.row), tr = player.row + dr;
  if (tr < 0) { player.bump = 1; return; }
  const to = lane(tr);
  let tx = player.x + dx;
  if (to.type !== "river" || from.type !== "river" || dr !== 0) {
    if (to.type !== "river") tx = Math.round(tx);
  }
  if (to.type === "river") tx = PA.clamp(tx, 0, COLS - 1);
  player.face = dr > 0 ? 0 : dr < 0 ? 2 : dx > 0 ? 1 : 3;
  if (tx < 0 || tx > COLS - 1 || (to.type === "grass" && to.trees.has(Math.round(tx)))) {
    player.bump = 1; PA.sfx("click", { pitch: .6, vol: .3 }); return;
  }
  player.hop = { fx: player.x, tx, fr: player.row, tr, t: 0, ride: from.type === "river" && dr === 0 ? from.v : 0 };
  started = true; fogOn = true; lastHopAt = wt;
  PA.sfx("jump", { pitch: 1.4 + Math.random() * .2, vol: .25 });
}

function land() {
  const h = player.hop;
  player.x = h.tx; player.row = h.tr; player.hop = null; player.land = 1;
  if (player.row > maxRow) { score += 10 * (player.row - maxRow); maxRow = player.row; }
  const l = lane(player.row);
  for (const it of l.items) {
    if (it.taken || it.c !== Math.round(player.x) || l.type === "river") continue;
    it.taken = true;
    const p = toScreen(it.c + .5, player.row);
    if (it.kind === "gem") { gems++; score += 50; PA.sfx("coin"); fx.burst(p.x, p.y, { n: 14, colors: ["#5ef2ff", "#fff"], speed: 200, life: .5 }); texts.add(p.x, p.y - 20, "+50", { color: "#5ef2ff", size: 18 }); }
    else { it.full = charges >= MAX_CHARGES; charges = Math.min(MAX_CHARGES, charges + 1); score += 100; PA.sfx("power"); fx.burst(p.x, p.y, { n: 24, colors: ["#ffd36b", "#fff"], speed: 260, life: .7 }); texts.add(p.x, p.y - 24, it.full ? "+100" : "+1 REWIND", { color: "#ffd36b", size: 20, life: 1.2 }); }
  }
  if (l.type !== "river") PA.sfx("thud", { pitch: 2.2, vol: .12 });
  if (queued) { const q = queued; queued = null; tryHop(q[0], q[1]); }
}

/* ---------- death + rewind ---------- */
function die(kind) {
  if (dead || rw || grace > 0) return;
  const p = toScreen(playerX() + .5, curRow());
  if (kind === "car" || kind === "train") { PA.sfx("hit"); PA.shake(kind === "train" ? 14 : 8, .35); fx.burst(p.x, p.y, { n: 30, colors: ["#ff5ca8", "#fff", "#ffd36b"], speed: 320, life: .6 }); }
  else if (kind === "water") { PA.sfx("whoosh", { pitch: .5 }); fx.burst(p.x, p.y, { n: 26, colors: ["#5ef2ff", "#bff6ff"], speed: 180, life: .7, gravity: 300, angle: -Math.PI / 2, spread: 2.4 }); }
  else { PA.sfx("explode", { pitch: 1.4 }); fx.burst(p.x, p.y, { n: 30, colors: ["#b48cff", "#ff5ca8"], speed: 220, life: .8 }); }
  PA.hitstop(70);
  if (charges > 0) { startRewind(kind); return; }
  dead = true; deadT = 0; deadKind = kind; player.hop = null;
}
function safeSnap(target) {
  // the newest snapshot at or before `target` where you were standing still on solid ground
  for (let i = hist.length - 1; i >= 0; i--) {
    const s = hist[i];
    if (s.wt > target) continue;
    if (s.p.hop) continue;
    const l = lanes.get(s.p.row);
    if (l && l.type === "grass") return i;
  }
  for (let i = hist.length - 1; i >= 0; i--) if (hist[i].wt <= target) return i;
  return 0;
}
function startRewind(kind) {
  if (!hist.length) hist.push({ wt, p: JSON.parse(JSON.stringify(player)), fog });
  const i = safeSnap(wt - REWIND_BACK);
  rw = { from: wt, to: hist[i].wt, snaps: hist.slice(i), k: 0, kind, fogFrom: fog };
  charges--; rewindsUsed++; queued = null;
  PA.sfx("whoosh", { pitch: .7 }); PA.tone({ freq: 900, to: 160, type: "sawtooth", dur: REWIND_DUR, vol: .05, filter: 2400 });
  texts.add(view.w / 2, view.h * .38, "◀◀ REWIND", { color: "#ffd36b", size: 34, life: 1.1, vy: -10 });
}
function snapAt(t) {
  const s = rw.snaps;
  for (let i = s.length - 1; i >= 0; i--) if (s[i].wt <= t) return s[i];
  return s[0];
}
function finishRewind() {
  const s = rw.snaps[0];
  wt = s.wt; player = JSON.parse(JSON.stringify(s.p)); fog = s.fog;
  hist = hist.filter((h) => h.wt <= wt);
  rw = null; grace = .45;
  texts.add(view.w / 2, view.h * .38, charges ? charges + " LEFT" : "LAST CHANCE", { color: charges ? "#5ef2ff" : "#ff5ca8", size: 22, life: 1.1, vy: -20 });
}

/* ---------- update ---------- */
function update(dt) {
  fx.update(dt); texts.update(dt);
  if (!lanes) return;
  if (PA.state !== "play") return;
  player.bump = Math.max(0, player.bump - dt * 6); player.land = Math.max(0, player.land - dt * 7);
  if (rw) {
    rw.k = Math.min(1, rw.k + dt / REWIND_DUR);
    const e = PA.ease.inOut(rw.k);
    wt = rw.from + (rw.to - rw.from) * e;
    const s = snapAt(wt);
    player = JSON.parse(JSON.stringify(s.p)); fog = s.fog;
    if (rw.k >= 1) finishRewind();
    cam += (camTarget() - cam) * Math.min(1, dt * 6);
    return;
  }
  if (dead) {
    deadT += dt; wt += dt;
    if (deadT > 1.1 && deadT - dt <= 1.1) gameOver();
    return;
  }
  if (started) wt += dt;
  grace = Math.max(0, grace - dt);

  // hop tween (and riding a log while hopping along it)
  const h = player.hop;
  if (h) {
    h.t += dt / HOP;
    if (h.ride) { h.fx += h.ride * dt; h.tx += h.ride * dt; }
    if (h.t >= 1) land();
  } else {
    const l = lane(player.row);
    if (l.type === "river") player.x += l.v * dt;
  }

  // held keys keep hopping
  if (!player.hop && !queued) {
    if (PA.down("ArrowUp", "KeyW") && wt - lastHopAt > .2) tryHop(0, 1);
    else if (PA.down("ArrowDown", "KeyS") && wt - lastHopAt > .2) tryHop(0, -1);
    else if (PA.down("ArrowLeft", "KeyA") && wt - lastHopAt > .2) tryHop(-1, 0);
    else if (PA.down("ArrowRight", "KeyD") && wt - lastHopAt > .2) tryHop(1, 0);
  }

  // the static creeps up behind you
  if (fogOn) {
    const d = diff(maxRow);
    fog += dt * (.32 + d * .55);
    fog = Math.max(fog, maxRow - 8);
  }

  collide(dt);
  if (!rw && !dead) hist.push({ wt, p: JSON.parse(JSON.stringify(player)), fog });
  while (hist.length && hist[0].wt < wt - HIST_SEC) hist.shift();

  cam += (camTarget() - cam) * Math.min(1, dt * 5);
  PA.music.intensity(Math.min(1, diff(maxRow) * 1.2));
}
function camTarget() { const h = player.hop; const r = h ? h.fr + (h.tr - h.fr) * h.t : player.row; return Math.max(cam - 3, r); }

function collide(dt) {
  if (grace > 0) return;
  const row = curRow(), l = lane(row), px = playerX();
  if (row < fog - .15) { die("fog"); return; }
  if (l.type === "road") {
    let close = Infinity;
    for (const o of l.objs) {
      const x = objX(l, o, wt), a = x + .1, b = x + o.len - .1;
      if (px + .78 > a && px + .22 < b) { die("car"); return; }
      close = Math.min(close, Math.abs(px + .5 - (x + o.len / 2)) - o.len / 2);
    }
    if (!player.hop && close < .55 && nearMiss <= 0) {
      nearMiss = .8; score += 15;
      const p = toScreen(px + .5, row); texts.add(p.x, p.y - 26, "CLOSE +15", { color: "#ff5ca8", size: 14, life: .7 });
    }
  } else if (l.type === "rail") {
    const tr = train(l, wt);
    if (tr.x != null && px + .78 > tr.x && px + .22 < tr.x + l.len) { die("train"); return; }
  } else if (l.type === "river" && !player.hop) {
    if (px < -.45 || px > COLS - .55) { die("water"); return; }
    let ok = false;
    for (const o of l.objs) {
      const x = objX(l, o, wt);
      if (px + .5 > x - .05 && px + .5 < x + o.len + .05) {
        if (o.kind === "turtle" && turtleState(o, wt) > .55) continue;
        ok = true; break;
      }
    }
    if (!ok) { die("water"); return; }
  }
  nearMiss -= dt;
}

function gameOver() {
  PA.sfx("gameover");
  if (score > best) { best = score; try { localStorage.setItem("ct_best", best); } catch (e) {} }
  const why = { car: "Flattened in traffic", water: "Swept downstream", train: "Caught by the night train", fog: "The static caught up" }[deadKind] || "Out of time";
  PA.gameOver(score, {
    kicker: why,
    title: maxRow >= 150 ? "Legend of the crossing" : maxRow >= 60 ? "Deep into the city" : "Out of rewinds",
    stats: [["Rows", maxRow], ["Gems", gems], ["Rewinds used", rewindsUsed]]
  });
}

/* ---------- input ---------- */
PA.onKey((e) => {
  const c = e.code;
  if (e.repeat) return;
  if (c === "ArrowUp" || c === "KeyW" || c === "Space") tryHop(0, 1);
  else if (c === "ArrowDown" || c === "KeyS") tryHop(0, -1);
  else if (c === "ArrowLeft" || c === "KeyA") tryHop(-1, 0);
  else if (c === "ArrowRight" || c === "KeyD") tryHop(1, 0);
});
// Touch: a swipe hops the moment it crosses the threshold; a tap hops forward.
let sw = null;
addEventListener("pointerdown", (e) => {
  if (PA.state !== "play" || PA.isPaused()) return;
  if (e.target.closest && e.target.closest("button,input,#pa-gate,.pa-layer,.pa-tb,.pa-touch")) return;
  sw = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
});
addEventListener("pointermove", (e) => {
  if (!sw || sw.done || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, th = 24;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  sw.done = true;
  if (Math.abs(dx) > Math.abs(dy)) tryHop(dx > 0 ? 1 : -1, 0); else tryHop(0, dy < 0 ? 1 : -1);
});
addEventListener("pointerup", (e) => { if (sw && !sw.done && e.pointerId === sw.id) tryHop(0, 1); sw = null; });
addEventListener("pointercancel", () => { sw = null; });

/* ---------- drawing ---------- */
let view, ctx, C = 40, baseY = 0, ox = 0;
function layout(v) {
  C = Math.max(26, Math.floor(Math.min(v.w / (COLS + 1.2), v.h / 11.5)));
  ox = Math.round((v.w - C * COLS) / 2);
  baseY = Math.round(v.h * .7);
}
function toScreen(col, row) { return { x: ox + col * C, y: baseY - (row - cam) * C + C / 2 }; }
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawLaneBase(l, y, w, t) {
  const top = y - C / 2;
  if (l.type === "grass") {
    ctx.fillStyle = l.row % 2 ? "#0f2a24" : "#11302a"; ctx.fillRect(0, top, w, C);
    ctx.fillStyle = "rgba(125,255,176,.05)";
    for (let c = -M; c < COLS + M; c++) if ((c + l.row) % 3 === 0) ctx.fillRect(ox + c * C + C * .3, top + C * .3, C * .08, C * .08);
  } else if (l.type === "road") {
    ctx.fillStyle = "#171a26"; ctx.fillRect(0, top, w, C);
    const below = lanes.get(l.row - 1), above = lanes.get(l.row + 1);
    if (above && above.type === "road") {
      ctx.fillStyle = "rgba(255,255,255,.22)";
      const dash = C * .55, off = 0;
      for (let x = -C + off; x < w + C; x += C) ctx.fillRect(x, top - 1, dash, 2);
    } else { ctx.fillStyle = "#2a2f45"; ctx.fillRect(0, top - C * .08, w, C * .08); ctx.fillStyle = "rgba(255,211,107,.5)"; ctx.fillRect(0, top + 1, w, 2); }
    if (!below || below.type !== "road") { ctx.fillStyle = "#2a2f45"; ctx.fillRect(0, top + C, w, C * .08); ctx.fillStyle = "rgba(255,211,107,.5)"; ctx.fillRect(0, top + C - 3, w, 2); }
  } else if (l.type === "river") {
    const g = ctx.createLinearGradient(0, top, 0, top + C);
    g.addColorStop(0, "#0b2346"); g.addColorStop(1, "#0a1b38");
    ctx.fillStyle = g; ctx.fillRect(0, top, w, C);
    ctx.strokeStyle = "rgba(94,242,255,.12)"; ctx.lineWidth = 1.5;
    const sh = mod(l.v * t * C * .6, C * 2);

  shade.addColorStop(0, "rgba(4,5,12,.82)"); shade.addColorStop(1, "rgba(4,5,12,0)");
  ctx.fillStyle = shade; ctx.fillRect(0, 0, w, 130);
  ctx.textAlign = "left";
  ctx.font = `800 ${w < 500 ? 30 : 38}px Manrope, sans-serif`;
  ctx.fillStyle = "#fff"; ctx.shadowColor = "#5ef2ff"; ctx.shadowBlur = 18;
  ctx.fillText(Math.round(shownScore).toLocaleString(), 16, 46); ctx.shadowBlur = 0;
  ctx.font = "700 12px 'JetBrains Mono', monospace"; ctx.fillStyle = "#9fb4d8";
  ctx.fillText("ROW " + maxRow + "  ·  BEST " + Math.max(best, score).toLocaleString(), 17, 66);
  // rewind charges
  for (let i = 0; i < MAX_CHARGES; i++) {
    const x = 28 + i * 30, y = 92, on = i < charges;
    ctx.strokeStyle = on ? "#ffd36b" : "rgba(255,211,107,.25)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU); ctx.stroke();
    if (on) { ctx.fillStyle = "#ffd36b"; ctx.beginPath(); ctx.moveTo(x + 4, y - 5); ctx.lineTo(x - 3, y); ctx.lineTo(x + 4, y + 5); ctx.closePath(); ctx.fill(); }
  }
  ctx.font = "700 10px 'JetBrains Mono', monospace"; ctx.fillStyle = "rgba(255,211,107,.8)"; ctx.fillText("REWINDS", 17 + MAX_CHARGES * 30, 96);
  if (!started && PA.state === "play") {
    ctx.textAlign = "center"; ctx.font = `700 ${w < 500 ? 16 : 20}px Manrope, sans-serif`; ctx.fillStyle = `rgba(255,255,255,${.6 + Math.sin(t * 4) * .3})`;
    ctx.fillText(PA.isTouch ? "Tap to hop · swipe to turn" : "Hop with the arrow keys", w / 2, baseY + C * 2.2);
  }
}

view = PA.canvas(document.getElementById("c"), { onResize: layout });
ctx = view.ctx;
reset();
PA.onStart(reset);
PA.loop(update, render);
window.__ct = {
  get player() { return player; }, get wt() { return wt; }, get score() { return score; }, get maxRow() { return maxRow; },
  get charges() { return charges; }, get dead() { return dead; }, get rewinding() { return !!rw; }, get fog() { return fog; },
  lane, objX, train, turtleState, tryHop, COLS
};
})();
</script>
