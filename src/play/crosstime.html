import * as THREE from "/vendor/three/three.module.min.js";

(() => {
"use strict";
// A road-and-river crosser where getting hit rewinds time, built as a 3D night city. Every lane is a pure
// function of the world clock (vehicle x = offset + speed * t, wrapped), so running the clock backwards
// replays the street in reverse for free, and slowing the clock slows the whole street. The player's own
// state is snapshotted every frame; a rewind scrubs both back to the last moment you stood somewhere safe.
// Added in 3D: a stasis meter that slows the street, parcels to deliver to a beacon up the road, and a
// streak bonus for keeping moving.
const PA = window.PA;
const { clamp, lerp } = PA;
const COLS = 9, M = 12, P = COLS + 2 * M, TAU = Math.PI * 2;
const CAR_COLS = [["#ff5ca8", "#a3205f"], ["#5ef2ff", "#1d7f9a"], ["#ffd36b", "#b4801b"], ["#b48cff", "#5a35b0"], ["#7dffb0", "#1f9a5f"], ["#ff8a5c", "#b0441d"], ["#f2f4ff", "#8a90b0"]];
const KINDS = {
  car: { len: 1.35 }, taxi: { len: 1.4 }, van: { len: 1.85 }, bus: { len: 2.7 }, truck: { len: 3.2 }
};
/* ---------------- renderer + post ---------------- */
const mount = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1);
renderer.setPixelRatio(dprCap());
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
mount.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040d);
scene.fog = new THREE.FogExp2(0x070516, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 500);
const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

function makePost() {
  const ext = renderer.extensions;
  const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
  const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;

    lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));

  }
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));

  pscene.add(quad);
  const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
  const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
  const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
  const bright = mk([
    "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
    "void main(){", box4,
    "  float l = max(c.r, max(c.g, c.b));",
    "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
    "  soft = soft * soft / (4.0 * knee + 1e-4);",
    "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(30.0)), 1.0);",
    "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 0.95 : 0.7 } });
  const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
    { tex: { value: null }, px: { value: new THREE.Vector2() } });

    "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
    "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
    "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
  const comp = mk([
    "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time, hurt, chroma; varying vec2 vUv;",
    "void main(){",
    "  vec2 q = vUv - 0.5;",
    "  vec3 c;",
    "  c.r = texture2D(tScene, vUv + q * chroma * 0.012).r;",
    "  c.g = texture2D(tScene, vUv).g;",
    "  c.b = texture2D(tScene, vUv - q * chroma * 0.012).b;",
    "  vec3 b = texture2D(b0, vUv).rgb * 0.5 + texture2D(b1, vUv).rgb * 0.6 + texture2D(b2, vUv).rgb * 0.75 + texture2D(b3, vUv).rgb * 0.85 + texture2D(b4, vUv).rgb * 0.95;",
    "  c += b * strength;",
    "  float vig = dot(q, q);",
    "  c *= 1.0 - vig * 0.85;",
    "  c += vec3(1.0, 0.2, 0.45) * hurt * smoothstep(0.08, 0.4, vig);",
    "  gl_FragColor = vec4(c, 1.0);",
    "  #include <tonemapping_fragment>",
    "  #include <colorspace_fragment>",
    "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
    "  gl_FragColor.rgb += (n - 0.5) * grain;",
    "}"].join("\n"), {
    tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
    b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.5 }, grain: { value: 0.02 }, time: { value: 0 }, hurt: { value: 0 }, chroma: { value: 0.1 }
  });
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };

    comp,
    setSize(w, h) {
      main.setSize(w, h);
      for (let i = 0; i < LV; i++) {
        const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
        lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
      }
    },
    render(sc, cm, t) {
      renderer.setRenderTarget(main);
      renderer.render(sc, cm);
      bright.uniforms.tex.value = main.texture;
      bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
      pass(bright, lv[0]);
      for (let i = 0; i < LV; i++) {
        if (i) {
          down.uniforms.tex.value = lv[i - 1].texture;
          down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
          pass(down, lv[i]);
        }
        blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
        pass(blur, tmp[i]);
        blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
        pass(blur, lv[i]);
      }
      comp.uniforms.time.value = t;
      pass(comp, null);
    }
  };
}
const post = makePost();

  cv.width = w; cv.height = h;
  paint(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = o && o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (o && o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }

}

  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.2, "rgba(255,255,255,.5)"); gr.addColorStop(.55, "rgba(255,255,255,.1)"); gr.addColorStop(1, "rgba(255,255,255,0)");

}
// ribbon trails (ball paths, beams)
const TV = 9000;
const tPos = new Float32Array(TV * 3), tCol = new Float32Array(TV * 3);

trailMesh.frustumCulled = false;
scene.add(trailMesh);
let tv = 0;
const camDir = new THREE.Vector3();
function ribbon(tr, col, width, taper) {
  const n = tr.length / 3;
  if (n < 2) return;
  for (let i = 1; i < n && tv + 6 <= TV; i++) {
    const ax = tr[i * 3 - 3], ay = tr[i * 3 - 2], az = tr[i * 3 - 1], bx = tr[i * 3], by = tr[i * 3 + 1], bz = tr[i * 3 + 2];
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    camDir.set(camera.position.x - bx, camera.position.y - by, camera.position.z - bz).normalize();
    const px = dy * camDir.z - dz * camDir.y, py = dz * camDir.x - dx * camDir.z, pz = dx * camDir.y - dy * camDir.x;
    const pl = Math.hypot(px, py, pz) || 1;

    for (const q of [0, 1, 2, 1, 3, 2]) {

scene.background = new THREE.Color(0x05060d);
scene.fog = new THREE.Fog(0x070a18, 26, 62);
camera.fov = 34; camera.near = 0.5; camera.far = 260;
renderer.toneMappingExposure = 1.1;
post.comp.uniforms.strength.value = 0.62;
const rand = (a, b) => a + Math.random() * (b - a);
const XW = (c) => c - COLS / 2;          // a column position (left edge 0) to world x
const ZW = (r) => -r;                    // a row to world z
const bufSize = new THREE.Vector2();
const tmpV = new THREE.Vector3();
let W = innerWidth, H = innerHeight, camDist = 14;
const CAM_DIR = new THREE.Vector3(0.16, 1, 0.82).normalize();
function resize3d() {
  renderer.setPixelRatio(dprCap());
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(bufSize);
  post.setSize(bufSize.x, bufSize.y);
  pointsMat.uniforms.scale.value = bufSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));

/* ---------------- textures ---------------- */
{
  const env = canvasTex(512, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, "#0d1030"); gr.addColorStop(0.5, "#2a1f55"); gr.addColorStop(0.56, "#0a0a18"); gr.addColorStop(1, "#050508");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);

  });

function speckle(g, w, h, n, cols, a) {
  for (let i = 0; i < n; i++) { g.globalAlpha = a * Math.random(); g.fillStyle = cols[(Math.random() * cols.length) | 0]; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); }

}
const roadTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#15161f"; g.fillRect(0, 0, w, h);

}, { repeat: true });
roadTex.repeat.set(P, 1);
const parkTex = canvasTex(128, 128, (g, w, h) => {

  speckle(g, w, h, 1800, ["#22553f", "#0d261e", "#2c6a4c", "#3a7d58"], 0.9);

/* ---------------- lights ---------------- */

    const slab = new THREE.Mesh(SLAB, l.type === "road" ? MAT.road : l.type === "rail" ? MAT.rail : MAT.grass);
    g.add(slab);
    if (l.type === "road") {
      for (const o of l.objs) { const m = makeVehicle(o); g.add(m); dyn.objs.push({ o, m }); }
    } else if (l.type === "rail") {
      for (const z of [-0.22, 0.22]) g.add(box(MAT.steel, P, 0.06, 0.06, 0, 0.05, z));
      for (let x = -P / 2 + 0.3; x < P / 2; x += 0.6) g.add(box(MAT.trunk, 0.14, 0.04, 0.8, x, 0.02, 0));
      for (const c of [-0.5, COLS + 0.5]) {
        const post = box(MAT.dark, 0.12, 1.2, 0.12, XW(c), 0.6, 0.38);
        const a = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), signalOff); a.position.set(XW(c) - 0.12, 1.05, 0.38);
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), signalOff); b.position.set(XW(c) + 0.12, 1.05, 0.38);
        g.add(post, a, b); dyn.signals.push(a, b);
      }
      dyn.train = makeTrain(l); dyn.train.visible = false; g.add(dyn.train);
    } else {
      for (const c of l.trees) { const t = makeTree(true, 1); t.position.x = XW(c + 0.5); g.add(t); }
      for (const c of l.deco) { const t = makeTree(false, 0.8 + ((c * 7 + r) % 3) * 0.25); t.position.set(XW(c + 0.5), 0, (Math.random() - 0.5) * 0.3); g.add(t); }
      if (l.lamp) { const a = makeLamp(-1); a.position.x = XW(-0.6); const b = makeLamp(1); b.position.x = XW(COLS + 0.6); g.add(a, b); dyn.lamp = true; }
      // a glowing curb where the park meets traffic or water
      for (const [dr, z] of [[1, -0.5], [-1, 0.5]]) {
        if (r + dr < 0) continue;
        const n = lane(r + dr);
        if (n.type !== "grass") g.add(box(MAT.kerb, P, 0.1, 0.16, 0, 0.05, z - Math.sign(z) * 0.08), box(n.type === "river" ? curb : curbPink, P, 0.02, 0.03, 0, 0.11, z - Math.sign(z) * 0.015));
      }
    }
  }
  for (const it of l.items) { const m = makeItem(it); m.position.set(XW(it.c + 0.5), 0.45, 0); g.add(m); dyn.items.push({ it, m }); }
  // play-column edges
  g.add(box(GLOW(0x5ef2ff, 0.6), 0.03, 0.02, 1, XW(0), 0.015, 0), box(GLOW(0x5ef2ff, 0.6), 0.03, 0.02, 1, XW(COLS), 0.015, 0));

}
function dropRow(r, e) {

  e.g.traverse((o) => {
    if (o.material && o.material.isShaderMaterial) { const i = waterMats.indexOf(o.material); if (i >= 0) waterMats.splice(i, 1); o.material.dispose(); }
    if (o.isMesh && o.geometry && o.geometry.userData.own) o.geometry.dispose();
  });

}
function syncRows() {
  const lo = Math.floor(cam) - 9, hi = Math.ceil(cam) + 30;
  for (const [r, e] of rowCache) if (r < lo || r > hi) dropRow(r, e);
  for (let r = Math.max(0, lo); r <= hi; r++) if (!rowCache.has(r)) rowCache.set(r, buildRow(r));
}
function clearRows() { for (const [r, e] of [...rowCache]) dropRow(r, e); }

/* ---------------- frame ---------------- */
const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), e4 = new THREE.Euler(), v4 = new THREE.Vector3(), s4 = new THREE.Vector3();
let lastLanes = null, faceAng = 0, lastT = 0;
const ghostTrail = [];
function render(t) {
  const dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t;
  if (!lanes) return;
  if (lanes !== lastLanes) { clearRows(); lastLanes = lanes; }
  syncRows();
  const sh = PA.shakeOffset();
  // camera: behind and above, a little to the right, looking up the street
  const look = new THREE.Vector3(XW(COLS / 2) * 0.3 + (playerX() + 0.5 - COLS / 2) * 0.25, 0, ZW(cam + 3.2));
  camera.position.copy(look).addScaledVector(CAM_DIR, camDist);
  camera.position.x += sh.x * 0.02; camera.position.y += sh.y * 0.02;
  camera.lookAt(look);
  camera.updateMatrixWorld();

  // lanes
  let li = 0;
  const lamps = [];
  for (const [r, e] of rowCache) {
    const d = e.dyn, l = d.l;
    if (d.water) d.water.uniforms.time.value = wt;
    for (const { o, m } of d.objs) {
      const x = objX(l, o, wt);
      m.position.x = XW(x + o.len / 2);
      if (l.type === "road") m.rotation.y = l.v > 0 ? 0 : Math.PI;
      else if (o.kind === "barge") { m.position.y = Math.sin(wt * 1.6 + o.off) * 0.03; m.rotation.y = l.v > 0 ? 0 : Math.PI; m.rotation.x = Math.sin(wt * 1.3 + o.off) * 0.02; }
      else {
        const s = padState(o, wt), k = o.dive ? ((wt + o.phase) % 7 + 7) % 7 : 0;
        m.position.y = -0.1 - s * 0.45;
        const warn = o.dive && k > 3.3 && k < 4.2 && Math.sin(wt * 22) > 0;
        for (const rm of m.userData.rims) rm.color.copy(warn || s > 0 ? hdr(0xff3355, 2.5) : hdr(0x5ef2ff, 2.5));
      }
    }
    if (d.train) {
      const tr = train(l, wt);
      d.train.visible = tr.x != null;
      if (tr.x != null) { d.train.position.x = XW(tr.x + l.len / 2); d.train.rotation.y = l.dir > 0 ? 0 : Math.PI; }
      const on = tr.warn && Math.sin(wt * 18) > 0;
      d.signals.forEach((s, i) => (s.material = on === (i % 2 === 0) && tr.warn ? signalOn : signalOff));
    }
    for (const { it, m } of d.items) {
      m.visible = !it.taken && !(it.kind === "parcel" && delivery);
      m.position.y = 0.45 + Math.sin(t * 3 + it.c) * 0.08;
      m.rotation.y = t * 1.8;
    }
    if (d.lamp) lamps.push(r);
  }
  // the three street lamps nearest the bot get real light
  const pr = player.hop ? player.hop.fr + (player.hop.tr - player.hop.fr) * player.hop.t : player.row;
  lamps.sort((a, b) => Math.abs(a - pr - 2) - Math.abs(b - pr - 2));
  lampL.forEach((L, i) => {
    const r = lamps[i >> 1];
    if (r == null || i > 2) { L.intensity = 0; return; }
    L.position.set(XW(i % 2 ? COLS + 0.2 : -0.2), 1.8, ZW(r)); L.intensity = 9;
  });

  // buildings either side, recycled along the street
  const baseSlot = Math.floor((cam - 12) / 4.5);
  for (let i = 0; i < BLD.length; i++) {
    const b = BLD[i];
    const slot = baseSlot + ((b.slot - baseSlot) % 36 + 36) % 36;
    const z = ZW(slot * 4.5 + b.off * 0.3);
    const x = b.side * (P / 2 + 1.5 + b.w / 2 + b.off);
    m4.compose(v4.set(x, -0.6, z), q4.identity(), s4.set(b.w, b.h + ((slot * 7919) % 5), b.d));
    buildings.setMatrixAt(i, m4);
    buildings.setColorAt(i, b.c);
  }
  buildings.instanceMatrix.needsUpdate = true; buildings.instanceColor.needsUpdate = true;
  buildMat.uniforms.time.value = t;

  // the bot
  const px = playerX() + 0.5, h = player.hop;
  const hopK = h ? Math.sin(h.t * Math.PI) : 0;
  const prow = h ? h.fr + (h.tr - h.fr) * h.t : player.row;
  bot.visible = !dead;
  const want = [Math.PI, -Math.PI / 2, 0, Math.PI / 2][player.face];
  let da = want - faceAng; da = ((da + Math.PI) % TAU + TAU) % TAU - Math.PI;
  faceAng += da * Math.min(1, dt * 18);
  bot.position.set(XW(px), hopK * 0.5 + (lane(Math.round(prow)).type === "river" && !h ? -0.02 : 0), ZW(prow));
  bot.rotation.y = faceAng;
  const sq = player.land * 0.22, st = h ? 0.12 * hopK : 0;
  botBody.scale.set(1 + sq - st * 0.5, 1 - sq + st, 1 + sq - st * 0.5);
  botBody.position.x = Math.sin(t * 40) * player.bump * 0.06;
  bot.userData.carry.visible = !!delivery;
  botShadow.position.set(XW(px), 0.015, ZW(prow));
  botShadow.scale.setScalar(0.9 - hopK * 0.3);
  botShadow.visible = !dead;
  playerL.position.set(XW(px), 1.4, ZW(prow) + 0.4);
  if (dead) {
    bot.visible = deadKind !== "water";
    if (bot.visible) { bot.scale.set(1 + deadT, Math.max(0.05, 1 - deadT * 3), 1 + deadT); }
  } else bot.scale.set(1, 1, 1);
  // rewind afterimages
  if (rw) { ghostTrail.push([XW(px), bot.position.y + 0.4, ZW(prow)]); if (ghostTrail.length > 18) ghostTrail.shift(); }
  else ghostTrail.length = 0;

  // beacon for the parcel
  beacon.visible = !!delivery;
  beaconL.intensity = 0;
  if (delivery) {
    beacon.position.set(XW(COLS / 2), 0, ZW(delivery.row));
    beaconMat.uniforms.time.value = t;
    beaconMat.uniforms.k.value = delivery.t < 5 ? 0.5 + 0.5 * Math.sin(t * 12) : 1;
    beacon.userData.ring.scale.setScalar(1 + Math.sin(t * 3) * 0.1);
    beaconL.position.set(beacon.position.x, 2, beacon.position.z); beaconL.intensity = 14;
  }
  // the static
  staticBox.visible = fogOn || fog > -5;
  staticBox.position.z = ZW(fog) + 0.5;
  staticMat.uniforms.uEdge.value = staticBox.position.z; staticMat.uniforms.time.value = t;

  // rain, particles, shards, trails
  rainMat.uniforms.time.value = t * (slowT > 0 ? SLOW : 1) + (rw ? -t * 2 : 0);
  rainMat.uniforms.center.value.copy(look);
  rainMat.uniforms.slow.value = slowT > 0 ? 0.3 : 1;
  for (const m of waterMats) m.uniforms.time.value = wt;
  const n = Math.min(fx.list.length, PMAX);
  for (let i = 0; i < n; i++) {
    const p = fx.list[i], k = p.life / p.max;
    pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
    pCol[i * 3] = p.c[0] * 2.4 * k; pCol[i * 3 + 1] = p.c[1] * 2.4 * k; pCol[i * 3 + 2] = p.c[2] * 2.4 * k;

  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; pGeo.attributes.size.needsUpdate = true;
  let j = 0;
  for (let i = 0; i < shards.length; i++) {
    const s = shards[i];
    s.life -= dt; if (s.life <= 0) continue;
    s.vy -= 14 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    if (s.y < 0.05) { s.y = 0.05; s.vy *= -0.3; s.vx *= 0.6; s.vz *= 0.6; s.wx *= 0.5; s.wy *= 0.5; }

  shards.length = j;
  for (let i = 0; i < j; i++) {

    e4.set(s.rx, s.ry, 0); q4.setFromEuler(e4);
    m4.compose(v4.set(s.x, s.y, s.z), q4, s4.setScalar(k));
    shardMesh.setMatrixAt(i, m4);

  shardMesh.count = j; shardMesh.instanceMatrix.needsUpdate = true;
  tv = 0;
  if (ghostTrail.length > 2) ribbon(ghostTrail.flat(), [2.4, 1.8, 0.6], 0.5);

    // stasis halo
    const a = [];
    for (let i = 0; i <= 24; i++) { const ang = i / 24 * TAU; a.push(XW(px) + Math.cos(ang) * 0.7, 0.06, ZW(prow) + Math.sin(ang) * 0.7); }
    ribbon(a, [0.6, 1.6, 2.6], 0.05, false);

  tGeo.setDrawRange(0, tv);
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true;

  post.comp.uniforms.chroma.value = 0.1 + (rw ? 1.4 : 0) + (slowT > 0 ? 0.6 : 0);
  post.render(scene, camera, t);
  drawOverlay(t);
}

/* ---------------- overlay: hud, rewind and stasis tints ---------------- */
function drawOverlay(t) {
  const w = W, h = H;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  texts.draw(ctx);
  if (rw) {
    ctx.fillStyle = "rgba(255,211,107,.08)"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(0,0,0,.18)"; for (let y = (t * 300) % 4; y < h; y += 4) ctx.fillRect(0, y, w, 1);
    const by = (1 - rw.k) * h; ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(0, by, w, 18);
    ctx.font = `800 ${Math.round(Math.min(48, w * .09))}px Manrope, sans-serif`; ctx.textAlign = "center";
    ctx.fillStyle = "#ffd36b"; ctx.shadowColor = "#ffd36b"; ctx.shadowBlur = 20; ctx.fillText("◀◀", w / 2, h * .22); ctx.shadowBlur = 0;
  }
  if (slowT > 0) {

    g.addColorStop(0, "rgba(90,170,255,0)"); g.addColorStop(1, `rgba(90,170,255,${.22 * Math.min(1, slowT)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

}
function drawHud(w, h, t) {
  shownScore += (score - shownScore) * .25;

  shade.addColorStop(0, "rgba(4,5,12,.78)"); shade.addColorStop(1, "rgba(4,5,12,0)");

  ctx.textAlign = "left";
  ctx.font = `800 ${w < 500 ? 30 : 38}px Manrope, sans-serif`;
  ctx.fillStyle = "#fff"; ctx.shadowColor = "#5ef2ff"; ctx.shadowBlur = 18;
  ctx.fillText(Math.round(shownScore).toLocaleString(), 16, 46); ctx.shadowBlur = 0;
  ctx.font = "700 12px 'JetBrains Mono', monospace"; ctx.fillStyle = "#9fb4d8";
  ctx.fillText("ROW " + maxRow + "  ·  BEST " + Math.max(best, score).toLocaleString() + (streakMul() > 1 ? "  ·  STREAK ×" + streakMul() : ""), 17, 66);
  for (let i = 0; i < MAX_CHARGES; i++) {
    const x = 28 + i * 30, y = 92, on = i < charges;
    ctx.strokeStyle = on ? "#ffd36b" : "rgba(255,211,107,.25)"; ctx.lineWidth = 2.5;

  }
  ctx.font = "700 10px 'JetBrains Mono', monospace"; ctx.fillStyle = "rgba(255,211,107,.8)"; ctx.fillText("REWINDS", 17 + MAX_CHARGES * 30, 96);

  ctx.fillStyle = "rgba(159,216,255,.15)"; ctx.fillRect(sx, sy, sw, 5);
  ctx.fillStyle = stasis >= 1 ? `rgba(159,216,255,${.75 + Math.sin(t * 8) * .25})` : "#9fd8ff";
  ctx.fillRect(sx, sy, sw * (slowT > 0 ? slowT / STASIS_T : stasis), 5);
  ctx.fillStyle = "rgba(159,216,255,.85)"; ctx.fillText(slowT > 0 ? "STASIS" : stasis >= 1 ? (PA.isTouch ? "STASIS READY · ⧗" : "STASIS READY · SHIFT") : "STASIS", sx + sw + 8, sy + 6);
  if (delivery) {
    const k = delivery.t / delivery.T;

    ctx.font = "800 13px 'JetBrains Mono', monospace";
    ctx.fillStyle = delivery.t < 5 && Math.sin(t * 12) > 0 ? "#ff8a5c" : "#ffb35a";
    const left = Math.max(0, delivery.row - player.row);
    ctx.fillText("PARCEL · " + left + " ROWS · " + Math.ceil(delivery.t) + "s", w / 2, w < 560 ? 152 : 30);
    ctx.fillStyle = "rgba(255,179,90,.2)"; ctx.fillRect(w / 2 - 80, (w < 560 ? 160 : 38), 160, 4);
    ctx.fillStyle = "#ffb35a"; ctx.fillRect(w / 2 - 80, (w < 560 ? 160 : 38), 160 * k, 4);
  }
  if (!started && PA.state === "play") {
    const p = toScreen(player.x + .5, player.row - 1.6, 0);
    ctx.textAlign = "center"; ctx.font = `700 ${w < 500 ? 16 : 20}px Manrope, sans-serif`; ctx.fillStyle = `rgba(255,255,255,${.6 + Math.sin(t * 4) * .3})`;
    ctx.fillText(PA.isTouch ? "Tap to hop · swipe to turn" : "Hop with the arrow keys", w / 2, Math.min(h - 30, p.y));
  }
}

/* ---------------- boot ---------------- */
const view = PA.canvas(document.getElementById("fx"), { onResize: (v) => { W = v.w; H = v.h; resize3d(); } });
const ctx = view.ctx;
addEventListener("resize", resize3d);
resize3d();
reset();
PA.onStart(reset);
PA.loop(update, render);
window.__ct = {
  get player() { return player; }, get wt() { return wt; }, get score() { return score; }, get maxRow() { return maxRow; },
  get charges() { return charges; }, get dead() { return dead; }, get rewinding() { return !!rw; }, get fog() { return fog; },
  get delivery() { return delivery; }, get stasis() { return stasis; }, get slowT() { return slowT; }, get streak() { return streak; },
  setStasis(v) { stasis = v; }, useStasis, giveParcel() { const l = lane(player.row); l.items.push({ c: Math.round(player.x), kind: "parcel" }); },
  lane, objX, train, padState, tryHop, COLS
};
})();
