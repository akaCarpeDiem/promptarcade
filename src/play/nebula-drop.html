<style>

<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
"use strict";
// The merge-and-drop classic with no jar: everything falls toward a star at the centre of a round well,
// from wherever you drop it on the rim, so the pile grows outward in every direction. The physics is 2D on
// the well's plane; every body is drawn as a real lit sphere, lit by the core star itself, so the far side
// of each world is in shadow. Merges charge a gravity pulse that shakes the pile loose; now and then a
// wormhole comes up the queue and swallows whatever it touches; meteor showers keep the rim busy.
const PA = window.PA;
const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const { clamp, rand } = PA;

/* logical units (the physics), and world = logical / 100 */
const JW = 700, CX = 350, CY = 350, R_WELL = 318, R_DANGER = 268, R_CORE = 24, GRAV = 1500;
const WS = 0.01;
const TIERS = [
  { name: "Stardust", r: 15, c: ["#fff7c2", "#ffd36b"] },
  { name: "Pebble", r: 20, c: ["#b9c2d8", "#59627a"] },
  { name: "Moon", r: 26, c: ["#eceff7", "#8d93a8"] },
  { name: "Comet", r: 33, c: ["#bff4ff", "#2a9ec2"] },
  { name: "Ember World", r: 41, c: ["#ffb08a", "#b8402a"] },
  { name: "Ice Giant", r: 50, c: ["#c8f7ff", "#3b7fd6"] },
  { name: "Ringed Giant", r: 60, c: ["#ffe2a8", "#c48a3a"] },
  { name: "Jovian", r: 72, c: ["#ffd4b3", "#a5532e"] },
  { name: "Sun", r: 86, c: ["#fff9d6", "#ff9d1a"] },
  { name: "Pulsar", r: 100, c: ["#e5d6ff", "#7b3dff"] },
  { name: "Black Hole", r: 116, c: ["#000000", "#ff6bd5"] }
];
const POINTS = TIERS.map((_, i) => ((i + 1) * (i + 2)) / 2 * 2);
const WORM = -1;  // the wormhole special

/* ---------------- 2D thumbnails for the side panel ---------------- */
function seeded(n) { let s = n * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function makeSprite(i, size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d"), R = size / 2 - 2, rnd = seeded(i + 3);
  g.translate(size / 2, size / 2);
  if (i === WORM) {
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, "#000"); gr.addColorStop(.45, "#0a0420"); gr.addColorStop(.7, "#5ef2ff"); gr.addColorStop(1, "rgba(123,61,255,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
    return c;
  }
  const T = TIERS[i];
  if (i === 10) {
    const acc = g.createRadialGradient(0, 0, R * .3, 0, 0, R);
    acc.addColorStop(0, "#000"); acc.addColorStop(.55, "#000"); acc.addColorStop(.62, "#ffb8f0"); acc.addColorStop(.75, "#ff3dc8"); acc.addColorStop(1, "rgba(120,0,255,0)");
    g.fillStyle = acc; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
    return c;
  }
  const gr = g.createRadialGradient(-R * .35, -R * .4, R * .1, 0, 0, R);
  gr.addColorStop(0, T.c[0]); gr.addColorStop(1, T.c[1]);
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  g.save(); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip();
  if (i >= 5 && i <= 7) for (let k = -4; k <= 4; k++) { g.fillStyle = k % 2 ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.12)"; g.fillRect(-R, k * R * .22 - R * .08, R * 2, R * (.1 + rnd() * .12)); }
  if (i === 1 || i === 2) for (let k = 0; k < 6; k++) { g.fillStyle = "rgba(0,0,0,.22)"; g.beginPath(); g.arc((rnd() - .5) * R * 1.5, (rnd() - .5) * R * 1.5, R * (.1 + rnd() * .2), 0, TAU); g.fill(); }
  const sh = g.createRadialGradient(-R * .4, -R * .45, R * .2, 0, 0, R * 1.05);
  sh.addColorStop(0, "rgba(255,255,255,.15)"); sh.addColorStop(.7, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,10,.5)");
  g.fillStyle = sh; g.fillRect(-R, -R, R * 2, R * 2);
  g.restore();
  if (i === 6) { g.strokeStyle = "rgba(255,226,168,.85)"; g.lineWidth = size * 0.04; g.beginPath(); g.ellipse(0, 0, R * 1.0, R * .28, -.35, 0, TAU); g.stroke(); }
  return c;
}
const SPR = TIERS.map((T, i) => makeSprite(i, 112));
const SPR_WORM = makeSprite(WORM, 112);

/* ---------------- renderer + post ---------------- */
const mount = $("game");
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1);
renderer.setPixelRatio(dprCap());
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
mount.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 900);
const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

function makePost() {
  const ext = renderer.extensions;
  const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
  const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const main = new THREE.WebGLRenderTarget(1, 1, { type, samples: hdrOk && !fullFloat ? 0 : 4 });
  const LV = 5, lv = [], tmp = [];
  for (let i = 0; i < LV; i++) {
    lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
    tmp.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
  }
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  const pscene = new THREE.Scene();
  pscene.add(quad);
  const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
  const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
  const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
  const bright = mk([
    "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
    "void main(){", box4,
    "  float l = max(c.r, max(c.g, c.b));",
    "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
    "  soft = soft * soft / (4.0 * knee + 1e-4);",
    "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(30.0)), 1.0);",
    "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 0.95 : 0.7 } });
  const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
    { tex: { value: null }, px: { value: new THREE.Vector2() } });
  const blur = mk([
    "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
    "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
    "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
  const comp = mk([
    "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time, danger; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tScene, vUv).rgb;",
    "  vec3 b = texture2D(b0, vUv).rgb * 0.5 + texture2D(b1, vUv).rgb * 0.6 + texture2D(b2, vUv).rgb * 0.75 + texture2D(b3, vUv).rgb * 0.85 + texture2D(b4, vUv).rgb * 0.95;",
    "  c += b * strength;",
    "  vec2 q = vUv - 0.5; float vig = dot(q, q);",
    "  c *= 1.0 - vig * 0.85;",
    "  c += vec3(1.0, 0.15, 0.4) * danger * smoothstep(0.06, 0.4, vig);",
    "  gl_FragColor = vec4(c, 1.0);",
    "  #include <tonemapping_fragment>",
    "  #include <colorspace_fragment>",
    "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
    "  gl_FragColor.rgb += (n - 0.5) * grain;",
    "}"].join("\n"), {
    tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
    b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.6 }, grain: { value: 0.02 }, time: { value: 0 }, danger: { value: 0 }
  });
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };
  return {
    comp,
    setSize(w, h) {
      main.setSize(w, h);
      for (let i = 0; i < LV; i++) {
        const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
        lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
      }
    },
    render(sc, cm, t) {
      renderer.setRenderTarget(main);
      renderer.render(sc, cm);
      bright.uniforms.tex.value = main.texture;
      bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
      pass(bright, lv[0]);
      for (let i = 0; i < LV; i++) {
        if (i) {
          down.uniforms.tex.value = lv[i - 1].texture;
          down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
          pass(down, lv[i]);
        }
        blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
        pass(blur, tmp[i]);
        blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
        pass(blur, lv[i]);
      }
      comp.uniforms.time.value = t;
      pass(comp, null);
    }
  };
}
const post = makePost();

let W = innerWidth, H = innerHeight;
const overlay = PA.canvas($("fx"), { onResize: (o) => { W = o.w; H = o.h; } });
const ctx = overlay.ctx;
const texts = new PA.Texts();
const bufSize = new THREE.Vector2(), tmpV = new THREE.Vector3();
const ELEV = 1.2;
let camDist = 10, sideW = 0, topH = 0;
function placeCamera(d, ox, oy) {
  camera.position.set(ox || 0, Math.sin(ELEV) * d, Math.cos(ELEV) * d + (oy || 0));
  camera.lookAt(0, 0, 0);
}
function fitCamera() {
  // the side panel takes the right edge on wide screens, a strip along the top on tall ones
  const wide = W > H * 0.9;
  sideW = wide ? 200 : 0;
  topH = wide ? 0 : 160;
  // fit the rim inside the free region of the final, shifted projection
  camera.aspect = W / H;
  camera.setViewOffset(W, H, sideW / 2, -topH / 2, W, H);
  camera.updateProjectionMatrix();
  const R = (R_WELL + 14) * WS, padX = W < 500 ? 4 : 14, padY = 12;
  let d = 3;
  for (; d < 80; d += 0.05) {
    placeCamera(d); camera.updateMatrixWorld();
    let ok = true;
    for (let i = 0; i < 24 && ok; i++) {
      const a = i / 24 * TAU;
      tmpV.set(Math.cos(a) * R, 0, Math.sin(a) * R).project(camera);
      const px = (tmpV.x + 1) / 2 * W, py = (1 - tmpV.y) / 2 * H;
      if (px < padX || px > W - sideW - padX || py < topH + padY || py > H - padY) ok = false;
    }
    if (ok) break;
  }
  camDist = d;
  const side = $("nd-side");
  if (wide) {
    tmpV.set(R, 0, 0); placeCamera(d); camera.updateMatrixWorld();
    const p = toScreen(R + 0.1, 0, -R * 0.9);
    Object.assign(side.style, { left: Math.min(W - sideW + 6, p.x + 18) + "px", top: Math.max(56, p.y) + "px", flexDirection: "column", transform: "", alignItems: "" });
  } else {
    Object.assign(side.style, { left: "8px", top: "56px", flexDirection: "row", alignItems: "flex-start", transform: "scale(.7)", transformOrigin: "top left", flexWrap: "wrap", width: (W - 16) / 0.7 + "px" });
  }
}
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setPixelRatio(dprCap());
  renderer.setSize(W, H);
  renderer.getDrawingBufferSize(bufSize);
  post.setSize(bufSize.x, bufSize.y);
  fitCamera();
  pointsMat.uniforms.scale.value = bufSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
function toScreen(x, y, z) {
  tmpV.set(x, y, z).project(camera);
  return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
}
const L2W = (x, y) => ({ x: (x - CX) * WS, z: (y - CY) * WS });

/* ---------------- shared GLSL ---------------- */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*snoise(p); p=p*2.07+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
`;

/* ---------------- sky ---------------- */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 40, 20), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: NOISE + `varying vec3 vD;
    float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
    void main(){
      vec3 d = normalize(vD);
      float n1 = fbm(d * 2.4 + 3.0), n2 = fbm(d * 3.6 - 5.0);
      vec3 c = vec3(0.004, 0.005, 0.016);
      c += vec3(0.23, 0.11, 0.54) * smoothstep(-0.05, 0.6, n1) * 0.22;
      c += vec3(0.05, 0.31, 0.54) * smoothstep(0.0, 0.7, n2) * 0.18;
      c += vec3(0.54, 0.11, 0.42) * pow(max(0.0, n1 * n2), 1.4) * 0.5;
      vec3 q = floor(d * 260.0);
      c += vec3(0.85, 0.9, 1.0) * step(0.9965, h(q)) * (0.6 + 0.4 * h(q + 1.0)) * 1.4;
      gl_FragColor = vec4(c, 1.0);
    }`
})));

/* ---------------- the well ---------------- */
const RW = R_WELL * WS, RD = R_DANGER * WS, RC = R_CORE * WS;
const wellFloor = new THREE.Mesh(new THREE.CircleGeometry(RW + 0.08, 128).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 }, rw: { value: RW }, rd: { value: RD }, danger: { value: 0 } },
  vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform float time, rw, rd, danger; varying vec3 vP;
    void main(){
      float r = length(vP.xz), a = atan(vP.z, vP.x);

        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        if (dx * dx + dy * dy >= rr * rr) continue;
        if (a.t === WORM || b.t === WORM) { swallow(a.t === WORM ? a : b, a.t === WORM ? b : a); continue; }
        const d = Math.sqrt(dx * dx + dy * dy) || 0.001, nx = dx / d, ny = dy / d, pen = rr - d;
        if (a.t === b.t && !a.dead && !b.dead) { merge(a, b); continue; }
        const ia = 1 / a.m, ib = 1 / b.m, sum = ia + ib;
        const corr = Math.min(pen, 6) * 0.8 / sum;
        a.x -= nx * corr * ia; a.y -= ny * corr * ia; b.x += nx * corr * ib; b.y += ny * corr * ib;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jn = -(1 + 0.12) * vn / sum;
          a.vx -= jn * nx * ia; a.vy -= jn * ny * ia; b.vx += jn * nx * ib; b.vy += jn * ny * ib;
          const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
          const jt = Math.max(-jn * 0.25, Math.min(jn * 0.25, -vt / sum));
          a.vx -= jt * tx * ia; a.vy -= jt * ty * ia; b.vx += jt * tx * ib; b.vy += jt * ty * ib;
          a.w += vt * 0.002; b.w -= vt * 0.002;
        }
      }
    }
    for (const b of bodies) {
      const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy) || 0.001, nx = dx / d, ny = dy / d;
      const vn = b.vx * nx + b.vy * ny;
      if (d < R_CORE + b.r) {
        if (b.t === WORM) { swallow(b, null); continue; }
        b.x = CX + nx * (R_CORE + b.r); b.y = CY + ny * (R_CORE + b.r);
        if (vn < 0) { b.vx -= vn * nx * 1.15; b.vy -= vn * ny * 1.15; }
        const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
        b.vx -= tx * vt * 0.015; b.vy -= ty * vt * 0.015; b.w = vt / b.r;
      } else if (d > R_WELL - b.r) {
        b.x = CX + nx * (R_WELL - b.r); b.y = CY + ny * (R_WELL - b.r);
        if (vn > 0) { b.vx -= vn * nx * 1.2; b.vy -= vn * ny * 1.2; }
      }
    }
    bodies = bodies.filter((b) => !b.dead);
  }
  for (const b of bodies) {
    b.vx *= 0.996; b.vy *= 0.996;
    const sp = Math.hypot(b.vx, b.vy);
    b.settled = sp < 40 ? b.settled + dt : 0;
    // spin: roll with the motion across the plane, plus the contact spin
    const ax = b.vy / b.r * dt * 0.9, az = -b.vx / b.r * dt * 0.9;
    const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(ax, b.w * dt, az));
    b.q.premultiply(dq);
  }
}
function swallow(w, victim) {
  w.dead = true;
  const p = L2W(w.x, w.y);
  if (victim) {
    victim.dead = true;
    const pts = 25 + POINTS[victim.t] * 2;
    score += pts;
    const s = toScreen(p.x, 0.2, p.z);
    texts.add(s.x, s.y, "SWALLOWED " + TIERS[victim.t].name.toUpperCase() + " +" + pts, { color: "#5ef2ff", size: 16, life: 1.2, vy: -30 });
    paintScore();
  }
  burst(p.x, p.z, { n: 60, colors: ["#5ef2ff", "#7b3dff", "#ffffff"], speed: 0.6, life: 0.9, size: 0.05, pull: 5 });
  shock(p.x, p.z, 0x5ef2ff, 0.9);
  PA.sfx("whoosh", { pitch: 0.4 }); PA.sfx("pop", { pitch: 0.5 });
}
function merge(a, b) {
  a.dead = b.dead = true;
  const t = a.t + 1;
  const x = (a.x * a.m + b.x * b.m) / (a.m + b.m), y = (a.y * a.m + b.y * b.m) / (a.m + b.m);
  const p = L2W(x, y);
  merges++;
  combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
  const mult = Math.min(5, 1 + (combo - 1) * 0.5);
  pulse = Math.min(1, pulse + 0.05 + t * 0.012 + (combo > 1 ? 0.03 : 0));
  if (t >= TIERS.length) {
    // two black holes collapse into a big bang
    const pts = 2000;
    score += pts;
    const s = toScreen(p.x, 0.2, p.z);
    texts.add(s.x, s.y, "BIG BANG +" + pts, { color: "#ff9cf0", size: 34, life: 2.2, vy: -30 });
    burst(p.x, p.z, { n: 300, colors: ["#ff6bd5", "#ffffff", "#7b3dff", "#5ef2ff"], speed: 4, life: 1.6, size: 0.07, up: 2 });
    PA.sfx("boom"); PA.flash("#ffffffaa", 600); PA.shake(18, 1);
    shock(p.x, p.z, 0xff6bd5, 3, 1.2);
    paintScore(); return;
  }
  const nb = addBody(t, x, y, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2 - 80);
  nb.pop = 1;
  const pts = Math.round(POINTS[t] * mult);
  score += pts;
  const s = toScreen(p.x, 0.3, p.z);
  if (t > biggest) {
    biggest = t; paintLadder();
    if (t >= 5) { texts.add(s.x, s.y - 30, TIERS[t].name.toUpperCase() + "!", { color: TIERS[t].c[0], size: 22 + t, life: 1.8, vy: -40 }); if (t >= 7) PA.flash(TIERS[t].c[1] + "55", 240); }
  }
  texts.add(s.x, s.y, "+" + pts + (combo > 1 ? " ×" + mult.toFixed(1) : ""), { color: combo > 1 ? "#ffe08a" : "#fff", size: 16 + Math.min(14, t * 1.5), life: .9 });
  burst(p.x, p.z, { n: 18 + t * 8, colors: [TIERS[t].c[0], TIERS[t].c[1], "#ffffff"], speed: 0.9 + t * 0.25, life: .6 + t * .05, size: 0.035 + t * 0.004 });
  shock(p.x, p.z, new THREE.Color(TIERS[t].c[0]).getHex(), nb.r * WS * 2.2);
  PA.sfx(t >= 7 ? "explode" : "pop", { pitch: 1.5 - t * 0.09 + combo * 0.05, vol: .7 });
  if (t >= 6) PA.shake(3 + t, .3);
  paintScore();
}
function meteorShower() {
  // a few stardust grains come in from one side of the rim
  shower = 4;
  showerA = rand(0, TAU);
  const p = L2W(CX + Math.cos(showerA) * R_WELL, CY + Math.sin(showerA) * R_WELL), s = toScreen(p.x, 0, p.z);
  texts.add(clamp(s.x, 100, W - 100), clamp(s.y, 90, H - 40), "METEOR SHOWER", { color: "#ffd36b", size: 18, life: 1.6, vy: -10 });
  PA.sfx("whoosh", { pitch: 1.4 });
}

/* ---------------- input ---------------- */
const ray = new THREE.Raycaster(), planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function aimAt(cx, cy) {
  ray.setFromCamera({ x: cx / W * 2 - 1, y: -(cy / H) * 2 + 1 }, camera);
  if (!ray.ray.intersectPlane(planeY, hitP)) return;
  if (hitP.x * hitP.x + hitP.z * hitP.z > 0.04) aimA = Math.atan2(hitP.z, hitP.x);
}
const isUi = (e) => e.target.closest && e.target.closest("button,#pa-gate,.pa-layer,.pa-tb,#nd-next,#nd-pulse");
addEventListener("pointermove", (e) => { if (!isUi(e)) aimAt(e.clientX, e.clientY); });
addEventListener("pointerdown", (e) => {
  if (isUi(e)) return;
  aimAt(e.clientX, e.clientY);
  if (e.pointerType === "mouse") drop();
});
addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse" || isUi(e)) return;
  drop();
});
$("nd-next").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); swap(); });
$("nd-pulse").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); firePulse(); });
PA.onKey((e) => {
  if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowDown" || e.code === "KeyS") { e.preventDefault(); drop(); }
  else if (e.code === "KeyC" && !e.repeat) swap();
  else if ((e.code === "KeyE" || e.code === "ShiftLeft" || e.code === "ShiftRight") && !e.repeat) firePulse();
});

/* ---------------- loop ---------------- */
function update(dt) {
  updateParts(dt); texts.update(dt);
  for (const w of waves) w.t += dt;
  for (let i = waves.length - 1; i >= 0; i--) if (waves[i].t > waves[i].life) { scene.remove(waves[i].m); waves[i].m.material.dispose(); waves.splice(i, 1); }
  if (pulseFx && (pulseFx.t += dt) > 1) pulseFx = null;
  if (PA.state !== "play" || !running) return;
  gameT += dt;
  const k = (PA.down("ArrowRight", "KeyD") ? 1 : 0) - (PA.down("ArrowLeft", "KeyA") ? 1 : 0);
  if (k) aimA += k * 2.4 * dt;
  dropCd -= dt; comboT -= dt;
  showerT -= dt;
  if (showerT <= 0) { showerT = rand(60, 80); meteorShower(); }
  if (shower > 0 && Math.random() < dt * 3) {
    shower--;
    const a = showerA + rand(-0.4, 0.4), d = R_WELL - 18;
    addBody(0, CX + Math.cos(a) * d, CY + Math.sin(a) * d, -Math.cos(a) * 200, -Math.sin(a) * 200).dropped = true;
    PA.sfx("blip", { pitch: 1.6 });
  }
  step(dt);
  for (const b of bodies) b.pop = Math.max(0, b.pop - dt * 3);
  let danger = false;
  const reach = (b) => Math.hypot(b.x - CX, b.y - CY) + b.r;
  for (const b of bodies) if (!b.dropped || gameT - b.born > 1.2) { if (reach(b) > R_DANGER && b.settled > 0.25) danger = true; }
  for (const b of bodies) if (b.dropped && reach(b) < R_DANGER - 4) b.dropped = false;
  dangerT = danger ? dangerT + dt : Math.max(0, dangerT - dt * 2);
  if (dangerT > 2.2 && !over) finish();
  paintPulse();
}
function finish() {
  over = true; running = false;
  PA.sfx("gameover"); PA.shake(10, .6);
  if (score > best) { best = score; try { localStorage.setItem("nd_best", best); } catch (e) {} $("nd-best").textContent = best.toLocaleString(); }
  PA.gameOver(score, {
    kicker: "The nebula overflowed", title: biggest >= 10 ? "Singularity!" : biggest >= 8 ? "Stellar!" : "Run complete",
    stats: [["Biggest", TIERS[biggest].name], ["Merges", merges], ["Pulses", pulses], ["Time", Math.round(gameT) + "s"]]
  });
}

const m4 = new THREE.Matrix4(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), qI = new THREE.Quaternion(), qFlat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
const qRing = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2 + 0.35, 0.25, 0));
function render(t) {
  const sh = PA.shakeOffset();
  placeCamera(camDist, sh.x * 0.008, sh.y * 0.008);
  camera.updateMatrixWorld();
  // held body on the rim (drawn like the rest)
  const list = bodies.slice();
  if (running && PA.state === "play") {
    const r = tierR(curTier), [x, y] = spawnPoint(r);
    list.push({ t: curTier, r, x, y, q: new THREE.Quaternion().setFromEuler(new THREE.Euler(t * 0.4, t * 0.6, 0)), seed: 0.5, pop: 0, held: true });
    const p = L2W(x, y);
    aimLine.visible = true;
    aimLine.position.set(p.x, 0.01, p.z);
    aimLine.rotation.y = -aimA - Math.PI / 2;
    aimLine.scale.set(1, (R_WELL - r - R_CORE) * WS, 1);
    aimMat.uniforms.k.value = dropCd <= 0 ? 1 : 0.35;
  } else aimLine.visible = false;
  const counts = new Array(TIERS.length).fill(0);
  let rc = 0, dc = 0, wc = 0, gc = 0;
  const tint = glowInst.geometry.attributes.tint;
  for (const b of list) {
    const p = L2W(b.x, b.y), rad = b.r * WS * (1 + (b.pop || 0) * 0.25);
    const ym = b.held ? 0.05 : 0;
    if (b.t === WORM) {
      m4.compose(v3.set(p.x, 0.01 + ym, p.z), qFlat, s3.set(rad * 1.4, rad * 1.4, rad * 1.4));
      wormInst.setMatrixAt(wc++, m4);
      continue;
    }
    const mesh = tierMesh[b.t], i = counts[b.t]++;
    if (i >= MAXI) continue;
    m4.compose(v3.set(p.x, ym, p.z), qI, s3.set(rad, rad, rad));
    mesh.setMatrixAt(i, m4);
    mesh.geometry.attributes.seed.array[i] = b.seed;
    mesh.geometry.attributes.spin.array.set([b.q.x, b.q.y, b.q.z, b.q.w], i * 4);
    if (b.t === 6 && rc < MAXI) { m4.compose(v3.set(p.x, ym, p.z), qRing, s3.set(rad, rad, rad)); ringInst.setMatrixAt(rc++, m4); }
    if (b.t === 10 && dc < 8) { m4.compose(v3.set(p.x, ym, p.z), qRing, s3.set(rad, rad, rad)); diskInst.setMatrixAt(dc++, m4); }
    if ((b.t >= 8 || b.t === 0 || b.t === 4) && gc < MAXI) {
      const gs = rad * (b.t === 0 ? 3 : b.t === 4 ? 2.3 : 2.4) * (1 + Math.sin(t * 3 + (b.seed || 0) * 9) * 0.06);
      m4.compose(v3.set(p.x, ym, p.z), qI, s3.set(gs, gs, gs));
      glowInst.setMatrixAt(gc, m4);
      const c = new THREE.Color(b.t === 10 ? 0xff6bd5 : b.t === 9 ? 0x9a6bff : b.t === 4 ? 0xff6a2a : TIERS[b.t].c[1]);
      const k = b.t === 0 ? 0.3 : b.t === 4 ? 0.25 : 0.32;
      tint.array.set([c.r * k, c.g * k, c.b * k], gc * 3);
      gc++;
    }
  }
  tierMesh.forEach((m, i) => {
    m.count = Math.min(MAXI, counts[i]);
    m.instanceMatrix.needsUpdate = true;
    m.geometry.attributes.seed.needsUpdate = true; m.geometry.attributes.spin.needsUpdate = true;
    m.material.uniforms.time.value = t;
  });
  ringInst.count = rc; ringInst.instanceMatrix.needsUpdate = true;
  diskInst.count = dc; diskInst.instanceMatrix.needsUpdate = true; diskMat.uniforms.time.value = t;
  wormInst.count = wc; wormInst.instanceMatrix.needsUpdate = true; wormMat.uniforms.time.value = t;
  glowInst.count = gc; glowInst.instanceMatrix.needsUpdate = true; tint.needsUpdate = true;
  // well + star
  const dk = Math.min(1, dangerT / 2.2);
  wellFloor.material.uniforms.time.value = t;
  dangerRing.material.uniforms.time.value = t; dangerRing.material.uniforms.k.value = dk;
  coreStar.material.uniforms.time.value = t;
  coreStar.scale.setScalar(1 + Math.sin(t * 3) * 0.05);
  corona.material.color.copy(hdr(0xffb35a, 1.2 + Math.sin(t * 2.3) * 0.15));
  rim.material.color.copy(hdr(pulse >= 1 ? 0x5ef2ff : 0xaab4ff, 1.6 + (pulse >= 1 ? Math.sin(t * 6) * 0.8 + 0.8 : 0)));
  for (const w of waves) { const k = w.t / w.life; w.m.scale.setScalar(0.1 + PA.ease.outCubic(k) * w.size); w.m.material.opacity = 1 - k; }
  post.comp.uniforms.danger.value = dk * 0.35;
  post.render(scene, camera, t);
  ctx.setTransform(overlay.dpr, 0, 0, overlay.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  texts.draw(ctx);
  if (PA.state === "play" && running && gameT < 6) {
    ctx.textAlign = "center"; ctx.font = `600 ${W < 520 ? 12 : 14}px Manrope, system-ui, sans-serif`;
    ctx.fillStyle = `rgba(220,230,255,${Math.min(1, (6 - gameT) / 1.5) * 0.8})`;
    const p = toScreen(0, 0, RW + 0.25);
    ctx.fillText((PA.isTouch ? "Tap" : "Click") + " round the rim to drop · twins merge into bigger worlds", (W - sideW) / 2 + 0, Math.min(H - 14, p.y + 16));
  }
}

addEventListener("resize", resize);
resize();
// a sleepy system on the title screen
for (const [t, a, d] of [[6, 0.4, 150], [3, 2.0, 120], [8, 3.6, 170], [1, 5.0, 90], [5, 4.2, 100], [2, 1.2, 80]]) addBody(t, CX + Math.cos(a) * d, CY + Math.sin(a) * d);
PA.onStart(reset);
PA.loop(update, render);
paintLadder(); paintNext();
window.__nd = { get bodies() { return bodies; }, drop, swap, firePulse, set aim(v) { aimA = v; }, get danger() { return dangerT; }, get over() { return over; }, get score() { return score; },
  set pulse(v) { pulse = v; }, add: (t, a, d) => addBody(t, CX + Math.cos(a) * d, CY + Math.sin(a) * d), sim: (sec) => { for (let i = 0; i < sec * 60; i++) update(1 / 60); }, setCur: (t) => { curTier = t; } };
})();
</script>
