<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Ringfall — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#03040c;color:#f6f0ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
#c{display:block;position:fixed;inset:0}
.pa-layer,.pa-tb,#pa-gate{cursor:auto}
</style></head><body>
<canvas id="c" aria-label="Ringfall planet"></canvas>
<script>
window.paConfig = {
  slug: "ringfall", title: "Ringfall", native: true, music: "space", unit: "points",
  controls: [["Click / tap", "Fire an interceptor at that spot"], ["Arrows + Space", "Aim and fire from the keyboard"], ["Chains", "Blasts set off blasts for a multiplier"]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script>
(() => {
"use strict";
// Missile defence wrapped around a small turning planet. Six cities and three batteries sit on the
// surface, so warheads come in from every side. Interceptors fly curved orbital arcs (polar interpolation
// from the launch site), so nothing ever cuts through the planet. A warhead caught in a blast bursts
// into a blast of its own, and every link in that chain raises the multiplier.
const TAU = Math.PI * 2;
const fx = new PA.Particles(2400), texts = new PA.Texts();

let R = 80, cx = 0, cy = 0, spawnR = 600;
let sites, threats, shots, blasts, score, shownScore, best = 0, wave, waveT, waveLeft, spawnT, rot, rotV, phase, phaseT, bestChain, kills, nextBonus, aim, stars;
try { best = +localStorage.getItem("rf_best") || 0; } catch (e) {}

const rnd = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

/* ---------- setup ---------- */
function makeSites() {
  // B C C B C C B C C, evenly round the planet
  const s = [];
  for (let i = 0; i < 9; i++) {
    const battery = i % 3 === 0;
    s.push({ i, a: i / 9 * TAU - Math.PI / 2, battery, alive: true, ammo: 0, hit: 0, towers: battery ? null : Array.from({ length: 5 }, (_, k) => ({ h: rnd(.35, 1), w: rnd(.14, .22), off: (k - 2) * .2 + rnd(-.03, .03), lit: Math.random() })) });
  }
  return s;
}
function sitePos(s, lift) { const a = s.a + rot, r = R + (lift || 0); return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, a }; }
function reset() {
  sites = makeSites(); threats = []; shots = []; blasts = [];
  score = 0; shownScore = 0; wave = 0; rot = 0; rotV = .05; bestChain = 0; kills = 0; nextBonus = 10000;
  fx.clear(); texts.clear();
  aim = { x: cx, y: cy - R * 2.4, kb: false };
  startWave();
}
function waveSpec(n) {
  return {
    count: 8 + n * 3,
    gap: Math.max(.38, 1.6 - n * .11),
    speed: spawnR * (.105 + n * .012),
    split: n >= 2 ? Math.min(.35, .08 + n * .03) : 0,
    weave: n >= 4 ? Math.min(.25, (n - 3) * .05) : 0,
    orbiters: n >= 3 ? Math.min(3, Math.floor((n - 1) / 2)) : 0
  };
}
function startWave() {
  wave++;
  const spec = waveSpec(wave);
  waveLeft = spec.count; spawnT = 1.2; waveT = 0;
  for (const s of sites) if (s.battery) { s.alive = true; s.ammo = 10 + Math.min(10, wave); }
  for (let k = 0; k < spec.orbiters; k++) threats.push(newOrbiter(k / Math.max(1, spec.orbiters) * TAU, spec));
  rotV = (.05 + wave * .006) * (wave % 2 ? 1 : -1);
  phase = "wave"; phaseT = 0;
  texts.add(cx, cy - R * 1.9, "WAVE " + wave, { color: "#8ee9ff", size: 34, life: 1.6, vy: -12 });
  PA.music.intensity(Math.min(1, wave / 10));
}

/* ---------- threats ---------- */
function liveTargets() { return sites.filter((s) => s.alive); }
function newWarhead(x, y, spec, kind) {
  const targets = liveTargets();
  if (!targets.length) return null;
  // cities are the main prize, batteries get hit about a third of the time
  const cities = targets.filter((s) => !s.battery), pool = cities.length && Math.random() < .7 ? cities : targets;
  const tgt = pool[(Math.random() * pool.length) | 0];
  return { kind: kind || "war", x, y, sx: x, sy: y, tgt, v: spec.speed * rnd(.85, 1.15), split: kind ? 0 : Math.random() < spec.split ? rnd(R * 2.2, R * 3.2) : 0, weave: !kind && Math.random() < spec.weave, ph: Math.random() * TAU, age: 0, trail: [] };
}
function newOrbiter(a0, spec) {
  return { kind: "orb", ang: a0, r: R * rnd(2.6, 3.1), w: rnd(.25, .38) * (Math.random() < .5 ? 1 : -1), drop: rnd(2, 4), hp: 1, age: 0, x: 0, y: 0, spec };
}
function spawnEdge(spec) {
  const a = Math.random() * TAU;
  const t = newWarhead(cx + Math.cos(a) * spawnR, cy + Math.sin(a) * spawnR, spec);
  if (t) threats.push(t);
}

/* ---------- player fire ---------- */
function fire(x, y) {
  if (PA.state !== "play" || phase !== "wave" && phase !== "clear") return;
  const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
  if (d < R * 1.12) { x = cx + dx / (d || 1) * R * 1.12; y = cy + dy / (d || 1) * R * 1.12; }
  const ta = Math.atan2(y - cy, x - cx);
  let bestS = null, bd = Infinity;
  for (const s of sites) {
    if (!s.battery || !s.alive || s.ammo <= 0) continue;
    const dd = Math.abs(angDiff(s.a + rot, ta));
    if (dd < bd) { bd = dd; bestS = s; }
  }
  if (!bestS) { PA.sfx("click", { pitch: .5 }); texts.add(x, y, "NO AMMO", { color: "#ff5c7a", size: 14, life: .6 }); return; }
  bestS.ammo--;
  const p = sitePos(bestS, R * .1), tr = Math.hypot(x - cx, y - cy);
  // fly in polar coordinates: angle and radius both ease from the battery to the target, plus a lift so the arc clears the ground
  const a0 = p.a, a1 = a0 + angDiff(a0, ta);
  const len = Math.abs(a1 - a0) * (R + tr) / 2 + Math.abs(tr - R);
  shots.push({ a0, a1, r0: R * 1.1, r1: tr, t: 0, dur: Math.max(.22, len / (R * 7.5)), x: p.x, y: p.y, trail: [], lift: Math.abs(a1 - a0) * R * .35 });
  PA.sfx("laser", { pitch: 1.6, vol: .5 });
}
function boom(x, y, depth, big) {
  const r = R * (big ? .55 : .46) * Math.pow(.86, Math.min(depth, 4));
  blasts.push({ x, y, r: 0, max: r, t: 0, depth });
  if (depth === 0) PA.sfx("explode", { pitch: 1.4 + Math.random() * .3 });
  else PA.sfx("explode", { pitch: 1.6 + depth * .12 });
  fx.burst(x, y, { n: 14 + depth * 3, colors: depth ? ["#ffd36b", "#ff8a5c", "#fff"] : ["#8ee9ff", "#fff", "#c4a6ff"], speed: 180, life: .5 });
}

/* ---------- update ---------- */
function update(dt) {
  fx.update(dt); texts.update(dt);
  if (!sites) return;
  rot += rotV * dt * (PA.state === "play" ? 1 : .3);
  if (PA.state !== "play") return;
  phaseT += dt;
  keyboardAim(dt);
  const spec = waveSpec(wave);

  if (phase === "wave") {
    spawnT -= dt;
    if (waveLeft > 0 && spawnT <= 0) {
      spawnEdge(spec); waveLeft--;
      spawnT = spec.gap * rnd(.6, 1.4);
      if (wave >= 3 && Math.random() < .25 && waveLeft > 0) { spawnEdge(spec); waveLeft--; }
    }
    if (waveLeft <= 0 && !threats.length && !blasts.length && !shots.length) endWave();
  } else if (phase === "clear") {
    if (phaseT > 3.2) startWave();
  } else if (phase === "dead") {
    if (phaseT > 2.2 && phaseT - dt <= 2.2) gameOver();
  }

  // interceptors
  for (const s of shots) {
    s.t = Math.min(1, s.t + dt / s.dur);
    const e = PA.ease.outCubic(s.t);
    const a = s.a0 + (s.a1 - s.a0) * e, r = s.r0 + (s.r1 - s.r0) * e + Math.sin(e * Math.PI) * s.lift;
    s.x = cx + Math.cos(a + 0) * r; s.y = cy + Math.sin(a) * r;
    s.trail.push(s.x, s.y); if (s.trail.length > 40) s.trail.splice(0, 2);
    if (s.t >= 1) { s.done = true; boom(s.x, s.y, 0); }
  }
  shots = shots.filter((s) => !s.done);

  // threats
  for (const t of threats) {
    t.age += dt;
    if (t.kind === "orb") {
      // once the wave has nothing else left, orbiters give up and drift away
      if (t.leaving || (waveLeft <= 0 && !threats.some((o) => o.kind !== "orb" && !o.dead) && t.age > 8)) {
        t.leaving = true; t.r += R * 1.2 * dt;
        if (t.r > spawnR + 40) { t.dead = true; continue; }
      }
      t.ang += t.w * dt / (t.r / R) * 1.4; t.x = cx + Math.cos(t.ang) * t.r; t.y = cy + Math.sin(t.ang) * t.r;
      t.drop -= dt;
      if (t.drop <= 0 && phase === "wave" && !t.leaving) { t.drop = rnd(2.4, 4.2) - Math.min(1.2, wave * .08); const w = newWarhead(t.x, t.y, t.spec); if (w) { w.v *= .8; w.split = 0; threats.push(w); } }
      continue;
    }
    if (!t.tgt.alive) { const alt = liveTargets(); if (alt.length) t.tgt = alt.reduce((b, s) => { const p = sitePos(s), q = sitePos(b); return Math.hypot(p.x - t.x, p.y - t.y) < Math.hypot(q.x - t.x, q.y - t.y) ? s : b; }); }
    const p = sitePos(t.tgt);
    let dx = p.x - t.x, dy = p.y - t.y; const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    let vx = dx * t.v, vy = dy * t.v;
    if (t.weave) { const k = Math.sin(t.age * 3 + t.ph) * t.v * .7; vx += -dy * k; vy += dx * k; }
    t.x += vx * dt; t.y += vy * dt;
    if (t.age > .02) { t.trail.push(t.x, t.y); if (t.trail.length > 180) t.trail.splice(0, 2); }
    // split into three once close enough
    if (t.split && Math.hypot(t.x - cx, t.y - cy) < t.split) {
      t.dead = true;
      for (let k = 0; k < 3; k++) { const w = newWarhead(t.x, t.y, spec, "frag"); if (w) { w.v = t.v * 1.05; threats.push(w); } }
      fx.burst(t.x, t.y, { n: 10, colors: ["#ff5c7a", "#fff"], speed: 120, life: .4 });
      PA.sfx("pop", { pitch: .7 });
      continue;
    }
    if (d < R * .1 + 4 || Math.hypot(t.x - cx, t.y - cy) < R) impact(t);
  }

  // blasts grow, hold and fade; anything inside one bursts into a smaller blast (chain)
  for (const b of blasts) {
    b.t += dt;
    b.r = b.t < .3 ? b.max * PA.ease.outCubic(b.t / .3) : b.t < .62 ? b.max : b.max * Math.max(0, 1 - (b.t - .62) / .38);
    if (b.r < 2) continue;
    for (const t of threats) {
      if (t.dead) continue;
      if (Math.hypot(t.x - b.x, t.y - b.y) > b.r + (t.kind === "orb" ? R * .12 : 3)) continue;
      t.dead = true; kills++;
      const depth = b.depth + 1, mult = depth;
      const base = t.kind === "orb" ? 250 : t.split ? 75 : 25;
      const pts = base * mult * Math.max(1, Math.ceil(wave / 2));
      score += pts;
      bestChain = Math.max(bestChain, depth);
      texts.add(t.x, t.y - 10, (depth > 1 ? "×" + depth + " " : "") + pts, { color: depth > 1 ? "#ffd36b" : "#8ee9ff", size: 13 + Math.min(10, depth * 2), life: .8 });
      if (depth >= 3) PA.shake(2 + depth, .2);
      boom(t.x, t.y, depth, t.kind === "orb");
    }
  }
  blasts = blasts.filter((b) => b.t < 1);
  threats = threats.filter((t) => !t.dead);

  if (score >= nextBonus) {
    nextBonus += 10000;
    const dead = sites.filter((s) => !s.battery && !s.alive);
    if (dead.length) { const s = dead[0]; s.alive = true; const p = sitePos(s, R * .4); texts.add(p.x, p.y, "CITY REBUILT", { color: "#7dffb0", size: 16, life: 1.6 }); PA.sfx("levelup"); }
  }
}
function impact(t) {
  t.dead = true;
  // whatever site is under the impact takes the hit (a weaving warhead can miss its target)
  let s = null, bd = R * .45;
  for (const q of sites) { const qp = sitePos(q), d = Math.hypot(qp.x - t.x, qp.y - t.y); if (d < bd) { bd = d; s = q; } }
  if (!s) {
    fx.burst(t.x, t.y, { n: 20, colors: ["#ff8a5c", "#fff"], speed: 160, life: .6 });
    PA.shake(3, .2); PA.sfx("explode", { pitch: .8 });
    return;
  }
  const p = sitePos(s);
  fx.burst(p.x, p.y, { n: 40, colors: ["#ff5c7a", "#ffd36b", "#fff"], speed: 260, life: .9, gravity: 0 });
  PA.shake(8, .35); PA.sfx("boom", { pitch: 1.2 });
  if (s.alive) {
    s.alive = false; s.hit = 1;
    if (s.battery) s.ammo = 0;
    texts.add(p.x, p.y, s.battery ? "BATTERY DOWN" : "CITY LOST", { color: "#ff5c7a", size: 15, life: 1.2 });
  }
  if (!sites.some((x) => !x.battery && x.alive) && phase !== "dead") { phase = "dead"; phaseT = 0; PA.sfx("lose"); }
}
function endWave() {
  phase = "clear"; phaseT = 0;
  const cities = sites.filter((s) => !s.battery && s.alive).length;
  const ammo = sites.reduce((n, s) => n + (s.battery && s.alive ? s.ammo : 0), 0);
  const m = Math.max(1, Math.ceil(wave / 2));
  const bonus = (cities * 100 + ammo * 5) * m;
  score += bonus;
  texts.add(cx, cy - R * 1.9, "WAVE " + wave + " CLEAR", { color: "#7dffb0", size: 28, life: 2.6, vy: -8 });
  texts.add(cx, cy + R * 1.9, cities + " cities × 100 + " + ammo + " shots × 5" + (m > 1 ? "  ×" + m : "") + " = " + bonus.toLocaleString(), { color: "#cdd3ff", size: 15, life: 2.6, vy: 0 });
  PA.sfx("levelup");
}
function gameOver() {
  if (score > best) { best = score; try { localStorage.setItem("rf_best", best); } catch (e) {} }
  PA.sfx("gameover");
  PA.gameOver(score, {
    kicker: "The last city fell",
    title: wave >= 10 ? "Guardian of the ring" : wave >= 5 ? "A long defence" : "The planet is quiet",
    stats: [["Wave", wave], ["Warheads stopped", kills], ["Longest chain", bestChain]]
  });
}

/* ---------- input ---------- */
let pointer = { x: -1, y: -1, on: false };
addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = e.pointerType === "mouse"; if (aim) aim.kb = false; });
addEventListener("pointerdown", (e) => {
  if (PA.state !== "play" || PA.isPaused()) return;
  if (e.target.closest && e.target.closest("button,input,a,#pa-gate,.pa-layer,.pa-tb,.pa-touch")) return;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = e.pointerType === "mouse";
  if (aim) aim.kb = false;
  fire(e.clientX, e.clientY);
});
PA.onKey((e) => { if ((e.code === "Space" || e.code === "Enter") && !e.repeat) { aim.kb = true; fire(aim.x, aim.y); } });
function keyboardAim(dt) {
  const sp = Math.min(view.w, view.h) * .9 * dt;
  let mx = 0, my = 0;
  if (PA.down("ArrowLeft", "KeyA")) mx--; if (PA.down("ArrowRight", "KeyD")) mx++;
  if (PA.down("ArrowUp", "KeyW")) my--; if (PA.down("ArrowDown", "KeyS")) my++;
  if (mx || my) { aim.kb = true; aim.x = PA.clamp(aim.x + mx * sp, 10, view.w - 10); aim.y = PA.clamp(aim.y + my * sp, 10, view.h - 10); }
}

/* ---------- drawing ---------- */
let view, ctx;
function layout(v) {
  const prevR = R;
  R = Math.max(42, Math.min(v.w, v.h) * (v.w < v.h ? .15 : .12));
  cx = v.w / 2; cy = v.h / 2 + (v.h > v.w ? 10 : 18);
  spawnR = Math.hypot(v.w, v.h) / 2 + 30;
  stars = Array.from({ length: Math.round(v.w * v.h / 3500) }, () => ({ x: Math.random() * v.w, y: Math.random() * v.h, s: Math.random(), tw: Math.random() * TAU }));
  if (aim) { aim.x = cx; aim.y = cy - R * 2.4; }
  if (prevR !== R && threats) { threats.length = 0; shots.length = 0; blasts.length = 0; }
}
function glow(x, y, r, c0, c1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawPlanet(t) {
  // atmosphere
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  glow(cx, cy, R * 1.9, "rgba(94,160,255,.28)", "rgba(94,160,255,0)");
  ctx.restore();
  const g = ctx.createRadialGradient(cx - R * .4, cy - R * .45, R * .1, cx, cy, R);
  g.addColorStop(0, "#3d6fd6"); g.addColorStop(.6, "#1f3a8c"); g.addColorStop(1, "#0d1640");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  // turning continents
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.fillStyle = "rgba(90,200,140,.55)";
  for (const [a, d, s] of [[.3, .45, .38], [2.1, .55, .3], [3.6, .35, .42], [5.0, .6, .26], [1.2, .15, .22]]) {
    ctx.beginPath(); ctx.ellipse(Math.cos(a) * R * d, Math.sin(a) * R * d, R * s, R * s * .62, a, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,.12)";
  for (const [a, d, s] of [[1, .7, .25], [4, .3, .3]]) { ctx.beginPath(); ctx.ellipse(Math.cos(a + t * .05) * R * d, Math.sin(a + t * .05) * R * d, R * s, R * s * .3, a + 1, 0, TAU); ctx.fill(); }
  ctx.restore();
  // night side
  const sh = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(.55, "rgba(0,0,10,.15)"); sh.addColorStop(1, "rgba(0,0,10,.6)");
  ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(142,233,255,.55)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, R + 1, 0, TAU); ctx.stroke();
}
function drawSite(s, t) {
  const p = sitePos(s);
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a + Math.PI / 2);
  const u = R * .2;
  if (s.battery) {
    if (s.alive) {
      ctx.fillStyle = "#2b3560"; ctx.beginPath(); ctx.arc(0, 0, u * 1.05, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = "#8ee9ff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#8ee9ff"; ctx.fillRect(-u * .14, -u * 1.7, u * .28, u * .8);
      // ammo pips in a little arc above the dome
      const n = s.ammo;
      for (let k = 0; k < n; k++) {
        const a = Math.PI + (k + .5) / Math.max(10, n) * Math.PI, rr = u * 1.55;
        ctx.fillStyle = k < 3 && n <= 3 ? "#ff5c7a" : "#cfefff";
        ctx.fillRect(Math.cos(a) * rr - 1.2, Math.sin(a) * rr - 1.2, 2.4, 2.4);
      }
    } else {
      ctx.fillStyle = "#3a1d2a"; ctx.beginPath(); ctx.arc(0, 0, u * .8, Math.PI, 0); ctx.fill();
      ctx.fillStyle = `rgba(255,92,122,${.4 + Math.sin(t * 6 + s.i) * .2})`; ctx.fillRect(-u * .5, -u * .3, u, u * .2);
    }
  } else if (s.alive) {
    for (const tw of s.towers) {
      const x = tw.off * u * 5, w = tw.w * u * 5, h = tw.h * u * 2.4;
      const gg = ctx.createLinearGradient(0, -h, 0, 0); gg.addColorStop(0, "#5a64a8"); gg.addColorStop(1, "#262c58");
      ctx.fillStyle = gg; ctx.fillRect(x - w / 2, -h, w, h + 2);
      ctx.fillStyle = "#ffe6a8";
      for (let yy = -h + 3; yy < -2; yy += 4) for (let xx = x - w / 2 + 2; xx < x + w / 2 - 1; xx += 3) if (((xx * 7 + yy * 13 + s.i) | 0) % 5 < 3) ctx.fillRect(xx, yy, 1.4, 1.6);
    }
    ctx.save(); ctx.globalCompositeOperation = "lighter"; glow(0, -u, u * 2.2, "rgba(255,210,140,.25)", "rgba(255,210,140,0)"); ctx.restore();
  } else {
    ctx.fillStyle = "#1c1424";
    for (const tw of s.towers) { const x = tw.off * u * 5, w = tw.w * u * 5; ctx.fillRect(x - w / 2, -u * .4 * tw.h, w, u * .4 * tw.h + 2); }
    if (Math.random() < .3) fx.burst(p.x, p.y, { n: 1, colors: ["rgba(120,110,140,.6)"], speed: 20, life: 1.2, size: 4, vx: Math.cos(p.a) * 25, vy: Math.sin(p.a) * 25 });
    ctx.fillStyle = `rgba(255,120,60,${.35 + Math.sin(t * 4 + s.i) * .15})`; ctx.fillRect(-u, -u * .15, u * 2, u * .2);
  }
  ctx.restore();
}
function drawTrail(arr, c0, w) {
  if (arr.length < 4) return;
  ctx.strokeStyle = c0; ctx.lineWidth = w; ctx.lineCap = "round";
  const n = arr.length / 2;

function render(t) {

  for (const b of blasts) {
    if (b.r < 1) continue;
    const k = b.t < .62 ? 1 : Math.max(0, 1 - (b.t - .62) / .38);
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);

function drawCursor(t) {

}
function drawHud(w, h, t) {

  ctx.textAlign = "left";
  ctx.font = `800 ${w < 500 ? 28 : 34}px Manrope, sans-serif`;
  ctx.fillStyle = "#fff"; ctx.shadowColor = "#8ee9ff"; ctx.shadowBlur = 16;
  ctx.fillText(Math.round(shownScore).toLocaleString(), 16, 42); ctx.shadowBlur = 0;
  ctx.font = "700 11px 'JetBrains Mono', monospace"; ctx.fillStyle = "#9fc4e8";
  const cities = sites.filter((s) => !s.battery && s.alive).length;
  ctx.fillText("WAVE " + wave + "  ·  CITIES " + cities + "/6  ·  BEST " + Math.max(best, score).toLocaleString(), 17, 61);
  if (phase === "wave" && wave === 1 && phaseT < 6) {
    ctx.textAlign = "center"; ctx.font = `700 ${w < 500 ? 14 : 17}px Manrope, sans-serif`;
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, (6 - phaseT) / 1.5) * .8})`;
    ctx.fillText((PA.isTouch ? "Tap" : "Click") + " ahead of a warhead · blasts chain into blasts", w / 2, h - (PA.isTouch ? 40 : 28));
  }
}

view = PA.canvas(document.getElementById("c"), { onResize: layout });
ctx = view.ctx;
reset();
PA.onStart(reset);
PA.loop(update, render);
window.__rf = {
  get threats() { return threats; }, get sites() { return sites; }, get wave() { return wave; }, get score() { return score; }, get phase() { return phase; },
  get center() { return { x: cx, y: cy, R }; }, get bestChain() { return bestChain; }, fire

})();
