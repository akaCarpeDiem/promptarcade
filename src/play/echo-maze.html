<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Echo Maze — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#05060b;color:#eef6ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;position:fixed;inset:0}
</style></head><body>
<canvas id="c" aria-label="Echo Maze cave"></canvas>
<script>
window.paConfig = {
  slug: "echo-maze", title: "Echo Maze", native: true, music: "spooky", unit: "points",
  controls: [["← → ↑ ↓ / WASD", "Fly"], ["Space / tap", "Sonar ping: lights the cave, but makes noise"], ["Touch", "Swipe to fly"], ["Crystals", "Find them all to open the way out"], ["Glowcaps", "Flash that stuns everything nearby"]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script>
(() => {
"use strict";
// A young bat in a pitch-black cave. You only see a little way around you; a sonar ping races down the
// tunnels and lights them for a moment, but every ping is noise, and the blind things in the cave hunt by
// sound. Spiders come to where they heard you, stone lurkers stalk you and freeze only while lit, owls
// glide over the rock toward your last ping. Find every crystal, then get out through the moonlit exit.
const W = 31, H = 17, TAU = Math.PI * 2;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];       // right, down, left, up
const ANG = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
const PATH = 0, WALL = 1, EXIT = 2;
const PING_SPEED = 15, PING_GLOW = 2.8, PING_CD = 1.1;
const fx = new PA.Particles(1200), texts = new PA.Texts();

let grid, start, exitY, gateOpen, crystals, crystalsLeft, crystalsTotal, caps, flies, player, foes, pings, blips, flash;
let mem, light, pingLight, level, score, shownScore, lives, best = 0, phase, phaseT, levelT, pingCd, pingsUsed, totalPings;
let crystalsFound, foesStunned, invuln, lastPing, deathBy = "", seed = 1, caveCanvas;
try { best = +localStorage.getItem("em_best") || 0; } catch (e) {}

const idx = (x, y) => y * W + x;
function rng(s) { return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- cave generation ---------- */
function genCave() {
  const g = Array.from({ length: H }, () => Array(W).fill(WALL));
  const seen = new Set(), key = (x, y) => x + "," + y;
  const sy = 1 + 2 * ((Math.random() * ((H - 1) / 2)) | 0);
  const stack = [[1, sy]]; seen.add(key(1, sy)); g[sy][1] = PATH;
  // depth-first carve with a bias toward long horizontal runs, so tunnels feel like a cave, not a grid
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const nb = DIRS.map(([dx, dy]) => [x + dx * 2, y + dy * 2, dx, dy]).filter(([nx, ny]) => nx >= 1 && nx <= W - 2 && ny >= 1 && ny <= H - 2 && !seen.has(key(nx, ny)));
    if (!nb.length) { stack.pop(); continue; }
    const pick = nb.find((n) => n[2] && Math.random() < .35) || nb[(Math.random() * nb.length) | 0];
    const [nx, ny, dx, dy] = pick;
    g[y + dy][x + dx] = PATH; g[ny][nx] = PATH; seen.add(key(nx, ny)); stack.push([nx, ny]);
  }
  // open up most dead ends into loops, but keep a few nooks: crystals like to hide in them
  const deg = (x, y) => DIRS.reduce((n, [dx, dy]) => n + (g[y + dy] && g[y + dy][x + dx] === PATH ? 1 : 0), 0);
  for (let y = 1; y < H - 1; y += 2) for (let x = 1; x < W - 1; x += 2) {
    if (deg(x, y) > 1 || Math.random() < .3) continue;
    const opts = DIRS.filter(([dx, dy]) => { const nx = x + dx * 2, ny = y + dy * 2; return nx >= 1 && nx <= W - 2 && ny >= 1 && ny <= H - 2 && g[y + dy][x + dx] === WALL; });
    if (opts.length) { const [dx, dy] = opts[(Math.random() * opts.length) | 0]; g[y + dy][x + dx] = PATH; }
  }
  // a few small caverns: knock out single walls between parallel tunnels
  for (let k = 0; k < 10; k++) {
    const x = 2 + ((Math.random() * (W - 4)) | 0), y = 2 + ((Math.random() * (H - 4)) | 0);
    if (g[y][x] === WALL && ((g[y][x - 1] === PATH && g[y][x + 1] === PATH) || (g[y - 1][x] === PATH && g[y + 1][x] === PATH))) g[y][x] = PATH;
  }
  grid = g; start = [1, sy];
  // the exit is the right-edge opening farthest from where you start
  const d = bfs(1, sy, false);
  let by = 1, bd = -1;
  for (let y = 1; y < H - 1; y += 2) if (d[idx(W - 2, y)] > bd) { bd = d[idx(W - 2, y)]; by = y; }
  exitY = by; g[by][W - 1] = EXIT;
}
function passable(x, y, who) {
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  const t = grid[y][x];
  return t === PATH || (t === EXIT && gateOpen && who === player);
}
// Breadth-first distances over the tunnels. Used for creature pathing and for how far a ping travels.
function bfs(sx, sy, withExit, maxD) {
  const d = new Int16Array(W * H).fill(32767), q = [sx, sy];
  d[idx(sx, sy)] = 0; maxD = maxD == null ? 32767 : maxD;
  for (let h = 0; h < q.length; h += 2) {
    const x = q[h], y = q[h + 1], nd = d[idx(x, y)] + 1;
    if (nd > maxD) continue;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const t = grid[ny][nx];
      if (!(t === PATH || (withExit && t === EXIT)) || d[idx(nx, ny)] <= nd) continue;
      d[idx(nx, ny)] = nd; q.push(nx, ny);
    }
  }
  return d;
}
let distCache = new Map();
function distTo(x, y) {
  const k = idx(x, y);
  let d = distCache.get(k);
  if (!d) { d = bfs(x, y, false); distCache.set(k, d); }
  return d;
}

/* ---------- level setup ---------- */
function placeItems() {
  const d = bfs(start[0], start[1], false), taken = new Set([idx(start[0], start[1])]);
  const tiles = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (grid[y][x] === PATH && d[idx(x, y)] >= 5) tiles.push([x, y]);
  const deg = (x, y) => DIRS.reduce((n, [dx, dy]) => n + (grid[y + dy][x + dx] === PATH ? 1 : 0), 0);
  const nooks = tiles.filter(([x, y]) => deg(x, y) === 1).sort(() => Math.random() - .5);
  const rest = tiles.filter(([x, y]) => deg(x, y) !== 1).sort(() => Math.random() - .5);
  const far = (x, y, list, m) => list.every((c) => Math.hypot(c.x - x, c.y - y) >= m);
  crystalsTotal = Math.min(18, 7 + level * 2);
  crystals = [];
  for (const [x, y] of nooks.concat(rest)) {
    if (crystals.length >= crystalsTotal) break;
    if (far(x, y, crystals, 3.2)) { crystals.push({ x, y, hue: Math.random(), got: false }); taken.add(idx(x, y)); }
  }
  crystalsTotal = crystalsLeft = crystals.length;
  caps = [];
  for (const [x, y] of rest) {
    if (caps.length >= 2) break;
    if (!taken.has(idx(x, y)) && d[idx(x, y)] >= 10 && far(x, y, caps, 9)) { caps.push({ x, y, got: false }); taken.add(idx(x, y)); }
  }
  flies = [];
  for (const [x, y] of rest.slice().reverse()) {
    if (flies.length >= 6) break;
    if (!taken.has(idx(x, y)) && far(x, y, flies, 5)) flies.push({ x, y, dir: (Math.random() * 4) | 0, moving: true, got: false, ph: Math.random() * TAU });
  }
}
function foeRoster() {
  const r = ["spider", "spider"];
  if (level >= 2) r.push("lurker");
  if (level >= 3) r.push("spider");
  if (level >= 4) r.push("owl");
  if (level >= 6) r.push("lurker");
  if (level >= 8) r.push("spider", "owl");
  return r;
}
function spawnFoes() {
  const d = bfs(start[0], start[1], false), spots = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (grid[y][x] === PATH && d[idx(x, y)] >= 16) spots.push([x, y]);
  spots.sort(() => Math.random() - .5);
  const used = [];
  foes = foeRoster().map((type, i) => {
    let s = spots.find(([x, y]) => used.every(([ux, uy]) => Math.hypot(ux - x, uy - y) > 5)) || spots[i % spots.length] || [W - 2, exitY];
    used.push(s);
    return { type, x: s[0], y: s[1], hx: s[0], hy: s[1], dir: (Math.random() * 4) | 0, moving: true, ph: Math.random() * TAU,
      state: "wander", target: null, huntT: 0, stun: 0, frozen: false, wake: type === "lurker" ? 4 : 2, ang: 0, vx: 0, vy: 0 };
  });
}
function newLevel() {
  gateOpen = false; distCache = new Map(); seed = (Math.random() * 1e9) | 0;
  genCave(); placeItems(); spawnFoes();
  mem = new Float32Array(W * H); light = new Float32Array(W * H); pingLight = new Float32Array(W * H);
  pings = []; blips = []; flash = null; levelT = 0; pingsUsed = 0; lastPing = null;
  drawCave();
  startLife();
}
function startLife() {
  player = { x: start[0], y: start[1], dir: 0, next: 0, moving: false, ang: 0, flap: 0 };
  for (const f of foes) Object.assign(f, { x: f.hx, y: f.hy, state: "wander", target: null, huntT: 0, stun: 0, wake: f.type === "lurker" ? 4 : 2, moving: true, vx: 0, vy: 0 });
  pings = []; pingCd = 0; invuln = 1.5; lastPing = null;
  phase = "ready"; phaseT = 0;
}
function reset() {
  level = 1; score = 0; shownScore = 0; lives = 3; crystalsFound = 0; foesStunned = 0; totalPings = 0;
  fx.clear(); texts.clear();
  newLevel();
  PA.music.intensity(0);
}

/* ---------- movement ---------- */
function opp(d) { return (d + 2) % 4; }
function atCenter(e) { return Math.abs(e.x - Math.round(e.x)) < 1e-4 && Math.abs(e.y - Math.round(e.y)) < 1e-4; }
function canGo(e, d) { return passable(Math.round(e.x) + DIRS[d][0], Math.round(e.y) + DIRS[d][1], e); }
// Moves an entity along its direction, stopping at each tile centre to let decide() pick the next one.
function step(e, dist, decide) {
  let guard = 0;
  while (dist > 1e-6 && guard++ < 8) {
    if (atCenter(e)) {
      e.x = Math.round(e.x); e.y = Math.round(e.y);
      decide(e);
      if (e.dir == null || !canGo(e, e.dir)) { e.moving = false; return; }
    }
    e.moving = true;
    const [dx, dy] = DIRS[e.dir];
    const pos = dx ? e.x : e.y, s = dx || dy;
    const nextC = s > 0 ? Math.floor(pos + 1e-6) + 1 : Math.ceil(pos - 1e-6) - 1;
    const d = Math.abs(nextC - pos), m = Math.min(d, dist);
    if (dx) e.x += dx * m; else e.y += dy * m;
    if (m >= d - 1e-9) { if (dx) e.x = nextC; else e.y = nextC; }
    dist -= m;
  }
}
function playerDecide(e) { if (e.next != null && canGo(e, e.next)) e.dir = e.next; }
function wanderDecide(e) {
  const opts = [0, 1, 2, 3].filter((d) => d !== opp(e.dir) && canGo(e, d));
  e.dir = opts.length ? opts[(Math.random() * opts.length) | 0] : opp(e.dir);
}
function seekDecide(e) {
  const dm = distTo(e.target[0], e.target[1]), cx = Math.round(e.x), cy = Math.round(e.y);
  let bd = dm[idx(cx, cy)], bestDir = null;
  for (let d = 0; d < 4; d++) {
    if (!canGo(e, d)) continue;
    const v = dm[idx(cx + DIRS[d][0], cy + DIRS[d][1])] + Math.random() * .1;
    if (v < bd) { bd = v; bestDir = d; }
  }
  if (bestDir == null) wanderDecide(e); else e.dir = bestDir;
}

/* ---------- sonar ---------- */
function pingRadius() { return 9 + Math.min(3, Math.floor(level / 3)); }
function ping() {
  if (phase !== "play" || pingCd > 0) return;
  const px = Math.round(player.x), py = Math.round(player.y), R = pingRadius();
  pings.push({ x: px, y: py, t: 0, R, d: bfs(px, py, true, R), hit: new Set() });
  pingCd = PING_CD; pingsUsed++; totalPings++;
  lastPing = { x: px, y: py, t: levelT };
  PA.sfx("pop", { pitch: 1.6 }); PA.tone({ freq: 1800, to: 2600, type: "sine", dur: .09, vol: .06, delay: .02 });
  // anything that can hear it comes looking
  for (const f of foes) {
    if (f.type === "lurker") continue;
    if (Math.hypot(f.x - px, f.y - py) <= R + 3) hear(f, px, py, 8);
  }
}
function hear(f, x, y, t) {
  if (f.type === "owl") { f.target = [x, y]; f.huntT = t; f.state = "hunt"; return; }
  if (f.type !== "spider") return;
  f.target = [x, y]; f.huntT = t; f.state = "hunt";
}

/* ---------- update ---------- */
function update(dt) {
  fx.update(dt); texts.update(dt);
  if (!grid || PA.state !== "play") return;
  phaseT += dt;
  for (const f of flies) f.ph += dt * 6;
  if (phase === "ready") { computeLight(dt); if (phaseT > 1.8) { phase = "play"; phaseT = 0; } return; }
  if (phase === "dying") { computeLight(dt); if (phaseT > 1.5) afterDeath(); return; }
  if (phase === "clear") { if (phaseT > 2.2) { level++; newLevel(); } return; }
  levelT += dt; pingCd = Math.max(0, pingCd - dt); invuln = Math.max(0, invuln - dt);
  const k = Math.min(1, (level - 1) / 7);

  // player
  if (player.next != null && player.dir != null && player.next === opp(player.dir)) player.dir = player.next;
  if (!player.moving && player.next != null && atCenter(player) && canGo(player, player.next)) player.dir = player.next;
  step(player, (5.4 + k * .6) * dt, playerDecide);
  player.flap += dt * (player.moving ? 16 : 7);
  player.ang = turnTo(player.ang, ANG[player.dir], dt * 14);
  collect();
  if (phase !== "play") return;
  if (gateOpen && Math.round(player.x) === W - 1 && Math.abs(player.y - exitY) < .3) { clearLevel(); return; }

  // pings travel and fade
  for (const p of pings) {
    p.t += dt;
    // a ping that sweeps past a creature leaves a red blip where it was
    for (const f of foes) {
      if (p.hit.has(f)) continue;
      const fd = p.d[idx(Math.round(f.x), Math.round(f.y))];
      if ((fd < 32767 && fd <= p.t * PING_SPEED) || (f.type === "owl" && Math.hypot(f.x - p.x, f.y - p.y) <= Math.min(p.R, p.t * PING_SPEED))) {
        p.hit.add(f); blips.push({ x: f.x, y: f.y, t: 0, type: f.type });
      }
    }
  }
  pings = pings.filter((p) => p.t < p.R / PING_SPEED + PING_GLOW);
  for (const b of blips) b.t += dt;
  blips = blips.filter((b) => b.t < 2.6);
  if (flash) { flash.t += dt; if (flash.t > 2.2) flash = null; }
  computeLight(dt);

  // creatures
  for (const f of foes) {
    f.ph += dt * (f.type === "owl" ? 5 : 9);
    if (f.wake > 0) { f.wake -= dt; continue; }
    if (f.stun > 0) { f.stun -= dt; continue; }
    const near = Math.hypot(f.x - player.x, f.y - player.y);
    if (f.type === "spider") {
      // wingbeats close by give you away
      if (near < 2.7 && player.moving) hear(f, Math.round(player.x), Math.round(player.y), 1.6);
      if (f.state === "hunt") {
        f.huntT -= dt;
        if (f.huntT <= 0 || (atCenter(f) && Math.round(f.x) === f.target[0] && Math.round(f.y) === f.target[1])) { f.state = "search"; f.huntT = 2.5; }
      } else if (f.state === "search") { f.huntT -= dt; if (f.huntT <= 0) f.state = "wander"; }
      const v = f.state === "hunt" ? 4 + k * .9 : f.state === "search" ? 3.2 : 2.3 + k * .5;
      step(f, v * dt, f.state === "hunt" ? seekDecide : wanderDecide);
    } else if (f.type === "lurker") {
      // stone lurkers always know where you are, but can't move while light is on them
      f.frozen = pingLight[idx(Math.round(f.x), Math.round(f.y))] > .25;
      if (f.frozen) continue;
      f.target = [Math.round(player.x), Math.round(player.y)];
      step(f, (2.9 + k * 1.1) * dt, seekDecide);
    } else {
      // owls glide straight over the rock toward the last sound they heard
      if (f.state === "hunt") { f.huntT -= dt; if (f.huntT <= 0 || Math.hypot(f.x - f.target[0], f.y - f.target[1]) < .3) { f.state = "wander"; f.target = null; } }
      if (!f.target) f.target = [1 + Math.random() * (W - 3), 1 + Math.random() * (H - 3)];
      const tx = f.target[0] - f.x, ty = f.target[1] - f.y, td = Math.hypot(tx, ty) || 1;
      const sp = f.state === "hunt" ? 3 + k * .8 : 1.6;
      f.vx += (tx / td * sp - f.vx) * Math.min(1, dt * 2); f.vy += (ty / td * sp - f.vy) * Math.min(1, dt * 2);
      f.x = PA.clamp(f.x + f.vx * dt, .5, W - 1.5); f.y = PA.clamp(f.y + f.vy * dt, .5, H - 1.5);
      if (td < .4 && f.state !== "hunt") f.target = null;
    }
  }
  // fireflies drift along the tunnels
  for (const fl of flies) if (!fl.got) step(fl, 1.1 * dt, wanderDecide);
  collide();
  PA.music.intensity(Math.min(1, (level - 1) / 7 + (1 - crystalsLeft / crystalsTotal) * .3));
}
function turnTo(a, b, k) { let d = ((b - a + Math.PI * 3) % TAU) - Math.PI; return a + d * Math.min(1, k); }

function computeLight(dt) {
  light.fill(0); pingLight.fill(0);
  const add = (i, v, arr) => { if (v > arr[i]) arr[i] = v; };
  const litWalls = (arr) => {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (grid[y][x] !== WALL) continue;
      let m = 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
        const nx = x + ox, ny = y + oy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && grid[ny][nx] !== WALL) m = Math.max(m, arr[idx(nx, ny)]);
      }
      arr[idx(x, y)] = m * .9;
    }
  };
  // pings: lit where the wave has passed, fading after
  for (const p of pings) {
    const front = p.t * PING_SPEED;
    for (let i = 0; i < W * H; i++) {
      const d = p.d[i]; if (d > p.R || d > front) continue;
      const age = p.t - d / PING_SPEED;
      add(i, Math.max(0, 1 - age / PING_GLOW) * (.65 + .35 * (1 - d / p.R)), pingLight);
    }
  }
  if (flash) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dd = Math.hypot(x - flash.x, y - flash.y); if (dd > 7) continue;
      add(idx(x, y), Math.max(0, 1 - flash.t / 2.2) * (1 - dd / 9), pingLight);
    }
  }
  litWalls(pingLight);
  for (let i = 0; i < W * H; i++) light[i] = pingLight[i];
  // your own faint glow, a short way along the tunnels
  const near = new Float32Array(W * H);
  const pd = bfs(Math.round(player.x), Math.round(player.y), true, 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (pd[idx(x, y)] > 3) continue;
    near[idx(x, y)] = PA.clamp(1.25 - Math.hypot(x - player.x, y - player.y) / 2.9, 0, 1);
  }
  for (const fl of flies) if (!fl.got) {
    for (let y = Math.max(0, Math.round(fl.y) - 2); y <= Math.min(H - 1, Math.round(fl.y) + 2); y++)
      for (let x = Math.max(0, Math.round(fl.x) - 2); x <= Math.min(W - 1, Math.round(fl.x) + 2); x++)
        if (grid[y][x] !== WALL) add(idx(x, y), PA.clamp(.75 - Math.hypot(x - fl.x, y - fl.y) / 2.4, 0, 1), near);
  }
  if (gateOpen) for (let y = exitY - 2; y <= exitY + 2; y++) for (let x = W - 3; x < W; x++) if (y >= 0 && y < H && grid[y][x] !== WALL) add(idx(x, y), .8 - Math.hypot(x - W + 1, y - exitY) / 4, near);
  litWalls(near);
  for (let i = 0; i < W * H; i++) {
    if (near[i] > light[i]) light[i] = near[i];
    if (light[i] > .45) mem[i] = Math.min(1, mem[i] + dt * 4);
    light[i] = Math.max(light[i], mem[i] * .15);
  }
}

function collect() {
  const x = Math.round(player.x), y = Math.round(player.y);
  if (Math.abs(player.x - x) > .35 || Math.abs(player.y - y) > .35) return;
  const s = toScreen(x, y);
  for (const c of crystals) {
    if (c.got || c.x !== x || c.y !== y) continue;
    c.got = true; crystalsLeft--; crystalsFound++;
    score += 100 * level;
    texts.add(s.x, s.y - T * .4, "+" + 100 * level, { color: "#9ff6ff", size: 16 });
    fx.burst(s.x, s.y, { n: 20, colors: ["#9ff6ff", "#fff", "#d6a8ff"], speed: 200, life: .6, shape: "spark" });
    PA.sfx("coin", { pitch: 1 + (crystalsTotal - crystalsLeft) * .03 });
    // crystals ring when you pull them out: spiders nearby hear it
    for (const f of foes) if (f.type === "spider" && Math.hypot(f.x - x, f.y - y) < 6) hear(f, x, y, 5);
    if (!crystalsLeft) {
      gateOpen = true;
      PA.sfx("power");

    ctx.globalAlpha = .25 + .75 * PA.clamp((L - .12) / .4, 0, 1); drawOwl(f, C(f.x), C(f.y), T * 1.3, t); ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = "lighter";
  // the ping wavefront racing down the tunnels
  for (const p of pings) {
    const front = p.t * PING_SPEED; if (front > p.R + 1) continue;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = p.d[idx(x, y)]; if (d > p.R) continue;
      const k = 1 - Math.abs(d - front) / 1.2; if (k <= 0) continue;
      ctx.fillStyle = `rgba(110,225,255,${k * .55 * (1 - d / (p.R + 2))})`;
      ctx.beginPath(); ctx.arc(C(x), C(y), T * .42, 0, TAU); ctx.fill();
    }
  }
  // eyes you can make out in the dark when something is close
  for (const f of foes) {
    if (f.type === "owl" || f.wake > 0) continue;
    const d = Math.hypot(f.x - player.x, f.y - player.y);
    if (d > 5.5) continue;
    const a = (1 - d / 5.5) * (.5 + .5 * Math.sin(t * 3 + f.ph)) * (f.frozen ? .2 : 1);
    ctx.fillStyle = f.type === "lurker" ? `rgba(255,130,50,${a})` : `rgba(255,60,90,${a})`;
    const [dx, dy] = f.dir == null ? [0, 0] : DIRS[f.dir];
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(C(f.x) + dx * T * .2 - dy * s * T * .09, C(f.y) + dy * T * .2 + dx * s * T * .09, T * .06, 0, TAU); ctx.fill(); }
  }
  // sonar blips: where a ping found something
  for (const b of blips) {
    const k = 1 - b.t / 2.6, col = b.type === "owl" ? "255,200,80" : b.type === "lurker" ? "255,140,70" : "255,80,110";
    ctx.strokeStyle = `rgba(${col},${k * .8})`; ctx.lineWidth = Math.max(1.2, T * .06);
    ctx.beginPath(); ctx.arc(C(b.x), C(b.y), T * (.3 + b.t * .15), 0, TAU); ctx.stroke();
  }
  // fireflies glow through the dark
  for (const fl of flies) {
    if (fl.got) continue;
    const fx0 = C(fl.x) + Math.sin(fl.ph * .7) * T * .15, fy0 = C(fl.y) + Math.cos(fl.ph * .5) * T * .15, k = .6 + .4 * Math.sin(fl.ph);
    const g = ctx.createRadialGradient(fx0, fy0, 0, fx0, fy0, T * .7); g.addColorStop(0, `rgba(230,255,120,${.5 * k})`); g.addColorStop(1, "rgba(230,255,120,0)");
    ctx.fillStyle = g; ctx.fillRect(fx0 - T * .7, fy0 - T * .7, T * 1.4, T * 1.4);
    ctx.fillStyle = `rgba(250,255,200,${.6 + .4 * k})`; ctx.beginPath(); ctx.arc(fx0, fy0, T * .07, 0, TAU); ctx.fill();
  }
  // moonlight at the exit always shows, so you know where you're heading
  {
    const ey = C(exitY), k = gateOpen ? .8 + .2 * Math.sin(t * 4) : .35;
    const g = ctx.createRadialGradient(bw, ey, 0, bw, ey, T * 1.6); g.addColorStop(0, `rgba(190,215,255,${k})`); g.addColorStop(1, "rgba(190,215,255,0)");
    ctx.fillStyle = g; ctx.fillRect(bw - T * 1.6, ey - T * 1.6, T * 1.6, T * 3.2);
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
  // frame
  ctx.strokeStyle = "rgba(120,150,190,.25)"; ctx.lineWidth = 1.5; rrect(-1, -1, bw + 2, bh + 2, 6); ctx.stroke();
  ctx.restore();
  fx.draw(ctx); texts.draw(ctx);
  // banners
  ctx.textAlign = "center";
  if (phase === "ready") {
    const cy = by + ((rot ? W : H) * T) / 2;
    ctx.font = `800 ${Math.round(Math.min(40, Math.max(22, T * 1.1)))}px Manrope, sans-serif`; ctx.fillStyle = "#e8f2ff"; ctx.shadowColor = "#6ee1ff"; ctx.shadowBlur = 16;
    ctx.fillText("CAVE " + level, w / 2, cy - 6); ctx.shadowBlur = 0;
    ctx.font = `600 ${Math.max(12, Math.min(16, Math.round(T * .55)))}px Manrope, sans-serif`; ctx.fillStyle = "#b8d8ff";
    ctx.fillText("Find " + crystalsTotal + " crystals, then fly out into the moonlight", w / 2, cy + 22);
    if (level === 1 && lives === 3) ctx.fillText((PA.isTouch ? "Tap" : "Space") + " to ping. Pings light the cave, but spiders hear them", w / 2, cy + 44);
  }
  drawHud(w, t);
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawHud(w, t) {
  shownScore += (score - shownScore) * .25;
  ctx.textAlign = "left";
  ctx.font = `800 ${w < 500 ? 26 : 30}px Manrope, sans-serif`;
  ctx.fillStyle = "#fff"; ctx.shadowColor = "#6ee1ff"; ctx.shadowBlur = 14;
  ctx.fillText(Math.round(shownScore).toLocaleString(), 16, 38); ctx.shadowBlur = 0;
  ctx.font = "700 11px 'JetBrains Mono', monospace"; ctx.fillStyle = "#a9c4e8";
  ctx.fillText("CAVE " + level + "  ·  CRYSTALS " + (crystalsTotal - crystalsLeft) + "/" + crystalsTotal + "  ·  BEST " + Math.max(best, score).toLocaleString(), 17, 56);
  for (let i = 0; i < lives - 1; i++) drawBat(26 + i * 26, 68, -Math.PI / 2, 1.2 + t * 3, 18, "#7a68b5", "#4b3c7c");
  // sonar charge
  const k = 1 - pingCd / PING_CD, x = w - 34, y = 34;
  ctx.strokeStyle = "rgba(110,225,255,.2)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.stroke();
  ctx.strokeStyle = k >= 1 ? "#6ee1ff" : "rgba(110,225,255,.6)"; ctx.beginPath(); ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  ctx.fillStyle = k >= 1 ? "#d8f6ff" : "#5d7e99";
  for (let r = 4; r <= 10; r += 3) { ctx.beginPath(); ctx.arc(x - 4, y, r, -.6, .6); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.6; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(x - 6, y, 2.2, 0, TAU); ctx.fill();
}

view = PA.canvas(document.getElementById("c"), { onResize: layout });
ctx = view.ctx;
reset();
PA.onStart(reset);
PA.loop(update, render);
window.__em = {
  get grid() { return grid; }, get player() { return player; }, get foes() { return foes; }, get crystals() { return crystals; },
  get phase() { return phase; }, get level() { return level; }, get score() { return score; }, get lives() { return lives; },
  get crystalsLeft() { return crystalsLeft; }, get gateOpen() { return gateOpen; }, get exitY() { return exitY; }, get rot() { return rot; },
  steer, ping, bfs, distTo, W, H, DIRS,
  setInvuln(s) { invuln = s; },
  clearAll() { for (const c of crystals) if (!c.got) { c.got = true; crystalsLeft--; } gateOpen = true; }
};
})();
</script>
