<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
  const TAU = Math.PI * 2;
  const PA = window.PA;
  const { clamp, rand, lerp } = PA;

  // The lane is a box: the ship flies inside it and every obstacle is built to its walls.
  // These numbers are the game; everything below them only changes how it looks.
  const LANE = { x: 10, y: 4.2 };              // half width / half height of the flight lane
  const SHIP_LIM = { x: 8.6, y: 3.3 };         // how far the ship's centre may go
  const SHIP_HALF = { x: 1.15, y: 0.32, z: 1.0 };
  const SHIP_Z = 0;
  const CAM_BACK = 12.5;
  const CAM_UP = 2.7;
  const SPAWN_Z = -165;
  const SECTOR_LEN = 650;                      // distance units per sector

  // One unit is half a metre: the plane is a 3 m jet, doors are 2 m tall, an office is 5 m high.
  // Rooms are built a little bigger than the lane so nothing you can see sits where you can fly
  // without also being solid.
  const FLOOR = -5.6, CEIL = 5.0, LOBBY_CEIL = 7.6, BUILD_CEIL = 5.6, ROOM = 12.5;
  const STREET = -300;                         // the street is 150 m below
  const CH = 24;                               // world chunk length
  const GEN_Z = -340;                          // the city is built this far ahead
  const ceilOf = (z) => z === "lobby" ? LOBBY_CEIL : z === "build" ? BUILD_CEIL : z === "office" ? CEIL : 40;

  // Each sector is a new time of day over the city.
  const TIMES = [
    { name: "Golden Hour", el: 7, az: 112, sun: 0xffb46e, sunI: 3.4, top: 0x4a7ab4, hor: 0xf0c08e, low: 0x8c6d5c, glow: 0xffa860, glowI: 0.9,
      cloud: 0.42, cLit: 0xffe0b8, cDark: 0x8a7c8a, hemiS: 0xc8dcff, hemiG: 0x7a5844, hemiI: 1.25, fog: 0.0040, lit: 0.35, exp: 1.0, stars: 0, rain: 0 },
    { name: "Sunset", el: 1.2, az: 98, sun: 0xff7c40, sunI: 2.7, top: 0x2f4583, hor: 0xff9a5e, low: 0x5f3e48, glow: 0xff6a34, glowI: 1.5,
      cloud: 0.5, cLit: 0xffa070, cDark: 0x553e5e, hemiS: 0xa8b4e8, hemiG: 0x6a4038, hemiI: 1.0, fog: 0.0042, lit: 0.6, exp: 1.05, stars: 0, rain: 0 },
    { name: "Dusk", el: -3, az: 86, sun: 0xd27a8e, sunI: 0.9, top: 0x1b2656, hor: 0xd97a62, low: 0x30283c, glow: 0xe2664c, glowI: 1.0,
      cloud: 0.36, cLit: 0xd8806e, cDark: 0x2e2a44, hemiS: 0x7a88c8, hemiG: 0x3e2c34, hemiI: 0.85, fog: 0.0042, lit: 0.85, exp: 1.15, stars: 0.15, rain: 0 },
    { name: "Blue Hour", el: -8, az: 80, sun: 0x7a96dc, sunI: 0.5, top: 0x0f1c48, hor: 0x46679f, low: 0x23283e, glow: 0x3e5c9e, glowI: 0.45,
      cloud: 0.25, cLit: 0x5a72a8, cDark: 0x1a2038, hemiS: 0x6276b8, hemiG: 0x2c2a38, hemiI: 0.8, fog: 0.0040, lit: 1.0, exp: 1.25, stars: 0.4, rain: 0 },
    { name: "Midnight", el: 38, az: -60, sun: 0x9fb4ff, sunI: 0.32, top: 0x03060f, hor: 0x241d2e, low: 0x30221e, glow: 0x1c2440, glowI: 0.2,
      cloud: 0.18, cLit: 0x3a3a4c, cDark: 0x0e0f18, hemiS: 0x3a4466, hemiG: 0x3a2a22, hemiI: 0.7, fog: 0.0038, lit: 0.9, exp: 1.35, stars: 1, rain: 0 },
    { name: "Thunderstorm", el: 25, az: 60, sun: 0x8e9aae, sunI: 0.4, top: 0x1c2229, hor: 0x434b56, low: 0x262b32, glow: 0x30363e, glowI: 0.2,
      cloud: 1.0, cLit: 0x5b636e, cDark: 0x1c2026, hemiS: 0x6c7684, hemiG: 0x2a2c30, hemiI: 0.85, fog: 0.0062, lit: 0.95, exp: 1.25, stars: 0, rain: 1 }
  ];

  let W = innerWidth, H = innerHeight;
  let running = false, overSent = false, simT = 0;
  let score = 0, distance = 0, multiplier = 1, peakMult = 1, orbs = 0, nearMisses = 0, gatesCleared = 0;
  let boost = 100, boosting = false, speed = 0, sector = 0, spawnGap = 0, nextSpawn = 0, pattern = 0;
  let shipX = 0, shipY = 0, velX = 0, velY = 0, bank = 0, pitch = 0;
  let ptrActive = false, ptrNX = 0, ptrNY = 0;
  let bannerT = 0;

  const mount = document.getElementById("game");
  const hud = document.getElementById("hl-hud");
  const hint = document.getElementById("hl-hint");
  const boostEl = document.getElementById("hl-boost");
  const boostFill = document.getElementById("hl-boost-fill");
  const banner = document.getElementById("hl-banner");

  /* ---------------- renderer ---------------- */
  // No canvas antialiasing: the scene renders into a multisampled HDR target for the bloom pass instead.
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  let resScale = 1;
  const drawInfo = { calls: 0, tris: 0 };
  const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1) * resScale;
  renderer.setPixelRatio(dprCap());
  renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  mount.appendChild(renderer.domElement);
  const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x9a8a80, 0.004);
  const camera = new THREE.PerspectiveCamera(64, W / H, 0.1, 4200);
  camera.position.set(0, CAM_UP, CAM_BACK);
  const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

  /* ---------------- post: HDR bloom, then tone mapping ---------------- */
  function makePost() {
    const ext = renderer.extensions;
    const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
    const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;
    const main = new THREE.WebGLRenderTarget(1, 1, { type, samples: hdrOk && !fullFloat ? 0 : PA.isTouch ? 2 : 4 });
    const LV = 5, lv = [], tmp = [];
    for (let i = 0; i < LV; i++) {
      lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
      tmp.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
    }
    const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    quad.frustumCulled = false;
    const pscene = new THREE.Scene();
    pscene.add(quad);
    const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
    const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
    const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
    const bright = mk([
      "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
      "void main(){",
      "  " + box4,
      "  float l = max(c.r, max(c.g, c.b));",
      "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
      "  soft = soft * soft / (4.0 * knee + 1e-4);",
      "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(40.0)), 1.0);",
      "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 1.1 : 0.75 } });
    const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
      { tex: { value: null }, px: { value: new THREE.Vector2() } });
    const blur = mk([
      "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
      "void main(){",
      "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
      "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
      "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
      "  gl_FragColor = vec4(c, 1.0);",
      "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
    // Composite: bloom, a touch of lens fringing at the edges (more on afterburner), vignette, grain.
    const comp = mk([
      "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time, ca, flash; varying vec2 vUv;",
      "void main(){",
      "  vec2 q = vUv - 0.5;",
      "  vec2 off = q * dot(q, q) * ca;",
      "  vec3 c = vec3(texture2D(tScene, vUv + off).r, texture2D(tScene, vUv).g, texture2D(tScene, vUv - off).b);",
      "  vec3 b = texture2D(b0, vUv).rgb * 0.45 + texture2D(b1, vUv).rgb * 0.55 + texture2D(b2, vUv).rgb * 0.65 + texture2D(b3, vUv).rgb * 0.75 + texture2D(b4, vUv).rgb * 0.85;",
      "  c += b * strength;",
      "  c *= 1.0 - dot(q, q) * 0.85;",
      "  c += flash;",
      "  gl_FragColor = vec4(c, 1.0);",
      "  #include <tonemapping_fragment>",
      "  #include <colorspace_fragment>",
      "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
      "  gl_FragColor.rgb += (n - 0.5) * grain;",
      "}"].join("\n"), {
      tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
      b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.3 }, grain: { value: 0.018 }, time: { value: 0 },
      ca: { value: 0.004 }, flash: { value: 0 }
    });
    const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };
    return {
      comp,
      setSize(w, h) {
        main.setSize(w, h);
        for (let i = 0; i < LV; i++) {
          const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
          lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
        }
      },
      render(sc, cm, t) {
        renderer.setRenderTarget(main);
        renderer.render(sc, cm);
        drawInfo.calls = renderer.info.render.calls; drawInfo.tris = renderer.info.render.triangles;
        bright.uniforms.tex.value = main.texture;
        bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
        pass(bright, lv[0]);
        for (let i = 0; i < LV; i++) {
          if (i) {
            down.uniforms.tex.value = lv[i - 1].texture;
            down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
            pass(down, lv[i]);
          }
          blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
          pass(blur, tmp[i]);
          blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
          pass(blur, lv[i]);
        }
        comp.uniforms.time.value = t;
        pass(comp, null);
      }
    };
  }
  const post = makePost();

  /* ---------------- shared fog: haze that matches the sky ---------------- */
  // Every world material gets the same exponential haze, tinted by where you look: city glow below
  // the horizon, the sky's own colour at the horizon, and a warm glow toward the sun.
  const FU = {
    uSunV: { value: new THREE.Vector3(0, 0, -1) },
    uUpV: { value: new THREE.Vector3(0, 1, 0) },
    uFogLow: { value: new THREE.Color() },
    uFogSun: { value: new THREE.Color() }
  };
  const FOG_FRAG = [
    "#ifdef USE_FOG",
    "  float fd = length(vFogPos);",
    "  float ff = 1.0 - exp(-fogDensity * fogDensity * fd * fd);",
    "  vec3 fdir = vFogPos / max(fd, 1e-4);",
    "  vec3 fcol = mix(uFogLow, fogColor, smoothstep(-0.3, 0.08, dot(fdir, uUpV)));",
    "  fcol += uFogSun * pow(max(dot(fdir, uSunV), 0.0), 5.0);",
    "  gl_FragColor.rgb = mix(gl_FragColor.rgb, fcol, ff);",
    "#endif"].join("\n");
  function patch(m) {
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, FU);
      sh.vertexShader = sh.vertexShader.replace("#include <fog_pars_vertex>", "#include <fog_pars_vertex>\nvarying vec3 vFogPos;")
        .replace("#include <fog_vertex>", "#include <fog_vertex>\n\tvFogPos = mvPosition.xyz;");
      sh.fragmentShader = sh.fragmentShader.replace("#include <fog_pars_fragment>", "#include <fog_pars_fragment>\nvarying vec3 vFogPos;\nuniform vec3 uSunV, uUpV, uFogLow, uFogSun;")
        .replace("#include <fog_fragment>", FOG_FRAG);
    };
    m.customProgramCacheKey = () => "hl-fog";
    return m;
  }

  /* ---------------- procedural textures ---------------- */
  let seed = 90210;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const rr = (a, b) => a + rnd() * (b - a);
  function hash(a, b) {
    let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(((b | 0) + 0x632be5ab) | 0, 0xc2b2ae35);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }
  function cnv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
  // Geometry UVs are in world units, so each texture's repeat is one over the size of its tile.
  function tex(c, tile, data) {
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = ANISO;
    if (tile) t.repeat.set(1 / tile[0], 1 / tile[1]);
    return t;
  }
  function retile(t, tile) { const c = t.clone(); c.repeat.set(1 / tile[0], 1 / tile[1]); return c; }
  // Tileable value noise, used as grime, grain and blotches on every surface.
  function noise(size, cells, oct, contrast) {
    const [c, g] = cnv(size, size), img = g.createImageData(size, size), d = img.data, acc = new Float32Array(size * size);
    let amp = 1, tot = 0;
    for (let o = 0; o < oct; o++) {
      const n = cells << o, L = new Float32Array(n * n);
      for (let i = 0; i < L.length; i++) L[i] = rnd();
      for (let y = 0; y < size; y++) {
        const fy = y / size * n, y0 = fy | 0, ty = fy - y0, sy = ty * ty * (3 - 2 * ty), r0 = y0 * n, r1 = ((y0 + 1) % n) * n;
        for (let x = 0; x < size; x++) {
          const fx = x / size * n, x0 = fx | 0, tx = fx - x0, sx = tx * tx * (3 - 2 * tx), x1 = (x0 + 1) % n;
          const a = L[r0 + x0] + (L[r0 + x1] - L[r0 + x0]) * sx, b = L[r1 + x0] + (L[r1 + x1] - L[r1 + x0]) * sx;
          acc[y * size + x] += (a + (b - a) * sy) * amp;
        }
      }
      tot += amp; amp *= 0.5;
    }
    for (let i = 0; i < acc.length; i++) {
      const v = clamp((acc[i] / tot - 0.5) * (contrast || 1) + 0.5, 0, 1) * 255;
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  const NZ = { blot: noise(256, 4, 5, 1.8), fine: noise(256, 64, 2, 1.5), mid: noise(256, 16, 4, 1.4) };
  function layer(g, w, h, n, alpha, mode, s) {
    g.save(); g.globalAlpha = alpha; g.globalCompositeOperation = mode || "overlay";
    s = s || 256;
    for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) g.drawImage(n, x, y, s, s);
    g.restore();
  }
  function normalFrom(src, strength) {
    const w = src.width, h = src.height, sd = src.getContext("2d").getImageData(0, 0, w, h).data;
    const [c, g] = cnv(w, h), img = g.createImageData(w, h), d = img.data;
    const Hh = (x, y) => sd[((((y + h) % h) * w) + ((x + w) % w)) * 4] / 255;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = (Hh(x + 1, y) - Hh(x - 1, y)) * strength, dy = (Hh(x, y + 1) - Hh(x, y - 1)) * strength;
      const l = 1 / Math.sqrt(dx * dx + dy * dy + 1), i = (y * w + x) * 4;
      d[i] = (-dx * l * 0.5 + 0.5) * 255; d[i + 1] = (dy * l * 0.5 + 0.5) * 255; d[i + 2] = (l * 0.5 + 0.5) * 255; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  const rgb = (r, g, b, a) => a == null ? `rgb(${r | 0},${g | 0},${b | 0})` : `rgba(${r | 0},${g | 0},${b | 0},${a})`;
  const rmc = (rough, metal) => rgb(0, rough * 255, metal * 255);   // roughness in G, metalness in B
  function jitter(hex, k) {
    const c = new THREE.Color(hex), f = 1 + (rnd() - 0.5) * k;

      if (h(4) < 0.4) B.cbox(M.fac[c.style], c.side * (c.x + 4 + h(5) * 8), y + 2.2, lz - 12, 5, 4.4, 4);
      void xi; void z;
    }
  }
  function waterTank(B, x, y, z) {
    const r = 2.6, legH = 4, tankH = 5.5;
    for (const [dx, dz] of [[-1.6, -1.6], [1.6, -1.6], [-1.6, 1.6], [1.6, 1.6]]) B.cbox(M.iron, x + dx, y + legH / 2, z + dz, 0.3, legH, 0.3);
    B.cbox(M.iron, x, y + legH, z, 4.2, 0.3, 4.2);
    B.geo(M.tank, GEO.cyl, mtx(x, y + legH + tankH / 2, z, 0, 0, 0, r, tankH, r));
    for (let k = 0; k < 4; k++) B.geo(M.iron, GEO.cyl24, mtx(x, y + legH + 0.8 + k * 1.3, z, 0, 0, 0, r + 0.05, 0.12, r + 0.05));
    B.geo(M.tankRoof, GEO.cone, mtx(x, y + legH + tankH + 0.9, z, 0, 0, 0, r + 0.2, 1.8, r + 0.2));
  }
  // A tower crane standing in the street canyon, its jib swinging over the flight path.
  function craneDecor(B, x, z, top, sd) {
    const w = 2.2;
    B.box(M.lattice, x - w / 2, x + w / 2, STREET, top, z - w / 2, z + w / 2);
    B.cbox(M.yellow, x, top + 1.2, z, 3, 2.4, 3);
    B.cbox(M.black, x + sd * 1.8, top + 1.5, z + 1.2, 2, 2.2, 2);
    const jl = 70, cj = 22;
    B.box(M.lattice, ...(sd > 0 ? [x - jl, x] : [x, x + jl]), top + 2.4, top + 4.4, z - 0.9, z + 0.9);
    B.box(M.lattice, ...(sd > 0 ? [x, x + cj] : [x - cj, x]), top + 2.4, top + 3.6, z - 0.9, z + 0.9);
    B.cbox(M.conc, x + sd * (cj - 3), top + 1.2, z, 4, 3, 2.4);
    B.box(M.lattice, x - 0.8, x + 0.8, top + 4.4, top + 11, z - 0.8, z + 0.8);
    B.rod(M.cable, x, top + 11, z, x - sd * jl * 0.8, top + 4.4, z, 0.06);
    B.rod(M.cable, x, top + 11, z, x + sd * cj, top + 3.6, z, 0.06);
    const tx = x - sd * (20 + hash(Math.round(z), 5) * 30);
    B.rod(M.cable, tx, top + 2.4, z, tx, top - 22, z, 0.05);
    B.cbox(M.orange, tx, top - 22.6, z, 0.9, 1.2, 0.6);
    B.glow(G.red, x, top + 11.3, z);
    B.glow(G.red, x - sd * jl, top + 4.8, z);
  }

  function streetChunk(B, s0, len, cur) {
    const s1 = s0 + len, sBase = s0;
    for (const key of ["L", "R", "NL", "NR"]) {
      const c = cur[key];
      let s = s0;
      while (s < s1) {
        if (c.end <= s) nextTower(c);
        const e = Math.min(c.end, s1);
        if (!c.gap) towerSlice(B, c, s, e, sBase, c.row === 0);
        s = e;
      }
    }
    // cranes in the canyon and the odd glass skybridge
    for (let s = Math.ceil(s0 / 120) * 120 + 60; s < s1; s += 120) {
      if (hash(s, 71) < 0.55) {
        const sd = hash(s, 72) < 0.5 ? -1 : 1, c = sd < 0 ? cur.L : cur.R;
        if (c.gap || c.x >= 17) craneDecor(B, sd * (c.gap ? 20 : c.x - 3), -(s - s0), 38 + hash(s, 73) * 30, sd);
      }
    }
    for (let s = Math.ceil(s0 / 96) * 96 + 40; s < s1; s += 96) {
      if (hash(s, 81) < 0.2 && !cur.L.gap && !cur.R.gap && !cur.L.low && !cur.R.low) {
        const z = -(s - s0), y = 9 + hash(s, 82) * 10;
        B.box(M.glassExit, -cur.R.x, cur.R.x, y, y + 3.2, z - 2, z + 2, F.PZ | F.NY);
        for (let xx = -cur.R.x; xx <= cur.R.x; xx += 3) B.box(M.alu, xx - 0.1, xx + 0.1, y, y + 3.2, z + 1.9, z + 2.05, F.PZ);
        B.box(M.alu, -cur.R.x, cur.R.x, y - 0.4, y, z - 2, z + 2, F.PZ | F.NY);
        for (let xx = -cur.R.x + 2; xx < cur.R.x; xx += 5) B.glow(G.warm, xx, y + 2.8, z);
      }
    }
    groundSlice(B, len);
  }
  function groundSlice(B, len) {
    B.box(M.asphalt, -260, 260, STREET - 1, STREET, -len, 0, F.PY);
  }
  function neighbourSlices(B, s0, len, cur) {
    for (const key of ["NL", "NR"]) {
      const c = cur[key];
      let s = s0;
      while (s < s0 + len) {
        if (c.end <= s) nextTower(c);
        const e = Math.min(c.end, s0 + len);
        if (!c.gap) towerSlice(B, c, s, e, s0, false);
        s = e;
      }
    }
    // keep the street-side cursors moving so the canyon carries on where it would be
    for (const key of ["L", "R"]) { const c = cur[key]; while (c.end <= s0 + len) nextTower(c); }
    groundSlice(B, len);
  }

  /* office floor: carpet, a lit grid ceiling, window walls with desks looking out on the city */
  function officeChunk(B, s0, len, cur) {
    B.box(M.carpet, -ROOM, ROOM, FLOOR - 0.3, FLOOR, -len, 0, F.PY);
    B.box(M.ceil, -ROOM, ROOM, CEIL, CEIL + 0.3, -len, 0, F.NY);
    for (const sd of [-1, 1]) {
      const I = INF(sd);
      B.box(M.paint, ...X(sd, ROOM - 0.45, ROOM), FLOOR, FLOOR + 1.1, -len, 0, I | F.PY);
      B.box(M.glassIn, ...X(sd, ROOM, ROOM + 0.02), FLOOR + 1.1, CEIL, -len, 0, I);
      B.box(M.paint, ...X(sd, ROOM - 0.3, ROOM), CEIL - 0.35, CEIL, -len, 0, I | F.NY);
      for (let s = Math.ceil(s0 / 3) * 3; s < s0 + len; s += 3) {
        const z = s0 - s;
        B.box(M.alu, ...X(sd, ROOM - 0.16, ROOM + 0.05), FLOOR + 1.1, CEIL - 0.35, z - 0.07, z + 0.07, I | F.PZ | F.NZ);
        const bz = z - 1.5, h = (n) => hash(s * 2 + (sd > 0 ? 1 : 0), n);
        // roller blinds, some down
        if (h(1) < 0.4) { const yb = CEIL - 0.35 - (0.6 + h(2) * 6); B.box(M.blinds, ...X(sd, ROOM - 0.24, ROOM - 0.2), yb, CEIL - 0.35, bz - 1.42, bz + 1.42, I); }
        // a desk facing the window, a monitor or two, a chair
        if (h(3) < 0.85) {
          const dx = ROOM - 0.5, dw = 1.55;
          B.box(M.desk, ...X(sd, dx - dw, dx), FLOOR + 1.42, FLOOR + 1.5, bz - 1.4, bz + 1.4);
          B.box(M.black, ...X(sd, dx - dw + 0.05, dx), FLOOR, FLOOR + 1.42, bz + 1.3, bz + 1.38, F.PZ | I);
          B.box(M.black, ...X(sd, dx - dw + 0.05, dx), FLOOR, FLOOR + 1.42, bz - 1.38, bz - 1.3, F.PZ | I);
          const nm = h(4) < 0.5 ? 1 : 2;
          for (let k = 0; k < nm; k++) {
            const mz = bz + (nm === 2 ? (k ? 0.62 : -0.62) : 0), mx = sd * (dx - 0.55);
            B.cbox(M.black, mx, FLOOR + 1.7, mz, 0.08, 0.4, 0.12);
            B.box(M.black, ...X(sd, dx - 0.62, dx - 0.52), FLOOR + 1.85, FLOOR + 2.5, mz - 0.58, mz + 0.58);
            const v = Math.floor(h(5 + k) * 4), u0 = (v % 2) * 0.5, v0 = v < 2 ? 0.5 : 0;
            B.rectX(M.screen, sd * (dx - 0.625), mz - 0.54, mz + 0.54, FLOOR + 1.89, FLOOR + 2.46, -sd, [u0, v0, u0 + 0.5, v0 + 0.5]);
          }
          if (h(7) < 0.8) {
            const cx = sd * (ROOM - 2.55), cz = bz + (h(8) - 0.5) * 0.8;
            B.geo(M.black, GEO.disk, mtx(cx, FLOOR + 0.05, cz, 0, 0, 0, 0.5, 0.06, 0.5));
            B.geo(M.black, GEO.cyl, mtx(cx, FLOOR + 0.5, cz, 0, 0, 0, 0.06, 0.9, 0.06));
            B.cbox(M.fabric, cx, FLOOR + 1.0, cz, 0.95, 0.16, 0.95);
            B.cbox(M.fabric, cx - sd * 0.47, FLOOR + 1.6, cz, 0.12, 1.1, 0.9);
          }
          if (h(9) < 0.25) B.geo(M.leaf, GEO.sphere, mtx(sd * (dx - 0.3), FLOOR + 1.75, bz + 1.1, 0, 0, 0, 0.25, 0.3, 0.25));
        }
      }
      // columns every 12 m
      for (let s = Math.ceil((s0 - 12) / 24) * 24 + 12; s < s0 + len; s += 24) {
        if (s < s0) continue;
        const z = s0 - s;
        B.box(M.paint, ...X(sd, ROOM - 1.3, ROOM + 0.2), FLOOR, CEIL, z - 0.65, z + 0.65, I | F.PZ | F.NZ);
        B.box(M.steel, ...X(sd, ROOM - 1.33, ROOM + 0.2), FLOOR, FLOOR + 0.35, z - 0.68, z + 0.68, I | F.PZ | F.NZ | F.PY);
        B.geo(M.pot, GEO.cyl, mtx(sd * (ROOM - 1.75), FLOOR + 0.55, z + 1.4, 0, 0, 0, 0.42, 1.1, 0.42));
        for (let k = 0; k < 5; k++) B.geo(M.leaf, GEO.sphere, mtx(sd * (ROOM - 1.75) + (rnd() - 0.5) * 0.5, FLOOR + 1.6 + k * 0.38, z + 1.4 + (rnd() - 0.5) * 0.5, 0, rnd() * 3, 0, 0.55 - k * 0.06, 0.4, 0.55 - k * 0.06));
      }
    }
    // a low lounge in the middle of some bays: rug, sofa, armchairs, coffee table
    for (let s = Math.ceil(s0 / 24) * 24; s < s0 + len; s += 24) {
      if (hash(s, 41) > 0.5) continue;
      const z = s0 - s, cx = (hash(s, 42) - 0.5) * 8;
      B.box(M.rug, cx - 3.5, cx + 3.5, FLOOR, FLOOR + 0.03, z - 2.6, z + 2.6, F.PY);
      B.cbox(M.sofa, cx, FLOOR + 0.45, z - 1.6, 4.2, 0.9, 1.4);
      B.cbox(M.sofa, cx, FLOOR + 1.0, z - 2.15, 4.2, 1.1, 0.35);
      B.cbox(M.oak, cx, FLOOR + 0.7, z + 0.2, 2.2, 0.08, 1.2);
      for (const ox of [-0.95, 0.95]) B.cbox(M.black, cx + ox, FLOOR + 0.33, z + 0.2, 0.06, 0.66, 1.0);
      for (const ox of [-2.6, 2.6]) { B.cbox(M.fabric, cx + ox, FLOOR + 0.42, z + 1.3, 1.3, 0.84, 1.3); B.cbox(M.fabric, cx + ox, FLOOR + 1.0, z + 1.85, 1.3, 0.8, 0.25); }
    }
    neighbourSlices(B, s0, len, cur);
  }

  /* a sky lobby: marble floor, stone walls, bronze elevator banks, a coffered ceiling, chandeliers */
  function lobbyChunk(B, s0, len, cur) {
    B.box(M.marble, -ROOM, ROOM, FLOOR - 0.3, FLOOR, -len, 0, F.PY);
    B.box(M.lobbyCeil, -ROOM, ROOM, LOBBY_CEIL, LOBBY_CEIL + 0.3, -len, 0, F.NY);
    for (const sd of [-1, 1]) {
      const I = INF(sd);
      B.box(M.stone, ...X(sd, ROOM, ROOM + 0.5), FLOOR, LOBBY_CEIL, -len, 0, I);
      for (const y of [FLOOR + 0.25, FLOOR + 5.8, LOBBY_CEIL - 0.6]) B.box(M.bronze, ...X(sd, ROOM - 0.04, ROOM), y, y + 0.12, -len, 0, I | F.PY | F.NY);
      for (let s = Math.ceil((s0 - 6) / 12) * 12 + 6; s < s0 + len; s += 12) {
        if (s < s0) continue;
        const z = s0 - s;
        B.box(M.bronze, ...X(sd, ROOM - 0.22, ROOM), FLOOR, FLOOR + 5.0, z - 1.95, z + 1.95, I | F.PZ | F.NZ | F.NY);
        B.box(M.bronze, ...X(sd, ROOM - 0.1, ROOM), FLOOR, FLOOR + 4.6, z - 1.55, z + 1.55, I);
        B.box(M.black, ...X(sd, ROOM - 0.125, ROOM - 0.1), FLOOR, FLOOR + 4.6, z - 0.02, z + 0.02, I);

        B.glow(G.amber, sd * (ROOM - 0.3), FLOOR + 2.6, z - 2.3);
        B.glow(G.warm, sd * (ROOM - 0.3), FLOOR + 6.6, z - 6);
      }
      for (let s = Math.ceil((s0 - 12) / 24) * 24 + 12; s < s0 + len; s += 24) {
        if (s < s0) continue;
        const z = s0 - s;
        B.box(M.marbleCol, ...X(sd, ROOM - 1.5, ROOM), FLOOR, LOBBY_CEIL, z - 0.9, z + 0.9, I | F.PZ | F.NZ);
        B.box(M.bronze, ...X(sd, ROOM - 1.58, ROOM), FLOOR, FLOOR + 0.5, z - 0.98, z + 0.98, I | F.PZ | F.NZ | F.PY);
        B.box(M.bronze, ...X(sd, ROOM - 1.62, ROOM), LOBBY_CEIL - 0.7, LOBBY_CEIL - 0.4, z - 1.02, z + 1.02, I | F.PZ | F.NZ | F.NY | F.PY);
      }
    }
    // art deco chandeliers, well above the flight path
    for (let s = Math.ceil(s0 / 24) * 24; s < s0 + len; s += 24) {
      const z = s0 - s;
      B.rod(M.bronze, 0, LOBBY_CEIL, z, 0, 6.6, z, 0.08);
      B.geo(M.lamp, GEO.cyl24, mtx(0, 6.1, z, 0, 0, 0, 1.3, 1.0, 1.3));
      B.geo(M.bronze, GEO.cyl24, mtx(0, 6.62, z, 0, 0, 0, 1.36, 0.1, 1.36));
      B.geo(M.bronze, GEO.cyl24, mtx(0, 5.58, z, 0, 0, 0, 1.36, 0.1, 1.36));
      B.glow(G.warm, 0, 6.1, z);
    }
    neighbourSlices(B, s0, len, cur);
  }

  /* a floor still under construction: bare slabs, steel beams, work lights, open edges */
  function buildChunk(B, s0, len, cur) {
    const E = ROOM + 3;
    B.box(M.concFloor, -E, E, FLOOR - 0.6, FLOOR, -len, 0, F.PY);
    B.box(M.conc, -E, E, FLOOR - 0.6, FLOOR, -len, 0, F.PX | F.NX);
    B.box(M.conc, -E, E, BUILD_CEIL, BUILD_CEIL + 0.6, -len, 0, F.NY | F.PX | F.NX);
    for (let s = Math.ceil(s0 / 8) * 8 + 4; s < s0 + len; s += 8) {
      const z = s0 - s;
      B.box(M.primer, -E, E, BUILD_CEIL - 0.05, BUILD_CEIL, z - 0.2, z + 0.2, F.NY | F.PZ);
      B.box(M.primer, -E, E, BUILD_CEIL - 0.5, BUILD_CEIL - 0.05, z - 0.03, z + 0.03, F.PZ | F.NZ);
      B.box(M.primer, -E, E, BUILD_CEIL - 0.55, BUILD_CEIL - 0.5, z - 0.2, z + 0.2, F.NY | F.PZ | F.NZ);
    }
    for (const sd of [-1, 1]) {
      const I = INF(sd);
      B.box(M.primer, ...X(sd, E - 0.6, E), BUILD_CEIL - 0.6, BUILD_CEIL, -len, 0, I | F.NY);
      for (let s = Math.ceil((s0 - 12) / 24) * 24 + 12; s < s0 + len; s += 24) {
        if (s < s0) continue;
        const z = s0 - s;
        B.box(M.conc, ...X(sd, ROOM + 0.4, ROOM + 1.8), FLOOR, BUILD_CEIL, z - 0.7, z + 0.7, I | F.PZ | F.NZ);
      }
      for (let s = Math.ceil(s0 / 6) * 6 + 3; s < s0 + len; s += 6) {
        const z = s0 - s, x = sd * (ROOM - 1.3);
        B.cbox(M.galv, x, (FLOOR + BUILD_CEIL) / 2, z, 0.14, BUILD_CEIL - FLOOR, 0.14);
        B.cbox(M.galv, x, FLOOR + 0.04, z, 0.5, 0.08, 0.5);
        B.cbox(M.galv, x, BUILD_CEIL - 0.04, z, 0.5, 0.08, 0.5);
      }
      // edge protection: posts, cables and orange netting
      for (let s = Math.ceil(s0 / 4) * 4; s < s0 + len; s += 4) B.cbox(M.yellow, sd * (E - 0.3), FLOOR + 1.2, s0 - s, 0.12, 2.4, 0.12);
      B.box(M.net, ...X(sd, E - 0.32, E - 0.3), FLOOR, FLOOR + 2.4, -len, 0, I);
      for (const y of [FLOOR + 1.0, FLOOR + 2.3]) B.box(M.cable, ...X(sd, E - 0.35, E - 0.3), y, y + 0.05, -len, 0, I | F.PY);
      // string lights on a cable under the slab
      const lx = sd * 6;
      B.box(M.cable, lx - 0.02, lx + 0.02, BUILD_CEIL - 0.62, BUILD_CEIL - 0.58, -len, 0, F.NY | F.PX | F.NX);
      for (let s = Math.ceil(s0 / 4) * 4 + 2; s < s0 + len; s += 4) {
        const z = s0 - s;
        B.rod(M.cable, lx, BUILD_CEIL - 0.6, z, lx, BUILD_CEIL - 0.95, z, 0.03);
        B.geo(M.bulb, GEO.sphere, mtx(lx, BUILD_CEIL - 1.05, z, 0, 0, 0, 0.11, 0.14, 0.11));
        B.glow(G.bulb, lx, BUILD_CEIL - 1.05, z);
      }
    }
    // material on the floor, all well under the flight path
    for (let s = Math.ceil(s0 / 8) * 8; s < s0 + len; s += 8) {
      const h = (n) => hash(s, n), z = s0 - s;
      if (h(1) < 0.55) {
        const x = (h(2) < 0.5 ? -1 : 1) * (3 + h(3) * 7), kind = h(4);
        B.cbox(M.crate, x, FLOOR + 0.12, z, 2.4, 0.24, 2.4);
        if (kind < 0.35) for (let k = 0; k < 8; k++) B.cbox(M.drywall, x, FLOOR + 0.3 + k * 0.1, z, 2.3, 0.09, 2.3);
        else if (kind < 0.7) for (let k = 0; k < 3; k++) for (let i = 0; i < 3; i++) B.cbox(M.cmu, x - 0.8 + i * 0.8, FLOOR + 0.45 + k * 0.42, z, 0.76, 0.4, 2.2);
        else for (let k = 0; k < 7; k++) B.rod(M.primer, x - 1.2, FLOOR + 0.35 + (k % 3) * 0.1, z - 1 + k * 0.3, x + 1.2, FLOOR + 0.35 + (k % 3) * 0.1, z - 1 + k * 0.3, 0.08);
      }
      if (h(5) < 0.4) {
        const x = (h(6) - 0.5) * 16;
        B.geo(M.orange, GEO.cone, mtx(x, FLOOR + 0.7, z - 3, 0, 0, 0, 0.32, 1.4, 0.32));
        B.cbox(M.black, x, FLOOR + 0.04, z - 3, 0.8, 0.08, 0.8);
      }
    }
    neighbourSlices(B, s0, len, cur);
  }

  const BUILDERS = { street: streetChunk, office: officeChunk, lobby: lobbyChunk, build: buildChunk };
  function makeChunk(len) {
    const snap = { s: gen.s, zone: gen.zone, cur: copyCur(gen.cur) };
    const B = new Mesher(gen.s);
    BUILDERS[gen.zone](B, gen.s, len, gen.cur);
    const group = B.build();
    group.position.z = gen.front;
    scene.add(group);
    chunks.push({ group, len, zone: gen.zone, s0: gen.s, snap });
    gen.front -= len;
    gen.s += len;
  }
  function disposeChunk(c) {
    scene.remove(c.group);
    c.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }
  function fillChunks() {
    let n = 0;
    while (gen.front > GEN_Z && n++ < 30) {
      // chunks start on the 24-unit grid so repeating items stay put when a chunk is rebuilt
      const toGrid = CH - (gen.s % CH);
      makeChunk(toGrid > 0.01 ? toGrid : CH);
    }
  }
  // A doorway was just placed at zg: everything beyond it becomes the next zone.
  function switchZone(zg, nz) {
    let k = chunks.findIndex((c) => c.group.position.z - c.len < zg - 0.01);
    if (k < 0) { gen.zone = nz; return; }
    const c = chunks[k], keep = c.group.position.z - zg;
    gen.s = c.snap.s; gen.zone = c.snap.zone; gen.cur = copyCur(c.snap.cur); gen.front = c.group.position.z;
    for (let i = chunks.length - 1; i >= k; i--) disposeChunk(chunks[i]);
    chunks.length = k;
    if (keep > 0.05) makeChunk(keep);
    gen.zone = nz;
    gen.front = zg;
    fillChunks();
  }
  function zoneAt(z) {
    for (const c of chunks) { const n = c.group.position.z; if (z <= n && z > n - c.len) return c.zone; }
    return gen.zone;
  }
  function resetWorld() {
    for (const c of chunks) disposeChunk(c);
    chunks.length = 0;
    gen.s = 0; gen.front = 30; gen.zone = "street"; gen.cur = newCursors();
    fillChunks();
  }

  /* ---------------- obstacles ---------------- */
  // The collision boxes are exactly the ones the game always used; the art is built around them.
  const obstacles = [], pickups = [];

  // a wall with a rectangular hole, as four boxes
  function holeWall(B, mat, X0, X1, Y0, Y1, l, r, b, t, z0, z1, f) {
    B.box(mat, X0, l, Y0, Y1, z0, z1, f);

  // inside a building: a partition with a doorway or pass-through into the next space

  // inside a building: the outer wall, floor-to-ceiling glass with one panel missing

  // in the open: the face of the next tower, with one window open

  // crane mast inside the flight path: real lattice where you can see it, a textured box beyond

      B.box(M.yellow, x0, x1, y - 0.06, y + 0.06, z0, z0 + 0.12);

    B.box(M.lattice, x0, x1, 32, top, z0, z1);

    B.cbox(M.yellow, cx, top + 1.2, 0, w + 1, 2.4, d + 1);
    B.cbox(M.black, cx + sd * 1.6, top + 1.4, 1.4, 2, 2.2, 2);

  // a load on a crane hook: beams, a skip, a crate of glass or a rooftop unit, slung on chains

  // indoor objects that fill exactly the block they stand for
  function indoorBlock(B, zone, x0, x1, y0, y1, z0, z1, kind) {

  // Each obstacle gets its own copies of its materials so it can dissolve in from the haze and

  function addObstacle(group, boxes, extra) {
    const mats = new Map();
    group.traverse((c) => {
      if (!c.material) return;
      if (!mats.has(c.material)) {
        const m = c.material.clone();
        if (c.material.onBeforeCompile !== THREE.Material.prototype.onBeforeCompile) patch(m);
        // smooth alpha fades read better than dithering; depth writes stay on so it still sorts like a solid
        if (!m.transparent && !m.isPointsMaterial) { m.transparent = true; m.depthWrite = true; m.userData.solid = true; }
        m.userData.base = m.opacity;
        mats.set(c.material, m);

      c.material = mats.get(c.material);

    extra = Object.assign({ mats: [...mats.values()] }, extra);

  // 1. a cluster of pillars and blocks
  function spawnBlocks() {
    const group = new THREE.Group(), boxes = [];

  function spawnGate() {

  /* ---------------- the jet ---------------- */

  // afterburner: an outer plume and a hot core, both drawn in a shader with shock diamonds

    shipY = clamp(shipY + velY * dt, -SHIP_LIM.y, SHIP_LIM.y);
    if (Math.abs(shipX) >= SHIP_LIM.x) velX *= 0.5;
    if (Math.abs(shipY) >= SHIP_LIM.y) velY *= 0.5;

    bank = lerp(bank, -velX * 0.045, 1 - Math.pow(0.0004, dt));
    pitch = lerp(pitch, velY * 0.025, 1 - Math.pow(0.001, dt));

    const move = speed * dt;
    distance += move * 0.5;
    score += move * 0.4 * multiplier;

    // the city scrolls past
    for (const c of chunks) c.group.position.z += move;
    gen.front += move;
    while (chunks.length && chunks[0].group.position.z - chunks[0].len > camera.position.z + 6) disposeChunk(chunks.shift());
    fillChunks();

    ship.position.set(shipX, shipY, SHIP_Z);
    ship.rotation.set(pitch, 0, bank);
    const zHere = zoneAt(SHIP_Z);
    shadow.visible = zHere !== "street";
    shadow.position.set(shipX, FLOOR + 0.03, SHIP_Z + 0.3);
    shadow.material.opacity = (0.16 + 0.3 * (1 - (shipY + SHIP_LIM.y) / (SHIP_LIM.y * 2))) * inT;
    const thrust = boosting ? 1 : 0;
    FLAME.uBoost.value = lerp(FLAME.uBoost.value, thrust, 1 - Math.pow(0.001, dt));
    FLAME.uPower.value = 0.75 + FLAME.uBoost.value * 0.5;
    FLAME.uTime.value = t;
    const fl = 0.9 + FLAME.uBoost.value * 2.6 + Math.sin(t * 30) * 0.12;
    plume.scale.set(1, fl, 1); plume.position.z = 1.98 + fl / 2;
    plumeCore.scale.set(1, fl * 0.55, 1); plumeCore.position.z = 1.98 + fl * 0.275;
    exhaustGlow.scale.setScalar(0.75 + FLAME.uBoost.value * 1.6);
    exhaustLight.intensity = 18 + FLAME.uBoost.value * 70 + Math.sin(t * 40) * 4;
    strobe.visible = (t % 1.1) < 0.06;
    updateTrails(move, clamp((Math.abs(bank) - 0.22) * 2.5, 0, 1) * 0.8 + FLAME.uBoost.value * 0.25);

    camera.position.x = lerp(camera.position.x, shipX * 0.55, 1 - Math.pow(0.002, dt));
    camera.position.y = lerp(camera.position.y, CAM_UP + shipY * 0.3, 1 - Math.pow(0.002, dt));
    camera.lookAt(shipX * 0.45, shipY * 0.5, -30);
    const fovT = (W / H < 0.8 ? 78 : 64) + (boosting ? 7 : 0);
    if (Math.abs(camera.fov - fovT) > 0.05) { camera.fov = lerp(camera.fov, fovT, 1 - Math.pow(0.01, dt)); camera.updateProjectionMatrix(); }
    post.comp.uniforms.ca.value = 0.004 + FLAME.uBoost.value * 0.012;

    // dust in the air
    for (let i = 0; i < streakN; i++) {
      const s = streakData[i];
      s.z += move * 1.4;
      if (s.z > 12) { s.z = SPAWN_Z + rand(0, 20); s.x = rand(-LANE.x, LANE.x); s.y = rand(-LANE.y, LANE.y); }
      const len = 0.3 + speed * 0.012 * (boosting ? 2 : 1);
      streakPos.set([s.x, s.y, s.z, s.x, s.y, s.z - len], i * 6);
    }
    streakGeo.attributes.position.needsUpdate = true;
    streakMat.opacity = (boosting ? 0.3 : 0.12) * (0.4 + inT * 0.6);

    // rolling ceiling lights
    for (const l of roll) {
      l.userData.z += move;
      if (l.userData.z > 14) l.userData.z -= 48;
      const z = l.userData.z, zn = zoneAt(z), w = THREE.MathUtils.smoothstep(z, -34, -26) * (1 - THREE.MathUtils.smoothstep(z, 6, 14));
      l.position.set(0, ceilOf(zn) - 0.8, z);
      l.intensity = INSIDE[zn] ? w * 70 : 0;
      if (INSIDE[zn]) l.color.setHex(INSIDE[zn][0]);
    }

    nextSpawn -= move;
    if (nextSpawn <= 0) { spawnNext(); nextSpawn = spawnGap; }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.group.position.z += move;
      const gz = o.group.position.z;
      if (o.kind === "lasers") {
        o.boxes.length = 0;
        for (const b of o.bars) {
          const off = b.base + Math.sin(t * b.sp + b.ph) * b.amp;
          if (b.vertical) { b.bar.position.x = off; o.boxes.push({ x: off, y: 0, hx: 0.22, hy: LANE.y, hz: 0.22, dz: -b.z }); }
          else { b.bar.position.y = off; o.boxes.push({ x: 0, y: off, hx: LANE.x, hy: 0.22, hz: 0.22, dz: -b.z }); }
        }
      }
      // collision
      if (gz > -12 && gz < 10) {
        let hit = false;
        for (const b of o.boxes) {
          const bz = gz + (b.dz || 0);
          if (Math.abs(shipX - b.x) < SHIP_HALF.x + b.hx && Math.abs(shipY - b.y) < SHIP_HALF.y + b.hy && Math.abs(SHIP_Z - bz) < SHIP_HALF.z + b.hz) { hit = true; break; }
        }
        if (hit) { endRun(o.kind === "gate" ? (o.from === "street" ? "Missed the window" : o.to === "street" ? "Hit the glass" : "Missed the doorway") : o.kind === "lasers" ? "Hit a steel beam" : zHere === "street" ? "Hit the crane" : "Crashed into the building"); return; }
      }
      // passed it: near-miss and gate bonuses
      if (!o.passed && gz > SHIP_Z + 1.5) {
        o.passed = true;
        if (o.kind === "gate") {
          gatesCleared++;
          multiplier = clamp(multiplier + 0.2, 1, 6); peakMult = Math.max(peakMult, multiplier);
          score += 60 * multiplier;
          PA.sfx("select", { pitch: 1.3 + Math.min(0.6, gatesCleared * 0.02) });
          PA.sfx("whoosh", { pitch: 0.7, vol: 0.5 });
        } else {
          let close = false;
          for (const b of o.boxes) if (Math.abs(shipX - b.x) < SHIP_HALF.x + b.hx + 1.2 && Math.abs(shipY - b.y) < SHIP_HALF.y + b.hy + 1.0) close = true;
          if (close) { nearMisses++; score += 40 * multiplier; PA.sfx("whoosh", { pitch: 1.3, vol: 0.4 }); }
        }
      }
      // dissolve in from the haze, and out once behind the plane
      const fadeIn = clamp((gz - o.born) / 22, 0, 1);
      const fadeOut = gz > SHIP_Z + 1.5 ? clamp(1 - (gz - SHIP_Z - 1.5) / 4.5, 0, 1) : 1;
      const f = Math.min(fadeIn, fadeOut);
      for (const m of o.mats) { m.opacity = f * m.userData.base; if (m.userData.solid) m.depthWrite = f > 0.6; }
      if (gz > camera.position.z - 1) { disposeGroup(o.group, o.mats); obstacles.splice(i, 1); }
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.group.position.z += move;
      p.spin += dt * 2.4;
      p.ring.rotation.y = p.spin;
      p.ring.rotation.x = Math.sin(p.spin * 0.7) * 0.3;
      const dx = shipX - p.group.position.x, dy = shipY - p.group.position.y, dz = SHIP_Z - p.group.position.z;
      if (dx * dx + dy * dy + dz * dz < 1.6 * 1.6) {
        orbs++;
        multiplier = clamp(multiplier + 0.25, 1, 6); peakMult = Math.max(peakMult, multiplier);
        score += Math.floor(100 * multiplier);
        boost = Math.min(100, boost + 15);
        PA.sfx("coin", { pitch: 0.95 + multiplier * 0.08 });
        scene.remove(p.group);
        pickups.splice(i, 1);
        continue;
      }
      if (p.group.position.z > 20) {
        // a missed orb cools the multiplier a little
        multiplier = Math.max(1, multiplier - 0.1);
        scene.remove(p.group);
        pickups.splice(i, 1);
      }
    }

    PA.music.intensity(clamp(0.15 + sector * 0.14 + (boosting ? 0.1 : 0), 0.15, 0.95));
    engineAudio(true);
    paintHud();
  }

  let lastT = 0, perfLast = 0, perfSum = 0, perfN = 0;
  // If the device cannot hold about 45 fps, drop the render resolution a step at a time.
  function adapt() {
    const now = performance.now(), ft = now - perfLast;
    perfLast = now;
    if (window.__hyperlaneFixedRes || ft > 250 || document.hidden || PA.isPaused()) return;
    perfSum += ft; perfN++;
    if (perfN < 120) return;
    const avg = perfSum / perfN;
    perfSum = perfN = 0;
    if (avg > 22 && resScale > 0.5) { resScale = Math.max(0.5, resScale - 0.15); resize(); }
  }
  const _sv = new THREE.Vector3();
  function render(t) {
    const dt = clamp(t - lastT, 0, 0.05);
    lastT = t;
    adapt();
    if (tod.k < 1) { tod.k = Math.min(1, tod.k + dt / 3); blendTod(); if (tod.k >= 1) envDirty = true; }
    applyLight(dt);
    if (envDirty) { envDirty = false; buildEnvs(tod.cur); }
    SKY.uTime.value = t;
    sky.position.copy(camera.position);
    camera.updateMatrixWorld();
    FU.uSunV.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
    FU.uUpV.value.set(0, 1, 0).transformDirection(camera.matrixWorldInverse);
    updateBoom(dt);
    // rain falls around the camera when outside in the storm
    const rainK = tod.cur.rain * (1 - inT);
    rainMat.opacity = rainK * 0.35;
    if (rainK > 0.01) {
      const mv = speed * dt * (running ? 1 : 0);
      for (let i = 0; i < rainN; i++) {
        const r = rainData[i];
        r.y -= 40 * dt; r.z += mv; r.x += 4 * dt;
        if (r.y < -12 || r.z > 14) { r.y = rand(10, 30); r.z = rand(-90, 10); r.x = rand(-30, 30); }
        rainPos.set([r.x, r.y, r.z, r.x - 0.12, r.y + 1.1, r.z - 0.04 - speed * 0.01], i * 6);
      }
      rainGeo.attributes.position.needsUpdate = true;
    }
    post.comp.uniforms.flash.value = flashV * 0.12;
    void _sv;
    post.render(scene, camera, t);
  }

  window.__hyperlane = () => ({
    score: Math.floor(score),
    distance: Math.floor(distance),
    sector: sector + 1,
    multiplier,
    orbs,
    gates: gatesCleared,
    nearMisses,
    boost: Math.round(boost),
    boosting,
    speed,
    alive: running && PA.state === "play",
    zone: zoneAt(SHIP_Z),
    ship: { x: shipX, y: shipY, bank, pitch },
    obstacles: obstacles.map((o) => ({ kind: o.kind, z: o.group.position.z, boxes: o.boxes.map((b) => ({ ...b })) })),
    pickups: pickups.length,
    draw: { ...drawInfo }
  });
  window.__hyperlaneWarp = (m) => { distance = m; };

  // the city is there behind the start screen too
  setSector(0, false);
  resetWorld();
  PA.loop(update, render);
})();
</script>
