<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Hyperlane 3D — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#03050c;color:#f4f1ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;z-index:1}
#game canvas{display:block;width:100%;height:100%}
#hl-hud{opacity:0;transition:opacity .45s ease}
#hl-hud.on{opacity:1}
#s-mult b{color:#ffd27a}
#hl-boost-wrap{pointer-events:none;flex:1;min-width:120px;max-width:220px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:.15rem .55rem .25rem;border-radius:12px;background:rgba(8,12,28,.55);border:1px solid rgba(142,233,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hl-boost-wrap small{font:500 .58rem/1.1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8ee9ff;opacity:.85}
#hl-boost{height:8px;border-radius:999px;background:rgba(4,8,18,.85);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(244,241,255,.08)}
#hl-boost i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#7ee7f5,#8ee9ff 40%,#c4a6ff);box-shadow:0 0 14px rgba(142,233,255,.55);transition:width .08s linear}
#hl-boost.boosting i{box-shadow:0 0 22px rgba(255,210,122,.75);background:linear-gradient(90deg,#ffd27a,#8ee9ff,#c4a6ff)}
#hl-hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:28;text-align:center;font-size:.82rem;color:#a8a3c0;pointer-events:none;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .35s;padding:0 1rem}
#hl-hint.on{opacity:.85}
@media (pointer:coarse),(max-width:520px){#hl-hint.on{display:none}}
</style></head><body>
<div id="game" aria-label="Hyperlane 3D playfield"></div>
<div class="pa-hud" id="hl-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat" id="s-mult"><small>Multiplier</small><b>×1.0</b></div>
  <div class="pa-stat" id="s-dist"><small>Distance</small><b>0 m</b></div>
  <div id="hl-boost-wrap"><small>Boost</small><div id="hl-boost" aria-hidden="true"><i id="hl-boost-fill"></i></div></div>
</div>
<p id="hl-hint">← → / A D steer · ↑ ↓ climb · Shift / Space boost · drag to fly</p>
<script>
window.paConfig = {
  slug: "hyperlane-3d",
  title: "Hyperlane 3D",
  native: true,
  music: "space",
  unit: "points",
  controls: [
    ["← → / A D", "Steer & bank"],
    ["↑ ↓ / W S", "Climb / dive"],
    ["Shift / Space", "Boost (uses meter)"],
    ["Drag", "Steer on touch"]
  ]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
  const TAU = Math.PI * 2;
  const PA = window.PA;
  const { clamp, rand, lerp } = PA;

  const COL = {
    sky: 0x05070f,
    fog: 0x080c18,
    lane: 0x8ee9ff,
    laneAlt: 0xc4a6ff,
    ship: 0x7ee7f5,
    shipCore: 0x8ee9ff,
    wing: 0xc4a6ff,
    obs: 0xff5e8a,
    obsCore: 0xff7eb6,
    orb: 0xffd27a,
    orbRing: 0x8ee9ff
  };

  const LANES = { x: 9, y: 5.5 };
  const SHIP_Z = 0;
  const CAM_BACK = 14;
  const CAM_UP = 3.2;

  let W = innerWidth, H = innerHeight;
  let running = false, overSent = false, simT = 0;
  let score = 0, distance = 0, multiplier = 1, orbs = 0, nearMisses = 0;
  let boost = 100, boosting = false, speed = 0, baseSpeed = 52;
  let spawnCd = 0, lanePulse = 0;
  let shipX = 0, shipY = 0, velX = 0, velY = 0, bank = 0, pitch = 0;
  let ptrActive = false, ptrNX = 0, ptrNY = 0;

  const mount = document.getElementById("game");
  const hud = document.getElementById("hl-hud");
  const hint = document.getElementById("hl-hint");
  const boostEl = document.getElementById("hl-boost");
  const boostFill = document.getElementById("hl-boost-fill");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(COL.sky);
  scene.fog = new THREE.FogExp2(COL.fog, 0.028);

  const camera = new THREE.PerspectiveCamera(62, W / H, 0.1, 420);
  camera.position.set(0, CAM_UP, CAM_BACK);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  mount.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0x8ee9ff, 0x180818, 0.55);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 0.85);
  key.position.set(4, 12, 8);
  scene.add(key);

  const ship = new THREE.Group();
  const hull = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 2.4, 8),
    new THREE.MeshStandardMaterial({ color: COL.ship, emissive: COL.shipCore, emissiveIntensity: 0.35, metalness: 0.65, roughness: 0.25, flatShading: true })
  );
  hull.rotation.x = Math.PI / 2;
  ship.add(hull);
  const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0x0a1220, emissive: COL.shipCore, emissiveIntensity: 0.8, metalness: 0.2, roughness: 0.1 })
  );
  cockpit.position.set(0, 0.35, -0.15);
  ship.add(cockpit);
  const wingGeo = new THREE.BoxGeometry(2.6, 0.08, 0.85);
  const wingMat = new THREE.MeshStandardMaterial({ color: COL.wing, emissive: COL.laneAlt, emissiveIntensity: 0.25, metalness: 0.5, roughness: 0.35, transparent: true, opacity: 0.92 });
  const wingL = new THREE.Mesh(wingGeo, wingMat);
  wingL.position.set(-0.95, 0, 0.35);
  wingL.rotation.z = 0.08;
  const wingR = wingL.clone();
  wingR.position.x = 0.95;
  wingR.rotation.z = -0.08;
  ship.add(wingL, wingR);
  const thruster = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.35, 0.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x1a2244, emissive: 0xff9ec4, emissiveIntensity: 0.15, metalness: 0.4, roughness: 0.5 })
  );
  thruster.rotation.x = Math.PI / 2;
  thruster.position.z = 1.05;
  ship.add(thruster);
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 1.1, 8),
    new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  flame.rotation.x = -Math.PI / 2;
  flame.position.z = 1.55;
  flame.visible = false;
  ship.add(flame);
  ship.position.set(0, 0, SHIP_Z);
  scene.add(ship);

  const shipLight = new THREE.PointLight(0x8ee9ff, 1.6, 28);
  shipLight.position.set(0, 0.4, -1.2);
  ship.add(shipLight);

  const tunnel = new THREE.Group();
  scene.add(tunnel);

  const gridMat = new THREE.LineBasicMaterial({ color: COL.lane, transparent: true, opacity: 0.35 });
  const gridAlt = new THREE.LineBasicMaterial({ color: COL.laneAlt, transparent: true, opacity: 0.22 });
  const floorLines = new THREE.Group();
  const ceilLines = floorLines.clone();
  for (let i = -10; i <= 10; i++) {
    const zSpan = 240;
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(i * 2.2, 0, -zSpan),
      new THREE.Vector3(i * 2.2, 0, zSpan)
    ]);
    const line = new THREE.Line(geo, i % 3 === 0 ? gridAlt : gridMat);
    line.position.y = -3.2;
    floorLines.add(line);
    const geo2 = geo.clone();
    const line2 = new THREE.Line(geo2, line.material);
    line2.position.y = 3.2;
    ceilLines.add(line2);
  }
  for (let z = -200; z <= 200; z += 8) {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-24, -3.2, z),
      new THREE.Vector3(24, -3.2, z)
    ]);
    const line = new THREE.Line(geo, z % 16 === 0 ? gridAlt : gridMat);
    floorLines.add(line);
    const geo2 = geo.clone();
    const line2 = new THREE.Line(geo2, line.material);
    line2.position.y = 6.4;
    ceilLines.add(line2);
  }
  tunnel.add(floorLines, ceilLines);

  const sideWallMat = new THREE.MeshStandardMaterial({
    color: 0x0c1024, emissive: COL.laneAlt, emissiveIntensity: 0.08, metalness: 0.3, roughness: 0.85, transparent: true, opacity: 0.35, side: THREE.BackSide
  });
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 520, 24, 1, true), sideWallMat);
  tube.rotation.x = Math.PI / 2;
  scene.add(tube);

  const starsGeo = new THREE.BufferGeometry();
  const starN = 900;
  const starPos = new Float32Array(starN * 3);
  for (let i = 0; i < starN; i++) {
    starPos[i * 3] = rand(-40, 40);
    starPos[i * 3 + 1] = rand(-18, 18);
    starPos[i * 3 + 2] = rand(-180, -20);
  }
  starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xc4a6ff, size: 0.12, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(stars);

  const obstacles = [];
  const pickups = [];
  const obsGeo = new THREE.BoxGeometry(1, 1, 1);
  const obsMat = new THREE.MeshStandardMaterial({ color: COL.obs, emissive: COL.obsCore, emissiveIntensity: 0.55, metalness: 0.4, roughness: 0.35, flatShading: true });
  const orbGeo = new THREE.OctahedronGeometry(0.55, 0);
  const orbMat = new THREE.MeshStandardMaterial({ color: COL.orb, emissive: COL.orb, emissiveIntensity: 0.85, metalness: 0.25, roughness: 0.2 });
  const orbRingGeo = new THREE.TorusGeometry(0.72, 0.06, 8, 24);

  function resize() {
    W = innerWidth;
    H = innerHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    renderer.setSize(W, H);
  }
  addEventListener("resize", resize);

  function paintHud() {
    PA.stat("s-score", Math.floor(score).toLocaleString());
    PA.stat("s-mult", "×" + multiplier.toFixed(1));
    PA.stat("s-dist", Math.floor(distance) + " m");
    boostFill.style.width = clamp(boost, 0, 100) + "%";
    boostEl.classList.toggle("boosting", boosting && boost > 2);
  }

  function clearWorld() {
    obstacles.forEach((o) => {
      scene.remove(o.mesh);
      if (o.mesh.material) o.mesh.material.dispose();
    });
    pickups.forEach((p) => {
      scene.remove(p.group);
      p.group.traverse((c) => {
        if (c.geometry) c.geometry.dispose();
      });
    });
    obstacles.length = 0;
    pickups.length = 0;
  }

  function reset() {
    clearWorld();
    running = true;
    overSent = false;
    simT = 0;
    score = 0;
    distance = 0;
    multiplier = 1;
    orbs = 0;
    nearMisses = 0;
    boost = 100;
    boosting = false;
    speed = baseSpeed;
    spawnCd = 0.4;
    shipX = 0;
    shipY = 0;
    velX = 0;
    velY = 0;
    bank = 0;
    pitch = 0;
    ptrActive = false;
    ptrNX = 0;
    ptrNY = 0;
    flame.visible = false;
    ship.position.set(0, 0, SHIP_Z);
    ship.rotation.set(0, 0, 0);
    tunnel.position.set(0, 0, 0);
    stars.position.set(0, 0, 0);
    hud.classList.add("on");
    hint.classList.add("on");
    PA.music.intensity(0.12);
    paintHud();
  }

  PA.onStart(reset);

  PA.touchControls({
    left: [
      { label: "◀", key: "ArrowLeft", code: "ArrowLeft", aria: "Steer left" },
      { label: "▶", key: "ArrowRight", code: "ArrowRight", aria: "Steer right" }
    ],
    right: [{ label: "⚡", key: " ", code: "Space", aria: "Boost", wide: true }],
    center: [
      { label: "↑", key: "ArrowUp", code: "ArrowUp", aria: "Climb" },
      { label: "↓", key: "ArrowDown", code: "ArrowDown", aria: "Dive" }
    ]
  });

  function wantBoost() {
    return PA.down("ShiftLeft", "ShiftRight", "Space", " ") && boost > 4;
  }

  function steerInput() {
    let ax = 0, ay = 0;
    if (PA.down("ArrowLeft", "KeyA", "a")) ax -= 1;
    if (PA.down("ArrowRight", "KeyD", "d")) ax += 1;
    if (PA.down("ArrowUp", "KeyW", "w")) ay += 1;
    if (PA.down("ArrowDown", "KeyS", "s")) ay -= 1;
    if (ptrActive) {
      ax = clamp(ptrNX, -1, 1);
      ay = clamp(ptrNY, -1, 1);
    }
    return { ax, ay };
  }

  mount.addEventListener("pointerdown", (e) => {
    if (PA.state !== "play" || !running) return;
    ptrActive = true;
    ptrNX = clamp((e.clientX / W - 0.5) * 2.2, -1, 1);
    ptrNY = clamp((0.5 - e.clientY / H) * 2.2, -1, 1);
  });
  mount.addEventListener("pointermove", (e) => {
    if (!ptrActive) return;
    ptrNX = clamp((e.clientX / W - 0.5) * 2.2, -1, 1);
    ptrNY = clamp((0.5 - e.clientY / H) * 2.2, -1, 1);
  });
  addEventListener("pointerup", () => { ptrActive = false; });
  addEventListener("pointercancel", () => { ptrActive = false; });

  function spawnObstacle() {
    const w = rand(1.2, 3.4);
    const h = rand(1.2, 3.8);
    const d = rand(2.5, 5.5);
    const mesh = new THREE.Mesh(obsGeo, obsMat.clone());
    mesh.scale.set(w, h, d);
    mesh.position.set(rand(-LANES.x, LANES.x), rand(-LANES.y, LANES.y), -rand(120, 200));
    scene.add(mesh);
    obstacles.push({ mesh, w, h, d, near: false });
  }

  function spawnOrb() {
    const group = new THREE.Group();
    const core = new THREE.Mesh(orbGeo, orbMat.clone());
    const ring = new THREE.Mesh(orbRingGeo, new THREE.MeshStandardMaterial({ color: COL.orbRing, emissive: COL.orbRing, emissiveIntensity: 0.65, metalness: 0.3, roughness: 0.25, transparent: true, opacity: 0.85 }));
    ring.rotation.x = Math.PI / 2;
    group.add(core, ring);
    group.position.set(rand(-LANES.x * 0.85, LANES.x * 0.85), rand(-LANES.y * 0.85, LANES.y * 0.85), -rand(110, 190));
    scene.add(group);
    pickups.push({ group, spin: rand(0, TAU) });
  }

  function scrollWorld(dz) {
    tunnel.position.z += dz;
    stars.position.z += dz * 0.35;
    if (tunnel.position.z > 8) tunnel.position.z -= 8;
    if (stars.position.z > 40) stars.position.z -= 40;
  }

  function hitBox(o) {
    const s = o.mesh.scale;
    return { x: o.mesh.position.x, y: o.mesh.position.y, z: o.mesh.position.z, hx: s.x * 0.48, hy: s.y * 0.48, hz: s.z * 0.48 };
  }

  function collideShip(box) {
    const sx = shipX, sy = shipY, sz = SHIP_Z;
    const shx = 0.75, shy = 0.55, shz = 1.1;
    return Math.abs(sx - box.x) < shx + box.hx && Math.abs(sy - box.y) < shy + box.hy && Math.abs(sz - box.z) < shz + box.hz;
  }

  function endRun(reason) {
    if (overSent || !running) return;
    running = false;
    overSent = true;
    hint.classList.remove("on");
    PA.shake(10, 0.45);
    PA.hitstop(110);
    PA.flash("rgba(255,94,138,.38)", 320);
    PA.sfx("explode", { pitch: 0.82, vol: 0.7 });
    PA.gameOver(Math.floor(score), {
      title: reason || "Hull breach",
      kicker: "Hyperlane offline",
      stats: [
        ["Distance", Math.floor(distance) + " m"],
        ["Orbs", orbs],
        ["Peak multiplier", "×" + multiplier.toFixed(1)],
        ["Near misses", nearMisses]
      ]
    });
  }

  function update(dt, t) {
    if (PA.state !== "play" || !running) return;

    simT += dt;
    if (simT > 4) hint.classList.remove("on");

    boosting = wantBoost();
    if (boosting) {
      boost -= 38 * dt;
      if (boost <= 0) { boost = 0; boosting = false; }
    } else {
      boost = Math.min(100, boost + 16 * dt);
    }

    const difficulty = clamp(1 + distance / 900, 1, 2.4);
    baseSpeed = lerp(52, 92, clamp(distance / 2400, 0, 1));
    speed = baseSpeed * (boosting ? 1.55 : 1) * difficulty;

    const { ax, ay } = steerInput();
    const steer = 13.5 * difficulty;
    velX = lerp(velX, ax * steer, 1 - Math.pow(0.001, dt));
    velY = lerp(velY, ay * steer * 0.72, 1 - Math.pow(0.001, dt));
    shipX = clamp(shipX + velX * dt, -LANES.x, LANES.x);
    shipY = clamp(shipY + velY * dt, -LANES.y, LANES.y);
    if (Math.abs(ax) < 0.05) velX *= Math.pow(0.04, dt);

    bank = lerp(bank, -ax * 0.62 - velX * 0.04, 1 - Math.pow(0.0004, dt));
    pitch = lerp(pitch, ay * 0.18 + (boosting ? -0.08 : 0), 1 - Math.pow(0.001, dt));

    const move = speed * dt;
    distance += move * 0.22;
    score += move * 0.35 * multiplier;
    scrollWorld(move);

    ship.position.set(shipX, shipY, SHIP_Z);
    ship.rotation.set(pitch, 0, bank);
    flame.visible = boosting;
    flame.scale.set(1, 1 + Math.sin(t * 28) * 0.15, 1);
    flame.material.opacity = 0.55 + (boost / 100) * 0.35;

    camera.position.x = lerp(camera.position.x, shipX * 0.35, 1 - Math.pow(0.0008, dt));
    camera.position.y = lerp(camera.position.y, CAM_UP + shipY * 0.25, 1 - Math.pow(0.0008, dt));
    camera.lookAt(shipX * 0.4, shipY * 0.35, -30);

    spawnCd -= dt;
    if (spawnCd <= 0) {
      const orbChance = clamp(0.22 + multiplier * 0.04, 0.18, 0.42);
      if (Math.random() < orbChance) spawnOrb();
      else spawnObstacle();
      spawnCd = rand(0.55, 1.05) / difficulty;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.mesh.position.z += move;
      o.mesh.rotation.y += dt * 0.8;
      o.mesh.rotation.x += dt * 0.35;
      const box = hitBox(o);
      if (!o.near && o.mesh.position.z > -6 && o.mesh.position.z < 4) {
        const dx = Math.abs(shipX - box.x), dy = Math.abs(shipY - box.y);
        if (dx < box.hx + 2.2 && dy < box.hy + 2.2) {
          o.near = true;
          nearMisses++;
          score += 25 * multiplier;
          PA.sfx("whoosh", { pitch: 1.2, vol: 0.35 });
        }
      }
      if (collideShip(box)) {
        endRun("Obstacle impact");
        return;
      }
      if (o.mesh.position.z > 24) {
        scene.remove(o.mesh);
        obstacles.splice(i, 1);
      }
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.group.position.z += move;
      p.spin += dt * 2.4;
      p.group.rotation.y = p.spin;
      p.group.rotation.x = Math.sin(p.spin * 0.7) * 0.35;
      const dx = shipX - p.group.position.x;
      const dy = shipY - p.group.position.y;
      const dz = SHIP_Z - p.group.position.z;
      if (dx * dx + dy * dy + dz * dz < 1.35 * 1.35) {
        orbs++;
        multiplier = clamp(multiplier + 0.35, 1, 5);
        const bonus = Math.floor(120 * multiplier);
        score += bonus;
        boost = Math.min(100, boost + 18);
        PA.sfx("coin", { pitch: 0.95 + multiplier * 0.08 });
        PA.tone({ freq: 520 + multiplier * 40, to: 920 + multiplier * 60, type: "sine", dur: 0.07, vol: 0.05 });
        scene.remove(p.group);
        pickups.splice(i, 1);
        continue;
      }
      if (p.group.position.z > 24) {
        scene.remove(p.group);
        pickups.splice(i, 1);
      }
    }

    lanePulse += dt * (0.8 + speed * 0.01);
    gridMat.opacity = 0.28 + Math.sin(lanePulse) * 0.08;
    PA.music.intensity(clamp(0.12 + distance / 3200, 0.12, 0.92));
    paintHud();
  }

  function render() {
    renderer.render(scene, camera);
  }

  window.__hyperlane = () => ({
    score: Math.floor(score),
    distance: Math.floor(distance),
    multiplier,
    orbs,
    nearMisses,
    boost: Math.round(boost),
    boosting,
    speed,
    alive: running && PA.state === "play",
    ship: { x: shipX, y: shipY, bank, pitch },
    obstacles: obstacles.length,
    pickups: pickups.length,
    vel: { x: velX, y: velY }
  });

  PA.loop(update, render);
})();
</script>
