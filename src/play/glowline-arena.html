<script>
window.paConfig = {
  slug: "glowline-arena", title: "Glowline Arena", native: true, music: "synthwave", unit: "length", pauseOnBlur: false,
  arena: "wss://arena.promptarcade.games/room?v=2",
  controls: [["Mouse", "Steer toward the cursor"], ["Hold click / Space", "Boost (costs length)"], ["Double-tap boost / E", "Evolution ability"], ["← → / A D", "Steer with keys"], ["Touch", "Point to steer · BOOST button"]]
};

<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script type="module">
import { Sim, TICK_HZ, lengthFor, radiusFor, SKINS_V2, PK, T, MODIFIERS, EVO_ACTIVE } from "/games/play/arena/sim.js";
import { decodeFrame2, viewFor, makeViewer } from "/games/play/arena/proto.js";
import {
  SKIN, SKIN_NAMES, SKIN_XP, TRAILS, BURSTS, FRAMES, BOOSTS, FRAME_COL, EVO_PAL, EVO_GLYPH, EVO_NAMES, EVO_TEXT,
  PK_NAMES, PK_TEXT, PK_COL, strokeBody, drawHead, pelletSprites, drawPortal, GUIDES, GUIDE_ORDER, EVO_GUIDE, PK_GUIDE, playGuide
} from "/games/play/arena/art.js";

const TAU = Math.PI * 2;
const FRAME_MS = 1000 / TICK_HZ;
const cfg = window.paConfig;
const qs = new URLSearchParams(location.search);
const FOODC = ["#5ef2ff", "#ff5ca8", "#ffd84d", "#5dff9e", "#c77dff", "#ff8a5c", "#7aa8ff", "#ffffff"];

/* ---------------- prefs (per viewer, never needed for fairness) ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const prefs = {
  tips: store.get("ga_tips", true),
  rm: store.get("ga_rm", matchMedia("(prefers-reduced-motion: reduce)").matches),
  cos: store.get("ga_cos", [0, 0, 0, 0]), // trail, burst, frame, boost sound
  seen: store.get("ga_seen", {})
};
let xp = store.get("ga_xp", 0) | 0;

/* ---------------- DOM ---------------- */
const $ = (id) => document.getElementById(id);
const view = PA.canvas($("c"));
const ctx = view.ctx;
const mini = $("ga-mini").getContext("2d");
const fx = new PA.Particles(600);
const texts = new PA.Texts();
const psprites = pelletSprites();
const shake = (m, d) => { if (!prefs.rm) PA.shake(m, d); };
const flash = (c, ms) => { if (!prefs.rm) PA.flash(c, ms); };

/* glow sprites for food, one per colour */
const sprites = FOODC.map((c) => {
  const s = document.createElement("canvas"); s.width = s.height = 64;
  const g = s.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.18, c); gr.addColorStop(0.45, c + "66"); gr.addColorStop(1, c + "00");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return s;
});
/* hex grid tile */
const hexTile = (() => {
  const r = 34, w = Math.sqrt(3) * r, h = 3 * r;
  const s = document.createElement("canvas"); s.width = Math.round(w); s.height = Math.round(h);
  const g = s.getContext("2d");
  g.strokeStyle = "rgba(120,150,255,.09)"; g.lineWidth = 1.5;
  const hex = (cx, cy) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.closePath(); g.stroke(); };
  hex(0, 0); hex(w, 0); hex(w / 2, h / 2); hex(0, h); hex(w, h);
  return s;
})();
/* The floor is one opaque tile (floor colour + hex lines) pre-scaled to the current zoom, so each frame
 * is a single unscaled pattern fill. Re-scaling a pattern every frame was most of the frame time on
 * big screens (full screen at 1080p and up). */
const FLOOR = [[0, [11, 16, 48]], [0.7, [8, 10, 31]], [1, [20, 8, 32]]];
function floorColor(d) {
  for (let i = 1; i < FLOOR.length; i++) {
    const [p1, c1] = FLOOR[i], [p0, c0] = FLOOR[i - 1];
    if (d <= p1) { const k = (d - p0) / (p1 - p0); return c0.map((v, j) => Math.round(v + (c1[j] - v) * k)); }
  }
  return FLOOR[FLOOR.length - 1][1];
}
/* The tile spans several hex cells (about 180 px), so its whole-pixel size tracks the zoom within
 * half a percent. Its world origin is placed from the camera at the tile's own scale, so the grid
 * stays locked to the camera (no slow slide while zooming, no jump when the tile is rebuilt).
 * Sub-pixel camera motion is baked into a copy of the tile each frame, and the full-screen fill
 * keeps a whole-pixel offset, which is the fast path. Rounding the offset alone made the grid
 * step 0, 1, 1, 0 px a frame on high-refresh screens while everything else moved smoothly. */
let floorTile = null;
const floorBake = document.createElement("canvas"), floorBakeG = floorBake.getContext("2d");
function floorMaster(z, d) {
  const shade = Math.round(Math.min(1, d) * 24);
  const nx = Math.max(1, Math.ceil(180 / (hexTile.width * z))), ny = Math.max(1, Math.ceil(180 / (hexTile.height * z)));
  const tw = Math.max(8, Math.round(hexTile.width * z * nx)), th = Math.max(8, Math.round(hexTile.height * z * ny));
  if (floorTile && floorTile.shade === shade && floorTile.tw === tw && floorTile.th === th) return floorTile;
  const c = floorTile && floorTile.c.width === tw && floorTile.c.height === th ? floorTile.c : document.createElement("canvas");
  c.width = tw; c.height = th;
  const g = c.getContext("2d"), col = floorColor(shade / 24);
  g.fillStyle = `rgb(${col})`; g.fillRect(0, 0, tw, th);
  const cw = tw / nx, ch = th / ny;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) g.drawImage(hexTile, i * cw, j * ch, cw, ch);
  floorTile = { c, shade, tw, th, zx: cw / hexTile.width, zy: ch / hexTile.height, fx: -1, fy: -1, pat: null };
  return floorTile;
}
function floorPattern(ctx, ft, ox, oy) {
  const ix = Math.floor(ox), iy = Math.floor(oy);
  const fx = Math.round((ox - ix) * 16) / 16, fy = Math.round((oy - iy) * 16) / 16;
  if (!ft.pat || fx !== ft.fx || fy !== ft.fy) {
    const b = floorBake, g = floorBakeG, tw = ft.tw, th = ft.th;
    if (b.width !== tw || b.height !== th) { b.width = tw; b.height = th; }
    g.drawImage(ft.c, fx, fy); g.drawImage(ft.c, fx - tw, fy); g.drawImage(ft.c, fx, fy - th); g.drawImage(ft.c, fx - tw, fy - th);
    ft.pat = ctx.createPattern(b, "repeat"); ft.fx = fx; ft.fy = fy;
  }
  if (ft.pat.setTransform) ft.pat.setTransform(new DOMMatrix([1, 0, 0, 1, ix, iy]));
  return ft.pat;
}
/* Full-screen gradients (vignette, Blackout fog) are drawn once per size at quarter resolution. */
const overlays = {};
function overlay(name, w, h, paint) {
  const key = w + "x" + h;
  let o = overlays[name];
  if (!o || o.key !== key) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(w / 4)); c.height = Math.max(1, Math.ceil(h / 4));
    const g = c.getContext("2d"); g.scale(c.width / w, c.height / h); paint(g, w, h);
    o = overlays[name] = { key, c };
  }
  return o.c;
}

/* ---------------- world state (fed by frames) ----------------
 * meta: every snake in the room (names, skins, evolutions) · snakes: only the bodies near you
 * map: every snake's rough position for the minimap · st: your own power-up timers (ticks)
 */
const W = {
  snakes: new Map(), meta: new Map(), food: new Map(), portals: new Map(), decoys: new Map(), flares: [],
  map: [], worldR: 2600, me: 0, lb: [], tick: 0, mod: null, st: null
};
let mode = "connecting", online = 0, net = null;
let queue = [];
let myStats = null; // {peak, kills, born, bestRank}
let skin = 0;
skin = (store.get("ga_skin", (Math.random() * 12) | 0) | 0) % SKINS_V2;
if (SKIN_XP[skin] > xp) skin = 0;

const tnow = () => W.tick + alpha; // fractional server tick for smooth timers

/* ---------------- playout clock ----------------
 * The world updates at 20 Hz. Frames used to be applied whenever a 50 ms slot opened, measured
 * against their (jittery) arrival, so on many display frames the snakes froze for a frame and then
 * jumped two frames' worth (at 60 Hz the head moved 0, 6, 3 px per frame instead of an even 3).
 * Now the world plays back on its own clock that advances by the display's frame time, so the
 * steps are even at 60, 120, 144 or 240 Hz. Online, the clock runs a little behind the newest
 * frame and is nudged gently toward the server's pace; the delay adapts to the measured jitter
 * (about 1.2 to 1.5 ticks on a normal connection, more on a bumpy one). Offline, the clock steps
 * the sim itself (see advanceClock).
 */
const clock = { r: 0, on: false, offs: [], minOff: 0, spread: 0, delay: 1.3, starve: 0, starved: false };
function enqueue(ev) {
  const at = performance.now(), off = at / FRAME_MS - ev.tick, o = clock.offs;
  if (o.length && Math.abs(off - clock.minOff) > 6) o.length = 0; // a pause or a long stall: start over
  o.push(off); if (o.length > 60) o.shift();
  let mn = Infinity; for (const v of o) if (v < mn) mn = v;

      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(head.x - w / 2, ty - fs, w, fs * 1.35, fs * 0.6) : ctx.rect(head.x - w / 2, ty - fs, w, fs * 1.35); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = s.evo ? EVO_PAL[s.evo][2] : "rgba(230,236,255,.75)";
    ctx.fillText(label, head.x, ty);
  }
}
function drawVenom(s, now) {
  if (!s.venom.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < s.venom.length; i += 3) {
    const age = (now - s.venom[i + 2]) / (T.VENOM_LIFE * FRAME_MS);
    if (age > 1 || !onScreen(s.venom[i], s.venom[i + 1], 30)) continue;
    ctx.globalAlpha = (1 - age) * 0.45;
    ctx.fillStyle = "#9dff3c";
    ctx.beginPath(); ctx.arc(s.venom[i], s.venom[i + 1], 11 + age * 4, 0, TAU); ctx.fill();
    ctx.globalAlpha = (1 - age) * 0.8; ctx.fillStyle = "#6a1fd1";
    ctx.beginPath(); ctx.arc(s.venom[i], s.venom[i + 1], 3.5, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

let dwell = 0, dwellStart = 0, humT = 0;
function drawPortals(t, now) {
  const me = W.snakes.get(W.me);
  let nearest = 1e9, inside = null;
  for (const [id, p] of W.portals) {
    if (me) { const d = Math.hypot(p.x - me.x, p.y - me.y); if (d < nearest) nearest = d; if (d < T.PORTAL_R) inside = p; }
    if (!onScreen(p.x, p.y, 120)) continue;
    const left = (p.exp - tnow()) / TICK_HZ;
    let a = p.born ? Math.min(1, (now - p.born) / 500) : 1;
    if (p.gone) a = Math.max(0, 1 - (now - p.gone) / 400);
    if (left < 3) a *= 0.5 + Math.sin(t * 14) * 0.3;
    if (p.uses === 1) a *= 0.75 + Math.sin(t * 9) * 0.25;
    drawPortal(ctx, p.x, p.y, T.PORTAL_R, t, { uses: p.uses, alpha: a, still: prefs.rm });
    void id;
  }
  // my dwell: the ring tightens around my head (mirrors the server's 0.35 s rule)
  if (me && inside && !me.boost && !(W.st && W.tick < W.st[6]) && PA.state === "play") {
    if (!dwellStart) dwellStart = now;
    dwell = Math.min(1, (now - dwellStart) / (T.DWELL * FRAME_MS));
    const h = lerpHead(me), r = radiusFor(me.m);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(h.x, h.y, r * 1.6 + (1 - dwell) * 50, -Math.PI / 2, -Math.PI / 2 + dwell * TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  } else { dwell = 0; dwellStart = 0; }
  // the hum gets louder as you approach and rises while you charge
  if (me && nearest < 450 && now - humT > 520) {
    humT = now;
    PA.tone({ freq: 110 + dwell * 220, to: 118 + dwell * 240, type: "sine", dur: .5, vol: 0.035 * (1 - nearest / 450) + dwell * 0.03 });
  }
  // arrival flares
  W.flares = W.flares.filter((fl) => fl.until > now);
  for (const fl of W.flares) {
    const k = (now - fl.t0) / (fl.until - fl.t0);
    if (onScreen(fl.x, fl.y, 100)) {
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "#5ef2ff"; ctx.lineWidth = 4; ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(fl.x, fl.y, 20 + k * 90, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = (1 - k) * 0.5;
      ctx.beginPath(); ctx.arc(fl.x, fl.y, 26 * (1 - k) + 6, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    }
  }
}
function drawDecoys(t, now) {
  for (const d of W.decoys.values()) {
    if (!onScreen(d.pts[0], d.pts[1], 400) && !onScreen(d.pts[d.pts.length - 2], d.pts[d.pts.length - 1], 400)) continue;
    const left = (d.until - now) / 1000;
    const path = []; for (let i = d.pts.length - 2; i >= 0; i -= 2) path.push(d.pts[i], d.pts[i + 1]);
    strokeBody(ctx, path, EVO_PAL[4], d.r, { dashed: true, t, alpha: left < 1.2 ? 0.5 + Math.sin(t * 16) * 0.3 : 1 });
  }
}
function drawArrivalArrows(now) {
  // a small arrow at the screen edge for an arrival flare just out of sight
  for (const fl of W.flares) {
    if (onScreen(fl.x, fl.y, 0) || !onScreen(fl.x, fl.y, 900)) continue;
    const p = worldToScreen(fl), cx = view.w / 2, cy = view.h / 2;
    const a = Math.atan2(p.y - cy, p.x - cx);
    const ex = cx + Math.cos(a) * (view.w / 2 - 30), ey = cy + Math.sin(a) * (view.h / 2 - 30);
    const x = Math.max(24, Math.min(view.w - 24, ex)), y = Math.max(24, Math.min(view.h - 24, ey));
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.fillStyle = "#5ef2ff"; ctx.globalAlpha = 0.6 + Math.sin(now / 60) * 0.3;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* the display's own frame timestamps (even steps), taken before the game loop runs each frame */
let frameTs = 0, frameDt = 0;
requestAnimationFrame(function stamp(ts) { frameDt = frameTs ? Math.max(0, Math.min(0.25, (ts - frameTs) / 1000)) : 0; frameTs = ts; requestAnimationFrame(stamp); });
let lenShown = -1;
function render(t) {
  const now = performance.now();
  advanceClock(now, frameDt);
  for (const s of W.snakes.values()) headOf(s);
  const dt = Math.min(0.05, frameDt);
  if (document.visibilityState === "visible" && !qs.has("q")) watchFps(dt);
  updateInput(dt);
  updateCamera(dt);
  fx.update(dt); texts.update(dt);

  const w = view.w, h = view.h, k = view.dpr * resApplied;
  const sh = PA.shakeOffset();
  // floor + hex grid in device pixels (translate-only pattern: the fast path)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const zDev = cam.z * k, camD = Math.hypot(cam.x, cam.y);
  const ft = floorMaster(zDev, camD / W.worldR);
  const fp = floorPattern(ctx, ft, (w / 2 + sh.x) * k - cam.x * ft.zx, (h / 2 + sh.y) * k - cam.y * ft.zy);
  ctx.fillStyle = fp; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.save();
  ctx.translate(w / 2 + sh.x, h / 2 + sh.y);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  // outside the arena and the border, only when the edge is on screen
  const halfDiag = Math.hypot(w, h) / 2 / cam.z;
  if (camD + halfDiag > W.worldR - 80) {
    const vx = cam.x - halfDiag, vy = cam.y - halfDiag;
    ctx.beginPath(); ctx.rect(vx, vy, halfDiag * 2, halfDiag * 2); ctx.arc(0, 0, W.worldR, 0, TAU);
    ctx.fillStyle = "#04050c"; ctx.fill("evenodd");
    const pulse = 0.75 + Math.sin(t * 2) * 0.15;
    ctx.strokeStyle = "#ff3d7f";
    ctx.beginPath(); ctx.arc(0, 0, W.worldR, 0, TAU);
    if (q.glow) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.07 * pulse; ctx.lineWidth = 70; ctx.stroke();
      ctx.globalAlpha = 0.14 * pulse; ctx.lineWidth = 36; ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalAlpha = pulse; ctx.lineWidth = 14; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  drawPortals(t, now);

  // food (power pellets are stamped from their own sprites, slightly bigger, gently spinning)
  ctx.globalCompositeOperation = "lighter";
  for (const [id, f] of W.food) {
    let x = f.x, y = f.y, kk = 1;
    if (f.eat) {
      const e = W.snakes.get(f.by), qq = (now - f.eat) / 160;
      if (!e || qq >= 1) { W.food.delete(id); continue; }
      const hh = lerpHead(e); x += (hh.x - x) * qq; y += (hh.y - y) * qq; kk = 1 - qq;
    }
    if (!onScreen(x, y, 40)) continue;
    const born = f.born ? Math.min(1, (now - f.born) / 400) : 1;
    if (f.k) {
      const s = (f.k === PK.EVO ? 34 + Math.sin(t * 4) * 4 : f.k === PK.BOUNTY ? 30 : 22) * kk * born;
      ctx.save(); ctx.translate(x, y); if (!prefs.rm && f.k !== PK.EVO) ctx.rotate(Math.sin(t * 2 + id) * 0.3);
      ctx.drawImage(psprites[f.k], -s, -s, s * 2, s * 2); ctx.restore();
      continue;
    }
    const pulse = 1 + Math.sin(t * 3 + id) * 0.15;
    const s = (8 + Math.min(12, f.v) * 2.4) * pulse * kk * born * (f.v >= 12 ? 1.6 : 1);
    ctx.drawImage(sprites[f.c & 7], x - s, y - s, s * 2, s * 2);
  }
  ctx.globalCompositeOperation = "source-over";

  drawDecoys(t, now);
  // snakes: everyone else first, you on top; Viper venom under bodies
  const list = [...W.snakes.values()].sort((a, b) => a.m - b.m);
  for (const s of list) if (s.evo === 1) drawVenom(s, now);
  for (const s of list) if (s.id !== W.me) drawSnake(s, t, false, now);
  const me = W.snakes.get(W.me);
  if (me) drawSnake(me, t, true, now);
  fx.draw(ctx); texts.draw(ctx);
  ctx.restore();

  // Blackout: fog beyond a soft circle (a Firefly sees through it)
  if (W.mod === "blackout" && !(me && me.evo === 7)) {
    ctx.drawImage(overlay("fog", w, h, (g, w, h) => {
      const fg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.2, w / 2, h / 2, Math.min(w, h) * 0.7);
      fg.addColorStop(0, "rgba(2,3,8,0)"); fg.addColorStop(1, "rgba(2,3,8,.93)");
      g.fillStyle = fg; g.fillRect(0, 0, w, h);
    }), 0, 0, w, h);
  }
  // vignette
  ctx.drawImage(overlay("vignette", w, h, (g, w, h) => {
    const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
    g.fillStyle = vg; g.fillRect(0, 0, w, h);
  }), 0, 0, w, h);
  drawArrivalArrows(now);

  if (me) {
    const len = Math.round(me.m);
    if (len !== lenShown) { lenShown = len; $("ga-len").textContent = len; }
    PA.music && PA.music.intensity && PA.music.intensity(Math.min(1, me.m / 600));
  }
  drawMini(now);
  drawHud(now, me);
  scanForTips(now);
}

/* ---------------- HUD: power-up row + ability pip ---------------- */
let hudT = 0, powKey = "";
function drawHud(now, me) {
  if (now - hudT < 100) return; hudT = now;
  const st = W.st, t = tnow();
  const row = [];
  if (me && st) {
    if (st[0] > t) row.push(["»", PK_COL[1], (st[0] - t) / T.SURGE, "Surge"]);
    if (st[1] > t) row.push(["⬡", PK_COL[2], (st[1] - t) / T.WARD, "Ward"]);
    if (st[2] > t) row.push(["◉", PK_COL[3], (st[2] - t) / T.LENS, "Lens"]);
    if (st[3]) row.push(["⚷", PK_COL[4], 1, "Key"]);
    if (st[5] > t) row.push(["☠", "#9dff3c", (st[5] - t) / T.SLOW, "Poisoned"]);
  }
  const key = row.map((r) => r[0] + (r[2] * 20 | 0)).join("");
  if (key !== powKey) {
    powKey = key;
    $("ga-pow").innerHTML = row.map((r) => `<span style="--c:${r[1]};--k:${Math.max(0, Math.min(1, r[2])).toFixed(3)}" title="${r[3]}"><i>${r[0]}</i></span>`).join("");
  }
  const ab = $("ga-ab");
  const evo = me ? me.evo : 0;
  ab.classList.toggle("on", !!evo && PA.state === "play");
  if (evo) {
    const c = $("ga-ab-c").getContext("2d"), pal = EVO_PAL[evo];
    c.clearRect(0, 0, 116, 116);
    c.fillStyle = "rgba(6,9,22,.8)"; c.beginPath(); c.arc(58, 58, 54, 0, TAU); c.fill();
    let ready = 1;
    if (EVO_ACTIVE[evo] && st) {
      const total = evo === 3 ? T.EEL_CD : evo === 4 ? T.SPLIT_CD : T.COMET_CD;
      ready = Math.max(0, Math.min(1, 1 - (st[4] - t) / total));
    }
    c.strokeStyle = pal[0]; c.lineWidth = 8; c.globalAlpha = ready >= 1 ? 1 : 0.6;
    c.beginPath(); c.arc(58, 58, 48, -Math.PI / 2, -Math.PI / 2 + ready * TAU); c.stroke();
    c.globalAlpha = 1;
    c.fillStyle = ready >= 1 ? pal[0] : "#8b93b8"; c.font = "800 40px Manrope, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(EVO_GLYPH[evo], 58, 56);
    ab.title = EVO_NAMES[evo] + (EVO_ACTIVE[evo] ? " · double-tap boost" : "");
  }
}

let miniT = 0;
function drawMini(now) {
  if (now - miniT < 120) return; miniT = now;
  const c = mini, R = 130, k = (R - 6) / W.worldR;
  c.clearRect(0, 0, 260, 260);
  c.save(); c.translate(130, 130);
  c.strokeStyle = "rgba(255,61,127,.6)"; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, R - 4, 0, TAU); c.stroke();
  // portals and the Evolution Pellet
  c.lineWidth = 2;
  for (const p of W.portals.values()) { c.strokeStyle = "#9b7bff"; c.beginPath(); c.arc(p.x * k, p.y * k, 5, 0, TAU); c.stroke(); }
  for (const f of W.food.values()) if (f.k === PK.EVO) { c.fillStyle = "#ffffff"; c.save(); c.translate(f.x * k, f.y * k); c.rotate(Math.PI / 4); c.fillRect(-4, -4, 8, 8); c.restore(); }
  const blink = Math.sin(now / 160) > 0;
  const drawn = new Set();
  const dot = (id, x, y, m) => {
    const meta = W.meta.get(id); if (!meta) return;
    const me = id === W.me;
    if (meta.evo === 7 && !me && !blink) return; // Fireflies blink on everyone's minimap
    c.fillStyle = me ? "#ffe08a" : meta.evo ? EVO_PAL[meta.evo][0] : SKIN[meta.skin][0];
    c.globalAlpha = me ? 1 : meta.evo === 7 ? 1 : 0.6;
    const sz = me ? 7 : (meta.evo === 7 ? 4 : 0) + 2 + Math.min(6, Math.sqrt(m) / 5);
    c.beginPath(); c.arc(x * k, y * k, sz, 0, TAU); c.fill();
  };
  for (const s of W.snakes.values()) { drawn.add(s.id); dot(s.id, s.x, s.y, s.m); }
  for (const e of W.map) if (!drawn.has(e[0])) dot(e[0], e[1], e[2], e[3]);
  c.globalAlpha = 0.9; c.strokeStyle = "rgba(255,255,255,.4)"; c.lineWidth = 1.5;
  const hw = view.w / 2 / cam.z * k, hh = view.h / 2 / cam.z * k;
  c.strokeRect(cam.x * k - hw, cam.y * k - hh, hw * 2, hh * 2);
  c.restore();
}

PA.loop(null, render);
window.__ga = { W, q, clock, get floor() { return floorTile && { tw: floorTile.tw, th: floorTile.th }; }, get net() { return net; }, get queue() { return queue.length; }, get sim() { return net && net.sim; }, tip, get xp() { return xp; } };
setInterval(paintBoard, 1000);
showMod();
</script>
