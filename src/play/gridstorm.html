  s.scale.setScalar(scale);

/* ---------------- particles + shards ---------------- */
const PMAX = 3000;

pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("size", new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));

  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { scale: { value: 600 } },

ptsMesh.frustumCulled = false;
scene.add(ptsMesh);
const parts = [];
const C3 = (hex, k) => { const c = new THREE.Color(hex); return [c.r * k, c.g * k, c.b * k]; };
function burst(x, z, o) {
  o = o || {};

    const a = o.angle != null ? o.angle + rand(-1, 1) * (o.spread || 0.6) : Math.random() * TAU;

function updateParts(dt) {

  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];

    if (p.life <= 0) continue;

const SMAX = 420;

scene.add(shardMesh);
const shards = [];
function shatter(x, z, color, n) {
  const c = new THREE.Color(color);

    if (shards.length >= SMAX) shards.shift();

    s.life -= dt;
    if (s.life <= 0) continue;
    s.vy -= 20 * dt;

    if (s.y < 0.08) { s.y = 0.08; s.vy *= -0.35; s.vx *= 0.6; s.vz *= 0.6; s.wx *= 0.6; s.wy *= 0.6; }

// ribbon trails (ball paths, beams)
const TV = 9000;

/* ================= storm floor =================

const HS = 26, HW = Math.sqrt(3) * HS, HR = HS * 1.5;           // hex radius, column step, row step

scene.background = new THREE.Color(0x04050f);

class Inst {
  constructor(geo, mat, cap) {
    this.m = new THREE.InstancedMesh(geo, mat, cap);
    this.m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.m.setColorAt(0, WHITE);
    this.m.count = 0; this.m.frustumCulled = false; this.n = 0; this.cap = cap;
    scene.add(this.m);
  }
  add(x, y, z, rx, ry, rz, sx, sy, sz, col) {
    if (this.n >= this.cap) return;
    e4.set(rx, ry, rz, "YXZ"); q4.setFromEuler(e4);
    m4.compose(v4.set(x, y, z), q4, s4.set(sx, sy, sz));
    this.m.setMatrixAt(this.n, m4);
    this.m.setColorAt(this.n, col || WHITE);
    this.n++;
  }
  flush() {
    this.m.count = this.n; this.n = 0;
    this.m.instanceMatrix.needsUpdate = true;
    if (this.m.instanceColor) this.m.instanceColor.needsUpdate = true;
  }
}

  spawnT = 1.2; t = 0; score = 0; mult = 1; multXp = 0; lives = 3; bombs = 3; nextLife = 75000; wave = 0; alive = true; fireCd = 0; overT = 0; spawnBudget = 0; kills = 0;

function paint() {

/* ================= enemies ================= */
/* the storm's own cast:
   drift      jelly sparks that wander on the breeze
   dart       needles that stop, take aim (you see the line) and lunge
   shell      shellbacks: a shield faces you, so flank them or use a shockwave
   seeder     pods that circle at range and sow mines
   mine       sown by seeders; fizzle out after a while, but make great chain fuel
   eel        zigzag current that only moves in straight runs and right-angle turns
   cloud      thunderheads: call lightning onto the spot you're heading for */
const TYPES = {
  drift: { r: 14, hp: 1, pts: 25, speed: 62 },
  dart: { r: 14, hp: 1, pts: 50, speed: 560 },
  shell: { r: 17, hp: 2, pts: 100, speed: 95 },
  seeder: { r: 16, hp: 2, pts: 100, speed: 150 },
  mine: { r: 7, hp: 1, pts: 10, speed: 0 },
  eel: { r: 12, hp: 1, pts: 150, speed: 210 },
  cloud: { r: 30, hp: 14, pts: 200, speed: 28 },
  cell: { r: 66, hp: 90, pts: 5000, speed: 34 }

const CARD = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
function spawn(type, x, y) {
  const T = TYPES[type];
  if (x == null) {
    // spawn away from the player, never on top of them
    for (let i = 0; i < 12; i++) { x = rand(40, AW - 40); y = rand(40, AH - 40); if (Math.hypot(x - P.x, y - P.y) > 300) break; }
  }
  const e = { type, x, y, vx: 0, vy: 0, r: T.r, hp: T.hp, a: rand(0, TAU), birth: 0.7, seed: Math.random() };
  if (type === "drift") { e.dir = rand(0, TAU); }
  if (type === "dart") { e.mode = "aim"; e.timer = rand(0.6, 1.2); e.dashA = 0; }
  if (type === "shell") { e.face = Math.atan2(P.y - y, P.x - x); }
  if (type === "seeder") { e.drop = rand(1.2, 2.4); e.orb = Math.atan2(y - P.y, x - P.x); }
  if (type === "mine") { e.life = 9; }
  if (type === "eel") { e.tail = []; for (let i = 0; i < 18; i++) e.tail.push([x, y]); e.dir = CARD[(Math.random() * 4) | 0]; e.turnT = rand(0.5, 1); }

  if (type === "cell") { e.charge = 3; e.pulse = 0; e.brood = 5; e.max = T.hp; e.hitT = 0; }
  enemies.push(e);

}
function spawnCorners(type, n) {
  const corners = [[60, 60], [AW - 60, 60], [60, AH - 60], [AW - 60, AH - 60]];
  const far = corners.sort((a, b) => Math.hypot(b[0] - P.x, b[1] - P.y) - Math.hypot(a[0] - P.x, a[1] - P.y)).slice(0, 2);

}
function director(dt) {
  spawnT -= dt;
  if (spawnT > 0) return;
  wave++;
  const lvl = t / 30;
  spawnT = Math.max(0.8, 2.5 - lvl * 0.3);
  const r = Math.random();
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const pool = ["drift", "dart"];
  if (t > 20) pool.push("shell");
  if (t > 35) pool.push("seeder");
  if (t > 55) pool.push("eel");
  const n = Math.min(20, 4 + Math.floor(lvl * 2.4));
  if (r < 0.18 && t > 25) spawnCorners(pick(pool), n + 4);
  else for (let i = 0; i < n; i++) spawn(pick(pool));
  if (t > 45 && Math.random() < 0.18 && clouds.length < 2) clouds.push(spawn("cloud"));
  if (boss) spawnT *= 1.5;
  else if (t >= nextBoss) {
    // a supercell rolls in: far from you, slow, and it takes a lot of chained shockwaves to bring down
    let x = AW / 2, y = AH / 2, far = -1;
    for (const [cx, cy] of [[220, 220], [AW - 220, 220], [220, AH - 220], [AW - 220, AH - 220]]) { const d = Math.hypot(cx - P.x, cy - P.y); if (d > far) { far = d; x = cx; y = cy; } }
    boss = spawn("cell", x, y); boss.birth = 1.6;
    nextBoss = t + 110;
    texts.add(P.x, P.y - 60, "SUPERCELL INBOUND", { color: COL.cell, size: 26, life: 2.2, vy: -20 });
    PA.sfx("boom", { pitch: .5 }); PA.shake(8, .8);
  }
}

/* shockwaves: every shot kill rings out along the grid, and the ring's front
   detonates whatever it crosses, which rings out again, so tight packs chain */
const WAVE_SPEED = 520, WAVE_R = 82, WAVE_GROW = 14, WAVE_MAX = 150, CHAIN_CAP = 8;
function killEnemy(e, byBomb, from) {
  if (e.dead) return;
  e.dead = true;
  kills++;
  const c = COL[e.type];
  const big = e.type === "cloud" || e.type === "cell", huge = e.type === "cell";
  const depth = from ? from.depth + 1 : 0, root = from ? from.root : { n: 0 };
  if (!byBomb) {
    root.n++;
    if (root.n > bestChain) bestChain = root.n;
    if (from && (root.n === 3 || root.n % 5 === 0)) texts.add(e.x, e.y - 22, "CHAIN " + root.n, { color: "#fff", size: 12 + Math.min(10, root.n), life: .7 });
    waves.push({ x: e.x, y: e.y, r: 0, max: huge ? 460 : Math.min(WAVE_MAX, WAVE_R + depth * WAVE_GROW), depth, root, c, hit: new Set([e]) });
  }
  fx.burst(e.x, e.y, { n: huge ? 260 : big ? 120 : 34, color: c, speed: huge ? 900 : big ? 600 : 360, life: huge ? 1.4 : .9, size: 2.6, shape: "spark", drag: 2.6 });
  zap(e.x, e.y, big ? 1800 : 520, huge ? 600 : big ? 260 : 120);
  shatter(WX(e.x), WZ(e.y), c, huge ? 70 : big ? 22 : e.type === "mine" ? 2 : 6);
  if (!byBomb) {
    const pts = TYPES[e.type].pts * mult * (huge ? 1 : Math.min(CHAIN_CAP, depth + 1));
    score += pts;
    if (pts >= 500) texts.add(e.x, e.y, pts.toLocaleString(), { color: c, size: 14, life: .6 });
    const ng = huge ? 30 : big ? 8 : e.type === "mine" ? 0 : 1 + (Math.random() < .3);
    for (let i = 0; i < ng; i++) gems.push({ x: e.x, y: e.y, vx: rand(-90, 90) * (huge ? 3 : 1), vy: rand(-90, 90) * (huge ? 3 : 1), life: 7 });
    if (huge) { cellsDowned++; texts.add(e.x, e.y - 40, "SUPERCELL DOWN  +" + pts.toLocaleString(), { color: "#ffffff", size: 26, life: 2, vy: -24 }); }
  }

  if (score >= nextLife) { nextLife += 75000; lives++; bombs++; texts.add(P.x, P.y - 40, "+1 SHIP +1 SURGE", { color: "#fff", size: 18, life: 1.6 }); PA.sfx("levelup"); }

}
function bomb() {

  for (const e of enemies) {
    if (e.type === "cell") { e.hp -= 25; e.hitT = .3; if (e.hp <= 0) killEnemy(e); continue; }
    killEnemy(e, true);
  }
  strikes = [];
  for (let i = 0; i < 6; i++) zap(P.x, P.y, 2400, 900);
  PA.sfx("boom"); PA.shake(16, .8); PA.flash("#ffffff", 500);
  P.inv = Math.max(P.inv, 1.2);

}
function hitPlayer() {
  if (P.inv > 0 || P.dead > 0 || dashT > 0) return;
  lives--; mult = 1; multXp = 0;
  P.dead = 2;
  fx.burst(P.x, P.y, { n: 200, colors: ["#fff", "#5ef2ff", "#ffe68a"], speed: 700, life: 1.4, size: 3, shape: "spark" });
  for (let i = 0; i < 4; i++) zap(P.x, P.y, 2600, 600);
  PA.sfx("boom"); PA.shake(20, 1); PA.flash("#ff4d6b", 500);
  // clear the board so respawns are fair
  waves = [];
  for (const e of enemies) { if (e.type === "cell") continue; e.dead = true; fx.burst(e.x, e.y, { n: 8, color: COL[e.type], speed: 200, life: .6, shape: "spark" }); }
  clouds = []; strikes = []; ocT = 0; dashT = 0;

/* ================= input ================= */
const s1 = { el: $("gs-s1"), id: null, ox: 0, oy: 0, dx: 0, dy: 0 }, s2 = { el: $("gs-s2"), id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; }
  for (const s of [s1, s2]) if (s.id === e.pointerId) {
    let dx = e.clientX - s.ox, dy = e.clientY - s.oy; const d = Math.hypot(dx, dy), m = 50;
    if (d > m) { dx = dx / d * m; dy = dy / d * m; }
    s.dx = dx / m; s.dy = dy / m; s.el.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  }
});
addEventListener("pointerdown", (e) => {
  if (e.target.closest && e.target.closest("button,#pa-gate,.pa-layer,.pa-tb")) return;
  if (e.pointerType === "mouse") { if (e.button === 2) bomb(); else mouse.down = true; return; }
  const s = e.clientX < view.w / 2 ? s1 : s2;
  if (s.id != null) return;
  s.id = e.pointerId; s.ox = e.clientX; s.oy = e.clientY; s.dx = s.dy = 0;
  s.el.style.display = "block"; s.el.style.left = e.clientX + "px"; s.el.style.top = e.clientY + "px";
});
const up = (e) => {
  if (e.pointerType === "mouse") { mouse.down = false; return; }
  for (const s of [s1, s2]) if (s.id === e.pointerId) { s.id = null; s.dx = s.dy = 0; s.el.style.display = "none"; s.el.firstElementChild.style.transform = ""; }
};
addEventListener("pointerup", up); addEventListener("pointercancel", up);
addEventListener("contextmenu", (e) => e.preventDefault());
$("gs-bomb").addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); bomb(); });
$("gs-dash").addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); dash(); });
PA.onKey((e) => {
  if (e.code === "Space") { e.preventDefault(); bomb(); }
  if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyE") dash();
  if (e.code === "KeyF") { alwaysFire = !alwaysFire; PA.toast(alwaysFire ? "Always-fire on" : "Always-fire off", 1400); }
});

/* ================= dash + overcharge ================= */
function dash() {
  if (!alive || !P || P.dead > 0 || dashCd > 0 || PA.state !== "play") return;
  const sp = Math.hypot(P.vx, P.vy);
  dashDir = sp > 40 ? Math.atan2(P.vy, P.vx) : P.aim != null ? P.aim : P.a;
  dashT = DASH_T; dashCd = DASH_CD;
  PA.sfx("whoosh", { pitch: 1.3 }); PA.shake(3, .15);
}
// the charge of the cell under a point
function cellAt(px, py) {
  const y = clamp(Math.round((py + HR / 2) / HR), 0, HY - 1);
  const x = clamp(Math.round((px + HW / 2 - (y & 1 ? HW / 2 : 0)) / HW), 0, HX - 1);
  return hexC[y * HX + x];
}

/* ================= update ================= */
function update(dt) {
  if (PA.state !== "play" || !P) { updateGrid(dt); return; }
  t += dt;
  updateGrid(dt);
  bombFlash = Math.max(0, bombFlash - dt * 2);
  if (!alive) { overT -= dt; fx.update(dt); if (overT <= 0 && !P.sent) { P.sent = true; finish(); } return; }
  if (P.dead > 0) {
    P.dead -= dt;

  } else {

    const wasd = PA.down("KeyW", "KeyA", "KeyS", "KeyD");
    let mx = wasd ? (PA.down("KeyD") ? 1 : 0) - (PA.down("KeyA") ? 1 : 0) : (PA.down("ArrowRight") ? 1 : 0) - (PA.down("ArrowLeft") ? 1 : 0);
    let my = wasd ? (PA.down("KeyS") ? 1 : 0) - (PA.down("KeyW") ? 1 : 0) : (PA.down("ArrowDown") ? 1 : 0) - (PA.down("ArrowUp") ? 1 : 0);
    if (s1.id != null) { mx = s1.dx; my = s1.dy; }
    const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
    const SP = 420;
    dashCd = Math.max(0, dashCd - dt);
    if (dashT > 0) {
      // a dash ignores the sticks for a moment, and pours charge into the cells it crosses
      dashT -= dt;
      P.vx = Math.cos(dashDir) * DASH_SP; P.vy = Math.sin(dashDir) * DASH_SP;
      zap(P.x, P.y, 700, 70);
      if (Math.random() < .9) fx.burst(P.x, P.y, { n: 3, colors: ["#ffe68a", "#ffffff", "#9fe8ff"], speed: 120, life: .4, size: 2.4 });
      if (dashT <= 0) { P.vx *= .35; P.vy *= .35; }
    } else { P.vx += (mx * SP - P.vx) * Math.min(1, dt * 12); P.vy += (my * SP - P.vy) * Math.min(1, dt * 12); }

    else ocT = Math.max(0, ocT - dt);

    if (ml > 0.1) P.a = Math.atan2(my, mx);

    // aim + fire
    let aim = null, firing = false;
    if (s2.id != null && Math.hypot(s2.dx, s2.dy) > 0.25) { aim = Math.atan2(s2.dy, s2.dx); firing = true; }

    const ax = (PA.down("ArrowRight") ? 1 : 0) - (PA.down("ArrowLeft") ? 1 : 0), ay = (PA.down("ArrowDown") ? 1 : 0) - (PA.down("ArrowUp") ? 1 : 0);
    if ((ax || ay) && wasd) { aim = Math.atan2(ay, ax); firing = true; }

    fireCd -= dt;
    if (firing && aim != null && fireCd <= 0) {
      const oc = ocT > 0;
      fireCd = oc ? 0.065 : 0.085;
      const streams = score > 150000 ? 4 : score > 40000 ? 3 : 2;
      const spread = streams >= 3 ? 0.09 : 0.05;
      for (let i = 0; i < streams; i++) {
        const a = aim + (i - (streams - 1) / 2) * spread;
        const off = (i - (streams - 1) / 2) * 6;
        bullets.push({ x: P.x + Math.cos(aim + 1.57) * off, y: P.y + Math.sin(aim + 1.57) * off, vx: Math.cos(a) * 1050 + P.vx * .3, vy: Math.sin(a) * 1050 + P.vy * .3, life: 1.1, pierce: oc ? 2 : 0, oc, hits: null });
      }

        if (e.timer <= 0 && chase) { e.mode = "dash"; e.timer = 0.42; e.vx = Math.cos(e.dashA) * T.speed; e.vy = Math.sin(e.dashA) * T.speed; PA.sfx("laser", { pitch: .7, vol: .12 }); }
      } else {
        const k = Math.pow(0.4, dt); e.vx *= k; e.vy *= k;
        if (e.timer <= 0) { e.mode = "aim"; e.timer = rand(0.7, 1.2); }

        const horiz = (Math.abs(dx) > Math.abs(dy)) !== (Math.random() < 0.25);

        for (const k of [0, -1, 1]) strikes.push({ x: clamp(fx0 + Math.cos(side) * k * 120, 20, AW - 20), y: clamp(fy0 + Math.sin(side) * k * 120, 20, AH - 20), t: 1.1 + Math.abs(k) * .15, flash: 0, from: e });

    oc.visible = ocT > 0; oc.scale.setScalar(1 + Math.sin(tt * 10) * .06); oc.material.opacity = Math.min(1, ocT / OC_T * 1.5);
    shipShadow.position.set(X, fy, Z);
    shipL.position.set(X, 1.6 + fy, Z); shipL.intensity = P.dead > 0 ? 0 : 10 + (ocT > 0 ? 8 : 0);
    if (shown && (dashT > 0 || Math.hypot(P.vx, P.vy) > 60)) shipTrail.push([X, ship.position.y - .1, Z, tt]);
    while (shipTrail.length && tt - shipTrail[0][3] > (dashT > 0 ? .35 : .22)) shipTrail.shift();
    if (shipTrail.length > 1) ribbon(shipTrail.flatMap((p) => [p[0], p[1], p[2]]), dashT > 0 ? [2.6, 2.2, 1.2] : [.5, 1.3, 1.8], dashT > 0 ? .45 : .18);

    /* motes, bullets */
    for (const g of gems) I.gem.add(WX(g.x), .7 + Math.sin(tt * 4 + g.x) * .12 + floorY(g.x, g.y) * .6, WZ(g.y), 0, tt * 3, 0, .2, .32, .2, hc(0x7dffb0, 2.8 * Math.min(1, g.life)));
    for (const b of bullets) {
      const a = Math.atan2(b.vy, b.vx);
      I.bullet.add(WX(b.x), .85, WZ(b.y), 0, -a, 0, b.oc ? 1.6 : 1.2, b.oc ? .12 : .08, b.oc ? .12 : .08, b.oc ? hc(0x9fdcff, 3.2) : hc(0xffc94d, 2.4));
    }
    /* shockwaves */
    for (const wv of waves) {
      const k = wv.life == null ? 1 - (wv.r / wv.max) * .5 : Math.max(0, wv.life / .25) * .5;
      const R = wv.r / S, x = WX(wv.x), z = WZ(wv.y), n = Math.max(24, Math.min(90, (R * 5) | 0));
      const pts = ringPts(x, z, R, .4, n, 0, TAU);
      ribbon(pts, C3v(wv.c, 2.4 * k), .09, false);
      ribbon(ringPts(x, z, R, .3, n, 0, TAU), C3v(wv.c, .35 * k), .55, false);
    }
    /* strikes */
    for (const k of strikes) {
      if (k.t <= 0) continue;
      const q = 1 - k.t / 1.05, x = WX(k.x), z = WZ(k.y), R = 46 / S, y = floorY(k.x, k.y) + .05;
      const col = C3v(0xfff0aa, .5 + q * 1.8);
      for (let d = 0; d < 16; d++) { const a0 = d * TAU / 16 + tt * 1.2; ribbon(ringPts(x, z, R, y, 3, a0, a0 + TAU / 32), col, .07, false); }
      I.disc.add(x, y - .01, z, 0, 0, 0, R * Math.max(.05, q), 1, R * Math.max(.05, q), tmpC.setRGB(q * .5, q * .45, q * .25));
    }
    /* enemies */
    for (const e of enemies) if (!e.dead) drawEnemy(e, tt);
  } else {
    ship.visible = false; shipShadow.visible = false; shipL.intensity = 0;
  }
  /* bolts */
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.life -= dt;
    if (b.life <= 0) { bolts.splice(i, 1); continue; }
    const a = b.life / b.max, f = a * (.7 + Math.random() * .3);
    ribbon(b.pts, [3.4 * f, 3.6 * f, 4.4 * f], .12, false);
    ribbon(b.pts, [.4 * f, .5 * f, 1.2 * f], .7, false);
    for (const br of b.branches) ribbon(br, [2 * f, 2.2 * f, 3 * f], .06);
  }
  for (const k in I) I[k].flush();
  tGeo.setDrawRange(0, tv);
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true;
  post.comp.uniforms.hurt.value = P && P.dead > 1.4 ? (P.dead - 1.4) * 1.2 : 0;
  post.comp.uniforms.chroma.value = .1 + (dashT > 0 ? 1.2 : 0) + bombFlash * 2;
  post.render(scene, camera, tt);

  /* overlay */
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!playing) return;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const t of texts.list) {
    const s = toScreen(t.x, t.y, 1.4), k = t.life / t.max, pop = k > .85 ? 1 + (k - .85) * 3 : 1;
    ctx.globalAlpha = Math.min(1, k * 2);
    ctx.font = "700 " + Math.round(t.size * pop * (w < 560 ? .85 : 1)) + "px Manrope, system-ui, sans-serif";
    ctx.shadowColor = t.color; ctx.shadowBlur = 12; ctx.fillStyle = t.color;
    ctx.fillText(t.text, s.x, s.y);
  }
  ctx.restore();
  // dash cooldown pip under the ship
  if (P.dead <= 0 && alive && dashCd > 0) {
    const s = toScreen(P.x, P.y, .2);
    ctx.strokeStyle = "rgba(255,230,138,.7)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(s.x, s.y + 26, 7, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - dashCd / DASH_CD)); ctx.stroke();
  }
  // the supercell's health
  if (boss && !boss.dead) {
    const bw = Math.min(360, w * .6), bx = w / 2 - bw / 2, by = w < 560 ? 128 : 70, k = clamp(boss.hp / boss.max, 0, 1);
    ctx.font = "700 11px 'JetBrains Mono', ui-monospace, monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#e4dcff";
    ctx.fillText("SUPERCELL", w / 2, by - 8);
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(bx, by, bw, 6);
    const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0); gr.addColorStop(0, "#7a6cff"); gr.addColorStop(1, "#e8d8ff");
    ctx.fillStyle = gr; ctx.fillRect(bx, by, bw * k, 6);
  }
  // aim reticle
  if (mouse.seen && PA.state === "play") {
    ctx.strokeStyle = ocT > 0 ? "rgba(207,234,255,.9)" : "rgba(255,230,138,.8)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, TAU); ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y); ctx.stroke();
  }
}

/* ================= boot ================= */
const view = PA.canvas($("fx"), { onResize: () => resize3d() });
const ctx = view.ctx;
addEventListener("resize", resize3d);
resize3d();
// distant lightning flickers across the floor behind the start screen
setInterval(() => { if (PA.state !== "play") zap(rand(0, AW), rand(0, AH), rand(250, 700), rand(80, 220)); }, 600);
PA.onStart(reset);
PA.loop(update, render);
window.__gs = {
  get state() { return { score, lives, enemies: enemies && enemies.length, t, bestChain, waves: waves && waves.length, px: P && P.x, py: P && P.y, lit: hexC.reduce((m, c) => Math.max(m, c), 0), oc: ocT, dash: dashT, boss: boss ? boss.hp : null, cells: cellsDowned, mult }; },
  cheat() { lives = 99; }, god() { P.inv = 1e9; }, warp(s) { t = s; }, spawn(type) { const e = spawn(type); if (type === "cloud") clouds.push(e); return e.type; },
  boss() { nextBoss = t; spawnT = 0; }, dash, charge() { zap(P.x, P.y, 2000, 200); }, aim(x, y) { mouse.seen = true; const s = toScreen(x, y, .8); mouse.x = s.x; mouse.y = s.y; }, fire(v) { mouse.down = v; mouse.seen = true; },
  get player() { return P; }, get bossE() { return boss; },
  hurtBoss(n) { if (boss) { boss.hp -= n; if (boss.hp <= 0) killEnemy(boss); } }
};
})();
</script>
