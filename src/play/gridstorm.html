<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Gridstorm — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#eaf6ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;position:fixed;inset:0;cursor:crosshair}
#gs-hud{position:fixed;top:10px;left:10px;right:100px;z-index:30;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
#gs-score b{min-width:5ch}
.gs-stick{position:fixed;z-index:40;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(120,220,255,.3);display:none;pointer-events:none}
.gs-stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(120,220,255,.3)}
#gs-bomb{position:fixed;right:16px;bottom:170px;z-index:42;width:64px;height:64px;border-radius:50%;border:2px solid rgba(150,215,255,.6);background:rgba(120,190,255,.15);color:#cfeaff;font:800 11px Manrope,sans-serif;display:none}
@media (pointer:coarse){#gs-bomb{display:block}}
</style></head><body>
<canvas id="c" aria-label="Gridstorm arena"></canvas>
<div id="gs-hud" class="pa-hud">
  <div class="pa-stat" id="gs-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat" id="gs-mult"><small>Multiplier</small><b>×1</b></div>
  <div class="pa-stat" id="gs-lives"><small>Ships</small><b>3</b></div>
  <div class="pa-stat" id="gs-bombs"><small>Surges</small><b>3</b></div>
</div>
<div class="gs-stick" id="gs-s1"><i></i></div><div class="gs-stick" id="gs-s2"><i></i></div>
<button type="button" id="gs-bomb">SURGE</button>
<script>
window.paConfig = {
  slug: "gridstorm", title: "Gridstorm", native: true, music: "space", unit: "points",
  controls: [["WASD / arrows", "Move"], ["Arrows (with WASD)", "Aim and fire"], ["Mouse", "Aim — hold to fire (or always-fire toggle F)"], ["Space / right-click", "Surge: clears the arena"], ["Touch", "Left thumb moves · right thumb aims and fires"], ["Shockwaves", "Every kill rings out and pops anything it reaches — herd them close and chain them"], ["Shellbacks", "Shielded on the side facing you: flank them, or catch them in a shockwave"], ["Thunderheads", "Watch for the bright warning ring — lightning lands there a moment later"]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script>
(() => {
"use strict";
const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const { clamp, rand } = PA;
const view = PA.canvas($("c"));
const ctx = view.ctx;
const fx = new PA.Particles(2400), texts = new PA.Texts();
const AW = 1700, AH = 1050;

/* ================= storm floor =================
   The arena is a honeycomb of charge cells over a sea of storm cloud. Cells don't move: they light up.
   Blasts, shockwaves and lightning pour charge into nearby cells, and the charge bleeds away again. */
const HS = 26, HW = Math.sqrt(3) * HS, HR = HS * 1.5;           // hex radius, column step, row step
const HX = Math.ceil(AW / HW) + 2, HY = Math.ceil(AH / HR) + 2;
const hexC = new Float32Array(HX * HY), hexPos = [];
for (let y = 0; y < HY; y++) for (let x = 0; x < HX; x++) hexPos.push([x * HW + (y & 1 ? HW / 2 : 0) - HW / 2, y * HR - HR / 2]);
function zap(px, py, force, radius) {
  // force is roughly how hard the blast hits; negative values (old pulls) do nothing
  if (force <= 0) return;
  const amt = Math.min(1.2, force / 900), R = radius + HS;
  const y0 = Math.max(0, Math.floor((py - R) / HR)), y1 = Math.min(HY - 1, Math.ceil((py + R) / HR) + 1);
  const x0 = Math.max(0, Math.floor((px - R) / HW)), x1 = Math.min(HX - 1, Math.ceil((px + R) / HW) + 1);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * HX + x, [cx, cy] = hexPos[i], d = Math.hypot(cx - px, cy - py);
    if (d > R) continue;
    hexC[i] = Math.min(1.4, hexC[i] + amt * (1 - d / R));
  }
}
function updateGrid(dt) {
  const k = Math.exp(-dt * 2.6);
  for (let i = 0; i < hexC.length; i++) hexC[i] *= k;
  // now and then the storm flickers somewhere on its own
  if (Math.random() < dt * .4) zap(rand(0, AW), rand(0, AH), rand(120, 320), rand(90, 220));
}
// the floor art is drawn once: dark cloud banks with faint honeycomb seams
const FLOOR_S = 1.5, floor = document.createElement("canvas");
(function paintFloor() {
  floor.width = AW * FLOOR_S; floor.height = AH * FLOOR_S;
  const g = floor.getContext("2d"); g.scale(FLOOR_S, FLOOR_S);
  const bg = g.createLinearGradient(0, 0, AW, AH); bg.addColorStop(0, "#070b1c"); bg.addColorStop(.5, "#0b1426"); bg.addColorStop(1, "#090a1d");
  g.fillStyle = bg; g.fillRect(0, 0, AW, AH);
  // billowing cloud banks
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * AW, y = Math.random() * AH, r = 80 + Math.random() * 220;
    const c = g.createRadialGradient(x, y, 0, x, y, r);
    const tint = Math.random() < .5 ? "60,80,130" : "40,90,120";
    c.addColorStop(0, `rgba(${tint},${.10 + Math.random() * .10})`); c.addColorStop(1, `rgba(${tint},0)`);
    g.fillStyle = c; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.strokeStyle = "rgba(130,190,255,.11)"; g.lineWidth = 1.2;
  g.beginPath();
  for (const [cx, cy] of hexPos) hexPath(g, cx, cy, HS - 1.5);
  g.stroke();
})();
function hexPath(g, cx, cy, r) {
  for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; k ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath();
}

/* ================= state ================= */
let P, bullets, enemies, gems, clouds, strikes, waves, bestChain, spawnT, t, score, mult, multXp, lives, bombs, nextLife, wave, alive, fireCd, overT, spawnBudget, alwaysFire = false, bombFlash = 0, kills;
let mouse = { x: 0, y: 0, down: false, seen: false };
const COL = { player: "#eaffff", bullet: "#ffe68a", drift: "#9fd8ff", dart: "#ff7a59", shell: "#7dffcf", seeder: "#ffd34d", mine: "#fff3b0", eel: "#c58bff", cloud: "#8fa6ff", gem: "#7dffb0", bolt: "#f4f7ff" };

function reset() {
  P = { x: AW / 2, y: AH / 2, vx: 0, vy: 0, a: 0, inv: 2, dead: 0 };
  bullets = []; enemies = []; gems = []; clouds = []; strikes = []; waves = []; bestChain = 0;
  spawnT = 1.2; t = 0; score = 0; mult = 1; multXp = 0; lives = 3; bombs = 3; nextLife = 75000; wave = 0; alive = true; fireCd = 0; overT = 0; spawnBudget = 0; kills = 0;
  fx.clear(); texts.clear();
  hexC.fill(0);
  paint();
}
function paint() {
  PA.stat("gs-score", score.toLocaleString());
  PA.stat("gs-mult", "×" + mult);
  PA.stat("gs-lives", lives);
  PA.stat("gs-bombs", bombs);
}

/* ================= enemies ================= */
/* the storm's own cast:
   drift      jelly sparks that wander on the breeze
   dart       needles that stop, take aim (you see the line) and lunge
   shell      shellbacks: a shield faces you, so flank them or use a shockwave
   seeder     pods that circle at range and sow mines
   mine       sown by seeders; fizzle out after a while, but make great chain fuel
   eel        zigzag current that only moves in straight runs and right-angle turns
   cloud      thunderheads: call lightning onto the spot you're heading for */
const TYPES = {
  drift: { r: 14, hp: 1, pts: 25, speed: 62 },
  dart: { r: 14, hp: 1, pts: 50, speed: 560 },
  shell: { r: 17, hp: 2, pts: 100, speed: 95 },
  seeder: { r: 16, hp: 2, pts: 100, speed: 150 },
  mine: { r: 7, hp: 1, pts: 10, speed: 0 },
  eel: { r: 12, hp: 1, pts: 150, speed: 210 },
  cloud: { r: 30, hp: 14, pts: 200, speed: 28 }
};
const CARD = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
function spawn(type, x, y) {
  const T = TYPES[type];
  if (x == null) {
    // spawn away from the player, never on top of them
    for (let i = 0; i < 12; i++) { x = rand(40, AW - 40); y = rand(40, AH - 40); if (Math.hypot(x - P.x, y - P.y) > 300) break; }
  }
  const e = { type, x, y, vx: 0, vy: 0, r: T.r, hp: T.hp, a: rand(0, TAU), birth: 0.7, seed: Math.random() };
  if (type === "drift") { e.dir = rand(0, TAU); }
  if (type === "dart") { e.mode = "aim"; e.timer = rand(0.6, 1.2); e.dashA = 0; }
  if (type === "shell") { e.face = Math.atan2(P.y - y, P.x - x); }
  if (type === "seeder") { e.drop = rand(1.2, 2.4); e.orb = Math.atan2(y - P.y, x - P.x); }
  if (type === "mine") { e.life = 9; }
  if (type === "eel") { e.tail = []; for (let i = 0; i < 18; i++) e.tail.push([x, y]); e.dir = CARD[(Math.random() * 4) | 0]; e.turnT = rand(0.5, 1); }
  if (type === "cloud") { e.charge = 2.4; e.pulse = 0; }
  enemies.push(e);
  return e;
}
function spawnCorners(type, n) {
  const corners = [[60, 60], [AW - 60, 60], [60, AH - 60], [AW - 60, AH - 60]];
  const far = corners.sort((a, b) => Math.hypot(b[0] - P.x, b[1] - P.y) - Math.hypot(a[0] - P.x, a[1] - P.y)).slice(0, 2);
  for (let i = 0; i < n; i++) { const c = far[i % 2]; spawn(type, c[0] + rand(-30, 30), c[1] + rand(-30, 30)); }
}
function director(dt) {
  spawnT -= dt;
  if (spawnT > 0) return;
  wave++;
  const lvl = t / 30;
  spawnT = Math.max(0.8, 2.5 - lvl * 0.3);
  const r = Math.random();
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const pool = ["drift", "dart"];
  if (t > 20) pool.push("shell");
  if (t > 35) pool.push("seeder");
  if (t > 55) pool.push("eel");
  const n = Math.min(20, 4 + Math.floor(lvl * 2.4));
  if (r < 0.18 && t > 25) spawnCorners(pick(pool), n + 4);
  else for (let i = 0; i < n; i++) spawn(pick(pool));
  if (t > 45 && Math.random() < 0.18 && clouds.length < 2) clouds.push(spawn("cloud"));
}

/* shockwaves: every shot kill rings out along the grid, and the ring's front
   detonates whatever it crosses, which rings out again, so tight packs chain */
const WAVE_SPEED = 520, WAVE_R = 82, WAVE_GROW = 14, WAVE_MAX = 150, CHAIN_CAP = 8;
function killEnemy(e, byBomb, from) {
  if (e.dead) return;
  e.dead = true;
  kills++;
  const c = COL[e.type];
  const depth = from ? from.depth + 1 : 0, root = from ? from.root : { n: 0 };
  if (!byBomb) {
    root.n++;
    if (root.n > bestChain) bestChain = root.n;
    if (from && (root.n === 3 || root.n % 5 === 0)) texts.add(e.x, e.y - 22, "CHAIN " + root.n, { color: "#fff", size: 12 + Math.min(10, root.n), life: .7 });
    waves.push({ x: e.x, y: e.y, r: 0, max: Math.min(WAVE_MAX, WAVE_R + depth * WAVE_GROW), depth, root, c, hit: new Set([e]) });
  }
  const big = e.type === "cloud";
  fx.burst(e.x, e.y, { n: big ? 120 : 34, color: c, speed: big ? 600 : 360, life: .9, size: 2.6, shape: "spark", drag: 2.6 });
  zap(e.x, e.y, big ? 1800 : 520, big ? 260 : 120);
  if (!byBomb) {
    const pts = TYPES[e.type].pts * mult * Math.min(CHAIN_CAP, depth + 1);
    score += pts;
    if (pts >= 500) texts.add(e.x, e.y, pts.toLocaleString(), { color: c, size: 14, life: .6 });
    const ng = big ? 8 : e.type === "mine" ? 0 : 1 + (Math.random() < .3);
    for (let i = 0; i < ng; i++) gems.push({ x: e.x, y: e.y, vx: rand(-90, 90), vy: rand(-90, 90), life: 7 });
  }
  if (big) { clouds = clouds.filter((w) => w !== e); strikes = strikes.filter((k) => k.from !== e || k.t <= 0); PA.sfx("boom"); PA.shake(10, .5); }
  else PA.sfx("explode", { pitch: 1.5 + Math.random() * .6, vol: .35 });
  if (score >= nextLife) { nextLife += 75000; lives++; bombs++; texts.add(P.x, P.y - 40, "+1 SHIP +1 SURGE", { color: "#fff", size: 18, life: 1.6 }); PA.sfx("levelup"); }
  paint();
}
function bomb() {
  if (!alive || bombs <= 0 || P.dead > 0 || PA.state !== "play") return;
  bombs--;
  bombFlash = 1;
  for (const e of enemies) killEnemy(e, true);
  strikes = [];
  for (let i = 0; i < 6; i++) zap(P.x, P.y, 2400, 900);
  PA.sfx("boom"); PA.shake(16, .8); PA.flash("#ffffff", 500);
  P.inv = Math.max(P.inv, 1.2);
  paint();
}
function hitPlayer() {
  if (P.inv > 0 || P.dead > 0) return;
  lives--; mult = 1; multXp = 0;
  P.dead = 2;
  fx.burst(P.x, P.y, { n: 200, colors: ["#fff", "#5ef2ff", "#ffe68a"], speed: 700, life: 1.4, size: 3, shape: "spark" });
  for (let i = 0; i < 4; i++) zap(P.x, P.y, 2600, 600);
  PA.sfx("boom"); PA.shake(20, 1); PA.flash("#ff4d6b", 500);
  // clear the board so respawns are fair
  waves = [];
  for (const e of enemies) { e.dead = true; fx.burst(e.x, e.y, { n: 8, color: COL[e.type], speed: 200, life: .6, shape: "spark" }); }
  clouds = []; strikes = [];
  paint();
  if (lives <= 0) { alive = false; overT = 1.6; }
}

/* ================= input ================= */
const s1 = { el: $("gs-s1"), id: null, ox: 0, oy: 0, dx: 0, dy: 0 }, s2 = { el: $("gs-s2"), id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; }
  for (const s of [s1, s2]) if (s.id === e.pointerId) {
    let dx = e.clientX - s.ox, dy = e.clientY - s.oy; const d = Math.hypot(dx, dy), m = 50;
    if (d > m) { dx = dx / d * m; dy = dy / d * m; }
    s.dx = dx / m; s.dy = dy / m; s.el.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  }
});
addEventListener("pointerdown", (e) => {
  if (e.target.closest && e.target.closest("button,#pa-gate,.pa-layer,.pa-tb")) return;
  if (e.pointerType === "mouse") { if (e.button === 2) bomb(); else mouse.down = true; return; }
  const s = e.clientX < view.w / 2 ? s1 : s2;
  if (s.id != null) return;
  s.id = e.pointerId; s.ox = e.clientX; s.oy = e.clientY; s.dx = s.dy = 0;
  s.el.style.display = "block"; s.el.style.left = e.clientX + "px"; s.el.style.top = e.clientY + "px";
});
const up = (e) => {
  if (e.pointerType === "mouse") { mouse.down = false; return; }
  for (const s of [s1, s2]) if (s.id === e.pointerId) { s.id = null; s.dx = s.dy = 0; s.el.style.display = "none"; s.el.firstElementChild.style.transform = ""; }
};
addEventListener("pointerup", up); addEventListener("pointercancel", up);
addEventListener("contextmenu", (e) => e.preventDefault());
$("gs-bomb").addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); bomb(); });
PA.onKey((e) => {
  if (e.code === "Space") { e.preventDefault(); bomb(); }
  if (e.code === "KeyF") { alwaysFire = !alwaysFire; PA.toast(alwaysFire ? "Always-fire on" : "Always-fire off", 1400); }
});

/* ================= camera ================= */
let cam = { x: AW / 2, y: AH / 2, z: 1 };
function screenToWorld(sx, sy) { return { x: (sx - view.w / 2) / cam.z + cam.x, y: (sy - view.h / 2) / cam.z + cam.y }; }

/* ================= update ================= */
function update(dt) {
  if (PA.state !== "play" || !P) { updateGrid(dt); return; }
  t += dt;
  updateGrid(dt);
  bombFlash = Math.max(0, bombFlash - dt * 2);
  if (!alive) { overT -= dt; fx.update(dt); if (overT <= 0 && !P.sent) { P.sent = true; finish(); } return; }
  if (P.dead > 0) {
    P.dead -= dt;
    if (P.dead <= 0) { P.x = AW / 2; P.y = AH / 2; P.vx = P.vy = 0; P.inv = 2.5; spawnT = 2; }
  } else {
    P.inv = Math.max(0, P.inv - dt);
    // arrows steer only when WASD isn't in use; with WASD held they aim instead
    const wasd = PA.down("KeyW", "KeyA", "KeyS", "KeyD");
    let mx = wasd ? (PA.down("KeyD") ? 1 : 0) - (PA.down("KeyA") ? 1 : 0) : (PA.down("ArrowRight") ? 1 : 0) - (PA.down("ArrowLeft") ? 1 : 0);
    let my = wasd ? (PA.down("KeyS") ? 1 : 0) - (PA.down("KeyW") ? 1 : 0) : (PA.down("ArrowDown") ? 1 : 0) - (PA.down("ArrowUp") ? 1 : 0);
    if (s1.id != null) { mx = s1.dx; my = s1.dy; }
    const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
    const SP = 420;
    P.vx += (mx * SP - P.vx) * Math.min(1, dt * 12); P.vy += (my * SP - P.vy) * Math.min(1, dt * 12);
    P.x = clamp(P.x + P.vx * dt, 14, AW - 14); P.y = clamp(P.y + P.vy * dt, 14, AH - 14);
    if (ml > 0.1) P.a = Math.atan2(my, mx);
    // gentle wake in the grid
    if (ml > 0.1) zap(P.x - P.vx * .05, P.y - P.vy * .05, 40, 60);
    // aim + fire
    let aim = null, firing = false;
    if (s2.id != null && Math.hypot(s2.dx, s2.dy) > 0.25) { aim = Math.atan2(s2.dy, s2.dx); firing = true; }
    else if (mouse.seen) { const w = screenToWorld(mouse.x, mouse.y); aim = Math.atan2(w.y - P.y, w.x - P.x); firing = mouse.down || alwaysFire; }
    // keyboard-only: arrow keys aim+fire when WASD is used to move
    const ax = (PA.down("ArrowRight") ? 1 : 0) - (PA.down("ArrowLeft") ? 1 : 0), ay = (PA.down("ArrowDown") ? 1 : 0) - (PA.down("ArrowUp") ? 1 : 0);
    if ((ax || ay) && wasd) { aim = Math.atan2(ay, ax); firing = true; }
    P.aim = aim;
    fireCd -= dt;
    if (firing && aim != null && fireCd <= 0) {
      fireCd = 0.085;
      const streams = score > 150000 ? 4 : score > 40000 ? 3 : 2;
      const spread = streams >= 3 ? 0.09 : 0.05;
      for (let i = 0; i < streams; i++) {
        const a = aim + (i - (streams - 1) / 2) * spread;
        const off = (i - (streams - 1) / 2) * 6;
        bullets.push({ x: P.x + Math.cos(aim + 1.57) * off, y: P.y + Math.sin(aim + 1.57) * off, vx: Math.cos(a) * 1050 + P.vx * .3, vy: Math.sin(a) * 1050 + P.vy * .3, life: 1.1 });
      }
      PA.sfx("laser", { pitch: 1.8 + Math.random() * .2, vol: .18 });
    }
  }
  director(dt);

  // bullets
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.x < 0 || b.y < 0 || b.x > AW || b.y > AH) { b.life = 0; fx.burst(clamp(b.x, 0, AW), clamp(b.y, 0, AH), { n: 3, color: COL.bullet, speed: 120, life: .25, shape: "spark" }); zap(b.x, b.y, 90, 50); }
  }
  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.birth > 0) { e.birth -= dt; continue; }
    const T = TYPES[e.type], dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    const chase = P.dead > 0 ? 0 : 1;
    e.a += dt * 3;
    if (e.type === "drift") {
      e.dir += Math.sin(t * 1.7 + e.seed * 9) * dt * 1.4;
      e.vx = Math.cos(e.dir) * T.speed + dx / d * 28 * chase; e.vy = Math.sin(e.dir) * T.speed + dy / d * 28 * chase;
    } else if (e.type === "dart") {
      e.timer -= dt;
      if (e.mode === "aim") {
        const k = Math.pow(0.02, dt); e.vx *= k; e.vy *= k;
        if (chase) e.dashA = Math.atan2(dy, dx);
        if (e.timer <= 0 && chase) { e.mode = "dash"; e.timer = 0.42; e.vx = Math.cos(e.dashA) * T.speed; e.vy = Math.sin(e.dashA) * T.speed; PA.sfx("laser", { pitch: .7, vol: .12 }); }
      } else {
        const k = Math.pow(0.4, dt); e.vx *= k; e.vy *= k;
        if (e.timer <= 0) { e.mode = "aim"; e.timer = rand(0.7, 1.2); }
      }
    } else if (e.type === "shell") {
      let da = Math.atan2(dy, dx) - e.face; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      e.face += clamp(da, -1.5 * dt, 1.5 * dt);
      e.vx += (dx / d * T.speed * chase - e.vx) * dt * 2; e.vy += (dy / d * T.speed * chase - e.vy) * dt * 2;
    } else if (e.type === "seeder") {
      e.orb += dt * 0.45;
      const gx = clamp(P.x + Math.cos(e.orb) * 330, 40, AW - 40), gy = clamp(P.y + Math.sin(e.orb) * 330, 40, AH - 40);
      const sx = gx - e.x, sy = gy - e.y, sd = Math.hypot(sx, sy) || 1, sp = Math.min(T.speed, sd * 2);
      e.vx += (sx / sd * sp - e.vx) * dt * 2.5; e.vy += (sy / sd * sp - e.vy) * dt * 2.5;
      e.drop -= dt;
      if (e.drop <= 0 && chase) {
