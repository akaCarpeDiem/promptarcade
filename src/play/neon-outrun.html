<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Neon Outrun — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#05070f;color:#f4f1ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;z-index:1}
#game canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none}
#no-hud{opacity:0;transition:opacity .45s ease}
#no-hud.on{opacity:1}
#no-hud .timer b{color:#ffd27a}
#no-hud .timer.warn b{color:#ff7eb6;animation:noPulse .55s ease infinite alternate}
@keyframes noPulse{from{text-shadow:0 0 8px rgba(255,126,182,.4)}to{text-shadow:0 0 18px rgba(255,126,182,.95)}}
</style></head><body>
<div id="game" aria-label="Neon Outrun playfield"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="pa-hud" id="no-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat timer" id="s-time"><small>Time</small><b>30.0</b></div>
  <div class="pa-stat" id="s-spd"><small>km/h</small><b>0</b></div>
  <div class="pa-stat" id="s-next"><small>Checkpoint</small><b>0 m</b></div>
</div>
<script>
window.paConfig = {
  slug: "neon-outrun",
  title: "Neon Outrun",
  native: true,
  music: "synthwave",
  unit: "points",
  controls: [
    ["← → / A D", "Steer"],
    ["↑ / W", "Accelerate"],
    ["↓ / S / Space", "Brake"],
    ["Touch", "◀ ▶ steer, ▼ brake (auto throttle)"]
  ]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
  "use strict";
  // A real-3D night-city racer. The course is an endless procedural boulevard: a centreline sampled every
  // STEP metres (heading integrated from curvature, plus rolling hills). The world around it is built in
  // chunks just ahead of the camera and thrown away behind it, so it never ends and never stutters.
  // Gameplay runs in track space (distance along the road, metres off the centreline); only rendering
  // converts to world space.
  const PA = window.PA;
  const { clamp, lerp, rand, randInt } = PA;
  const TAU = Math.PI * 2;

  /* ---------------- tuning ---------------- */
  const STEP = 2;                       // metres between centreline samples
  const CHUNK = 48;                     // samples per world chunk (96 m)
  const VIEW_AHEAD = 820;
  const VIEW_BEHIND = 70;
  const LANES = 4, LANE_W = 3.6;
  const ROAD_HALF = LANES * LANE_W / 2; // 7.2 m: painted edge lines
  const EDGE = ROAD_HALF + 0.6;         // tarmac incl. gutters
  const WALK = EDGE + 4.4;              // outer edge of the sidewalk
  const RAIL = EDGE - 0.05;
  const CAR_LEN = 4.5, CAR_HW = 0.98;
  const X_LIMIT = RAIL - 0.12 - CAR_HW;
  const MAX_V = 86;                     // m/s (310 km/h)
  const DRAFT_V = 8;                    // extra top speed in a full slipstream
  const LAT_MAX = 16.5;                 // m/s of sideways speed at full lock
  const STEER_RESP = 13;                // how fast the car answers the wheel
  const CF = 0.42;                      // how hard corners push you wide
  const LAMP_GAP = 34;
  const CP_LEN = 1500;
  const START_TIME = 30;
  const START_S = 40;
  const ROAD_V = 24;                    // metres of road per texture repeat
  const laneX = (l) => -ROAD_HALF + LANE_W * (l + 0.5);
  const laneOf = (x) => clamp(Math.round((x + ROAD_HALF) / LANE_W - 0.5), 0, LANES - 1);
  const smooth = (t) => t * t * (3 - 2 * t);

  /* ---------------- renderer, scene, camera ---------------- */
  const mount = document.getElementById("game");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1);
  renderer.setPixelRatio(dprCap());
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  mount.appendChild(renderer.domElement);
  const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const FOG = 0x2a1740;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(FOG);
  scene.fog = new THREE.FogExp2(FOG, 0.0021);
  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 2600);
  camera.rotation.order = "YXZ";

  let W = innerWidth, H = innerHeight;
  const overlay = PA.canvas(document.getElementById("fx"), { onResize: (o) => { W = o.w; H = o.h; } });
  const ctx = overlay.ctx;
  addEventListener("resize", () => {
    renderer.setPixelRatio(dprCap());
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });

  /* ---------------- textures ---------------- */
  function canvasTex(w, h, paint, o) {
    o = o || {};
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    paint(cv.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    if (o.repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = ANISO;
    return t;
  }
  function speckle(g, w, h, amt) {
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * amt;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    g.putImageData(img, 0, 0);
  }

  const roadTex = canvasTex(512, 1024, (g, w, h) => {
    g.fillStyle = "#2c2e35"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 30);
    const px = (lat) => (lat + EDGE) / (2 * EDGE) * w;
    // Darker wheel tracks where the traffic runs, lighter gutters by the kerbs.
    for (let l = 0; l < LANES; l++) {
      for (const o of [-0.85, 0.85]) {
        const a = px(laneX(l) + o - 0.5), b = px(laneX(l) + o + 0.5);
        const gr = g.createLinearGradient(a, 0, b, 0);
        gr.addColorStop(0, "rgba(8,8,12,0)"); gr.addColorStop(0.5, "rgba(8,8,12,.32)"); gr.addColorStop(1, "rgba(8,8,12,0)");
        g.fillStyle = gr; g.fillRect(a, 0, b - a, h);
      }
    }
    g.fillStyle = "rgba(78,80,88,.55)";
    g.fillRect(0, 0, px(-ROAD_HALF) - 3, h);
    g.fillRect(px(ROAD_HALF) + 3, 0, w, h);
    g.fillStyle = "rgba(20,20,24,.6)";
    for (let y = 0; y < h; y += h / 6) { g.fillRect(4, y, 18, 6); g.fillRect(w - 22, y, 18, 6); } // drains
    const lw = 0.16 / (2 * EDGE) * w;
    g.fillStyle = "rgba(236,234,226,.92)";
    g.fillRect(px(-ROAD_HALF + 0.1) - lw / 2, 0, lw, h);
    g.fillRect(px(ROAD_HALF - 0.1) - lw / 2, 0, lw, h);
    const dash = 4 / ROAD_V * h;
    for (let l = 1; l < LANES; l++) {
      const x = px(-ROAD_HALF + l * LANE_W);
      for (let k = 0; k < 2; k++) g.fillRect(x - lw / 2, k * h / 2 + h * 0.1, lw, dash);
    }
    speckle(g, w, h, 22);
  }, { repeat: true });

  const walkTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#5d5c64"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 26);
    g.strokeStyle = "rgba(20,20,26,.55)"; g.lineWidth = 3;
    for (let i = 0; i <= 2; i++) {
      g.beginPath(); g.moveTo(0, i * h / 2); g.lineTo(w, i * h / 2); g.stroke();
      g.beginPath(); g.moveTo(i * w / 2, 0); g.lineTo(i * w / 2, h); g.stroke();
    }
  }, { repeat: true });

  const groundTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#1d1b26"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 34);
    g.fillStyle = "rgba(40,38,52,.7)";
    for (let i = 0; i < 40; i++) g.fillRect(rand(w), rand(h), rand(8, 40), rand(2, 5));
  }, { repeat: true });

  const glowTex = canvasTex(64, 64, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.22, "rgba(255,255,255,.55)");
    gr.addColorStop(0.55, "rgba(255,255,255,.12)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const poolTex = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,.95)");
    gr.addColorStop(0.35, "rgba(255,255,255,.5)");
    gr.addColorStop(0.75, "rgba(255,255,255,.1)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const shadowTex = canvasTex(64, 128, (g, w, h) => {
    g.fillStyle = "rgba(0,0,0,0)"; g.fillRect(0, 0, w, h);
    g.filter = "blur(7px)";
    g.fillStyle = "rgba(0,0,0,.85)";
    g.fillRect(12, 14, w - 24, h - 28);
  });

  // Building facades: one colour map (wall + dark glass) and one emissive map (only the lit windows).
  // A tile is 4 windows x 8 floors = 14 m x 28 m.
  const FAC_U = 14, FAC_V = 28, FC = 6, FR = 8;
  function facade(kind) {
    const lit = [];
    for (let i = 0; i < FC * FR; i++) lit.push(Math.random() < (kind === 2 ? 0.34 : 0.26));
    const tints = kind === 0 ? ["#ffd9a0", "#ffe7c4", "#ffc47a"] : kind === 1 ? ["#cfe9ff", "#a9d6ff", "#e4f1ff", "#ffd9a0"] : ["#ffd9a0", "#ff9fce", "#9ff0ff", "#ffe7c4"];
    const colors = lit.map(() => PA.choice(tints));
    const wall = ["#3b3a44", "#232a3a", "#4a3330"][kind];
    const cell = (g, i, x, y, cw, ch) => {
      if (kind === 1) return [x + 2, y + 6, cw - 4, ch - 10];        // curtain wall: big panes
      return [x + cw * 0.2, y + ch * 0.22, cw * 0.6, ch * 0.52];
    };
    const map = canvasTex(256, 512, (g, w, h) => {
      g.fillStyle = wall; g.fillRect(0, 0, w, h);
      speckle(g, w, h, kind === 1 ? 8 : 22);
      const cw = w / FC, ch = h / FR;
      for (let r = 0; r < FR; r++) for (let c = 0; c < FC; c++) {
        const i = r * FC + c, [x, y, ww, hh] = cell(g, i, c * cw, r * ch, cw, ch);
        const gr = g.createLinearGradient(x, y, x + ww, y + hh);
        gr.addColorStop(0, "#151a28"); gr.addColorStop(1, "#0a0d16");
        g.fillStyle = lit[i] ? colors[i] : gr;
        g.fillRect(x, y, ww, hh);
        if (kind !== 1) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(x - 2, y + hh, ww + 4, 4); }   // sills
      }
      g.fillStyle = kind === 1 ? "rgba(120,150,190,.25)" : "rgba(0,0,0,.25)";
      for (let r = 0; r < FR; r++) g.fillRect(0, r * ch, w, 4);
    }, { repeat: true });
    const emissive = canvasTex(256, 512, (g, w, h) => {
      g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
      const cw = w / FC, ch = h / FR;
      for (let r = 0; r < FR; r++) for (let c = 0; c < FC; c++) {
        const i = r * FC + c;
        if (!lit[i]) continue;
        const [x, y, ww, hh] = cell(g, i, c * cw, r * ch, cw, ch);
        g.fillStyle = colors[i]; g.globalAlpha = rand(0.35, 0.9);
        g.fillRect(x, y, ww, hh);
        g.globalAlpha = 1;
        if (Math.random() < 0.4) { g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(x, y, ww, hh * rand(0.2, 0.6)); } // blinds
      }
    }, { repeat: true });
    return new THREE.MeshLambertMaterial({ map, emissiveMap: emissive, emissive: 0xffffff, emissiveIntensity: 0.75 });
  }
  const facades = [facade(0), facade(1), facade(2)];

  const shopTex = canvasTex(256, 64, (g, w, h) => {
    g.fillStyle = "#111"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 4; i++) {
      const x = i * 64;
      const gr = g.createLinearGradient(0, 12, 0, h);
      gr.addColorStop(0, "#ffffff"); gr.addColorStop(1, "#9a9a9a");
      g.fillStyle = gr; g.fillRect(x + 4, 14, 56, h - 16);
      g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(x + 31, 14, 3, h - 16);
      g.fillStyle = "#d8d8d8"; g.fillRect(x + 2, 2, 60, 9);
    }
  }, { repeat: true });

  const SIGN_WORDS = ["HOTEL", "DINER", "ARCADE", "RAMEN", "CLUB", "MOTEL", "24/7", "CINEMA", "PIZZA", "BAR", "DISCO", "NOODLE", "KARAOKE", "TATTOO", "GARAGE", "VIDEO"];
  const NEON = ["#ff4fa3", "#4ff3ff", "#ffd34f", "#a98bff", "#5bff9d", "#ff7a3d"];
  const SIGNS = 12;
  const signTex = canvasTex(128 * (SIGNS + 1), 384, (g0) => {
    g0.fillStyle = "#fff"; g0.fillRect(128 * SIGNS, 0, 128, 384);
    for (let i = 0; i < SIGNS; i++) {
    const word = SIGN_WORDS[i % SIGN_WORDS.length], col = NEON[i % NEON.length];
    g0.save(); g0.translate(i * 128, 0);
    ((g, w, h) => {
      g.fillStyle = "rgba(8,8,16,.92)";
      g.beginPath(); g.roundRect(6, 6, w - 12, h - 12, 14); g.fill();
      g.strokeStyle = col; g.lineWidth = 5; g.shadowColor = col; g.shadowBlur = 16;
      g.beginPath(); g.roundRect(12, 12, w - 24, h - 24, 10); g.stroke();
      const n = word.length, size = Math.min(64, (h - 50) / n);
      g.font = "800 " + size + "px Manrope, system-ui, sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#fff";
      for (let k = 0; k < n; k++) {
        const y = h / 2 + (k - (n - 1) / 2) * size;
        g.shadowBlur = 18; g.fillStyle = col; g.fillText(word[k], w / 2, y);
        g.shadowBlur = 0; g.fillStyle = "rgba(255,255,255,.85)"; g.fillText(word[k], w / 2, y);
      }
    })(g0, 128, 384);
    g0.restore();
    }
  });
  const signUV = (i) => (u, vv) => [(i + u) / (SIGNS + 1), vv];
  const WHITE_UV = [(SIGNS + 0.5) / (SIGNS + 1), 0.5];

  const cpTex = canvasTex(1024, 160, (g, w, h) => {
    g.fillStyle = "#06081a"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#8ee9ff"; g.lineWidth = 6; g.shadowColor = "#8ee9ff"; g.shadowBlur = 20;
    g.strokeRect(10, 10, w - 20, h - 20);
    g.font = "900 92px Manrope, system-ui, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#8ee9ff"; g.fillText("CHECKPOINT", w / 2, h / 2 + 4);
    g.shadowBlur = 0; g.fillStyle = "#e9fbff"; g.fillText("CHECKPOINT", w / 2, h / 2 + 4);
    g.fillStyle = "#ffd36b"; g.shadowColor = "#ffd36b"; g.shadowBlur = 14;
    for (const x of [70, 130, w - 130, w - 70]) {
      g.beginPath(); g.moveTo(x - 18, 40); g.lineTo(x + 14, h / 2); g.lineTo(x - 18, h - 40); g.lineTo(x - 2, h / 2); g.closePath(); g.fill();
    }
  });
  const checkerTex = canvasTex(256, 32, (g, w, h) => {
    for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? "#e9e9ee" : "#16161c"; g.fillRect(i * 16, j * 16, 16, 16); }
  });
  const arrowTex = canvasTex(128, 96, (g, w, h) => {
    g.fillStyle = "#0b0b0f"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#ffb21e"; g.shadowColor = "#ffb21e"; g.shadowBlur = 10;
    for (let y = 18; y < h - 10; y += 12) for (let x = 14; x < w - 10; x += 12) {
      const ax = x - w / 2, ay = y - h / 2;
      if ((Math.abs(ay) < 9 && ax > -46 && ax < 22) || (ax >= 10 && Math.abs(ay) < 40 - (ax - 10) * 1.1)) { g.beginPath(); g.arc(x, y, 4, 0, TAU); g.fill(); }
    }
  });
  arrowTex.center.set(0.5, 0.5);
  const arrowTexL = arrowTex.clone(); arrowTexL.repeat.set(-1, 1); arrowTexL.needsUpdate = true;

  const doorsTex = canvasTex(128, 192, (g, w, h) => {
    g.fillStyle = "#cfd0d4"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 18);
    g.fillStyle = "rgba(0,0,0,.18)";
    for (let x = 6; x < w; x += 10) g.fillRect(x, 0, 3, h);
    g.fillStyle = "#2a2a30"; g.fillRect(w / 2 - 1, 0, 2, h);
    g.fillStyle = "#7a7c84"; for (const x of [w * 0.2, w * 0.4, w * 0.6, w * 0.8]) g.fillRect(x - 2, 8, 4, h - 16);
    for (let i = 0; i < w; i += 16) { g.fillStyle = (i / 16) % 2 ? "#d8192c" : "#f4f4f4"; g.fillRect(i, 0, 16, 6); g.fillRect(i, h - 6, 16, 6); }
    for (let i = 0; i < h; i += 16) { g.fillStyle = (i / 16) % 2 ? "#d8192c" : "#f4f4f4"; g.fillRect(0, i, 6, 16); g.fillRect(w - 6, i, 6, 16); }
  });
  const ribTex = canvasTex(64, 16, (g, w, h) => {
    g.fillStyle = "#e8e8ea"; g.fillRect(0, 0, w, h);
    g.fillStyle = "rgba(0,0,0,.14)"; for (let x = 0; x < w; x += 8) g.fillRect(x, 0, 3, h);
  }, { repeat: true });
  ribTex.repeat.set(10, 1);
  const plateTex = canvasTex(128, 32, (g, w, h) => {
    g.fillStyle = "#e8e9ee"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#333"; g.lineWidth = 2; g.strokeRect(2, 2, w - 4, h - 4);
    g.fillStyle = "#1a1c2a"; g.font = "800 20px Manrope, system-ui, monospace";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String.fromCharCode(65 + randInt(0, 25), 65 + randInt(0, 25)) + " " + randInt(100, 999), w / 2, h / 2 + 1);
  });

  /* ---------------- sky, sun, skyline ---------------- */
  const SUN_DIR = new THREE.Vector3(0, Math.sin(0.06), -Math.cos(0.06)).normalize();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { sun: { value: SUN_DIR } },
    vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: [
      "uniform vec3 sun; varying vec3 vD;",
      "void main(){",
      "  float h = vD.y;",
      "  vec3 top = vec3(0.02, 0.03, 0.12), mid = vec3(0.16, 0.07, 0.30), low = vec3(0.62, 0.20, 0.42), gnd = vec3(0.165, 0.09, 0.25);",
      "  float s = max(dot(vD, sun), 0.0);",
      "  vec3 c = mix(low, mid, smoothstep(0.0, 0.16, h));",
      "  c = mix(c, top, smoothstep(0.14, 0.6, h));",
      "  c += vec3(1.0, 0.45, 0.25) * pow(s, 10.0) * 0.55 * (1.0 - smoothstep(0.0, 0.35, h));",
      "  c = mix(gnd, c, smoothstep(-0.03, 0.005, h));",
      "  gl_FragColor = vec4(c, 1.0);",
      "}"
    ].join("\n")
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), skyMat);
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);

  const starGeo = new THREE.BufferGeometry();
  const starArr = [];
  for (let i = 0; i < 700; i++) {
    const a = rand(TAU), e = Math.asin(rand(0.12, 1));
    starArr.push(Math.cos(a) * Math.cos(e) * 1900, Math.sin(e) * 1900, Math.sin(a) * Math.cos(e) * 1900);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starArr, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xd8d0ff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.8, depthWrite: false, fog: false }));
  stars.renderOrder = -9; stars.frustumCulled = false;
  scene.add(stars);

  const sunMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    vertexShader: "varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: [
      "varying vec2 vU;",
      "void main(){",
      "  vec2 p = vU * 2.0 - 1.0; float r = length(p);",
      "  float disc = 1.0 - smoothstep(0.62, 0.64, r);",
      "  float glow = pow(max(0.0, 1.0 - r), 2.2) * 0.55;",
      "  float y = p.y / 0.64;",
      "  float band = y < 0.15 ? step(0.5, fract((y + 1.0) * mix(3.0, 9.0, (0.15 - y)))) : 1.0;",

      G.metal.add(headGeo, mat4(v.x, v.y, v.z, hh + Math.PI / 2), C_POLE);
      G.sign.add(lensGeo, mat4(v.x, v.y - 0.09, v.z, hh + Math.PI / 2), C_LENS, WHITE_UV);
      lampPts.push(v.x - o.x, v.y - 0.25 - o.y, v.z - o.z);
      G.pool.patch(s - 11, s + 11, side * (EDGE + 0.9 - armLen) - 8.5, side * (EDGE + 0.9 - armLen) + 8.5, 0.03);
    }

    // Palms in the gaps between lights.
    for (let n = Math.ceil((s0 - LAMP_GAP / 2) / LAMP_GAP); n * LAMP_GAP + LAMP_GAP / 2 < s1; n++) {
      const s = n * LAMP_GAP + LAMP_GAP / 2;
      if (s < s0) continue;
      for (const side of [-1, 1]) {
        if (Math.random() < 0.3) continue;
        world(s, side * (EDGE + 2.6), 0.15, v);
        const hh = -at(s).h, lean = rand(-0.08, 0.08), sc = rand(0.85, 1.15);
        G.palm.add(trunkGeo, mat4(v.x, v.y, v.z, hh, 0, lean, sc), C_TRUNK);
        const top = new THREE.Vector3(0, 8 * sc, 0).applyEuler(new THREE.Euler(0, hh, lean, "YXZ")).add(v);
        for (let f = 0; f < 9; f++) G.palm.add(frondGeo, mat4(top.x, top.y, top.z, f / 9 * TAU + rand(0.3), 0, 0, sc), C_FROND);
      }
    }

    // Buildings: frontage, setback and height vary; some carry a neon blade sign or a rooftop beacon.
    for (const sideIdx of [0, 1]) {
      const side = sideIdx ? 1 : -1;
      if (bCursor[sideIdx] < s0) bCursor[sideIdx] = s0 + rand(0, 6);
      while (bCursor[sideIdx] < s1) {
        const s = bCursor[sideIdx];
        if (Math.random() < 0.1) { bCursor[sideIdx] += rand(14, 30); continue; }   // side street / plaza
        const w = rand(14, 34), mid = s + w / 2;
        if (mid >= s1) break;
        const tall = Math.random() < 0.16;
        const h = tall ? rand(55, 140) : rand(12, 46);
        const depth = rand(16, 30), setback = WALK + rand(0.6, 3.5);
        at(mid);
        const th = P.h, base = P.y - 3, top = P.y + h;
        const rx = Math.cos(th), rz = Math.sin(th);          // lateral (right) direction
        const fx = Math.sin(th), fz = -Math.cos(th);         // forward along the road
        const cl = side * (setback + depth / 2);
        const cx = P.x + rx * cl, cz = P.z + rz * cl;
        const kind = randInt(0, 2), g = G.fac[kind];
        const uo = rand(0, 4) | 0, vo = (P.y + 0.17 - base) / FAC_V;
        const fu = (m) => uo + m / FAC_U, fv = (m) => -vo + m / FAC_V;
        // four walls: towards the road, away, and the two ends
        const sides = [
          [cx - rx * side * depth / 2, cz - rz * side * depth / 2, -rx * side, -rz * side, w / 2],
          [cx + rx * side * depth / 2, cz + rz * side * depth / 2, rx * side, rz * side, w / 2],
          [cx + fx * w / 2, cz + fz * w / 2, fx, fz, depth / 2],

        for (const [x, z, nx, nz, half] of sides) g.face(x, z, nx, nz, half, base, top, fu(0), fu(half * 2), fv(0), fv(top - base));
        const rb = g.count, ru = 0.006, rv = 0.997;
        for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) g.vert(cx + rx * a * depth / 2 + fx * b * w / 2, top, cz + rz * a * depth / 2 + fz * b * w / 2, 0, 1, 0, ru, rv);
        g.i.push(rb, rb + 2, rb + 1, rb, rb + 3, rb + 2);
        g.i.push(rb, rb + 1, rb + 2, rb, rb + 2, rb + 3);
        // lit shop fronts along the street
        const fxw = cx - rx * side * (depth / 2 + 0.06), fzw = cz - rz * side * (depth / 2 + 0.06);
        if (Math.random() < 0.8) G.shop.face(fxw, fzw, -rx * side, -rz * side, w * 0.45, P.y + 0.3, P.y + 3.6, 0, w / 8, 0, 1, PA.choice(SHOP_COLS));
        if (Math.random() < 0.38) {
          const sy = P.y + rand(5.5, 9);
          const sl = side * (setback - 1.1), along = s + rand(1.5, 4);
          world(along, sl, sy, v);
          G.sign.add(signGeo, mat4(v.x, v.y, v.z, -at(along).h), C_WHITE, signUV(randInt(0, SIGNS - 1)));
        }
        if (tall) { beaconPts.push(cx - o.x, top + 1 - o.y, cz - o.z); }
        bCursor[sideIdx] = s + w + rand(1.5, 6);
      }
    }

    // Checkpoint gantry.
    const cpN = Math.ceil(s0 / CP_LEN);
    if (cpN > 0 && cpN * CP_LEN < s1) {
      const s = cpN * CP_LEN, hh = -at(s).h;
      for (const side of [-1, 1]) {
        world(s, side * (EDGE + 0.5), 0, v);
        G.metal.add(boxGeo, mat4(v.x, v.y + 4, v.z, hh, 0, 0, 0.5, 8, 0.5), C_GANTRY);
      }
      world(s, 0, 7.4, v);
      G.metal.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 2 * EDGE + 1.6, 0.6, 0.6), C_GANTRY);
      world(s, 0, 6.25, v);
      G.metal.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 2 * EDGE + 1.6, 0.25, 0.4), C_GANTRY);
      world(s - 0.32, 0, 7.4, v);
      const panel = new THREE.PlaneGeometry(9.5, 1.5);
      G.cpPanel.add(panel, mat4(v.x, v.y, v.z, hh));
      for (let k = -3; k <= 3; k++) { world(s - 0.4, k * 2.2, 6.1, v); lampPts.push(v.x - o.x, v.y - o.y, v.z - o.z); }

    }
    if (s0 <= START_S + 6 && s1 > START_S + 6) G.checker.patch(START_S + 4.5, START_S + 7.5, -ROAD_HALF, ROAD_HALF, 0.03);

    // Road works: cones along the closed lane and an arrow-board trailer at the start.
    for (const wk of works) {
      if (wk.s1 < s0 || wk.s0 >= s1) continue;
      const inner = wk.lane < LANES / 2 ? 1 : -1;          // cones sit on the open side of the closed lane
      for (let s = Math.max(wk.s0 + 4, Math.ceil(s0 / 5) * 5); s < Math.min(wk.s1, s1); s += 5) {
        const taper = clamp((s - wk.s0) / 24, 0, 1);
        const lat = wk.x + inner * (LANE_W / 2 - 0.25) * taper - inner * (LANE_W / 2 - 0.6) * (1 - taper);
        world(s, lat, 0, v);
        G.cone.add(coneGeo, mat4(v.x, v.y, v.z, 0, 0, 0, 1.3));
        G.cone.add(coneBase, mat4(v.x, v.y, v.z, -at(s).h));
      }
      if (wk.s0 >= s0 && wk.s0 < s1) {
        const hh = -at(wk.s0).h;
        world(wk.s0 + 1.3, wk.x, 0, v);
        G.metal.add(boxGeo, mat4(v.x, v.y + 0.75, v.z, hh, 0, 0, 2.2, 0.9, 2.4), C_BOARD);
        G.metal.add(boxGeo, mat4(v.x, v.y + 2.2, v.z, hh, 0, 0, 0.12, 2.2, 0.12), C_POLE);
        world(wk.s0 - 0.02, wk.x, 3, v);

        board.position.copy(v); board.rotation.set(0, -at(wk.s0).h, 0);
        extra.push(board);
        world(wk.s0, wk.x, 3, v);
        lampPts.push(v.x - o.x, v.y - o.y, v.z - o.z);
      }
    }

    const group = new THREE.Group();
    const put = (g, mat) => { const m = g.mesh(mat); if (m) group.add(m); };
    put(G.road, M.road); put(G.walk, M.walk); put(G.ground, M.ground); put(G.metal, M.metal); put(G.sign, M.sign);
    put(G.pool, M.pool); put(G.shop, M.shop); put(G.palm, M.palm);
    put(G.cone, M.cone); put(G.cpPanel, M.cpPanel); put(G.cpLine, M.cpLine); put(G.checker, M.checker);
    G.fac.forEach((g, k) => put(g, facades[k]));
    const pts = (arr, mat) => {
      if (!arr.length) return;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
      const p = new THREE.Points(g, mat);
      p.position.copy(o); p.matrixAutoUpdate = false; p.updateMatrix();

    scene.add(group);

  }
  function disposeChunk(g) {

  }
  function updateChunks(s, all) {
    const span = CHUNK * STEP;

    const last = Math.floor((s + VIEW_AHEAD) / span);
    for (const [c, g] of chunks) if (c < first || c > last) { disposeChunk(g); chunks.delete(c); }

    for (let c = first; c <= last && (all || built < 1); c++) {

    }

  /* ---------------- vehicle models ---------------- */
  // Bodies are side profiles extruded across the car's width, with cut-out wheel arches, a glass
  // greenhouse and a painted roof. Every part is merged into one geometry with a group per material.
  // Slots: 0 paint, 1 glass, 2 trim, 3 lights, 4 plate, 5 trailer doors, 6 truck cab
  function merge(parts) {
    const pos = [], nor = [], uv = [], groups = [];
    const v = new THREE.Vector3(), nm = new THREE.Matrix3();
    for (let mi = 0; mi < 8; mi++) {
      const start = pos.length / 3;
      for (const p of parts) {
        if (p.mat !== mi) continue;
        const g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
        const Pa = g.attributes.position, Na = g.attributes.normal, Ua = g.attributes.uv;
        nm.getNormalMatrix(p.m);
        for (let i = 0; i < Pa.count; i++) {
          v.fromBufferAttribute(Pa, i).applyMatrix4(p.m); pos.push(v.x, v.y, v.z);
          v.fromBufferAttribute(Na, i).applyMatrix3(nm).normalize(); nor.push(v.x, v.y, v.z);
          uv.push(Ua ? Ua.getX(i) : 0, Ua ? Ua.getY(i) : 0);
        }
      }
      const count = pos.length / 3 - start;
      if (count) groups.push([start, count, mi]);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    for (const [s, c, m] of groups) geo.addGroup(s, c, m);
    geo.computeBoundingSphere();
    return geo;
  }
  const box = (w, h, d, x, y, z, mat, rx) => ({ geo: new THREE.BoxGeometry(w, h, d), mat, m: mat4(x, y, z, 0, rx || 0) });
  function wheelParts(parts, x, z, r, wd, dual, rimMat) {
    const tire = new THREE.CylinderGeometry(r, r, wd, 22).rotateZ(Math.PI / 2);
    const rim = new THREE.CylinderGeometry(r * 0.62, r * 0.62, wd + 0.012, 16).rotateZ(Math.PI / 2);
    const hub = new THREE.CylinderGeometry(r * 0.2, r * 0.2, wd + 0.03, 8).rotateZ(Math.PI / 2);
    parts.push({ geo: tire, mat: 2, m: mat4(x, r, z) }, { geo: rim, mat: rimMat || 2, m: mat4(x, r, z) }, { geo: hub, mat: 2, m: mat4(x, r, z) });
    if (dual) parts.push({ geo: tire, mat: 2, m: mat4(x - Math.sign(x) * wd * 1.05, r, z) });
  }

  // sp: L length, W width, clear ride height, tail/belt/beltF/hood/nose heights, gA..gD greenhouse x
  // stations (from the rear), roof height, wr wheel radius, axR/axF axle stations.
  const CAR_SPECS = {
    sports: { L: 4.5, W: 1.96, clear: 0.14, tail: 0.84, belt: 0.87, beltF: 0.84, hood: 0.74, nose: 0.5, gA: 0.95, gB: 1.95, gC: 2.62, gD: 3.3, roof: 1.19, wr: 0.34, axR: 0.95, axF: 3.62, bar: true, spoiler: true },
    sedan: { L: 4.8, W: 1.84, clear: 0.2, tail: 1.0, belt: 1.0, beltF: 0.98, hood: 0.92, nose: 0.72, gA: 0.78, gB: 1.5, gC: 2.85, gD: 3.38, roof: 1.45, wr: 0.33, axR: 1.0, axF: 3.8 },
    hatch: { L: 4.1, W: 1.76, clear: 0.18, tail: 1.02, belt: 1.0, beltF: 0.96, hood: 0.9, nose: 0.7, gA: 0.12, gB: 0.42, gC: 2.4, gD: 2.95, roof: 1.5, wr: 0.31, axR: 0.75, axF: 3.3 },
    suv: { L: 4.85, W: 1.95, clear: 0.3, tail: 1.25, belt: 1.25, beltF: 1.18, hood: 1.12, nose: 0.92, gA: 0.2, gB: 0.45, gC: 3.0, gD: 3.52, roof: 1.82, wr: 0.38, axR: 0.95, axF: 3.88 }
  };
  function carParts(sp, withWheels) {
    const parts = [];
    const { L, W } = sp;
    // Extrude a side profile across the width; taper(y) narrows it with height (tumblehome).
    const extrude = (shape, depth, bev, mat, taper) => {
      const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, curveSegments: 12 });
      if (taper) {
        const pa = g.attributes.position;
        for (let i = 0; i < pa.count; i++) pa.setZ(i, (pa.getZ(i) - depth / 2) * taper(pa.getY(i)) + depth / 2);
      }

    };

    const body = new THREE.Shape();
    body.moveTo(0.1, y0);
    body.lineTo(0.02, y0 + 0.12);
    body.lineTo(0, sp.tail - 0.1);
    body.quadraticCurveTo(0, sp.tail, 0.14, sp.tail);
    body.lineTo(sp.gA, sp.belt);
    body.lineTo(sp.gD, sp.beltF);
    body.quadraticCurveTo(L - 0.5, sp.hood, L - 0.12, sp.nose + 0.04);
    body.quadraticCurveTo(L, sp.nose, L, sp.nose - 0.1);
    body.lineTo(L - 0.02, y0 + 0.12);
    body.lineTo(L - 0.12, y0);
    body.lineTo(sp.axF + ar, y0);
    body.lineTo(sp.axF + ar, sp.wr);
    body.absarc(sp.axF, sp.wr, ar, 0, Math.PI, false);
    body.lineTo(sp.axF - ar, y0);
    body.lineTo(sp.axR + ar, y0);
    body.lineTo(sp.axR + ar, sp.wr);
    body.absarc(sp.axR, sp.wr, ar, 0, Math.PI, false);
    body.lineTo(sp.axR - ar, y0);
    body.closePath();
    const sstep = (a, b, y) => smooth(clamp((y - a) / (b - a), 0, 1));
    extrude(body, W - 0.12, 0.06, 0, (y) => 1 - 0.05 * sstep(sp.belt - 0.35, sp.belt + 0.05, y) - 0.05 * sstep(y0 + 0.2, y0 - 0.05, y));
    const gw = W * 0.9;
    const canopy = (y) => lerp(0.97, 0.74, clamp((y - sp.belt) / (sp.roof - sp.belt), 0, 1.1));
    const glass = new THREE.Shape();
    glass.moveTo(sp.gA - 0.05, sp.belt - 0.04);
    glass.quadraticCurveTo(sp.gB - 0.1, sp.roof - 0.02, sp.gB + 0.15, sp.roof);
    glass.lineTo(sp.gC - 0.1, sp.roof);
    glass.quadraticCurveTo(sp.gC + 0.12, sp.roof - 0.02, sp.gD + 0.05, sp.beltF - 0.04);
    glass.closePath();
    extrude(glass, gw - 0.08, 0.04, 1, canopy);
    const roof = new THREE.Shape();
    roof.moveTo(sp.gB + 0.1, sp.roof - 0.03);
    roof.lineTo(sp.gC - 0.05, sp.roof - 0.03);
    roof.lineTo(sp.gC - 0.12, sp.roof + 0.025);
    roof.lineTo(sp.gB + 0.16, sp.roof + 0.025);
    roof.closePath();
    extrude(roof, gw - 0.02, 0.03, 0, canopy);
    const rz = L / 2 + 0.065;                           // rear face, past the bevel
    const ty = sp.tail - 0.14;
    if (sp.bar) {
      parts.push(box(W * 0.84, 0.07, 0.03, 0, ty, rz, 3));
      parts.push(box(W * 0.9, 0.02, 0.03, 0, ty - 0.08, rz - 0.005, 2));
    } else {
      parts.push(box(0.42, 0.13, 0.03, -W / 2 + 0.3, ty, rz, 3), box(0.42, 0.13, 0.03, W / 2 - 0.3, ty, rz, 3));
      parts.push(box(0.14, 0.08, 0.035, -W / 2 + 0.12, ty - 0.1, rz - 0.01, 3), box(0.14, 0.08, 0.035, W / 2 - 0.12, ty - 0.1, rz - 0.01, 3));
    }
    parts.push(box(0.52, 0.12, 0.02, 0, (y0 + ty) / 2 - 0.02, rz + 0.005, 4));
    parts.push(box(W * 0.92, 0.14, 0.12, 0, y0 + 0.08, rz - 0.04, 2));             // diffuser / bumper lip
    parts.push(box(0.12, 0.09, 0.18, -W / 2 - 0.02, sp.beltF + 0.05, -(sp.gD - L / 2) + 0.1, 2), box(0.12, 0.09, 0.18, W / 2 + 0.02, sp.beltF + 0.05, -(sp.gD - L / 2) + 0.1, 2)); // mirrors
    if (sp.spoiler) {

      parts.push(box(0.05, 0.2, 0.12, -W * 0.3, sp.tail + 0.1, L / 2 - 0.2, 2), box(0.05, 0.2, 0.12, W * 0.3, sp.tail + 0.1, L / 2 - 0.2, 2));
      const ex = new THREE.CylinderGeometry(0.055, 0.055, 0.14, 12).rotateX(Math.PI / 2);
      parts.push({ geo: ex, mat: 2, m: mat4(-0.32, y0 + 0.14, rz) }, { geo: ex, mat: 2, m: mat4(0.32, y0 + 0.14, rz) });
    }

  }
  // Box trucks and semis: tail lights, reflective tape and an under-ride bar are what you see most.

  const TRUCK_SPECS = {
    semi: { L: 15, W: 2.5, H: 4.0, boxL: 12.4, cabL: 2.3, axles: [1.4, 2.7, 9.4] },
    box: { L: 7.6, W: 2.4, H: 3.5, boxL: 5.4, cabL: 2.0, axles: [1.6] }
  };
  const MODELS = {};
  for (const k in CAR_SPECS) MODELS[k] = { geo: merge(carParts(CAR_SPECS[k], true)), len: CAR_SPECS[k].L, hw: CAR_SPECS[k].W / 2, tailY: CAR_SPECS[k].tail - 0.14, tailX: CAR_SPECS[k].W / 2 - 0.3, truck: false };

  function laneFree(l, s, back, front, self) {

  /* ---------------- state ---------------- */

  /* ---------------- autopilot (attract mode) ---------------- */
  let pilotLane = 1;
  function pilot(maxV) {
    let kMax = 0;
    for (let d = 10; d <= 40 + v * 2.4; d += 8) kMax = Math.max(kMax, Math.abs(curvAt(pS + d)));
    const vSafe = kMax > 1e-4 ? Math.sqrt(LAT_MAX * 0.78 / (kMax * CF)) : MAX_V;
    const cur = laneOf(pX);
    const alongside = (l) => {
      for (const c of cars) {
        const ds = c.s - pS;
        if (ds > -c.len / 2 - 3 && ds < c.len / 2 + 5 + v * 0.12 && Math.abs(c.x - laneX(l)) < c.hw + CAR_HW + 0.3) return true;
      }
      for (const w of works) if (w.lane === l && w.s0 < pS + 12 + v * 0.3 && w.s1 > pS - 4) return true;
      return false;
    };
    const clearOf = (l) => {
      let clear = 320;
      for (const c of cars) {
        const ds = c.s - pS;
        if (ds < -4 || ds > 320) continue;
        if (Math.abs(c.x - laneX(l)) < c.hw + 1.5 || (c.moving && Math.abs(laneX(c.tLane) - laneX(l)) < 0.1)) clear = Math.min(clear, ds - c.len / 2 - 3 + c.v * 3);
      }
      for (const w of works) if (w.lane === l && w.s1 > pS - 5 && w.s0 < pS + 320) clear = Math.min(clear, w.s0 - pS - 4);
      return clear;
    };
    if (pilotLane < 0 || pilotLane >= LANES) pilotLane = cur;
    const keep = clearOf(pilotLane);
    let best = pilotLane, bestScore = keep + 25;
    for (let l = 0; l < LANES; l++) {
      if (l === pilotLane) continue;
      const step = Math.sign(l - cur);
      let ok = true;
      for (let m = cur + step; step && m !== l + step; m += step) if (alongside(m)) ok = false;
      if (!ok) continue;
      const sc = clearOf(l) - Math.abs(l - cur) * 8;
      if (sc > bestScore) { bestScore = sc; best = l; }
    }
    pilotLane = best;
    const tx = laneX(best);
    const k = curvAt(pS);
    const want = (tx - pX) * 3 + k * v * v * CF;
    const grip = LAT_MAX * clamp(v / 20, 0.05, 1);
    const st = clamp(want / grip, -1, 1);
    // brake just enough to sit behind whatever is ahead in our path
    let target = Math.min(vSafe, maxV);
    for (const c of cars) {
      const gap = c.s - pS - (c.len + CAR_LEN) / 2;
      if (gap > -1 && gap < 160 && Math.abs(c.x - pX) < c.hw + CAR_HW + 0.35) target = Math.min(target, c.v + Math.sqrt(2 * 20 * Math.max(0, gap - 5)));
    }
    for (const w of works) {
      const gap = w.s0 - pS - CAR_LEN / 2;
      if (gap > -w.s1 + w.s0 && gap < 160 && Math.abs(w.x - pX) < LANE_W / 2 + CAR_HW - 0.4) target = Math.min(target, Math.sqrt(2 * 20 * Math.max(0, gap - 4)));
    }
    return { steer: Math.abs(st) < 0.08 ? 0 : st, accel: v < target - 0.5 ? 1 : 0, brake: v > target + 2 ? 1 : 0 };
  }

  const sv = new THREE.Vector3();

  function drive(dt, ctl) {
    const k = curvAt(pS);
    const vmax = MAX_V + DRAFT_V * draft;
    const ratio = v / MAX_V;
    let a;
    if (ctl.brake) a = -34;
    else if (ctl.accel) a = v < vmax ? 15.5 * (1 - Math.pow(v / vmax, 2.3)) + (v < 12 ? 5 : 0) : -4;
    else a = -(2.5 + 0.0005 * v * v);
    at(pS);
    a -= P.grade * 9.8 * 0.55;
    if (spinT > 0) { spinT -= dt; a = Math.min(a, -6); }
    v = clamp(v + a * dt, 0, MAX_V + DRAFT_V);

    // Steering: the car answers quickly, but corners push it wide in proportion to speed squared.
    const control = spinT > 0 ? 0.3 : 1;
    const target = ctl.steer * LAT_MAX * clamp(v / 20, 0, 1) * control;
    vx += (target - vx) * (1 - Math.exp(-dt * STEER_RESP));
    const push = k * v * v * CF;
    pX += (vx - push) * dt;
    slide = Math.max(0, Math.abs(push) - LAT_MAX * 0.8) / 6 + (ctl.brake && v > 30 ? 0.4 : 0);

    scrape = 0;
    if (Math.abs(pX) > X_LIMIT) {
      const side = Math.sign(pX);
      const into = (vx - push) * side;
      pX = side * X_LIMIT;
      if (into > 0) {
        if (into > 6 && running) { PA.shake(7, 0.2); PA.sfx("thud", { pitch: 0.9 }); }
        vx = -side * Math.min(into * 0.35, 4);
        scrape = 1;
        v = Math.max(0, v - (5 + v * 0.35) * dt);
      }
    }
    pS += v * dt;
    roll = lerp(roll, clamp(-(vx - push) * 0.006 + (ctl.steer * 0.02), -0.06, 0.06), 1 - Math.exp(-dt * 6));
    pitch = lerp(pitch, ctl.brake ? -0.025 : ctl.accel ? 0.012 * (1 - ratio) : 0, 1 - Math.exp(-dt * 5));
    wheelSpin += v * dt / PSPEC.wr;
  }

  function updateTraffic(dt, d) {
    const want = Math.round(Math.min(32, 13 + gates * 2 + d * 8));
    // recycle what fell far behind or ran far ahead
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      if (c.s < pS - 80 || c.s > pS + 1150) { releaseCar(c); cars.splice(i, 1); }
    }
    let tries = 0;
    while (cars.length < want && tries++ < 4) spawnCar(pS + rand(560, 840), d);

    const blinkRate = lerp(1.4, 0.8, d);
    for (const c of cars) {
      if (c.hitCd > 0) c.hitCd -= dt;
      // car-following: slow for the nearest thing ahead in our lane (cars, the player, road works)
      let gap = 1e9, leadV = c.cruise;
      for (const o of cars) {
        if (o === c) continue;
        const ds = o.s - c.s;
        if (ds <= 0 || ds > 120) continue;
        if (Math.abs(o.x - c.x) < o.hw + c.hw + 0.3 || (c.moving && Math.abs(o.x - laneX(c.tLane)) < o.hw + c.hw)) {
          const g = ds - (o.len + c.len) / 2;
          if (g < gap) { gap = g; leadV = o.v; }
        }
      }
      const pds = pS - c.s;
      if (pds > 0 && pds < 120 && Math.abs(pX - c.x) < CAR_HW + c.hw + 0.3) { const g = pds - (CAR_LEN + c.len) / 2; if (g < gap) { gap = g; leadV = v; } }
      let workAhead = false;
      for (const w of works) {
        if (w.s1 < c.s - 10 || w.s0 > c.s + 160) continue;
        if (Math.abs(w.x - c.x) < LANE_W * 0.7) { const g = w.s0 - c.s - c.len / 2 - 4; if (g > -c.len && g < gap) { gap = Math.max(0, g); leadV = 0; } workAhead = true; }
      }
      let vt = c.cruise;
      if (gap < 70) vt = Math.min(vt, leadV + Math.max(0, gap - 10) * 0.45);
      c.brake = vt < c.v - 0.6;
      c.v += clamp(vt - c.v, -12 * dt, 3 * dt);
      c.v = Math.max(0, c.v);

      c.think -= dt;
      if (!c.blinkT && !c.moving && c.think <= 0) {
        c.think = rand(1.2, 3.5);
        const blocked = workAhead || (gap < 50 && leadV < c.cruise - 2);
        // Some drivers pull into the player's lane as they close in from behind; they always signal first.
        const ahead = c.s - pS, pl = laneOf(pX);
        const cutIn = running && ahead > 25 && ahead < 90 && Math.abs(pl - c.lane) === 1 && Math.random() < 0.22 + d * 0.3 && laneFree(pl, c.s, 14, 26, c);
        if (cutIn) { c.next = pl; c.blinkT = blinkRate * rand(0.9, 1.15); }
        else if (blocked || Math.random() < 0.12 + d * 0.18) {
          const opts = [c.lane - 1, c.lane + 1].filter((l) => l >= 0 && l < LANES && laneFree(l, c.s, 14, 26, c));
          if (opts.length) { c.next = PA.choice(opts); c.blinkT = blinkRate * rand(0.85, 1.2); }
        }
      }
      if (c.blinkT > 0) {
        c.blinkT -= dt;
        if (c.blinkT <= 0) { c.blinkT = 0; if (laneFree(c.next, c.s, 6, 14, c)) { c.tLane = c.next; c.moving = true; } }
      }
      if (c.moving) {
        const tx = laneX(c.tLane), step = (c.model.truck ? 1.6 : 2.3) * dt;
        c.x += clamp(tx - c.x, -step, step);
        if (Math.abs(tx - c.x) < 0.01) { c.x = tx; c.lane = c.tLane; c.moving = false; }
      }
      c.s += c.v * dt;
    }
  }

  function collide(dt) {
    for (const c of cars) {
      const ds = c.s - pS, dx = c.x - pX;
      const ovS = Math.abs(ds) < (c.len + CAR_LEN) / 2, ovX = Math.abs(dx) < c.hw + CAR_HW;
      if (ovS && ovX && c.hitCd <= 0) {
        const longGap = Math.abs(c.prevDs) - (c.len + CAR_LEN) / 2;
        const latGap = Math.abs(c.prevDx) - (c.hw + CAR_HW);
        if (longGap > latGap) {
          if (ds > 0) crashInto(c);
          else { c.v = Math.min(c.v, v * 0.8); c.s = pS - (c.len + CAR_LEN) / 2 - 0.05; v += 3; c.hitCd = 0.6; if (running) { PA.shake(8, 0.25); PA.sfx("thud"); } }
        } else sideSwipe(c, Math.sign(pX - c.x) || 1);
      }
      // Passing a car close and fast scores a near miss.
      if (!c.passed && c.prevDs > 0 && ds <= 0) {
        c.passed = true;
        const gap = Math.abs(dx) - (c.hw + CAR_HW);
        if (running && gap < 1.1 && v > 42 && c.hitCd <= 0 && v > c.v + 8) nearMiss(c);
      }
      if (ds > 2) c.passed = false;
      c.prevDs = c.s - pS; c.prevDx = c.x - pX;
    }
    // Road works: the arrow board is solid; the cones scrub off speed.
    for (const w of works) {
      if (w.s1 < pS - 5) continue;
      if (w.s0 > pS + 10) break;
      if (Math.abs(pX - w.x) > LANE_W / 2 + CAR_HW - 0.5) continue;
      const front = pS + CAR_LEN / 2;
      if (front > w.s0 && pS - CAR_LEN / 2 < w.s0 + 2.6 && Math.abs(pX - w.x) < 1.1 + CAR_HW) {
        crashInto({ s: w.s0 + 1.3, len: 2.6, v: 0, hitCd: 0 });
        v = Math.min(v, 8);
      } else if (running && pS > w.s0 + 2.6 && pS < w.s1 && v > 22) {
        v -= 30 * dt;
        combo = 0;
        coneT -= dt;
        if (coneT <= 0) { coneT = 0.18; PA.sfx("thud", { pitch: 1.6 }); sparksAt(0, 0.3, -CAR_LEN / 2, 8, ["#ff7a1a", "#fff"]); PA.shake(4, 0.12); }
      }
    }
  }

  function updateDraft(dt) {
    let inWake = false;
    for (const c of cars) {
      const g = c.s - pS - (c.len + CAR_LEN) / 2;
      const range = c.model.truck ? 38 : 24;
      if (g > 2 && g < range && Math.abs(c.x - pX) < c.hw + 0.4 && v > 33) { inWake = true; break; }
    }
    if (inWake) { draft = Math.min(1, draft + dt / 1.1); draftHold = 1.6; }
    else if (draftHold > 0) draftHold -= dt;
    else draft = Math.max(0, draft - dt / 1.2);
  }

  function update(dt, t) {
    fx.update(dt); texts.update(dt);
    if (!T.n) return;
    const d = difficulty();

    if (PA.state !== "play") {
      attractT += dt;
      const ctl = pilot(MAX_V * 0.8);
      steer = ctl.steer; accel = ctl.accel; brake = ctl.brake;
      drive(dt, ctl);
      updateTraffic(dt, d);
      collide(dt);
      updateChunks(pS - 6);
      engineAudio(false);
      return;
    }
    if (!running) {
      // after time-up the car rolls to a stop
      steer = accel = brake = 0;
      drive(dt, { steer: 0, accel: 0, brake: 0 });
      updateTraffic(dt, d);
      updateChunks(pS - 6);
      engineAudio(false);
      return;
    }

    readInput();
    const ctl = { steer, accel, brake };
    updateDraft(dt);
    const s0 = pS;
    drive(dt, ctl);
    topV = Math.max(topV, v);
    updateTraffic(dt, d);
    collide(dt);
    score += (pS - s0) * 0.55 * (1 + v / MAX_V);
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    while (pS >= nextCp) passCheckpoint();
    updateChunks(pS - 6);

    if (scrape && Math.random() < dt * 30) sparksAt(Math.sign(pX) * CAR_HW, 0.4, rand(-1.5, 1.5), 3, ["#ffd36b", "#fff"]);
    if (slide > 0.3 && v > 25 && Math.random() < dt * 25) sparksAt(rand(-0.8, 0.8), 0.1, CAR_LEN / 2 - 0.4, 2, ["rgba(200,200,220,.6)", "rgba(160,160,180,.5)"]);

    timer -= dt;
    if (timer <= 0) { timer = 0; paintHud(); endRun(); return; }
    PA.music.intensity(clamp(v / MAX_V, 0.1, 1));
    engineAudio(true);
    paintHud();
  }

  /* ---------------- engine audio ---------------- */
  // A continuous synth engine (two oscillators through a low-pass) with a six-speed gearbox, plus
  // wind and tyre noise. It runs on its own bus so it can follow the sound settings smoothly.
  const GEARS = [0, 17, 31, 45, 59, 73, 95];
  const eng = { a: null };
  function engineAudio(on) {
    if (!eng.a) {
      if (!on) return;
      const a = PA.audio();
      if (!a) return;
      eng.a = a;
      eng.bus = a.createGain(); eng.bus.gain.value = 0; eng.bus.connect(a.destination);
      eng.lp = a.createBiquadFilter(); eng.lp.type = "lowpass"; eng.lp.Q.value = 3; eng.lp.connect(eng.bus);
      eng.o1 = a.createOscillator(); eng.o1.type = "sawtooth";
      eng.o2 = a.createOscillator(); eng.o2.type = "square";
      const g1 = a.createGain(); g1.gain.value = 0.5; const g2 = a.createGain(); g2.gain.value = 0.28;
      eng.o1.connect(g1); g1.connect(eng.lp); eng.o2.connect(g2); g2.connect(eng.lp);
      eng.o1.start(); eng.o2.start();
      const nb = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = a.createBufferSource(); ns.buffer = nb; ns.loop = true; ns.start();
      eng.wf = a.createBiquadFilter(); eng.wf.type = "bandpass"; eng.wf.frequency.value = 600; eng.wf.Q.value = 0.5;
      eng.wg = a.createGain(); eng.wg.gain.value = 0;
      ns.connect(eng.wf); eng.wf.connect(eng.wg); eng.wg.connect(eng.bus);
      eng.sf = a.createBiquadFilter(); eng.sf.type = "bandpass"; eng.sf.frequency.value = 2400; eng.sf.Q.value = 7;
      eng.sg = a.createGain(); eng.sg.gain.value = 0;
      ns.connect(eng.sf); eng.sf.connect(eng.sg); eng.sg.connect(eng.bus);
    }
    const a = eng.a, now = a.currentTime;
    const live = on && PA.sfxOn && PA.sfxVol > 0 && !PA.isPaused();
    eng.bus.gain.setTargetAtTime(live ? 0.55 * PA.sfxVol : 0, now, 0.08);
    if (!live) return;
    let g = 1;
    while (g < GEARS.length - 1 && v > GEARS[g]) g++;
    const lo = GEARS[g - 1] * 0.62, frac = clamp((v - lo) / (GEARS[g] - lo), 0, 1);
    const rpm = 1300 + frac * 6200 + (accel ? 250 : 0);
    const f = rpm / 60 * 2;
    eng.o1.frequency.setTargetAtTime(f, now, 0.03);
    eng.o2.frequency.setTargetAtTime(f / 2, now, 0.03);
    eng.lp.frequency.setTargetAtTime(220 + f * 3.2 + (accel ? 700 : 0), now, 0.05);
    const ratio = v / MAX_V;
    eng.wg.gain.setTargetAtTime(0.05 * ratio * ratio + draft * 0.03, now, 0.1);
    eng.wf.frequency.setTargetAtTime(400 + ratio * 900, now, 0.1);
    eng.sg.gain.setTargetAtTime(clamp(slide, 0, 1) * 0.045 + scrape * 0.05, now, 0.05);
    eng.lp.Q.value = accel ? 4 : 2;
  }
  PA.onPause && PA.onPause(() => engineAudio(false));

  /* ---------------- rendering ---------------- */
  const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
  function place(obj, s, x, yaw, lift) {
    at(s);
    obj.position.set(P.x + Math.cos(P.h) * x, P.y + (lift || 0), P.z + Math.sin(P.h) * x);
    obj.rotation.set(Math.atan(P.grade), -(P.h + yaw), 0);
  }

  function renderWorld(t, dt) {
    // player
    const yaw = v > 1 ? Math.atan2(vx - curvAt(pS) * v * v * CF, Math.max(v, 8)) * 0.6 : 0;
    const wob = spinT > 0 ? Math.sin(spinT * 30) * 0.18 * spinT : 0;
    place(player, pS, pX, yaw + wob, 0);
    pBody.rotation.set(pitch, 0, roll);
    pBody.position.y = Math.sin(t * 31) * 0.004 * (v / MAX_V);
    for (const w of wheels) {
      w.wm.rotation.x = -wheelSpin;
      w.pivot.rotation.y = w.front ? -steer * 0.32 * (spinT > 0 ? 0.3 : 1) : 0;
    }
    const braking = brake && (running || PA.state !== "play");
    pTail.color.setHex(braking ? 0xff2040 : 0xb0102a);
    for (const g of tailGlow) g.material.opacity = braking ? 1 : 0.45;
    const boost = draft > 0.05 || (accel && v > MAX_V * 0.92);
    for (const f of flame) { f.material.opacity = boost ? 0.6 + Math.random() * 0.4 : 0; const s = 0.4 + Math.random() * 0.25 + draft * 0.4; f.scale.set(s, s, 1); }
    underglow.material.opacity = 0.45 + Math.sin(t * 3) * 0.08;
    player.updateMatrixWorld();

    // traffic
    let gi = 0, si = 0;
    const blinkOn = (t * 2.4) % 1 < 0.5;
    for (const c of cars) {
      const m = c.mesh;
      const ly = c.moving ? Math.sign(laneX(c.tLane) - c.x) * 0.05 : 0;
      place(m, c.s, c.x, ly, 0);
      m.updateMatrixWorld();
      const blinking = c.blinkT > 0 || c.moving;
      const dir = c.moving ? Math.sign(laneX(c.tLane) - c.x) : Math.sign(c.next - c.lane);
      m.material[3] = c.brake ? VM.brake : VM.tail;
      if (si < SHADOWS) {
        dummy.position.copy(m.position); dummy.rotation.copy(m.rotation);
        dummy.translateY(0.04);
        dummy.scale.set(c.hw * 2.5, 1, c.len * 1.18);
        dummy.updateMatrix();
        shadows.setMatrixAt(si++, dummy.matrix);
      }
      if (gi + 4 <= GLOWS) {
        const z = c.len / 2 + 0.12, y = c.model.tailY;
        const lights = [[-c.model.tailX, y, c.brake ? 1 : 0.35, 0.05, 0.08], [c.model.tailX, y, c.brake ? 1 : 0.35, 0.05, 0.08]];
        lights.push([-c.hw + 0.12, y - 0.05, blinking && blinkOn && dir < 0 ? 1 : 0, 0.55, 0.05]);
        lights.push([c.hw - 0.12, y - 0.05, blinking && blinkOn && dir > 0 ? 1 : 0, 0.55, 0.05]);
        for (const [x, y2, r, g2, b2] of lights) {
          tmpV.set(x, y2, z).applyMatrix4(m.matrixWorld);
          glowPos[gi * 3] = tmpV.x; glowPos[gi * 3 + 1] = tmpV.y; glowPos[gi * 3 + 2] = tmpV.z;
          glowCol[gi * 3] = r; glowCol[gi * 3 + 1] = r * g2 * 2; glowCol[gi * 3 + 2] = r * b2;
          gi++;
        }
      }
    }
    for (let i = gi; i < GLOWS; i++) { glowCol[i * 3] = glowCol[i * 3 + 1] = glowCol[i * 3 + 2] = 0; }
    shadows.count = si;
    shadows.instanceMatrix.needsUpdate = true;
    glowGeo.attributes.position.needsUpdate = true;
    glowGeo.attributes.color.needsUpdate = true;
    glowGeo.setDrawRange(0, Math.max(gi, 1));

    // chase camera: behind and above the car, looking down the road
    const ratio = v / MAX_V;
    // Tall phone screens see less road side to side, so pull the camera back and widen the view.
    const tall = clamp((1 - camera.aspect) / 0.55, 0, 1);
    const back = 6.4 + ratio * 0.8 + tall * 2.6;
    world(pS - back, pX * 0.85, 2.15 - ratio * 0.15 + tall * 0.7, tmpV);
    world(pS + 16, pX * 0.55, 0.9, tmpV2);
    const sh = PA.shakeOffset();
    if (!camInit) { camPos.copy(tmpV); camLook.copy(tmpV2); camInit = true; }
    const kk = 1 - Math.exp(-dt * 16);
    camPos.lerp(tmpV, kk); camLook.lerp(tmpV2, 1 - Math.exp(-dt * 20));
    camera.position.copy(camPos);
    camera.position.y += sh.y * 0.01;
    camera.lookAt(camLook);
    camera.rotateZ(-roll * 0.6 + sh.x * 0.002);
    const fov = 56 + tall * 16 + ratio * 11 + draft * 4;
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }

    // backdrop follows the camera; the sun hangs low over the road ahead
    sky.position.copy(camera.position);
    stars.position.copy(camera.position);
    skyline.position.set(camera.position.x, camera.position.y + 100, camera.position.z);
    farGround.position.set(camera.position.x, camera.position.y - 34, camera.position.z);
    sun.position.copy(camera.position).addScaledVector(SUN_DIR, 1700);
    sun.lookAt(camera.position);
    dusk.position.copy(camera.position).addScaledVector(SUN_DIR, 100);
    dusk.target.position.copy(camera.position);

    // the four nearest street lamps ahead get real lights, fading in at the far end
    const camS = pS - back;
    const n0 = Math.ceil((camS - 10) / LAMP_GAP);
    for (let j = 0; j < STREET_N; j++) {
      const n = n0 + j, s = n * LAMP_GAP, side = n % 2 ? 1 : -1;
      world(s, side * (EDGE + 0.9 - 2.9), 9.2, streetLights[j].position);
      const far = clamp((STREET_N * LAMP_GAP - 10 - (s - camS)) / LAMP_GAP, 0, 1);
      streetLights[j].intensity = 200 * far;
    }
    M.beacon.opacity = 0.35 + 0.65 * (Math.sin(t * 3) > 0 ? 1 : 0);
    M.arrow.color.setScalar(Math.sin(t * 6) > 0 ? 1 : 0.15);
    M.arrowL.color.copy(M.arrow.color);
  }

  function drawOverlay(t) {
    ctx.clearRect(0, 0, W, H);
    const ratio = v / MAX_V;
    if (ratio > 0.8 || draft > 0.1) {
      const a = Math.max((ratio - 0.8) / 0.2, draft) * 0.5;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = draft > 0.1 ? "#8ee9ff" : "#e9e4ff";
      ctx.lineWidth = 1.5;
      const cx = W / 2, cy = H * 0.42;
      for (let i = 0; i < 18; i++) {
        const ang = (i / 18) * TAU + Math.floor(t * 9 + i) * 1.7;
        const r0 = Math.max(W, H) * (0.36 + ((t * 2.6 + i * 0.37) % 1) * 0.5);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0 * 0.6);
        ctx.lineTo(cx + Math.cos(ang) * (r0 + 70), cy + Math.sin(ang) * (r0 + 70) * 0.6);
        ctx.stroke();
      }
      ctx.restore();
    }
    fx.draw(ctx);
    texts.draw(ctx);
    if (PA.state !== "play" || !running) return;
    const fs = Math.round(clamp(W / 46, 13, 20));
    if (draft > 0.05) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "800 " + fs + "px Manrope, system-ui, sans-serif";
      ctx.fillStyle = "#8ee9ff";
      ctx.globalAlpha = 0.6 + 0.4 * draft;
      ctx.fillText("SLIPSTREAM", W / 2, H * 0.72);
      ctx.fillStyle = "rgba(142,233,255,.25)"; ctx.fillRect(W / 2 - 60, H * 0.72 + 8, 120, 5);
      ctx.fillStyle = "#8ee9ff"; ctx.fillRect(W / 2 - 60, H * 0.72 + 8, 120 * draft, 5);
      ctx.restore();
    }
    if (v < 3 && !PA.isTouch) {
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 3);
      ctx.textAlign = "center";
      ctx.font = "700 " + Math.round(clamp(W / 40, 14, 22)) + "px Manrope, system-ui, sans-serif";
      ctx.fillStyle = "#8ee9ff";
      ctx.fillText("Hold ▲ or W to drive", W / 2, H * 0.62);
      ctx.restore();
    }
    if (combo > 1 && comboT > 0) {
      ctx.save();
      ctx.textAlign = "right";
      ctx.globalAlpha = Math.min(1, comboT);
      ctx.font = "800 " + fs + "px Manrope, system-ui, sans-serif";
      ctx.fillStyle = "#ffd36b";
      ctx.fillText("COMBO x" + combo, W - 16, H * 0.24);
      ctx.restore();
    }
  }

  let lastT = 0;
  function render(t) {
    const dt = clamp(t - lastT, 0, 0.05);
    lastT = t;
    if (!T.n) return;
    renderWorld(t, dt || 1 / 60);
    renderer.render(scene, camera);
    drawOverlay(t);
  }

  newWorld();
  v = MAX_V * 0.55;

  window.__outrun = () => ({
    score: Math.floor(score),
    speed: v,
    kmh: Math.round(v * 3.6),
    playerX: pX,
    position: pS,
    gateTimer: timer,
    gates,
    nextGate: nextCp,
    distance: pS - START_S,
    traffic: cars.length,
    cars: cars.map((c) => ({ d: c.s - pS, x: c.x, v: c.v, kind: c.kind, blink: c.blinkT > 0 || c.moving })),
    works: works.filter((w) => w.s1 > pS && w.s0 < pS + 400).map((w) => ({ d: w.s0 - pS, end: w.s1 - pS, lane: w.lane })),
    curve: curvAt(pS),
    grade: at(pS + 40).grade - at(pS).grade,
    chunks: chunks.size,
    draft,
    nearMisses,
    crashes,
    over: overSent,
    running,
    steer, accel, brake,
    pilot: pilot(MAX_V + DRAFT_V),
    calls: renderer.info.render.calls,
    tris: renderer.info.render.triangles
  });

  PA.loop(update, render);
})();
</script>
