<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Neon Outrun — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#05070f;color:#f4f1ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#no-hud{opacity:0;transition:opacity .45s ease}
#no-hud.on{opacity:1}
#no-hud .timer b{color:#ffd27a}
#no-hud .timer.warn b{color:#ff7eb6;animation:noPulse .55s ease infinite alternate}
@keyframes noPulse{from{text-shadow:0 0 8px rgba(255,126,182,.4)}to{text-shadow:0 0 18px rgba(255,126,182,.95)}}
</style></head><body>
<canvas id="c" aria-label="Neon Outrun playfield"></canvas>
<div class="pa-hud" id="no-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat timer" id="s-time"><small>Time</small><b>35.0</b></div>
  <div class="pa-stat" id="s-spd"><small>km/h</small><b>0</b></div>
  <div class="pa-stat" id="s-gates"><small>Arches</small><b>0</b></div>
</div>
<script>
window.paConfig = {
  slug: "neon-outrun",
  title: "Neon Outrun",
  native: true,
  music: "arcade",
  unit: "points",
  controls: [
    ["← → / A D", "Steer"],
    ["↑ / W", "Accelerate"],
    ["↓ / S / Space", "Brake"],
    ["Touch", "◀ ▶ steer, ▼ brake (auto throttle)"]
  ]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script>
(() => {
  "use strict";
  // Segment-projection road racer (the classic sprite-scaling technique): the track is a list of
  // short flat segments; each frame projects the next DRAW_SEG of them from the camera, accumulating
  // curve offsets so bends sweep across the screen, and clips anything a hill crest hides.
  const TAU = Math.PI * 2;
  const { rand, randInt, clamp, lerp } = PA;
  const COL = {
    skyTop: "#070a22",
    skyMid: "#1a0b36",
    skyBot: "#4a1450",
    fog: "#2a0f3e",
    grass: "#0b1026",
    grassAlt: "#0e1430",
    grid: "rgba(142,233,255,.22)",
    rumble: "#ff5ca8",
    rumbleAlt: "#c4a6ff",
    road: "#161c3c",
    roadAlt: "#1a2146",
    lane: "rgba(244,241,255,.55)",
    arch: "#8ee9ff",
    archAlt: "#ffd36b",
    car: "#8ee9ff",
    carCore: "#e8fbff",
    traffic: ["#ffd36b", "#7ee7a8", "#ff7eb6", "#c4a6ff", "#ff9f5c"]
  };

  const SEG_LEN = 200;            // world units per segment
  const RUMBLE = 3;               // segments per rumble stripe
  const ROAD_W = 2000;            // half the road width, world units
  const LANES = 3;
  const CAM_H = 1000;
  const CAM_DEPTH = 1 / Math.tan((100 / 2) * Math.PI / 180);
  const PLAYER_Z = CAM_H * CAM_DEPTH;   // player's distance in front of the camera
  const DRAW_SEG = 300;
  const FOG = 5;
  const MAX_SPEED = SEG_LEN * 60; // 60 segments a second at full throttle
  const ACCEL = MAX_SPEED / 5;
  const BRAKE = -MAX_SPEED;
  const DECEL = -MAX_SPEED / 5;
  const OFF_DECEL = -MAX_SPEED / 2;
  const OFF_LIMIT = MAX_SPEED / 4;
  const CENTRIFUGAL = 0.3;
  const KMH = 290;                // speedometer reading at MAX_SPEED
  const CAR_W = 0.3;              // car width in road half-widths
  const CP_SEGS = 1100;           // segments between checkpoint arches
  const START_TIME = 35;

  let W = 0, H = 0, DPR = 1, XS = 1, YS = 1, horizon = 0;
  let sky = null, ridge = null, city = null, stars = [];
  let segments = [], trackLength = 0;
  let position = 0, playerX = 0, playerY = 0, speed = 0;
  let skyOff = 0, ridgeOff = 0, cityOff = 0;
  let odo = 0, nextCp = 0, gates = 0, timer = START_TIME;
  let score = 0, combo = 0, comboT = 0, nearMisses = 0, topSpeed = 0, crashes = 0;
  let cars = [], overSent = false, spinT = 0, engineT = 0;
  let steer = 0, accel = 0, brake = 0, lean = 0;
  let attractT = 0;

  const view = PA.canvas(document.getElementById("c"), { onResize: layout });
  const ctx = view.ctx;
  const fx = new PA.Particles(700), texts = new PA.Texts();
  const hud = document.getElementById("no-hud");

  /* ---------------- layout + backdrop ---------------- */
  function layout(v) {
    W = v.w; H = v.h; DPR = v.dpr;
    XS = Math.max(W, H * 0.85) / 2;           // horizontal projection scale
    YS = Math.min(H * 0.5, XS * 0.8);         // vertical projection scale (flatter on tall phones)
    horizon = Math.round(H - YS);
    buildBackdrop();
  }

  function layer(w, h, paint) {
    const cv = document.createElement("canvas");
    cv.width = Math.ceil(w * DPR); cv.height = Math.ceil(h * DPR);
    const g = cv.getContext("2d");
    g.scale(DPR, DPR);
    paint(g, w, h);
    return { cv, w, h };
  }

  function buildBackdrop() {
    sky = layer(W, Math.max(1, horizon + 2), (g, w, h) => {
      const lg = g.createLinearGradient(0, 0, 0, h);
      lg.addColorStop(0, COL.skyTop);
      lg.addColorStop(0.6, COL.skyMid);
      lg.addColorStop(1, COL.skyBot);
      g.fillStyle = lg; g.fillRect(0, 0, w, h);
    });
    stars = [];
    const n = Math.min(260, Math.round(W * horizon / 3800));
    for (let i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random() * 0.8, big: Math.random() < 0.3, ph: rand(TAU) });
    // Mountain ridge and city skyline are tiled strips (two screens wide) that scroll with the curves.
    const rw = Math.max(W, 600) * 2, rh = Math.max(40, YS * 0.5);
    ridge = layer(rw, rh, (g, w, h) => {
      g.beginPath(); g.moveTo(0, h);
      let x = 0;
      const peaks = [];
      while (x < w) { peaks.push([x, h * rand(0.15, 0.75)]); x += rand(w * 0.03, w * 0.08); }
      peaks.push([w, peaks[0][1]]);
      peaks.forEach(([px, py]) => g.lineTo(px, py));
      g.lineTo(w, h); g.closePath();
      const fill = g.createLinearGradient(0, 0, 0, h);
      fill.addColorStop(0, "#2b1450"); fill.addColorStop(1, "#120a2c");
      g.fillStyle = fill; g.fill();
      g.strokeStyle = "rgba(255,92,168,.75)"; g.lineWidth = 1.5;
      g.beginPath(); peaks.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py))); g.stroke();
    });
    const cw = Math.max(W, 600) * 2, ch = Math.max(30, YS * 0.32);
    city = layer(cw, ch, (g, w, h) => {
      let x = 0;
      while (x < w) {
        const bw = rand(14, 42), bh = h * rand(0.25, 1);
        g.fillStyle = "#0b0a22";
        g.fillRect(x, h - bh, bw, bh);
        g.fillStyle = Math.random() < 0.5 ? "rgba(142,233,255,.55)" : "rgba(255,211,107,.5)";
        for (let wy = h - bh + 4; wy < h - 3; wy += 6) {
          for (let wx = x + 3; wx < x + bw - 3; wx += 5) if (Math.random() < 0.35) g.fillRect(wx, wy, 2, 2);
        }
        x += bw + rand(0, 6);
      }
    });
  }

  /* ---------------- track ---------------- */
  const easeIn = (a, b, p) => a + (b - a) * Math.pow(p, 2);
  const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
  const lastY = () => (segments.length ? segments[segments.length - 1].p2.world.y : 0);

  function addSegment(curve, y) {
    const n = segments.length;
    segments.push({
      index: n,
      p1: { world: { y: lastY(), z: n * SEG_LEN }, camera: {}, screen: {} },
      p2: { world: { y, z: (n + 1) * SEG_LEN }, camera: {}, screen: {} },
      curve,
      sprites: [],
      cars: [],
      dark: Math.floor(n / RUMBLE) % 2 === 1,
      clip: 0,
      fog: 1
    });
  }

  function addRoad(enter, hold, leave, curve, hill) {
    const y0 = lastY(), y1 = y0 + hill * SEG_LEN, total = enter + hold + leave;
    for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(y0, y1, n / total));
    for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(y0, y1, (enter + n) / total));
    for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(y0, y1, (enter + hold + n) / total));
  }

  const C = { EASY: 2, MED: 4, HARD: 6 };
  const HILL = { LOW: 20, MED: 40, HIGH: 60 };

  function buildTrack() {
    segments = [];
    addRoad(60, 60, 60, 0, 0);                         // start straight
    addRoad(50, 50, 50, C.EASY, HILL.LOW);
    addRoad(50, 60, 50, -C.MED, 0);
    addRoad(40, 40, 40, 0, HILL.MED);
    addRoad(40, 40, 40, 0, -HILL.MED);
    addRoad(50, 80, 50, C.HARD, 0);
    // S-bends over rolling hills
    for (let i = 0; i < 4; i++) addRoad(30, 30, 30, (i % 2 ? -1 : 1) * C.MED, (i % 2 ? -1 : 1) * HILL.LOW);
    addRoad(100, 100, 100, 0, 0);
    while (segments.length < 9000) {
      const kind = randInt(0, 6);
      const dir = Math.random() < 0.5 ? -1 : 1;
      if (kind === 0) addRoad(80, randInt(60, 140), 80, 0, 0);
      else if (kind === 1) addRoad(50, randInt(40, 90), 50, dir * PA.choice([C.EASY, C.MED]), 0);
      else if (kind === 2) addRoad(50, randInt(50, 100), 50, dir * C.HARD, 0);
      else if (kind === 3) addRoad(40, 40, 40, 0, PA.choice([HILL.MED, HILL.HIGH, -HILL.MED]));
      else if (kind === 4) addRoad(40, 50, 40, dir * C.MED, rand(-HILL.MED, HILL.MED));
      else { for (let i = 0; i < 3; i++) addRoad(25, 25, 25, (i % 2 ? -dir : dir) * C.MED, (i % 2 ? -1 : 1) * HILL.LOW); }
    }
    addRoad(150, 150, 150, -C.EASY, -lastY() / SEG_LEN);    // ease back to ground level so the loop joins
    addRoad(80, 60, 80, 0, 0);
    trackLength = segments.length * SEG_LEN;

    // Roadside scenery
    for (let i = 20; i < segments.length; i++) {
      const s = segments[i];
      if (i % 8 === 0 && Math.random() < 0.75) s.sprites.push({ kind: "palm", offset: (Math.random() < 0.5 ? -1 : 1) * rand(1.25, 2.6), scale: rand(0.85, 1.2) });
      if (i % 20 === 0) s.sprites.push({ kind: "lamp", offset: -1.18 }, { kind: "lamp", offset: 1.18 });
      if (i % 55 === 0 && Math.random() < 0.6) s.sprites.push({ kind: "sign", offset: (Math.random() < 0.5 ? -1 : 1) * rand(1.35, 1.7), label: PA.choice(["OUTRUN", "NEO 88", "SUNSET", "TURBO", "▲ RUN", "PROMPT"]) });
      if (Math.abs(s.curve) >= C.MED && i % 4 === 0) s.sprites.push({ kind: "chevron", offset: s.curve > 0 ? 1.25 : -1.25, dir: s.curve > 0 ? -1 : 1 });
    }
  }

  const findSegment = (z) => segments[Math.floor(z / SEG_LEN) % segments.length];
  const wrapZ = (z) => ((z % trackLength) + trackLength) % trackLength;
  const pct = (n, total) => (n % total) / total;

  /* ---------------- traffic ---------------- */
  function laneX(l) { return (l - (LANES - 1) / 2) * 0.66; }

  function addCar(z) {
    const lane = randInt(0, LANES - 1);
    const car = {
      z: wrapZ(z),
      offset: laneX(lane),
      target: laneX(lane),
      speed: MAX_SPEED * rand(0.3, 0.62),
      hue: PA.choice(COL.traffic),
      kind: Math.random() < 0.25 ? "truck" : "car",
      passed: false,
      hit: false
    };
    findSegment(car.z).cars.push(car);
    cars.push(car);
  }

  function relZ(z) {             // distance of world z ahead of the player's car, wrapped to (-L/2, L/2]
    let d = wrapZ(z - (position + PLAYER_Z));
    if (d > trackLength / 2) d -= trackLength;
    return d;
  }

  function updateCars(dt) {
    const want = Math.min(26, 10 + gates * 2);
    while (cars.length < want) addCar(position + PLAYER_Z + SEG_LEN * rand(120, 280));
    for (const car of cars) {
      const oldSeg = findSegment(car.z);
      // Drift into a free lane now and then so the road keeps changing.
      if (Math.random() < dt * 0.12) car.target = laneX(randInt(0, LANES - 1));
      car.offset += clamp(car.target - car.offset, -dt * 0.5, dt * 0.5);
      car.z = wrapZ(car.z + car.speed * dt);
      const newSeg = findSegment(car.z);
      if (oldSeg !== newSeg) {
        oldSeg.cars.splice(oldSeg.cars.indexOf(car), 1);
        newSeg.cars.push(car);
      }
    }
    // Recycle cars that fell far behind: they reappear up the road.
    for (const car of cars) {
      if (relZ(car.z) < -SEG_LEN * 30) {
        const seg = findSegment(car.z);
        seg.cars.splice(seg.cars.indexOf(car), 1);
        car.z = wrapZ(position + PLAYER_Z + SEG_LEN * rand(160, 290));
        car.offset = car.target = laneX(randInt(0, LANES - 1));
        car.speed = MAX_SPEED * rand(0.3, 0.62) * (1 + Math.min(0.25, gates * 0.02));
        car.passed = car.hit = false;
        findSegment(car.z).cars.push(car);
      }
    }
  }

  /* ---------------- run lifecycle ---------------- */
  function clearRun() {
    buildTrack();
    position = 0; playerX = 0; speed = 0; skyOff = ridgeOff = cityOff = 0;
    odo = 0; gates = 0; nextCp = CP_SEGS * SEG_LEN; timer = START_TIME;
    score = 0; combo = 0; comboT = 0; nearMisses = 0; topSpeed = 0; crashes = 0;
    cars = []; overSent = false; spinT = 0; lean = 0;
    for (let i = 0; i < 12; i++) addCar(SEG_LEN * (60 + i * 22 + rand(0, 15)));
  }

  function reset() {
    clearRun();
    fx.clear(); texts.clear();
    PA.music.intensity(0.08);
    hud.classList.add("on");
    paintHud();
  }

  function paintHud() {
    PA.stat("s-score", Math.floor(score).toLocaleString());
    PA.stat("s-time", Math.max(0, timer).toFixed(1));
    PA.stat("s-spd", Math.round(speed / MAX_SPEED * KMH));
    PA.stat("s-gates", gates);
    const tEl = document.getElementById("s-time");
    if (tEl) tEl.classList.toggle("warn", timer < 8);
  }

  PA.onStart(reset);

  PA.touchControls({
    left: [
      { label: "◀", key: "ArrowLeft", code: "ArrowLeft", aria: "Steer left" },
      { label: "▶", key: "ArrowRight", code: "ArrowRight", aria: "Steer right" }
    ],
    right: [
      { label: "▲", key: "ArrowUp", code: "ArrowUp", aria: "Accelerate" },
      { label: "▼", key: "ArrowDown", code: "ArrowDown", aria: "Brake" }
    ]
  });

  function readInput() {
    steer = (PA.down("ArrowRight", "KeyD", "d", "D") ? 1 : 0) - (PA.down("ArrowLeft", "KeyA", "a", "A") ? 1 : 0);
    brake = PA.down("ArrowDown", "KeyS", "s", "S", " ") ? 1 : 0;
    // On touch screens the throttle is automatic unless braking, so a thumb on each side is enough.
    accel = (PA.down("ArrowUp", "KeyW", "w", "W") || (PA.isTouch && !brake)) ? 1 : 0;
  }

  function endRun() {
    if (overSent) return;
    overSent = true;
    PA.shake(10, 0.4);
    PA.sfx("gameover");
    hud.classList.remove("on");
    texts.add(W / 2, H * 0.38, "TIME UP", { color: COL.rumble, size: 34, life: 1.2, vy: -15 });
    PA.gameOver(Math.floor(score), {
      title: gates ? gates + (gates === 1 ? " arch cleared" : " arches cleared") : "Time up",
      stats: [
        ["Arches", gates],
        ["Distance", (odo / MAX_SPEED * KMH / 3600).toFixed(2) + " km"],
        ["Top speed", Math.round(topSpeed / MAX_SPEED * KMH) + " km/h"],
        ["Near misses", nearMisses]
      ]
    });
  }

  function crash(car) {
    crashes++;
    car.hit = true;
    speed = Math.min(speed, car.speed * 0.45);
    spinT = 0.45;
    combo = 0;
    PA.shake(16, 0.35);
    PA.hitstop(70);
    PA.flash("rgba(255,92,168,.4)", 260);
    PA.sfx("hit");
    fx.burst(W / 2, H - YS * 0.25, { n: 34, colors: [car.hue, COL.rumble, "#fff"], speed: 260, life: 0.6, size: 3, shape: "spark" });
    texts.add(W / 2, H * 0.6, "CRASH", { color: COL.rumble, size: 24, life: 0.9, vy: -40 });
  }

  function bumpScenery() {
    speed = Math.min(speed, MAX_SPEED / 5);
    playerX = clamp(playerX, -1.9, 1.9) * 0.9;
    PA.shake(9, 0.25);
    PA.sfx("thud");
    fx.burst(W / 2, H - YS * 0.2, { n: 14, colors: ["#c4a6ff", "#fff"], speed: 160, life: 0.4, size: 2.5 });
  }

  function nearMiss() {
    nearMisses++;
    combo = Math.min(combo + 1, 9);
    comboT = 2.5;
    const bonus = 150 * combo;
    score += bonus;
    PA.sfx("combo", { pitch: 1 + combo * 0.05 });
    texts.add(W / 2, H * 0.58, (combo > 1 ? "NEAR MISS x" + combo : "NEAR MISS") + "  +" + bonus, { color: COL.archAlt, size: 20, life: 0.8, vy: -50 });
  }

  function passCheckpoint() {
    gates++;
    const add = Math.max(13, 22 - gates * 0.75);
    timer = Math.min(timer + add, 60);
    const bonus = 1000 + gates * 200 + Math.round(timer * 20);
    score += bonus;
    nextCp += CP_SEGS * SEG_LEN;
    PA.sfx("levelup");
    PA.flash("rgba(142,233,255,.28)", 300);
    texts.add(W / 2, horizon + YS * 0.2, "CHECKPOINT  +" + add.toFixed(1) + "s", { color: COL.arch, size: 28, life: 1.3, vy: -20 });
    texts.add(W / 2, horizon + YS * 0.2 + 34, "+" + bonus.toLocaleString(), { color: COL.archAlt, size: 20, life: 1.3, vy: -20 });
    fx.burst(W / 2, horizon + YS * 0.3, { n: 40, colors: [COL.arch, COL.archAlt, COL.rumble], speed: 300, life: 0.8, size: 3 });
  }

  /* ---------------- simulation ---------------- */
  function drive(dt, auto) {
    const pSeg = findSegment(position + PLAYER_Z);
    const ratio = speed / MAX_SPEED;
    const dx = dt * 2 * Math.max(ratio, 0.12);

    if (auto) {
      // Attract mode: hold a lane and lean into the bends.
      attractT += dt;
      const aim = Math.sin(attractT * 0.35) * 0.45 + pSeg.curve * 0.05;
      steer = clamp((aim - playerX) * 3, -1, 1);
      accel = speed < MAX_SPEED * 0.72 ? 1 : 0;
      brake = 0;
    }

    position = wrapZ(position + speed * dt);
    const moved = speed * dt;

    if (spinT > 0) spinT -= dt;
    const control = spinT > 0 ? 0.25 : 1;
    playerX += steer * dx * control;
    playerX -= dx * ratio * pSeg.curve * CENTRIFUGAL;
    lean = lerp(lean, steer * Math.min(1, ratio * 2), dt * 8);

    if (brake) speed += BRAKE * dt;
    else if (accel) speed += ACCEL * dt * (1.15 - ratio * 0.4);
    else speed += DECEL * dt;

    const offRoad = Math.abs(playerX) > 1;
    if (offRoad && speed > OFF_LIMIT) speed += OFF_DECEL * dt;
    playerX = clamp(playerX, -2.6, 2.6);
    speed = clamp(speed, 0, MAX_SPEED);

    skyOff = (skyOff + 0.001 * pSeg.curve * moved / SEG_LEN) % 1;
    ridgeOff = (ridgeOff + 0.002 * pSeg.curve * moved / SEG_LEN) % 1;
    cityOff = (cityOff + 0.003 * pSeg.curve * moved / SEG_LEN) % 1;
    return { pSeg, moved, offRoad };
  }

  function update(dt, t) {
    fx.update(dt); texts.update(dt);
    if (!segments.length) return;

    if (PA.state !== "play") {
      drive(dt, true);
      updateCars(dt);
      return;
    }
    if (overSent) {
      speed = Math.max(0, speed + DECEL * 2 * dt);
      position = wrapZ(position + speed * dt);
      return;
    }

    readInput();
    const { pSeg, moved, offRoad } = drive(dt, false);
    odo += moved;
    topSpeed = Math.max(topSpeed, speed);
    score += moved / SEG_LEN * (1 + speed / MAX_SPEED);

    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

    // Roadside scenery is solid once you leave the tarmac.
    if (offRoad) {
      for (const sp of pSeg.sprites) {
        if (sp.kind === "chevron" || sp.kind === "lamp" || sp.kind === "palm" || sp.kind === "sign") {
          const w = sp.kind === "palm" ? 0.25 : 0.3;
          if (Math.abs(playerX - sp.offset) < (CAR_W + w) / 2 && Math.sign(playerX) === Math.sign(sp.offset)) { bumpScenery(); break; }
        }
      }
      if (speed > OFF_LIMIT * 0.6 && Math.random() < dt * 30) {
        fx.burst(W / 2 + rand(-40, 40), H - 6, { n: 2, colors: ["#c4a6ff", "#8ee9ff"], speed: 120, life: 0.35, size: 2, angle: -Math.PI / 2, spread: 1.2 });
      }
    }

    updateCars(dt);
    for (const car of cars) {
      const d = relZ(car.z);
      const overlapX = Math.abs(playerX - car.offset) < CAR_W * (car.kind === "truck" ? 1.05 : 0.95);
      if (!car.hit && speed > car.speed && d > 0 && d < SEG_LEN * 0.9 && overlapX) {
        crash(car);
        const back = d + SEG_LEN * 0.6;            // drop in behind the car you hit
        position = wrapZ(position - back);
        odo -= back;
        break;
      }
      if (!car.passed && d < 0 && d > -SEG_LEN * 3) {
        car.passed = true;
        if (!car.hit && Math.abs(playerX - car.offset) < CAR_W * 1.8 && speed > MAX_SPEED * 0.5) nearMiss();
      }
      if (d > SEG_LEN * 4) car.passed = false;
    }

    if (odo + PLAYER_Z >= nextCp) passCheckpoint();

    timer -= dt;
    if (timer <= 0) { timer = 0; paintHud(); endRun(); return; }

    // Engine: a short sawtooth pulse whose pitch follows speed.
    engineT -= dt;
    if (engineT <= 0 && speed > 10) {
      engineT = 0.07;
      PA.tone({ freq: 55 + (speed / MAX_SPEED) * 170, type: "sawtooth", dur: 0.08, vol: 0.018, filter: 900 });
    }
    PA.music.intensity(clamp(speed / MAX_SPEED, 0.08, 1));
    paintHud();
  }

  /* ---------------- rendering ---------------- */
  function project(p, camX, camY, camZ) {
    p.camera.x = (p.world.x || 0) - camX;
    p.camera.y = (p.world.y || 0) - camY;
    p.camera.z = (p.world.z || 0) - camZ;
    p.screen.scale = CAM_DEPTH / p.camera.z;
    p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * XS);
    p.screen.y = Math.round(horizon - p.screen.scale * p.camera.y * YS);
    p.screen.w = Math.round(p.screen.scale * ROAD_W * XS);
  }

  function poly(x1, y1, x2, y2, x3, y3, x4, y4, fill) {
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawSegment(seg) {
    const a = seg.p1.screen, b = seg.p2.screen;
    const r1 = a.w / 7, r2 = b.w / 7;
    ctx.fillStyle = seg.dark ? COL.grassAlt : COL.grass;
    ctx.fillRect(0, b.y, W, a.y - b.y + 1);
    if (!seg.dark && seg.index % 2 === 0) {                 // synthwave ground grid
      ctx.fillStyle = COL.grid;
      ctx.fillRect(0, b.y, W, Math.max(1, (a.y - b.y) * 0.12));
    }
    poly(a.x - a.w - r1, a.y, a.x - a.w, a.y, b.x - b.w, b.y, b.x - b.w - r2, b.y, seg.dark ? COL.rumbleAlt : COL.rumble);
    poly(a.x + a.w + r1, a.y, a.x + a.w, a.y, b.x + b.w, b.y, b.x + b.w + r2, b.y, seg.dark ? COL.rumbleAlt : COL.rumble);
    poly(a.x - a.w, a.y, a.x + a.w, a.y, b.x + b.w, b.y, b.x - b.w, b.y, seg.dark ? COL.roadAlt : COL.road);
    if (seg.index < 6 && seg.index > 2) {                   // chequered start line
      const n = 12;
      for (let i = 0; i < n; i++) {
        const t0 = -1 + (2 * i) / n, t1 = -1 + (2 * (i + 1)) / n;
        poly(a.x + a.w * t0, a.y, a.x + a.w * t1, a.y, b.x + b.w * t1, b.y, b.x + b.w * t0, b.y, (i + seg.index) % 2 ? "#f4f1ff" : "#161c3c");
      }
    } else if (!seg.dark) {
      const l1 = a.w / 40, l2 = b.w / 40;
      for (let lane = 1; lane < LANES; lane++) {
        const k = -1 + (2 * lane) / LANES;
        poly(a.x + a.w * k - l1 / 2, a.y, a.x + a.w * k + l1 / 2, a.y, b.x + b.w * k + l2 / 2, b.y, b.x + b.w * k - l2 / 2, b.y, COL.lane);
      }
    }
    if (seg.fog < 1) {
      ctx.globalAlpha = 1 - seg.fog;
      ctx.fillStyle = COL.fog;
      ctx.fillRect(0, b.y, W, a.y - b.y + 1);
      ctx.globalAlpha = 1;
    }
  }

  function drawBackdrop(t, pY) {
    if (sky) ctx.drawImage(sky.cv, 0, 0, W, sky.h);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.6 + s.ph));
      ctx.fillStyle = s.big ? "#fff" : "#8ee9ff";
      const sx = ((s.x - skyOff * 0.5) % 1 + 1) % 1 * W;
      ctx.fillRect(sx, s.y * horizon, s.big ? 2 : 1, s.big ? 2 : 1);
    }
    ctx.restore();

    const lift = clamp(pY * 0.00012 * YS, -YS * 0.15, YS * 0.15);
    // Striped synthwave sun
    const sr = Math.min(W, H) * 0.2;
    const sx = W / 2 - ((skyOff % 1) - 0.5) * W * 0.6 + W * 0.0;
    const sy = horizon - sr * 0.35 + lift * 0.3;
    ctx.save();
    const glow = ctx.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 2.4);
    glow.addColorStop(0, "rgba(255,92,168,.35)"); glow.addColorStop(1, "rgba(255,92,168,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, horizon);
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.clip();
    const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr);
    sg.addColorStop(0, "#ffe27a"); sg.addColorStop(0.55, "#ff7e6a"); sg.addColorStop(1, "#ff3d9a");
    ctx.fillStyle = sg; ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    ctx.fillStyle = COL.skyMid;
    for (let i = 0; i < 7; i++) {
      const yy = sy + sr * (0.05 + i * 0.14), hh = sr * (0.02 + i * 0.018);
      ctx.fillRect(sx - sr, yy, sr * 2, hh);
    }
    ctx.restore();

    const drawStrip = (L, off, y) => {
      if (!L) return;
      const x = -(((off % 1) + 1) % 1) * L.w;
      ctx.drawImage(L.cv, x, y, L.w, L.h);
      ctx.drawImage(L.cv, x + L.w, y, L.w, L.h);
      if (x + L.w * 2 < W) ctx.drawImage(L.cv, x + L.w * 2, y, L.w, L.h);
    };
    drawStrip(ridge, ridgeOff, horizon - ridge.h + 2 + lift * 0.6);
    drawStrip(city, cityOff, horizon - city.h + 2 + lift);
    // Ground below the horizon, so hill crests never show a gap
    ctx.fillStyle = COL.grass;
    ctx.fillRect(0, horizon + lift + 1, W, H);
  }

  function drawPalm(x, y, s) {
    const h = s * 3200, trunk = s * 120;
    ctx.fillStyle = "#1a1036";
    ctx.beginPath();
    ctx.moveTo(x - trunk, y);
    ctx.quadraticCurveTo(x - trunk * 0.4, y - h * 0.5, x + trunk * 1.5, y - h);
    ctx.lineTo(x + trunk * 2.2, y - h);
    ctx.quadraticCurveTo(x + trunk * 0.4, y - h * 0.5, x + trunk, y);
    ctx.fill();
    const cx = x + trunk * 1.85, cy = y - h;
    ctx.strokeStyle = "#ff5ca8";
    ctx.lineWidth = Math.max(1, s * 90);
    ctx.lineCap = "round";
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + (i - 3) * 0.55;
      const len = s * 1300;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(cx + Math.cos(a) * len * 0.6, cy + Math.sin(a) * len * 0.6 - s * 200, cx + Math.cos(a) * len, cy + Math.sin(a) * len * 0.5 + s * 500);
      ctx.stroke();
    }
  }

  function drawSprite(sp, seg, scale, x, y, t) {
    const k = scale * XS;                      // pixels per world unit at this depth
    if (k * 600 < 1) return;
    if (sp.kind === "palm") {
      drawPalm(x, y, k * (sp.scale || 1));
    } else if (sp.kind === "lamp") {
      const h = 2200 * k;
      ctx.fillStyle = "#24204a";
      ctx.fillRect(x - 40 * k, y - h, 80 * k, h);
      ctx.fillRect(x + (sp.offset < 0 ? 0 : -500 * k), y - h, 500 * k, 60 * k);
      ctx.fillStyle = "#ffd36b";
      ctx.shadowColor = "#ffd36b"; ctx.shadowBlur = clamp(300 * k, 4, 24);
      ctx.fillRect(x + (sp.offset < 0 ? 380 : -500) * k, y - h + 40 * k, 120 * k, 50 * k);
      ctx.shadowBlur = 0;
    } else if (sp.kind === "sign") {
      const w = 2200 * k, h = 900 * k, post = 1100 * k;
      ctx.fillStyle = "#1a1036";
      ctx.fillRect(x - w * 0.35, y - post, 80 * k, post);
      ctx.fillRect(x + w * 0.35 - 80 * k, y - post, 80 * k, post);
      ctx.fillStyle = "rgba(10,12,32,.95)";
      ctx.fillRect(x - w / 2, y - post - h, w, h);
      ctx.strokeStyle = COL.arch; ctx.lineWidth = Math.max(1, 50 * k);
      ctx.shadowColor = COL.arch; ctx.shadowBlur = clamp(200 * k, 2, 24);
      ctx.strokeRect(x - w / 2, y - post - h, w, h);
      ctx.shadowBlur = 0;
      if (h > 7) {
        ctx.font = "800 " + Math.round(h * 0.5) + "px Manrope, system-ui, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = COL.rumble;
        ctx.fillText(sp.label, x, y - post - h / 2);
      }
    } else if (sp.kind === "chevron") {
      const s = 700 * k;
      ctx.fillStyle = "#0a0c20";
      ctx.fillRect(x - s * 0.6, y - s * 1.6, s * 1.2, s * 0.9);
      ctx.fillStyle = COL.archAlt;
      ctx.beginPath();
      ctx.moveTo(x + sp.dir * s * 0.35, y - s * 1.55);
      ctx.lineTo(x - sp.dir * s * 0.25, y - s * 1.15);
      ctx.lineTo(x + sp.dir * s * 0.35, y - s * 0.75);
      ctx.lineTo(x + sp.dir * s * 0.1, y - s * 1.15);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#1a1036";
      ctx.fillRect(x - 30 * k, y - s * 0.7, 60 * k, s * 0.7);
    } else if (sp.kind === "arch") {
      const half = (ROAD_W * 1.3) * k, h = 2600 * k, pillar = 160 * k;
      const pulse = 0.75 + 0.25 * Math.sin(t * 6);
      ctx.save();
      ctx.shadowColor = COL.arch; ctx.shadowBlur = clamp(400 * k, 6, 30);
      ctx.fillStyle = "#101634";
      ctx.fillRect(x - half - pillar, y - h, pillar, h);
      ctx.fillRect(x + half, y - h, pillar, h);
      ctx.fillRect(x - half - pillar, y - h - 500 * k, half * 2 + pillar * 2, 500 * k);
      ctx.strokeStyle = COL.arch; ctx.globalAlpha = pulse; ctx.lineWidth = Math.max(1.5, 60 * k);
      ctx.strokeRect(x - half - pillar, y - h - 500 * k, half * 2 + pillar * 2, 500 * k);
      ctx.strokeRect(x - half - pillar, y - h, pillar, h);
      ctx.strokeRect(x + half, y - h, pillar, h);
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      if (500 * k > 8) {
        ctx.font = "800 " + Math.round(330 * k) + "px Manrope, system-ui, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = COL.archAlt;
        ctx.fillText("CHECKPOINT", x, y - h - 250 * k);
      }
      ctx.restore();
    }
  }

  function drawCarBody(x, y, w, hue, opts) {
    // Rear view of a low wedge sports car; y is where the tyres meet the road.
    const h = w * 0.42;
    ctx.save();
    ctx.translate(x, y);
    if (opts.rot) ctx.rotate(opts.rot);
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.beginPath(); ctx.ellipse(0, -h * 0.02, w * 0.55, h * 0.14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#07080f";
    ctx.fillRect(-w * 0.47, -h * 0.28, w * 0.18, h * 0.28);
    ctx.fillRect(w * 0.29, -h * 0.28, w * 0.18, h * 0.28);
    const body = ctx.createLinearGradient(0, -h, 0, 0);
    body.addColorStop(0, opts.light || "#ffffff");
    body.addColorStop(0.35, hue);
    body.addColorStop(1, "#141830");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, -h * 0.2);
    ctx.lineTo(-w * 0.48, -h * 0.62);
    ctx.lineTo(-w * 0.3, -h * 0.98);
    ctx.lineTo(w * 0.3, -h * 0.98);
    ctx.lineTo(w * 0.48, -h * 0.62);
    ctx.lineTo(w * 0.5, -h * 0.2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(10,14,30,.85)";              // rear window
    ctx.beginPath();
    ctx.moveTo(-w * 0.27, -h * 0.9); ctx.lineTo(w * 0.27, -h * 0.9);
    ctx.lineTo(w * 0.36, -h * 0.66); ctx.lineTo(-w * 0.36, -h * 0.66);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = opts.tail || "#ff3d6e";             // tail-light bar
    ctx.shadowColor = opts.tail || "#ff3d6e"; ctx.shadowBlur = opts.glow || 0;
    ctx.fillRect(-w * 0.44, -h * 0.52, w * 0.3, h * 0.12);
    ctx.fillRect(w * 0.14, -h * 0.52, w * 0.3, h * 0.12);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawTruck(x, y, w, hue, glow) {
    const h = w * 0.9;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.55, h * 0.06, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#07080f";
    ctx.fillRect(x - w * 0.46, y - h * 0.14, w * 0.16, h * 0.14);
    ctx.fillRect(x + w * 0.3, y - h * 0.14, w * 0.16, h * 0.14);
    ctx.fillStyle = "#1c2142";
    ctx.fillRect(x - w * 0.5, y - h, w, h * 0.86);
    ctx.strokeStyle = hue; ctx.lineWidth = Math.max(1, w * 0.02);
    ctx.shadowColor = hue; ctx.shadowBlur = glow;
    ctx.strokeRect(x - w * 0.5, y - h, w, h * 0.86);
    ctx.fillStyle = "#ff3d6e";
    ctx.fillRect(x - w * 0.46, y - h * 0.26, w * 0.12, w * 0.06);
    ctx.fillRect(x + w * 0.34, y - h * 0.26, w * 0.12, w * 0.06);
    ctx.shadowBlur = 0;
  }

  function drawPlayer(t) {
    const ratio = speed / MAX_SPEED;
    const w = XS * 0.42;
    const bounce = (Math.random() - 0.5) * 2 * ratio * Math.max(1, w * 0.008) * (Math.abs(playerX) > 1 ? 3 : 1);
    const y = H - Math.max(8, YS * 0.04) + bounce;
    const spin = spinT > 0 ? Math.sin(spinT * 40) * 0.12 : 0;
    drawCarBody(W / 2, y, w, COL.car, {
      rot: lean * 0.06 + spin,
      light: COL.carCore,
      tail: brake ? "#ff2050" : "#ff5ca8",
      glow: brake ? 30 : 14
    });
    if (accel && ratio > 0.05 && !overSent) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,211,107,.8)";
      const fl = rand(6, 14) * (0.5 + ratio);
      ctx.beginPath();
      ctx.moveTo(W / 2 - w * 0.1, y - w * 0.04); ctx.lineTo(W / 2 - w * 0.06, y + fl * 0.3); ctx.lineTo(W / 2 - w * 0.02, y - w * 0.04);
      ctx.moveTo(W / 2 + w * 0.02, y - w * 0.04); ctx.lineTo(W / 2 + w * 0.06, y + fl * 0.3); ctx.lineTo(W / 2 + w * 0.1, y - w * 0.04);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawSpeedLines(t) {
    const ratio = speed / MAX_SPEED;
    if (ratio < 0.7) return;
    const a = (ratio - 0.7) / 0.3;
    ctx.save();
    ctx.globalAlpha = 0.35 * a;
    ctx.strokeStyle = "#8ee9ff";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * TAU + t * 0.3;
      const r0 = Math.min(W, H) * (0.45 + ((t * 2.4 + i * 0.37) % 1) * 0.6);
      const cx = W / 2, cy = horizon;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0 * 0.6);
      ctx.lineTo(cx + Math.cos(ang) * (r0 + 60), cy + Math.sin(ang) * (r0 + 60) * 0.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  function render(t) {
    if (!segments.length) return;
    const sh = PA.shakeOffset();
    ctx.setTransform(DPR, 0, 0, DPR, DPR * sh.x, DPR * sh.y);

    const base = findSegment(position);
    const basePct = pct(position, SEG_LEN);
    const pSeg = findSegment(position + PLAYER_Z);
    const pPct = pct(position + PLAYER_Z, SEG_LEN);
    playerY = lerp(pSeg.p1.world.y, pSeg.p2.world.y, pPct);

    drawBackdrop(t, playerY);

    // Checkpoint arches (the next two) are placed by absolute distance, so they survive track loops.
    const archAt = new Set();
    for (let k = 0; k < 2; k++) {
      const absZ = nextCp + k * CP_SEGS * SEG_LEN;
      const ahead = absZ - (odo + PLAYER_Z);
      if (ahead > 0 && ahead < DRAW_SEG * SEG_LEN) archAt.add(findSegment(wrapZ(position + PLAYER_Z + ahead)).index);
    }

    let maxY = H, x = 0, dx = -(base.curve * basePct);
    const drawn = [];
    for (let n = 0; n < DRAW_SEG; n++) {
      const seg = segments[(base.index + n) % segments.length];
      const looped = seg.index < base.index;
      seg.fog = 1 / Math.pow(Math.E, Math.pow(n / DRAW_SEG, 2) * FOG);
      seg.clip = maxY;
      const camZ = position - (looped ? trackLength : 0);
      seg.p1.world.x = 0; seg.p2.world.x = 0;
      project(seg.p1, playerX * ROAD_W - x, playerY + CAM_H, camZ);
      project(seg.p2, playerX * ROAD_W - x - dx, playerY + CAM_H, camZ);
      x += dx; dx += seg.curve;
      drawn.push(seg);
      if (seg.p1.camera.z <= CAM_DEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxY) continue;
      drawSegment(seg);
      maxY = seg.p1.screen.y;
    }

    // Sprites and traffic, far to near, each clipped below the crest that hides it.
    for (let n = drawn.length - 1; n > 0; n--) {
      const seg = drawn[n];
      const a = seg.p1.screen;
      if (!(seg.p1.camera.z > CAM_DEPTH)) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
      if (archAt.has(seg.index)) drawSprite({ kind: "arch" }, seg, a.scale, a.x, a.y, t);
      for (const sp of seg.sprites) {
        const sx = a.x + a.scale * sp.offset * ROAD_W * XS;
        if (sx < -W * 0.5 || sx > W * 1.5) continue;
        drawSprite(sp, seg, a.scale, sx, a.y, t);
      }
      for (const car of seg.cars) {
        const cp = pct(car.z, SEG_LEN);
        const b = seg.p2.screen;
        const scale = lerp(a.scale, b.scale, cp);
        const cx = lerp(a.x, b.x, cp) + scale * car.offset * ROAD_W * XS;
        const cy = lerp(a.y, b.y, cp);
        const w = scale * ROAD_W * CAR_W * XS * 1.15;
        if (w < 1.5) continue;
        if (car.kind === "truck") drawTruck(cx, cy, w * 1.1, car.hue, Math.min(14, w * 0.1));
        else drawCarBody(cx, cy, w, car.hue, { tail: "#ff3d6e", glow: Math.min(16, w * 0.12) });
      }
      ctx.restore();
    }

    drawSpeedLines(t);
    drawPlayer(t);
    fx.draw(ctx);
    texts.draw(ctx);

    if (PA.state === "play" && !overSent) {
      if (speed < MAX_SPEED * 0.05 && !PA.isTouch) {
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 3);
        ctx.textAlign = "center";
        ctx.font = "700 " + Math.round(clamp(W / 40, 14, 22)) + "px Manrope, system-ui, sans-serif";
        ctx.fillStyle = COL.arch;
        ctx.fillText("Hold ▲ or W to drive", W / 2, horizon + YS * 0.35);
        ctx.restore();
      }
      if (combo > 1 && comboT > 0) {
        ctx.save();
        ctx.textAlign = "right";
        ctx.globalAlpha = Math.min(1, comboT);
        ctx.font = "800 " + Math.round(clamp(W / 45, 13, 20)) + "px Manrope, system-ui, sans-serif";
        ctx.fillStyle = COL.archAlt;
        ctx.fillText("COMBO x" + combo, W - 16, horizon + YS * 0.12);
        ctx.restore();
      }
    }
  }

  clearRun();
  position = SEG_LEN * 10;
  speed = MAX_SPEED * 0.5;

  window.__outrun = () => ({
    score: Math.floor(score),
    speed,
    kmh: Math.round(speed / MAX_SPEED * KMH),
    playerX,
    position,
    gateTimer: timer,
    gates,
    nextGateZ: nextCp,
    distance: odo,
    traffic: cars.length,
    cars: cars.map((c) => ({ d: relZ(c.z), x: c.offset })),
    segmentCount: segments.length,
    nearMisses,
    crashes,
    over: overSent,
    steer,
    accel,
    brake
  });

  PA.loop(update, render);
})();
