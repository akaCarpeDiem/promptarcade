<!DOCTYPE html>

</style></head><body>

<script src="/games/play/pa-score.js?v=e650da0b4c"></script>

<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
  "use strict";
  // A real-3D night-city racer. The course is an endless procedural boulevard: a centreline sampled every
  // STEP metres (heading integrated from curvature, plus rolling hills). The world around it is built in
  // chunks just ahead of the camera and thrown away behind it, so it never ends and never stutters.
  // Gameplay runs in track space (distance along the road, metres off the centreline); only rendering
  // converts to world space.
  const PA = window.PA;
  const { clamp, lerp, rand, randInt } = PA;
  const TAU = Math.PI * 2;

  /* ---------------- tuning ---------------- */
  const STEP = 2;                       // metres between centreline samples
  const CHUNK = 48;                     // samples per world chunk (96 m)
  const VIEW_AHEAD = 820;
  const VIEW_BEHIND = 70;
  const LANES = 4, LANE_W = 3.6;
  const ROAD_HALF = LANES * LANE_W / 2; // 7.2 m: painted edge lines
  const EDGE = ROAD_HALF + 0.6;         // tarmac incl. gutters
  const WALK = EDGE + 4.4;              // outer edge of the sidewalk
  const RAIL = EDGE - 0.05;
  const CAR_LEN = 4.5, CAR_HW = 0.98;
  const X_LIMIT = RAIL - 0.12 - CAR_HW;
  const MAX_V = 86;                     // m/s (310 km/h)
  const DRAFT_V = 8;                    // extra top speed in a full slipstream
  const LAT_MAX = 16.5;                 // m/s of sideways speed at full lock
  const STEER_RESP = 13;                // how fast the car answers the wheel
  const CF = 0.42;                      // how hard corners push you wide
  const LAMP_GAP = 34;
  const CP_LEN = 1500;
  const START_TIME = 30;
  const START_S = 40;
  const ROAD_V = 24;                    // metres of road per texture repeat
  const laneX = (l) => -ROAD_HALF + LANE_W * (l + 0.5);
  const laneOf = (x) => clamp(Math.round((x + ROAD_HALF) / LANE_W - 0.5), 0, LANES - 1);
  const smooth = (t) => t * t * (3 - 2 * t);

  /* ---------------- renderer, scene, camera ---------------- */
  const mount = document.getElementById("game");
  // No canvas antialiasing: the scene renders into a multisampled target for the bloom pass instead.
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  let resScale = 1;                     // drops on slow devices, see adapt()
  const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1) * resScale;
  renderer.setPixelRatio(dprCap());
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.info.autoReset = false;
  mount.appendChild(renderer.domElement);
  const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  // Smog lit from below by the city: the fog, the horizon and the far ground all share this colour.
  const FOG = new THREE.Color().setRGB(0.085, 0.03, 0.1);
  const scene = new THREE.Scene();
  scene.background = FOG;
  scene.fog = new THREE.FogExp2(FOG, 0.0016);
  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 2600);
  camera.rotation.order = "YXZ";
  const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

  /* ---------------- post: HDR bloom, then tone mapping ---------------- */
  // The scene renders into a multisampled half-float target, so neon, lamps and tail lights can be
  // brighter than white. A bright pass feeds a five-level blur chain whose levels are added back,
  // then the frame is tone mapped, vignetted and given a little film grain.
  function makePost() {
    const ext = renderer.extensions;
    // Multisampling a half-float target needs the full float extension; without it, skip the MSAA.
    const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
    const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;
    const main = new THREE.WebGLRenderTarget(1, 1, { type, samples: hdrOk && !fullFloat ? 0 : PA.isTouch ? 2 : 4 });
    const LV = 5, lv = [], tmp = [];
    for (let i = 0; i < LV; i++) {
      lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
      tmp.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
    }
    const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    quad.frustumCulled = false;
    const pscene = new THREE.Scene();
    pscene.add(quad);
    const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
    const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
    const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
    const bright = mk([
      "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
      "void main(){",
      "  " + box4,
      "  float l = max(c.r, max(c.g, c.b));",
      "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
      "  soft = soft * soft / (4.0 * knee + 1e-4);",
      "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(30.0)), 1.0);",
      "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 0.85 : 0.65 } });
    const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
      { tex: { value: null }, px: { value: new THREE.Vector2() } });
    const blur = mk([
      "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
      "void main(){",
      "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
      "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
      "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
      "  gl_FragColor = vec4(c, 1.0);",
      "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
    const comp = mk([
      "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time; varying vec2 vUv;",
      "void main(){",
      "  vec3 c = texture2D(tScene, vUv).rgb;",
      "  vec3 b = texture2D(b0, vUv).rgb * 0.5 + texture2D(b1, vUv).rgb * 0.6 + texture2D(b2, vUv).rgb * 0.7 + texture2D(b3, vUv).rgb * 0.8 + texture2D(b4, vUv).rgb * 0.9;",
      "  c += b * strength;",
      "  vec2 q = vUv - 0.5;",
      "  c *= 1.0 - dot(q, q) * 0.75;",
      "  gl_FragColor = vec4(c, 1.0);",
      "  #include <tonemapping_fragment>",
      "  #include <colorspace_fragment>",
      "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
      "  gl_FragColor.rgb += (n - 0.5) * grain;",
      "}"].join("\n"), {
      tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
      b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.42 }, grain: { value: 0.022 }, time: { value: 0 }
    });
    const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };
    return {
      setSize(w, h) {
        main.setSize(w, h);
        for (let i = 0; i < LV; i++) {
          const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
          lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
        }
      },
      render(sc, cm, t) {
        renderer.setRenderTarget(main);
        renderer.render(sc, cm);
        bright.uniforms.tex.value = main.texture;
        bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
        pass(bright, lv[0]);
        for (let i = 0; i < LV; i++) {
          if (i) {
            down.uniforms.tex.value = lv[i - 1].texture;
            down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
            pass(down, lv[i]);
          }
          blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
          pass(blur, tmp[i]);
          blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
          pass(blur, lv[i]);
        }
        comp.uniforms.time.value = t;
        pass(comp, null);
      }
    };
  }
  const post = makePost();

  let W = innerWidth, H = innerHeight;
  const overlay = PA.canvas(document.getElementById("fx"), { onResize: (o) => { W = o.w; H = o.h; } });
  const ctx = overlay.ctx;
  const bufSize = new THREE.Vector2();
  function resize() {
    renderer.setPixelRatio(dprCap());
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.getDrawingBufferSize(bufSize);
    post.setSize(bufSize.x, bufSize.y);
  }
  addEventListener("resize", resize);
  resize();

  /* ---------------- textures ---------------- */
  function canvasTex(w, h, paint, o) {
    o = o || {};
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    paint(cv.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    if (o.repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = ANISO;
    return t;
  }
  function speckle(g, w, h, amt) {
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * amt;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    g.putImageData(img, 0, 0);
  }

  // The road is wet asphalt. Three maps share one layout: colour, roughness (puddles are mirror
  // smooth, so they catch the neon) and glow (LED lane dashes set into the surface).
  const rpx = (lat, w) => (lat + EDGE) / (2 * EDGE) * w;
  const puddles = [];
  for (let i = 0; i < 18; i++) {
    const x = Math.random() < 0.5 ? rand(-EDGE, EDGE) : PA.choice([-1, 1]) * rand(ROAD_HALF - 0.8, EDGE);
    puddles.push({ x, v: rand(1), rx: rand(0.2, 0.7), ry: rand(0.05, 0.22) });
  }
  function puddleShapes(g, w, h) {
    for (const p of puddles) for (const dy of [-h, 0, h]) {
      g.beginPath();
      g.ellipse(rpx(p.x, w), p.v * h + dy, p.rx / (2 * EDGE) * w, p.ry * h, 0, 0, TAU);
      g.fill();
    }
  }
  function roadLines(g, w, h, edge, dash) {
    const lw = 0.16 / (2 * EDGE) * w;
    if (edge) {
      g.fillStyle = edge;
      g.fillRect(rpx(-ROAD_HALF + 0.1, w) - lw / 2, 0, lw, h);
      g.fillRect(rpx(ROAD_HALF - 0.1, w) - lw / 2, 0, lw, h);
    }
    g.fillStyle = dash;
    const len = 4 / ROAD_V * h;
    for (let l = 1; l < LANES; l++) {
      const x = rpx(-ROAD_HALF + l * LANE_W, w);
      for (let k = 0; k < 2; k++) g.fillRect(x - lw / 2, k * h / 2 + h * 0.1, lw, len);
    }
  }
  const roadTex = canvasTex(512, 1024, (g, w, h) => {
    g.fillStyle = "#1a1b21"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 26);
    for (let l = 0; l < LANES; l++) {
      for (const o of [-0.85, 0.85]) {
        const a = rpx(laneX(l) + o - 0.5, w), b = rpx(laneX(l) + o + 0.5, w);
        const gr = g.createLinearGradient(a, 0, b, 0);
        gr.addColorStop(0, "rgba(4,4,8,0)"); gr.addColorStop(0.5, "rgba(4,4,8,.32)"); gr.addColorStop(1, "rgba(4,4,8,0)");
        g.fillStyle = gr; g.fillRect(a, 0, b - a, h);
      }
    }
    g.fillStyle = "rgba(58,60,70,.5)";
    g.fillRect(0, 0, rpx(-ROAD_HALF, w) - 3, h);
    g.fillRect(rpx(ROAD_HALF, w) + 3, 0, w, h);
    g.fillStyle = "rgba(10,10,14,.7)";
    for (let y = 0; y < h; y += h / 6) { g.fillRect(4, y, 18, 6); g.fillRect(w - 22, y, 18, 6); } // drains
    g.fillStyle = "rgba(4,4,8,.4)";
    puddleShapes(g, w, h);
    roadLines(g, w, h, "rgba(214,220,232,.78)", "rgba(150,196,214,.7)");
    speckle(g, w, h, 16);
  }, { repeat: true });
  const roadRough = canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = "rgb(118,118,118)"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 60);
    g.fillStyle = "rgba(80,80,80,.55)";            // tyres polish the wheel tracks
    for (let l = 0; l < LANES; l++) for (const o of [-0.85, 0.85]) g.fillRect(rpx(laneX(l) + o - 0.35, w), 0, 0.7 / (2 * EDGE) * w, h);
    g.filter = "blur(3px)";
    g.fillStyle = "rgb(22,22,22)";
    puddleShapes(g, w, h);
    g.filter = "none";
    roadLines(g, w, h, "rgb(185,185,185)", "rgb(185,185,185)");
  }, { repeat: true, linear: true });
  const roadGlow = canvasTex(256, 1024, (g, w, h) => {
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    roadLines(g, w, h, "rgba(255,47,168,.4)", "#36e6ff");
  }, { repeat: true });

  const walkTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#2c2c35"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 20);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if (Math.random() < 0.3) { g.fillStyle = "rgba(255,255,255,.035)"; g.fillRect(i * w / 4, j * h / 4, w / 4, h / 4); }
    g.strokeStyle = "rgba(8,8,12,.65)"; g.lineWidth = 2;
    for (let i = 0; i <= 4; i++) {
      g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke();
      g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke();
    }
  }, { repeat: true });

  const groundTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#15131c"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 30);
    g.fillStyle = "rgba(34,32,46,.7)";
    for (let i = 0; i < 40; i++) g.fillRect(rand(w), rand(h), rand(8, 40), rand(2, 5));
  }, { repeat: true });

  const glowTex = canvasTex(64, 64, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.22, "rgba(255,255,255,.55)");
    gr.addColorStop(0.55, "rgba(255,255,255,.12)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const poolTex = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,.95)");
    gr.addColorStop(0.35, "rgba(255,255,255,.5)");
    gr.addColorStop(0.75, "rgba(255,255,255,.1)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  // Reflections in the wet road: a soft pool (left half) and a long rippled streak (right half).
  const POOL = 1, STREAK = 2;
  const reflTex = canvasTex(128, 256, (g, w, h) => {
    const gr = g.createRadialGradient(w / 4, h / 2, 0, w / 4, h / 2, w / 4);
    gr.addColorStop(0, "rgba(255,255,255,.95)"); gr.addColorStop(0.35, "rgba(255,255,255,.5)");
    gr.addColorStop(0.75, "rgba(255,255,255,.1)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.save(); g.translate(0, h / 2); g.scale(1, 4); g.translate(0, -h / 2);
    g.fillStyle = gr; g.fillRect(0, h / 2 - w / 4, w / 2, w / 2);
    g.restore();
    for (let y = 0; y < h; y++) {
      const t = y / h, env = Math.pow(Math.sin(Math.PI * t), 0.7) * (1 - 0.65 * t), ripple = 0.45 + 0.55 * Math.random();
      const cx = w * 0.75 + (Math.random() - 0.5) * 6, hw = w / 4 * (0.5 + 0.5 * t);
      const lg = g.createLinearGradient(cx - hw, 0, cx + hw, 0);
      const a = env * ripple;
      lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(0.5, "rgba(255,255,255," + a.toFixed(3) + ")"); lg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = lg; g.fillRect(w / 2, y, w / 2, 1);
    }
  });
  const shadowTex = canvasTex(64, 128, (g, w, h) => {
    g.fillStyle = "rgba(0,0,0,0)"; g.fillRect(0, 0, w, h);
    g.filter = "blur(7px)";
    g.fillStyle = "rgba(0,0,0,.85)";
    g.fillRect(12, 14, w - 24, h - 28);
  });

  // Facades: a colour map and an emissive map (lit windows and LED trim only). Street buildings tile
  // 6 x 8 windows over 14 m x 28 m; the megatowers tile 12 x 16 windows over 30 m x 60 m.
  // Kinds: 0 habitat block, 1 glass tower, 2 neon district, 3 and 4 megatower skins.
  const FAC_U = 14, FAC_V = 28, MEGA_U = 30, MEGA_V = 60;
  function facade(kind) {
    const mega = kind >= 3, C = mega ? 12 : kind === 1 ? 8 : 10, R = mega ? 16 : 8, S = mega ? 512 : 256, SH = 512;
    const litP = [0.26, 0.3, 0.32, 0.3, 0.26][kind];
    const tints = [
      ["#ffd9a0", "#ffe7c4", "#9fd8ff", "#ffb0d8"],
      ["#cfe9ff", "#a9d6ff", "#e4f1ff", "#c3b4ff"],
      ["#ff8fd0", "#8ff6ff", "#ffd9a0", "#c9a2ff"],
      ["#bfe6ff", "#ffe2b0", "#8ff6ff", "#ffffff"],
      ["#ffd29a", "#ff9fce", "#ffe7c4", "#b8a6ff"]
    ][kind];
    const wall = ["#2a2930", "#111622", "#221a24", "#141826", "#1c141f"][kind];
    const led = ["#2fe0ff", "#c06bff", "#ff3fb0", "#2fe0ff", "#ff5a3d"][kind];
    const lit = [], colors = [], alpha = [], blinds = [];
    for (let i = 0; i < C * R; i++) {
      lit.push(Math.random() < litP); colors.push(PA.choice(tints)); alpha.push(rand(0.18, 0.7)); blinds.push(Math.random() < 0.35 ? rand(0.2, 0.6) : 0);
    }
    const cell = (x, y, cw, ch) => kind === 1 ? [x + 1.5, y + 3, cw - 3, ch - 6] : [x + cw * 0.14, y + ch * 0.18, cw * 0.72, ch * 0.6];
    const leds = (g, w, h, cw, ch) => {
      const t = Math.max(2, S / 128);
      g.fillStyle = led;
      if (kind === 2) for (let r = 1; r < R; r += 3) { g.fillStyle = ["#ff3fb0", "#2fe0ff", "#ffb21e"][r % 3]; g.fillRect(0, r * ch + ch - t * 1.5, w, t); }
      if (kind === 4) for (let r = 0; r < R; r += 4) g.fillRect(0, r * ch, w, t);

      const base = this.count, cc = new THREE.Color();
      for (let i = 0; i < Pa.count; i++) {
        v.fromBufferAttribute(Pa, i).applyMatrix4(m);
        n.fromBufferAttribute(Na, i).applyMatrix3(nm).normalize();
        if (Ca) cc.fromBufferAttribute(Ca, i);
        let u = Ua ? Ua.getX(i) : 0, w = Ua ? Ua.getY(i) : 0;
        if (uvMap) [u, w] = Array.isArray(uvMap) ? uvMap : uvMap(u, w);
        this.vert(v.x, v.y, v.z, n.x, n.y, n.z, u, w, Ca ? cc : col);
      }
      if (geo.index) for (let i = 0; i < geo.index.count; i++) this.i.push(base + geo.index.getX(i));
      else for (let i = 0; i < Pa.count; i++) this.i.push(base + i);
    }
    mesh(mat) {
      if (!this.i.length) return null;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(this.p, 3));
      g.setAttribute("normal", new THREE.Float32BufferAttribute(this.n, 3));
      g.setAttribute("uv", new THREE.Float32BufferAttribute(this.uv, 2));
      if (this.c) g.setAttribute("color", new THREE.Float32BufferAttribute(this.c, 3));
      g.setIndex(this.i);
      g.computeBoundingSphere();
      const m = new THREE.Mesh(g, mat);
      m.position.set(this.o.x, this.o.y, this.o.z);
      m.matrixAutoUpdate = false; m.updateMatrix();
      return m;
    }
  }
  const mat4 = (x, y, z, ry, rx, rz, sx, sy, sz) => new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0, "YXZ")),
    new THREE.Vector3(sx || 1, sy || sx || 1, sz || sx || 1)
  );

  // Templates merged into chunk geometry.
  const poleGeo = new THREE.CylinderGeometry(0.08, 0.14, 9.6, 8).translate(0, 4.8, 0);
  const armGeo = new THREE.BoxGeometry(0.1, 0.1, 1).translate(0, 0, -0.5);
  const headGeo = new THREE.BoxGeometry(0.3, 0.1, 1.7);
  const lensGeo = new THREE.BoxGeometry(0.2, 0.03, 1.55);
  const coneGeo = (() => {
    const g = new THREE.ConeGeometry(0.17, 0.72, 10, 4).translate(0, 0.36, 0);
    const p = g.attributes.position, cols = [];
    for (let i = 0; i < p.count; i++) { const y = p.getY(i); const white = y > 0.3 && y < 0.5; cols.push(white ? 1 : 1, white ? 1 : 0.32, white ? 1 : 0.02); }
    g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
    return g;
  })();
  const coneBase = (() => {
    const g = new THREE.BoxGeometry(0.42, 0.04, 0.42).translate(0, 0.02, 0);
    const cols = []; for (let i = 0; i < g.attributes.position.count; i++) cols.push(0.08, 0.08, 0.08);
    g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
    return g;
  })();
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const signGeo = new THREE.PlaneGeometry(1.4, 4.2);
  const planeGeo = new THREE.PlaneGeometry(1, 1);
  const col = (h) => new THREE.Color(h);
  const C_POLE = col("#3a3d48"), C_GANTRY = col("#1c1f2e"), C_BOARD = col("#ffc21a"), C_BARRIER = col("#50525c"),
    C_BRIDGE = col("#2a2c38");
  const NEON_C = NEON.map((c) => new THREE.Color(c));
  const neonHDR = (k) => PA.choice(NEON_C).clone().multiplyScalar(k);
  /* ---------------- world chunks ---------------- */
  const chunks = new Map(), megas = new Map();
  let bCursor = [0, 0];            // next free distance for buildings, left and right
  const SHOP_COLS = ["#bfefff", "#ffc0e0", "#e8dcff", "#ffe2b8", "#c8fff0", "#ffffff"].map((c) => hdr(c, 0.75));
  const LENS_COL = hdr(0xdcecff, 6), POOL_COL = hdr(0x9fc0ff, 0.3), STREAK_COL = hdr(0xcfe4ff, 0.7), SIGN_WHITE = hdr(0xffffff, 2);
  const BARRIER_LED = [hdr(0xff2fa8, 3), hdr(0x29f0ff, 3)];

  function tint(g, from, c) { for (let q = from; q < g.count; q++) { g.c[q * 3] = c.r; g.c[q * 3 + 1] = c.g; g.c[q * 3 + 2] = c.b; } }
  // The road's frame at s: lateral (right) axis rx/rz, forward axis fx/fz.
  function frame(s) {
    at(s);
    return { x: P.x, y: P.y, z: P.z, th: P.h, rx: Math.cos(P.h), rz: Math.sin(P.h), fx: Math.sin(P.h), fz: -Math.cos(P.h) };
  }
  // A tower block: four textured walls and a flat roof, squared to the road. hl/hf are the half
  // sizes across and along the road.
  function block(g, cx, cz, F, hl, hf, base, top, U, V, uo, vo) {
    const fu = (m) => uo + m / U, fv = (m) => -vo + m / V;
    const sides = [
      [cx - F.rx * hl, cz - F.rz * hl, -F.rx, -F.rz, hf],
      [cx + F.rx * hl, cz + F.rz * hl, F.rx, F.rz, hf],
      [cx + F.fx * hf, cz + F.fz * hf, F.fx, F.fz, hl],
      [cx - F.fx * hf, cz - F.fz * hf, -F.fx, -F.fz, hl]
    ];
    for (const [x, z, nx, nz, half] of sides) g.face(x, z, nx, nz, half, base, top, fu(0), fu(half * 2), fv(0), fv(top - base));
    const rb = g.count, ru = 0.997, rv = 0.003;
    for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) g.vert(cx + F.rx * a * hl + F.fx * b * hf, top, cz + F.rz * a * hl + F.fz * b * hf, 0, 1, 0, ru, rv);
    g.i.push(rb, rb + 2, rb + 1, rb, rb + 3, rb + 2);
    g.i.push(rb, rb + 1, rb + 2, rb, rb + 2, rb + 3);
  }
  function chunkGroup(G, o, points) {
    const group = new THREE.Group();
    for (const [g, mat] of G) { const m = g.mesh(mat); if (m) group.add(m); }
    for (const [arr, mat] of points) {
      if (!arr.length) continue;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
      const p = new THREE.Points(g, mat);
      p.position.copy(o); p.matrixAutoUpdate = false; p.updateMatrix();
      group.add(p);
    }
    scene.add(group);
    return group;
  }

  function buildChunk(c) {
    const i0 = c * CHUNK, i1 = i0 + CHUNK, s0 = i0 * STEP, s1 = i1 * STEP;
    ensure(i1 + 30);
    const o = new THREE.Vector3(T.x[i0], T.y[i0], T.z[i0]);
    const G = {
      road: new Geo(o), walk: new Geo(o), ground: new Geo(o), metal: new Geo(o, true), sign: new Geo(o, true),
      refl: new Geo(o, true), shop: new Geo(o, true), holo: new Geo(o),
      cone: new Geo(o, true), cpPanel: new Geo(o), cpLine: new Geo(o), checker: new Geo(o),
      fac: [new Geo(o), new Geo(o), new Geo(o)]
    };
    const lampPts = [], beaconPts = [], extra = [];
    const v = new THREE.Vector3();

    // Road, gutters, kerbs, sidewalks and the ground beyond.
    G.road.ribbon(i0, i1, -EDGE, EDGE, 0, 0, 0, 1, ROAD_V);
    for (const side of [-1, 1]) {
      const a = (l) => side * l;
      const flip = side < 0;
      const rib = (g, la, lb, ua, ub, upA, upB, vLen, normal) => flip ? g.ribbon(i0, i1, a(lb), a(la), upB, upA, ub, ua, vLen, normal) : g.ribbon(i0, i1, a(la), a(lb), upA, upB, ua, ub, vLen, normal);
      rib(G.walk, EDGE + 0.02, WALK, (l) => Math.abs(l) / 2, (l) => Math.abs(l) / 2, 0.17, 0.17, 4);
      rib(G.ground, WALK, 70, (l) => Math.abs(l) / 8, (l) => Math.abs(l) / 8, 0.12, 0.12, 8);
      // Far ground: keep it from folding over itself on the inside of tight bends.
      const far = (i) => side * Math.min(420, T.k[i] * side > 0 ? 0.8 / Math.abs(T.k[i]) : 420);
      if (flip) G.ground.ribbon(i0, i1, far, a(70), -0.2, 0.12, (l) => Math.abs(l) / 8, (l) => Math.abs(l) / 8, 8);
      else G.ground.ribbon(i0, i1, a(70), far, 0.12, -0.2, (l) => Math.abs(l) / 8, (l) => Math.abs(l) / 8, 8);
      // A concrete crash barrier with an LED strip facing the traffic: pink on the left, cyan on the right.
      let from = G.metal.count;
      G.metal.ribbon(i0, i1, a(RAIL), a(RAIL), flip ? 0.85 : 0, flip ? 0 : 0.85, 0, 1, 4, -side);
      rib(G.metal, RAIL, EDGE + 0.3, 0, 1, 0.85, 0.85, 4);
      tint(G.metal, from, C_BARRIER);
      from = G.sign.count;
      G.sign.ribbon(i0, i1, a(RAIL - 0.012), a(RAIL - 0.012), flip ? 0.66 : 0.6, flip ? 0.6 : 0.66, WHITE_UV[0], WHITE_UV[0], 1e6, -side);
      tint(G.sign, from, BARRIER_LED[flip ? 0 : 1]);
    }

    // Street lights: slim poles with an LED blade reaching over the lanes and a neon strip up the pole.
    for (let n = Math.ceil(s0 / LAMP_GAP); n * LAMP_GAP < s1; n++) {
      const s = n * LAMP_GAP, side = n % 2 ? 1 : -1, hh = -at(s).h;
      world(s, side * (EDGE + 0.9), 0.17, v);
      G.metal.add(poleGeo, mat4(v.x, v.y, v.z, hh), C_POLE);
      world(s, side * (EDGE + 0.78), 3.6, v);
      G.sign.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 0.05, 6, 0.05), BARRIER_LED[n % 4 < 2 ? 0 : 1], WHITE_UV);
      const armLen = 2.9;
      world(s, side * (EDGE + 0.9), 9.5, v);
      G.metal.add(armGeo, mat4(v.x, v.y, v.z, hh + (side > 0 ? Math.PI / 2 : -Math.PI / 2), 0.06, 0, 1, 1, armLen), C_POLE);
      world(s, side * (EDGE + 0.9 - armLen), 9.62, v);
      G.metal.add(headGeo, mat4(v.x, v.y, v.z, hh + Math.PI / 2), C_POLE);
      G.sign.add(lensGeo, mat4(v.x, v.y - 0.065, v.z, hh + Math.PI / 2), LENS_COL, WHITE_UV);
      lampPts.push(v.x - o.x, v.y - 0.25 - o.y, v.z - o.z);
      const lat = side * (EDGE + 0.9 - armLen);
      G.refl.patch(s - 10, s + 10, lat - 7.5, lat + 7.5, 0.03, POOL_COL, POOL);
      G.refl.patch(s - 26, s + 2, lat - 0.7, lat + 0.7, 0.035, STREAK_COL, STREAK);   // its reflection in the wet road
    }

    // Street buildings: frontage, setback and height vary. They carry LED trim, neon blade signs and
    // hologram screens, and throw coloured reflections across the wet tarmac.
    for (const sideIdx of [0, 1]) {
      const side = sideIdx ? 1 : -1;
      if (bCursor[sideIdx] < s0) bCursor[sideIdx] = s0 + rand(0, 6);
      while (bCursor[sideIdx] < s1) {
        const s = bCursor[sideIdx];
        if (Math.random() < 0.12) { bCursor[sideIdx] += rand(14, 36); continue; }   // side street or plaza
        const w = rand(14, 32), mid = s + w / 2;
        if (mid >= s1) break;
        const r = Math.random();
        const h = r < 0.1 ? rand(140, 240) : r < 0.38 ? rand(60, 140) : rand(18, 60);
        const depth = rand(18, 32), setback = WALK + rand(0.4, 2.5);
        const F = frame(mid);
        const base = F.y - 3, top = F.y + h;
        const cl = side * (setback + depth / 2);
        const cx = F.x + F.rx * cl, cz = F.z + F.rz * cl;
        const kind = h > 90 ? PA.choice([1, 1, 2, 0]) : randInt(0, 2);
        block(G.fac[kind], cx, cz, F, depth / 2, w / 2, base, top, FAC_U, FAC_V, rand(0, 4) | 0, (F.y + 0.17 - base) / FAC_V);
        // (nx, nz) points from the face towards the road; (ox, oz) is the middle of that face
        const nx = -F.rx * side, nz = -F.rz * side;
        const ox = cx + nx * depth / 2, oz = cz + nz * depth / 2;
        if (Math.random() < 0.85) G.shop.face(ox + nx * 0.06, oz + nz * 0.06, nx, nz, w * 0.45, F.y + 0.3, F.y + 3.6, 0, w / 8, 0, 1, PA.choice(SHOP_COLS));
        if (Math.random() < 0.55) {                                  // LED strips up the corners
          const c = neonHDR(3), y0 = F.y + 4;
          for (const b of [-1, 1]) G.sign.add(boxGeo, mat4(ox + nx * 0.08 + F.fx * b * (w / 2 + 0.06), (y0 + top) / 2, oz + nz * 0.08 + F.fz * b * (w / 2 + 0.06), 0, 0, 0, 0.16, top - y0, 0.16), c, WHITE_UV);
        }
        if (Math.random() < 0.25) {                                  // LED floor bands
          const c = neonHDR(2.5), gap = PA.choice([7, 10.5, 14]);
          for (let y = F.y + 10; y < top - 2; y += gap) G.sign.add(boxGeo, mat4(ox + nx * 0.1, y, oz + nz * 0.1, -F.th, 0, 0, 0.12, 0.14, w), c, WHITE_UV);
        }
        if (h > 60 && Math.random() < 0.5) {                        // a lit crown
          const c = neonHDR(3), y = top - 0.6;
          G.sign.add(boxGeo, mat4(ox + nx * 0.1, y, oz + nz * 0.1, -F.th, 0, 0, 0.14, 0.4, w), c, WHITE_UV);
          for (const b of [-1, 1]) G.sign.add(boxGeo, mat4(cx + F.fx * b * (w / 2 + 0.1), y, cz + F.fz * b * (w / 2 + 0.1), -F.th, 0, 0, depth, 0.4, 0.14), c, WHITE_UV);
        }
        if (Math.random() < 0.6) {                                   // neon blade signs, sometimes stacked
          const along = s + rand(1.5, 4), sl = side * (setback - 1.1), sh = -at(along).h;
          const n = h > 30 && Math.random() < 0.4 ? randInt(2, 3) : 1;
          for (let k = 0; k < n; k++) {
            const idx = randInt(0, SIGNS - 1);
            world(along, sl, rand(5.5, 7.5) + k * 5, v);
            G.sign.add(signGeo, mat4(v.x, v.y, v.z, sh), SIGN_WHITE, signUV(idx));
            if (k === 0) G.refl.patch(along - 16, along + 1, sl - 0.6, sl + 0.6, 0.2, signCol[idx].clone().multiplyScalar(1.1), STREAK);
          }
        }
        if (h > 30 && Math.random() < 0.35) {                       // a hologram hanging out over the street
          const idx = randInt(0, HOLO_N - 1), bw = rand(5, 8), bh = bw * 2;
          const along = s + rand(2, Math.max(2.5, w - 2)), lat = side * (setback - bw / 2 + 0.2);
          world(along, lat, rand(9, 14) + bh / 2, v);
          G.holo.add(planeGeo, mat4(v.x, v.y, v.z, -at(along).h, 0, 0, bw, bh, 1), null, holoUV(idx));
          G.refl.patch(along - 40, along + 1, lat - bw / 2, lat + bw / 2, 0.035, holoCol[idx].clone().multiplyScalar(0.5), STREAK);
        } else if (h > 16 && Math.random() < 0.3) {                 // a wide screen, angled at the traffic
          const idx = randInt(0, WIDE_N - 1), bw = Math.min(w * 0.8, rand(9, 15)), bh = bw / 2;
          const y = F.y + rand(8, Math.max(8.5, Math.min(16, h - bh - 1))) + bh / 2;
          const ang = 0.38, ax = nx * Math.cos(ang) - F.fx * Math.sin(ang), az = nz * Math.cos(ang) - F.fz * Math.sin(ang);
          G.holo.add(planeGeo, mat4(ox + nx * 2.4, y, oz + nz * 2.4, Math.atan2(ax, az), 0, 0, bw, bh, 1), null, wideUV(idx));
          const lat = side * (ROAD_HALF - 1.6);
          G.refl.patch(mid - 34, mid + 2, lat - 1.3, lat + 1.3, 0.035, wideCol[idx].clone().multiplyScalar(0.45), STREAK);
        }
        if (h > 100) beaconPts.push(cx - o.x, top + 1 - o.y, cz - o.z);
        bCursor[sideIdx] = s + w + rand(1.5, 6);
      }
    }

    // Now and then a skybridge links the towers high over the boulevard.
    if (Math.random() < 0.3) {
      const s = rand(s0 + 8, s1 - 8), cp = Math.round(s / CP_LEN) * CP_LEN;
      if (Math.abs(s - cp) > 40) {
        const hh = -at(s).h, y = rand(38, 54);
        world(s, 0, y, v);
        G.metal.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 90, 4.2, 6), C_BRIDGE);
        G.sign.add(boxGeo, mat4(v.x, v.y + 0.3, v.z, hh, 0, 0, 89.6, 1.4, 6.06), hdr(PA.choice(["#ffe2b8", "#cfe9ff", "#ffc0e0"]), 1.6), WHITE_UV);
        G.sign.add(boxGeo, mat4(v.x, v.y - 2.12, v.z, hh, 0, 0, 89.6, 0.06, 0.4), neonHDR(4), WHITE_UV);
        if (Math.random() < 0.5) {                                 // with a giant screen slung underneath
          const idx = randInt(0, WIDE_N - 1), bw = rand(18, 26);
          world(s - 3.2, 0, y - 2.1 - bw / 4 - 0.4, v);
          G.holo.add(planeGeo, mat4(v.x, v.y, v.z, hh, 0, 0, bw, bw / 2, 1), null, wideUV(idx));
          for (const x of [-0.42, 0.42]) { world(s - 3.2, x * bw, y - 2.1 - 0.2, v); G.metal.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 0.15, 0.5, 0.15), C_POLE); }
          G.refl.patch(s - 60, s - 2, -bw / 2.4, bw / 2.4, 0.04, wideCol[idx].clone().multiplyScalar(0.4), STREAK);
        }
      }
    }

    // Checkpoint gantry.
    const cpN = Math.ceil(s0 / CP_LEN);
    if (cpN > 0 && cpN * CP_LEN < s1) {
      const s = cpN * CP_LEN, hh = -at(s).h;
      for (const side of [-1, 1]) {
        world(s, side * (EDGE + 0.5), 0, v);
        G.metal.add(boxGeo, mat4(v.x, v.y + 4, v.z, hh, 0, 0, 0.5, 8, 0.5), C_GANTRY);
      }
      world(s, 0, 7.4, v);
      G.metal.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 2 * EDGE + 1.6, 0.6, 0.6), C_GANTRY);
      world(s, 0, 6.25, v);
      G.metal.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 2 * EDGE + 1.6, 0.25, 0.4), C_GANTRY);
      for (const y of [6.08, 7.76]) { world(s - 0.33, 0, y, v); G.sign.add(boxGeo, mat4(v.x, v.y, v.z, hh, 0, 0, 2 * EDGE + 1.6, 0.06, 0.06), hdr(0x8ee9ff, 4), WHITE_UV); }
      world(s - 0.32, 0, 7.4, v);
      const panel = new THREE.PlaneGeometry(9.5, 1.5);
      G.cpPanel.add(panel, mat4(v.x, v.y, v.z, hh));
      for (let k = -3; k <= 3; k++) { world(s - 0.4, k * 2.2, 6.1, v); lampPts.push(v.x - o.x, v.y - o.y, v.z - o.z); }
      G.cpLine.patch(s - 0.7, s + 0.7, -ROAD_HALF, ROAD_HALF, 0.035);
      G.refl.patch(s - 30, s + 1, -ROAD_HALF, ROAD_HALF, 0.04, hdr(0x8ee9ff, 0.35), STREAK);
    }
    if (s0 <= START_S + 6 && s1 > START_S + 6) G.checker.patch(START_S + 4.5, START_S + 7.5, -ROAD_HALF, ROAD_HALF, 0.03);

    // Road works: cones along the closed lane and an arrow-board trailer at the start.
    for (const wk of works) {
      if (wk.s1 < s0 || wk.s0 >= s1) continue;
      const inner = wk.lane < LANES / 2 ? 1 : -1;          // cones sit on the open side of the closed lane
      for (let s = Math.max(wk.s0 + 4, Math.ceil(s0 / 5) * 5); s < Math.min(wk.s1, s1); s += 5) {
        const taper = clamp((s - wk.s0) / 24, 0, 1);
        const lat = wk.x + inner * (LANE_W / 2 - 0.25) * taper - inner * (LANE_W / 2 - 0.6) * (1 - taper);
        world(s, lat, 0, v);
        G.cone.add(coneGeo, mat4(v.x, v.y, v.z, 0, 0, 0, 1.3));
        G.cone.add(coneBase, mat4(v.x, v.y, v.z, -at(s).h));
      }
      if (wk.s0 >= s0 && wk.s0 < s1) {
        const hh = -at(wk.s0).h;
        world(wk.s0 + 1.3, wk.x, 0, v);
        G.metal.add(boxGeo, mat4(v.x, v.y + 0.75, v.z, hh, 0, 0, 2.2, 0.9, 2.4), C_BOARD);
        G.metal.add(boxGeo, mat4(v.x, v.y + 2.2, v.z, hh, 0, 0, 0.12, 2.2, 0.12), C_POLE);
        world(wk.s0 - 0.02, wk.x, 3, v);
        const board = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.8), inner > 0 ? M.arrow : M.arrowL);
        board.position.copy(v); board.rotation.set(0, -at(wk.s0).h, 0);
        extra.push(board);
        world(wk.s0, wk.x, 3, v);
        lampPts.push(v.x - o.x, v.y - o.y, v.z - o.z);
        G.refl.patch(wk.s0 - 24, wk.s0 + 1, wk.x - 1.2, wk.x + 1.2, 0.035, hdr(0xffb21e, 0.6), STREAK);
      }
    }

    const group = chunkGroup([
      [G.road, M.road], [G.walk, M.walk], [G.ground, M.ground], [G.metal, M.metal], [G.sign, M.sign], [G.refl, M.refl],
      [G.shop, M.shop], [G.holo, M.holo], [G.cone, M.cone], [G.cpPanel, M.cpPanel],
      [G.cpLine, M.cpLine], [G.checker, M.checker], ...G.fac.map((g, k) => [g, facades[k]])
    ], o, [[lampPts, M.lampGlow], [beaconPts, M.beacon]]);
    extra.forEach((m) => group.add(m));
    return group;
  }

  // Megatowers: hundreds of metres tall and set well back from the boulevard. They are built in
  // bigger blocks and much further ahead than the street, so they loom out of the smog.
  const MEGA = CHUNK * 4;
  function clearOfRoad(x, z, r, i) {
    const a = Math.max(0, i - 260), b = i + 260;
    ensure(b);
    for (let j = a; j <= b; j += 3) { const dx = T.x[j] - x, dz = T.z[j] - z; if (dx * dx + dz * dz < r * r) return false; }
    return true;
  }
  function buildMega(m) {
    const i0 = m * MEGA, s0 = i0 * STEP, s1 = (i0 + MEGA) * STEP;
    ensure(i0 + MEGA + 300);
    const o = new THREE.Vector3(T.x[i0], T.y[i0], T.z[i0]);
    const G = { fac: [new Geo(o), new Geo(o)], sign: new Geo(o, true), holo: new Geo(o), metal: new Geo(o, true) };
    const beaconPts = [];
    for (let k = 0; k < 10; k++) {
      const s = rand(s0, s1), side = Math.random() < 0.5 ? -1 : 1;
      const hf = rand(16, 36), hl = rand(16, 36), h = Math.random() < 0.3 ? rand(380, 620) : rand(150, 380);
      const lat = side * rand(55 + hl, 320);
      const F = frame(s);
      const cx = F.x + F.rx * lat, cz = F.z + F.rz * lat;
      if (!clearOfRoad(cx, cz, Math.hypot(hf, hl) + 30, Math.floor(s / STEP))) continue;
      const base = F.y - 40, top = F.y + h, kind = randInt(0, 1);
      block(G.fac[kind], cx, cz, F, hl, hf, base, top, MEGA_U, MEGA_V, rand(0, 4) | 0, rand(1));
      let crown = top;
      if (Math.random() < 0.4) { crown = top + rand(30, 90); block(G.fac[kind], cx, cz, F, hl * 0.62, hf * 0.62, top - 1, crown, MEGA_U, MEGA_V, 0, 0); }
      if (Math.random() < 0.65) {                                  // LED edges
        const c = neonHDR(4);
        for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          G.sign.add(boxGeo, mat4(cx + F.rx * a * (hl + 0.3) + F.fx * b * (hf + 0.3), (base + top) / 2, cz + F.rz * a * (hl + 0.3) + F.fz * b * (hf + 0.3), -F.th, 0, 0, 0.9, top - base, 0.9), c, WHITE_UV);
        }
      }
      if (Math.random() < 0.45) {                                  // LED rings
        const c = neonHDR(3.5), gap = rand(36, 70);
        for (let y = F.y + rand(20, 50); y < top - 5; y += gap) {
          for (const b of [-1, 1]) {
            G.sign.add(boxGeo, mat4(cx + F.rx * b * (hl + 0.35), y, cz + F.rz * b * (hl + 0.35), -F.th, 0, 0, 0.6, 0.8, hf * 2 + 1.4), c, WHITE_UV);
            G.sign.add(boxGeo, mat4(cx + F.fx * b * (hf + 0.35), y, cz + F.fz * b * (hf + 0.35), -F.th, 0, 0, hl * 2 + 1.4, 0.8, 0.6), c, WHITE_UV);
          }
        }
      }
      if (Math.random() < 0.55) {                                  // a giant advert facing the road
        const idx = randInt(0, HOLO_N - 1), bw = rand(22, Math.min(40, hf * 2 - 2)), bh = bw * 2;
        const nx = -F.rx * side, nz = -F.rz * side;
        const y = F.y + rand(30, Math.max(35, h * 0.55 - bh / 2)) + bh / 2;
        G.holo.add(planeGeo, mat4(cx + nx * (hl + 1.2), y, cz + nz * (hl + 1.2), Math.atan2(nx, nz), 0, 0, bw, bh, 1), null, holoUV(idx));
      }
      if (Math.random() < 0.6) {                                   // a spire with an aircraft warning light
        const sh = rand(30, 80);
        G.metal.add(boxGeo, mat4(cx, crown + sh / 2, cz, -F.th, 0, 0, 1.4, sh, 1.4), C_POLE);
        beaconPts.push(cx - o.x, crown + sh + 2 - o.y, cz - o.z);
      }
    }
    return chunkGroup([[G.fac[0], megaFac[0]], [G.fac[1], megaFac[1]], [G.sign, M.sign], [G.holo, M.holo], [G.metal, M.metal]], o, [[beaconPts, M.beacon]]);
  }

  function disposeChunk(g) {
    scene.remove(g);
    g.traverse((m) => { if (m.geometry) m.geometry.dispose(); });
  }
  function updateChunks(s, all) {
    const span = CHUNK * STEP, mspan = MEGA * STEP;
    const first = Math.max(0, Math.floor((s - VIEW_BEHIND) / span));
    const last = Math.floor((s + VIEW_AHEAD) / span);
    for (const [c, g] of chunks) if (c < first || c > last) { disposeChunk(g); chunks.delete(c); }
    const mFirst = Math.max(0, Math.floor((s - 350) / mspan)), mLast = Math.floor((s + 1500) / mspan);
    for (const [c, g] of megas) if (c < mFirst || c > mLast) { disposeChunk(g); megas.delete(c); }
    let built = 0;
    for (let c = first; c <= last && (all || built < 1); c++) {
      if (!chunks.has(c)) { chunks.set(c, buildChunk(c)); built++; }
    }
    for (let c = mFirst; c <= mLast && (all || built < 1); c++) {
      if (!megas.has(c)) { megas.set(c, buildMega(c)); built++; }
    }
  }

  /* ---------------- vehicle models ---------------- */
  // Bodies are side profiles extruded across the car's width, with cut-out wheel arches (closed
  // skirts on hover cars), a glass canopy and LED light bars. Every part is merged into one geometry
  // with a group per material.
  // Slots: 0 paint, 1 glass, 2 trim, 3 tail lights, 4 LED trim, 5 hauler doors, 6 hauler cab
  function merge(parts) {
    const pos = [], nor = [], uv = [], groups = [];
    const v = new THREE.Vector3(), nm = new THREE.Matrix3();
    for (let mi = 0; mi < 8; mi++) {
      const start = pos.length / 3;
      for (const p of parts) {
        if (p.mat !== mi) continue;
        const g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
        const Pa = g.attributes.position, Na = g.attributes.normal, Ua = g.attributes.uv;
        nm.getNormalMatrix(p.m);
        for (let i = 0; i < Pa.count; i++) {
          v.fromBufferAttribute(Pa, i).applyMatrix4(p.m); pos.push(v.x, v.y, v.z);
          v.fromBufferAttribute(Na, i).applyMatrix3(nm).normalize(); nor.push(v.x, v.y, v.z);
          uv.push(Ua ? Ua.getX(i) : 0, Ua ? Ua.getY(i) : 0);
        }
      }
      const count = pos.length / 3 - start;
      if (count) groups.push([start, count, mi]);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    for (const [s, c, m] of groups) geo.addGroup(s, c, m);
    geo.computeBoundingSphere();
    return geo;
  }
  const box = (w, h, d, x, y, z, mat, rx) => ({ geo: new THREE.BoxGeometry(w, h, d), mat, m: mat4(x, y, z, 0, rx || 0) });
  // ring: -1 or 1 puts a glowing LED ring on that face of the wheel.
  function wheelParts(parts, x, z, r, wd, dual, rimMat, ring) {
    const tire = new THREE.CylinderGeometry(r, r, wd, 22).rotateZ(Math.PI / 2);
    const rim = new THREE.CylinderGeometry(r * 0.66, r * 0.66, wd + 0.012, 18).rotateZ(Math.PI / 2);
    const hub = new THREE.CylinderGeometry(r * 0.2, r * 0.2, wd + 0.03, 8).rotateZ(Math.PI / 2);
    parts.push({ geo: tire, mat: 2, m: mat4(x, r, z) }, { geo: rim, mat: rimMat || 2, m: mat4(x, r, z) }, { geo: hub, mat: 2, m: mat4(x, r, z) });
    if (ring) parts.push({ geo: new THREE.TorusGeometry(r * 0.74, 0.022, 6, 28).rotateY(Math.PI / 2), mat: 4, m: mat4(x + ring * (wd / 2 + 0.008), r, z) });
    if (dual) parts.push({ geo: tire, mat: 2, m: mat4(x - Math.sign(x) * wd * 1.05, r, z) });
  }

  // sp: L length, W width, clear ride height, tail/belt/beltF/hood/nose heights, gA..gD canopy x
  // stations (from the rear), roof height, wr wheel radius, axR/axF axle stations.
  const CAR_SPECS = {
    hyper: { L: 4.7, W: 2.04, clear: 0.12, tail: 0.92, belt: 0.86, beltF: 0.76, hood: 0.6, nose: 0.4, gA: 1.0, gB: 2.0, gC: 2.85, gD: 3.55, roof: 1.12, wr: 0.36, axR: 1.0, axF: 3.85, wing: true, jets: true },
    coupe: { L: 4.5, W: 1.96, clear: 0.14, tail: 0.88, belt: 0.86, beltF: 0.8, hood: 0.68, nose: 0.46, gA: 0.95, gB: 1.9, gC: 2.7, gD: 3.35, roof: 1.18, wr: 0.34, axR: 0.95, axF: 3.62, wing: true, jets: true },
    sedan: { L: 4.9, W: 1.9, clear: 0.18, tail: 1.0, belt: 0.98, beltF: 0.92, hood: 0.84, nose: 0.62, gA: 0.7, gB: 1.45, gC: 3.0, gD: 3.55, roof: 1.42, wr: 0.34, axR: 1.0, axF: 3.9 },
    pod: { L: 3.9, W: 1.8, clear: 0.2, tail: 1.05, belt: 0.95, beltF: 0.9, hood: 0.86, nose: 0.66, gA: 0.15, gB: 0.55, gC: 2.5, gD: 3.2, roof: 1.55, wr: 0.32, axR: 0.72, axF: 3.15 },
    van: { L: 5.0, W: 2.0, clear: 0.28, tail: 1.3, belt: 1.25, beltF: 1.15, hood: 1.0, nose: 0.82, gA: 0.15, gB: 0.4, gC: 3.6, gD: 4.2, roof: 1.95, wr: 0.38, axR: 0.95, axF: 4.0 }
  };
  function carParts(sp, withWheels) {
    const parts = [];
    const { L, W } = sp;
    // Extrude a side profile across the width; taper(y) narrows it with height (tumblehome).
    const extrude = (shape, depth, bev, mat, taper) => {
      const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, curveSegments: 12 });
      if (taper) {
        const pa = g.attributes.position;
        for (let i = 0; i < pa.count; i++) pa.setZ(i, (pa.getZ(i) - depth / 2) * taper(pa.getY(i)) + depth / 2);
      }
      const m = new THREE.Matrix4().makeRotationY(Math.PI / 2).multiply(new THREE.Matrix4().makeTranslation(-L / 2, 0, -depth / 2));
      parts.push({ geo: g, mat, m });
    };
    const ar = sp.wr + 0.07, y0 = sp.clear;
    const zOf = (x) => L / 2 - x;                         // profile station -> model z (rear is +z)
    const body = new THREE.Shape();
    body.moveTo(0.1, y0);
    body.lineTo(0.02, y0 + 0.12);
    body.lineTo(0, sp.tail - 0.1);
    body.quadraticCurveTo(0, sp.tail, 0.14, sp.tail);
    body.lineTo(sp.gA, sp.belt);
    body.lineTo(sp.gD, sp.beltF);
    body.quadraticCurveTo(L - 0.5, sp.hood, L - 0.12, sp.nose + 0.04);
    body.quadraticCurveTo(L, sp.nose, L, sp.nose - 0.1);
    body.lineTo(L - 0.02, y0 + 0.12);
    body.lineTo(L - 0.12, y0);
    if (!sp.hover) {
      body.lineTo(sp.axF + ar, y0);
      body.lineTo(sp.axF + ar, sp.wr);
      body.absarc(sp.axF, sp.wr, ar, 0, Math.PI, false);
      body.lineTo(sp.axF - ar, y0);
      body.lineTo(sp.axR + ar, y0);
      body.lineTo(sp.axR + ar, sp.wr);
      body.absarc(sp.axR, sp.wr, ar, 0, Math.PI, false);
      body.lineTo(sp.axR - ar, y0);
    }
    body.closePath();
    const sstep = (a, b, y) => smooth(clamp((y - a) / (b - a), 0, 1));
    extrude(body, W - 0.12, 0.06, 0, (y) => 1 - 0.05 * sstep(sp.belt - 0.35, sp.belt + 0.05, y) - 0.05 * sstep(y0 + 0.2, y0 - 0.05, y));
    const gw = W * 0.9;
    const canopy = (y) => lerp(0.97, 0.74, clamp((y - sp.belt) / (sp.roof - sp.belt), 0, 1.1));
    const glass = new THREE.Shape();
    glass.moveTo(sp.gA - 0.05, sp.belt - 0.04);
    glass.quadraticCurveTo(sp.gB - 0.1, sp.roof - 0.02, sp.gB + 0.15, sp.roof);
    glass.lineTo(sp.gC - 0.1, sp.roof);
    glass.quadraticCurveTo(sp.gC + 0.12, sp.roof - 0.02, sp.gD + 0.05, sp.beltF - 0.04);
    glass.closePath();
    extrude(glass, gw - 0.08, 0.04, 1, canopy);
    const roof = new THREE.Shape();
    roof.moveTo(sp.gB + 0.1, sp.roof - 0.03);
    roof.lineTo(sp.gC - 0.05, sp.roof - 0.03);
    roof.lineTo(sp.gC - 0.12, sp.roof + 0.025);
    roof.lineTo(sp.gB + 0.16, sp.roof + 0.025);
    roof.closePath();
    extrude(roof, gw - 0.02, 0.03, 0, canopy);
    const rz = L / 2 + 0.065;                           // rear face, past the bevel
    const ty = sp.tail - 0.14;
    parts.push(box(W * 0.86, 0.06, 0.03, 0, ty, rz, 3));                          // full-width tail bar
    parts.push(box(W * 0.7, 0.018, 0.03, 0, ty - 0.1, rz - 0.003, 4));             // and an LED line under it
    parts.push(box(W * 0.92, 0.14, 0.12, 0, y0 + 0.08, rz - 0.04, 2));             // diffuser
    parts.push(box(W * 0.78, 0.03, 0.03, 0, sp.nose - 0.12, -L / 2 - 0.065, 4));   // front light bar
    parts.push(box(0.1, 0.06, 0.16, -W / 2 - 0.02, sp.beltF + 0.05, zOf(sp.gD) + 0.1, 2), box(0.1, 0.06, 0.16, W / 2 + 0.02, sp.beltF + 0.05, zOf(sp.gD) + 0.1, 2)); // camera pods
    // LED sill strips along both flanks
    const sA = sp.hover ? 0.3 : sp.axR + ar + 0.05, sB = sp.hover ? L - 0.3 : sp.axF - ar - 0.05;
    for (const x of [-1, 1]) parts.push(box(0.02, 0.03, sB - sA, x * (W / 2 + 0.004), y0 + 0.1, zOf((sA + sB) / 2), 4));
    if (sp.wing) {
      parts.push(box(W * 0.9, 0.035, 0.34, 0, sp.tail + 0.26, L / 2 - 0.22, 0, -0.08));
      parts.push(box(W * 0.86, 0.02, 0.02, 0, sp.tail + 0.27, L / 2 - 0.04, 3));
      parts.push(box(0.04, 0.24, 0.14, -W * 0.3, sp.tail + 0.13, L / 2 - 0.22, 2), box(0.04, 0.24, 0.14, W * 0.3, sp.tail + 0.13, L / 2 - 0.22, 2));
    }
    if (sp.jets) {
      const ex = new THREE.CylinderGeometry(0.075, 0.075, 0.08, 14).rotateX(Math.PI / 2);
      parts.push({ geo: ex, mat: 4, m: mat4(-0.42, y0 + 0.17, rz) }, { geo: ex, mat: 4, m: mat4(0.42, y0 + 0.17, rz) });
    }
    if (sp.taxi) parts.push(box(0.56, 0.13, 0.24, 0, sp.roof + 0.09, zOf((sp.gB + sp.gC) / 2), 4));
    if (sp.hover) {
      const pad = new THREE.CylinderGeometry(0.2, 0.25, 0.06, 16);
      for (const z of [zOf(sp.axR), zOf(sp.axF)]) for (const x of [-1, 1]) parts.push({ geo: pad, mat: 4, m: mat4(x * (W / 2 - 0.4), y0 - 0.02, z) });
    } else if (withWheels) {
      for (const z of [zOf(sp.axR), zOf(sp.axF)]) for (const x of [-1, 1]) wheelParts(parts, x * (W / 2 - 0.15), z, sp.wr, 0.25, false, 2, x);

  }
  // Haulers: what you see most is the back, so it gets the LED outline, a full-width tail bar and an

  function truckParts(sp) {

    const by = 1.15, bh = H - by, zr = L / 2;
    parts.push({ geo: new THREE.BoxGeometry(W, bh, boxL), mat: 0, m: mat4(0, by + bh / 2, zr - boxL / 2) });
    parts.push({ geo: new THREE.PlaneGeometry(W - 0.04, bh - 0.04), mat: 5, m: mat4(0, by + bh / 2, zr + 0.005) });
    parts.push(box(W - 0.06, 2.0, cabL, 0, 1.05 + 1.0, -L / 2 + cabL / 2, 6));
    parts.push(box(W - 0.12, H - 3.05, cabL * 0.7, 0, 3.05 + (H - 3.05) / 2, -L / 2 + cabL * 0.62, 6));   // roof fairing
    parts.push(box(W - 0.2, 0.9, 0.04, 0, 2.45, -L / 2 - 0.01, 1));
    parts.push(box(W - 0.2, 0.05, 0.05, 0, 2.98, -L / 2 - 0.02, 4));
    parts.push(box(W - 0.4, 0.3, L - 0.8, 0, 0.8, 0, 2));
    parts.push(box(W - 0.3, 0.14, 0.12, 0, 0.5, zr - 0.1, 2));
    parts.push(box(W - 0.3, 0.1, 0.04, 0, by - 0.12, zr + 0.02, 3));
    for (const x of [-1, 1]) {
      parts.push(box(0.06, bh * 0.8, 0.04, x * (W / 2 - 0.06), by + bh * 0.5, zr + 0.02, 3));
      parts.push(box(0.04, 0.05, boxL - 0.4, x * (W / 2 + 0.01), by + 0.06, zr - boxL / 2, 4));
      parts.push(box(0.04, 0.05, boxL - 0.4, x * (W / 2 + 0.01), H - 0.06, zr - boxL / 2, 4));

    wheelParts(parts, W / 2 - 0.2, -L / 2 + 1.3, r, 0.3);
    for (const z of sp.axles) { wheelParts(parts, -(W / 2 - 0.2), L / 2 - z, r, 0.3, true); wheelParts(parts, W / 2 - 0.2, L / 2 - z, r, 0.3, true); }
    return parts;
  }
  const TRUCK_SPECS = {
    semi: { L: 15, W: 2.5, H: 4.0, boxL: 12.4, cabL: 2.3, axles: [1.4, 2.7, 9.4] },
    box: { L: 7.6, W: 2.4, H: 3.5, boxL: 5.4, cabL: 2.0, axles: [1.6] }
  };
  const MODELS = {};
  function carModel(sp, extra) {
    const s = Object.assign({}, sp, extra);
    return { geo: merge(carParts(s, true)), len: s.L, hw: s.W / 2, tailY: s.tail - 0.14, tailX: s.W / 2 - 0.3, truck: false, hover: !!s.hover, taxi: !!s.taxi };
  }

  for (const k of ["coupe", "sedan", "pod"]) MODELS[k + "H"] = carModel(CAR_SPECS[k], { hover: true });
  MODELS.taxi = carModel(CAR_SPECS.sedan, { taxi: true });
  for (const k in TRUCK_SPECS) MODELS[k] = { geo: merge(truckParts(TRUCK_SPECS[k])), len: TRUCK_SPECS[k].L, hw: TRUCK_SPECS[k].W / 2, tailY: 1.03, tailX: TRUCK_SPECS[k].W / 2 - 0.3, truck: true, hover: false };

  const VM = {
    glass: new THREE.MeshStandardMaterial({ color: 0x05070c, metalness: 0.9, roughness: 0.06, envMapIntensity: 1.5 }),
    trim: new THREE.MeshStandardMaterial({ color: 0x0b0c10, metalness: 0.3, roughness: 0.55 }),
    rim: new THREE.MeshStandardMaterial({ color: 0x8a90a0, metalness: 1, roughness: 0.22 }),

  };

  const PAINTS = [["#e9ecf2", 0.5, 0.25], ["#e9ecf2", 0.5, 0.25], ["#3a3f4a", 0.7, 0.3], ["#121318", 0.3, 0.55], ["#121318", 0.6, 0.25],
    ["#c9ced8", 1, 0.14], ["#3b1a6e", 0.6, 0.28], ["#0f5f6a", 0.6, 0.28], ["#9a0f2a", 0.55, 0.3], ["#d4581a", 0.5, 0.3], ["#7fb6d9", 0.6, 0.3]]
    .map(([c, m, r]) => new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r, envMapIntensity: 1.2 }));

  const TRAILERS = ["#d9dbe0", "#3a3d45", "#1b1c20", "#8a8f99", "#c85a1a", "#2a4a7a"].map((c) => new THREE.MeshStandardMaterial({ color: c, map: ribTex, metalness: 0.35, roughness: 0.5 }));
  const CABS = ["#e9ecf2", "#121318", "#c8402c", "#3a3f4a", "#f0b90b"].map((c) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.5, roughness: 0.3 }));
  const ACCENTS = [0x29f0ff, 0xff2fa8, 0x9a6bff, 0xe8f4ff, 0x7dff5a, 0xffb21e].map((c) => new THREE.MeshBasicMaterial({ color: hdr(c, 3) }));
  const TAXI_ACCENT = new THREE.MeshBasicMaterial({ color: hdr(0xffe7a0, 3.5) });

  /* ---------------- player car ---------------- */
  // A low wedge on glowing wheels, in an oil-slick paint that shifts colour with the light.
  const PSPEC = CAR_SPECS.hyper;
  const player = new THREE.Group();
  player.rotation.order = "YXZ";
  const pBody = new THREE.Group();
  player.add(pBody);
  const paint = new THREE.MeshPhysicalMaterial({ color: 0x3a1858, metalness: 0.8, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.04, iridescence: 1, iridescenceIOR: 1.7, iridescenceThicknessRange: [300, 900], envMapIntensity: 1.6 });
  const pTail = new THREE.MeshBasicMaterial({ color: hdr(0xff1030, 1.8) });
  const pAccent = new THREE.MeshBasicMaterial({ color: hdr(0x29f0ff, 4) });
  const pMats = [paint, VM.glass, VM.trim, pTail, pAccent];

  const underglow = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 5.6), new THREE.MeshBasicMaterial({ map: poolTex, color: hdr(0xb040ff, 1.3), transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));

  const headlight = new THREE.SpotLight(0xe8f4ff, 170, 120, 0.38, 0.55, 1.3);

  headlight.target.position.set(0, 0, -40);
  player.add(headlight, headlight.target);
  scene.add(player);

  /* ---------------- traffic ---------------- */
  const HOVER_LIFT = 0.34;
  const cars = [];
  const pool = {};
  const SHADOWS = 64;
  const shadows = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.75 }), SHADOWS);
  shadows.frustumCulled = false;
  scene.add(shadows);
  // Hover cars light the road under them in their trim colour.
  const under = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending }), SHADOWS);
  under.setColorAt(0, new THREE.Color());
  under.frustumCulled = false; under.count = 0;
  scene.add(under);
  const GLOWS = SHADOWS * 4 + 48;
  const glowPos = new Float32Array(GLOWS * 3), glowCol = new Float32Array(GLOWS * 3);
  const glowGeo = new THREE.BufferGeometry();
  glowGeo.setAttribute("position", new THREE.BufferAttribute(glowPos, 3).setUsage(THREE.DynamicDrawUsage));
  glowGeo.setAttribute("color", new THREE.BufferAttribute(glowCol, 3).setUsage(THREE.DynamicDrawUsage));
  const glowPts = new THREE.Points(glowGeo, new THREE.PointsMaterial({ map: glowTex, size: 1.5, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  glowPts.frustumCulled = false;
  scene.add(glowPts);
  const dummy = new THREE.Object3D();
  dummy.rotation.order = "YXZ";

  function pickModel(d) {
    const r = Math.random();
    if (r < 0.13 + d * 0.07) return "semi";
    if (r < 0.22 + d * 0.09) return "box";
    if (r < 0.34 + d * 0.1) return "van";
    if (r < 0.42 + d * 0.1) return "taxi";
    const base = r < 0.68 + d * 0.06 ? "sedan" : r < 0.88 ? "pod" : "coupe";
    return Math.random() < 0.35 ? base + "H" : base;
  }
  function getMesh(kind) {
    const list = pool[kind] || (pool[kind] = []);
    const m = list.pop() || new THREE.Mesh(MODELS[kind].geo, []);
    m.rotation.order = "YXZ";
    const md = MODELS[kind];
    m.material = [md.truck ? PA.choice(TRAILERS) : md.taxi ? TAXI_PAINT : PA.choice(PAINTS), VM.glass, VM.trim, VM.tail, md.taxi ? TAXI_ACCENT : PA.choice(ACCENTS), PA.choice(DOORS), PA.choice(CABS)];
    m.visible = true;
    scene.add(m);
    return m;
  }
  function releaseCar(c) {
    scene.remove(c.mesh);
    (pool[c.kind] || (pool[c.kind] = [])).push(c.mesh);
  }
  function laneFree(l, s, back, front, self) {
    const lx = laneX(l);
    for (const o of cars) {
      if (o === self) continue;
      if (Math.abs(o.x - lx) > LANE_W * 0.8 && Math.abs(laneX(o.tLane) - lx) > 0.1) continue;
      const ds = o.s - s;
      if (ds > -back - o.len / 2 && ds < front + o.len / 2) return false;
    }
    if (self && Math.abs(pX - lx) < LANE_W * 0.8 && pS - s > -back && pS - s < front) return false;
    for (const w of works) if (w.lane === l && s + front > w.s0 - 25 && s - back < w.s1 + 5) return false;
    return true;
  }
  function spawnCar(s, d) {
    const kind = pickModel(d), m = MODELS[kind];
    const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    for (const l of lanes) {
      if (!laneFree(l, s, 26, 30, null)) continue;
      const cruise = m.truck ? rand(19, 25) : rand(24, 35) + d * 4;
      const c = { kind, len: m.len, hw: m.hw, s, x: laneX(l), lane: l, tLane: l, next: l, v: cruise, cruise, blinkT: 0, moving: false, think: rand(1, 4), brake: false, hitCd: 0, passed: false, phase: rand(TAU), prevDs: s - pS, prevDx: laneX(l) - pX, mesh: getMesh(kind), model: m };
      cars.push(c);
      return c;
    }
    return null;
  }

  /* ---------------- air traffic ---------------- */
  // Streams of flying cars on air lanes that follow the avenue, stacked up between the towers. Far
  // ones are only their lights; a few close ones are real hover cars crossing overhead.
  const AIR_N = 280;
  const airPos = new Float32Array(AIR_N * 3), airCol = new Float32Array(AIR_N * 3);
  const airGeo = new THREE.BufferGeometry();
  airGeo.setAttribute("position", new THREE.BufferAttribute(airPos, 3).setUsage(THREE.DynamicDrawUsage));
  airGeo.setAttribute("color", new THREE.BufferAttribute(airCol, 3));
  const airPts = new THREE.Points(airGeo, new THREE.PointsMaterial({ map: glowTex, size: 3.4, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  airPts.frustumCulled = false;
  scene.add(airPts);
  const AIR_LANES = [];
  for (let i = 0; i < 18; i++) {
    const over = i < 11;          // most stack up over the avenue itself, the rest weave between the towers
    AIR_LANES.push({ lat: over ? rand(-9, 9) : PA.choice([-1, 1]) * rand(60, 260), y: over ? 30 + i * 9 + rand(-3, 3) : rand(60, 230), dir: Math.random() < 0.5 ? 1 : -1, v: rand(35, 75) });
  }
  const air = [];
  function seedAir() {
    air.length = 0;
    for (let i = 0; i < AIR_N; i++) {
      const ln = PA.choice(AIR_LANES);
      // going away you see tail lights (mostly red, some cyan thrusters); coming at you, headlights
      const c = ln.dir > 0 ? (Math.random() < 0.8 ? [3.5, 0.25, 0.4] : [0.5, 2.5, 3.5]) : [3.2, 3.0, 2.6];
      air.push({ s: pS + rand(-150, 1500), lat: ln.lat + rand(-2.5, 2.5), y: ln.y + rand(-1.5, 1.5), dir: ln.dir, v: ln.v * rand(0.85, 1.15) });
      airCol.set(c, i * 3);
    }
    airGeo.attributes.color.needsUpdate = true;
  }
  const FLY_N = 6, FLY_KINDS = ["coupeH", "sedanH", "podH"];
  const flyers = [];
  function launchFlyer(f, ahead) {
    f.dir = Math.random() < 0.55 ? -1 : 1;
    f.s = pS + (ahead ? rand(400, 900) : rand(60, 900));
    f.lat = rand(-9, 9); f.y = rand(11, 20); f.v = rand(28, 60); f.phase = rand(TAU);
  }
  function seedFlyers() {
    for (const f of flyers) releaseCar(f);
    flyers.length = 0;
    for (let i = 0; i < FLY_N; i++) {
      const kind = PA.choice(FLY_KINDS), f = { kind, mesh: getMesh(kind), model: MODELS[kind] };
      launchFlyer(f, false);
      flyers.push(f);
    }
  }
  function updateAir(dt) {
    for (const a of air) {
      a.s += a.dir * a.v * dt;
      if (a.s < pS - 200) a.s += 1700; else if (a.s > pS + 1500) a.s -= 1700;
    }
    for (const f of flyers) {
      f.s += f.dir * f.v * dt;
      if (f.s < pS - 60 || f.s > pS + 1000) launchFlyer(f, true);
    }
  }

  /* ---------------- state ---------------- */
  let pS = START_S, pX = laneX(1), vx = 0, v = 0, steer = 0, accel = 0, brake = 0;
  let timer = START_TIME, score = 0, gates = 0, nextCp = CP_LEN, combo = 0, comboT = 0, nearMisses = 0, crashes = 0, topV = 0;
  let draft = 0, draftHold = 0, spinT = 0, scrape = 0, slide = 0, overSent = false, running = false, attractT = 0, coneT = 0;
  let wheelSpin = 0, roll = 0, pitch = 0, lastHitText = 0;
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
  let camInit = false;
  const hud = document.getElementById("no-hud");
  const fx = new PA.Particles(600), texts = new PA.Texts();

  function difficulty() { return clamp((pS - 600) / 13000, 0, 1); }

  function newWorld() {
    for (const [, g] of chunks) disposeChunk(g);
    for (const [, g] of megas) disposeChunk(g);
    chunks.clear(); megas.clear();
    for (const c of cars) releaseCar(c);
    cars.length = 0;
    T.x = []; T.y = []; T.z = []; T.h = []; T.k = []; T.n = 0;
    works = [];
    bCursor = [0, 0];
    addSection(380, 0, 0);
    pS = START_S; pX = laneX(1); vx = 0;
    updateChunks(pS, true);
    for (let s = pS + 70; s < pS + 820; s += rand(30, 60)) spawnCar(s, 0);
    seedAir(); seedFlyers();
    camInit = false;
  }

  function reset() {
    newWorld();
    v = 0; steer = accel = brake = 0;
    timer = START_TIME; score = 0; gates = 0; nextCp = CP_LEN; combo = 0; comboT = 0; nearMisses = 0; crashes = 0; topV = 0;
    draft = 0; draftHold = 0; spinT = 0; scrape = 0; slide = 0; overSent = false; running = true; coneT = 0;
    fx.clear(); texts.clear();
    hud.classList.add("on");
    PA.music.intensity(0.1);
    paintHud();
  }
  PA.onStart(reset);

  PA.touchControls({
    left: [
      { label: "◀", key: "ArrowLeft", code: "ArrowLeft", aria: "Steer left" },
      { label: "▶", key: "ArrowRight", code: "ArrowRight", aria: "Steer right" }
    ],
    right: [
      { label: "▲", key: "ArrowUp", code: "ArrowUp", aria: "Accelerate" },
      { label: "▼", key: "ArrowDown", code: "ArrowDown", aria: "Brake" }
    ]
  });

  function readInput() {
    steer = (PA.down("ArrowRight", "KeyD", "d", "D") ? 1 : 0) - (PA.down("ArrowLeft", "KeyA", "a", "A") ? 1 : 0);
    brake = PA.down("ArrowDown", "KeyS", "s", "S", " ", "Space") ? 1 : 0;
    // On touch screens the throttle is automatic unless braking, so a thumb on each side is enough.
    accel = (PA.down("ArrowUp", "KeyW", "w", "W") || (PA.isTouch && !brake)) ? 1 : 0;

  function paintHud() {
    PA.stat("s-score", Math.floor(score).toLocaleString());
    PA.stat("s-time", Math.max(0, timer).toFixed(1));
    PA.stat("s-spd", Math.round(v * 3.6));
    const nx = Math.max(0, nextCp - pS);
    PA.stat("s-next", nx >= 1000 ? (nx / 1000).toFixed(1) + " km" : Math.round(nx / 10) * 10 + " m");
    const tEl = document.getElementById("s-time");
    if (tEl) tEl.classList.toggle("warn", timer < 8);
  }

  /* ---------------- autopilot (attract mode) ---------------- */
  let pilotLane = 1;
  function pilot(maxV) {
    let kMax = 0;
    for (let d = 10; d <= 40 + v * 2.4; d += 8) kMax = Math.max(kMax, Math.abs(curvAt(pS + d)));
    const vSafe = kMax > 1e-4 ? Math.sqrt(LAT_MAX * 0.78 / (kMax * CF)) : MAX_V;
    const cur = laneOf(pX);
    const alongside = (l) => {
      for (const c of cars) {
        const ds = c.s - pS;
        if (ds > -c.len / 2 - 3 && ds < c.len / 2 + 5 + v * 0.12 && Math.abs(c.x - laneX(l)) < c.hw + CAR_HW + 0.3) return true;
      }
      for (const w of works) if (w.lane === l && w.s0 < pS + 12 + v * 0.3 && w.s1 > pS - 4) return true;
      return false;
    };
    const clearOf = (l) => {
      let clear = 320;
      for (const c of cars) {
        const ds = c.s - pS;
        if (ds < -4 || ds > 320) continue;
        if (Math.abs(c.x - laneX(l)) < c.hw + 1.5 || (c.moving && Math.abs(laneX(c.tLane) - laneX(l)) < 0.1)) clear = Math.min(clear, ds - c.len / 2 - 3 + c.v * 3);
      }
      for (const w of works) if (w.lane === l && w.s1 > pS - 5 && w.s0 < pS + 320) clear = Math.min(clear, w.s0 - pS - 4);
      return clear;
    };
    if (pilotLane < 0 || pilotLane >= LANES) pilotLane = cur;
    const keep = clearOf(pilotLane);
    let best = pilotLane, bestScore = keep + 25;
    for (let l = 0; l < LANES; l++) {
      if (l === pilotLane) continue;
      const step = Math.sign(l - cur);
      let ok = true;
      for (let m = cur + step; step && m !== l + step; m += step) if (alongside(m)) ok = false;
      if (!ok) continue;
      const sc = clearOf(l) - Math.abs(l - cur) * 8;
      if (sc > bestScore) { bestScore = sc; best = l; }
    }
    pilotLane = best;
    const tx = laneX(best);
    const k = curvAt(pS);
    const want = (tx - pX) * 3 + k * v * v * CF;
    const grip = LAT_MAX * clamp(v / 20, 0.05, 1);
    const st = clamp(want / grip, -1, 1);
    // brake just enough to sit behind whatever is ahead in our path
    let target = Math.min(vSafe, maxV);
    for (const c of cars) {
      const gap = c.s - pS - (c.len + CAR_LEN) / 2;
      if (gap > -1 && gap < 160 && Math.abs(c.x - pX) < c.hw + CAR_HW + 0.35) target = Math.min(target, c.v + Math.sqrt(2 * 20 * Math.max(0, gap - 5)));
    }
    for (const w of works) {
      const gap = w.s0 - pS - CAR_LEN / 2;
      if (gap > -w.s1 + w.s0 && gap < 160 && Math.abs(w.x - pX) < LANE_W / 2 + CAR_HW - 0.4) target = Math.min(target, Math.sqrt(2 * 20 * Math.max(0, gap - 4)));
    }
    return { steer: Math.abs(st) < 0.08 ? 0 : st, accel: v < target - 0.5 ? 1 : 0, brake: v > target + 2 ? 1 : 0 };
  }

  /* ---------------- simulation ---------------- */
  function crashInto(c) {
    c.hitCd = 0.8;
    const impact = v - c.v;
    v = Math.max(0, Math.min(v, c.v * 0.65));
    pS = c.s - (c.len + CAR_LEN) / 2 - 0.05;
    c.v += Math.min(6, impact * 0.15);
    spinT = 0.55;
    if (!running) return;
    crashes++; combo = 0; comboT = 0;
    PA.shake(16, 0.4); PA.hitstop(80);
    PA.flash("rgba(255,92,168,.35)", 260);
    PA.sfx("hit"); PA.sfx("thud", { pitch: 0.7 });
    sparksAt(0, 0.5, -CAR_LEN / 2, 30, ["#ffd36b", "#fff", "#ff7a3d"]);
    if (performance.now() - lastHitText > 600) { texts.add(W / 2, H * 0.42, "CRASH", { color: "#ff5ca8", size: 28, life: 0.9, vy: -30 }); lastHitText = performance.now(); }
  }
  function sideSwipe(c, dir) {
    combo = 0; comboT = 0;
    c.hitCd = 0.45;
    pX = c.x + dir * (c.hw + CAR_HW + 0.03);
    vx = dir * 7;
    v *= 0.9;
    c.x = clamp(c.x - dir * 0.25, -X_LIMIT, X_LIMIT);
    if (!running) return;
    PA.shake(9, 0.25);
    PA.sfx("thud", { pitch: 1.2 });
    sparksAt(-dir * CAR_HW, 0.5, 0, 18, ["#ffd36b", "#fff"]);
  }
  function nearMiss(c) {
    nearMisses++;
    combo = Math.min(combo + 1, 9);
    comboT = 2.8;
    const bonus = (c.model.truck ? 220 : 150) * combo;
    score += bonus;
    PA.sfx("combo", { pitch: 1 + combo * 0.05 });
    texts.add(W / 2, H * 0.62, (combo > 1 ? "NEAR MISS x" + combo : "NEAR MISS") + "  +" + bonus, { color: "#ffd36b", size: 20, life: 0.85, vy: -50 });
  }
  function passCheckpoint() {
    gates++;
    const add = Math.max(17, 25.5 - gates * 0.75);
    timer = Math.min(timer + add, 60);
    const bonus = 1000 + gates * 250 + Math.round(timer * 20);
    score += bonus;
    nextCp += CP_LEN;
    PA.sfx("levelup");
    PA.flash("rgba(142,233,255,.25)", 300);
    texts.add(W / 2, H * 0.3, "CHECKPOINT  +" + add.toFixed(1) + "s", { color: "#8ee9ff", size: 30, life: 1.4, vy: -18 });
    texts.add(W / 2, H * 0.3 + 36, "+" + bonus.toLocaleString(), { color: "#ffd36b", size: 20, life: 1.4, vy: -18 });
    fx.burst(W / 2, H * 0.35, { n: 40, colors: ["#8ee9ff", "#ffd36b", "#ff5ca8"], speed: 320, life: 0.8, size: 3 });
  }
  function endRun() {
    if (overSent) return;
    overSent = true; running = false;
    PA.shake(8, 0.4);
    PA.sfx("gameover");
    hud.classList.remove("on");
    texts.add(W / 2, H * 0.38, "TIME UP", { color: "#ff5ca8", size: 36, life: 1.2, vy: -15 });
    PA.gameOver(Math.floor(score), {
      title: gates ? gates + (gates === 1 ? " checkpoint cleared" : " checkpoints cleared") : "Time up",
      stats: [
        ["Checkpoints", gates],
        ["Distance", ((pS - START_S) / 1000).toFixed(2) + " km"],
        ["Top speed", Math.round(topV * 3.6) + " km/h"],
        ["Near misses", nearMisses],
        ["Crashes", crashes]
      ]
    });
  }

  const sv = new THREE.Vector3();
  function sparksAt(lx, ly, lz, n, colors) {
    sv.set(lx, ly, lz).applyMatrix4(player.matrixWorld).project(camera);
    if (sv.z > 1) return;
    fx.burst((sv.x * 0.5 + 0.5) * W, (-sv.y * 0.5 + 0.5) * H, { n, colors, speed: 260, life: 0.5, size: 2.5, shape: "spark" });
  }

  function drive(dt, ctl) {
    const k = curvAt(pS);
    const vmax = MAX_V + DRAFT_V * draft;
    const ratio = v / MAX_V;
    let a;
    if (ctl.brake) a = -34;
    else if (ctl.accel) a = v < vmax ? 15.5 * (1 - Math.pow(v / vmax, 2.3)) + (v < 12 ? 5 : 0) : -4;
    else a = -(2.5 + 0.0005 * v * v);
    at(pS);
    a -= P.grade * 9.8 * 0.55;
    if (spinT > 0) { spinT -= dt; a = Math.min(a, -6); }
    v = clamp(v + a * dt, 0, MAX_V + DRAFT_V);

    // Steering: the car answers quickly, but corners push it wide in proportion to speed squared.
    const control = spinT > 0 ? 0.3 : 1;
    const target = ctl.steer * LAT_MAX * clamp(v / 20, 0, 1) * control;
    vx += (target - vx) * (1 - Math.exp(-dt * STEER_RESP));
    const push = k * v * v * CF;
    pX += (vx - push) * dt;
    slide = Math.max(0, Math.abs(push) - LAT_MAX * 0.8) / 6 + (ctl.brake && v > 30 ? 0.4 : 0);

    scrape = 0;
    if (Math.abs(pX) > X_LIMIT) {
      const side = Math.sign(pX);
      const into = (vx - push) * side;
      pX = side * X_LIMIT;
      if (into > 0) {
        if (into > 6 && running) { PA.shake(7, 0.2); PA.sfx("thud", { pitch: 0.9 }); }
        vx = -side * Math.min(into * 0.35, 4);
        scrape = 1;
        v = Math.max(0, v - (5 + v * 0.35) * dt);
      }
    }
    pS += v * dt;
    roll = lerp(roll, clamp(-(vx - push) * 0.006 + (ctl.steer * 0.02), -0.06, 0.06), 1 - Math.exp(-dt * 6));
    pitch = lerp(pitch, ctl.brake ? -0.025 : ctl.accel ? 0.012 * (1 - ratio) : 0, 1 - Math.exp(-dt * 5));
    wheelSpin += v * dt / PSPEC.wr;
  }

  function updateTraffic(dt, d) {
    const want = Math.round(Math.min(32, 13 + gates * 2 + d * 8));
    // recycle what fell far behind or ran far ahead
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      if (c.s < pS - 80 || c.s > pS + 1150) { releaseCar(c); cars.splice(i, 1); }
    }
    let tries = 0;
    while (cars.length < want && tries++ < 4) spawnCar(pS + rand(560, 840), d);

    const blinkRate = lerp(1.4, 0.8, d);
    for (const c of cars) {
      if (c.hitCd > 0) c.hitCd -= dt;
      // car-following: slow for the nearest thing ahead in our lane (cars, the player, road works)
      let gap = 1e9, leadV = c.cruise;
      for (const o of cars) {
        if (o === c) continue;
        const ds = o.s - c.s;
        if (ds <= 0 || ds > 120) continue;
        if (Math.abs(o.x - c.x) < o.hw + c.hw + 0.3 || (c.moving && Math.abs(o.x - laneX(c.tLane)) < o.hw + c.hw)) {
          const g = ds - (o.len + c.len) / 2;
          if (g < gap) { gap = g; leadV = o.v; }
        }
      }
      const pds = pS - c.s;
      if (pds > 0 && pds < 120 && Math.abs(pX - c.x) < CAR_HW + c.hw + 0.3) { const g = pds - (CAR_LEN + c.len) / 2; if (g < gap) { gap = g; leadV = v; } }
      let workAhead = false;
      for (const w of works) {
        if (w.s1 < c.s - 10 || w.s0 > c.s + 160) continue;
        if (Math.abs(w.x - c.x) < LANE_W * 0.7) { const g = w.s0 - c.s - c.len / 2 - 4; if (g > -c.len && g < gap) { gap = Math.max(0, g); leadV = 0; } workAhead = true; }
      }
      let vt = c.cruise;
      if (gap < 70) vt = Math.min(vt, leadV + Math.max(0, gap - 10) * 0.45);

      c.v += clamp(vt - c.v, -12 * dt, 3 * dt);
      c.v = Math.max(0, c.v);

      c.think -= dt;
      if (!c.blinkT && !c.moving && c.think <= 0) {
        c.think = rand(1.2, 3.5);

        // Some drivers pull into the player's lane as they close in from behind; they always signal first.
        const ahead = c.s - pS, pl = laneOf(pX);

        if (cutIn) { c.next = pl; c.blinkT = blinkRate * rand(0.9, 1.15); }
        else if (blocked || Math.random() < 0.12 + d * 0.18) {
          const opts = [c.lane - 1, c.lane + 1].filter((l) => l >= 0 && l < LANES && laneFree(l, c.s, 14, 26, c));
          if (opts.length) { c.next = PA.choice(opts); c.blinkT = blinkRate * rand(0.85, 1.2); }
