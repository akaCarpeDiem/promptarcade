<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>

<style>
html,body{margin:0;height:100%;background:#04050c;color:#f4f1ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}

#fu-tools.on{opacity:1}
#fu-tools button{display:flex;align-items:center;gap:.5rem;padding:.55rem .95rem;border-radius:999px;border:1px solid rgba(142,233,255,.35);background:rgba(10,14,34,.7);color:#e9f6ff;font:600 .82rem Manrope,system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s,border-color .15s,box-shadow .15s,opacity .15s}

</style></head><body>
<div id="game" aria-label="Fusion 2048 reactor board"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="pa-hud" id="fu-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat" id="s-tile"><small>Best tile</small><b>2</b></div>
  <div class="pa-stat" id="s-chain"><small>Best chain</small><b>—</b></div>
  <div class="pa-stat" id="s-stage"><small>Reactor</small><b>Cold</b></div>
</div>
<div id="fu-tools">
  <button type="button" id="t-undo" aria-label="Rewind one move">↶ Rewind <b id="n-undo">2</b><kbd>Z</kbd></button>
  <button type="button" id="t-vent" aria-label="Vent a tile">⚡ Vent <b id="n-vent">0</b><kbd>X</kbd></button>
</div>
<script>
window.paConfig = {
  slug: "fusion-2048", title: "Fusion 2048", native: true, music: "lofi", unit: "points",
  controls: [["← → ↑ ↓ / WASD", "Slide the cells"], ["Touch / mouse", "Swipe to slide"], ["Twins touching", "Chain-fuse on their own"], ["Z / X", "Rewind a move · vent a tile"]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

(() => {
"use strict";
// The sliding-tile classic, set in a fusion reactor and rendered in real 3D. Cells are glowing glass
// cubes in a steel tray; twins that slide together fuse, and the twist is the chain reaction: a freshly
// fused cell that lands touching its own twin fuses again by itself, for a growing multiplier. Lead
// blocks drop in, wall off rows and columns, then decay. Chains charge Vents (blow a cell out of the
// tray); bigger cells earn Rewinds. The reactor around the board heats up with the best cell.
const PA = window.PA;
const TAU = Math.PI * 2;
const { clamp, ease, choice, rand } = PA;
const SIZE = 4, ANIM = 0.12, REACT_ANIM = 0.17, LEAD_EVERY = 11, LEAD_LIFE = 9, LEAD_MAX = 2;
const CELL = 1, GAP = 0.12, PITCH = CELL + GAP, TILE_H = 0.42;
const cellPos = (r, c) => ({ x: (c - (SIZE - 1) / 2) * PITCH, z: (r - (SIZE - 1) / 2) * PITCH });

const TIERS = {
  2: 0x5fe6ff, 4: 0xa98cff, 8: 0xff8ac4, 16: 0xff5f8f, 32: 0xff9b4a, 64: 0xffc93d,
  128: 0xfff07a, 256: 0x6cf0a0, 512: 0x3fe6d2, 1024: 0x5aa0ff, 2048: 0xffe4a8
};
const tierCol = (v) => TIERS[v] != null ? TIERS[v] : new THREE.Color().setHSL((Math.log2(v) * 0.11) % 1, 0.9, 0.62).getHex();
const STAGES = [[2, "Cold"], [64, "Warm"], [256, "Hot"], [512, "Critical"], [1024, "Stellar"], [2048, "Fusion"], [4096, "Nova"]];

/* ---------------- renderer + post ---------------- */
const mount = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const dprCap = () => Math.min(PA.isTouch ? 1.75 : 2, devicePixelRatio || 1);
renderer.setPixelRatio(dprCap());
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
mount.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050c);
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 200);
const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

function makePost() {
  const ext = renderer.extensions;
  const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
  const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const main = new THREE.WebGLRenderTarget(1, 1, { type, samples: hdrOk && !fullFloat ? 0 : 4 });
  const LV = 5, lv = [], tmp = [];
  for (let i = 0; i < LV; i++) {
    lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
    tmp.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
  }
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  const pscene = new THREE.Scene();
  pscene.add(quad);
  const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
  const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
  const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
  const bright = mk([
    "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
    "void main(){", box4,
    "  float l = max(c.r, max(c.g, c.b));",
    "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
    "  soft = soft * soft / (4.0 * knee + 1e-4);",
    "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(30.0)), 1.0);",
    "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 1.0 : 0.72 } });
  const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
    { tex: { value: null }, px: { value: new THREE.Vector2() } });
  const blur = mk([
    "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
    "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
    "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
  const comp = mk([
    "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tScene, vUv).rgb;",
    "  vec3 b = texture2D(b0, vUv).rgb * 0.5 + texture2D(b1, vUv).rgb * 0.6 + texture2D(b2, vUv).rgb * 0.75 + texture2D(b3, vUv).rgb * 0.85 + texture2D(b4, vUv).rgb * 0.95;",
    "  c += b * strength;",
    "  vec2 q = vUv - 0.5;",
    "  c *= 1.0 - dot(q, q) * 0.8;",
    "  gl_FragColor = vec4(c, 1.0);",
    "  #include <tonemapping_fragment>",
    "  #include <colorspace_fragment>",
    "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
    "  gl_FragColor.rgb += (n - 0.5) * grain;",
    "}"].join("\n"), {
    tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
    b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.5 }, grain: { value: 0.018 }, time: { value: 0 }
  });
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };
  return {
    comp,
    setSize(w, h) {
      main.setSize(w, h);
      for (let i = 0; i < LV; i++) {
        const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
        lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
      }
    },
    render(sc, cm, t) {
      renderer.setRenderTarget(main);
      renderer.render(sc, cm);
      bright.uniforms.tex.value = main.texture;
      bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
      pass(bright, lv[0]);
      for (let i = 0; i < LV; i++) {
        if (i) {
          down.uniforms.tex.value = lv[i - 1].texture;
          down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
          pass(down, lv[i]);
        }
        blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
        pass(blur, tmp[i]);
        blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
        pass(blur, lv[i]);
      }
      comp.uniforms.time.value = t;
      pass(comp, null);
    }
  };
}
const post = makePost();

let W = innerWidth, H = innerHeight;
const overlay = PA.canvas(document.getElementById("fx"), { onResize: (o) => { W = o.w; H = o.h; } });
const ctx = overlay.ctx;
const texts = new PA.Texts();
const bufSize = new THREE.Vector2(), tmpV = new THREE.Vector3();
let camDist = 9;
const ELEV = 1.16;
function placeCamera(d, ox, oz) {
  camera.position.set(ox || 0, Math.sin(ELEV) * d, Math.cos(ELEV) * d + 0.25 + (oz || 0));
  camera.lookAt(0, 0, 0.25);
}
function fitCamera() {
  // keep the tray (plus a margin) on screen, leaving room for the HUD above and the tools below
  const half = (SIZE * PITCH) / 2 + 0.5;
  let d = 4;
  for (; d < 60; d += 0.1) {
    placeCamera(d); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let ok = true;
    for (const [x, z] of [[-half, -half], [half, -half], [-half, half], [half, half]]) {
      tmpV.set(x, 0.3, z).project(camera);
      if (Math.abs(tmpV.x) > 0.94 || tmpV.y > 0.72 || tmpV.y < -0.74) { ok = false; break; }
    }
    if (ok) break;
  }
  camDist = d;
}
function resize() {
  renderer.setPixelRatio(dprCap());
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(bufSize);
  post.setSize(bufSize.x, bufSize.y);
  fitCamera();
  pointsMat.uniforms.scale.value = bufSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
function toScreen(x, y, z) {
  tmpV.set(x, y, z).project(camera);
  return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
}

/* ---------------- textures ---------------- */
function canvasTex(w, h, paint) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  paint(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
{
  const env = canvasTex(512, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, "#241a40"); gr.addColorStop(0.48, "#5a4a8a"); gr.addColorStop(0.52, "#1a1430"); gr.addColorStop(1, "#06050c");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? "#ffd27a" : "#8ee9ff"; g.fillRect(i * 86 + 20, 50, 40, 12); }
    g.fillStyle = "#fff"; g.fillRect(220, 6, 80, 18);
  });
  env.mapping = THREE.EquirectangularReflectionMapping;
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(env).texture;
  env.dispose(); pm.dispose();
}
const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.25, "rgba(255,255,255,.45)"); gr.addColorStop(.6, "rgba(255,255,255,.08)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
const numTex = new Map();
function numberTex(v) {
  if (numTex.has(v)) return numTex.get(v);
  const t = canvasTex(256, 256, (g, w) => {
    g.clearRect(0, 0, w, w);
    const s = String(v);
    const fs = s.length > 4 ? 64 : s.length > 3 ? 78 : s.length > 2 ? 98 : 124;
    g.font = `800 ${fs}px Manrope, system-ui, sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.lineWidth = fs * 0.14; g.strokeStyle = "rgba(4,6,16,.55)"; g.lineJoin = "round";
    g.strokeText(s, w / 2, w / 2 + 6);
    g.fillStyle = "#fff";
    g.fillText(s, w / 2, w / 2 + 6);
  });
  numTex.set(v, t);
  return t;
}
const leadTexCache = new Map();
function leadTex(n) {
  if (leadTexCache.has(n)) return leadTexCache.get(n);
  const t = canvasTex(256, 256, (g, w) => {
    g.clearRect(0, 0, w, w);
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#cfd5ea"; g.font = "800 52px 'JetBrains Mono', ui-monospace, monospace";
    g.fillText("LEAD", w / 2, w * 0.4);
    g.fillStyle = n <= 2 ? "#ff9ec4" : "#9aa3c0"; g.font = "700 40px 'JetBrains Mono', ui-monospace, monospace";
    g.fillText(n + (n === 1 ? " move" : " moves"), w / 2, w * 0.66);
  });
  leadTexCache.set(n, t);
  return t;
}

/* ---------------- reactor chamber ---------------- */
scene.add(new THREE.HemisphereLight(0x8a90ff, 0x100818, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(-3, 9, 4);
scene.add(keyLight);
const coreLight = new THREE.PointLight(0xffc070, 18, 14, 2);
coreLight.position.set(0, -1.4, 0);
scene.add(coreLight);
const roomFloor = new THREE.Mesh(new THREE.CircleGeometry(30, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x0c0b18, roughness: 0.4, metalness: 0.6 }));
roomFloor.position.y = -2.2;
scene.add(roomFloor);
// plasma well under the tray: the reactor's heart, brighter as the stage rises
const coreMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 }, heat: { value: 0 }, col: { value: new THREE.Color(0xffb35a) } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `
    uniform float time, heat; uniform vec3 col; varying vec2 vUv;
    void main(){
      vec2 p = vUv * 2.0 - 1.0; float r = length(p), a = atan(p.y, p.x);
      float swirl = sin(a * 5.0 + r * 9.0 - time * 1.6) * 0.5 + 0.5;
      float rings = sin(r * 26.0 - time * 3.0) * 0.5 + 0.5;
      float k = smoothstep(1.0, 0.0, r) * (0.35 + 0.65 * swirl) + smoothstep(1.0, 0.6, r) * rings * 0.25;
      k *= smoothstep(1.0, 0.85, r);
      gl_FragColor = vec4(col * k * (0.5 + heat * 1.6), 1.0);
    }`
});
const coreDisk = new THREE.Mesh(new THREE.CircleGeometry(4.6, 64).rotateX(-Math.PI / 2), coreMat);
coreDisk.position.y = -2.15;
scene.add(coreDisk);
// containment rings around the tray
const rings = [];
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  const r = 4.0 + i * 0.9;
  const band = new THREE.Mesh(new THREE.TorusGeometry(r, 0.06 + i * 0.015, 8, 120), new THREE.MeshStandardMaterial({ color: 0x8a92c0, metalness: 0.9, roughness: 0.25 }));
  band.rotation.x = Math.PI / 2;
  g.add(band);
  const marks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 0.05, 0.08), new THREE.MeshBasicMaterial({ color: hdr(i === 1 ? 0xffd27a : 0x8ee9ff, 1.6) }), 24);
  const m4 = new THREE.Matrix4();
  for (let k = 0; k < 24; k++) {
    const a = k / 24 * TAU;
    m4.makeRotationY(-a).setPosition(Math.cos(a) * r, 0.07, Math.sin(a) * r);
    marks.setMatrixAt(k, m4);
  }
  g.add(marks);
  g.position.y = -0.6 - i * 0.55;
  g.rotation.set(i === 1 ? 0.06 : -0.04, 0, i === 2 ? 0.05 : 0);
  scene.add(g);
  rings.push(g);
}
// pillars round the chamber
for (let i = 0; i < 8; i++) {
  const a = i / 8 * TAU + 0.2, r = 8.5;
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.6, 9, 0.6), new THREE.MeshStandardMaterial({ color: 0x1a1a30, metalness: 0.8, roughness: 0.35 }));
  p.position.set(Math.cos(a) * r, 2, Math.sin(a) * r);
  p.rotation.y = -a;
  scene.add(p);
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.08, 8, 0.08), new THREE.MeshBasicMaterial({ color: hdr(0x8ee9ff, 1.4) }));
  s.position.set(Math.cos(a) * (r - 0.32), 2, Math.sin(a) * (r - 0.32));
  scene.add(s);
}

/* ---------------- the tray ---------------- */
function roundedShape(w, d, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -d / 2);
  s.lineTo(w / 2 - r, -d / 2); s.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
  s.lineTo(w / 2, d / 2 - r); s.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
  s.lineTo(-w / 2 + r, d / 2); s.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
  s.lineTo(-w / 2, -d / 2 + r); s.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
  return s;
}
function slab(w, d, h, r, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedShape(w - bevel * 2, d - bevel * 2, r), { depth: h - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 6 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, bevel, 0);
  return g;
}
const traySize = SIZE * PITCH + 0.5;
const tray = new THREE.Mesh(slab(traySize, traySize, 0.5, 0.3, 0.08), new THREE.MeshStandardMaterial({ color: 0x3a3f60, metalness: 0.85, roughness: 0.28 }));
tray.position.y = -0.5;
scene.add(tray);
const trayRim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.03, 6, 4, TAU), new THREE.MeshBasicMaterial({ color: hdr(0xffd27a, 2.6) }));
trayRim.rotation.set(Math.PI / 2, 0, Math.PI / 4);
trayRim.scale.set(traySize * 0.71, traySize * 0.71, 1);
trayRim.position.y = 0.01;
scene.add(trayRim);
const socketMat = new THREE.MeshStandardMaterial({ color: 0x0c0d1c, metalness: 0.4, roughness: 0.25, emissive: 0x2a3070, emissiveIntensity: 0.4 });
const sockets = [];
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
  const p = cellPos(r, c);
  const s = new THREE.Mesh(slab(CELL, CELL, 0.06, 0.14, 0.02), socketMat.clone());
  s.position.set(p.x, -0.04, p.z);
  scene.add(s);
  sockets.push(s);
}

/* ---------------- particles, ribbons, rings ---------------- */
const PMAX = 2500;
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), pSize = new Float32Array(PMAX);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("size", new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const pointsMat = new THREE.ShaderMaterial({

function nudge(dr, dc) { tilt.x += dc * 0.03; tilt.z += dr * 0.03; }
function rewind() {
  if (animating || PA.state !== "play" || overSent || undo <= 0 || !history.length) { if (!history.length && undo > 0) PA.sfx("click", { pitch: 0.6 }); return; }
  const s = history.pop();
  undo--;
  grid = s.grid; lead = s.lead; score = s.score; bestTile = s.bestTile; moves = s.moves;
  rebuildMeshes();
  venting = false;
  PA.sfx("whoosh", { pitch: 0.6 });
  burst(0, 0.4, 0, { n: 40, colors: [0x8ee9ff, 0xc4a6ff], speed: 3, life: 0.6, size: 0.07 });
  toast("Rewound one move");
}
function toggleVent() {
  if (animating || PA.state !== "play" || overSent || vent <= 0) return;
  venting = !venting;
  PA.sfx(venting ? "select" : "click");
}
function ventAt(r, c) {
  const t = cells[r] && cells[r][c];
  if (!t || !venting) return false;
  vent--; venting = false;
  history.push(snapshot()); if (history.length > 6) history.shift();
  grid[r][c] = 0; cells[r][c] = null;
  const p = cellPos(r, c), col = tierCol(t.v);
  burst(p.x, 0.3, p.z, { n: 50, colors: [col, 0xffffff, 0xff9ec4], speed: 3.5, life: 0.8, size: 0.09, up: 5 });
  shock(p.x, p.z, 0xff9ec4, 1.8);
  t.vanish = true; disposeTile(t);
  tiles = tiles.filter((x) => x !== t);
  PA.sfx("explode", { pitch: 1.4 }); PA.shake(6, 0.2);
  if (!canMove(grid) && vent <= 0 && undo <= 0) endGame();
  return true;
}
function reset() {
  for (const t of tiles) disposeTile(t);
  for (const L of leads) disposeTile(L);
  tiles = []; leads = [];
  grid = emptyGrid(); lead = emptyGrid();
  cells = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  moves = 0; chainDepth = 0; bestChain = 0; chains = 0; leadsCleared = 0;
  score = 0; shownScore = 0; bestTile = 2; overSent = false; animating = false; animT = 0; pendingGrid = null; slideAnims = []; mergePop = [];
  undo = 2; vent = 0; venting = false; history = []; stage = 0;
  parts.length = 0; texts.clear();
  PA.music.intensity(0);
  spawnRandom(); spawnRandom();
  bestTile = Math.max(...grid.flat());
  hud.classList.add("on"); tools.classList.add("on");
  updateStage();
}

/* ---------------- input ---------------- */
const hud = document.getElementById("fu-hud"), tools = document.getElementById("fu-tools");
const bUndo = document.getElementById("t-undo"), bVent = document.getElementById("t-vent");
bUndo.addEventListener("click", (e) => { e.stopPropagation(); rewind(); });
bVent.addEventListener("click", (e) => { e.stopPropagation(); toggleVent(); });
PA.onKey((e) => {
  if (e.repeat) return;
  const k = e.key, c = e.code;
  if (k === "ArrowLeft" || c === "KeyA") tryMove(0, -1);
  else if (k === "ArrowRight" || c === "KeyD") tryMove(0, 1);
  else if (k === "ArrowUp" || c === "KeyW") tryMove(-1, 0);
  else if (k === "ArrowDown" || c === "KeyS") tryMove(1, 0);
  else if (c === "KeyZ" || c === "Backspace") rewind();
  else if (c === "KeyX") toggleVent();
});
// swipe anywhere; a short tap on a cell vents it when venting is armed
const ray = new THREE.Raycaster(), planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TILE_H), hitP = new THREE.Vector3();
let sx = 0, sy = 0, sid = null, st = 0;
addEventListener("pointerdown", (e) => {
  if (PA.state !== "play" || PA.isPaused()) return;
  if (e.target.closest && e.target.closest("button,input,a,#pa-gate,.pa-layer,.pa-tb")) return;
  sx = e.clientX; sy = e.clientY; sid = e.pointerId; st = performance.now();
});
addEventListener("pointerup", (e) => {
  if (sid !== e.pointerId) return;
  sid = null;
  const dx = e.clientX - sx, dy = e.clientY - sy, d = Math.hypot(dx, dy);
  if (d < 14 && performance.now() - st < 500) {
    if (!venting) return;
    ray.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
    if (!ray.ray.intersectPlane(planeY, hitP)) return;
    const c = Math.round(hitP.x / PITCH + (SIZE - 1) / 2), r = Math.round(hitP.z / PITCH + (SIZE - 1) / 2);
    if (r >= 0 && c >= 0 && r < SIZE && c < SIZE) ventAt(r, c);
    return;
  }
  if (d < 28) return;
  if (Math.abs(dx) > Math.abs(dy)) tryMove(0, dx > 0 ? 1 : -1);
  else tryMove(dy > 0 ? 1 : -1, 0);
});

/* ---------------- update + render ---------------- */
function update(dt) {
  updateParts(dt);
  texts.update(dt);
  for (const w of waves) w.t += dt;
  for (let i = waves.length - 1; i >= 0; i--) if (waves[i].t > 0.6) { scene.remove(waves[i].m); waves[i].m.material.dispose(); waves.splice(i, 1); }
  for (let i = arcs.length - 1; i >= 0; i--) if ((arcs[i].t += dt) > 0.35) arcs.splice(i, 1);
  for (const t of tiles) { t.spawn = Math.min(1, t.spawn + dt / 0.22); t.pop = Math.max(0, t.pop - dt / 0.25); }
  for (const L of leads) if (L.drop) L.drop = Math.max(0, L.drop - dt / 0.28);
  heat += ((stage / (STAGES.length - 1)) - heat) * Math.min(1, dt * 1.5);
  tilt.x *= Math.exp(-dt * 6); tilt.z *= Math.exp(-dt * 6);
  if (PA.state !== "play" || !grid) return;
  if (animating) {
    animT += dt;
    if (animT >= animLen) finishAnim();
  }
}
let lastHud = "";
function render(t) {
  const sh = PA.shakeOffset();
  placeCamera(camDist, sh.x * 0.01, sh.y * 0.01);
  camera.updateMatrixWorld();
  const prog = animating ? ease.outCubic(clamp(animT / animLen, 0, 1)) : 1;
  for (const tl of tiles) {
    const a = cellPos(tl.fr, tl.fc), b = cellPos(tl.r, tl.c);
    const x = a.x + (b.x - a.x) * prog, z = a.z + (b.z - a.z) * prog;
    const drop = 1 - ease.outBack(tl.spawn);
    tl.g.position.set(x, drop * 1.2, z);
    const sc = (tl.spawn < 1 ? 0.6 + 0.4 * ease.outBack(tl.spawn) : 1) * (1 + tl.pop * 0.16);
    tl.g.scale.set(sc, 1 + tl.pop * 0.5, sc);
    if (tl.vanish) { const k = Math.max(0, 1 - prog * 1.4); tl.g.scale.setScalar(Math.max(0.01, 0.4 + k * 0.6)); }
    const u = tl.body.material.uniforms;
    u.time.value = t; u.flash.value = Math.max(0, u.flash.value - 0.06); u.vent.value = venting ? 1 : 0;
    if (tl.halo) tl.halo.material.opacity = 0.6 + Math.sin(t * 3 + tl.c) * 0.25;
  }
  for (const L of leads) {
    const p = cellPos(L.r, L.c);
    L.g.position.set(p.x, L.drop * 3, p.z);
  }
  // tray tilt answers each slide
  tray.rotation.set(tilt.z * 0.5, 0, -tilt.x * 0.5);
  // reactor
  coreMat.uniforms.time.value = t; coreMat.uniforms.heat.value = heat;
  coreMat.uniforms.col.value.setHSL(0.09 - heat * 0.06, 1, 0.55 + heat * 0.1);
  coreLight.intensity = 14 + heat * 40 + Math.sin(t * 3) * 3;
  rings.forEach((g, i) => { g.rotation.y = t * (0.12 + i * 0.07) * (i % 2 ? -1 : 1) * (1 + heat * 2); });
  trayRim.material.color.copy(hdr(0xffd27a, 0.9 + heat * 1.6 + Math.sin(t * 2) * 0.2));
  // embers
  for (const e of embers) {
    e.y += e.v * (1 + heat * 2) * 0.016;
    if (e.y > 6) { e.y = -2; e.x = rand(-6, 6); e.z = rand(-6, 3); }
    if (parts.length < PMAX && Math.random() < 0.02) parts.push({ x: e.x, y: e.y, z: e.z, vx: 0, vy: e.v, vz: 0, g: -0.2, life: 2.5, max: 2.5, size: e.s, c: C3(heat > 0.6 ? 0xff9ec4 : 0xffb35a, 1.6) });
  }
  for (const w of waves) { const k = w.t / 0.6; w.m.scale.setScalar(0.3 + ease.outCubic(k) * w.size); w.m.material.opacity = 1 - k; }
  tv = 0;
  for (const a of arcs) {
    const k = 1 - a.t / 0.35, n = 7, tr = [];
    for (let i = 0; i <= n; i++) { const f = i / n; tr.push(a.x0 + (a.x1 - a.x0) * f + (i && i < n ? rand(-0.12, 0.12) : 0), TILE_H + 0.15 + Math.sin(f * Math.PI) * 0.35, a.z0 + (a.z1 - a.z0) * f + (i && i < n ? rand(-0.12, 0.12) : 0)); }
    ribbon(tr, [a.col[0] * k, a.col[1] * k, a.col[2] * k], 0.035);
  }
  tGeo.setDrawRange(0, tv);
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true;
  for (const s of sockets) s.material.emissiveIntensity = venting ? 0.9 + Math.sin(t * 8) * 0.3 : 0.35 + heat * 0.4;

  post.render(scene, camera, t);
  ctx.setTransform(overlay.dpr, 0, 0, overlay.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  texts.draw(ctx);
  if (PA.state === "play" && venting) {
    ctx.textAlign = "center"; ctx.font = "700 14px Manrope, system-ui, sans-serif";
    ctx.fillStyle = `rgba(255,158,196,${0.7 + Math.sin(t * 6) * 0.25})`;
    const p = toScreen(0, 0, (SIZE * PITCH) / 2 + 0.3);
    ctx.fillText((PA.isTouch ? "Tap" : "Click") + " a cell to vent it · X to cancel", W / 2, p.y + 22);
  }
  if (PA.state === "play" && moves === 0 && !animating) {
    ctx.textAlign = "center"; ctx.font = `600 ${W < 520 ? 13 : 15}px Manrope, system-ui, sans-serif`;
    ctx.fillStyle = "rgba(220,235,255,.75)";
    const p = toScreen(0, 0, (SIZE * PITCH) / 2 + 0.3);
    ctx.fillText((PA.isTouch ? "Swipe" : "Arrow keys or swipe") + " · twins fuse · fused twins that touch chain", W / 2, p.y + 22);
  }
  if (PA.state === "play") {
    shownScore += (score - shownScore) * 0.25;
    if (Math.abs(score - shownScore) < 1) shownScore = score;
    const key = Math.round(shownScore) + "|" + bestTile + "|" + bestChain + "|" + undo + "|" + vent + "|" + venting + "|" + history.length;
    if (key !== lastHud) {
      lastHud = key;
      PA.stat("s-score", Math.round(shownScore).toLocaleString());
      PA.stat("s-tile", bestTile);
      PA.stat("s-chain", bestChain ? "×" + bestChain : "—");
      document.getElementById("n-undo").textContent = undo;
      document.getElementById("n-vent").textContent = vent;
      bUndo.disabled = undo <= 0 || !history.length;
      bVent.disabled = vent <= 0;
      bVent.classList.toggle("armed", venting);
    }
  }
}

addEventListener("resize", resize);
resize();
grid = emptyGrid(); lead = emptyGrid(); cells = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
// an idle board for the title screen
[[0, 1, 2], [1, 2, 8], [2, 0, 64], [3, 3, 512], [1, 0, 4], [2, 3, 2048]].forEach(([r, c, v]) => { grid[r][c] = v; cells[r][c] = newTile(v, r, c, false); });
PA.onStart(reset);
PA.loop(update, render);
window.__f2048 = () => ({ score, best: bestTile, moves, bestChain, chains, undo, vent, lead: lead.map((r) => r.slice()), grid: grid.map((r) => r.slice()) });
window.__fu = { tryMove, rewind, toggleVent, ventAt, sim: (sec) => { for (let i = 0; i < sec * 60; i++) update(1 / 60); }, set: (g) => { grid = g.map((r) => r.slice()); rebuildMeshes(); }, setTools: (u, v) => { undo = u; vent = v; } };
})();
</script>
