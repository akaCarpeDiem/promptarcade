<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Wordglow — PromptArcade</title>
<style>
:root{--hit:#2ee6c5;--near:#b48cff;--miss:#2a2f4a;--bg:#070814;--ink:#eef0ff}
html,body{margin:0;height:100%;background:#05060f;color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0;z-index:0}
#game canvas{display:block;width:100%;height:100%}
/* the DOM grid keeps the layout, the state and the screen-reader text; the 3D board draws it */
#wg-grid{opacity:0}
#wg-grid,.wg-row{position:relative}
#wg{z-index:1;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:58px 8px max(10px,env(safe-area-inset-bottom));box-sizing:border-box}
#wg-head{display:flex;align-items:center;gap:.6rem;font:700 12px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#a9b4ff;margin-bottom:6px}
#wg-head b{color:#fff}
.wg-pill{all:unset;cursor:pointer;padding:.3rem .7rem;border-radius:999px;border:1px solid rgba(169,180,255,.25);background:rgba(255,255,255,.04);font:700 11px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#dfe3ff}
.wg-pill.on{background:rgba(46,230,197,.15);border-color:var(--hit);color:#c8fff3}
.wg-pill{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,border-color .15s,opacity .15s}
.wg-pill.spark{border-color:rgba(255,214,122,.45);color:#ffe6a8;background:rgba(255,214,122,.08)}
.wg-pill.spark:hover{background:rgba(255,214,122,.18)}
.wg-pill.spark.used{opacity:.35;pointer-events:none}
#wg-board{flex:1;display:grid;place-items:center;width:100%;min-height:0}
#wg-grid{display:grid;grid-template-rows:repeat(6,1fr);gap:7px;height:min(100%,420px);aspect-ratio:5/6;max-width:94vw}
.wg-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.wg-row.shake{animation:wgs .45s}
@keyframes wgs{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.wg-t{display:grid;place-items:center;border-radius:12px;border:2px solid rgba(169,180,255,.16);background:rgba(255,255,255,.025);font:800 clamp(20px,5.2vh,34px) Unbounded,Manrope,sans-serif;text-transform:uppercase;color:#fff;perspective:400px;transition:border-color .15s}
.wg-t.filled{border-color:rgba(200,210,255,.5);animation:wgp .12s}
@keyframes wgp{50%{transform:scale(1.08)}}
.wg-t.rev{animation:wgf .55s both}
@keyframes wgf{0%{transform:rotateX(0)}49%{transform:rotateX(90deg)}51%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.wg-t.hit{background:linear-gradient(160deg,#3ff7d6,#16b89c);border-color:transparent;color:#03241e;box-shadow:0 0 22px rgba(46,230,197,.45)}
.wg-t.near{background:linear-gradient(160deg,#c9a8ff,#8a5cf0);border-color:transparent;color:#1d0b3d;box-shadow:0 0 18px rgba(180,140,255,.35)}
.wg-t.miss{background:#20243c;border-color:transparent;color:#8d93b8}
.wg-t.lock{border-color:rgba(46,230,197,.55);color:#c8fff3;box-shadow:inset 0 0 14px rgba(46,230,197,.18)}
.wg-row.off .wg-t{border-style:dashed;border-color:rgba(169,180,255,.07);background:transparent}
#wg-chain{display:flex;align-items:center;gap:6px;margin:2px 0 6px;font:800 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
#wg-chain .lk{min-width:66px;padding:.3rem .5rem;border-radius:9px;border:1px solid rgba(169,180,255,.2);color:#6f77a6;text-align:center;background:rgba(255,255,255,.03)}
#wg-chain .lk.now{border-color:var(--near);color:#e6dbff;box-shadow:0 0 14px rgba(180,140,255,.3)}
#wg-chain .lk.ok{background:linear-gradient(160deg,#3ff7d6,#16b89c);border-color:transparent;color:#03241e}
#wg-chain .lk.bad{border-color:rgba(255,107,138,.5);color:#ff9fb4}
#wg-chain i{font-style:normal;color:#5b6185}
#wg-left{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#a9b4ff;text-transform:uppercase;margin-bottom:4px}
#wg-left b{color:#fff}
.wg-row.win .wg-t{animation:wgw .6s both}
@keyframes wgw{40%{transform:translateY(-14px) scale(1.06)}70%{transform:translateY(3px)}}
#wg-keys{width:min(560px,100%);display:flex;flex-direction:column;gap:7px;margin-top:8px}
.wg-kr{display:flex;gap:5px;justify-content:center}
.wg-k{all:unset;cursor:pointer;flex:1;max-width:46px;height:clamp(44px,7vh,56px);border-radius:11px;background:linear-gradient(170deg,rgba(64,72,120,.72),rgba(32,36,66,.78));border:1px solid rgba(180,190,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;font:800 14px Manrope,sans-serif;text-transform:uppercase;color:#fff;transition:background .25s,transform .06s,box-shadow .25s}
.wg-k:active{transform:scale(.94)}
.wg-k.wide{max-width:72px;flex:1.5;font-size:11px;letter-spacing:.06em}
.wg-k.hit{background:linear-gradient(170deg,#3ff7d6,#13a58b);color:#02231d;box-shadow:0 0 16px rgba(46,230,197,.4)}.wg-k.near{background:linear-gradient(170deg,#c3a2ff,#7b4fe6);box-shadow:0 0 14px rgba(180,140,255,.35)}.wg-k.miss{background:rgba(16,18,34,.8);color:#4d5378;box-shadow:none}
#wg-toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);z-index:60;background:#fff;color:#0a0b18;font:800 14px Manrope,sans-serif;padding:.55rem 1rem;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#wg-toast.on{opacity:1}
#wg-res{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(5,6,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
#wg-res[hidden]{display:none}
.wg-card{width:min(420px,100%);background:linear-gradient(170deg,#161a3a,#0b0d22);border:1px solid rgba(169,180,255,.22);border-radius:22px;padding:22px 20px 18px;text-align:center;animation:wgin .35s}
@keyframes wgin{from{opacity:0;transform:translateY(18px) scale(.97)}}
.wg-card h2{margin:.1em 0;font:800 26px Unbounded,Manrope,sans-serif;background:linear-gradient(90deg,var(--hit),var(--near));-webkit-background-clip:text;background-clip:text;color:transparent}
.wg-card .word{font:800 13px 'JetBrains Mono',monospace;letter-spacing:.3em;color:#cfd5ff;margin:.2em 0 1em}
.wg-dist-h{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9aa3d6;text-align:left;margin:0 0 6px}
.wg-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.wg-stats div b{display:block;font:800 24px 'JetBrains Mono',monospace}
.wg-stats div small{font-size:10px;color:#9aa3d6;text-transform:uppercase;letter-spacing:.08em}
.wg-dist{display:grid;gap:4px;margin:0 0 14px;text-align:left}
.wg-dist div{display:flex;align-items:center;gap:6px;font:700 11px 'JetBrains Mono',monospace}
.wg-dist i{display:block;height:18px;min-width:22px;border-radius:5px;background:#2b3050;font-style:normal;text-align:right;padding-right:6px;line-height:18px;box-sizing:border-box}
.wg-dist i.me{background:linear-gradient(90deg,#16b89c,#3ff7d6);color:#02231d}
.wg-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wg-btn{all:unset;cursor:pointer;padding:.7rem 1.2rem;border-radius:999px;font:800 14px Manrope,sans-serif;background:linear-gradient(90deg,var(--hit),var(--near));color:#06101c}
.wg-btn.ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.16)}
.wg-next{font:600 12px 'JetBrains Mono',monospace;color:#9aa3d6;margin-top:12px}
.wg-rank{font-size:12.5px;color:#cfd5ff;margin:-4px 0 12px;min-height:1em}
@media (max-height:640px){#wg{padding-top:50px}#wg-grid{height:min(100%,300px)}#wg-chain{margin:0 0 3px}#wg-left{display:none}}
</style></head><body>
<div id="game" aria-hidden="true"></div>
<div id="wg">
  <div id="wg-head"><span>Daily <b id="wg-num">#1</b></span><button class="wg-pill" id="wg-mode" type="button">Daily</button><button class="wg-pill" id="wg-hard" type="button" title="Hard mode: revealed hints must be used">Hard</button><button class="wg-pill" id="wg-stats-btn" type="button">Stats</button><button class="wg-pill spark" id="wg-spark" type="button" title="Spend one guess to light up a letter of this word">✦ Spark</button></div>
  <div id="wg-chain" aria-label="Today's chain"></div>
  <div id="wg-left"><b id="wg-left-n">12</b> guesses for the whole chain</div>
  <div id="wg-board"><div id="wg-grid" role="grid" aria-label="Guesses"></div></div>
  <div id="wg-keys" aria-label="Keyboard"></div>
</div>
<div id="wg-toast" role="status" aria-live="polite"></div>
<div id="wg-res" hidden><div class="wg-card">
  <h2 id="wg-res-h">Glowing!</h2>
  <div class="word" id="wg-res-w"></div>
  <div class="wg-rank" id="wg-res-rank"></div>
  <div class="wg-stats"><div><b id="st-p">0</b><small>Played</small></div><div><b id="st-w">0</b><small>Win %</small></div><div><b id="st-s">0</b><small>Streak</small></div><div><b id="st-m">0</b><small>Best</small></div></div>
  <div class="wg-dist-h">Links solved</div>
  <div class="wg-dist" id="wg-dist"></div>
  <div class="wg-btns"><button class="wg-btn" id="wg-share" type="button">Share result</button><button class="wg-btn ghost" id="wg-practice" type="button">Practice round</button><button class="wg-btn ghost" id="wg-close" type="button">Close</button></div>
  <div class="wg-next" id="wg-next"></div>
</div></div>
<script>
window.paConfig = {
  slug: "wordglow", title: "Wordglow", native: true, typing: true, music: "lofi", unit: "points",
  controls: [["Type / tap", "Enter a five-letter word"], ["Enter", "Submit"], ["Backspace", "Delete"], ["✦ Spark", "Spend a guess to light one letter (once per word)"], ["The chain", "Three words a day, each starting with the last letter of the one before. Twelve guesses cover all three."]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script type="module">
import { ANSWERS, VALID } from "/games/play/wordglow/words.js";
import * as THREE from "/vendor/three/three.module.min.js";
const $ = (id) => document.getElementById(id);
const answers = []; for (let i = 0; i < ANSWERS.length; i += 5) answers.push(ANSWERS.slice(i, i + 5));
const valid = new Set(); for (let i = 0; i < VALID.length; i += 5) valid.add(VALID.slice(i, i + 5));
const EPOCH = new Date(2026, 9, 11); // puzzle #1
function dayIndex(d = new Date()) { const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return Math.round((a - EPOCH) / 864e5); }
const today = dayIndex();
const dailyNo = today + 1;

/* ---------- the chain: three words, each starting with the last letter of the one before ---------- */
const LINKS = 3, BUDGET = 12;
const byFirst = {}; for (const w of answers) (byFirst[w[0]] = byFirst[w[0]] || []).push(w);
// a link may only end on a letter that plenty of answers start with, so chains don't all funnel through Y or X
const roomy = (w) => (byFirst[w[4]] || []).length >= 25;
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = Math.imul(n, 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); return (n ^ (n >>> 15)) >>> 0; }
function buildChain(startIdx, seed) {
  const len = answers.length;
  for (let k = 0; k < len; k++) {
    const first = answers[(startIdx + k) % len];
    if (!roomy(first)) continue;
    const chain = [first];
    for (let l = 1; l < LINKS; l++) {
      const prev = chain[l - 1], last = l === LINKS - 1;
      const pool = (byFirst[prev[4]] || []).filter((w) => !chain.includes(w) && (last || roomy(w)));
      if (!pool.length) break;
      chain.push(pool[hash(seed * 31 + l * 7 + k) % pool.length]);
    }
    if (chain.length === LINKS) return chain;
  }
  return answers.slice(0, LINKS);
}
const dailyChain = buildChain(((today % answers.length) + answers.length) % answers.length, today + 1000);

/* ---------- persistence ---------- */
const KEY = "wg_v1";
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } })();
store.stats = store.stats || { played: 0, wins: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0], lastWin: null, lastPlayed: null };
store.stats.links = store.stats.links || [0, 0, 0, 0];
store.hard = !!store.hard;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
// streak breaks if you missed yesterday
if (store.stats.lastWin != null && store.stats.lastWin < today - 1 && store.stats.streak) { store.stats.streak = 0; save(); }
// a saved daily from before the chain arrived is a different puzzle: drop it (stats already counted it)
if (store.daily && store.daily.v !== 2) { delete store.daily; save(); }

let mode = "daily", chain = dailyChain, stage = 0, word = chain[0], rows = [], all = [], cur = "", done = false, busy = false, lock = 0;
const state = {}; // letter -> hit/near/miss for the current word
// a spark spends one guess from the shared budget to light one letter of the current word
let sparks = [];
const hints = {}; // position -> letter lit by a spark, for the current word
const used = () => all.length + sparks.length;
const left = () => BUDGET - used();

/* ---------- build grid + keyboard ---------- */
const grid = $("wg-grid");
for (let r = 0; r < 6; r++) {
  const row = document.createElement("div"); row.className = "wg-row"; row.setAttribute("role", "row");
  for (let c = 0; c < 5; c++) { const t = document.createElement("div"); t.className = "wg-t"; t.setAttribute("role", "gridcell"); row.appendChild(t); }
  grid.appendChild(row);
}
const KB = ["qwertyuiop", "asdfghjkl", "↵zxcvbnm⌫"];
KB.forEach((line) => {
  const r = document.createElement("div"); r.className = "wg-kr";
  for (const ch of line) {
    const b = document.createElement("button"); b.type = "button"; b.className = "wg-k" + (ch === "↵" || ch === "⌫" ? " wide" : "");
    b.textContent = ch === "↵" ? "ENTER" : ch === "⌫" ? "⌫" : ch; b.dataset.k = ch === "↵" ? "Enter" : ch === "⌫" ? "Backspace" : ch;
    b.setAttribute("aria-label", b.dataset.k);
    r.appendChild(b);
  }
  $("wg-keys").appendChild(r);
});
$("wg-keys").addEventListener("click", (e) => { const b = e.target.closest(".wg-k"); if (b) { press(b.dataset.k); b.blur(); } });
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (window.paGate && window.paGate.isOpen && window.paGate.isOpen()) return;
  if (PA.state !== "play" || PA.isPaused()) return;
  if (!$("wg-res").hidden) { if (e.key === "Escape") $("wg-res").hidden = true; return; }
  if (e.key === "Enter" || e.key === "Backspace" || /^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); press(e.key.length === 1 ? e.key.toLowerCase() : e.key); }
});

function toast(msg, ms = 1600) { const t = $("wg-toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), ms); }
function rowEl(i) { return grid.children[i]; }
function paintCur() {
  const r = rowEl(rows.length); if (!r) return;
  [...r.children].forEach((t, i) => { t.textContent = cur[i] || ""; t.classList.toggle("filled", !!cur[i]); t.classList.toggle("lock", i < lock); t.dataset.ghost = !cur[i] && hints[i] ? hints[i] : ""; });
}
function paintChain() {
  const el = $("wg-chain"); el.innerHTML = "";
  chain.forEach((w, i) => {
    if (i) { const a = document.createElement("i"); a.textContent = "→"; el.appendChild(a); }
    const d = document.createElement("span"); d.className = "lk";
    const solved = i < stage || (done && i === stage && rows.length && rows[rows.length - 1].guess === w);
    if (solved) { d.classList.add("ok"); d.textContent = w; }
    else if (done) { d.classList.add("bad"); d.textContent = w; }
    else if (i === stage) { d.classList.add("now"); d.textContent = (i ? w[0] : "?") + "····"; }
    else d.textContent = "·····";
    el.appendChild(d);
  });
  $("wg-left-n").textContent = Math.max(0, left());
  // rows this word can still use: the rest of the shared budget, at most six
  const avail = Math.min(6, rows.length + Math.max(0, left()));
  [...grid.children].forEach((r, i) => r.classList.toggle("off", i >= avail));
  $("wg-spark").classList.toggle("used", done || sparks.some((x) => x.stage === stage) || left() <= 1);
}
function press(k) {
  if (done || busy || PA.state !== "play") return;
  if (k === "Backspace") { if (cur.length > lock) { cur = cur.slice(0, -1); paintCur(); } return; }
  if (k === "Enter") return submit();
  if (cur.length < 5 && /^[a-z]$/.test(k)) { cur += k; paintCur(); PA.sfx("click", { pitch: 0.9 + cur.length * 0.08, vol: .4 }); }
}
function score(guess, ans) {
  const res = Array(5).fill("miss"), left = {};
  for (let i = 0; i < 5; i++) { if (guess[i] === ans[i]) res[i] = "hit"; else left[ans[i]] = (left[ans[i]] || 0) + 1; }
  for (let i = 0; i < 5; i++) if (res[i] !== "hit" && left[guess[i]]) { res[i] = "near"; left[guess[i]]--; }
  return res;
}
function hardCheck(g) {
  for (const { guess, res } of rows) {
    for (let i = 0; i < 5; i++) {
      if (res[i] === "hit" && g[i] !== guess[i]) return `Letter ${i + 1} must be ${guess[i].toUpperCase()}`;
      if (res[i] === "near" && !g.includes(guess[i])) return `Guess must contain ${guess[i].toUpperCase()}`;
    }
  }
  return null;
}
function submit() {
  const r = rowEl(rows.length);
  if (cur.length < 5) { shake(r); toast("Not enough letters"); return; }
  if (!valid.has(cur)) { shake(r); toast("Not in the word list"); PA.sfx("thud"); return; }
  if (store.hard) { const h = hardCheck(cur); if (h) { shake(r); toast(h); return; } }
  const res = score(cur, word);
  rows.push({ guess: cur, res }); all.push(cur);
  reveal(r, cur, res, true);
  const g = cur; cur = lock ? word.slice(0, lock) : "";
  if (mode === "daily") { store.daily = { v: 2, day: today, rows: all.slice(), hard: store.hard, sparks: sparks.slice() }; save(); }
  busy = true;
  setTimeout(() => {
    busy = false;
    if (g === word && stage < LINKS - 1 && left() <= 0) { stage++; word = chain[stage]; finish(false); }
    else if (g === word) { if (stage < LINKS - 1) nextLink(true); else finish(true); }
    else if (left() <= 0 || rows.length >= 6) finish(false);
    else { paintChain(); paintCur(); }
  }, 5 * 230 + 350);
  $("wg-left-n").textContent = Math.max(0, left());
}
function shake(r) { r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake"); }
function reveal(r, guess, res, animate) {
  [...r.children].forEach((t, i) => {
    t.textContent = guess[i]; t.classList.remove("lock"); t.dataset.ghost = "";
    const go = () => {
      t.classList.add(res[i]); t.classList.remove("filled");
      const kb = $("wg-keys").querySelector(`[data-k="${guess[i]}"]`);
      const rank = { hit: 3, near: 2, miss: 1 };
      if (!state[guess[i]] || rank[res[i]] > rank[state[guess[i]]]) { state[guess[i]] = res[i]; if (kb) { kb.classList.remove("hit", "near", "miss"); kb.classList.add(res[i]); } }
      if (animate) PA.sfx(res[i] === "hit" ? "coin" : res[i] === "near" ? "blip" : "click", { pitch: 0.8 + i * 0.1, vol: .45 });
    };
    if (animate) { t.style.animationDelay = i * 230 + "ms"; t.classList.add("rev"); setTimeout(go, i * 230 + 270); }
    else go();
  });
}
// solved a link: celebrate, then open the next word with its first letter locked in
function nextLink(animate) {
  const solved = word;
  if (animate) {
    const r = rowEl(rows.length - 1); [...r.children].forEach((t, i) => { t.style.animationDelay = i * 90 + "ms"; }); r.classList.add("win");
    PA.sfx("power", { pitch: 1 + stage * 0.15 });
    toast(`Link ${stage + 1} glows — next word starts with ${solved[4].toUpperCase()}`, 1900);
  }
  const go = () => {
    stage++; word = chain[stage]; clearBoard(); lock = 1; cur = word[0]; paintCur(); paintChain();
  };
  if (animate) { busy = true; setTimeout(() => { busy = false; go(); }, 1300); } else go();
}
function finish(won) {
  done = true;
  const n = used(), links = stage + (won ? 1 : 0);
  if (won) { const r = rowEl(rows.length - 1); [...r.children].forEach((t, i) => { t.style.animationDelay = i * 90 + "ms"; }); r.classList.add("win"); PA.sfx("levelup"); }
  else { toast(word.toUpperCase(), 3000); PA.sfx("lose"); }
  paintChain();
  let reportScore = 0;
  if (mode === "daily") {
    const s = store.stats;
    if (s.lastPlayed !== today) {
      s.played++; s.lastPlayed = today;
      s.links[links]++;
      if (won) { s.wins++; s.streak = s.lastWin === today - 1 ? s.streak + 1 : 1; s.lastWin = today; s.best = Math.max(s.best, s.streak); }
      else s.streak = 0;
      store.daily.result = links; store.daily.done = true;
      save();
      if (won) reportScore = s.streak * 100 + (BUDGET - n) * 15 + (store.hard ? 25 : 0);
    }
  }
  setTimeout(() => showResults(won, reportScore), won ? 1100 : 1700);
  if (window.paXP) window.paXP.award("wordglow", { score: reportScore, won, guesses: n, links, daily: mode === "daily" });
}

  empty: new THREE.MeshStandardMaterial({ color: 0x1a1d3a, metalness: 0.5, roughness: 0.18, transparent: true, opacity: 0.82 }),
  hit: new THREE.MeshStandardMaterial({ color: 0x1fd8b6, metalness: 0.3, roughness: 0.22, emissive: 0x0e7a66, emissiveIntensity: 0.6 }),
  near: new THREE.MeshStandardMaterial({ color: 0x9b6cf5, metalness: 0.3, roughness: 0.22, emissive: 0x4a2a9a, emissiveIntensity: 0.6 }),
  miss: new THREE.MeshStandardMaterial({ color: 0x1b1e33, metalness: 0.45, roughness: 0.4 })
};
const faceMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { atlas: { value: atlas }, letter: { value: -1 }, base: { value: new THREE.Color() }, rim: { value: new THREE.Color() }, ink: { value: new THREE.Color() }, glow: { value: 0 }, ghost: { value: 0 }, off: { value: 0 }, time: { value: 0 }, sheen: { value: 0 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `
    uniform sampler2D atlas; uniform float letter, glow, ghost, off, time, sheen; uniform vec3 base, rim, ink; varying vec2 vUv;
    float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    void main(){
      vec2 p = vUv - 0.5;
      float d = sdRound(p, vec2(0.5), 0.17);
      if (d > 0.0) discard;
      float edge = smoothstep(-0.05, 0.0, d);
      vec3 col = base * (0.85 + 0.3 * (1.0 - vUv.y));
      col += rim * edge * (1.2 + glow);
      col += rim * smoothstep(-0.2, 0.0, d) * 0.15 * glow;
      // a sweep of light across the glass
      float sw = smoothstep(0.22, 0.0, abs(vUv.x + vUv.y - 2.4 * sheen + 0.2));
      col += vec3(1.0) * sw * sw * (0.05 + 0.1 * glow);
      float a = mix(0.9, 0.18, off);
      if (letter >= 0.0) {
        vec2 cell = vec2(mod(letter, 8.0), floor(letter / 8.0));
        vec2 uv = (cell + vec2(0.0, 0.0) + vec2(vUv.x, 1.0 - vUv.y)) / vec2(8.0, 4.0);
        uv.y = 1.0 - uv.y;
        float m = texture2D(atlas, uv).a;
        col = mix(col, ink * (ghost > 0.5 ? 0.9 : 1.0), m * (ghost > 0.5 ? 0.45 + 0.2 * sin(time * 4.0) : 1.0));
        a = max(a, m);
      }
      gl_FragColor = vec4(col, a);
    }`
});
const tiles = [];
const board = new THREE.Group();
scene.add(board);
const gridEl = document.getElementById("wg-grid");
[...gridEl.children].forEach((rowEl, r) => {
  [...rowEl.children].forEach((el, c) => {
    const g = new THREE.Group();
    const body = new THREE.Mesh(bodyGeo, BODY.empty);
    const face = new THREE.Mesh(faceGeo, faceMat.clone());
    face.material.uniforms.atlas = faceMat.uniforms.atlas;
    face.position.z = DEPTH / 2 + 0.045;
    // the back face carries the old state while the tile turns over
    g.add(body, face);
    board.add(g);
    tiles.push({ el, rowEl, r, c, g, body, face, st: "empty", ch: "", flipStart: -1, revSeen: false, pop: 0, jump: -1, glow: 0, x: 0, y: 0, s: 1 });
  });
});
const rowState = [...gridEl.children].map(() => ({ shake: -1, win: -1, shakeSeen: false, winSeen: false }));
const COLORS = {
  empty: { base: 0x111430, rim: 0x5a62a8, ink: 0xffffff },
  filled: { base: 0x171b40, rim: 0xc8d0ff, ink: 0xffffff },
  lock: { base: 0x0f2a32, rim: 0x2ee6c5, ink: 0xc8fff3 },
  hit: { base: 0x22e8c4, rim: 0xb8fff0, ink: 0x02261f },
  near: { base: 0xa47af8, rim: 0xe6d8ff, ink: 0x1d0b3d },
  miss: { base: 0x1c2036, rim: 0x2c3150, ink: 0x7a80a8 }
};
const tmpC = new THREE.Color();

/* ---------------- particles ---------------- */
const PMAX = 2500;
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), pSize = new Float32Array(PMAX);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("size", new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
const pointsMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { scale: { value: 600 } },
  vertexShader: "uniform float scale; attribute float size; attribute vec3 color; varying vec3 vC; void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = max(1.0, size * scale / -mv.z); gl_Position = projectionMatrix * mv; }",
  fragmentShader: "varying vec3 vC; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d); gl_FragColor = vec4(vC * a * a, 1.0); }"
});
const pts = new THREE.Points(pGeo, pointsMat); pts.frustumCulled = false; scene.add(pts);
const parts = [];
function burst(x, y, o) {
  const n = o.n || 20, cols = o.colors || [0xffffff];
  for (let i = 0; i < n && parts.length < PMAX; i++) {
    const a = Math.random() * TAU, sp = (o.speed || 2) * rnd(0.3, 1), life = (o.life || 0.8) * rnd(0.5, 1.1);
    const c = new THREE.Color(cols[(Math.random() * cols.length) | 0]);
    parts.push({ x: x + rnd(-0.3, 0.3) * (o.spread || 0), y, z: 0.3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (o.vy || 0), vz: rnd(0, 1.5), life, max: life, size: (o.size || 0.06) * rnd(0.6, 1.4), c: [c.r * 2.5, c.g * 2.5, c.b * 2.5], g: o.g || 0 });
  }
}
function updateParts(dt) {
  let j = 0;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.life -= dt; if (p.life <= 0) continue;
    const d = Math.exp(-2 * dt);
    p.vx *= d; p.vy = p.vy * d - p.g * dt; p.vz *= d;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    parts[j++] = p;
  }
  parts.length = j;
  for (let i = 0; i < j; i++) {
    const p = parts[i], k = p.life / p.max;
    pPos.set([p.x, p.y, p.z], i * 3); pCol.set([p.c[0] * k, p.c[1] * k, p.c[2] * k], i * 3); pSize[i] = p.size * (0.4 + 0.6 * k);
  }
  pGeo.setDrawRange(0, j);
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; pGeo.attributes.size.needsUpdate = true;
}

/* ---------------- layout: put each 3D tile where its DOM tile sits ---------------- */
let W = innerWidth, H = innerHeight, k = 0.01;
const bufSize = new THREE.Vector2();
function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setPixelRatio(dprCap());
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(bufSize);
  post.setSize(bufSize.x, bufSize.y);
  pointsMat.uniforms.scale.value = moteMat.uniforms.scale.value = bufSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  auroraMat.uniforms.aspect.value = W / H;
  k = 2 * CAM_D * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / H;
  const gr = gridEl.getBoundingClientRect();
  for (const t of tiles) {
    // offsets ignore the CSS transforms, so the DOM's own little animations don't move the board
    const cx = gr.left + t.rowEl.offsetLeft + t.el.offsetLeft + t.el.offsetWidth / 2;
    const cy = gr.top + t.rowEl.offsetTop + t.el.offsetTop + t.el.offsetHeight / 2;
    t.x = (cx - W / 2) * k; t.y = -(cy - H / 2) * k; t.s = t.el.offsetWidth * k;
  }
}
addEventListener("resize", layout);
let layoutTick = 0;

/* ---------------- frame ---------------- */
let pointerX = 0, pointerY = 0, last = performance.now(), pulse = new THREE.Vector3(), stage = 0;
addEventListener("pointermove", (e) => { pointerX = e.clientX / W - 0.5; pointerY = e.clientY / H - 0.5; });
addEventListener("wg:spark", (e) => {
  const t = tiles.find((x) => x.r === e.detail.row && x.c === e.detail.pos);
  if (t) { t.pop = 1; burst(t.x, t.y, { n: 40, colors: [0xffd27a, 0xffffff], speed: 2.5, life: 0.9, size: 0.06 }); }
  pulse.z = 1;
});
function stateOf(el) {
  const c = el.classList;
  return c.contains("hit") ? "hit" : c.contains("near") ? "near" : c.contains("miss") ? "miss" : c.contains("lock") ? "lock" : c.contains("filled") ? "filled" : "empty";
}
function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
  last = now;
  if (++layoutTick % 30 === 0 || layoutTick < 3) layout();
  updateParts(dt);
  pulse.multiplyScalar(Math.exp(-dt * 1.6));
  rowState.forEach((rs, i) => {
    const rc = gridEl.children[i].classList;
    if (rc.contains("shake") && !rs.shakeSeen) { rs.shakeSeen = true; rs.shake = t; }
    if (!rc.contains("shake")) rs.shakeSeen = false;
    if (rc.contains("win") && !rs.winSeen) { rs.winSeen = true; rs.win = t; pulse.x = 1; const row = tiles.filter((x) => x.r === i); for (const x of row) burst(x.x, x.y, { n: 30, colors: [0x2ee6c5, 0xb8fff0, 0xffffff], speed: 3, life: 1.1, size: 0.07, vy: 1.5, g: 1.2 }); }
    if (!rc.contains("win")) rs.winSeen = false;
    rs.off = gridEl.children[i].classList.contains("off");
  });
  for (const T of tiles) {
    const el = T.el, st = stateOf(el), ch = (el.textContent || "").toLowerCase(), ghost = el.dataset.ghost || "";
    if (el.classList.contains("rev") && !T.revSeen) { T.revSeen = true; T.flipStart = t + (parseFloat(el.style.animationDelay) || 0) / 1000; }
    if (!el.classList.contains("rev")) T.revSeen = false;
    if (st !== T.st) {
      if ((st === "hit" || st === "near") && T.revSeen) {
        burst(T.x, T.y, { n: st === "hit" ? 26 : 16, colors: st === "hit" ? [0x2ee6c5, 0xb8fff0] : [0xb48cff, 0xe6d8ff], speed: 2.2, life: 0.8, size: 0.055 });
        if (st === "hit") pulse.x = Math.min(1, pulse.x + 0.35); else pulse.y = Math.min(1, pulse.y + 0.3);
        T.glow = 1;
      }
      T.st = st;
    }
    if (ch !== T.ch) { if (ch && (st === "filled" || st === "lock")) T.pop = 1; T.ch = ch; }
    T.pop = Math.max(0, T.pop - dt * 6);
    T.glow = Math.max(0, T.glow - dt * 1.5);
    // flip over the x axis, swapping looks edge-on (the DOM swaps the class at the same moment)
    let ang = 0;
    if (T.flipStart > 0) { const f = (t - T.flipStart) / 0.55; if (f >= 0 && f <= 1) ang = (f < 0.5 ? f : 1 - f) * Math.PI; else if (f > 1) T.flipStart = -1; }
    const rs = rowState[T.r];
    let ox = 0, oy = 0;
    if (rs.shake > 0 && t - rs.shake < 0.45) ox = Math.sin((t - rs.shake) * 45) * 0.12 * (1 - (t - rs.shake) / 0.45);
    if (rs.win > 0) { const w = t - rs.win - T.c * 0.09; if (w > 0 && w < 0.6) oy = Math.sin(w / 0.6 * Math.PI) * 0.35; }
    const s = T.s * (1 + T.pop * 0.08);
    T.g.position.set(T.x + ox, T.y + oy, T.pop * 0.15 + T.glow * 0.1);
    T.g.scale.set(s, s, s);
    T.g.rotation.x = ang;
    const look = COLORS[st];
    T.body.material = st === "hit" ? BODY.hit : st === "near" ? BODY.near : st === "miss" ? BODY.miss : BODY.empty;
    const u = T.face.material.uniforms;
    u.base.value.set(look.base); u.rim.value.set(look.rim); u.ink.value.set(look.ink);
    if (st === "hit" || st === "near") u.base.value.multiplyScalar(1.1 + T.glow * 0.8);
    u.glow.value = st === "lock" ? 0.6 + Math.sin(t * 3) * 0.2 : st === "filled" ? 0.4 + T.pop : T.glow * 1.5;
    u.off.value = rs.off && st === "empty" ? 1 : 0;
    const L = ch || ghost;
    u.letter.value = L ? L.charCodeAt(0) - 97 : -1;
    u.ghost.value = !ch && ghost ? 1 : 0;
    if (!ch && ghost) u.ink.value.set(0xffd27a);
    u.time.value = t;
    u.sheen.value = ((t * 0.25 + T.c * 0.05 + T.r * 0.08) % 3);
  }
  // board leans toward the pointer a touch, lights drift
  board.rotation.y += (pointerX * 0.12 - board.rotation.y) * 0.05;
  board.rotation.x += (pointerY * 0.08 - board.rotation.x) * 0.05;
  tealL.position.set(Math.sin(t * 0.5) * 5, 3 + Math.cos(t * 0.4) * 2, 4);
  violetL.position.set(-Math.sin(t * 0.45) * 5, -2 + Math.sin(t * 0.3) * 2, 4);
  camera.position.set(0, 0, CAM_D);
  camera.lookAt(0, 0, 0);
  const wg = window.__wg;
  stage = wg ? wg.stage : 0;
  auroraMat.uniforms.time.value = t; auroraMat.uniforms.pulse.value.copy(pulse); auroraMat.uniforms.stage.value += (stage - auroraMat.uniforms.stage.value) * 0.02;
  moteMat.uniforms.time.value = t;
  post.render(scene, camera, t);
  requestAnimationFrame(frame);
}
layout();
requestAnimationFrame(frame);
return { burst };
})();
</script>
</body></html>
