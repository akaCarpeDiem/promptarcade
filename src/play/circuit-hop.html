<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Circuit Hop — PromptArcade</title>
<style>
html,body{margin:0;height:100%;background:#05070f;color:#f4f1ff;overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#ch-hud{opacity:0;transition:opacity .45s ease}
#ch-hud.on{opacity:1}
#ch-hud .pa-stat b{color:#7ee7a8}
#s-chips b{color:#ffd27a}
</style></head><body>
<canvas id="c" aria-label="Circuit Hop playfield"></canvas>
<div class="pa-hud" id="ch-hud">
  <div class="pa-stat" id="s-score"><small>Score</small><b>0</b></div>
  <div class="pa-stat" id="s-chips"><small>Chips</small><b>0 / 0</b></div>
  <div class="pa-stat" id="s-level"><small>Sector</small><b>1</b></div>
</div>
<script>
window.paConfig = {
  slug: "circuit-hop",
  title: "Circuit Hop",
  native: true,
  music: "bounce",
  unit: "points",
  controls: [
    ["← → / A D", "Run"],
    ["Space / ↑ / W", "Jump"],
    ["Hold jump", "Jump higher"],
    ["Jump off a wall", "Wall jump"],
    ["Land on a bot", "Stomp it"]
  ]
};
</script>
<script src="/games/play/pa-score.js?v=e650da0b4c"></script>
<script src="/games/play/pa-gate.js?v=e650da0b4c"></script>
<script src="/games/play/pa-kit.js?v=e650da0b4c"></script>
<script>
(() => {
  const TAU = Math.PI * 2;
  const { clamp, rand } = PA;
  const TILE = 32;
  const COL = {
    bg: "#05070f",
    wall: "#141b3a",
    wallEdge: "#8ee9ff",
    trace: "rgba(126,231,168,.16)",
    chip: "#ffd27a",
    chipCore: "#fff3c4",
    player: "#8ee9ff",
    playerCore: "#e8fbff",
    enemy: "#ff7eb6",
    laser: "#ff4d6d",
    laserCore: "#ffb3c1",
    spike: "#ff5e8a",
    flag: "#7ee7a8",
    portal: "#c4a6ff",
    portalCore: "#8ee9ff"
  };

  // World units are pixels at zoom 1; the camera zooms so a sector reads the same on any screen.
  const GRAV = 2300;
  const FALL_GRAV = 2900;          // a little heavier on the way down: snappier arcs
  const MOVE = 330;
  const ACCEL = 3200;
  const AIR_ACCEL = 2300;
  const JUMP_V = 640;
  const JUMP_CUT = 0.45;           // releasing jump early trims the arc
  const WALL_JUMP_X = 360;
  const WALL_JUMP_Y = 600;
  const WALL_SLIDE = 150;
  const WALL_LOCK = 0.14;          // brief loss of air control after a wall jump
  const MAX_FALL = 900;
  const COYOTE = 0.1;
  const JUMP_BUF = 0.13;
  const STOMP_V = 520;
  const PW = 20;
  const PH = 28;
  const BOT_SPEED = 62;
  const LASER_CYCLE = 2.4;
  const LASER_ON = 0.58;

  /* Handcrafted sectors — # solid · @ spawn · C chip · E exit · M patrol bot · K checkpoint · ^ spikes
   * H / V laser emitters (beam runs until it meets a wall). Every chip and exit is reachable: see
   * tests/circuit-hop.test.mjs. */
  const LEVELS = [
    {
      name: "Relay Lane",
      rows: [
        "########################################################################",
        "#......................................................................#",
        "#......................................................................#",
        "#......................................................................#",
        "#......................................................................#",
        "#......................................................................#",
        "#......................................................................#",
        "#......................................................................#",
        "#..........................................................CC..........#",
        "#.............................................CC..........####.........#",
        "#............CC.......................C...K...........C................#",
        "#...........####....CC..............#########........####..............#",
        "#..@....C.C...................M.....#########.....................E....#",
        "###################....######################....#######################",
        "###################....######################....#######################",
        "###################....######################....#######################"
      ]
    },
    {
      name: "Wall Run",
      rows: [
        "################################################################",
        "#..............................................................#",
        "#..............................................................#",
        "#..............................................................#",
        "#..............................................................#",
        "#...........................................#..................#",
        "#............#..............................#.........C.....E..#",
        "#............#..........C...M....C..........#...################",
        "#............#...####################.......#.C.#..............#",
        "#............#...#..........................#...#..............#",
        "#............#.C.#..........................#H..#..............#",
        "#............#...#..........................#...#..............#",
        "#............#...#..........................#.C.#..............#",
        "#............#.C.#..........................#...#..............#",
        "#............#...#..........................#...#..............#",
        "#................#..............................#..............#",
        "#..@...C.........#....M...C....C......K.........#..............#",
        "################################################################",
        "################################################################",
        "################################################################"
      ]
    },
    {
      name: "Phase Lock",
      rows: [
        "######################################################################",
        "#....................................................................#",
        "#....................................................................#",
        "#....................................................................#",
        "#....................................................................#",
        "#...........................................................####.....#",
        "#...........................................................####.....#",
        "#........############################################........V.......#",
        "#......C.############################################................#",
        "#.....###############################################.........C......#",
        "#.............V.......V.......V.......V.......V......................#",
        "#..####...................................................##....##...#",
        "#..@.......C......C.......C.......C.......C.......C....K..##^^^^##..E#",
        "######################################################################",
        "######################################################################",
        "######################################################################"
      ]
    },
    {
      name: "Spike Bus",
      rows: [
        "############################################################################",
        "#..........................................................................#",
        "#..........................................................................#",
        "#..........................................................................#",
        "#..........................................................................#",
        "#..........................................................................#",
        "#..........................................................................#",
        "#..........................................................................#",
        "#......................................................C...................#",
        "#...............................................CC....####.................#",
        "#...........CC.............C....C.........M....####........................#",
        "#..........####...........###..###......#####..............................#",
        "#..@......^^^^^^...M...C..^^^^^^^^...K..#####^^^^^^^^.......M...C.^^^^..E..#",
        "############################################################################",
        "############################################################################",
        "############################################################################"
      ]
    },
    {
      name: "Core Dump",
      rows: [
        "########################################",
        "#.....................................##",
        "#.....................................##",
        "#.....................................##",
        "#.....................................##",
        "#.....................................##",
        "#........................M....C.......##",
        "#...................###############...##",
        "#...............C.................#...##",
        "#.............#####...............#.C.##",
        "#.........C.......................#...##",
        "#.......#####.....................#...##",
        "#..E.C............................#...##",
        "#.#####...........................#.C.##",
        "#.................................#...##",
        "#.................................#...##",
        "#.................................#...##",
        "#.................................#...##",
        "#..............................K...C..##",
        "#...........................############",
        "#.......................C.............##",
        "#.....................#####...........##",
        "#.................M...................##",
        "#...............#####.................##",
        "#...........C.........................##",
        "#.........#####.......................##",
        "#..@....C.............................##",
        "########################################",
        "########################################",
        "########################################"
      ]
    },
    {
      name: "Overclock",
      rows: [
        "################################################################################################",
        "#..............................................................................................#",
        "#..............................................................................................#",
        "#..............................................................................................#",
        "#..............................................................................................#",
        "#................................############..................................................#",
        "#................................############..................................................#",
        "#......................................V.......................................................#",
        "#...........................#..................................................................#",
        "#...........................#........M....C............................####....................#",
        "#...........................#...#############..........................####....................#",
        "#...........................#...#.......................................V......................#",
        "#...........................#.C.#...........................................................E..#",
        "#...........................#...#........................................C................######",
        "#.........C...........CC....#...#....................M.C......CC.......................C.......#",
        "#........###....................#...................####............###....###........####.....#",
        "#..@....^^^^^...M...............#..............K..^^^^^^^^..........###^^^^###...M..C..........#",
        "#####################....####################################....###############################",
        "#####################....####################################....###############################",
        "#####################....####################################....###############################"
      ]
    }
  ];
  let W = 0, H = 0, S = 1, DPR = 1, Z = 1;
  let levelIdx = 0, levelW = 0, levelH = 0, grid = [], solidList = [], spikes = [];
  let spawn = { x: 0, y: 0 }, checkpoint = null;
  let chips = [], enemies = [], lasers = [], flags = [], exit = null;
  let player = null, camX = 0, camY = 0;
  let score = 0, chipsGot = 0, simT = 0, levelT = 0, deaths = 0, stomps = 0;
  let coyote = 0, jumpBuf = 0, wallDir = 0, wallLock = 0, invuln = 0, banner = null, overSent = false, jumpHeld = false;
  let totalChipsAll = 0;

  const view = PA.canvas(document.getElementById("c"), { onResize: layout });
  const ctx = view.ctx;
  const fx = new PA.Particles(700);
  const texts = new PA.Texts();
  const hud = document.getElementById("ch-hud");

  function layout(v) {
    W = v.w; H = v.h; DPR = v.dpr;
    S = clamp(Math.sqrt(W * H) / 820, 0.72, 1.35);
    // about 14 tiles of height on screen, never so zoomed that a phone sees less than 11 tiles across
    Z = clamp(Math.min(H / (14 * TILE), W / (11 * TILE)), 0.7, 2.4);
  }
  const VW = () => W / Z, VH = () => H / Z;

  function paintHud() {
    PA.stat("s-score", score.toLocaleString());
    PA.stat("s-chips", chipsGot + " / " + totalChipsAll);
    PA.stat("s-level", (levelIdx + 1) + " · " + (LEVELS[levelIdx] ? LEVELS[levelIdx].name : "—"));
  }

  const isSolid = (tx, ty) => tx < 0 || tx >= grid[0].length || ty < 0 ? true : ty >= grid.length ? false : grid[ty][tx] === 1;

  function parseLevel(idx) {
    const rows = LEVELS[idx].rows;
    levelH = rows.length * TILE;
    levelW = rows[0].length * TILE;
    grid = rows.map((r) => [...r].map((ch) => (ch === "#" ? 1 : 0)));
    solidList = []; spikes = []; chips = []; enemies = []; lasers = []; flags = [];
    exit = null; checkpoint = null;
    for (let y = 0; y < rows.length; y++) {
      for (let x = 0; x < rows[y].length; x++) {
        const ch = rows[y][x], wx = x * TILE, wy = y * TILE;
        if (ch === "#") solidList.push({ x: wx, y: wy, tx: x, ty: y });
        else if (ch === "@") spawn = { x: wx + (TILE - PW) / 2, y: wy + TILE - PH };
        else if (ch === "C") chips.push({ x: wx + TILE / 2, y: wy + TILE / 2, r: 10, got: false, ph: rand(TAU) });
        else if (ch === "E") exit = { x: wx + 2, y: wy - 6, w: TILE - 4, h: TILE + 4, ph: rand(TAU) };
        else if (ch === "K") flags.push({ x: wx + TILE / 2, y: wy + TILE, on: false, t: 0 });
        else if (ch === "^") spikes.push({ x: wx, y: wy + TILE * 0.45, w: TILE, h: TILE * 0.55 });
        else if (ch === "M") enemies.push({ x: wx + TILE / 2, y: wy + TILE - 12, r: 12, dir: enemies.length % 2 ? -1 : 1, ph: rand(TAU), dead: false, squash: 0 });
        else if (ch === "H" || ch === "V") lasers.push({ x: wx + TILE / 2, y: wy + TILE / 2, axis: ch === "H" ? "h" : "v", phase: lasers.length * 0.8 });
      }
    }
    lasers.forEach(buildLaserBeam);
  }

  function countAllChips() {
    let n = 0;
    LEVELS.forEach((L) => L.rows.forEach((row) => { for (const ch of row) if (ch === "C") n++; }));
    return n;
  }

  function buildLaserBeam(L) {
    const tx = Math.floor(L.x / TILE), ty = Math.floor(L.y / TILE);
    if (L.axis === "h") {
      let l = tx, r = tx;
      while (!isSolid(l - 1, ty)) l--;
      while (!isSolid(r + 1, ty)) r++;
      L.x1 = l * TILE; L.x2 = (r + 1) * TILE; L.y1 = L.y2 = L.y;
    } else {
      let t = ty, b = ty;
      while (!isSolid(tx, t - 1)) t--;
      while (b + 1 < grid.length && !isSolid(tx, b + 1)) b++;
      L.x1 = L.x2 = L.x; L.y1 = t * TILE; L.y2 = (b + 1) * TILE;
    }
  }

  function resetPlayer() {
    const at = checkpoint || spawn;
    player = { x: at.x, y: at.y, vx: 0, vy: 0, w: PW, h: PH, onGround: false, dead: false, face: 1, squash: 0 };
    coyote = 0; jumpBuf = 0; wallDir = 0; wallLock = 0; invuln = 0.8;
  }

  function centerCamera(snap) {
    const vw = VW(), vh = VH();
    const tx = levelW <= vw ? (levelW - vw) / 2 : clamp(player.x + player.w / 2 - vw / 2 + player.face * vw * 0.08, 0, levelW - vw);
    const ty = levelH <= vh ? (levelH - vh) / 2 : clamp(player.y + player.h / 2 - vh * 0.55, 0, levelH - vh);
    if (snap) { camX = tx; camY = ty; return; }
    return { tx, ty };
  }

  function loadLevel(idx, keepScore) {
    levelIdx = idx;
    parseLevel(idx);
    resetPlayer();
    centerCamera(true);
    levelT = 0;
    if (!keepScore) { score = 0; chipsGot = 0; deaths = 0; stomps = 0; }
    banner = { text: "Sector " + (idx + 1), sub: LEVELS[idx].name, t: 0, max: 2.2 };
    paintHud();
  }

  function reset() {
    simT = 0; overSent = false;
    totalChipsAll = countAllChips();
    fx.clear(); texts.clear();
    loadLevel(0, false);
    hud.classList.add("on");
    PA.music.intensity(0.15);
  }

  PA.onStart(reset);

  PA.touchControls({
    left: [{ label: "◀", key: "ArrowLeft", code: "ArrowLeft", aria: "Move left" }, { label: "▶", key: "ArrowRight", code: "ArrowRight", aria: "Move right" }],
    right: [{ label: "JUMP", key: " ", code: "Space", wide: true, aria: "Jump" }]
  });

  const JUMP_KEYS = ["Space", " ", "ArrowUp", "KeyW", "w", "W"];
  PA.onKey((e) => {
    if (e.repeat) return;
    if (JUMP_KEYS.indexOf(e.code) >= 0 || JUMP_KEYS.indexOf(e.key) >= 0) {
      e.preventDefault();
      jumpBuf = JUMP_BUF;
    }
  });

  function tryJump() {
    if (jumpBuf <= 0) return;
    if (player.onGround || coyote > 0) {
      player.vy = -JUMP_V;
      player.onGround = false;
      player.squash = -0.25;
      coyote = 0; jumpBuf = 0;
      PA.sfx("whoosh", { pitch: 1.05, vol: 0.55 });
      PA.tone({ freq: 420, to: 620, type: "triangle", dur: 0.06, vol: 0.05 });
      fx.burst(player.x + player.w / 2, player.y + player.h, { n: 6, color: COL.player, speed: 70, life: 0.25, size: 2, vy: -20 });
    } else if (wallDir) {
      player.vy = -WALL_JUMP_Y;
      player.vx = WALL_JUMP_X * -wallDir;
      player.face = -wallDir;
      wallLock = WALL_LOCK;
      jumpBuf = 0; coyote = 0;
      PA.sfx("whoosh", { pitch: 1.18, vol: 0.6 });
      PA.tone({ freq: 520, to: 780, type: "square", dur: 0.05, vol: 0.045 });
      fx.burst(wallDir > 0 ? player.x + player.w : player.x, player.y + player.h * 0.5, { n: 8, color: COL.wallEdge, speed: 90, life: 0.3, size: 2.2 });
      wallDir = 0;
    }
  }

  function overlapsSolid(x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty)) return { tx, ty };
    return null;
  }

  function moveAxis(p, dx, dy) {
    // horizontal, in steps no larger than half a tile so fast moves can't skip a wall
    const nx = Math.ceil(Math.abs(dx) / (TILE / 2)) || 1;
    for (let i = 0; i < nx; i++) {
      p.x += dx / nx;
      const hit = overlapsSolid(p.x, p.y, p.w, p.h);
      if (hit) { p.x = dx > 0 ? hit.tx * TILE - p.w : (hit.tx + 1) * TILE; p.vx = 0; break; }
    }
    p.onGround = false;
    const ny = Math.ceil(Math.abs(dy) / (TILE / 2)) || 1;
    for (let i = 0; i < ny; i++) {
      p.y += dy / ny;
      const hit = overlapsSolid(p.x, p.y, p.w, p.h);
      if (hit) {
        if (dy > 0) { p.y = hit.ty * TILE - p.h; p.onGround = true; if (p.vy > 500) p.squash = 0.22; }
        else p.y = (hit.ty + 1) * TILE;
        p.vy = 0;
        break;
      }
    }
    if (!p.onGround && dy >= 0 && overlapsSolid(p.x, p.y + 1, p.w, 1)) p.onGround = true;
  }

  function senseWalls(p) {
    wallDir = 0;
    if (p.onGround) return;
    if (overlapsSolid(p.x - 2, p.y + 6, 2, p.h - 12)) wallDir = -1;
    else if (overlapsSolid(p.x + p.w, p.y + 6, 2, p.h - 12)) wallDir = 1;
  }

  function killPlayer(why) {
    if (invuln > 0 || player.dead) return;
    player.dead = true;
    deaths++;
    PA.shake(12, 0.45);
    PA.hitstop(90);
    PA.flash("rgba(255,77,109,.35)", 280);
    PA.sfx("explode", { pitch: 0.85, vol: 0.65 });
    fx.burst(player.x + player.w / 2, player.y + player.h / 2, { n: 36, colors: [COL.player, COL.enemy, COL.laser, "#fff"], speed: 220, life: 0.65, size: 3, shape: "spark" });
    texts.add(player.x + player.w / 2, player.y, why || "FRIED", { color: COL.laser, size: 18, life: 0.75, vy: -40 });
    setTimeout(() => {
      if (PA.state !== "play" || overSent) return;
      resetPlayer();
    }, 520);
  }

  function collectChip(c) {
    c.got = true;
    chipsGot++;
    score += 400;
    PA.sfx("coin", { pitch: 1 + (chipsGot % 8) * 0.04 });
    PA.tone({ freq: 880, to: 1320, type: "sine", dur: 0.08, vol: 0.05 });
    fx.burst(c.x, c.y, { n: 14, color: COL.chip, speed: 120, life: 0.45, size: 2.5 });
    texts.add(c.x, c.y - 8, "+400", { color: COL.chip, size: 14, life: 0.65, vy: -50 });
    paintHud();
    PA.music.intensity(clamp(0.15 + chipsGot / Math.max(1, totalChipsAll) * 0.6, 0.15, 0.85));
  }

  function stomp(e) {
    e.dead = true;
    stomps++;
    score += 250;
    player.vy = -(PA.down.apply(null, JUMP_KEYS) ? STOMP_V * 1.2 : STOMP_V);
    player.onGround = false;
    coyote = 0;
    PA.sfx("hit", { pitch: 1.4, vol: 0.6 });
    PA.shake(4, 0.15);
    fx.burst(e.x, e.y, { n: 18, colors: [COL.enemy, "#fff"], speed: 160, life: 0.45, size: 2.5, shape: "spark" });
    texts.add(e.x, e.y - 14, "+250", { color: COL.enemy, size: 14, life: 0.6, vy: -50 });
    paintHud();
  }

  function laserPhase(L, t) { return (((t + L.phase) % LASER_CYCLE) + LASER_CYCLE) % LASER_CYCLE / LASER_CYCLE; }
  const laserActive = (L, t) => laserPhase(L, t) < LASER_ON;

  function hitLaser(p, t) {
    for (const L of lasers) {
      if (!laserActive(L, t)) continue;
      if (L.axis === "h") {
        if (L.y > p.y + 3 && L.y < p.y + p.h - 3 && p.x + p.w > L.x1 && p.x < L.x2) return true;
      } else if (L.x > p.x + 3 && L.x < p.x + p.w - 3 && p.y + p.h > L.y1 && p.y < L.y2) return true;
    }
    return false;
  }

  function completeLevel() {
    const secs = levelT;
    const bonus = 1500 + Math.max(0, Math.round((60 - secs) * 20)) + chips.filter((c) => c.got).length * 100;
    score += bonus;
    paintHud();
    PA.sfx("levelup");
    PA.flash("rgba(142,233,255,.22)", 320);
    if (levelIdx + 1 >= LEVELS.length) {
      if (overSent) return;
      overSent = true;
      hud.classList.remove("on");
      PA.gameOver(score, {
        kicker: "All sectors synced",
        title: chipsGot >= totalChipsAll ? "Every chip, every sector!" : deaths === 0 ? "Flawless run!" : "Circuit complete",
        stats: [["Chips", chipsGot + " / " + totalChipsAll], ["Bots stomped", stomps], ["Deaths", deaths], ["Time", Math.round(simT) + "s"]]
      });
      return;
    }
    loadLevel(levelIdx + 1, true);
    texts.add(player.x + player.w / 2, player.y - 30, "+" + bonus.toLocaleString(), { color: COL.portal, size: 18, life: 1.2, vy: -30 });
  }

  function update(dt, t) {
    fx.update(dt);
    texts.update(dt);
    if (banner) banner.t += dt;
    for (const f of flags) f.t += dt;
    for (const e of enemies) if (e.dead) e.squash = Math.min(1, e.squash + dt * 4);

    if (PA.state !== "play" || !player) return;
    simT += dt;
    if (player.dead) return;
    levelT += dt;
    if (invuln > 0) invuln -= dt;
    if (wallLock > 0) wallLock -= dt;
    player.squash *= Math.pow(0.0005, dt);

    const left = PA.down("ArrowLeft", "KeyA", "a");
    const right = PA.down("ArrowRight", "KeyD", "d");
    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    if (dir) player.face = dir;
    if (wallLock <= 0) {
      const a = (player.onGround ? ACCEL : AIR_ACCEL) * dt, target = dir * MOVE;
      player.vx = player.vx < target ? Math.min(target, player.vx + a) : Math.max(target, player.vx - a);
    }

    // variable jump: let go early for a short hop
    const held = PA.down.apply(null, JUMP_KEYS);
    if (!held && jumpHeld && player.vy < -200) player.vy *= JUMP_CUT;
    jumpHeld = held;

    player.vy += (player.vy > 0 ? FALL_GRAV : GRAV) * dt;
    // sliding down a wall you are pushing into
    if (wallDir && player.vy > WALL_SLIDE && dir === wallDir) player.vy = WALL_SLIDE;
    player.vy = Math.min(player.vy, MAX_FALL);
    if (jumpBuf > 0) jumpBuf -= dt;
    tryJump();

    const wasAirborne = !player.onGround;
    moveAxis(player, player.vx * dt, player.vy * dt);
    if (player.onGround) {
      coyote = COYOTE;
      if (wasAirborne) fx.burst(player.x + player.w / 2, player.y + player.h, { n: 4, color: COL.player, speed: 50, life: 0.2, size: 1.6 });
    } else coyote = Math.max(0, coyote - dt);
    senseWalls(player);
    if (wallDir && player.vy > 0 && dir === wallDir && Math.random() < 0.3) fx.burst(wallDir > 0 ? player.x + player.w : player.x, player.y + player.h * 0.3, { n: 1, color: COL.wallEdge, speed: 30, life: 0.25, size: 1.5 });

    const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;

    for (const e of enemies) {
      if (e.dead) continue;
      e.ph += dt * 6;
      // walk the platform: turn at walls and at ledges
      const nx = e.x + e.dir * BOT_SPEED * dt;
      const ahead = Math.floor((nx + e.dir * e.r) / TILE), foot = Math.floor((e.y + e.r + 4) / TILE), row = Math.floor(e.y / TILE);
      if (isSolid(ahead, row) || !isSolid(ahead, foot)) e.dir *= -1;
      else e.x = nx;
      const dx = pcx - e.x, dy = pcy - e.y;
      if (Math.abs(dx) < e.r + player.w / 2 - 2 && Math.abs(dy) < e.r + player.h / 2 - 2) {
        if (player.vy > 60 && player.y + player.h - player.vy * dt <= e.y - e.r * 0.3) stomp(e);
        else killPlayer("ZAPPED");
      }
    }

    for (const c of chips) {
      if (c.got) continue;
      c.ph += dt * 3;
      const dx = pcx - c.x, dy = pcy - c.y;
      if (dx * dx + dy * dy < (c.r + 14) ** 2) collectChip(c);
    }

    for (const f of flags) {
      if (f.on || Math.abs(pcx - f.x) > 20 || Math.abs(player.y + player.h - f.y) > 34) continue;
      flags.forEach((o) => { o.on = false; });
      f.on = true; f.t = 0;
      checkpoint = { x: f.x - PW / 2, y: f.y - PH };
      PA.sfx("power", { pitch: 1.3 });
      texts.add(f.x, f.y - 46, "CHECKPOINT", { color: COL.flag, size: 14, life: 1, vy: -30 });
      fx.burst(f.x, f.y - 30, { n: 16, color: COL.flag, speed: 120, life: 0.5, size: 2 });
    }

    for (const s of spikes) {
      if (player.x + player.w > s.x + 4 && player.x < s.x + s.w - 4 && player.y + player.h > s.y + 4 && player.y < s.y + s.h) { killPlayer("SPIKED"); break; }
    }

    if (!player.dead && exit && player.x + player.w > exit.x && player.x < exit.x + exit.w && player.y + player.h > exit.y && player.y < exit.y + exit.h) {
      completeLevel();
      return;
    }
    if (!player.dead && hitLaser(player, t)) killPlayer("FRIED");
    if (!player.dead && player.y > levelH + 60) { invuln = 0; killPlayer("LOST SIGNAL"); }

    const c = centerCamera(false);
    camX += (c.tx - camX) * clamp(dt * 8, 0, 1);
    camY += (c.ty - camY) * clamp(dt * 6, 0, 1);
  }

  /* ---------------- drawing ---------------- */
  function drawTiles() {
    const x0 = Math.floor(camX / TILE) - 1, x1 = Math.ceil((camX + VW()) / TILE) + 1;
    const y0 = Math.floor(camY / TILE) - 1, y1 = Math.ceil((camY + VH()) / TILE) + 1;
    ctx.fillStyle = COL.wall;
    for (let ty = Math.max(0, y0); ty <= Math.min(grid.length - 1, y1); ty++) {
      for (let tx = Math.max(0, x0); tx <= Math.min(grid[0].length - 1, x1); tx++) {
        if (grid[ty][tx]) ctx.fillRect(tx * TILE, ty * TILE, TILE + 0.5, TILE + 0.5);
      }
    }
    // circuit traces inside the walls
    ctx.strokeStyle = COL.trace; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let ty = Math.max(0, y0); ty <= Math.min(grid.length - 1, y1); ty++) {
      for (let tx = Math.max(0, x0); tx <= Math.min(grid[0].length - 1, x1); tx++) {
        if (!grid[ty][tx] || (tx * 7 + ty * 13) % 5) continue;
        const X = tx * TILE, Y = ty * TILE;
        ctx.moveTo(X + 8, Y + 16); ctx.lineTo(X + 16, Y + 16); ctx.lineTo(X + 24, Y + 24);
        ctx.moveTo(X + 25, Y + 25); ctx.arc(X + 24, Y + 24, 1.5, 0, TAU);
      }
    }
    ctx.stroke();
    // glowing edges only where a wall meets open air
    ctx.save();
    ctx.strokeStyle = COL.wallEdge; ctx.lineWidth = 2; ctx.shadowColor = COL.wallEdge; ctx.shadowBlur = 8; ctx.globalAlpha = 0.7;
    ctx.beginPath();
    for (let ty = Math.max(0, y0); ty <= Math.min(grid.length - 1, y1); ty++) {
      for (let tx = Math.max(0, x0); tx <= Math.min(grid[0].length - 1, x1); tx++) {
        if (!grid[ty][tx]) continue;
        const X = tx * TILE, Y = ty * TILE;
        if (ty > 0 && !grid[ty - 1][tx]) { ctx.moveTo(X, Y + 1); ctx.lineTo(X + TILE, Y + 1); }
        if (ty < grid.length - 1 && !grid[ty + 1][tx]) { ctx.moveTo(X, Y + TILE - 1); ctx.lineTo(X + TILE, Y + TILE - 1); }
        if (tx > 0 && !grid[ty][tx - 1]) { ctx.moveTo(X + 1, Y); ctx.lineTo(X + 1, Y + TILE); }
        if (tx < grid[0].length - 1 && !grid[ty][tx + 1]) { ctx.moveTo(X + TILE - 1, Y); ctx.lineTo(X + TILE - 1, Y + TILE); }
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSpikes(t) {
    ctx.save();
    ctx.fillStyle = COL.spike; ctx.shadowColor = COL.spike; ctx.shadowBlur = 10 + Math.sin(t * 4) * 3;
    ctx.beginPath();
    for (const s of spikes) {
      for (let i = 0; i < 4; i++) {
        const x = s.x + i * 8;
        ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + 4, s.y + 1); ctx.lineTo(x + 8, s.y + s.h);
      }
    }
    ctx.fill();
    ctx.restore();
  }

  function drawChip(c, t) {
    if (c.got) return;
    const x = c.x, y = c.y + Math.sin(c.ph) * 3;
    const r = c.r + Math.sin(t * 4 + c.ph) * 1.2;
    ctx.save();
    ctx.shadowColor = COL.chip; ctx.shadowBlur = 14;
    ctx.fillStyle = COL.chip;
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.85, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.85, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.chipCore;
    ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    if (e.dead && e.squash >= 1) return;
    const sq = e.dead ? 1 - e.squash : 1;
    const x = e.x, y = e.y + (1 - sq) * e.r, bob = e.dead ? 0 : Math.abs(Math.sin(e.ph)) * 2;
    ctx.save();
    ctx.globalAlpha = sq;
    ctx.shadowColor = COL.enemy; ctx.shadowBlur = 12;
    ctx.fillStyle = COL.enemy;
    ctx.beginPath(); ctx.ellipse(x, y - bob, e.r * (2 - sq), e.r * sq, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#2a0d1c";
    ctx.fillRect(x - 7 + e.dir * 2, y - bob - 4, 4, 4 * sq);
    ctx.fillRect(x + 3 + e.dir * 2, y - bob - 4, 4, 4 * sq);
    // little antenna, so it reads as a bot
    ctx.strokeStyle = COL.enemy; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - bob - e.r * sq); ctx.lineTo(x, y - bob - e.r * sq - 6); ctx.stroke();
    ctx.restore();
  }

  function drawLaser(L, t) {
    const u = laserPhase(L, t), on = u < LASER_ON, warn = !on && u > 0.86;
    const pulse = 0.55 + 0.45 * Math.sin(t * 8 + L.phase);
    ctx.save();
    ctx.globalAlpha = on ? 0.9 : warn ? 0.35 + 0.35 * Math.sin(t * 40) : 0.14;
    ctx.strokeStyle = on ? COL.laser : "rgba(255,77,109,.6)";
    ctx.lineWidth = on ? 5 : 2;
    ctx.shadowColor = COL.laser; ctx.shadowBlur = on ? 18 * pulse : 4;
    ctx.beginPath(); ctx.moveTo(L.x1, L.y1); ctx.lineTo(L.x2, L.y2); ctx.stroke();
    if (on) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.shadowBlur = 0; ctx.beginPath(); ctx.moveTo(L.x1, L.y1); ctx.lineTo(L.x2, L.y2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.laserCore;
    const ex = L.axis === "h" ? [L.x1 + 3, L.x2 - 3] : [L.x], ey = L.axis === "h" ? [L.y] : [L.y1 + 3, L.y2 - 3];
    for (const X of ex) for (const Y of ey) { ctx.beginPath(); ctx.arc(X, Y, 4, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  function drawFlag(f, t) {
    const x = f.x, y = f.y;
    ctx.save();
    ctx.strokeStyle = "rgba(244,241,255,.55)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x - 6, y - 38); ctx.stroke();
    const c = f.on ? COL.flag : "rgba(126,231,168,.35)";
    ctx.fillStyle = c; ctx.shadowColor = COL.flag; ctx.shadowBlur = f.on ? 14 : 0;
    const wave = Math.sin(t * 6) * (f.on ? 3 : 1);
    ctx.beginPath(); ctx.moveTo(x - 6, y - 38); ctx.quadraticCurveTo(x + 6, y - 36 + wave, x + 14, y - 31); ctx.lineTo(x - 6, y - 24); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawExit(e, t) {
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    const r = e.w * 0.48 + Math.sin(t * 3 + e.ph) * 2;
    ctx.save();
    ctx.shadowColor = COL.portal; ctx.shadowBlur = 24;
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, r * 1.15);
    g.addColorStop(0, COL.portalCore); g.addColorStop(0.55, COL.portal); g.addColorStop(1, "rgba(196,166,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.8, r * 1.15, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.55, r * 0.8, 0, t * 2, t * 2 + TAU * 0.7); ctx.stroke();
    ctx.restore();
  }

  function drawPlayer(p, t) {
    if (p.dead) return;
    const sq = p.squash, w = p.w * (1 + sq), h = p.h * (1 - sq);
    const x = p.x + (p.w - w) / 2, y = p.y + (p.h - h);
    ctx.save();
    if (invuln > 0 && Math.floor(t * 20) % 2 === 0) ctx.globalAlpha = 0.45;
    ctx.shadowColor = COL.player; ctx.shadowBlur = 16;
    ctx.fillStyle = COL.player;
    roundRect(x, y, w, h, 6); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = COL.playerCore;
    ctx.fillRect(x + 4 + p.face * 2, y + 6, w - 8, 5);
    ctx.fillStyle = "#0a1a2a";
    ctx.fillRect(x + w / 2 - 1 + p.face * 5, y + 7, 3, 3);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a0e22");
    g.addColorStop(0.55, "#0c1230");
    g.addColorStop(1, "#140a1c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(244,241,255,.25)";
    for (let i = 0; i < 70; i++) {
      const sx = ((i * 173 - camX * Z * 0.12) % W + W) % W;
      const sy = ((i * 97 - camY * Z * 0.08) % H + H) % H;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function drawBanner() {
    if (!banner || banner.t > banner.max) return;
    const k = banner.t / banner.max;
    const a = k < 0.12 ? k / 0.12 : k > 0.78 ? (1 - k) / 0.22 : 1;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "600 " + Math.round(26 * S) + "px Manrope, system-ui, sans-serif";
    ctx.fillStyle = "#8ee9ff";
    ctx.shadowColor = "#c4a6ff";
    ctx.shadowBlur = 16;
    ctx.fillText(banner.text, W / 2, H * 0.24);
    ctx.font = "500 " + Math.round(13 * S) + "px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#c4a6ff";
    ctx.fillText(banner.sub.toUpperCase().split("").join(" "), W / 2, H * 0.24 + 28 * S);
    ctx.restore();
  }

  function render(t) {
    const sh = PA.shakeOffset();
    ctx.setTransform(DPR, 0, 0, DPR, DPR * sh.x, DPR * sh.y);
    drawBackground();
    if (!grid.length) return;
    ctx.save();
    ctx.scale(Z, Z);
    ctx.translate(-camX, -camY);
    drawTiles();
    drawSpikes(t);
    lasers.forEach((L) => drawLaser(L, t));
    flags.forEach((f) => drawFlag(f, t));
    if (exit) drawExit(exit, t);
    chips.forEach((c) => drawChip(c, t));
    enemies.forEach(drawEnemy);
    if (player) drawPlayer(player, t);
    fx.draw(ctx);
    texts.draw(ctx);
    ctx.restore();
    drawBanner();
    if (PA.state === "play" && levelIdx === 0 && W > 640 && player && !player.dead && banner && banner.t > 0.5 && levelT < 9) {
      ctx.fillStyle = "rgba(168,163,192,.8)";
      ctx.font = "500 " + Math.round(12 * S) + "px Manrope, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Grab the chips · land on bots to stomp them · hold jump to jump higher", W / 2, H - 24 * S);
    }
  }

  window.__chop = () => ({
    score,
    level: levelIdx + 1,
    levelName: LEVELS[levelIdx] ? LEVELS[levelIdx].name : null,
    levels: LEVELS.length,
    chips: chipsGot,
    chipsTotal: totalChipsAll,
    chipsLevel: chips.filter((c) => c.got).length,
    chipsLevelTotal: chips.length,
    x: player ? player.x : 0,
    y: player ? player.y : 0,
    vx: player ? player.vx : 0,
    vy: player ? player.vy : 0,
    onGround: !!(player && player.onGround),
    wallDir,
    deaths,
    stomps,
    camX,
    camY,
    zoom: Z,
    alive: !!(player && !player.dead),
    overSent,
    simT
  });
  // test hook: drop the player on a tile (x, y in tiles)
  window.__chopWarp = (tx, ty) => { if (player) { player.x = tx * TILE + (TILE - PW) / 2; player.y = ty * TILE + TILE - PH; player.vx = player.vy = 0; invuln = 0.3; } };
  window.__chopLevel = (i) => loadLevel(i, true);

  PA.loop(update, render);
})();
</script>
