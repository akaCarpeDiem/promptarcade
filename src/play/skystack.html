<style>

<div id="game" aria-label="Skystack 3D: a skyscraper rising over a city"></div>
<div id="sk-panel"><small id="sk-dist">Brick row</small><b id="sk-score">0</b><span>FLOOR</span></div>

<script>
window.paConfig = {
  slug: "skystack", title: "Skystack 3D", native: true, music: "lofi", unit: "floors",
  controls: [["Space / click / tap", "Lower the floor off the crane"], ["Flush drops", "Three in a row brace the tower: no sway for four floors"], ["Hot streak", "From the third flush in a row, each flush floor grows back a little"], ["Sky lobby", "Every tenth floor the next one comes wider"], ["Wind", "From floor 5 the tower sways: drop where the top is, not where it was"]]
};

<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";
// A skyscraper built one floor at a time. A crane swings each floor in on a cable, alternating sides;
// whatever overhangs the floor below is sheared off. The building climbs through five districts, from
// brick walk-ups to a glass spire, while the day turns to night around it. Wind sways the tower, flush
// drops brace it (and a hot streak of them grows the floor back), and every tenth floor is a wide sky lobby.
// A tower crane climbs with the building, slewing its jib to follow each floor in.
const $ = (id) => document.getElementById(id);
const PA = window.PA;
/* ---------------- renderer + post ---------------- */
const mount = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const dprCap = () => Math.min(PA.isTouch ? 1.5 : 2, devicePixelRatio || 1);
renderer.setPixelRatio(dprCap());
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
mount.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040d);
scene.fog = new THREE.FogExp2(0x070516, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.3, 500);
const hdr = (c, k) => new THREE.Color(c).multiplyScalar(k);

function makePost() {
  const ext = renderer.extensions;
  const fullFloat = ext.has("EXT_color_buffer_float"), hdrOk = fullFloat || ext.has("EXT_color_buffer_half_float");
  const type = hdrOk ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const main = new THREE.WebGLRenderTarget(1, 1, { type, samples: hdrOk && !fullFloat ? 0 : PA.isTouch ? 2 : 4 });
  const LV = 5, lv = [], tmp = [];
  for (let i = 0; i < LV; i++) {
    lv.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
    tmp.push(new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
  }
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  const pscene = new THREE.Scene();
  pscene.add(quad);
  const vs = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
  const mk = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
  const box4 = "vec3 c = 0.25 * (texture2D(tex, vUv + px * vec2(-0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, -0.5)).rgb + texture2D(tex, vUv + px * vec2(-0.5, 0.5)).rgb + texture2D(tex, vUv + px * vec2(0.5, 0.5)).rgb);";
  const bright = mk([
    "uniform sampler2D tex; uniform vec2 px; uniform float thr; varying vec2 vUv;",
    "void main(){", box4,
    "  float l = max(c.r, max(c.g, c.b));",
    "  float knee = thr * 0.5, soft = clamp(l - thr + knee, 0.0, 2.0 * knee);",
    "  soft = soft * soft / (4.0 * knee + 1e-4);",
    "  gl_FragColor = vec4(min(c * max(soft, l - thr) / max(l, 1e-4), vec3(30.0)), 1.0);",
    "}"].join("\n"), { tex: { value: null }, px: { value: new THREE.Vector2() }, thr: { value: hdrOk ? 0.95 : 0.7 } });
  const down = mk("uniform sampler2D tex; uniform vec2 px; varying vec2 vUv; void main(){ " + box4 + " gl_FragColor = vec4(c, 1.0); }",
    { tex: { value: null }, px: { value: new THREE.Vector2() } });
  const blur = mk([
    "uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tex, vUv).rgb * 0.2270270270;",
    "  c += (texture2D(tex, vUv + dir * 1.3846153846).rgb + texture2D(tex, vUv - dir * 1.3846153846).rgb) * 0.3162162162;",
    "  c += (texture2D(tex, vUv + dir * 3.2307692308).rgb + texture2D(tex, vUv - dir * 3.2307692308).rgb) * 0.0702702703;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n"), { tex: { value: null }, dir: { value: new THREE.Vector2() } });
  const comp = mk([
    "uniform sampler2D tScene, b0, b1, b2, b3, b4; uniform float strength, grain, time, hurt, chroma; varying vec2 vUv;",
    "void main(){",
    "  vec2 q = vUv - 0.5;",
    "  vec3 c;",
    "  c.r = texture2D(tScene, vUv + q * chroma * 0.012).r;",
    "  c.g = texture2D(tScene, vUv).g;",
    "  c.b = texture2D(tScene, vUv - q * chroma * 0.012).b;",
    "  vec3 b = texture2D(b0, vUv).rgb * 0.5 + texture2D(b1, vUv).rgb * 0.6 + texture2D(b2, vUv).rgb * 0.75 + texture2D(b3, vUv).rgb * 0.85 + texture2D(b4, vUv).rgb * 0.95;",
    "  c += b * strength;",
    "  float vig = dot(q, q);",
    "  c *= 1.0 - vig * 0.85;",
    "  c += vec3(1.0, 0.2, 0.45) * hurt * smoothstep(0.08, 0.4, vig);",
    "  gl_FragColor = vec4(c, 1.0);",
    "  #include <tonemapping_fragment>",
    "  #include <colorspace_fragment>",
    "  float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 97.0, vec2(12.9898, 78.233))) * 43758.5453);",
    "  gl_FragColor.rgb += (n - 0.5) * grain;",
    "}"].join("\n"), {
    tScene: { value: main.texture }, b0: { value: lv[0].texture }, b1: { value: lv[1].texture }, b2: { value: lv[2].texture },
    b3: { value: lv[3].texture }, b4: { value: lv[4].texture }, strength: { value: 0.5 }, grain: { value: 0.02 }, time: { value: 0 }, hurt: { value: 0 }, chroma: { value: 0.1 }
  });
  const pass = (m, target) => { quad.material = m; renderer.setRenderTarget(target); renderer.render(pscene, cam); };
  return {
    comp,
    setSize(w, h) {
      main.setSize(w, h);
      for (let i = 0; i < LV; i++) {
        const lw = Math.max(1, w >> (i + 1)), lh = Math.max(1, h >> (i + 1));
        lv[i].setSize(lw, lh); tmp[i].setSize(lw, lh);
      }
    },
    render(sc, cm, t) {
      renderer.setRenderTarget(main);
      renderer.render(sc, cm);
      bright.uniforms.tex.value = main.texture;
      bright.uniforms.px.value.set(1 / main.width, 1 / main.height);
      pass(bright, lv[0]);
      for (let i = 0; i < LV; i++) {
        if (i) {
          down.uniforms.tex.value = lv[i - 1].texture;
          down.uniforms.px.value.set(1 / lv[i - 1].width, 1 / lv[i - 1].height);
          pass(down, lv[i]);
        }
        blur.uniforms.tex.value = lv[i].texture; blur.uniforms.dir.value.set(1 / lv[i].width, 0);
        pass(blur, tmp[i]);
        blur.uniforms.tex.value = tmp[i].texture; blur.uniforms.dir.value.set(0, 1 / lv[i].height);
        pass(blur, lv[i]);
      }
      comp.uniforms.time.value = t;
      pass(comp, null);
    }
  };
}
const post = makePost();
function canvasTex(w, h, paint, o) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  paint(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = o && o.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  if (o && o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const glowTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.2, "rgba(255,255,255,.5)"); gr.addColorStop(.55, "rgba(255,255,255,.1)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
function glowSprite(color, scale) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(scale);
  return s;
}

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMappingExposure = 1.25;
post.comp.uniforms.strength.value = 0.45;
post.comp.uniforms.grain.value = 0.012;
scene.background = null;
scene.fog = new THREE.Fog(0xcfeaff, 45, 160);
const cam = camera;
cam.fov = 32; cam.near = 0.5; cam.far = 900;
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(10, 30, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 });
scene.add(sun); scene.add(sun.target);

const H = 1, START = 6, SPEED0 = 7.5, PERFECT = 0.14, BASE_H = 10;
let stack = [], debris = [], sparks = [], moving = null, windT = 0, windX = 0, windZ = 0, warned = false, axis = "x", dir = 1, speed = SPEED0, score = 0;
let kick = 0;
let streak = 0, bestStreak = 0, flush = 0, braced = 0, braceK = 0, over = false, camY = 0, camD = 30, running = false, clock = 0, night = 0, skyF = 0;

/* ---------- districts: each ten floors gets its own facade ---------- */
const DISTRICTS = [
  { name: "Brick row", style: "brick", wall: "#8e4a36", trim: "#eadfce", glass: "#26323d", lit: "#ffd38a", roof: "#5b5550" },
  { name: "Concrete block", style: "ribbon", wall: "#a3a7ab", trim: "#d3d5d8", glass: "#30485a", lit: "#fff1c4", roof: "#6c7075" },
  { name: "Glass tower", style: "curtain", wall: "#4d8ea6", trim: "#d6edf4", glass: "#4d8ea6", lit: "#eaf7ff", roof: "#3f5560" },
  { name: "Deco heights", style: "deco", wall: "#dccba4", trim: "#c49a3c", glass: "#2a313d", lit: "#ffcf7a", roof: "#a8946a" },
  { name: "The spire", style: "spire", wall: "#1c2331", trim: "#7fe0ff", glass: "#121824", lit: "#a6ecff", roof: "#121824" }
];
const LOBBY = { name: "Lobby", style: "lobby", wall: "#7d8288", trim: "#d9dcdf", glass: "#2b3c48", lit: "#fff0c8", roof: "#5d6166" };
function districtOf(i) { return i <= 0 ? LOBBY : DISTRICTS[Math.min(DISTRICTS.length - 1, Math.floor((i - 1) / 10))]; }
// one facade tile is 2 world units wide and one floor tall: a colour map plus a map of the windows that light up at night
function paintFacade(D) {
  const W = 256, Hh = 128, c = document.createElement("canvas"), e = document.createElement("canvas");
  c.width = e.width = W; c.height = e.height = Hh;
  const g = c.getContext("2d"), q = e.getContext("2d");
  q.fillStyle = "#000"; q.fillRect(0, 0, W, Hh);
  g.fillStyle = D.wall; g.fillRect(0, 0, W, Hh);
  const win = (x, y, w, h, frame) => {
    if (frame) { g.fillStyle = D.trim; g.fillRect(x - frame, y - frame, w + frame * 2, h + frame * 2); }
    const gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, D.glass); gr.addColorStop(1, shade(D.glass, 26));
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(x, y, w * .35, h);
    if (Math.random() < .45) { q.fillStyle = D.lit; q.globalAlpha = .55 + Math.random() * .45; q.fillRect(x, y, w, h); q.globalAlpha = 1; }
  };
  if (D.style === "brick") {
    g.strokeStyle = "rgba(40,18,12,.35)"; g.lineWidth = 1.5;
    for (let y = 4; y < Hh; y += 9) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); for (let x = (y / 9 & 1) * 11; x < W; x += 22) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 9); g.stroke(); } }
    for (const x of [26, 154]) { win(x, 34, 76, 62, 6); g.fillStyle = D.trim; g.fillRect(x - 10, 100, 96, 8); }
  } else if (D.style === "ribbon") {
    g.fillStyle = D.trim; g.fillRect(0, 0, W, 18); g.fillRect(0, Hh - 18, W, 18);
    for (let x = 0; x < W; x += 64) win(x + 3, 34, 58, 60, 0);
  } else if (D.style === "curtain") {
    for (let x = 0; x < W; x += 32) win(x + 2, 6, 28, Hh - 16, 0);
    g.fillStyle = D.trim; for (let x = 0; x < W; x += 32) g.fillRect(x, 0, 2, Hh); g.fillRect(0, Hh - 10, W, 10); g.fillRect(0, 44, W, 2);
  } else if (D.style === "deco") {
    for (let x = 0; x < W; x += 64) { g.fillStyle = D.trim; g.fillRect(x, 0, 8, Hh); win(x + 22, 18, 26, 92, 3); }
    g.fillStyle = shade(D.wall, -20); g.fillRect(0, 0, W, 8); g.fillStyle = D.trim; g.fillRect(0, 8, W, 3);
  } else if (D.style === "spire") {
    for (let x = 0; x < W; x += 21) for (let y = 12; y < Hh - 12; y += 36) win(x + 3, y, 15, 28, 0);
    g.fillStyle = D.trim; g.fillRect(0, 0, W, 3); g.fillRect(0, Hh - 3, W, 3);
    q.fillStyle = D.trim; q.fillRect(0, 0, W, 3); q.fillRect(0, Hh - 3, W, 3);
  } else {
    // lobby: tall glass with doors, read over ten floors of podium
    g.fillStyle = D.trim; g.fillRect(0, 0, W, Hh);
    for (let x = 0; x < W; x += 64) win(x + 6, 10, 52, Hh - 20, 0);
  }
  const map = new THREE.CanvasTexture(c), em = new THREE.CanvasTexture(e);
  for (const t of [map, em]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; }
  map.colorSpace = THREE.SRGBColorSpace; em.colorSpace = THREE.SRGBColorSpace;
  return { map, em };
}
function shade(hex, n) { const v = parseInt(hex.slice(1), 16); const f = (s) => Math.max(0, Math.min(255, ((v >> s) & 255) + n)); return `rgb(${f(16)},${f(8)},${f(0)})`; }
for (const D of [LOBBY, ...DISTRICTS]) Object.assign(D, paintFacade(D));

const geo = new THREE.BoxGeometry(1, 1, 1);
const sideMats = new Set();
// box faces: +x, -x, +y, -y, +z, -z. Sides get the facade at a repeat that matches their width.
function makeMats(D, w, d, h) {
  const side = (len) => {
    const map = D.map.clone(), em = D.em.clone();
    map.repeat.set(len / 2, h); em.repeat.set(len / 2, h);
    map.needsUpdate = em.needsUpdate = true;
    const m = new THREE.MeshStandardMaterial({ map, emissiveMap: em, emissive: 0xffffff, emissiveIntensity: night * 1.2, roughness: .62, metalness: D.style === "curtain" || D.style === "spire" ? .35 : .05 });
    sideMats.add(m); return m;
  };
  const roof = new THREE.MeshStandardMaterial({ color: D.roof, roughness: .85 });
  return [side(d), side(d), roof, roof, side(w), side(w)];
}
function resizeMats(s) {
  const reps = [s.d, s.d, 0, 0, s.w, s.w];
  s.m.material.forEach((m, k) => { if (m.map) { m.map.repeat.x = reps[k] / 2; m.emissiveMap.repeat.x = reps[k] / 2; } });
}
function disposeMesh(m) {
  for (const mat of new Set(m.material)) { if (mat.map) { mat.map.dispose(); mat.emissiveMap.dispose(); sideMats.delete(mat); } mat.dispose(); }
}
function slab(w, d, x, y, z, i, h = H) {
  const D = districtOf(i);
  const m = new THREE.Mesh(geo, makeMats(D, w, d, h / H));
  m.scale.set(w, h, d); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return { m, w, d, x, z, y };
}

/* ---------- the city below and the sky around ---------- */
const GY = -BASE_H + .5;
// streets every 20 units; the tower's own block is a plaza
const streetTex = canvasTex(512, 512, (g, w) => {
  g.fillStyle = "#3a4046"; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? "255,255,255" : "0,0,0"},${Math.random() * .05})`; g.fillRect(Math.random() * w, Math.random() * w, 3, 3); }
  // one block: pavement, kerb, then half a road on each side
  const R = w * 0.1, K = w * 0.02;
  g.fillStyle = "#24282d"; g.fillRect(0, 0, w, R); g.fillRect(0, w - R, w, R); g.fillRect(0, 0, R, w); g.fillRect(w - R, 0, R, w);
  g.fillStyle = "#8d9196"; g.fillRect(R, R, w - 2 * R, K); g.fillRect(R, w - R - K, w - 2 * R, K); g.fillRect(R, R, K, w - 2 * R); g.fillRect(w - R - K, R, K, w - 2 * R);
  g.fillStyle = "#e9d9a0";
  for (let x = 0; x < w; x += 28) { g.fillRect(x, 0, 14, 2); g.fillRect(x, w - 2, 14, 2); g.fillRect(0, x, 2, 14); g.fillRect(w - 2, x, 2, 14); }
  g.fillStyle = "#4a5a48"; g.fillRect(R + K + 6, R + K + 6, w - 2 * (R + K + 6), w - 2 * (R + K + 6));
}, { repeat: true });
streetTex.repeat.set(30, 30);
streetTex.offset.set(0.5, 0.5);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ map: streetTex, roughness: .95 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = GY; ground.receiveShadow = true; scene.add(ground);
// city blocks: instanced towers with a window texture that lights up at night
const winTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  for (let y = 6; y < h - 4; y += 12) for (let x = 6; x < w - 4; x += 14) if (Math.random() < .5) { g.fillStyle = `rgba(255,${200 + Math.random() * 40},${130 + Math.random() * 80},${.5 + Math.random() * .5})`; g.fillRect(x, y, 8, 7); }
}, { repeat: true });
const wallTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
  for (let y = 6; y < h - 4; y += 12) for (let x = 6; x < w - 4; x += 14) { g.fillStyle = "rgba(40,60,80,.55)"; g.fillRect(x, y, 8, 7); }
  g.fillStyle = "rgba(0,0,0,.08)"; for (let y = 0; y < h; y += 12) g.fillRect(0, y, w, 2);
}, { repeat: true });
const cityWall = new THREE.MeshStandardMaterial({ color: 0xffffff, map: wallTex, emissive: 0xffffff, emissiveMap: winTex, emissiveIntensity: 0, roughness: .8, metalness: .1 });
const cityRoof = new THREE.MeshStandardMaterial({ color: 0x5b6168, roughness: .9 });
const blocks = [];
for (let gx = -6; gx <= 6; gx++) for (let gz = -6; gz <= 6; gz++) {
  if (Math.abs(gx) <= 0 && Math.abs(gz) <= 0) continue;
  const cx = gx * 20, cz = gz * 20, r = Math.hypot(cx, cz);
  if (r > 125) continue;
  // two to four buildings to a block, taller further out so the tower always reads as the star

addEventListener("pointerdown", (e) => { if (e.target.closest && e.target.closest("button,#pa-gate,.pa-layer,.pa-tb")) return; drop(); });
