<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Skystack 3D — PromptArcade</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Manrope,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#c{display:block;position:fixed;inset:0;transition:background 1.2s}
#sk-score{position:fixed;top:64px;left:0;right:0;text-align:center;z-index:30;pointer-events:none;font:800 clamp(48px,10vw,92px)/1 Unbounded,Manrope,sans-serif;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.25)}
#sk-combo{position:fixed;top:170px;left:0;right:0;text-align:center;z-index:30;pointer-events:none;font:800 16px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#fff;opacity:0;transition:opacity .3s}
#sk-hint{position:fixed;bottom:40px;left:0;right:0;text-align:center;z-index:30;pointer-events:none;font:700 14px Manrope,sans-serif;color:rgba(255,255,255,.8);transition:opacity .5s}
</style></head><body>
<div id="c"></div>
<div id="sk-score">0</div><div id="sk-combo"></div><div id="sk-hint">Tap, click or press Space to drop the slab</div>
<script>
window.paConfig = {
  slug: "skystack", title: "Skystack 3D", native: true, music: "lofi", unit: "floors",
  controls: [["Space / click / tap", "Drop the slab"], ["Perfect drops", "Build a combo — the slab grows back"]]
};
</script>
<script src="/games/play/pa-score.js"></script>
<script src="/games/play/pa-gate.js"></script>
<script src="/games/play/pa-kit.js"></script>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";
const $ = (id) => document.getElementById(id);
const host = $("c");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
cam.position.set(20, 20, 20); cam.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(10, 30, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 });
scene.add(sun); scene.add(sun.target);

const H = 1, START = 6, SPEED0 = 7.5, PERFECT = 0.14;
let stack = [], debris = [], rings = [], moving = null, axis = "x", dir = 1, speed = SPEED0, score = 0, combo = 0, bestCombo = 0, over = false, camY = 0, hue = Math.random() * 360, running = false, perfects = 0;
const geo = new THREE.BoxGeometry(1, 1, 1);
function colorAt(i) { return new THREE.Color().setHSL(((hue + i * 9) % 360) / 360, 0.62, 0.6); }
function bgAt(i) {
  const h1 = (hue + i * 9 + 180) % 360, h2 = (h1 + 40) % 360;
  return `linear-gradient(180deg,hsl(${h1} 55% 72%),hsl(${h2} 50% 42%))`;
}
function slab(w, d, x, y, z, i) {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colorAt(i), roughness: 0.55, metalness: 0.05 }));
  m.scale.set(w, H, d); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return { m, w, d, x, z, y };
}
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h, s = a < 0.8 ? 13 : 9.5;
  cam.left = -s * a; cam.right = s * a; cam.top = s; cam.bottom = -s; cam.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener("resize", resize); resize();

function clear() {
  for (const s of stack) { scene.remove(s.m); s.m.material.dispose(); }
  for (const d of debris) { scene.remove(d.m); d.m.material.dispose(); }
  for (const r of rings) { scene.remove(r.m); }
  stack = []; debris = []; rings = [];
}
function reset() {
  clear();
  hue = Math.random() * 360;
  score = 0; combo = 0; bestCombo = 0; perfects = 0; over = false; speed = SPEED0; axis = "x"; camY = 0; running = true;
  // a tall base so the tower stands on something
  const base = slab(START, START, 0, -5, 0, 0); base.m.scale.y = 10; base.y = -5;
  base.top = 0; stack.push({ ...base, y: 0 });
  stack[0].m.position.y = -4.5;
  stack[0].y = 0;
  host.style.background = bgAt(0);
  $("sk-score").textContent = "0";
  $("sk-hint").style.opacity = 1;
  spawn();
}
function top() { return stack[stack.length - 1]; }
function spawn() {
  const t = top(), i = stack.length;
  axis = axis === "x" ? "z" : "x";
  const y = i * H;
  const s = slab(t.w, t.d, axis === "x" ? -9 : t.x, y, axis === "z" ? -9 : t.z, i);
  moving = s; dir = 1;
  moving.pos = -9;
}
function drop() {
  if (!running || over || !moving || PA.state !== "play") return;
  $("sk-hint").style.opacity = 0;
  const t = top(), m = moving;
  const delta = axis === "x" ? m.x - t.x : m.z - t.z;
  const size = axis === "x" ? t.w : t.d;
  const overlap = size - Math.abs(delta);
  if (overlap <= 0) { // missed entirely
    fall(m, axis, delta > 0 ? 1 : -1);
    moving = null;
    return gameOver();
  }
  const i = stack.length;
  if (Math.abs(delta) < PERFECT) {
    // perfect: snap, keep full size, combo grows it back a little
    combo++; perfects++; bestCombo = Math.max(bestCombo, combo);
    if (axis === "x") m.x = t.x; else m.z = t.z;
    let w = t.w, d = t.d;
    if (combo >= 3) { const g = 0.25; if (axis === "x") w = Math.min(START, w + g); else d = Math.min(START, d + g); }
    m.w = w; m.d = d;
    m.m.scale.set(w, H, d); m.m.position.set(m.x, m.y, m.z);
    ring(m, combo);
    PA.sfx("blip", { pitch: 1 + Math.min(1.4, combo * 0.12) });
    if (combo >= 3) PA.sfx("power", { pitch: 1 + combo * 0.03 });
    const c = $("sk-combo"); c.textContent = combo >= 2 ? `PERFECT ×${combo}` : "PERFECT"; c.style.opacity = 1; clearTimeout(c.t); c.t = setTimeout(() => (c.style.opacity = 0), 900);
  } else {
    combo = 0;
    const cut = Math.abs(delta), sign = Math.sign(delta);
    if (axis === "x") {
      m.w = overlap; m.x = t.x + delta / 2;
      const fx = m.x + sign * (overlap / 2 + cut / 2);
      debrisPiece(cut, t.d, fx, m.y, m.z, i, sign, "x");
    } else {
      m.d = overlap; m.z = t.z + delta / 2;
      const fz = m.z + sign * (overlap / 2 + cut / 2);
      debrisPiece(t.w, cut, m.x, m.y, fz, i, sign, "z");
    }
    m.m.scale.set(m.w, H, m.d); m.m.position.set(m.x, m.y, m.z);
    PA.sfx("thud", { pitch: 1.2 + Math.min(0.6, stack.length * 0.01) });
  }
  stack.push(m);
  score = stack.length - 1;
  $("sk-score").textContent = score;
  host.style.background = bgAt(score);
  speed = Math.min(16, SPEED0 + score * 0.12);
  spawn();
}
function debrisPiece(w, d, x, y, z, i, sign, ax) {
  const p = slab(w, d, x, y, z, i);
  p.vy = 0; p.vx = ax === "x" ? sign * 2.5 : 0; p.vz = ax === "z" ? sign * 2.5 : 0;
  p.rx = (ax === "z" ? sign : 0) * (1 + Math.random()); p.rz = (ax === "x" ? -sign : 0) * (1 + Math.random());
  debris.push(p);
}
function fall(m, ax, sign) { m.vy = 0; m.vx = ax === "x" ? sign * 3 : 0; m.vz = ax === "z" ? sign * 3 : 0; m.rx = ax === "z" ? sign * 2 : 0; m.rz = ax === "x" ? -sign * 2 : 0; debris.push(m); }
function ring(m, c) {
  const g = new THREE.RingGeometry(1, 1.12, 48);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
  const r = new THREE.Mesh(g, mat);
  r.rotation.x = -Math.PI / 2; r.position.set(m.x, m.y - 0.49, m.z);
  r.scale.set(Math.max(m.w, m.d) * 0.72, Math.max(m.w, m.d) * 0.72, 1);
  scene.add(r); rings.push({ m: r, t: 0, c });
}
function gameOver() {
  over = true;
  PA.sfx("gameover");
  setTimeout(() => {
    PA.gameOver(score, { kicker: "The tower topples", title: score >= 50 ? "Skyscraper!" : score >= 25 ? "Lofty!" : "Tower complete", unit: "floors", stats: [["Perfect drops", perfects], ["Best combo", "×" + bestCombo]] });
    if (window.paXP) window.paXP.award("skystack", { score });
  }, 900);
}

addEventListener("pointerdown", (e) => { if (e.target.closest && e.target.closest("button,#pa-gate,.pa-layer,.pa-tb")) return; drop(); });
PA.onKey((e) => { if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowDown") { e.preventDefault(); drop(); } });

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (PA.isPaused && PA.isPaused()) return;
  if (moving && !over && PA.state === "play") {
    moving.pos += dir * speed * dt;
    if (moving.pos > 9) { moving.pos = 9; dir = -1; } else if (moving.pos < -9) { moving.pos = -9; dir = 1; }
    const t = top();
    if (axis === "x") { moving.x = t.x + moving.pos; moving.z = t.z; } else { moving.z = t.z + moving.pos; moving.x = t.x; }
    moving.m.position.set(moving.x, moving.y, moving.z);
  }
  for (const d of debris) {
    d.vy -= 30 * dt; d.m.position.x += d.vx * dt; d.m.position.y += d.vy * dt; d.m.position.z += d.vz * dt;
    d.m.rotation.x += d.rx * dt; d.m.rotation.z += d.rz * dt;
  }
  for (let i = debris.length - 1; i >= 0; i--) if (debris[i].m.position.y < camY - 30) { scene.remove(debris[i].m); debris[i].m.material.dispose(); debris.splice(i, 1); }
  for (const r of rings) { r.t += dt; const k = r.t / 0.6; r.m.scale.multiplyScalar(1 + dt * 1.6); r.m.material.opacity = Math.max(0, 0.9 * (1 - k)); }
  for (let i = rings.length - 1; i >= 0; i--) if (rings[i].t > 0.6) { scene.remove(rings[i].m); rings.splice(i, 1); }
  // camera rises with the tower; zooms out at game over to show the whole thing
  const targetY = over ? stack.length * H * 0.5 : Math.max(0, stack.length * H - 4);
  camY += (targetY - camY) * Math.min(1, dt * 3);
  cam.position.set(20, 20 + camY, 20); cam.lookAt(0, camY, 0);
  if (over) { const z = Math.max(1, stack.length / 14); cam.zoom += (1 / z - cam.zoom) * dt * 2; cam.updateProjectionMatrix(); }
  else if (cam.zoom !== 1) { cam.zoom = 1; cam.updateProjectionMatrix(); }
  sun.position.set(10, 30 + camY, 6); sun.target.position.set(0, camY, 0);
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
PA.onStart(reset);
reset(); running = false;
window.__sk = { drop, get score() { return score; }, get delta() { const t = top(); return moving ? (axis === "x" ? moving.x - t.x : moving.z - t.z) : null; } };
</script>
</body></html>
