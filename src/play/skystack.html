<style>

<script>
window.paConfig = {
  slug: "skystack", title: "Skystack 3D", native: true, music: "lofi", unit: "floors",
  controls: [["Space / click / tap", "Lower the floor off the crane"], ["Flush drops", "Three in a row brace the tower: no sway for four floors"], ["Sky lobby", "Every tenth floor the next one comes wider"], ["Wind", "From floor 5 the tower sways: drop where the top is, not where it was"]]

<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";
// A skyscraper built one floor at a time. A crane swings each floor in on a cable, alternating sides;
// whatever overhangs the floor below is sheared off. The building climbs through five districts, from
// brick walk-ups to a glass spire, while the day turns to night around it. Wind sways the tower, flush
// drops brace it, and every tenth floor is a wide sky lobby.
const $ = (id) => document.getElementById(id);
const host = $("c");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfeaff, 45, 140);
const cam = new THREE.PerspectiveCamera(32, 1, 0.5, 500);
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(10, 30, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 });
scene.add(sun); scene.add(sun.target);

const H = 1, START = 6, SPEED0 = 7.5, PERFECT = 0.14, BASE_H = 10;
let stack = [], debris = [], sparks = [], moving = null, windT = 0, windX = 0, windZ = 0, warned = false, axis = "x", dir = 1, speed = SPEED0, score = 0;
let streak = 0, bestStreak = 0, flush = 0, braced = 0, braceK = 0, over = false, camY = 0, camD = 30, running = false, clock = 0, night = 0, skyF = 0;

/* ---------- districts: each ten floors gets its own facade ---------- */
const DISTRICTS = [
  { name: "Brick row", style: "brick", wall: "#8e4a36", trim: "#eadfce", glass: "#26323d", lit: "#ffd38a", roof: "#5b5550" },
  { name: "Concrete block", style: "ribbon", wall: "#a3a7ab", trim: "#d3d5d8", glass: "#30485a", lit: "#fff1c4", roof: "#6c7075" },
  { name: "Glass tower", style: "curtain", wall: "#4d8ea6", trim: "#d6edf4", glass: "#4d8ea6", lit: "#eaf7ff", roof: "#3f5560" },
  { name: "Deco heights", style: "deco", wall: "#dccba4", trim: "#c49a3c", glass: "#2a313d", lit: "#ffcf7a", roof: "#a8946a" },
  { name: "The spire", style: "spire", wall: "#1c2331", trim: "#7fe0ff", glass: "#121824", lit: "#a6ecff", roof: "#121824" }
];
const LOBBY = { name: "Lobby", style: "lobby", wall: "#7d8288", trim: "#d9dcdf", glass: "#2b3c48", lit: "#fff0c8", roof: "#5d6166" };
function districtOf(i) { return i <= 0 ? LOBBY : DISTRICTS[Math.min(DISTRICTS.length - 1, Math.floor((i - 1) / 10))]; }
// one facade tile is 2 world units wide and one floor tall: a colour map plus a map of the windows that light up at night
function paintFacade(D) {
  const W = 256, Hh = 128, c = document.createElement("canvas"), e = document.createElement("canvas");
  c.width = e.width = W; c.height = e.height = Hh;
  const g = c.getContext("2d"), q = e.getContext("2d");
  q.fillStyle = "#000"; q.fillRect(0, 0, W, Hh);
  g.fillStyle = D.wall; g.fillRect(0, 0, W, Hh);
  const win = (x, y, w, h, frame) => {
    if (frame) { g.fillStyle = D.trim; g.fillRect(x - frame, y - frame, w + frame * 2, h + frame * 2); }
    const gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, D.glass); gr.addColorStop(1, shade(D.glass, 26));
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(x, y, w * .35, h);
    if (Math.random() < .45) { q.fillStyle = D.lit; q.globalAlpha = .55 + Math.random() * .45; q.fillRect(x, y, w, h); q.globalAlpha = 1; }
  };
  if (D.style === "brick") {
    g.strokeStyle = "rgba(40,18,12,.35)"; g.lineWidth = 1.5;
    for (let y = 4; y < Hh; y += 9) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); for (let x = (y / 9 & 1) * 11; x < W; x += 22) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 9); g.stroke(); } }
    for (const x of [26, 154]) { win(x, 34, 76, 62, 6); g.fillStyle = D.trim; g.fillRect(x - 10, 100, 96, 8); }
  } else if (D.style === "ribbon") {
    g.fillStyle = D.trim; g.fillRect(0, 0, W, 18); g.fillRect(0, Hh - 18, W, 18);
    for (let x = 0; x < W; x += 64) win(x + 3, 34, 58, 60, 0);
  } else if (D.style === "curtain") {
    for (let x = 0; x < W; x += 32) win(x + 2, 6, 28, Hh - 16, 0);
    g.fillStyle = D.trim; for (let x = 0; x < W; x += 32) g.fillRect(x, 0, 2, Hh); g.fillRect(0, Hh - 10, W, 10); g.fillRect(0, 44, W, 2);
  } else if (D.style === "deco") {
    for (let x = 0; x < W; x += 64) { g.fillStyle = D.trim; g.fillRect(x, 0, 8, Hh); win(x + 22, 18, 26, 92, 3); }
    g.fillStyle = shade(D.wall, -20); g.fillRect(0, 0, W, 8); g.fillStyle = D.trim; g.fillRect(0, 8, W, 3);
  } else if (D.style === "spire") {
    for (let x = 0; x < W; x += 21) for (let y = 12; y < Hh - 12; y += 36) win(x + 3, y, 15, 28, 0);
    g.fillStyle = D.trim; g.fillRect(0, 0, W, 3); g.fillRect(0, Hh - 3, W, 3);
    q.fillStyle = D.trim; q.fillRect(0, 0, W, 3); q.fillRect(0, Hh - 3, W, 3);
  } else {
    // lobby: tall glass with doors, read over ten floors of podium
    g.fillStyle = D.trim; g.fillRect(0, 0, W, Hh);
    for (let x = 0; x < W; x += 64) win(x + 6, 10, 52, Hh - 20, 0);
  }
  const map = new THREE.CanvasTexture(c), em = new THREE.CanvasTexture(e);
  for (const t of [map, em]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; }
  map.colorSpace = THREE.SRGBColorSpace; em.colorSpace = THREE.SRGBColorSpace;
  return { map, em };
}
function shade(hex, n) { const v = parseInt(hex.slice(1), 16); const f = (s) => Math.max(0, Math.min(255, ((v >> s) & 255) + n)); return `rgb(${f(16)},${f(8)},${f(0)})`; }
for (const D of [LOBBY, ...DISTRICTS]) Object.assign(D, paintFacade(D));

const geo = new THREE.BoxGeometry(1, 1, 1);
const sideMats = new Set();
// box faces: +x, -x, +y, -y, +z, -z. Sides get the facade at a repeat that matches their width.
function makeMats(D, w, d, h) {
  const side = (len) => {
    const map = D.map.clone(), em = D.em.clone();
    map.repeat.set(len / 2, h); em.repeat.set(len / 2, h);
    map.needsUpdate = em.needsUpdate = true;
    const m = new THREE.MeshStandardMaterial({ map, emissiveMap: em, emissive: 0xffffff, emissiveIntensity: night * 1.1, roughness: .62, metalness: D.style === "curtain" || D.style === "spire" ? .35 : .05 });
    sideMats.add(m); return m;
  };
  const roof = new THREE.MeshStandardMaterial({ color: D.roof, roughness: .85 });
  return [side(d), side(d), roof, roof, side(w), side(w)];
}
function resizeMats(s) {
  const reps = [s.d, s.d, 0, 0, s.w, s.w];
  s.m.material.forEach((m, k) => { if (m.map) { m.map.repeat.x = reps[k] / 2; m.emissiveMap.repeat.x = reps[k] / 2; } });
}
function disposeMesh(m) {
  for (const mat of new Set(m.material)) { if (mat.map) { mat.map.dispose(); mat.emissiveMap.dispose(); sideMats.delete(mat); } mat.dispose(); }
}
function slab(w, d, x, y, z, i, h = H) {
  const D = districtOf(i);
  const m = new THREE.Mesh(geo, makeMats(D, w, d, h / H));
  m.scale.set(w, h, d); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return { m, w, d, x, z, y };
}

/* ---------- the city below and the sky around ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x4b5550, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -BASE_H + .5; ground.receiveShadow = true; scene.add(ground);
const CITY = 160, city = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .8 }), CITY);
const cityLights = [];
{
  const o = new THREE.Object3D(), col = new THREE.Color();
  for (let i = 0; i < CITY; i++) {
    let x, z;
    do { x = (Math.random() - .5) * 140; z = (Math.random() - .5) * 140; } while (Math.hypot(x, z) < 15);
    // low streets round the tower, a few taller blocks further out, all lower than the podium nearby
    const r = Math.hypot(x, z), w = 3 + Math.random() * 5, d = 3 + Math.random() * 5, h = 1.5 + Math.random() * (r < 35 ? 6 : r < 55 ? 11 : 16);
    o.position.set(x, -BASE_H + .5 + h / 2, z); o.scale.set(w, h, d); o.updateMatrix();
    city.setMatrixAt(i, o.matrix);
    col.setHSL(.58 + Math.random() * .08, .08 + Math.random() * .1, .35 + Math.random() * .25); city.setColorAt(i, col);
    for (let k = 0; k < h * 1.6; k++) {
      const side = Math.random() < .5, f = Math.random() < .5 ? -1 : 1;
      cityLights.push(side ? x + f * (w / 2 + .05) : x + (Math.random() - .5) * w, -BASE_H + .5 + Math.random() * h, side ? z + (Math.random() - .5) * d : z + f * (d / 2 + .05));
    }
  }
  city.receiveShadow = true; scene.add(city);
}
const lightsGeo = new THREE.BufferGeometry(); lightsGeo.setAttribute("position", new THREE.Float32BufferAttribute(cityLights, 3));
const lightsMat = new THREE.PointsMaterial({ color: 0xffd28a, size: .32, transparent: true, opacity: 0, depthWrite: false });
scene.add(new THREE.Points(lightsGeo, lightsMat));
// soft clouds you climb through on the way up
const cloudTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  for (let k = 0; k < 7; k++) { const x = 30 + Math.random() * 68, y = 50 + Math.random() * 28, r = 22 + Math.random() * 20, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const clouds = [];
for (let i = 0; i < 26; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: .7, depthWrite: false, fog: false }));
  const a = Math.random() * Math.PI * 2, r = 8 + Math.random() * 30;
  s.position.set(Math.cos(a) * r, 12 + Math.random() * 30, Math.sin(a) * r);
  const k = 10 + Math.random() * 14; s.scale.set(k, k * .55, 1);
  s.userData.v = .2 + Math.random() * .4; scene.add(s); clouds.push(s);
}
// time of day by height: morning at street level, a midnight sky at the spire
const SKY = [
  { f: 0, top: [90, 169, 230], bot: [207, 234, 255], sun: [255, 255, 255], si: 1.6, hi: .9, night: 0 },
  { f: 12, top: [74, 143, 214], bot: [255, 224, 168], sun: [255, 236, 200], si: 1.5, hi: .85, night: .05 },
  { f: 24, top: [70, 64, 150], bot: [255, 150, 105], sun: [255, 170, 110], si: 1.2, hi: .7, night: .35 },
  { f: 34, top: [26, 30, 80], bot: [120, 80, 150], sun: [180, 150, 220], si: .6, hi: .5, night: .75 },
  { f: 44, top: [4, 7, 18], bot: [26, 34, 78], sun: [140, 160, 230], si: .35, hi: .38, night: 1 }
];
function skyAt(f) {
  let a = SKY[0], b = SKY[SKY.length - 1];
  for (let i = 0; i < SKY.length - 1; i++) if (f >= SKY[i].f && f <= SKY[i + 1].f) { a = SKY[i]; b = SKY[i + 1]; break; }
  if (f > b.f) a = b;
  const k = a === b ? 0 : (f - a.f) / (b.f - a.f), mix = (p, q) => p.map((v, j) => Math.round(v + (q[j] - v) * k));
  return { top: mix(a.top, b.top), bot: mix(a.bot, b.bot), sun: mix(a.sun, b.sun), si: a.si + (b.si - a.si) * k, hi: a.hi + (b.hi - a.hi) * k, night: a.night + (b.night - a.night) * k };
}
function applySky(f) {
  const s = skyAt(f), css = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
  host.style.background = `linear-gradient(180deg,${css(s.top)},${css(s.bot)})`;
  scene.fog.color.setRGB(s.bot[0] / 255, s.bot[1] / 255, s.bot[2] / 255, THREE.SRGBColorSpace);
  sun.color.setRGB(s.sun[0] / 255, s.sun[1] / 255, s.sun[2] / 255, THREE.SRGBColorSpace); sun.intensity = s.si; hemi.intensity = s.hi;
  skyF = s.night;
}

/* ---------- the crane: a cable and hook that carry the floor in ---------- */
const craneMat = new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: .5, metalness: .6 });
const cable = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, 1, 6), craneMat); scene.add(cable);
const hook = new THREE.Mesh(new THREE.BoxGeometry(.5, .4, .5), new THREE.MeshStandardMaterial({ color: 0xf2b630, roughness: .5 })); scene.add(hook);
const slingGeo = new THREE.BufferGeometry(); slingGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Array(24).fill(0), 3));
const slings = new THREE.LineSegments(slingGeo, new THREE.LineBasicMaterial({ color: 0x1d2026 })); scene.add(slings);
function placeCrane() {
  const show = !!moving && !over;
  cable.visible = hook.visible = slings.visible = show;
  if (!show) return;
  const { x, y, z } = moving.m.position, hy = y + 1.6, top = y + 60;
  hook.position.set(x, hy, z);
  cable.position.set(x, (hy + top) / 2, z); cable.scale.y = top - hy;
  const p = slingGeo.attributes.position, hw = moving.w * .42, hd = moving.d * .42;
  [[hw, hd], [-hw, hd], [hw, -hd], [-hw, -hd]].forEach(([dx, dz], k) => { p.setXYZ(k * 2, x, hy - .2, z); p.setXYZ(k * 2 + 1, x + dx, y + .5, z + dz); });
  p.needsUpdate = true;
}

/* ---------- weld sparks on a flush drop ---------- */
const sparkMat = new THREE.PointsMaterial({ color: 0xffc36b, size: .2, transparent: true, depthWrite: false });
function weld(m) {
  const n = 48, pos = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) {
    // sparks start along the seam under the new floor and spray outward
    const e = (Math.random() * 4) | 0, u = Math.random() - .5;
    const ox = e < 2 ? (e ? 1 : -1) * m.w / 2 : u * m.w, oz = e < 2 ? u * m.d : (e === 2 ? 1 : -1) * m.d / 2;
    pos.set([m.m.position.x + ox, m.y - .5, m.m.position.z + oz], i * 3);
    vel.push(ox * .8 + (Math.random() - .5) * 2, 2 + Math.random() * 4, oz * .8 + (Math.random() - .5) * 2);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, sparkMat.clone()); scene.add(p);
  sparks.push({ p, vel, t: 0 });
}

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  cam.aspect = a; cam.updateProjectionMatrix();
  // far enough back that the crane's whole swing fits across the screen
  camD = Math.max(30, 37 / a);
  renderer.setSize(w, h);
}
addEventListener("resize", resize); resize();

function clear() {
  for (const s of stack) { scene.remove(s.m); disposeMesh(s.m); }
  for (const d of debris) { scene.remove(d.m); disposeMesh(d.m); }
  for (const s of sparks) { scene.remove(s.p); s.p.geometry.dispose(); s.p.material.dispose(); }
  if (moving) { scene.remove(moving.m); disposeMesh(moving.m); }
  stack = []; debris = []; sparks = []; moving = null;
}
function reset() {
  clear();
  score = 0; streak = 0; bestStreak = 0; flush = 0; braced = 0; braceK = 0; over = false; speed = SPEED0; axis = "x"; camY = 0; running = true;
  windT = 0; windX = 0; windZ = 0; warned = false;
  // a ten-storey podium for the tower to stand on
  const base = slab(START, START, 0, -BASE_H / 2 + .5, 0, 0, BASE_H);
  stack.push({ ...base, y: 0 });
  applySky(0);
  $("sk-score").textContent = "0"; $("sk-dist").textContent = districtOf(1).name;
  $("sk-hint").style.opacity = 1;
  spawn();
}
function top() { return stack[stack.length - 1]; }
function say(text, ms = 1000) { const c = $("sk-combo"); c.textContent = text; c.style.opacity = 1; clearTimeout(c.t); c.t = setTimeout(() => (c.style.opacity = 0), ms); }
/* wind: once the tower is a few floors up it sways, the top most of all, so
   the floor rides a fixed line while the landing spot drifts under it */
const SWAY_FROM = 4;
function swayAmp(n) { const k = Math.max(0, n - SWAY_FROM); return Math.min(2.6, 0.05 * k + 0.0009 * k * k) * (1 - braceK); }
function gust(t) { return Math.sin(t * 0.9) * 0.72 + Math.sin(t * 2.1 + 1) * 0.28; }
// live sway of floor j in a tower whose top floor is n
function sway(j, n) {
  if (j <= 0 || n <= 0) return [0, 0];
  const s = swayAmp(n) * gust(windT) * (j / n) * (j / n);
  return [s * windX, s * windZ];
}
function spawn() {
  const t = top(), i = stack.length;
  axis = axis === "x" ? "z" : "x";
  // every tenth floor is a sky lobby: the next floor comes in wider than the one below
  const lobby = score > 0 && score % 10 === 0;
  const w = lobby ? Math.min(START, t.w + 1.2) : t.w, d = lobby ? Math.min(START, t.d + 1.2) : t.d;
  const s = slab(w, d, axis === "x" ? -9 : t.x, i * H, axis === "z" ? -9 : t.z, i);
  moving = s; dir = 1; moving.pos = -9; moving.lobby = lobby && (w > t.w || d > t.d);
  if (moving.lobby) say("SKY LOBBY: A WIDER FLOOR", 1600);
}
function drop() {
  if (!running || over || !moving || PA.state !== "play") return;
  $("sk-hint").style.opacity = 0;
  const t = top(), m = moving, n = stack.length - 1, live = sway(n, n);
  const delta = axis === "x" ? m.x - (t.x + live[0]) : m.z - (t.z + live[1]);
  const size = axis === "x" ? t.w : t.d;
  const overlap = size - Math.abs(delta);
  if (overlap <= 0) { // missed entirely
    fall(m, axis, delta > 0 ? 1 : -1);
    moving = null;
    return gameOver();
  }
  const i = stack.length;
  // back to tower coordinates: the cross-axis tracks the top, so it lines up exactly
  if (axis === "x") { m.x = t.x + delta; m.z = t.z; } else { m.z = t.z + delta; m.x = t.x; }
  if (m.lobby && Math.abs(delta) < size / 2) {
    // a sky lobby lands whole as long as its middle is over the floor below: it cantilevers out
    streak = 0;
    m.m.position.set(m.x + live[0], m.y, m.z + live[1]);
    PA.sfx("thud", { pitch: .9 }); PA.tone({ freq: 523, to: 784, type: "triangle", dur: .25, vol: .08 });
  } else if (Math.abs(delta) < PERFECT) {
    // flush: snap into line and keep the full size
    streak++; flush++; bestStreak = Math.max(bestStreak, streak);
    if (axis === "x") m.x = t.x; else m.z = t.z;
    m.w = t.w; m.d = t.d; m.m.scale.set(m.w, H, m.d); resizeMats(m);

function debrisPiece(w, d, x, y, z, i, sign, ax) {

}

addEventListener("pointerdown", (e) => { if (e.target.closest && e.target.closest("button,#pa-gate,.pa-layer,.pa-tb")) return; drop(); });
PA.onKey((e) => { if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowDown") { e.preventDefault(); drop(); } });

let last = performance.now();
function frame(now) {

  }
  braceK += ((braced > 0 ? 1 : 0) - braceK) * Math.min(1, dt * 2);
  {
    // ease every floor toward its swayed spot so new floors settle in without popping
    const n = stack.length - 1, e = Math.min(1, dt * 10);
    for (let j = 1; j <= n; j++) {
      const s = stack[j], o = sway(j, n), mp = s.m.position;
      mp.x += (s.x + o[0] - mp.x) * e; mp.z += (s.z + o[1] - mp.z) * e;

    const t = top(), n = stack.length - 1, o = sway(n, n);

    if (axis === "x") { moving.x = t.x + moving.pos; moving.z = t.z + o[1]; } else { moving.z = t.z + moving.pos; moving.x = t.x + o[0]; }
    moving.m.position.set(moving.x, moving.y, moving.z);

  for (const d of debris) {
    d.vy -= 30 * dt; d.m.position.x += d.vx * dt; d.m.position.y += d.vy * dt; d.m.position.z += d.vz * dt;
    d.m.rotation.x += d.rx * dt; d.m.rotation.z += d.rz * dt;
  }
  for (let i = debris.length - 1; i >= 0; i--) if (debris[i].m.position.y < -BASE_H - 2) { scene.remove(debris[i].m); disposeMesh(debris[i].m); debris.splice(i, 1); }
  for (const s of sparks) {
    s.t += dt; const p = s.p.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) { s.vel[i * 3 + 1] -= 14 * dt; p.setXYZ(i, p.getX(i) + s.vel[i * 3] * dt, p.getY(i) + s.vel[i * 3 + 1] * dt, p.getZ(i) + s.vel[i * 3 + 2] * dt); }
    p.needsUpdate = true; s.p.material.opacity = Math.max(0, 1 - s.t / .8);
  }
  for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].t > .8) { scene.remove(sparks[i].p); sparks[i].p.geometry.dispose(); sparks[i].p.material.dispose(); sparks.splice(i, 1); }
  // night comes on with height: lit windows glow, the city twinkles

  cam.userData.d = (cam.userData.d || D) + (D - (cam.userData.d || D)) * Math.min(1, dt * 2);

requestAnimationFrame(frame);
PA.onStart(reset);
reset(); running = false;
window.__sk = { drop,
  // test hook: line the floor up with the swaying top plus an offset, then drop it
  dropAt(off) {

  get score() { return score; }, get streak() { return streak; }, get braced() { return braced; }, get lobby() { return !!(moving && moving.lobby); },
  get delta() { const t = top(), n = stack.length - 1, o = sway(n, n); return moving ? (axis === "x" ? moving.x - (t.x + o[0]) : moving.z - (t.z + o[1])) : null; },
