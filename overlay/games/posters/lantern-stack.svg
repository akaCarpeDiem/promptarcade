<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Lantern Stack">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1c3a"/><stop offset="1" stop-color="#120c18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<rect x="230" y="250" width="180" height="28" rx="6" fill="#f0b45a"/>
<rect x="250" y="214" width="140" height="28" rx="6" fill="#e07a4a"/>
<rect x="270" y="178" width="100" height="28" rx="6" fill="#f6d27a"/>
<rect x="200" y="110" width="120" height="28" rx="6" fill="#fff1c4" stroke="#f0b45a" stroke-width="2"/>
<line x1="200" y1="124" x2="430" y2="124" stroke="#ffffff55" stroke-dasharray="4 6"/>
<circle cx="320" cy="300" r="40" fill="#f6c56b" opacity=".25" filter="url(#soft)"/>
<rect class="ps-title-pill-glow" x="216" y="347" width="208" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="216" y="347" width="208" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Lantern Stack</text>
</svg>
