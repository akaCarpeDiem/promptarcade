<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Night Press">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1840"/><stop offset="1" stop-color="#140e18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<rect x="120" y="250" width="400" height="28" rx="4" fill="#3a2848"/>
<line x1="100" y1="250" x2="540" y2="250" stroke="#e7c8ff" stroke-width="4"/>
<g font-family="Georgia, serif" font-size="42" font-weight="700" fill="#f7eefc">
<text x="180" y="150">Q</text>
<text x="250" y="110">U</text>
<text x="330" y="170">I</text>
<text x="390" y="120">L</text>
<text x="460" y="160">L</text>
</g>
<rect x="160" y="278" width="320" height="16" rx="3" fill="#e7c8ff" opacity=".35"/>
<text x="200" y="292" fill="#1a1020" font-family="Georgia, serif" font-size="14">FOLIO</text>
<rect class="ps-title-pill-glow" x="232" y="347" width="176" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="232" y="347" width="176" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Night Press</text>
</svg>
