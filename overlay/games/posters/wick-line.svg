<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Wick Line">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c1c"/><stop offset="1" stop-color="#1a100c"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<line x1="80" y1="210" x2="560" y2="210" stroke="#6a5038" stroke-width="10" stroke-linecap="round"/>
<rect x="250" y="176" width="120" height="68" rx="10" fill="#f0c27a" fill-opacity=".35" stroke="#f0c27a" stroke-width="3"/>
<path d="M300 190 Q318 150 330 188 Q314 168 300 190" fill="#ffe7a8"/>
<circle cx="316" cy="168" r="28" fill="#ffb15a" opacity=".35" filter="url(#soft)"/>
<rect x="120" y="250" width="36" height="70" rx="6" fill="#f6efe4"/>
<rect x="112" y="246" width="52" height="12" rx="3" fill="#c45a3a"/>
<rect class="ps-title-pill-glow" x="238" y="347" width="164" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="238" y="347" width="164" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Wick Line</text>
</svg>
