<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Loom Shuttle">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2030"/><stop offset="1" stop-color="#1a1018"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<g stroke="#f3c1dc" stroke-opacity=".35">
<line x1="80" y1="100" x2="560" y2="100"/><line x1="80" y1="150" x2="560" y2="150"/>
<line x1="80" y1="200" x2="560" y2="200"/><line x1="80" y1="250" x2="560" y2="250"/>
</g>
<g stroke="#6a3048" stroke-width="8">
<line x1="140" y1="70" x2="140" y2="280"/><line x1="200" y1="70" x2="200" y2="280"/>
<line x1="360" y1="70" x2="360" y2="180"/><line x1="420" y1="160" x2="420" y2="280"/>
</g>
<polygon points="250,168 310,150 310,186" fill="#fff4ea"/>
<rect x="470" y="188" width="70" height="16" rx="4" fill="#f3c1dc"/>
<rect class="ps-title-pill-glow" x="220" y="347" width="200" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="220" y="347" width="200" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Loom Shuttle</text>
</svg>
