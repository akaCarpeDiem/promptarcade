<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Paper Moths">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d7a4"/><stop offset="1" stop-color="#8c5a3c"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<ellipse cx="320" cy="250" rx="210" ry="70" fill="#5a3a28" opacity=".35"/>
<rect x="250" y="150" width="36" height="120" rx="6" fill="#3a2418"/>
<ellipse cx="268" cy="140" rx="54" ry="28" fill="#f6c56b"/>
<ellipse cx="268" cy="140" rx="28" ry="14" fill="#fff1c9"/>
<g fill="#2c241c">
<ellipse cx="180" cy="120" rx="34" ry="14" transform="rotate(-18 180 120)"/>
<ellipse cx="230" cy="108" rx="30" ry="12" transform="rotate(16 230 108)"/>
<ellipse cx="400" cy="96" rx="36" ry="13" transform="rotate(-12 400 96)"/>
<ellipse cx="460" cy="150" rx="28" ry="11" transform="rotate(20 460 150)"/>
</g>
<g fill="#f6efe4">
<ellipse cx="206" cy="116" rx="5" ry="10"/>
<ellipse cx="416" cy="100" rx="5" ry="10"/>
</g>
<rect class="ps-title-pill-glow" x="224" y="347" width="192" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="224" y="347" width="192" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Paper Moths</text>
</svg>
