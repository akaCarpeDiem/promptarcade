<rect x="250" y="160" width="50" height="18" fill="#f0c27a"/>
<path d="M140 180 l18 -28 18 28 z" fill="#e7e4ff"/>
<circle cx="150" cy="120" r="8" fill="#f4f1ff"/>
<polygon points="400,180 430,230 370,230" fill="#7ee7f5"/>
<polygon points="470,200 492,236 448,236" fill="#c4a6ff"/>
<circle cx="180" cy="230" r="10" fill="#f6efe4"/>
