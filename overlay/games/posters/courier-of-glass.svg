<rect class="ps-title-pill" x="204" y="347" width="232" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
