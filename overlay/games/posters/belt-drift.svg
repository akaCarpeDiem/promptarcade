<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Belt Drift">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#070910"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<g fill="#9aa4c4">
<circle cx="80" cy="70" r="1.5"/><circle cx="140" cy="120" r="1.5"/><circle cx="520" cy="60" r="1.5"/><circle cx="580" cy="140" r="1.5"/><circle cx="400" cy="40" r="1.5"/>
</g>
<circle cx="180" cy="180" r="36" fill="#6d6258"/>
<circle cx="430" cy="120" r="22" fill="#8a7b70"/>
<circle cx="500" cy="240" r="48" fill="#5c5148"/>
<polygon points="300,200 340,214 300,228 312,214" fill="#e8f2ff"/>
<path d="M300 214 L270 214" stroke="#ffb15a" stroke-width="4"/>
<rect class="ps-title-pill-glow" x="242" y="347" width="156" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="242" y="347" width="156" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Belt Drift</text>
</svg>
