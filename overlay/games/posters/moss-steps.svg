<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Moss Steps">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16324a"/><stop offset="1" stop-color="#0c1c16"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<ellipse cx="160" cy="250" rx="70" ry="22" fill="#6ea84a"/>
<ellipse cx="310" cy="268" rx="78" ry="24" fill="#8fbf62"/>
<ellipse cx="470" cy="240" rx="64" ry="20" fill="#4e7a38"/>
<circle cx="168" cy="210" r="8" fill="#e8ff9a"/>
<path d="M150 214 Q168 188 190 210" fill="none" stroke="#e8ff9a" stroke-width="3"/>
<path d="M186 214 Q168 196 148 220" fill="none" stroke="#e8ff9a" stroke-width="3"/>
<ellipse cx="320" cy="320" rx="240" ry="18" fill="#8ec8ff" opacity=".2"/>
<rect class="ps-title-pill-glow" x="234" y="347" width="172" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="234" y="347" width="172" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Moss Steps</text>
</svg>
