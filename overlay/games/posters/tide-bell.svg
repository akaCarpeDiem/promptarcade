<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Tide Bell">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16445c"/><stop offset="1" stop-color="#0c2433"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<circle cx="320" cy="190" r="110" fill="none" stroke="#9ad7ff" stroke-opacity=".4" stroke-width="3"/>
<circle cx="320" cy="80" r="16" fill="#f0c27a"/>
<circle cx="430" cy="140" r="12" fill="#1d4e68" stroke="#9ad7ff"/>
<circle cx="430" cy="250" r="12" fill="#1d4e68" stroke="#9ad7ff"/>
<circle cx="320" cy="300" r="12" fill="#1d4e68" stroke="#9ad7ff"/>
<circle cx="210" cy="250" r="12" fill="#1d4e68" stroke="#9ad7ff"/>
<circle cx="210" cy="140" r="12" fill="#1d4e68" stroke="#9ad7ff"/>
<line x1="320" y1="190" x2="320" y2="110" stroke="#b7ecff" stroke-width="5" stroke-linecap="round"/>
<circle cx="320" cy="190" r="8" fill="#e7f6ff"/>
<path d="M80 320 Q200 290 320 320 T560 300" fill="none" stroke="#7ec8e0" stroke-width="3" opacity=".5"/>
<rect class="ps-title-pill-glow" x="246" y="347" width="148" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="246" y="347" width="148" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Tide Bell</text>
</svg>
