<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Soot Lantern">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a241c"/><stop offset="1" stop-color="#100e0c"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<g fill="#3a3028">
<rect x="80" y="60" width="480" height="18"/><rect x="80" y="60" width="18" height="250"/>
<rect x="542" y="60" width="18" height="250"/><rect x="80" y="292" width="480" height="18"/>
<rect x="180" y="78" width="18" height="120"/><rect x="280" y="150" width="18" height="140"/>
<rect x="380" y="78" width="140" height="18"/>
</g>
<circle cx="140" cy="230" r="10" fill="#f6efe4"/>
<circle cx="140" cy="230" r="36" fill="#f0c27a" opacity=".28" filter="url(#soft)"/>
<circle cx="250" cy="120" r="7" fill="#f0c27a"/>
<circle cx="460" cy="200" r="7" fill="#f0c27a"/>
<rect x="500" y="230" width="22" height="50" fill="#9ad7c2"/>
<rect class="ps-title-pill-glow" x="222" y="347" width="196" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="222" y="347" width="196" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Soot Lantern</text>
</svg>
