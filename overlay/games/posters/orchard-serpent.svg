<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Orchard Serpent">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#245c32"/><stop offset="1" stop-color="#102416"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="titleGlow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="titleShadow" x="-30%" y="-80%" width="160%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".36"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ee7f5" flood-opacity=".24"/></filter>
</defs>
<rect width="640" height="400" fill="url(#sky)"/>
<rect x="70" y="70" width="500" height="240" fill="none" stroke="#d7f0c4" stroke-opacity=".4"/>
<circle cx="160" cy="140" r="16" fill="#6ea84a"/>
<circle cx="200" cy="140" r="16" fill="#8fbf62"/>
<circle cx="240" cy="140" r="16" fill="#6ea84a"/>
<circle cx="200" cy="180" r="16" fill="#8fbf62"/>
<circle cx="200" cy="220" r="18" fill="#e8ffc8" stroke="#2c241c"/>
<circle cx="430" cy="160" r="14" fill="#f25a6a"/>
<circle cx="500" cy="230" r="12" fill="#f6e7b2"/>
<rect x="80" y="250" width="28" height="40" fill="#f3c1dc"/>
<rect class="ps-title-pill-glow" x="201" y="347" width="238" height="42" rx="21" fill="none" stroke="#7ee7f5" stroke-opacity=".48" stroke-width="4" filter="url(#titleGlow)"/>
<rect class="ps-title-pill" x="201" y="347" width="238" height="42" rx="21" fill="#fffdf9" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.5" filter="url(#titleShadow)"/>
<text x="320" y="368" text-anchor="middle" dominant-baseline="middle" fill="#242422" font-family="Georgia, serif" font-size="26" font-weight="700">Orchard Serpent</text>
</svg>
